T(`You should be ashamed of yourself.`,[`You ought to be ashamed of yourself.`],``,`OUGHT`),
T(`It doesn't need to be done today.`,[`It {need not|needn't} be done today.`],``,`NEED`)]},
{id:`14.3`,title:`Name the device`,ins:`Name the structure or rhetorical device the sentence uses.`,items:[
M(`We do not live to eat; we eat to live.`,[`Chiasmus`,`Tricolon`,`Cleft sentence`,`Absolute clause`],0,`The words are reversed across two clauses.`),
M(`Never before, and never since, had the city known such silence.`,[`Fronted object`,`Negative inversion`,`Subjunctive`,`Ellipsis`],1,`Negative adverbial + "had the city known".`),
M(`Her task completed, she turned for home.`,[`Dangling participle`,`Absolute clause`,`Relative clause`,`Inverted conditional`],1,`"Her task" is the clause's own subject.`),
M(`What we lack is not money but will.`,[`It-cleft`,`Wh-cleft`,`Fronting`,`Chiasmus`],1,`"What … is" focuses the contrast.`),
M(`Long may it continue.`,[`Formulaic subjunctive`,`Negative inversion`,`Ellipsis`,`Mixed conditional`],0,`An optative "may" expressing a wish.`),
M(`We came, we argued, we prevailed.`,[`Chiasmus`,`Tricolon`,`Absolute clause`,`Wh-cleft`],1,`Three parallel clauses without "and".`),
M(`This much I know: it was no accident.`,[`Fronted object`,`Inverted conditional`,`It-cleft`,`Tricolon`],0,`"This much" is the object, moved to the front.`),
M(`Were it not for fear, how much more might we attempt?`,[`Mandative subjunctive`,`Inverted conditional`,`Locative inversion`,`Absolute clause`],1,`"Were it not for" = if it were not for.`)]}]},

/* ---------- 15 ---------- */
{n:15,title:`Register and style`,rules:[
`Formal register: full forms, precise verbs, impersonal structures: <i>We regret that we are unable to…</i>`,
`Given before new: start with what the reader already knows, end with new information.`,
`End-weight: put long, heavy elements last; use extraposition: <i>It was obvious that…</i>`,
`Verb patterns are fixed: <i>look forward to -ing, insist on -ing, capable of -ing, used to -ing</i>.`,
`Commas mark non-defining clauses and separate list items; semicolons separate list items that contain commas.`],
ex:[
{id:`15.1`,title:`Register shifts`,ins:`Items 1–6: rewrite formally. Items 7–8: rewrite in a natural, neutral style. Then compare with the model.`,items:[
O(`We're gonna look into the problem ASAP.`,`We shall investigate the matter as soon as possible.`),
O(`Loads of people turned up to the meeting.`,`The meeting was very well attended.`),
O(`Sorry, but we can't give you a refund.`,`We regret that we are unable to offer a refund.`),
O(`The results were kind of disappointing.`,`The results were somewhat disappointing.`),
O(`If you've got any questions, just give me a shout.`,`Should you have any questions, please do not hesitate to contact me.`),
O(`They got rid of the old rules.`,`The old regulations were abolished.`),
O(`It is incumbent upon all staff to familiarise themselves with the procedures.`,`All staff need to read and understand the procedures.`),
O(`I should be most grateful were you to pass the salt.`,`Could you pass the salt, please? Extreme formality in a casual setting sounds sarcastic.`)]},
{id:`15.2`,title:`Information structure`,ins:`Choose the better continuation.`,items:[
M(`The museum houses a famous painting…`,[`A Dutch master painted it in 1642.`,`It was painted by a Dutch master in 1642.`],1,`The given "it" comes first and the new information last.`),
M(`Our new manager has made several changes…`,[`A complete reorganisation of the sales team was the most controversial.`,`The most controversial was a complete reorganisation of the sales team.`],1,`The link to "changes" comes first; the long new element goes at the end.`),
M(`Which is more natural?`,[`That the project would fail was obvious to everyone.`,`It was obvious to everyone that the project would fail.`],1,`Extraposition moves the heavy clause to the end.`),
M(`The village was founded in 1350…`,[`A powerful earthquake almost destroyed it in 1858.`,`It was almost destroyed by a powerful earthquake in 1858.`],1,`The passive keeps the village as the topic.`),
M(`Which is more natural?`,[`She gave the man who had helped her carry her suitcases up three flights of stairs a tip.`,`She gave a tip to the man who had helped her carry her suitcases up three flights of stairs.`],1,`End-weight: the long phrase goes last.`),
M(`Many people blame the government for the crisis…`,[`However, a series of poor decisions by the central bank caused it.`,`However, it was caused by a series of poor decisions by the central bank.`],1,`The crisis ("it") stays the topic; the new cause is in focus at the end.`),
M(`Which is more natural?`,[`I find it hard to believe that he resigned.`,`I find that he resigned hard to believe.`],0,`"It" extraposition after "find"; the other version is very awkward.`),
M(`The report makes three recommendations…`,[`Raising the minimum wage is the first.`,`The first is to raise the minimum wage.`],1,`"The first" links back to "three recommendations".`)]},
{id:`15.3`,title:`Collocation and complementation`,ins:`Each sentence has one collocation or verb-pattern error. Edit it.`,items:[
E(`She is interested to learn Japanese.`,[`{She is|She's} interested in learning Japanese.`],`interested in -ing`),
E(`He suggested me to apply for the job.`,[`He suggested (that )I (should )apply for the job.`,`He suggested {my|me} applying for the job.`,`He suggested applying for the job.`],`suggest that sb (should) do / suggest -ing`),
E(`We need to make a research before we decide.`,[`We need to {do|carry out|conduct} (some )research before we decide.`],`"research" is uncountable and takes do / carry out.`),
E(`I look forward to hear from you.`,[`I look forward to hearing from you.`],`"to" is a preposition here.`),
E(`She is capable to do much better.`,[`{She is|She's} capable of doing much better.`],`capable of -ing`),
E(`The film had a strong impression on me.`,[`The film made a strong impression on me.`,`The film had a strong {impact|effect} on me.`],`make an impression on`),
E(`They discussed about the problem for hours.`,[`They discussed the problem for hours.`],`"discuss" takes a direct object.`),
E(`I'm used to work late.`,[`{I'm|I am} used to working late.`],`be used to -ing`),
E(`She insisted to pay for dinner.`,[`She insisted on paying for dinner.`],`insist on -ing`),
E(`The price has raised by 10%.`,[`The price has risen by 10%.`,`The price has gone up by 10%.`],`rise (intransitive) / raise (transitive)`),
E(`He's responsible of the marketing team.`,[`{He's|He is} responsible for the marketing team.`],`responsible for`),
E(`It's no use to complain.`,[`{It's|It is} no use complaining.`],`It's no use -ing`),
E(`We need to make a step forward.`,[`We need to take a step forward.`],`take a step`),
E(`He denied to have taken the money.`,[`He denied {taking|having taken} the money.`],`deny -ing`),
E(`I'm keen of trying new food.`,[`{I'm|I am} keen on trying new food.`],`keen on -ing`)]},
{id:`15.4`,title:`Punctuation as grammar`,ins:`Answer the question or edit the punctuation.`,items:[
M(`"Let's eat Grandma." / "Let's eat, Grandma." In which version is Grandma being invited to eat?`,[`Without the comma`,`With the comma`],1,`Without the comma, Grandma is the meal.`),
M(`"The students, who failed, will resit." Who will resit?`,[`Only the students who failed`,`All the students, since they all failed`],1,`Commas make the clause non-defining: it describes all of them.`),
E(`The conference included speakers from Sofia Bulgaria Lyon France and Porto Portugal.`,[`The conference included speakers from Sofia, Bulgaria; Lyon, France(;) and Porto, Portugal.`],`Semicolons separate list items that contain commas.`,true),
E(`She loves cooking her family and her dog.`,[`She loves cooking, her family(,) and her dog.`],`Without commas, she cooks her family.`,true),
E(`I have one goal to finish the marathon.`,[`I have one goal: to finish the marathon.`,`I have one goal — to finish the marathon.`],`A colon introduces what the goal is.`,true),
M(`"My sister, who lives in Paris, is visiting next week." What do the commas tell you?`,[`I have more than one sister`,`I have only one sister`],1,`A non-defining clause adds information about the only sister.`),
E(`However hard she tried she failed.`,[`However hard she tried, she failed.`],`"However" = no matter how; the comma ends the concessive clause.`,true),
E(`There was only one person who could help him his mother.`,[`There was only one person who could help him — his mother.`,`There was only one person who could help him: his mother.`],`A dash or colon introduces the reveal.`,true),
E(`It was late we went home.`,[`It was late, so we went home.`,`It was late; we went home.`,`It was late. We went home.`,`It was late, and we went home.`],`Two clauses need a conjunction, a semicolon or a full stop; a comma alone is a comma splice.`,true),
O(`A woman without her man is nothing. Punctuate it two ways to give opposite meanings.`,`A woman, without her man, is nothing. / A woman: without her, man is nothing.`)]}]},

/* ---------- 16 ---------- */
{n:16,title:`Mixed C2 review`,rules:[
`This unit mixes every structure from §1–§15, as an exam would.`,
`Key word transformations: use the key word unchanged and 3–8 words in total.`,
`Check tense, word order and the pattern the key word requires before you write.`,
`If you get stuck, open the rules of the unit the structure belongs to.`],
ex:[
{id:`16.1`,title:`Key word transformations`,ins:`Complete the second sentence so that it means the same as the first. Use the key word unchanged and 3–8 words.`,items:[
G(`It __ that I realised how serious the situation was.`,[`was not until I saw the photographs|wasn't until I saw the photographs|was only when I saw the photographs`],`It-cleft with "not until".`,{ctx:`I didn't realise how serious the situation was until I saw the photographs.`,k:`WAS`}),
G(`It __ the country.`,[`is said that she has left|is said that she left|is said that she had left`],`Passive reporting with "it".`,{ctx:`She is said to have left the country.`,k:`THAT`}),
G(`__ thinking, he would have died.`,[`but for the doctor's quick`],`"But for" + noun = if it hadn't been for.`,{ctx:`If it hadn't been for the doctor's quick thinking, he would have died.`,k:`BUT`}),
G(`You __ a gift, but thank you.`,[`needn't have brought|need not have brought`],`You did, but it was unnecessary.`,{ctx:`It wasn't necessary for you to bring a gift, but thank you.`,k:`NEEDN'T`}),
G(`If __ harder at school.`,[`only I had studied|only I'd studied`],`Past regret.`,{ctx:`I regret not studying harder at school.`,k:`ONLY`}),
G(`Try __ lift the box.`,[`as he might he couldn't|as he might he could not|as he might he was unable to`],`Concessive "Try as he might".`,{ctx:`However hard he tried, he couldn't lift the box.`,k:`MIGHT`}),
G(`The fact __ the library caused outrage.`,[`that the council decided to close|that the council had decided to close`],``,{ctx:`The council's decision to close the library caused outrage.`,k:`DECIDED`}),
G(`__ he couldn't speak.`,[`such was his anger that`],`"Such was" inversion.`,{ctx:`He was so angry that he couldn't speak.`,k:`SUCH`}),
G(`The fire __ started deliberately.`,[`is thought to have been`],`Passive reporting with a past passive infinitive.`,{ctx:`They think the fire was started deliberately.`,k:`THOUGHT`}),
G(`It's __ revising.`,[`high time you started|high time that you started|high time you began`],`It's high time + past.`,{ctx:`You really ought to start revising now.`,k:`HIGH`}),
G(`I'd __ this to anyone.`,[`rather you didn't mention|rather you did not mention`],`Would rather + past.`,{ctx:`I'd prefer you not to mention this to anyone.`,k:`RATHER`}),
G(`No __ the trouble started.`,[`sooner had he arrived than`],`No sooner … than.`,{ctx:`He had only just arrived when the trouble started.`,k:`SOONER`}),
G(`__ say all evening.`,[`not a single word did she|not one word did she|not a word did she`],`Negative inversion.`,{ctx:`She didn't say a single word all evening.`,k:`NOT`}),
G(`__ money.`,[`all he cares about is|all that he cares about is`],`All-cleft.`,{ctx:`The only thing he cares about is money.`,k:`ALL`}),
G(`It is essential that a CV __ applicant.`,[`be submitted by every|be submitted by each|should be submitted by every`],`Passive subjunctive.`,{ctx:`Every applicant must submit a CV; this is essential.`,k:`BE`}),
G(`__ you, I can't help.`,[`much as I sympathise with|much as I sympathize with`],`Concessive "Much as".`,{ctx:`Although I sympathise with you, I can't help.`,k:`MUCH`}),
G(`The __, the guests moved to the garden.`,[`meal being over|meal having ended|meal having finished|meal having been eaten|meal having come to an end|meal finished|meal over`],`Absolute clause. "The meal over" is natural but uses only two words.`,{ctx:`When the meal was over, the guests moved to the garden.`,k:`MEAL`}),
G(`__ mind, let me know.`,[`should you change your`],`Inverted conditional.`,{ctx:`If you change your mind, let me know.`,k:`SHOULD`})]},
{id:`16.2`,title:`Literary rewrite`,ins:`Rewrite the paragraph in an elevated literary style, using at least six structures from this drill. Then compare with the model.`,items:[
O(`The storm was over. The old fisherman walked down to the harbour. He had never seen so much damage. Boats were lying on their sides and there were nets everywhere. He didn't know what to do. Although he was old, he started to clear the wreckage. His son only arrived in the evening. The son saw his father working alone, and this made him feel ashamed.`,
`The storm spent, the old fisherman made his way down to the harbour. Never had he seen such devastation: boats lay on their sides, and nets were strewn everywhere. Not knowing what else to do, and old though he was, he set about clearing the wreckage. It was not until evening that his son arrived, and what he saw, his father toiling alone, filled him with shame.`,
`The model uses an absolute clause, negative inversion, a participle clause, concessive fronting, an it-cleft and a wh-clause as subject.`)]},
{id:`16.3`,title:`Error hunt`,ins:`The paragraph contains 12 errors drawn from across the drill. Edit the text, then check.`,items:[
{t:`hunt`,q:`Hardly had I arrived to the conference when I realised I have left my notes at the hotel. Having rushed back, the taxi got stuck in traffic. It was essential that I gave the keynote at ten, and the organisers, which had been very kind, suggested me to start with questions. Not until the coffee break I managed to retrieve the notes. If I would have checked my bag that morning, none of this would happen. Embarrassed though I was, but the talk went well, albeit the audience was smaller than I had hoped. The most people said they enjoyed it.`,
errs:[
{w:`arrived to the conference`,f:`arrived at the conference`},
{w:`realised i have left`,f:`I realised I had left`},
{w:`having rushed back the taxi`,f:`As I rushed back, my taxi got stuck (dangling participle)`},
{w:`essential that i gave`,f:`It was essential that I give (should give)`},
{w:`organisers which`,f:`the organisers, who had been very kind`},
{w:`suggested me to`,f:`suggested (that) I start / suggested starting`},
{w:`break i managed`,f:`Not until the coffee break did I manage`},
{w:`if i would have`,f:`If I had checked (Had I checked)`},
{w:`none of this would happen`,f:`none of this would have happened`},
{w:`i was but the talk`,f:`Embarrassed though I was, the talk went well (no "but")`},
{w:`albeit the audience was`,f:`although the audience was smaller`},
{w:`the most people`,f:`Most people`}],
m:`Hardly had I arrived at the conference when I realised I had left my notes at the hotel. As I rushed back, my taxi got stuck in traffic. It was essential that I give the keynote at ten, and the organisers, who had been very kind, suggested that I start with questions. Not until the coffee break did I manage to retrieve the notes. If I had checked my bag that morning, none of this would have happened. Embarrassed though I was, the talk went well, although the audience was smaller than I had hoped. Most people said they enjoyed it.`}]}]}
];

/* ============ ENGINE ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- normalisation ---- */
const ZERO=new Set(['ø','-','0','zero','none','nothing','x','—','–','/','no article']);
function base(s){return String(s).normalize('NFC').replace(/[’‘`´]/g,"'").replace(/[“”«»„]/g,'"').toLowerCase().replace(/\s+/g,' ').trim();}
function spelling(s){return s.replace(/\b(\w+?)iz(e|ed|es|ing|ation|ations)\b/g,'$1is$2').replace(/\bcolor/g,'colour').replace(/\baging\b/g,'ageing');}
function loose(s){let t=spelling(base(s));t=t.replace(/[.,;:!?"()\[\]…—–\-\/]/g,' ');return t.replace(/\s+/g,' ').trim();}
function strict(s){let t=spelling(base(s));t=t.replace(/"/g,'');t=t.replace(/\s*[—–]\s*/g,' — ').replace(/\s+-\s+/g,' — ');t=t.replace(/\s+([,;:.!?])/g,'$1');t=t.replace(/[.!?]+$/,'');return t.replace(/\s+/g,' ').trim();}
function gapNorm(v,zero){const b=base(v);if(ZERO.has(b)||(zero&&b===''))return 'ø';return loose(v);}

/* ---- answer patterns: {a|b} alternatives, (x) optional, nesting allowed ---- */
function splitTop(s){const parts=[];let d=0,cur='';for(const ch of s){if(ch==='{'||ch==='(')d++;else if(ch==='}'||ch===')')d--;if(ch==='|'&&d===0){parts.push(cur);cur='';}else cur+=ch;}parts.push(cur);return parts;}
function closeAt(s,i){let d=0;for(let j=i;j<s.length;j++){const ch=s[j];if(ch==='{'||ch==='(')d++;else if(ch==='}'||ch===')'){d--;if(d===0)return j;}}return s.length-1;}
function expand(s){let out=[''];let i=0;while(i<s.length){const c=s[i];if(c==='{'||c==='('){const j=closeAt(s,i);const opts=splitTop(s.slice(i+1,j)).flatMap(expand);if(c==='(')opts.push('');out=out.flatMap(r=>opts.map(o=>r+o));i=j+1;if(out.length>5000)out.length=5000;}else{out=out.map(r=>r+c);i++;}}return out;}
function canonRaw(s){let out='',i=0;while(i<s.length){const c=s[i];if(c==='{'||c==='('){const j=closeAt(s,i);out+=canonRaw(splitTop(s.slice(i+1,j))[0]);i=j+1;}else{out+=c;i++;}}return out;}
function canon(s){return canonRaw(s).replace(/\s+/g,' ').replace(/\s+([,;.!?])/g,'$1').trim();}
const accCache=new Map();
function accepted(it){if(!accCache.has(it)){const f=it.strict?strict:loose;accCache.set(it,new Set(it.a.flatMap(expand).map(f)));}return accCache.get(it);}

/* ---- storage (per viewer, optional) ---- */
const KEY='c2drill:';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}}};

/* ---- index ---- */
const INDEX={},ORDER=[],EXS={};
UNITS.forEach(u=>u.ex.forEach(ex=>{EXS[ex.id]={ex,u};ex.items.forEach((it,i)=>{const id=ex.id+'.'+(i+1);INDEX[id]={id,it,ex,u,i};ORDER.push(id);});}));
const ALL_EX=Object.keys(EXS);

let sel=new Set(store.get('sel',ALL_EX).filter(x=>EXS[x]));
let order=store.get('order','order')==='shuffle'?'shuffle':'order';
let view=store.get('view','single')==='sheet'?'sheet':'single';
let mistakes=store.get('mistakes',{});if(!mistakes||typeof mistakes!=='object')mistakes={};
const expanded=new Set();
let booted=false;
let queue=[],pos=0,mode='normal',sess,results=[],cur=null;

function newSession(){sess={done:0,correct:0,streak:0,best:0};results=[];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function selItemCount(){return ORDER.filter(id=>sel.has(INDEX[id].ex.id)).length;}

/* ---- rail ---- */
function renderRail(){
  const list=$('#unitList');
  list.innerHTML=UNITS.map(u=>{
    const ids=u.ex.map(e=>e.id);const on=ids.filter(id=>sel.has(id)).length;
    const cnt=u.ex.reduce((s,e)=>s+e.items.length,0);const open=expanded.has(u.n);
    return `<div class="unit"><div class="unit-head"><input type="checkbox" id="u${u.n}" data-unit="${u.n}" ${on===ids.length?'checked':''}><label for="u${u.n}"><span class="sec">§${u.n}</span><span class="uname">${esc(u.title)}</span></label><span class="ucount">${cnt}</span><button type="button" class="exp" data-exp="${u.n}" aria-expanded="${open}" aria-label="${open?'Hide':'Show'} exercises in unit ${u.n}">${open?'−':'+'}</button></div>
    <div class="exlist" ${open?'':'hidden'}>${u.ex.map(e=>`<label class="exrow"><input type="checkbox" id="x${e.id.replace('.','-')}" data-ex="${e.id}" ${sel.has(e.id)?'checked':''}><span class="exid">${e.id}</span><span class="extitle">${esc(e.title)}</span><span class="ucount">${e.items.length}</span></label>`).join('')}</div></div>`;
  }).join('');
  UNITS.forEach(u=>{const ids=u.ex.map(e=>e.id);const on=ids.filter(id=>sel.has(id)).length;const cb=$('#u'+u.n);cb.indeterminate=on>0&&on<ids.length;});
  const n=selItemCount();
  $('#selCount').textContent=`${n} items`;
  const nEx=ALL_EX.filter(x=>sel.has(x)).length;
  $('#startBtn').textContent=n?(view==='sheet'?`Start drill · ${nEx} exercise${nEx===1?'':'s'}`:`Start drill · ${n} items`):'Select exercises to start';
  $('#startBtn').disabled=!n;
  $('#ordIn').checked=order==='order';$('#ordSh').checked=order==='shuffle';
  $('#viewOne').checked=view==='single';$('#viewAll').checked=view==='sheet';
}
function saveSel(){store.set('sel',[...sel]);}

$('#unitList').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.unit){const u=UNITS.find(x=>x.n==t.dataset.unit);u.ex.forEach(ex=>t.checked?sel.add(ex.id):sel.delete(ex.id));}
  else if(t.dataset.ex){t.checked?sel.add(t.dataset.ex):sel.delete(t.dataset.ex);}
  saveSel();renderRail();
  const again=$('#'+t.id);if(again)again.focus();
});
$('#unitList').addEventListener('click',e=>{const b=e.target.closest('[data-exp]');if(!b)return;const n=+b.dataset.exp;expanded.has(n)?expanded.delete(n):expanded.add(n);renderRail();const nb=$(`[data-exp="${n}"]`);if(nb)nb.focus();});
$('#selAll').onclick=()=>{ALL_EX.forEach(x=>sel.add(x));saveSel();renderRail();};
$('#selNone').onclick=()=>{sel.clear();saveSel();renderRail();};
$$('input[name=order]').forEach(r=>r.addEventListener('change',()=>{order=r.value;store.set('order',order);}));
$$('input[name=view]').forEach(r=>r.addEventListener('change',()=>{view=r.value;store.set('view',view);renderRail();start(mode==='mistakes'?'mistakes':'normal');}));
$('#startBtn').onclick=()=>{start('normal');if(matchMedia('(max-width:880px)').matches){$('#rail').open=false;$('#sheet').scrollIntoView({behavior:'smooth',block:'start'});}};

/* ---- session ---- */
function start(m){
  mode=m||'normal';let ids;
  if(mode==='mistakes')ids=ORDER.filter(id=>mistakes[id]);
  else if(mode==='retry')ids=results.filter(r=>!r.ok).map(r=>r.id);
  else ids=ORDER.filter(id=>sel.has(INDEX[id].ex.id));
  ids=[...new Set(ids)];
  if(order==='shuffle')shuffle(ids);
  if(view==='sheet'){const groups=[],map=new Map();ids.forEach(id=>{const x=INDEX[id].ex.id;if(!map.has(x)){const g={ex:x,ids:[]};map.set(x,g);groups.push(g);}map.get(x).ids.push(id);});ids=groups;}
  queue=ids;pos=0;newSession();renderStats();renderItem();renderLog();
}
function renderStats(){
  $('#stCorrect').textContent=sess.correct;$('#stDone').textContent=sess.done;
  $('#stAcc').textContent=sess.done?Math.round(sess.correct/sess.done*100)+'%':'–';
  $('#stStreak').textContent=sess.streak;
}
function record(ok,ans){cur.prevStreak=sess.streak;recordId(cur.id,ok,ans);}
function recordId(id,ok,ans){
  sess.done++;
  if(ok){sess.correct++;sess.streak++;sess.best=Math.max(sess.best,sess.streak);delete mistakes[id];}
  else{sess.streak=0;mistakes[id]={a:String(ans||'').slice(0,300),t:Date.now()};}
  store.set('mistakes',mistakes);results.push({id,ok});renderStats();renderLog();
}
function stetId(id){
  const r=[...results].reverse().find(x=>x.id===id&&!x.ok);if(!r)return;
  r.ok=true;sess.correct++;
  let s=0;for(let i=results.length-1;i>=0&&results[i].ok;i--)s++;
  sess.streak=s;sess.best=Math.max(sess.best,s);
  delete mistakes[id];store.set('mistakes',mistakes);renderStats();renderLog();
}

/* ---- rules ---- */
function renderRules(u){
  $('#rules summary').innerHTML=`<span class="sec">§${u.n}</span>Rules · ${esc(u.title)}`;
  $('#rules ul').innerHTML=u.rules.map(r=>`<li>${r}</li>`).join('');
}

/* ---- item rendering ---- */
function renderItem(){
  const sheet=$('#sheet');
  if(!queue.length){
    sheet.innerHTML=`<p class="eyebrow">${mode==='normal'?'Nothing selected':'Nothing to retry'}</p><p class="empty">${mode==='normal'?'Choose units or exercises under Units and settings, then press Start drill.':'There are no missed items in this set.'}</p><div class="actions" style="padding-left:0"><button class="btn primary" id="emptyAll" type="button">Drill all 16 units</button></div>`;
    $('#emptyAll').onclick=()=>{ALL_EX.forEach(x=>sel.add(x));saveSel();renderRail();start('normal');};
    return;
  }
  if(pos>=queue.length){renderSummary();return;}
  if(view==='sheet'){renderSheet();return;}
  const e=INDEX[queue[pos]];const it=e.it;
  cur={id:e.id,e,checked:false};
  renderRules(e.u);
  sheet.innerHTML=`<div class="sheet-head"><span><b>§${e.u.n}</b> ${esc(e.u.title)} · Exercise ${e.ex.id}</span><span>${mode==='mistakes'?'Mistake review · ':mode==='retry'?'Retry · ':''}${pos+1} / ${queue.length}</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${(pos/queue.length*100).toFixed(1)}%"></i></div>
  <h2 class="ex-title">${esc(e.ex.title)}</h2><p class="ins">${esc(e.ex.ins)}</p>
  <div class="item"><div class="margin"><span>${e.i+1}</span><span class="mark" id="mark" aria-hidden="true"></span></div><div class="body" id="body"></div></div>
  <p class="hint" id="hint" hidden></p>
  <div class="actions" id="actions"></div>
  <div class="fb" id="fb" hidden aria-live="polite"></div>`;
  const body=$('#body'),acts=$('#actions');
  const B=(id,label,cls='')=>`<button type="button" class="btn ${cls}" id="${id}">${label}</button>`;
  if(it.t==='gap'){
    let h='';
    if(it.ctx)h+=`<p class="ctx">${esc(it.ctx)}</p>`;
    if(it.k)h+=`<p class="keyrow"><span class="key">${esc(it.k)}</span></p>`;
    const w=Math.min(30,Math.max(6,...it.a.flatMap(a=>a.split('|')).map(x=>x.length))+1);
    const parts=it.q.split('__');
    h+=`<p class="prompt">`+parts.map((p,i)=>esc(p)+(i<parts.length-1?`<input class="gap" id="gap${i}" data-i="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:calc(${w}ch + 10px)" aria-label="Gap ${i+1}">`:'')).join('')+`</p>`;
    body.innerHTML=h;
    acts.innerHTML=B('checkBtn','Check ↵','primary')+(e.ex.zero?B('zeroBtn','Insert Ø'):'')+B('hintBtn','Hint')+B('showBtn','Show answer','ghost')+B('skipBtn','Skip','ghost');
    const gaps=$$('.gap');
    gaps.forEach((g,i)=>g.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();const next=gaps.slice(i+1).find(x=>!x.value.trim());if(next&&!e.ex.zero)next.focus();else if(i<gaps.length-1&&e.ex.zero)gaps[i+1].focus();else checkGap(false);}}));
    let lastGap=gaps[0];gaps.forEach(g=>g.addEventListener('focus',()=>{lastGap=g;}));
    if(e.ex.zero)$('#zeroBtn').onclick=()=>{lastGap.value='Ø';const i=gaps.indexOf(lastGap);(gaps[i+1]||lastGap).focus();};
    $('#checkBtn').onclick=()=>checkGap(false);$('#showBtn').onclick=()=>checkGap(true);
    if(booted)gaps[0].focus({preventScroll:true});
  }else if(it.t==='mc'){
    const q=esc(it.q).split('__').join('<span class="blank" aria-label="gap"></span>');
    body.innerHTML=`<p class="prompt src">${q}</p><div class="opts">${it.o.map((x,i)=>`<button type="button" class="opt" data-o="${i}"><span class="ol">${'abcd'[i]}</span><span>${esc(x)}</span></button>`).join('')}</div>`;
    acts.innerHTML=B('hintBtn','Hint')+B('skipBtn','Skip','ghost');
    $$('.opt').forEach(b=>b.onclick=()=>checkMc(+b.dataset.o));
  }else if(it.t==='tr'||it.t==='err'){
    let h=it.t==='tr'?`<p class="prompt src">${esc(it.q)}</p>`:'';
    if(it.k)h+=`<p class="keyrow"><span class="key">${esc(it.k)}</span></p>`;
    h+=`<textarea class="ans" id="ans" rows="2" autocomplete="off" autocapitalize="sentences" spellcheck="false" aria-label="${it.t==='err'?'Edit the sentence':'Your sentence'}" placeholder="${it.t==='err'?'':'Type your sentence'}"></textarea>`;
    body.innerHTML=h;
    const ta=$('#ans');if(it.t==='err')ta.value=it.q;
    acts.innerHTML=B('checkBtn','Check ↵','primary')+B('hintBtn','Hint')+(it.t==='err'?B('resetBtn','Reset'):'')+B('showBtn','Show answer','ghost')+B('skipBtn','Skip','ghost');
    ta.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();checkText(false);}});
    if(it.t==='err')$('#resetBtn').onclick=()=>{ta.value=it.q;ta.focus();};
    $('#checkBtn').onclick=()=>checkText(false);$('#showBtn').onclick=()=>checkText(true);
    if(booted)ta.focus({preventScroll:true});
  }else if(it.t==='open'){
    body.innerHTML=`<p class="prompt src">${esc(it.q)}</p><textarea class="ans" id="ans" rows="3" aria-label="Your answer" placeholder="Your answer (optional). Ctrl+Enter reveals the model."></textarea>`;
    acts.innerHTML=B('revealBtn','Reveal model answer','primary')+B('skipBtn','Skip','ghost');
    $('#ans').addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();revealOpen();}});
    $('#revealBtn').onclick=revealOpen;
  }else if(it.t==='hunt'){
    body.innerHTML=`<textarea class="ans tall" id="ans" spellcheck="false" aria-label="Paragraph to correct"></textarea>`;
    $('#ans').value=it.q;
    acts.innerHTML=B('checkBtn','Check','primary')+B('hintBtn','Hint')+B('resetBtn','Reset')+B('showBtn','Show answer','ghost')+B('skipBtn','Skip','ghost');
    $('#resetBtn').onclick=()=>{$('#ans').value=it.q;};
    $('#checkBtn').onclick=()=>checkHunt(false);$('#showBtn').onclick=()=>checkHunt(true);
    $('#ans').addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();checkHunt(false);}});
  }
  const hb=$('#hintBtn');if(hb)hb.onclick=hint;
  $('#skipBtn').onclick=next;
}

/* ---- hints ---- */
function hint(){
  const it=cur.e.it,h=$('#hint');cur.hinted=true;
  if(it.t==='gap'){h.textContent='Starts with: '+it.a.map(a=>{const f=a.split('|')[0];return f==='Ø'?'Ø':f.slice(0,1)+'…';}).join('  ·  ');h.hidden=false;}
  else if(it.t==='tr'||it.t==='err'){const words=canon(it.a[0]).split(' ');h.textContent='Begins: '+words.slice(0,Math.min(3,Math.max(1,words.length-2))).join(' ')+' …';h.hidden=false;}
  else if(it.t==='mc'){
    const wrong=$$('.opt').filter(b=>+b.dataset.o!==it.a&&!b.disabled);
    if(it.o.length>2&&wrong.length>1){const b=wrong[Math.floor(Math.random()*wrong.length)];b.disabled=true;b.classList.add('out');h.textContent='One wrong option removed.';}
    else{const r=$('#rules');r.open=true;r.classList.add('flash');setTimeout(()=>r.classList.remove('flash'),1600);h.textContent='Check the rules below this sheet.';}
    h.hidden=false;
  }else if(it.t==='hunt'){h.textContent='Look for: a preposition, a tense, a dangling participle, the subjunctive, a relative pronoun, a verb pattern, an inversion, two conditional forms, a doubled linker, "albeit" and an article.';h.hidden=false;}
}

/* ---- feedback ---- */
function feedback(ok,inner,opts={}){
  const fb=$('#fb');fb.hidden=false;
  const note=cur.e.it.n;
  fb.innerHTML=`<p class="verdict ${ok?'ok':'bad'}" id="verdict">${opts.label||(ok?'Correct':'Not quite')}</p>${inner||''}${note?`<p class="note">${esc(note)}</p>`:''}`;
  const mk=$('#mark');mk.textContent=ok?'✓':'✗';mk.className='mark '+(ok?'ok':'bad');
  $('#hint').hidden=true;
  const acts=$('#actions');
  acts.innerHTML=`<button type="button" class="btn primary" id="nextBtn">${pos+1<queue.length?'Next item ↵':'See results ↵'}</button>`+(opts.stet&&!ok?`<button type="button" class="btn" id="stetBtn" title="Stet is the proofreader's mark for 'let it stand'.">Stet · count mine as right</button>`:'');
  $('#nextBtn').onclick=next;
  const st=$('#stetBtn');if(st)st.onclick=stet;
  $('#nextBtn').focus({preventScroll:true});
}
function stet(){
  if(!cur||cur.ok)return;cur.ok=true;
  sess.correct++;sess.streak=(cur.prevStreak||0)+1;sess.best=Math.max(sess.best,sess.streak);
  delete mistakes[cur.id];store.set('mistakes',mistakes);
  const r=results[results.length-1];if(r&&r.id===cur.id)r.ok=true;
  renderStats();renderLog();
  const v=$('#verdict');v.className='verdict ok';v.textContent='Stet · counted as correct';
  const mk=$('#mark');mk.textContent='✓';mk.className='mark ok';
  const sb=$('#stetBtn');if(sb)sb.remove();$('#nextBtn').focus();
}
function next(){pos++;renderItem();}

/* ---- checkers ---- */
function checkGap(reveal){
  if(cur.checked)return;
  const it=cur.e.it,zero=!!cur.e.ex.zero,gaps=$$('.gap');
  const vals=gaps.map(g=>g.value);
  if(!reveal&&!zero&&vals.every(v=>!v.trim())){$('#hint').hidden=false;$('#hint').textContent='Fill in the gap first, or press Show answer.';gaps[0].focus();return;}
  const per=it.a.map((alts,i)=>!reveal&&alts.split('|').map(a=>gapNorm(a,false)).includes(gapNorm(vals[i]||'',zero)));
  const ok=!reveal&&per.every(Boolean);
  gaps.forEach((g,i)=>{
    const span=document.createElement('span');const right=it.a[i].split('|')[0];
    const typed=vals[i].trim();
    if(per[i]){span.className='g ok';span.textContent=typed||'Ø';}
    else{span.className='g bad';span.innerHTML=(reveal?'':`<s>${esc(typed||(zero?'blank':'—'))}</s>`)+`<ins>${esc(right)}</ins>`;}
    g.replaceWith(span);
  });
  cur.checked=true;cur.ok=ok;
  const ans=reveal?'(answer shown)':vals.map(v=>v.trim()||(zero?'Ø':'—')).join(' · ');
  record(ok,ans);
  const alts=it.a.map((a,i)=>{const p=a.split('|');return p.length>1?`${it.a.length>1?`gap ${i+1}: `:''}${p.map(esc).join(' / ')}`:null;}).filter(Boolean);
  feedback(ok,alts.length?`<p class="also"><span class="lbl">Accepted</span>${alts.join('; ')}</p>`:'',{stet:!reveal,label:reveal?'Answer shown':null});
}
function checkMc(i){
  if(cur.checked)return;
  const it=cur.e.it,ok=i===it.a;
  $$('.opt').forEach(b=>{b.disabled=true;const o=+b.dataset.o;if(o===it.a)b.classList.add('right');else if(o===i)b.classList.add('wrong');});
  cur.checked=true;cur.ok=ok;record(ok,it.o[i]);
  feedback(ok,ok?'':`<p><span class="lbl">Answer</span><span class="answer">${esc(it.o[it.a])}</span></p>`);
}
function checkText(reveal){
  if(cur.checked)return;
  const it=cur.e.it,ta=$('#ans'),val=ta.value.trim();
  if(!reveal&&!val){$('#hint').hidden=false;$('#hint').textContent='Type an answer first, or press Show answer.';ta.focus();return;}
  const f=it.strict?strict:loose;
  const unchanged=it.t==='err'&&f(val)===f(it.q);
  const ok=!reveal&&accepted(it).has(f(val));
  ta.readOnly=true;cur.checked=true;cur.ok=ok;
  record(ok,reveal?'(answer shown)':val);
  const others=it.a.slice(1).map(canon).filter((x,i,arr)=>arr.indexOf(x)===i).slice(0,3);
  let h='';
  if(!ok&&!reveal)h+=`<p class="yours"><span class="lbl">Yours</span><s>${esc(val)}</s>${unchanged?' <span class="also">(unchanged)</span>':''}</p>`;
  h+=`<p><span class="lbl">${ok?'Model answer':'Correct version'}</span><span class="answer">${esc(canon(it.a[0]))}</span></p>`;
  if(others.length)h+=`<p class="also"><span class="lbl">Also accepted</span>${others.map(esc).join(' · ')}</p>`;
  feedback(ok,h,{stet:!reveal&&!unchanged,label:reveal?'Answer shown':null});
}
function revealOpen(){
  if(cur.checked)return;
  const it=cur.e.it;cur.checked=true;$('#ans').readOnly=true;
  const fb=$('#fb');fb.hidden=false;
  fb.innerHTML=`<p class="verdict" style="color:var(--accent)">Model answer</p><p class="answer">${esc(it.m)}</p>${it.n?`<p class="note">${esc(it.n)}</p>`:''}<p class="also">Compare with yours and mark yourself.</p>`;
  $('#actions').innerHTML=`<button type="button" class="btn primary" id="gotBtn">I had it</button><button type="button" class="btn" id="notBtn">Not yet</button>`;
  const self=ok=>{cur.ok=ok;record(ok,$('#ans').value.trim()||'(no answer)');const mk=$('#mark');mk.textContent=ok?'✓':'✗';mk.className='mark '+(ok?'ok':'bad');
    $('#actions').innerHTML=`<button type="button" class="btn primary" id="nextBtn">${pos+1<queue.length?'Next item ↵':'See results ↵'}</button>`;$('#nextBtn').onclick=next;$('#nextBtn').focus({preventScroll:true});};
  $('#gotBtn').onclick=()=>self(true);$('#notBtn').onclick=()=>self(false);$('#gotBtn').focus({preventScroll:true});
}
function checkHunt(reveal){
  if(cur.checked)return;
  const it=cur.e.it,ta=$('#ans'),val=ta.value;
  const lv=loose(val),lq=loose(it.q);
  if(!reveal&&lv.length<lq.length*0.7){$('#hint').hidden=false;$('#hint').textContent='Keep the whole paragraph and edit only the errors.';return;}
  if(!reveal&&lv===lq){$('#hint').hidden=false;$('#hint').textContent='The paragraph is unchanged. Correct the errors first, or press Show answer.';return;}
  const found=it.errs.map(er=>!reveal&&!lv.includes(loose(er.w)));
  const n=found.filter(Boolean).length,ok=n===it.errs.length;
  ta.readOnly=true;cur.checked=true;cur.ok=ok;
  record(ok,reveal?'(answer shown)':`${n}/${it.errs.length} fixed`);
  const list=`<ol class="hunt-list">${it.errs.map((er,i)=>`<li class="${found[i]?'found':'missed'}">${found[i]?'Fixed':'Missed'}: <span>${esc(er.f)}</span></li>`).join('')}</ol>`;
  feedback(ok,`${reveal?'':`<p><span class="lbl">Score</span>You fixed ${n} of ${it.errs.length}.</p>`}${list}<p><span class="lbl">Corrected paragraph</span><span class="answer">${esc(it.m)}</span></p>`,{label:reveal?'Answer shown':(ok?'All 12 fixed':`${n} of ${it.errs.length} fixed`)});
}


/* ---- whole-exercise sheet ---- */
function wsBody(e){
  const it=e.it,uid=e.id.replace(/\./g,'-');let h='';
  const key=it.k?`<p class="keyrow"><span class="key">${esc(it.k)}</span></p>`:'';
  if(it.t==='gap'){
    if(it.ctx)h+=`<p class="ctx">${esc(it.ctx)}</p>`;
    h+=key;
    const w=Math.min(30,Math.max(6,...it.a.flatMap(a=>a.split('|')).map(x=>x.length))+1);
    const parts=it.q.split('__');
    h+=`<p class="prompt">`+parts.map((p,i)=>esc(p)+(i<parts.length-1?`<input class="gap" id="g${uid}-${i}" data-i="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:calc(${w}ch + 10px)" aria-label="Item ${e.i+1}, gap ${i+1}">`:'')).join('')+`</p>`;
  }else if(it.t==='mc'){
    const q=esc(it.q).split('__').join('<span class="blank" aria-label="gap"></span>');
    h+=`<p class="prompt src">${q}</p><div class="opts">${it.o.map((x,i)=>`<button type="button" class="opt" data-o="${i}" aria-pressed="false"><span class="ol">${'abcd'[i]}</span><span>${esc(x)}</span></button>`).join('')}</div>`;
  }else if(it.t==='tr'){
    h+=`<p class="prompt src">${esc(it.q)}</p>${key}<textarea class="ans" id="a${uid}" rows="2" autocomplete="off" spellcheck="false" aria-label="Item ${e.i+1}: your sentence" placeholder="Type your sentence"></textarea>`;
  }else if(it.t==='err'){
    h+=`${key}<textarea class="ans" id="a${uid}" rows="2" autocomplete="off" spellcheck="false" aria-label="Item ${e.i+1}: edit the sentence">${esc(it.q)}</textarea>`;
  }else if(it.t==='open'){
    h+=`<p class="prompt src">${esc(it.q)}</p><textarea class="ans" id="a${uid}" rows="3" aria-label="Item ${e.i+1}: your answer" placeholder="Your answer (optional)"></textarea>`;
  }else if(it.t==='hunt'){
    h+=`<textarea class="ans tall" id="a${uid}" spellcheck="false" aria-label="Paragraph to correct">${esc(it.q)}</textarea>`;
  }
  return h;
}
function renderSheet(){
  const g=queue[pos],{ex,u}=EXS[g.ex];renderRules(u);
  cur={group:g,checked:false};
  const sheet=$('#sheet');
  sheet.innerHTML=`<div class="sheet-head"><span><b>§${u.n}</b> ${esc(u.title)} · Exercise ${ex.id}</span><span>${mode==='mistakes'?'Mistake review · ':mode==='retry'?'Retry · ':''}Exercise ${pos+1} / ${queue.length}</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${(pos/queue.length*100).toFixed(1)}%"></i></div>
  <h2 class="ex-title">${esc(ex.title)}</h2><p class="ins">${esc(ex.ins)}${g.ids.length<ex.items.length?` <span class="also">(${g.ids.length} of ${ex.items.length} items)</span>`:''}</p>
  <div class="ws-list">${g.ids.map(id=>{const e=INDEX[id];return `<div class="item ws" data-id="${id}"><div class="margin"><span>${e.i+1}</span><span class="mark" aria-hidden="true"></span></div><div class="body"><div class="ib">${wsBody(e)}</div><div class="ifb fb" hidden aria-live="polite"></div></div></div>`;}).join('')}</div>
  <div class="actions sticky" id="actions"><button type="button" class="btn primary" id="checkAllBtn">Check all</button>${ex.zero?'<button type="button" class="btn" id="zeroBtn">Insert Ø</button>':''}<button type="button" class="btn ghost" id="showAllBtn">Show all answers</button><button type="button" class="btn ghost" id="skipBtn">Skip exercise</button><span class="ws-score" id="wsScore">${g.ids.length} item${g.ids.length===1?'':'s'}</span></div>`;
  const fields=$$('#sheet .gap, #sheet textarea.ans');
  let last=null;fields.forEach(f=>f.addEventListener('focus',()=>{last=f;}));
  fields.forEach((f,i)=>f.addEventListener('keydown',ev=>{
    if(ev.key!=='Enter')return;
    if(ev.ctrlKey||ev.metaKey){ev.preventDefault();if(!cur.checked)checkAll(false);return;}
    const t=INDEX[f.closest('.item').dataset.id].it.t;
    if(ev.shiftKey||(f.tagName==='TEXTAREA'&&(t==='open'||t==='hunt')))return;
    ev.preventDefault();const nx=fields[i+1];if(nx)nx.focus();else{const b=$('#checkAllBtn')||$('#nextBtn');if(b)b.focus();}
  }));
  $$('#sheet .opt').forEach(b=>b.onclick=()=>{const blk=b.closest('.item');if(blk.dataset.done)return;blk.querySelectorAll('.opt').forEach(o=>{o.classList.toggle('chosen',o===b);o.setAttribute('aria-pressed',String(o===b));});});
  if(ex.zero)$('#zeroBtn').onclick=()=>{const t=(last&&last.classList.contains('gap')&&last.isConnected)?last:$('#sheet .gap');if(!t)return;t.value='Ø';const i=fields.indexOf(t);(fields[i+1]||t).focus();};
  $('#checkAllBtn').onclick=()=>checkAll(false);$('#showAllBtn').onclick=()=>checkAll(true);$('#skipBtn').onclick=next;
  if(booted&&fields[0])fields[0].focus({preventScroll:true});
}
function wsEval(b,reveal){
  const id=b.dataset.id,e=INDEX[id],it=e.it,zero=!!e.ex.zero;
  if(it.t==='gap'){
    const gaps=[...b.querySelectorAll('.gap')],vals=gaps.map(g=>g.value);
    const per=it.a.map((alts,i)=>!reveal&&alts.split('|').map(a=>gapNorm(a,false)).includes(gapNorm(vals[i]||'',zero)));
    const ok=!reveal&&per.every(Boolean);
    gaps.forEach((g,i)=>{const span=document.createElement('span');const right=it.a[i].split('|')[0];const typed=vals[i].trim();
      if(per[i]){span.className='g ok';span.textContent=typed||'Ø';}
      else{span.className='g bad';span.innerHTML=(reveal?'':`<s>${esc(typed||(zero?'blank':'—'))}</s>`)+`<ins>${esc(right)}</ins>`;}
      g.replaceWith(span);});
    const alts=it.a.map((a,i)=>{const p=a.split('|');return p.length>1?`${it.a.length>1?`gap ${i+1}: `:''}${p.map(esc).join(' / ')}`:null;}).filter(Boolean);
    return {ok,ans:vals.map(v=>v.trim()||(zero?'Ø':'—')).join(' · '),html:alts.length?`<p class="also"><span class="lbl">Accepted</span>${alts.join('; ')}</p>`:'',stet:!reveal&&vals.some(v=>v.trim())};
  }
  if(it.t==='mc'){
    const ch=b.querySelector('.opt.chosen'),i=ch?+ch.dataset.o:-1,ok=!reveal&&i===it.a;
    b.querySelectorAll('.opt').forEach(o=>{o.disabled=true;const k=+o.dataset.o;if(k===it.a)o.classList.add('right');else if(k===i)o.classList.add('wrong');o.classList.remove('chosen');});
    return {ok,ans:i>=0?it.o[i]:'(no answer)',html:ok?'':`${i<0&&!reveal?'<p class="also">No option chosen.</p>':''}<p><span class="lbl">Answer</span><span class="answer">${esc(it.o[it.a])}</span></p>`,stet:false};
  }
  if(it.t==='tr'||it.t==='err'){
    const ta=b.querySelector('textarea'),val=ta.value.trim(),f=it.strict?strict:loose;
    const unchanged=it.t==='err'&&f(val)===f(it.q);
    const ok=!reveal&&!!val&&accepted(it).has(f(val));ta.readOnly=true;
    const others=it.a.slice(1).map(canon).filter((x,k,arr)=>arr.indexOf(x)===k).slice(0,3);
    let h='';
    if(!ok&&!reveal)h+=val?`<p class="yours"><span class="lbl">Yours</span><s>${esc(val)}</s>${unchanged?' <span class="also">(unchanged)</span>':''}</p>`:'<p class="also">No answer given.</p>';
    h+=`<p><span class="lbl">${ok?'Model answer':'Correct version'}</span><span class="answer">${esc(canon(it.a[0]))}</span></p>`;
    if(others.length)h+=`<p class="also"><span class="lbl">Also accepted</span>${others.map(esc).join(' · ')}</p>`;
    return {ok,ans:val||'(no answer)',html:h,stet:!reveal&&!!val&&!unchanged};
  }
  if(it.t==='hunt'){
    const ta=b.querySelector('textarea'),lv=loose(ta.value),lq=loose(it.q),short=lv.length<lq.length*0.7;
    const found=it.errs.map(er=>!reveal&&!short&&!lv.includes(loose(er.w)));
    const n=found.filter(Boolean).length,ok=n===it.errs.length;ta.readOnly=true;
    const list=`<ol class="hunt-list">${it.errs.map((er,k)=>`<li class="${found[k]?'found':'missed'}">${found[k]?'Fixed':'Missed'}: <span>${esc(er.f)}</span></li>`).join('')}</ol>`;
    return {ok,ans:`${n}/${it.errs.length} fixed`,html:`${reveal?'':`<p><span class="lbl">Score</span>You fixed ${n} of ${it.errs.length}.${short?' (Most of the paragraph was deleted.)':''}</p>`}${list}<p><span class="lbl">Corrected paragraph</span><span class="answer">${esc(it.m)}</span></p>`,stet:false};
  }
}
function setWsMark(b,ok){b.dataset.ok=ok?'1':'0';const m=b.querySelector('.mark');m.textContent=ok?'✓':'✗';m.className='mark '+(ok?'ok':'bad');}
function updateWsScore(){
  const bl=$$('#sheet .item.ws'),graded=bl.filter(b=>b.dataset.ok!==undefined),ok=graded.filter(b=>b.dataset.ok==='1').length;
  const pending=bl.filter(b=>b.dataset.done&&b.dataset.ok===undefined).length;
  const el=$('#wsScore');if(el)el.textContent=(graded.length?`${ok} of ${graded.length} correct`:'')+(pending?`${graded.length?' · ':''}${pending} to mark yourself`:'');
}
function checkAll(reveal){
  if(cur.checked)return;cur.checked=true;
  $$('#sheet .item.ws').forEach(b=>{
    if(b.dataset.done)return;b.dataset.done='1';
    const id=b.dataset.id,it=INDEX[id].it,ifb=b.querySelector('.ifb');ifb.hidden=false;
    if(it.t==='open'){
      const ta=b.querySelector('textarea');ta.readOnly=true;
      ifb.innerHTML=`<p class="verdict" style="color:var(--accent)">Model answer</p><p class="answer">${esc(it.m)}</p>${it.n?`<p class="note">${esc(it.n)}</p>`:''}<div class="row-tools"><button type="button" class="btn small primary" data-self="1">I had it</button><button type="button" class="btn small" data-self="0">Not yet</button></div>`;
      ifb.querySelectorAll('[data-self]').forEach(btn=>btn.onclick=()=>{const ok=btn.dataset.self==='1';recordId(id,ok,ta.value.trim()||'(no answer)');setWsMark(b,ok);btn.parentElement.remove();updateWsScore();});
      return;
    }
    const r=wsEval(b,reveal);
    recordId(id,r.ok,reveal?'(answer shown)':r.ans);setWsMark(b,r.ok);
    ifb.innerHTML=`<p class="verdict ${r.ok?'ok':'bad'}">${reveal?'Answer shown':r.ok?'Correct':'Not quite'}</p>${r.html||''}${it.n?`<p class="note">${esc(it.n)}</p>`:''}${r.stet&&!r.ok?`<div class="row-tools"><button type="button" class="btn small" data-stet title="Stet is the proofreader's mark for 'let it stand'.">Stet · count mine as right</button></div>`:''}`;
    const sb=ifb.querySelector('[data-stet]');
    if(sb)sb.onclick=()=>{stetId(id);setWsMark(b,true);const v=ifb.querySelector('.verdict');v.className='verdict ok';v.textContent='Stet · counted as correct';sb.parentElement.remove();updateWsScore();};
  });
  $('#actions').innerHTML=`<button type="button" class="btn primary" id="nextBtn">${pos+1<queue.length?'Next exercise':'See results'}</button><span class="ws-score" id="wsScore"></span>`;
  $('#nextBtn').onclick=next;updateWsScore();
  const first=$('#sheet .item.ws');if(first&&first.scrollIntoView)first.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---- summary ---- */
function renderSummary(){
  const total=results.length,correct=results.filter(r=>r.ok).length,wrong=total-correct;
  const by={};results.forEach(r=>{const u=INDEX[r.id].u;(by[u.n]=by[u.n]||{u,c:0,t:0});by[u.n].t++;if(r.ok)by[u.n].c++;});
  const rows=Object.values(by).sort((a,b)=>a.u.n-b.u.n).map(x=>`<tr><td><span class="sec">§${x.u.n}</span>${esc(x.u.title)}</td><td class="n">${x.c} / ${x.t}</td></tr>`).join('');
  $('#sheet').innerHTML=`<div class="summary"><p class="eyebrow">${mode==='mistakes'?'Mistake review complete':mode==='retry'?'Retry complete':'Session complete'}</p>
  <h2>${total?`${correct} of ${total} correct`:'No answers recorded'}</h2>
  <p class="ins">${total?`${Math.round(correct/total*100)}% accuracy · best streak ${sess.best}`:'Every item was skipped.'}</p>
  ${rows?`<table class="byunit"><tbody>${rows}</tbody></table>`:''}
  <div class="actions" style="padding-left:0">${wrong?`<button type="button" class="btn primary" id="retryBtn">Retry the ${wrong} I missed</button>`:''}<button type="button" class="btn ${wrong?'':'primary'}" id="againBtn">Start again</button></div></div>`;
  const r=$('#retryBtn');if(r)r.onclick=()=>start('retry');
  $('#againBtn').onclick=()=>start(mode==='mistakes'?'mistakes':'normal');
  (r||$('#againBtn')).focus({preventScroll:true});
}

/* ---- mistake log ---- */
function snippet(it){let s=(it.ctx||it.q).replace(/__/g,'……');return s.length>96?s.slice(0,94)+'…':s;}
function answerText(it){
  if(it.t==='gap')return it.a.map(a=>a.split('|')[0]).join(' · ');
  if(it.t==='mc')return it.o[it.a];
  if(it.t==='tr'||it.t==='err')return canon(it.a[0]);
  if(it.t==='open')return it.m.length>110?it.m.slice(0,108)+'…':it.m;
  return '12 corrections';
}
function renderLog(){
  const ids=Object.keys(mistakes).filter(id=>INDEX[id]).sort((a,b)=>mistakes[b].t-mistakes[a].t);
  const log=$('#log');
  log.innerHTML=`<div class="log-head"><h3>Mistake log<span class="count">${ids.length}</span></h3>${ids.length?`<div class="row-tools"><button type="button" class="btn small primary" id="drillMis">Drill my mistakes</button><button type="button" class="btn small ghost" id="clearMis">Clear log</button></div>`:''}</div>
  ${ids.length?`<ol class="loglist">${ids.slice(0,15).map(id=>{const it=INDEX[id].it;return `<li><span class="lid">${id}</span><span class="lq">${esc(snippet(it))}</span><span class="la">→ ${esc(answerText(it))}</span></li>`;}).join('')}</ol>${ids.length>15?`<p class="log-empty">Showing the 15 most recent of ${ids.length}.</p>`:''}`:`<p class="log-empty">Items you miss are listed here and kept in this browser. Answer one correctly later and it leaves the log.</p>`}`;
  const d=$('#drillMis');if(d)d.onclick=()=>{start('mistakes');$('#sheet').scrollIntoView({behavior:'smooth',block:'start'});};
  const c=$('#clearMis');if(c)c.onclick=()=>{if(c.dataset.armed){mistakes={};store.set('mistakes',mistakes);renderLog();}else{c.dataset.armed='1';c.textContent='Click again to clear';setTimeout(()=>{if(c.isConnected){delete c.dataset.armed;c.textContent='Clear log';}},3000);}};
}

/* ---- boot ---- */
$('#totalItems').textContent=ORDER.length;
try{$('#rail').open=matchMedia('(min-width:881px)').matches;}catch(e){$('#rail').open=true;}
renderRail();
start('normal');
booted=true;

</script>

<script>
/* Mistake gate (added): once 20 mistakes are waiting, a pop-up offers to redo them
   before the next new exercise. "Not now" asks again after 5 more mistakes. */
(function(A){
  var LIMIT=20,KEY='mgate-snooze',bypass=false,open=null;
  function n(){try{return A.count()||0}catch(e){return 0}}
  function sz(){try{return +localStorage.getItem(KEY)||0}catch(e){return 0}}
  function setSz(v){try{if(v)localStorage.setItem(KEY,String(v));else localStorage.removeItem(KEY)}catch(e){}}
  function should(){if(bypass||open)return false;try{if(A.inReview())return false}catch(e){return false}
    var c=n();if(c<LIMIT){if(sz())setSz(0);return false}var s=sz();return !s||c>=s+5}
  function close(){if(open){open.remove();open=null}}
  function pop(btn){var c=n();var d=document.createElement('div');d.className='mg-back';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','mg-h');
    d.innerHTML='<div class="mg-card"><h2 id="mg-h">Time to redo your mistakes</h2><p><span class="mg-n">'+c+'</span>mistakes are waiting for you.</p><p>Redo them now, before new exercises. Each one you get right comes off the list.</p><div class="mg-row"><button type="button" class="mg-go">Redo '+Math.min(LIMIT,c)+' mistakes</button><button type="button" class="mg-later">Not now</button></div><p class="mg-small">“Not now” continues with the new exercise. I’ll ask again after 5 more mistakes.</p></div>';
    document.body.appendChild(d);open=d;
    d.querySelector('.mg-go').onclick=function(){close();setSz(0);try{A.start()}catch(e){console.error(e)}};
    d.querySelector('.mg-later').onclick=function(){close();setSz(c);if(btn&&btn.isConnected){bypass=true;try{btn.click()}finally{bypass=false}}};
    d.addEventListener('click',function(e){if(e.target===d){close()}});
    d.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();close()}else if(e.key==='Tab'){var b=d.querySelectorAll('button'),f=b[0],l=b[b.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
    setTimeout(function(){var g=d.querySelector('.mg-go');if(g)g.focus({preventScroll:true})},30)}
  addEventListener('click',function(e){if(bypass||open)return;var b=null;try{b=A.isNext(e.target)}catch(x){}if(!b||!should())return;
    e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  ['pointerdown','touchstart','mousedown'].forEach(function(t){addEventListener(t,function(e){if(open&&!open.contains(e.target)){e.stopImmediatePropagation()}},true)});
  addEventListener('keydown',function(e){if(open){if(!open.contains(e.target)){e.preventDefault();e.stopImmediatePropagation()}return}
    if(e.key!=='Enter'||e.shiftKey||e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;var t=e.target;if(t&&t.tagName==='TEXTAREA')return;
    var b=null;try{b=A.enterNext(e)}catch(x){}if(!b||!should())return;e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  window.__mgate={count:n,should:should,open:function(){pop(null)},start:function(){setSz(0);try{A.start()}catch(e){console.error(e)}}};
})({
  count:function(){return Object.keys(mistakes).length},
  inReview:function(){return mode!=='normal'},
  isNext:function(t){var b=t.closest&&t.closest('#nextBtn,#skipBtn,#againBtn');return b&&mode==='normal'?b:null},
  enterNext:function(){if(mode!=='normal')return null;var b=document.getElementById('nextBtn');return b&&b.offsetParent&&!b.disabled?b:null},
  start:function(){start('mistakes');try{document.getElementById('sheet').scrollIntoView({block:'start'})}catch(e){}}
});
</script>
</body></html>
