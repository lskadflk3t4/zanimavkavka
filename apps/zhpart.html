<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>助词 Particles</title>
<style>
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--ink:#1B2421;--muted:#5D6B66;--line:#D8E0DC;
  --jade:#2B7A5E;--jade-soft:#E1EFE9;--seal:#B5442F;--seal-soft:#F7E5E0;--gold:#9A6A12;--gold-soft:#F6ECD6;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-han:"Noto Serif SC","Songti SC","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715;--surface:#19211F;--ink:#E3EBE7;--muted:#93A39C;--line:#2B3632;
  --jade:#62C39C;--jade-soft:#1D3229;--seal:#E58169;--seal-soft:#3A221D;--gold:#E0B357;--gold-soft:#3A2F17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111715;--surface:#19211F;--ink:#E3EBE7;--muted:#93A39C;--line:#2B3632;
  --jade:#62C39C;--jade-soft:#1D3229;--seal:#E58169;--seal-soft:#3A221D;--gold:#E0B357;--gold-soft:#3A2F17;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 90px}
header.top{padding:22px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-read);font-weight:600;font-size:clamp(22px,5vw,30px);line-height:1.2;margin:2px 0 4px}
h1 .zh{font-family:var(--f-han)}
.lede{color:var(--muted);margin:0 0 6px;max-width:60ch}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 14px;overflow-x:auto;scrollbar-width:none}
.seg button{appearance:none;border:0;background:none;font-weight:600;color:var(--muted);padding:10px 12px 9px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;min-height:44px}
.seg button[aria-selected="true"]{color:var(--jade);border-bottom-color:var(--jade)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.opts .lab{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:64px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--jade)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
h2{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade);margin:22px 0 8px;font-weight:700}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;width:100%}
.set:hover{border-color:var(--jade)}
.set .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);line-height:1.2}
.set .no b{display:block;font-family:var(--f-han);font-size:15px;color:var(--jade);font-weight:600}
.set .t{font-weight:600;line-height:1.3}
.set .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.set .sc{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.set .sc b{color:var(--jade)}
.bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade)}
.special{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 22px -18px rgba(0,0,0,.4)}
.prog{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
.prog .pbar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .pbar i{display:block;height:100%;background:var(--jade);transition:width .25s}
.play{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb{width:52px;height:52px;border-radius:50%;border:0;background:var(--jade);color:var(--bg);cursor:pointer;display:grid;place-items:center;flex:none}
.pb svg{width:20px;height:20px;fill:currentColor}
.pb.on{box-shadow:0 0 0 5px var(--jade-soft)}
.small{font-size:13px;color:var(--muted)}
.prompt-en{font-family:var(--f-read);font-size:17px;line-height:1.4}
.prompt-en.off{color:var(--muted);font-style:italic;font-size:14px;font-family:var(--f-ui)}
.pyhint{color:var(--jade);font-size:14px}
.ans{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.ans.empty::before{content:"Tap the blocks in order";color:var(--muted);font-size:13.5px;padding:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tile{font-family:var(--f-han);font-size:19px;line-height:1.2;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 11px;cursor:pointer;min-height:44px;min-width:44px;user-select:none;box-shadow:0 1px 0 var(--line)}
.tile:hover{border-color:var(--jade)}
.tile.used{visibility:hidden}
.tile.ok{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.tile.bad{background:var(--seal-soft);border-color:var(--seal);color:var(--seal)}
.tile.given{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-family:var(--f-han);font-size:20px;line-height:1.5;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.fb.ok{background:var(--jade-soft)}
.fb.bad{background:var(--seal-soft)}
.fb .v{font-weight:700}
.fb.ok .v{color:var(--jade)}.fb.bad .v{color:var(--seal)}
.han{font-family:var(--f-han);font-size:20px;line-height:1.55}
.han .m{color:var(--seal);text-decoration:underline wavy;text-underline-offset:4px}
.han .x{color:var(--seal);text-decoration:line-through}
.han .g{color:var(--jade)}
.han .tw{color:var(--gold);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.fb .py{color:var(--jade);font-size:14px}
.fb .en{color:var(--muted);font-size:14px}
.done{text-align:center;padding:26px 10px;display:grid;gap:10px;justify-items:center}
.done .big{font-family:var(--f-read);font-size:40px;color:var(--jade);line-height:1}
.mini{display:grid;gap:6px;text-align:left;width:100%;margin-top:8px}
.mini div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px}
.mini .han{font-size:16px}
.mk{font-weight:700}.mk.g1{color:var(--jade)}.mk.g0{color:var(--seal)}.mk.gh{color:var(--gold)}
.back{border:0;background:none;color:var(--jade);font-weight:600;cursor:pointer;padding:6px 0;min-height:40px}
.note{font-size:12.5px;color:var(--muted)}
.ab{display:grid;gap:6px}
.ab div{font-family:var(--f-read);font-size:17px;line-height:1.45;background:var(--bg);border-radius:10px;padding:9px 12px}
.ab b{font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-right:6px}
.use{font-size:14px}.use b{color:var(--seal);font-size:16px}
.gapq{font-family:var(--f-read);font-size:19px;line-height:1.5}
.gapq .gp{display:inline-block;min-width:70px;border-bottom:2px solid var(--seal);color:var(--seal);text-align:center;font-weight:700}
.opts.ch{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opts.ch .opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:16px;min-height:48px;text-align:left}
.opts.ch .opt.ok{border-color:var(--jade);background:var(--jade-soft)}.opts.ch .opt.bad{border-color:var(--seal);background:var(--seal-soft)}
.cl{display:grid;gap:8px}
.cn{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:4px}
.cn .f{font-weight:700;font-size:17px;color:var(--jade)}
.cn .m{font-size:14.5px}.cn .nt{font-size:13.5px;color:var(--muted)}
.cn .ex{font-family:var(--f-read);font-size:15px;border-left:3px solid var(--line);padding-left:9px}
.tag{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--muted);vertical-align:2px}
.tag.reg-c{color:#9A6A12;border-color:#9A6A12}.tag.reg-e{color:#2E5FA8;border-color:#2E5FA8}.tag.reg-l{color:#7B3FA0;border-color:#7B3FA0}
.cn .row{gap:6px}
.lvbar{display:flex;gap:6px;flex-wrap:wrap}
.cat h2{margin-top:18px}
.src{font-size:12px;color:var(--muted)}
.ch-hint{font-size:13px;color:var(--muted)}

body.inround header.top{display:none}body.inround .wrap{padding-top:8px}
.cfg{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:0 0 12px}
.cfg>summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:600;min-height:44px}
.cfg>summary::-webkit-details-marker{display:none}
.cfg>summary small{font-weight:400;color:var(--muted);margin-left:6px}
.cfg[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.cfg .opts{padding:0 12px}
.ftok{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;margin:3px 1px;cursor:pointer;font-family:var(--f-read);font-size:18px;min-height:42px;color:var(--ink)}
:lang(zh) .ftok{font-family:var(--f-han);font-size:20px}
.ftok.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.ftok.bad{border-color:var(--seal);background:var(--seal-soft);color:var(--seal)}
.ftok.err{border-color:var(--seal);color:var(--seal);text-decoration:underline wavy;text-underline-offset:4px}
.fixs{line-height:1.3}
.chip.cok{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.chip.cbad{background:var(--seal-soft);border-color:var(--seal);color:var(--seal)}
.chip.cno{opacity:.55;text-decoration:line-through}
.tin{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:20px;min-height:48px;font-family:var(--f-read)}
:lang(zh) .tin{font-family:var(--f-han)}
@media (max-width:480px){.tile{font-size:18px;padding:7px 9px}.han{font-size:18px}textarea{font-size:18px}}

.zh{font-family:var(--f-han)}
.stats{display:flex;gap:8px;margin:4px 0 6px}.stats div{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 4px;text-align:center}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.stats span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opts.ch .opt .k{display:inline-block;min-width:18px;font-family:var(--f-ui);font-size:11px;color:var(--muted);margin-right:6px}
.opts.ch .opt.zh{font-size:20px}
.gapq.zh{font-family:var(--f-han);font-size:21px}
.fb .han{font-size:19px}
body.inround .stats{display:none}
</style></head><body>

<script>window.PDATA={"topics": [{"id": "mod", "zh": "语气词", "en": "Sentence-final particles", "sub": "吧 · 呢 · 啊 · 嘛 · 呗 · 吗"}, {"id": "lim", "zh": "来着 · 罢了 · 而已", "en": "Recalling and playing down", "sub": "来着 · 罢了 · 而已 · 就是了"}, {"id": "pass", "zh": "被 · 让 · 叫 · 给", "en": "Ways to say the passive", "sub": "被 · 让 · 叫 · 给 · no marker · 把…给"}, {"id": "adv", "zh": "才 · 只 · 也 · 还 · 又 · 再", "en": "Only, also, still, again", "sub": "才 vs 只 · 也 / 还 / 又 / 再"}, {"id": "frame", "zh": "连 · 除了 · 一…就", "en": "Fixed frames", "sub": "连…都/也 · 除了…都 vs 也/还 · 一…就"}, {"id": "q", "zh": "问句", "en": "Question types", "sub": "吗 · 你去不去 · 呢 · 还是 · 吧"}, {"id": "dir", "zh": "起来 · 下去 · 下来 · 出来", "en": "Figurative direction complements", "sub": "起来 · 下去 · 下来 · 出来 · 过来"}, {"id": "form", "zh": "书面语", "en": "Formal and written", "sub": "所 · 为…所 · 之 · 以…为 · 而 · 则 · 于 · 把…当作"}], "learn": {"mod": [["吧", "Suggestion, soft command, or \"…, right?\" when you think you already know the answer.", ["我们走吧。", "你是新来的吧？"]], ["呢", "\"And …?\" follow-up question; also softens a question word question or marks an ongoing state.", ["我很好，你呢？", "他在哪儿呢？", "外面下着雨呢。"]], ["啊", "Adds feeling: surprise, warmth, insistence. Often changes to 呀 / 哪 / 哇 after certain sounds.", ["好啊！", "你怎么才来啊！"]], ["嘛", "\"It's obvious, isn't it\": reminds the listener of something they should know or accept.", ["他是孩子嘛，别生气。", "经典就是经典嘛！"]], ["呗", "Shrugging \"so just…, that's all\": resigned or dismissive, colloquial.", ["不去就不去呗。", "没钱就别买呗。"]], ["吗", "Turns a statement into a plain yes/no question. Not used with question words or A-not-A.", ["你去吗？"]]], "lim": [["来着", "Colloquial: \"what was it again?\" when you try to recall something, or \"I was just…\" about the recent past.", ["他叫什么名字来着？", "我刚才说什么来着？"]], ["罢了 / 而已", "\"…that's all, nothing more\": plays something down. Often with 只是 / 不过 / 只.", ["我只是随便说说罢了。", "这只是一个小问题而已。"]], ["就是了", "\"Just do it, no problem\": reassuring or impatient.", ["你放心，我明天还你就是了。"]]], "pass": [["被", "Standard passive, mostly for things that happen to someone unpleasantly or unexpectedly. The agent is optional.", ["我的钱包被偷了。", "他被老师批评了。"]], ["让 / 叫", "Colloquial passive; the agent is required (让人, 叫他). 让 also means \"let / make\", so context decides.", ["自行车让人骑走了。", "我叫雨淋湿了。"]], ["给", "Very colloquial passive (给人骗了), or an optional 给 before the verb in 被 and 把 sentences for emphasis.", ["钱都给人骗走了。", "我把钥匙给丢了。"]], ["No marker", "When the subject obviously cannot do the action, Chinese often uses no passive marker at all.", ["饭做好了。", "信写完了。"]]], "adv": [["才 vs 只", "才 + number = \"only\" with surprise or judgement (that's little / young / early). 只 is a neutral limit.", ["他才五岁，就会写这么多字！", "我只有五块钱。"]], ["又 vs 再", "Both \"again\": 又 for repeats that already happened (or are certain), 再 for repeats still to come.", ["他昨天又迟到了。", "明天再来吧。"]], ["还", "Still (continues), also / in addition, or \"even more\" in comparisons.", ["他还在睡觉。", "我还要一杯。"]], ["也", "Also / too: the same thing applies to another subject. Comes after the subject, before the verb.", ["我也去。"]]], "frame": [["连…都/也", "\"Even\": what follows 连 is the extreme case and comes before the verb. 都 or 也 is required.", ["他连饭都没吃。", "连小孩也知道。"]], ["除了…以外，都", "\"Except\": the rest all do / are.", ["除了他以外，我们都去了。"]], ["除了…以外，也/还", "\"Besides, in addition\": there is more.", ["除了中文以外，他还会法语。"]], ["一…就", "\"As soon as\". No 了 after the first verb.", ["我一回家就睡觉。"]]], "q": [["吗", "Plain yes/no question.", ["你去吗？"]], ["A不A", "Neutral or insistent yes/no question. Cannot take 吗, and does not combine with 很 / 也.", ["你去不去？", "好不好吃？"]], ["呢", "Follow-up \"and …?\" or with question words. Not a general question marker.", ["我去，你呢？", "你在想什么呢？"]], ["还是 vs 或者", "还是 = \"or\" in a question asking you to choose; 或者 = \"or\" in statements.", ["你喝茶还是喝咖啡？", "周六或者周日都可以。"]]], "dir": [["起来", "Start and continue (笑起来); \"when you do it / it seems\" (看起来, 听起来); bring together (想起来, 收拾起来).", ["他突然笑起来了。", "这个看起来很贵。"]], ["下去", "Continue something already going on.", ["你说下去。", "我们一定要坚持下去。"]], ["下来", "Come to a stop or settle (停下来, 安静下来); keep / fix something (写下来, 留下来); time up to now (坚持下来).", ["车停下来了。", "把电话号码写下来。"]], ["出来", "Something becomes visible or recognised (看出来, 听出来, 想出来).", ["我听出来了，是你！", "我想出来一个办法。"]], ["过来 / 过去", "过来: back to normal (醒过来); 过去: lose consciousness (晕过去).", ["他终于醒过来了。"]]], "form": [["所", "Before a verb in a relative clause, formal: 我所知道的 = 我知道的.", ["这是我所知道的一切。"]], ["为…所…", "Literary passive: 为人所知 = known by people.", ["这个秘密终于为人所知。"]], ["之", "Classical 的 in fixed words: 之一, 之后, 之间, 三分之一, 久而久之.", ["这是我最喜欢的城市之一。"]], ["以…为…", "\"Take … as …\", formal.", ["我们以他为榜样。"]], ["而", "Written \"and / but / yet\"; in 不是…而是… \"not … but …\".", ["他不是不想去，而是没时间。"]], ["则", "Written \"whereas\" or \"then\": 不进则退.", ["哥哥喜欢运动，弟弟则喜欢看书。"]], ["于", "Written \"in / at / to / than\": 生于1990年 = 1990年出生.", ["他生于1990年。"]], ["把…当作 / 当成", "\"Treat … as …\".", ["我把他当作朋友。"]]]}, "items": [{"id": "ca56deee2", "k": "c", "t": "mod", "s": "我们几点出发？八点__，不早不晚。", "ok": ["吧"], "no": ["吗", "呢", "呗"], "en": "\"Let's say eight; not too early, not too late.\"", "why": "吧 makes a suggestion.", "full": "我们几点出发？八点吧，不早不晚。", "py": "Wǒmen jǐdiǎn chūfā? Bādiǎn ba, bùzǎobùwǎn."}, {"id": "cb904bf75", "k": "c", "t": "mod", "s": "我很好，你__？", "ok": ["呢"], "no": ["吗", "吧", "嘛"], "en": "I'm fine, and you?", "why": "呢 = \"and you?\" follow-up question.", "full": "我很好，你呢？", "py": "Wǒ hěn hǎo, nǐ ne?"}, {"id": "c1267edec", "k": "c", "t": "mod", "s": "你是小王的妹妹__？你们长得真像。", "ok": ["吧"], "no": ["呢", "嘛", "呗"], "en": "You must be Xiao Wang's sister, right? You look so alike.", "why": "吧 = \"…, right?\" You expect a yes.", "full": "你是小王的妹妹吧？你们长得真像。", "py": "Nǐ shì Xiǎo Wáng de mèimei ba? Nǐmen zhǎng de zhēn xiàng."}, {"id": "cec3632a4", "k": "c", "t": "mod", "s": "别生气了，他还是个孩子__。", "ok": ["嘛"], "no": ["吗", "呢", "吧"], "en": "Don't be angry, he's just a kid, after all.", "why": "嘛 = \"it's obvious\": reminding someone of a fact.", "full": "别生气了，他还是个孩子嘛。", "py": "Biéshēngqì le, tā hái shì gè háizi ma."}, {"id": "cd449f584", "k": "c", "t": "mod", "s": "不想去就别去__，又没人逼你。", "ok": ["呗"], "no": ["吗", "呢", "吧"], "en": "If you don't want to go, just don't; nobody's forcing you.", "why": "呗 = shrugging \"so just…\".", "full": "不想去就别去呗，又没人逼你。", "py": "Bùxiǎng qù jiù bié qù bei, yòu méi rén bī nǐ."}, {"id": "c469eeb8a", "k": "c", "t": "mod", "s": "这么多菜，你怎么一个人做的__！太厉害了！", "ok": ["啊"], "no": ["吗", "呗", "吧"], "en": "So many dishes, how did you make them all yourself! Amazing!", "why": "啊 adds surprise and warmth. 吗 is wrong because 怎么 already makes it a question.", "full": "这么多菜，你怎么一个人做的啊！太厉害了！", "py": "Zhème duō cài, nǐ zěnme yí ge rén zuò de a! Tài lìhài le!"}, {"id": "c4ecb32c2", "k": "c", "t": "mod", "s": "你知道他为什么没来__？", "ok": ["吗"], "no": ["呢", "嘛", "呗"], "en": "Do you know why he didn't come?", "why": "A yes/no question about knowing: 吗. (他为什么没来呢？ would be fine without 你知道.)", "full": "你知道他为什么没来吗？", "py": "Nǐ zhīdào tā wèishénme méi lái ma?"}, {"id": "c29c379d9", "k": "c", "t": "mod", "s": "外面下着雨__，带把伞吧。", "ok": ["呢"], "no": ["吗", "呗", "吧"], "en": "It's raining out, take an umbrella.", "why": "呢 after a continuing state (下着雨): \"you know, it's raining\".", "full": "外面下着雨呢，带把伞吧。", "py": "Wàimiàn xiàzhe yǔ ne, dài bǎ sǎn ba."}, {"id": "c09373bba", "k": "c", "t": "mod", "s": "那又怎么样？经典就是经典__！", "ok": ["嘛"], "no": ["吗", "呢", "吧"], "en": "So what? A classic is a classic!", "why": "From your Last of Us recording: 嘛 = obviously.", "full": "那又怎么样？经典就是经典嘛！", "py": "Nà yòu zěnmeyàng? Jīngdiǎn jiùshì jīngdiǎn ma!", "clip": ["audio-6/018.webm", 17.85, 26.92]}, {"id": "c3b07a4e3", "k": "c", "t": "mod", "s": "也不是不可以，但是就是你要说清楚__，对不对？", "ok": ["嘛"], "no": ["吗", "呢", "呗"], "en": "It's not impossible, but you have to say it clearly, right?", "why": "嘛: \"obviously you need to say it clearly\".", "full": "也不是不可以，但是就是你要说清楚嘛，对不对？", "py": "Yě bú shì bù kěyǐ, dànshì jiùshì nǐ yàoshuō qīngchu ma, duìbúduì?", "clip": ["audio-6/001.webm", 1330.31, 1336.95]}, {"id": "c5306aaf1", "k": "c", "t": "lim", "s": "那个演员叫什么名字__？我一下子想不起来了。", "ok": ["来着"], "no": ["罢了", "而已", "就是了"], "en": "What was that actor called again? It's slipped my mind.", "why": "来着 = trying to recall something you knew.", "full": "那个演员叫什么名字来着？我一下子想不起来了。", "py": "Nàge yǎnyuán jiào shénme míngzi láizhe? Wǒ yíxiàzi xiǎng bu qǐlai le."}, {"id": "c64c067b6", "k": "c", "t": "lim", "s": "我只是随便说说__，你别当真。", "ok": ["罢了", "而已"], "no": ["来着", "就是了"], "en": "I was just saying, don't take it seriously.", "why": "罢了 and 而已 both mean \"that's all\".", "full": "我只是随便说说罢了，你别当真。", "py": "Wǒ zhǐshì suíbiànshuōshuō bàle, nǐ biédàngzhēn."}, {"id": "cce7d5c84", "k": "c", "t": "lim", "s": "别担心，钱我明天还你__。", "ok": ["就是了"], "no": ["来着", "而已", "罢了"], "en": "Don't worry, I'll give the money back tomorrow, that's all there is to it.", "why": "就是了 = reassuring \"I'll just do it\".", "full": "别担心，钱我明天还你就是了。", "py": "Bié dānxīn, qián wǒ míngtiān huán nǐ jiùshì le."}, {"id": "ccc67db1a", "k": "c", "t": "lim", "s": "这不过是一个小错误__，没什么大不了的。", "ok": ["而已", "罢了"], "no": ["来着", "就是了"], "en": "It's just a small mistake, no big deal.", "why": "不过…而已/罢了 = \"just …, nothing more\".", "full": "这不过是一个小错误而已，没什么大不了的。", "py": "Zhè búguò shì yíge xiǎo cuòwù éryǐ, méishénme dàbùliǎo de."}, {"id": "c74057228", "k": "c", "t": "lim", "s": "我们刚才说到哪儿__？", "ok": ["来着"], "no": ["罢了", "而已", "就是了"], "en": "Where were we just now?", "why": "来着 = trying to remember something from a moment ago.", "full": "我们刚才说到哪儿来着？", "py": "Wǒmen gāngcái shuō dào nǎr láizhe?"}, {"id": "c61183bf0", "k": "c", "t": "lim", "s": "聊聊天，就只是这样__。", "ok": ["而已", "罢了"], "no": ["来着", "就是了"], "en": "Just chatting, that's all it is.", "why": "From the podcast about leaving home: 就只是这样而已.", "full": "聊聊天，就只是这样而已。", "py": "Liáoliáotiān, jiù zhǐshì zhèyàng éryǐ.", "clip": ["audio-6/005.webm", 823.88, 836.68]}, {"id": "cda4ef72e", "k": "c", "t": "pass", "s": "我的手机__人偷了。", "ok": ["被", "让", "叫", "给"], "no": ["把", "对", "跟"], "en": "My phone was stolen.", "why": "被 is standard; 让, 叫 and 给 are colloquial passives. 把 would make the phone the thief!", "full": "我的手机被人偷了。", "py": "Wǒ de shǒujī bèi rén tōu le."}, {"id": "c56a467f3", "k": "c", "t": "pass", "s": "他__老师批评了一顿。", "ok": ["被", "让", "叫"], "no": ["把", "对", "跟"], "en": "He got a telling-off from the teacher.", "why": "被 / 让 / 叫 all work as passives here; 让 and 叫 sound more colloquial.", "full": "他被老师批评了一顿。", "py": "Tā bèi lǎoshī pīpíng le yídùn."}, {"id": "cf00f083c", "k": "c", "t": "pass", "s": "我的自行车__骑走了。", "ok": ["被"], "no": ["让", "叫", "把"], "en": "My bike was ridden off.", "why": "No agent named: only 被 works. 让 and 叫 need someone after them (让人骑走了).", "full": "我的自行车被骑走了。", "py": "Wǒ de zìxíngchē bèi qí zǒu le."}, {"id": "c27462b82", "k": "c", "t": "pass", "s": "晚饭做__了，快来吃吧！", "ok": ["好"], "no": ["被好", "让好", "给好"], "en": "Dinner is ready, come and eat!", "why": "No passive marker: dinner can't cook itself, so Chinese just says 饭做好了.", "full": "晚饭做好了，快来吃吧！", "py": "Wǎnfàn zuòhǎo le, kuài lái chī ba!"}, {"id": "cfbdc689a", "k": "c", "t": "pass", "s": "真倒霉，我把钥匙__丢了。", "ok": ["给"], "no": ["被", "让", "叫"], "en": "Bad luck, I've gone and lost my keys.", "why": "Optional 给 before the verb in a 把 sentence adds \"it happened (unfortunately)\".", "full": "真倒霉，我把钥匙给丢了。", "py": "Zhēn dǎoméi, wǒ bǎ yàoshi gěi diū le."}, {"id": "c82c85264", "k": "c", "t": "pass", "s": "这件事已经__大家知道了。", "ok": ["被", "让", "叫"], "no": ["把", "给", "对"], "en": "Everyone already knows about this.", "why": "Passive with an agent (大家): 被, 让 or 叫.", "full": "这件事已经被大家知道了。", "py": "Zhèjiàn shì yǐjīng bèi dàjiā zhīdào le."}, {"id": "cb3bd1ac5", "k": "c", "t": "pass", "s": "我__雨淋湿了，全身都是水。", "ok": ["被", "让", "叫"], "no": ["把", "给", "对"], "en": "I got soaked by the rain.", "why": "Rain as the agent: 被 / 让 / 叫 雨淋湿了.", "full": "我被雨淋湿了，全身都是水。", "py": "Wǒ bèi yǔ lín shī le, quánshēn dōu shì shuǐ."}, {"id": "c166d189d", "k": "c", "t": "adv", "s": "他__五岁，就会写一百个汉字了！", "ok": ["才"], "no": ["只", "又", "还"], "en": "He's only five and can already write a hundred characters!", "why": "才 + number = surprisingly young.", "full": "他才五岁，就会写一百个汉字了！", "py": "Tā cái wǔsuì, jiù huì xiě yìbǎige hànzì le!"}, {"id": "cf7064bdf", "k": "c", "t": "adv", "s": "我身上__有五十块钱，不够买这件衣服。", "ok": ["只"], "no": ["才", "又", "也"], "en": "I've only got fifty yuan on me, not enough for this.", "why": "A plain limit: 只有. (才五十块 would add \"that's so little\".)", "full": "我身上只有五十块钱，不够买这件衣服。", "py": "Wǒ shēnshàng zhǐyǒu wǔshíkuài qián, búgòu mǎi zhèjiàn yīfu."}, {"id": "c9b808885", "k": "c", "t": "adv", "s": "他昨天__迟到了，老师很生气。", "ok": ["又"], "no": ["再", "还", "也"], "en": "He was late again yesterday; the teacher was angry.", "why": "Repeat that already happened: 又.", "full": "他昨天又迟到了，老师很生气。", "py": "Tā zuótiān yòu chídào le, lǎoshī hěn shēngqì."}, {"id": "c0bb5e79c", "k": "c", "t": "adv", "s": "这个电影太好看了，我想__看一遍。", "ok": ["再"], "no": ["又", "还", "才"], "en": "The film was great, I want to watch it again.", "why": "Repeat still to come: 再.", "full": "这个电影太好看了，我想再看一遍。", "py": "Zhège diànyǐng tài hǎokàn le, wǒ xiǎng zài kànyíbiàn."}, {"id": "c06f7df57", "k": "c", "t": "adv", "s": "都十点了，他__在睡觉。", "ok": ["还"], "no": ["又", "再", "也"], "en": "It's ten o'clock and he's still asleep.", "why": "Something continuing: 还.", "full": "都十点了，他还在睡觉。", "py": "Dōu shídiǎn le, tā hái zài shuìjiào."}, {"id": "c93e321cf", "k": "c", "t": "adv", "s": "你去，我__去。", "ok": ["也"], "no": ["又", "再", "才"], "en": "If you go, I'll go too.", "why": "Same action, another subject: 也.", "full": "你去，我也去。", "py": "Nǐ qù, wǒ yě qù."}, {"id": "c794e0150", "k": "c", "t": "adv", "s": "明天又是星期一了，__要上班了。", "ok": ["又"], "no": ["再", "还", "才"], "en": "It's Monday again tomorrow, back to work again.", "why": "又 also works for a future repeat that is certain (calendar): 又是星期一.", "full": "明天又是星期一了，又要上班了。", "py": "Míngtiān yòu shì xīngqīyī le, yòu yào shàngbān le."}, {"id": "c0211fbe4", "k": "c", "t": "adv", "s": "我等了一个小时，他__来。", "ok": ["才"], "no": ["就", "只", "又"], "en": "I waited an hour before he finally came.", "why": "才 = later than expected; no 了.", "full": "我等了一个小时，他才来。", "py": "Wǒ děng le yíge xiǎoshí, tā cái lái."}, {"id": "ce518e150", "k": "c", "t": "adv", "s": "你怎么__来？电影都开始半个小时了！", "ok": ["才"], "no": ["就", "又", "还"], "en": "Why are you only coming now? The film started half an hour ago!", "why": "才 = later than expected.", "full": "你怎么才来？电影都开始半个小时了！", "py": "Nǐ zěnme cái lái? Diànyǐng dōu kāishǐ bànge xiǎoshí le!"}, {"id": "c2acb0bc8", "k": "c", "t": "adv", "s": "你先走吧，我__坐一会儿。", "ok": ["再", "还"], "no": ["又", "也"], "en": "You go ahead, I'll sit a bit longer.", "why": "再坐一会儿 (a bit more) or 还坐一会儿 (still / for now) both work.", "full": "你先走吧，我再坐一会儿。", "py": "Nǐ xiān zǒu ba, wǒ zài zuò yíhuìr."}, {"id": "c03137142", "k": "c", "t": "frame", "s": "他忙得__饭都没时间吃。", "ok": ["连"], "no": ["除了", "也", "就"], "en": "He's so busy he doesn't even have time to eat.", "why": "连…都 = even.", "full": "他忙得连饭都没时间吃。", "py": "Tā máng de lián fàn dōu méi shíjiān chī."}, {"id": "c68802535", "k": "c", "t": "frame", "s": "这么简单的题，__小学生也会做。", "ok": ["连"], "no": ["除了", "就", "才"], "en": "Such an easy question, even a primary school pupil could do it.", "why": "连…也 = even.", "full": "这么简单的题，连小学生也会做。", "py": "Zhème jiǎndān de tí, lián xiǎoxuéshēng yě huì zuò."}, {"id": "cb640a7ae", "k": "c", "t": "frame", "s": "除了小李以外，我们__去了。", "ok": ["都"], "no": ["也", "还", "就"], "en": "Everyone except Xiao Li went.", "why": "除了…都 = except.", "full": "除了小李以外，我们都去了。", "py": "Chúle Xiǎo Lǐ yǐwài, wǒmen dōu qù le."}, {"id": "c68eac54f", "k": "c", "t": "frame", "s": "除了游泳以外，他__喜欢跑步。", "ok": ["还", "也"], "no": ["都", "就"], "en": "Besides swimming, he also likes running.", "why": "除了…还/也 = besides, in addition.", "full": "除了游泳以外，他还喜欢跑步。", "py": "Chúle yóuyǒng yǐwài, tā hái xǐhuan pǎobù."}, {"id": "cbe3dd38d", "k": "c", "t": "frame", "s": "我一到家__给你打电话。", "ok": ["就"], "no": ["才", "也", "都"], "en": "I'll call you as soon as I get home.", "why": "一…就 = as soon as.", "full": "我一到家就给你打电话。", "py": "Wǒ yí dào jiā jiù gěi nǐ dǎdi c", "t": "q", "s": "你是学生__？", "ok": ["吗", "吧"], "no": ["呢", "还是"], "en": "Are you a student? / You're a student, right?", "why": "吗 = neutral question; 吧 = you expect a yes.", "full": "你是学生吗？", "py": "Nǐ shì xuéshēng ma?"}, {"id": "cbd4dbb63", "k": "c", "t": "dir", "s": "听了他的笑话，大家都笑__了。", "ok": ["起来"], "no": ["下去", "出来", "下来"], "en": "Everyone burst out laughing at his joke.", "why": "起来 = start and keep going.", "full": "听了他的笑话，大家都笑起来了。", "py": "Tīng le tā de xiàohuà, dàjiā dōu xiào qǐlai le."}, {"id": "c81de0655", "k": "c", "t": "dir", "s": "这家餐厅看__很贵。", "ok": ["起来"], "no": ["出来", "下去", "下来"], "en": "This restaurant looks expensive.", "why": "看起来 = it looks / seems.", "full": "这家餐厅看起来很贵。", "py": "Zhèjiā cāntīng kàn qǐlai hěn guì."}, {"id": "cf1df4ca6", "k": "c", "t": "dir", "s": "你说得很好，继续说__。", "ok": ["下去"], "no": ["起来", "下来", "出来"], "en": "You're doing well, carry on.", "why": "下去 = continue.", "full": "你说得很好，继续说下去。", "py": "Nǐ shuō de hěn hǎo, jìxù shuō xiàqu."}, {"id": "ce19e10bc", "k": "c", "t": "dir", "s": "车在路边停__了。", "ok": ["下来"], "no": ["下去", "起来", "出来"], "en": "The car stopped by the road.", "why": "下来 = come to a stop.", "full": "车在路边停下来了。", "py": "Chē zài lùbiān tíng xiàlai le."}, {"id": "cf037ce47", "k": "c", "t": "dir", "s": "把他的电话号码写__，别忘了。", "ok": ["下来"], "no": ["下去", "起来", "出去"], "en": "Write down his phone number, don't forget.", "why": "写下来 = write down and keep.", "full": "把他的电话号码写下来，别忘了。", "py": "Bǎ tā de diànhuàhàomǎ xiě xiàlai, biéwàngle."}, {"id": "cd7042af6", "k": "c", "t": "dir", "s": "我听__了，电话里是你妈妈的声音。", "ok": ["出来"], "no": ["起来", "下来", "过来"], "en": "I recognised it: that was your mum's voice on the phone.", "why": "听出来 = recognise by listening.", "full": "我听出来了，电话里是你妈妈的声音。", "py": "Wǒ tīng chūlai le, diànhuà lǐ shì nǐ māma de shēngyīn."}, {"id": "ca0a10665", "k": "c", "t": "dir", "s": "我想__一个好办法！", "ok": ["出来"], "no": ["起来", "下去", "过来"], "en": "I've come up with a good idea!", "why": "想出来 = come up with (something new). 想起来 = remember (something you knew).", "full": "我想出来一个好办法！", "py": "Wǒ xiǎng chūlai yíge hǎo bànfǎ!"}, {"id": "ce45c0595", "k": "c", "t": "dir", "s": "那个人的名字我想不__了。", "ok": ["起来"], "no": ["出来", "下去", "下来"], "en": "I can't remember that person's name.", "why": "想不起来 = can't recall something you knew.", "full": "那个人的名字我想不起来了。", "py": "Nàge rén de míngzi wǒ xiǎng bu qǐlai le."}, {"id": "cb492df81", "k": "c", "t": "dir", "s": "病人昏迷了三天，今天终于醒__了。", "ok": ["过来"], "no": ["过去", "起来", "下来"], "en": "The patient was unconscious for three days and finally came round today.", "why": "醒过来 = come back to normal.", "full": "病人昏迷了三天，今天终于醒过来了。", "py": "Bìngrén hūnmí le sāntiān, jīntiān zhōngyú xǐng guòlai le."}, {"id": "c8f5e532f", "k": "c", "t": "dir", "s": "我们一定要坚持__，不能放弃。", "ok": ["下去"], "no": ["起来", "出来", "过来"], "en": "We have to keep going, we can't give up.", "why": "坚持下去 = keep going from now on.", "full": "我们一定要坚持下去，不能放弃。", "py": "Wǒmen yídìng yào jiānchí xiàqu, bùnéng fàngqì."}, {"id": "cc0c11cf3", "k": "c", "t": "dir", "s": "刚才教室里还很吵，老师一进来，大家马上安静__了。", "ok": ["下来"], "no": ["下去", "起来", "出来"], "en": "The classroom was noisy, but as soon as the teacher came in everyone went quiet.", "why": "安静下来 = settle into a state.", "full": "刚才教室里还很吵，老师一进来，大家马上安静下来了。", "py": "Gāngcái jiàoshì lǐ hái hěn chǎo, lǎoshī yí jìnlai, dàjiā mǎshàng ānjìng xiàlai le."}, {"id": "c77a234ce", "k": "c", "t": "dir", "s": "我能看__，你今天不太开心。", "ok": ["出来"], "no": ["起来", "下来", "过来"], "en": "I can tell you're not very happy today.", "why": "看出来 = notice, tell.", "full": "我能看出来，你今天不太开心。", "py": "Wǒ néng kàn chūlai, nǐ jīntiān bú tài kāixīn."}, {"id": "c3511fdb7", "k": "c", "t": "form", "s": "这就是我__知道的全部情况。", "ok": ["所"], "no": ["之", "而", "以"], "en": "That is everything I know.", "why": "Formal 所 + verb + 的.", "full": "这就是我所知道的全部情况。", "py": "Zhè jiùshì wǒ suǒ zhīdào de quánbù qíngkuàng."}, {"id": "c4dd0b993", "k": "c", "t": "form", "s": "这件事终于为大家__知。", "ok": ["所"], "no": ["之", "于", "被"], "en": "This finally became known to everyone.", "why": "为…所… literary passive.", "full": "这件事终于为大家所知。", "py": "Zhèjiàn shì zhōngyú wéi dàjiā suǒzhī."}, {"id": "ce6596c1b", "k": "c", "t": "form", "s": "长城是世界上最有名的建筑__一。", "ok": ["之"], "no": ["所", "的", "于"], "en": "The Great Wall is one of the most famous buildings in the world.", "why": "…之一 = one of.", "full": "长城是世界上最有名的建筑之一。", "py": "Chángchéng shì shìjiè shàng zuì yǒumíng de jiànzhù zhī yī."}, {"id": "c896e682e", "k": "c", "t": "form", "s": "我们要__他为榜样，好好学习。", "ok": ["以"], "no": ["把", "所", "于"], "en": "We should take him as our model.", "why": "以…为… = take … as ….", "full": "我们要以他为榜样，好好学习。", "py": "Wǒmen yào yǐ tā wéi bǎngyàng, hǎohǎoxuéxí."}, {"id": "c6bafc53a", "k": "c", "t": "form", "s": "他不是不想帮你，__是真的没时间。", "ok": ["而"], "no": ["则", "但", "所"], "en": "It's not that he doesn't want to help, he really has no time.", "why": "不是…而是… = not … but ….", "full": "他不是不想帮你，而是真的没时间。", "py": "Tā bú shì bùxiǎng bāng nǐ, érshì zhēnde méi shíjiān."}, {"id": "cc1322223", "k": "c", "t": "form", "s": "姐姐喜欢安静，妹妹__喜欢热闹。", "ok": ["则"], "no": ["而且", "所", "于"], "en": "The older sister likes quiet; the younger one, on the other hand, likes it lively.", "why": "则 = whereas (written).", "full": "姐姐喜欢安静，妹妹则喜欢热闹。", "py": "Jiějie xǐhuan ānjìng, mèimei zé xǐhuan rènao."}, {"id": "ce06ae6f5", "k": "c", "t": "form", "s": "鲁迅生__1881年。", "ok": ["于"], "no": ["之", "所", "而"], "en": "Lu Xun was born in 1881.", "why": "Written 生于 = spoken 出生在 / 是…出生的.", "full": "鲁迅生于1881年。", "py": "Lǔ Xùn shēngyú 1881 nián."}, {"id": "c2a96390b", "k": "c", "t": "form", "s": "一开始乔尔根本不想照顾艾莉，只是把她__一个任务。", "ok": ["当成", "当作"], "no": ["以为", "作为了", "成为"], "en": "At first Joel didn't want to look after Ellie, he just treated her as a job.", "why": "From your Last of Us recording: 把…当成 = treat as.", "full": "一开始乔尔根本不想照顾艾莉，只是把她当成一个任务。", "py": "Yì kāishǐ Qiáo'ěr gēnběn bùxiǎng zhàogù Àilì, zhǐshì bǎ tā dàngchéng yíge rènwù.", "clip": ["audio-6/018.webm", 128.94, 135.69]}, {"id": "c1c93943f", "k": "c", "t": "form", "s": "那久而久__，这种氛围呢，实际上就形成了一种潜规则。", "ok": ["之"], "no": ["的", "所", "而"], "en": "Over time, this atmosphere actually turned into an unwritten rule.", "why": "From the 996 podcast: 久而久之 = over time.", "full": "那久而久之，这种氛围呢，实际上就形成了一种潜规则。", "py": "Nà jiǔ'érjiǔzhī, zhèzhǒng fēnwéi ne, shíjìshàng jiù xíngchéng le yìzhǒng qiánguīzé.", "clip": ["audio-6/004.webm", 618.27, 622.96]}, {"id": "mf4680c27", "k": "m", "t": "mod", "s": "不想吃就别吃**呗**。", "q": "What does 呗 add?", "a": "\"So just don't, simple as that\" (a shrug)", "no": ["A polite request", "A question", "Surprise"], "why": "呗 sounds resigned or dismissive."}, {"id": "ma2929fcf", "k": "m", "t": "mod", "s": "他是新来的**嘛**，不知道很正常。", "q": "What does 嘛 add?", "a": "\"Obviously\" — he's new, you know that", "no": ["\"Is he new?\"", "\"Let's say he's new\"", "Anger"], "why": "嘛 reminds the listener of something obvious."}, {"id": "m908c87ab", "k": "m", "t": "mod", "s": "你是北京人**吧**？", "q": "What does 吧 add?", "a": "You think so and want confirmation", "no": ["You have no idea", "You're surprised", "You're giving an order"], "why": "吧 = \"…, right?\""}, {"id": "m71bbb8e5", "k": "m", "t": "mod", "s": "你知道**吗**？ / 你知道**嘛**。 / 你知道**吧**？", "q": "Which one asks a real question?", "a": "你知道吗？", "no": ["你知道嘛。", "你知道吧？", "None of them"], "why": "吗 asks; 嘛 asserts it's obvious; 吧 seeks agreement."}, {"id": "m7d5c2c0e", "k": "m", "t": "lim", "s": "她叫什么来着？", "q": "What is the speaker doing?", "a": "Trying to remember a name they knew", "no": ["Asking for the first time", "Saying they don't care", "Complaining"], "why": "来着 = \"what was it again?\""}, {"id": "m877ad046", "k": "m", "t": "lim", "s": "我只是问问**而已**。", "q": "What does 而已 add?", "a": "\"Just asking, nothing more\"", "no": ["\"I asked many times\"", "\"I'm asking again\"", "\"I must know\""], "why": "而已 plays it down."}, {"id": "mf1d6bb16", "k": "m", "t": "pass", "s": "我的钱包**给**人偷了。", "q": "What is 给 doing here?", "a": "Passive marker (colloquial), like 被", "no": ["The verb \"to give\"", "\"For\" someone", "\"Let\""], "why": "给 + agent + verb: colloquial passive."}, {"id": "mbb4a241e", "k": "m", "t": "pass", "s": "他**让**我去。 / 我的车**让**人开走了。", "q": "How does 让 differ in the two sentences?", "a": "\"let / make\" in the first, passive \"by\" in the second", "no": ["Passive in both", "\"let\" in both", "\"give\" in the second"], "why": "让 is ambiguous: only context shows it is a passive."}, {"id": "m1b7fce20", "k": "m", "t": "pass", "s": "饭做好了。", "q": "Why is there no 被?", "a": "Food obviously can't cook itself, so no marker is needed", "no": ["It is a mistake", "It means \"I cooked\"", "被 is only for people"], "why": "\"Notional passive\": very common for neutral events."}, {"id": "mfa8830b8", "k": "m", "t": "adv", "s": "他**才**十八岁。 / 他**只**十八岁。", "q": "What does 才 add that 只 doesn't?", "a": "The speaker's feeling: \"that's so young!\"", "no": ["Nothing, they are identical", "A past tense", "\"Already\""], "why": "才 is evaluative; 只 is a neutral limit."}, {"id": "m34a0518d", "k": "m", "t": "adv", "s": "他八点**就**来了。 / 他八点**才**来。", "q": "What do the two sentences say about 8 o'clock?", "a": "就: earlier than expected; 才: later than expected", "no": ["Both: on time", "就: later; 才: earlier", "They mean the same"], "why": "就 and 才 encode the speaker's expectation."}, {"id": "m39327b05", "k": "m", "t": "frame", "s": "除了他以外，我们**都**去了。", "q": "Did he go?", "a": "No — everyone except him went", "no": ["Yes, and so did we", "We don't know", "Only he went"], "why": "除了…都 = except."}, {"id": "me8d748bf", "k": "m", "t": "frame", "s": "除了他以外，我们**也**去了。", "q": "Did he go?", "a": "Yes — he went, and we went too", "no": ["No", "Only we went", "Nobody went"], "why": "除了…也/还 = besides."}, {"id": "me0d22650", "k": "m", "t": "q", "s": "你去不去？", "q": "How does this differ from 你去吗？", "a": "More direct or insistent: \"are you going or not?\"", "no": ["It asks where you're going", "It is rude and wrong", "It means \"you're not going\""], "why": "A-not-A questions are neutral-to-insistent."}, {"id": "m789193dd", "k": "m", "t": "dir", "s": "他们开始**笑起来**。", "q": "Literal or figurative?", "a": "Figurative: start laughing", "no": ["Literal: stand up laughing", "Literal: laugh upwards", "Laugh quietly"], "why": "起来 = begin and continue."}, {"id": "md85164ee", "k": "m", "t": "dir", "s": "看起来要下雨了。", "q": "What does 看起来 mean here?", "a": "It looks like / it seems", "no": ["Look up", "Start watching", "Look again"], "why": "看起来 / 听起来 = \"seems\"."}, {"id": "m14b2f202", "k": "m", "t": "dir", "s": "你**说下去**。", "q": "What does 下去 mean here?", "a": "Keep talking, go on", "no": ["Talk quietly", "Say it downstairs", "Stop talking"], "why": "下去 = continue."}, {"id": "m36114a77", "k": "m", "t": "form", "s": "这是我**所**知道的。", "q": "Which everyday sentence means the same?", "a": "这是我知道的。", "no": ["这是我以为的。", "这是所有我知道。", "我知道这里。"], "why": "所 is optional and formal here."}, {"id": "mb349d493", "k": "m", "t": "form", "s": "他**生于**上海。", "q": "Which everyday sentence means the same?", "a": "他是在上海出生的。", "no": ["他住在上海。", "他在上海生病了。", "他从上海来。"], "why": "生于 = was born in."}, {"id": "me1ced87a", "k": "m", "t": "form", "s": "学**而**不思则罔。（论语）", "q": "What does 而 do here?", "a": "\"and yet / but\": links two actions in contrast", "no": ["\"so\"", "\"because\"", "\"if\""], "why": "Classical 而 links verbs: study but not think."}, {"id": "m7d627c3c", "k": "m", "t": "form", "s": "不进**则**退。", "q": "What does 则 mean here?", "a": "\"then\": if you don't advance, then you fall back", "no": ["\"but\"", "\"because\"", "\"also\""], "why": "Conditional 则."}, {"id": "m40e40310", "k": "m", "t": "form", "s": "我们以客户**为**中心。", "q": "Which everyday sentence means the same?", "a": "我们把客户当作最重要的。", "no": ["我们在客户中心。", "我们为客户工作。", "客户以我们为中心。"], "why": "以…为… = take … as …."}, {"id": "fe9a0a7d5", "k": "f", "t": "mod", "toks": [["你", 0], ["去", 0], ["不", 0], ["去", 0], ["吗", 1], ["？", 0]], "full": "你去不去？", "py": "Nǐ qù bu qù?", "why": "A-not-A questions don't take 吗.", "s": "你去不去吗？"}, {"id": "f98b44f94", "k": " "adv", "toks": [["明天", 0], ["你", 0], ["又", 1], ["来", 0], ["吧", 0], ["。", 0]], "full": "明天你再来吧。", "py": "Míngtiān nǐ zài lái ba.", "why": "A repeat still to come (and not certain): 再.", "s": "明天你又来吧。"}, {"id": "f3ef49fb7", "k": "f", "t": "adv", "toks": [["他", 0], ["九", 0], ["点", 0], ["才", 0], ["来", 0], ["了", 1], ["。", 0]], "full": "他九点才来。", "py": "Tā jiǔdiǎn cái lái.", "why": "才 (\"not until\") does not take 了.", "s": "他九点才来了。"}, {"id": "f198f3d41", "k": "f", "t": "frame", "toks": [["我", 0], ["一", 0], ["回", 0], ["家", 0], ["了", 1], ["就", 0], ["睡觉", 0], ["。", 0]], "full": "我一回家就睡觉。", "py": "Wǒ yì huíjiā jiù shuìjiào.", "why": "No 了 after the first verb in 一…就.", "s": "我一回家了就睡觉。"}, {"id": "f801c0321", "k": "f", "t": "frame", "toks": [["他", 0], ["连", 0], ["饭", 0], ["还", 1], ["没", 0], ["吃", 0], ["。", 0]], "full": "他连饭都没吃。", "py": "Tā lián fàn dōu méi chī.", "why": "连 needs 都 or 也: 他连饭都没吃.", "s": "他连饭还没吃。"}, {"id": "ff4c58c36", "k": "f", "t": "frame", "toks": [["除了", 0], ["英语", 0], ["以外", 0], ["，", 0], ["他", 0], ["都", 1], ["会", 0], ["说", 0], ["法语", 0], ["。", 0]], "full": "除了英语以外，他还会说法语。", "py": "Chúle Yīngyǔ yǐwài, tā hái huì shuō Fǎyǔ.", "why": "\"Besides English, he also speaks French\": 除了…还/也. 都 would mean \"except\".", "s": "除了英语以外，他都会说法语。"}, {"id": "fb299bcd0", "k": "f", "t": "q", "toks": [["你", 0], ["喝", 0], ["茶", 0], ["或者", 1], ["咖啡", 0], ["？", 0]], "full": "你喝茶还是咖啡？", "py": "Nǐ hēchá hái shì kāfēi?", "why": "\"Or\" in a question that asks you to choose: 还是.", "s": "你喝茶或者咖啡？"}, {"id": "f14f2e39f", "k": "f", "t": "q", "toks": [["这", 0], ["个", 0], ["菜", 0], ["很", 1], ["好", 0], ["不", 0], ["好", 0], ["吃", 0], ["？", 0]], "full": "这个菜好不好吃？", "py": "Zhège cài hǎo bu hǎochī?", "why": "A-not-A questions don't take 很.", "s": "这个菜很好不好吃？"}, {"id": "f38c7192b", "k": "f", "t": "q", "toks": [["我", 0], ["今天", 0], ["或者", 0], ["明天", 0], ["去", 0], ["。", 0]], "full": "我今天或者明天去。", "py": "Wǒ jīntiān huòzhě míngtiān qù.", "why": "No mistake: 或者 in a statement.", "s": "我今天或者明天去。"}, {"id":   h+=S.tab==='learn'?learnHTML():pracHTML();
  $('app').innerHTML=h;
  $('app').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();home()});
  $('app').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();home()});
  $('app').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>start(items(S.mode,b.dataset.go==='*'?null:b.dataset.go)));
  $('app').querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>{S.mode='mix';save();start(items('mix',b.dataset.learn))});
  const h1=$('hint');if(h1)h1.onclick=()=>{S.hint=!S.hint;save();home()};
  const mi=$('miss');if(mi)mi.onclick=()=>start(D.items.filter(it=>S.res[it.id]===0));
  scrollTo(0,0)}
function pracHTML(){
  let h=`<div class="opts"><span class="lab">Exercise</span>${Object.entries(MODES).map(([k,[z,l]])=>`<button class="chip" type="button" data-mode="${k}" aria-pressed="${S.mode===k}"><span class="zh">${z}</span> ${esc(l)}</button>`).join('')}</div>
  <div class="opts"><span class="lab">Hints</span><button class="chip" type="button" id="hint" aria-pressed="${S.hint}">Show the English before I answer</button></div>`;
  const all=items(S.mode),miss=D.items.filter(it=>S.res[it.id]===0).length;
  h+=`<div class="special"><button class="btn pri" type="button" data-go="*">All topics · ${all.length}</button>${miss?`<button class="btn" type="button" id="miss">Redo my mistakes · ${miss}</button>`:''}</div><h2>Topics</h2><div class="sets">`;
  D.topics.forEach((t,i)=>{const L=items(S.mode,t.id);if(!L.length)return;const m=L.filter(it=>S.res[it.id]===2).length;
    h+=`<button class="set" type="button" data-go="${t.id}"><span class="no">${i+1}<b>${esc(t.zh.split(' · ')[0])}</b></span><span class="t">${esc(t.en)}<small class="zh">${esc(t.sub)}</small></span><span class="sc"><b>${m}</b> / ${L.length}</span><span class="bar"><i style="width:${Math.round(100*m/L.length)}%"></i></span></button>`});
  return h+'</div><p class="note">Sentences marked 🎧 come from your 播客 recordings, with their audio.</p>'}
function learnHTML(){let h='';D.topics.forEach(t=>{h+=`<h2>${esc(t.zh)} · ${esc(t.en)}</h2><div class="cl">`;
  (D.learn[t.id]||[]).forEach(([f,m,ex])=>{h+=`<div class="cn"><div class="f zh">${esc(f)}</div><div class="m">${esc(m)}</div>${ex.map(e=>`<div class="ex zh">${esc(e)}</div>`).join('')}</div>`});
  h+=`</div><div class="row" style="margin-top:8px"><button class="btn" type="button" data-learn="${t.id}">Practise ${esc(t.zh.split(' · ')[0])}</button></div>`});return h}

let R=null;
function start(L){if(!L.length)return;const n=Math.min(12,L.length);
  const fresh=L.filter(it=>S.res[it.id]!==2),pool=shuffle(fresh).concat(shuffle(L.filter(it=>S.res[it.id]===2)));
  R={items:pool.slice(0,n),k:0,log:[],again:new Set()};document.body.classList.add('inround');item()}
function card(inner){const it=R.cur.it,t=TOP[it.t],pct=Math.round(100*R.k/R.items.length);
  return `<button class="back" type="button" id="bk">‹ Topics</button><div class="card"><div class="prog"><span>${R.k+1} / ${R.items.length} · <span class="zh">${esc(t.zh)}</span></span><span class="pbar"><i style="width:${pct}%"></i></span></div>${inner}<div id="fb"></div><div class="row" id="nx" hidden><span class="sp"></span><button class="btn pri" type="button" id="next">Next ›</button></div></div>`}
function clipBtn(it){return it.clip?`<button class="pb" type="button" id="clip" aria-label="Play the recording">${PLAY}</button>`:''}
function item(){const it=R.items[R.k];R.cur={it,done:false};let h;
  const en=S.hint&&it.en?`<div class="prompt-en">${esc(it.en)}</div>`:'';
  if(it.k==='c'){const opts=shuffle(it.ok.concat(it.no));R.cur.opts=opts;
    const [a,b]=it.s.split('__');
    h=card(`<div class="play">${clipBtn(it)}<div class="small">${it.clip?'🎧 From your recording · ':''}Choose the word for the gap</div></div><div class="gapq zh">${esc(a)}<span class="gp">？</span>${esc(b)}</div>${en}
      <div class="opts ch" id="oc">${opts.map((o,j)=>`<button class="opt zh" type="button" data-j="${j}"><span class="k">${j+1}</span>${esc(o)}</button>`).join('')}</div>`)}
  else if(it.k==='m'){const opts=shuffle([it.a].concat(it.no));R.cur.opts=opts;
    h=card(`<div class="small">What does it mean?</div><div class="han">${hl(it.s)}</div><div class="use">${esc(it.q)}</div>
      <div class="opts ch" id="oc">${opts.map((o,j)=>`<button class="opt" type="button" data-j="${j}"><span class="k">${j+1}</span>${esc(o)}</button>`).join('')}</div>`)}
  else{h=card(`<div class="small">Tap the wrong word — or say there is no mistake</div><div class="fixs zh">${it.toks.map((t,j)=>`<button class="ftok" type="button" data-f="${j}">${esc(t[0])}</button>`).join('')}</div>
      <div class="row"><button class="btn" type="button" id="none">✓ No mistake</button></div>`)}
  $('app').innerHTML=h;
  $('bk').onclick=home;const cb=$('clip');if(cb)cb.onclick=()=>playClip(it.clip,cb);
  document.querySelectorAll('#oc .opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  document.querySelectorAll('.ftok').forEach(b=>b.onclick=()=>fixTap(+b.dataset.f));
  const nb=$('none');if(nb)nb.onclick=()=>fixTap(-1);
  $('next').onclick=next;scrollTo(0,0)}
function answer(j){const c=R.cur,it=c.it;if(c.done)return;const o=c.opts[j];
  const good=it.k==='c'?it.ok.includes(o):o===it.a;
  document.querySelectorAll('#oc .opt').forEach((b,k)=>{const v=c.opts[k];const right=it.k==='c'?it.ok.includes(v):v===it.a;
    if(right)b.classList.add('ok');else if(k===j)b.classList.add('bad');b.disabled=true});
  finish(good)}
function fixTap(j){const c=R.cur,it=c.it;if(c.done)return;const errs=it.toks.map((t,k)=>t[1]?k:-1).filter(k=>k>=0);
  const good=j<0?!errs.length:errs.includes(j);
  document.querySelectorAll('.ftok').forEach((b,k)=>{if(errs.includes(k))b.classList.add('err');else if(k===j)b.classList.add('bad');b.disabled=true});
  const nb=$('none');if(nb){nb.disabled=true;if(!errs.length)nb.classList.add('pri')}
  finish(good)}
function finish(good){const c=R.cur,it=c.it;c.done=true;
  S.res[it.id]=good?2:0;S.stat.all++;if(good){S.stat.ok++;S.stat.streak++}else S.stat.streak=0;save();
  R.log.push([it,good]);if(!good&&!R.again.has(it.id)){R.again.add(it.id);R.items.push(it)}
  const also=it.k==='c'&&it.ok.length>1?`<div>Also right: <span class="zh">${it.ok.map(esc).join(' · ')}</span></div>`:'';
  const full=it.full?`<div class="han">${esc(it.full)}</div>`:'';
  $('fb').innerHTML=`<div class="fb ${good?'ok':'bad'}"><div class="v">${good?'✓ Right':'✗ Not quite'}</div>${full}${it.py?`<div class="py">${esc(it.py)}</div>`:''}${it.en?`<div class="en">${esc(it.en)}</div>`:''}${also}<div>${esc(it.why)}</div></div>`;
  $('nx').hidden=false;$('next').focus({preventScroll:true});
  if(it.clip&&!good){}}
function next(){R.k++;if(R.k<R.items.length)item();else summary()}
function summary(){const L=R.log,first=new Map();L.forEach(([it,g])=>{if(!first.has(it.id))first.set(it.id,g)});
  const ok=[...first.values()].filter(Boolean).length,n=first.size;
  $('app').innerHTML=`<div class="card"><div class="done"><div class="big">${ok} / ${n}</div><div>right first time</div>
    <div class="mini">${[...first.entries()].map(([id,g])=>{const it=D.items.find(x=>x.id===id);return `<div><span class="mk ${g?'g1':'g0'}">${g?'✓':'✗'}</span><span class="han">${esc(it.full||it.s.replace(/\*\*/g,''))}</span></div>`}).join('')}</div>
    <div class="row"><button class="btn" type="button" id="hm">Topics</button><button class="btn pri" type="button" id="again">Another round</button></div></div></div>`;
  const last=R.items;$('hm').onclick=home;$('again').onclick=()=>start(last.filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i))}
addEventListener('keydown',e=>{if(!R||e.ctrlKey||e.metaKey||e.altKey)return;const c=R.cur;if(!c)return;
  if(e.key==='Enter'&&c.done){e.preventDefault();next();return}
  if(/^[1-9]$/.test(e.key)&&!c.done){const b=document.querySelector(`#oc .opt[data-j="${+e.key-1}"]`);if(b){e.preventDefault();b.click()}}
  if((e.key==='0'||e.key==='n')&&!c.done&&$('none')){e.preventDefault();$('none').click()}
  if(e.key==='Escape'){e.preventDefault();home()}});
head();home();

</script>
</body></html>
