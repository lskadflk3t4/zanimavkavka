window.__mgate={count:function(){return Object.keys(S.miss).length},start:function(){go('practise');run(Object.keys(S.miss),'mix')}};
window.__dpDue=function(){return R.due().length};
var go=Tabs(function(t){if(t==='practise')drawPractise();if(t==='miss')drawMiss();if(t==='verbs')drawVerbs();if(t==='groups')drawGroups();if(t==='stats')drawStats()});
function pool(){return VERBS.filter(function(v){return (!S.set.g||v.g===S.set.g)&&(!S.set.t||v.t.indexOf(S.set.t)>=0)})}
function drawPractise(){var v=$('#v-practise');
  var typs=uniq(VERBS.map(function(x){return x.t})).sort();
  v.innerHTML='<div class="modes">'+Object.keys(MODES).map(function(k){return '<button class="mode" data-m="'+k+'" aria-pressed="'+(S.set.mode===k)+'"><b>'+esc(MODES[k][0])+'</b><small>'+esc(MODES[k][1])+'</small></button>'}).join('')+'</div>'+
   '<div class="filters"><select id="fg" aria-label="Vowel group"><option value="">All vowel groups</option>'+GROUPS.map(function(g){return '<option'+(S.set.g===g.p?' selected':'')+' value="'+esc(g.p)+'">'+esc(g.p)+(g.card?'':' (auto)')+' · '+g.v.length+'</option>'}).join('')+'</select>'+
   '<select id="ft" aria-label="Verb type"><option value="">All verb types</option>'+typs.map(function(t){return '<option'+(S.set.t===t?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select>'+
   '<select id="fn" aria-label="Questions"><option value="10">10 questions</option><option value="15">15 questions</option><option value="25">25 questions</option><option value="40">40 questions</option></select></div>'+
   '<p class="muted" id="pinfo"></p><div class="row"><button class="pri" id="start">Start →</button>'+(R.due().length?'<button class="ghost" id="sdue">Review '+R.due().length+' due verbs</button>':'')+'</div><div id="run"></div>';
  $('#fn').value=String(S.set.n);
  function info(){var p=pool(),n=p.filter(function(x){return !S.cards[x.i]}).length;$('#pinfo').textContent=p.length+' verbs in this selection · '+n+' not practised yet · '+p.filter(function(x){return R.isDue(x.i)}).length+' due'}info();
  $$('.mode',v).forEach(function(b){b.addEventListener('click',function(){S.set.mode=b.dataset.m;S.save();$$('.mode',v).forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});
  $('#fg').addEventListener('change',function(){S.set.g=this.value;S.save();info()});$('#ft').addEventListener('change',function(){S.set.t=this.value;S.save();info()});$('#fn').addEventListener('change',function(){S.set.n=+this.value;S.save()});
  $('#start').addEventListener('click',function(){run(null,S.set.mode)});var sd=$('#sdue');if(sd)sd.addEventListener('click',function(){run(R.due(),S.set.mode)})}
/* ---------- a practice run ---------- */
function run(ids,mode){var p=ids?ids.map(function(i){return BY[i]}).filter(Boolean):pool();if(!p.length){$('#run').innerHTML='<p class="muted">No verbs match these filters.</p>';return}
  var n=ids?Math.min(Math.max(ids.length,5),S.set.n):S.set.n;var order=p.map(function(v){return [R.pri(v.i),v]}).sort(function(a,b){return b[0]-a[0]}).map(function(x){return x[1]});
  var q=[];for(var i=0;i<n;i++){var v=order[i%order.length];var m=mode==='mix'?pick(['stamm','stamm','konj','konj','aux','group','mean']):mode;if(m==='group'&&!v.g)m='stamm';q.push({v:v,m:m})}
  var host=$('#v-practise');host.innerHTML='<div class="panel" id="qp"></div>';var panel=$('#qp'),k=0,log=[];
  function next(){if(k>=q.length)return finish();ask(q[k])}
  function finish(){var ok=log.filter(function(x){return x.ok}).length;
    panel.innerHTML='<div class="done"><h3>'+(ok===log.length?'Perfekt! 🎉':ok>=log.length*.7?'Gut gemacht!':'Weiter üben!')+'</h3><p>'+ok+' / '+log.length+' correct</p><ul class="rev">'+log.map(function(x){return '<li class="'+(x.ok?'ok':'bad')+'">'+(x.ok?'✓ ':'✗ ')+pline(x.v)+'</li>'}).join('')+'</ul><div class="row"><button class="pri" id="again">Another round →</button><button class="ghost" id="menu">Change mode</button></div></div>';
    $('#again').addEventListener('click',function(){var left=uniq(Object.keys(S.miss).concat(R.due()));run(ids?(left.length?left:null):null,mode)});$('#menu').addEventListener('click',drawPractise)}
  function head(t,sub){return '<div class="qh"><span>'+(k+1)+' / '+q.length+'</span><span>'+esc(MODES[t][0])+'</span></div>'+sub}
  function fb(ok,html){var f=$('#fb');f.className='fb '+(ok?'ok':'bad');f.innerHTML=(ok?'✓ Richtig! ':'✗ Not quite. ')+html+' <button class="pri" id="nx">Next →</button>';$('#nx').addEventListener('click',function(){k++;next()});try{f.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}
  function solved(v){return '<div style="margin-top:6px">'+pline(v)+' <span class="pill">'+esc(v.g||v.t)+'</span> <button class="ghost" data-tbl="'+esc(v.i)+'" style="min-height:30px;padding:2px 10px">Full table</button></div>'}
  function bindTbl(){$$('[data-tbl]',panel).forEach(function(b){b.addEventListener('click',function(){sheet(b.dataset.tbl)})})}
  function umls(){return '<div class="umls" aria-label="Insert a letter">'+['ä','ö','ü','ß'].map(function(c){return '<button type="button" data-c="'+c+'">'+c+'</button>'}).join('')+'</div>'}
  var lastInput=null;
  function bindUml(){$$('.tin input',panel).forEach(function(i){i.addEventListener('focus',function(){lastInput=i})});$$('.umls button',panel).forEach(function(b){b.addEventListener('mousedown',function(e){e.preventDefault()});b.addEventListener('click',function(){var i=lastInput||$('.tin input',panel);if(!i)return;var s=i.selectionStart||i.value.length;i.value=i.value.slice(0,s)+b.dataset.c+i.value.slice(i.selectionEnd||s);i.focus();i.setSelectionRange(s+1,s+1)})})}
  function rec(v,ok,qv,m,why){log.push({v:v,ok:ok});R.grade(v.i,ok,qv,m,why)}
  function choice(opts,correct,cb){var h='<div class="opts">'+opts.map(function(o,i){return '<button class="opt" data-v="'+esc(o)+'"><kbd>'+(i+1)+'</kbd>'+esc(o)+'</button>'}).join('')+'</div>';setTimeout(function(){$$('.opt',panel).forEach(function(b){b.addEventListener('click',function(){if(panel.dataset.lock)return;panel.dataset.lock=1;var ok=correct.indexOf(b.dataset.v)>=0;$$('.opt',panel).forEach(function(x){if(correct.indexOf(x.dataset.v)>=0)x.classList.add('right');else if(x===b)x.classList.add('wrong');x.disabled=true});cb(ok,b.dataset.v)})})},0);return h}
  function ask(it){var v=it.v,m=it.m;delete panel.dataset.lock;var imp=v.imp,P3=imp?'es':'er/sie/es';
    if(m==='stamm'){var exp=[third(v,'pres'),third(v,'past'),third(v,'perf')],lab=[P3+' · Präsens',P3+' · Präteritum',P3+' · Perfekt'];
      panel.innerHTML=head(m,'<div class="qp"><span class="em">'+esc(v.i)+'</span></div><div class="qs">'+esc(v.en)+(imp?' · impersonal, use the es-form':'')+'</div><form class="tin" id="f">'+lab.map(function(l,i){return '<label><span>'+esc(l)+'</span><input autocomplete="off" autocapitalize="off" spellcheck="false" data-i="'+i+'" placeholder="'+(i===2?'hat/ist + Partizip':'')+'"><b class="sol"></b></label>'}).join('')+umls()+'<div class="row"><button class="pri">Check</button></div></form><div id="fb" class="fb"></div>');
      bindUml();$('#f').addEventListener('submit',function(e){e.preventDefault();if(panel.dataset.lock)return;var ins=$$('#f input'),bad=[];panel.dataset.lock=1;
        ins.forEach(function(inp,i){var ok=same(inp.value,exp[i]);inp.classList.add(ok?'ok':'bad');inp.readOnly=true;if(!ok){bad.push(['Präsens','Präteritum','Perfekt'][i]);inp.parentNode.querySelector('.sol').textContent=exp[i]}});
        rec(v,!bad.length,2,m,bad.join(', '));fb(!bad.length,solved(v));bindTbl()});setTimeout(function(){try{$('#f input').focus()}catch(x){}},30);return}
    if(m==='konj'){var ps=imp?Object.keys(v.pres):PERS,pr=pick(ps),tn=pick(['pres','past','perf','past','perf']),e2=v[tn][pr];
      panel.innerHTML=head(m,'<div class="qp">'+esc(pr)+' <span class="em">___</span></div><div class="qs"><b>'+esc(v.i)+'</b> ('+esc(v.en)+') · <b>'+TENSE[tn]+'</b></div><form class="tin" id="f"><label><span>'+esc(pr)+'</span><input autocomplete="off" autocapitalize="off" spellcheck="false"><b class="sol"></b></label>'+umls()+'<div class="row"><button class="pri">Check</button></div></form><div id="fb" class="fb"></div>');
      bindUml();$('#f').addEventListener('submit',function(e){e.preventDefault();if(panel.dataset.lock)return;var inp=$('#f input');if(!inp.value.trim())return;panel.dataset.lock=1;var ok=same(inp.value,e2);inp.classList.add(ok?'ok':'bad');inp.readOnly=true;if(!ok)$('#f .sol').textContent=pr+' '+e2;
        rec(v,ok,2,m,TENSE[tn]+' '+pr);fb(ok,'<b>'+esc(pr+' '+e2)+'</b>'+solved(v));bindTbl()});setTimeout(function(){try{$('#f input').focus()}catch(x){}},30);return}
    if(m==='aux'){var pp=alts(v.pp)[0],cor=v.aux==='sein'?['ist']:v.aux==='haben'?['hat']:['hat','ist'];
      panel.innerHTML=head(m,'<div class="qp">'+(imp?'Es':'Er')+' <span class="gap">___</span> '+esc(pp)+'.</div><div class="qs">'+esc(v.i)+' — '+esc(v.en)+'</div>'+choice(['hat','ist'],cor,function(ok,a){rec(v,ok,1,m,'Perfekt with '+(v.aux));fb(ok,'Perfekt with <b>'+esc(v.aux)+'</b>'+(v.aux==='sein'?' — movement or change of state':'')+'.'+solved(v));bindTbl()})+'<div id="fb" class="fb"></div>');return}
    if(m==='group'){var others=shuffle(GROUPS.map(function(g){return g.p}).filter(function(p){return p!==v.g&&p.indexOf('Irregular')<0&&p!=='Modal Verbs'})).slice(0,3),os=shuffle(others.concat([v.g]));
      panel.innerHTML=head(m,'<div class="qp"><span class="em">'+esc(v.i)+'</span></div><div class="qs">'+esc(v.en)+' · Which vowel pattern? (infinitive – [du/er-Präsens] – Präteritum – Partizip II)</div>'+choice(os,[v.g],function(ok){rec(v,ok,1,m,'vowel pattern');var G=GROUPS.filter(function(g){return g.p===v.g})[0];fb(ok,'<b>'+esc(v.g)+'</b>'+solved(v)+(G&&G.v.length>1?'<div class="muted">Same pattern: '+esc(G.v.filter(function(x){return x!==v.i}).slice(0,10).join(', '))+'</div>':''));bindTbl()})+'<div id="fb" class="fb"></div>');return}
    if(m==='mean'){if(Math.random()<.5){var ds=shuffle(VERBS.filter(function(x){return x.i!==v.i})).slice(0,3).map(function(x){return x.en}),os2=shuffle(ds.concat([v.en]));
        panel.innerHTML=head(m,'<div class="qp"><span class="em">'+esc(v.i)+'</span></div><div class="qs">What does it mean?</div>'+choice(os2,[v.en],function(ok){rec(v,ok,1,m,'meaning');fb(ok,solved(v));bindTbl()})+'<div id="fb" class="fb"></div>');return}
      panel.innerHTML=head(m,'<div class="qp">'+esc(v.en)+'</div><div class="qs">Type the German infinitive.</div><form class="tin" id="f"><label><span>Infinitiv</span><input autocomplete="off" autocapitalize="off" spellcheck="false"><b class="sol"></b></label>'+umls()+'<div class="row"><button class="pri">Check</button></div></form><div id="fb" class="fb"></div>');
      bindUml();$('#f').addEventListener('submit',function(e){e.preventDefault();if(panel.dataset.lock)return;var inp=$('#f input');if(!inp.value.trim())return;panel.dataset.lock=1;var a=norm(inp.value),ok=a===norm(v.i)||VERBS.some(function(x){return x.en===v.en&&norm(x.i)===a});inp.classList.add(ok?'ok':'bad');inp.readOnly=true;if(!ok)$('#f .sol').textContent=v.i;rec(v,ok,2,m,'meaning');fb(ok,solved(v));bindTbl()});setTimeout(function(){try{$('#f input').focus()}catch(x){}},30)}}
  next()}
/* ---------- reference ---------- */
function sheet(i){var v=BY[i];var h=$('#sheet');var keys=v.imp?Object.keys(v.pres):PERS,c=S.cards[i];
  h.innerHTML='<div class="sheetb"><div class="sheet" role="dialog" aria-modal="true"><h2>'+esc(v.i)+'</h2><p class="muted">'+esc(v.en)+' · '+esc(v.t)+' · Perfekt with '+esc(v.aux)+(v.g?' · <span class="pill">'+esc(v.g)+'</span>':'')+'</p>'+
   '<table class="cj"><tr><th></th><th>Präsens</th><th>Präteritum</th><th>Perfekt</th></tr>'+keys.map(function(p){return '<tr><th>'+esc(p)+'</th><td>'+esc(v.pres[p]||'')+'</td><td>'+esc(v.past[p]||'')+'</td><td>'+esc(v.perf[p]||'')+'</td></tr>'}).join('')+'</table>'+(v.n?'<p class="muted">'+esc(v.n)+'</p>':'')+
   (c?'<p class="muted">Practised '+c.s+'× · right '+c.ok+' · wrong '+c.bad+' · next review '+(c.d<=Date.now()?'now':new Date(c.d).toLocaleDateString())+'</p>':'')+'<div class="row"><button class="pri" id="pr1">Practise this verb</button><button class="ghost" id="cl">Close</button></div></div></div>';
  $('#cl').addEventListener('click',function(){h.innerHTML=''});$('.sheetb').addEventListener('click',function(e){if(e.target===this)h.innerHTML=''});
  $('#pr1').addEventListener('click',function(){h.innerHTML='';go('practise');run([i,i,i,i,i],'mix')})}
function drawVerbs(){var v=$('#v-verbs');if(!$('#vq',v)){v.innerHTML='<div class="filters"><input id="vq" type="search" placeholder="Search German or English" style="flex:1;min-width:200px"><select id="vg"><option value="">All vowel groups</option>'+GROUPS.map(function(g){return '<option value="'+esc(g.p)+'">'+esc(g.p)+'</option>'}).join('')+'</select><select id="vs"><option value="">Any status</option><option>new</option><option>learning</option><option>known</option><option>mastered</option></select></div><p class="muted" id="vc"></p><div class="list" id="vl"></div>';
    ['vq','vg','vs'].forEach(function(id){$('#'+id).addEventListener(id==='vq'?'input':'change',list)})}
  list();function list(){var q=norm($('#vq').value),g=$('#vg').value,s=$('#vs').value;
    var r=VERBS.filter(function(x){return (!g||x.g===g)&&(!s||R.status(x.i)===s)&&(!q||norm(x.i+' '+x.en+' '+principal(x).join(' ')).indexOf(q)>=0)});$('#vc').textContent=r.length+' verbs';
    $('#vl').innerHTML=r.map(function(x){var p=principal(x);return '<button class="lrow" data-i="'+esc(x.i)+'" style="grid-template-columns:minmax(90px,1fr) minmax(90px,1fr) minmax(90px,1fr) minmax(120px,1.3fr) auto"><b>'+esc(p[0])+'</b><span>'+esc(p[1])+'</span><span>'+esc(p[2])+'</span><span>'+esc(p[3])+'<br><small class="muted">'+esc(x.en)+'</small></span><span class="pill st-'+R.status(x.i)+'">'+R.status(x.i)+(S.miss[x.i]?' ✗':'')+'</span></button>'}).join('');
    $$('#vl .lrow').forEach(function(b){b.addEventListener('click',function(){sheet(b.dataset.i)})})}}
function drawGroups(){var v=$('#v-groups');
  v.innerHTML='<p class="muted">Vowel patterns: infinitive – (du/er-Präsens, when it changes) – Präteritum – Partizip II. Groups from your deck come first; “auto” groups were worked out from the forms of the remaining verbs.</p><div class="rc">'+GROUPS.map(function(g,gi){var k=g.v.filter(function(i){var s=R.status(i);return s==='known'||s==='mastered'}).length;
    return '<div><b style="font-size:1.25rem">'+esc(g.p)+'</b><span>'+(g.card?'from your deck':'auto')+' · '+g.v.length+' verbs · '+k+' known</span><small>'+g.v.map(function(i){var x=BY[i];return '<a href="#" data-i="'+esc(i)+'">'+esc(i)+'</a> ('+esc(third(x,'past'))+', '+esc(alts(x.pp)[0])+')'}).join(' · ')+'</small><button class="ghost" data-g="'+gi+'">Practise this group</button></div>'}).join('')+'</div>';
  $$('[data-g]',v).forEach(function(b){b.addEventListener('click',function(){S.set.g=GROUPS[+b.dataset.g].p;S.set.t='';S.save();go('practise');run(null,S.set.mode)})});
  $$('a[data-i]',v).forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();sheet(a.dataset.i)})})}
function drawMiss(){var v=$('#v-miss'),ks=Object.keys(S.miss);
  v.innerHTML=ks.length?'<div class="row" style="margin-top:0"><button class="pri" id="rm">Redo '+ks.length+' mistakes →</button></div><div class="list" style="margin-top:12px">'+ks.map(function(i){var x=BY[i],m=S.miss[i];return x?'<button class="lrow" data-i="'+esc(i)+'" style="grid-template-columns:1fr auto">'+'<span>'+pline(x)+'<br><small class="muted">'+esc(x.en)+(m.w&&m.w.length?' · tripped on: '+esc(m.w.join('; ')):'')+'</small></span><span class="pill">'+m.n+'×</span></button>':''}).join('')+'</div>':'<p class="muted">No mistakes waiting. A verb lands here when you get it wrong and leaves after you get it right.</p>';
  var b=$('#rm');if(b)b.addEventListener('click',function(){go('practise');run(ks,'mix')});$$('.lrow',v).forEach(function(b){b.addEventListener('click',function(){sheet(b.dataset.i)})})}
function drawStats(){var v=$('#v-stats'),cnt={learning:0,known:0,mastered:0};Object.keys(S.cards).forEach(function(i){cnt[R.status(i)]++});
  var hard=Object.keys(S.cards).filter(function(i){return S.cards[i].bad&&BY[i]}).sort(function(a,b){return (S.cards[b].bad-S.cards[b].ok/3)-(S.cards[a].bad-S.cards[a].ok/3)}).slice(0,12);
  v.innerHTML='<div class="tot"><div><b>'+Object.keys(S.cards).length+' / '+VERBS.length+'</b><span>verbs practised</span></div><div><b>'+cnt.learning+'</b><span>learning</span></div><div><b>'+cnt.known+'</b><span>known (≥ 7 days)</span></div><div><b>'+cnt.mastered+'</b><span>mastered (≥ 21 days)</span></div><div><b>'+R.due().length+'</b><span>due now</span></div><div><b>'+streak(S)+'</b><span>day streak</span></div><div><b>'+accuracy7(S)+'</b><span>accuracy, 7 days</span></div></div>'+
   '<h3>Last 14 days</h3>'+chart14(S)+'<h3>By exercise</h3>'+typeStats(S,(function(){var o={};Object.keys(MODES).forEach(function(k){o[k]=MODES[k][0]});return o})())+
   '<h3>By vowel group</h3><div class="cats">'+GROUPS.map(function(g){var m=0,k=0;g.v.forEach(function(i){var s=R.status(i);if(s!=='new')m++;if(s==='known'||s==='mastered')k++});return '<div class="cat"><span>'+esc(g.p)+'</span><span class="bar"><i style="width:'+(m/g.v.length*100)+'%"></i><i class="k" style="width:'+(k/g.v.length*100)+'%"></i></span><small>'+m+' / '+g.v.length+'</small></div>'}).join('')+'</div>'+
   '<h3>Hardest verbs</h3>'+(hard.length?'<div class="hard">'+hard.map(function(i){return '<div>'+pline(BY[i])+'<br><small>'+S.cards[i].ok+' ✓ · '+S.cards[i].bad+' ✗</small></div>'}).join('')+'</div>':'<p class="muted">Nothing yet.</p>')+
   '<div class="row"><button class="ghost w" id="reset">Reset progress in this drill…</button></div>';
  $('#reset').addEventListener('click',function(){if(this.dataset.arm){S.cards={};S.miss={};S.days={};S.save();upd();drawStats();return}this.dataset.arm=1;this.textContent='Press again to erase all progress here'})}
upd();go('practise');

})();</script></body></html>
