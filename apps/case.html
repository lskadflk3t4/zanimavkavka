<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prepositions + case</title>
<style>
/* Layout: one centred practice column — language switcher, inner tabs, settings, the exercise card. HSK 4 Trainer palette. */
:root{
  --bg:#f2f4f0;--surface:#ffffff;--fg:#1c2421;--muted:#5d6b65;--line:#d5ddd8;--grid:#e3e9e5;
  --accent:#2f7a5f;--accent-ink:#ffffff;--soft:#e2efe9;
  --ok:#2f7a4a;--ok-bg:#e3f2e7;--bad:#b4442f;--bad-bg:#f8e6e1;--gold:#9a6a12;--gold-soft:#f6ecd6;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a18;--surface:#1c2422;--fg:#e6ece8;--muted:#97a6a0;--line:#2f3b37;--grid:#25302c;
  --accent:#6cc4a0;--accent-ink:#0f1a15;--soft:#1d3029;
  --ok:#7fd49a;--ok-bg:#1d3326;--bad:#f08f78;--bad-bg:#3a221d;--gold:#e0b45e;--gold-soft:#2f2717;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a18;--surface:#1c2422;--fg:#e6ece8;--muted:#97a6a0;--line:#2f3b37;--grid:#25302c;
  --accent:#6cc4a0;--accent-ink:#0f1a15;--soft:#1d3029;
  --ok:#7fd49a;--ok-bg:#1d3326;--bad:#f08f78;--bad-bg:#3a221d;--gold:#e0b45e;--gold-soft:#2f2717;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);
  padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,summary{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
h1{margin:0;font:700 clamp(1.6rem,4vw,2.15rem)/1.1 var(--f-display);letter-spacing:-.01em}
h1 span{color:var(--accent)}
.sub{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column;align-items:flex-end}
.stats b{font:700 1.25rem/1.15 var(--f-body)}
.stats span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
/* languages */
.langs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lang{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--fg);text-align:left;min-height:56px;min-width:0}
.lang svg{flex:none;width:30px;height:20px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.lang .lt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.lang .lt b{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang .lt small{color:var(--muted);font-size:.72rem}
.lang[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--soft)}
/* inner tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;color:var(--muted);padding:10px 14px 9px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:700;display:flex;align-items:center;gap:7px;min-height:46px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-size:.7rem;font-weight:700;background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px;min-width:1.6em;text-align:center}
.tab .cnt:empty{display:none}
/* settings */
.settings{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.settings summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700;min-height:48px}
.settings summary::-webkit-details-marker{display:none}
.settings summary .st{flex:1;min-width:0;color:var(--muted);font-weight:500;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.settings summary::after{content:"▾";color:var(--muted)}
.settings[open] summary::after{content:"▴"}
.sbody{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
.grp{display:flex;flex-direction:column;gap:7px}
.grp h3{margin:0;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:.84rem;font-weight:600;min-height:36px}
.chip small{color:var(--muted);font-weight:500;margin-left:3px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:var(--accent-ink);opacity:.8}
.quick{display:flex;gap:12px;font-size:.8rem}
.quick button{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--surface);color:var(--fg);font-weight:600;font-size:.85rem;padding:7px 14px;cursor:pointer;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* card */
.bar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 10px 8px 14px;border-radius:10px;background:var(--gold-soft);font-size:.9rem}
.bar b{color:var(--gold)}.bar .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.meta .mf{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:18px;height:12px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.ins{margin:0;color:var(--muted);font-size:.88rem;font-style:italic}
.sent{margin:0;font:500 clamp(1.2rem,3.4vw,1.55rem)/1.5 var(--f-display);overflow-wrap:anywhere}
.gap{display:inline-block;min-width:4.2em;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;text-align:center;padding:0 4px;line-height:1.25}
.gap.ok{color:var(--ok);border-color:var(--ok)}.gap.bad{color:var(--bad);border-color:var(--bad)}
.base{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.base .bw{font:700 1.05rem var(--f-display);letter-spacing:.06em;background:var(--soft);color:var(--accent);border-radius:8px;padding:5px 12px}
.base .ar{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
input.ans{flex:1 1 240px;min-width:0;font:500 1.25rem var(--f-display);padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input.ans:focus{border-color:var(--accent);outline:none}
input.ans.ok{border-color:var(--ok);background:var(--ok-bg)}input.ans.bad{border-color:var(--bad);background:var(--bad-bg)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;cursor:pointer;font:500 1.08rem var(--f-display);min-height:50px;overflow-wrap:anywhere}
.opt kbd{flex:none;font:700 .72rem var(--f-body);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border-radius:10px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.warn{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.hint{margin:0;font:500 1rem var(--f-display);color:var(--gold);letter-spacing:.06em}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.fb.ok{background:var(--ok-bg)}.fb.bad{background:var(--bad-bg)}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-weight:700}
.fb.ok .verdict{color:var(--ok)}.fb.bad .verdict{color:var(--bad)}
.trap{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold);border-radius:999px;padding:1px 9px}
.right{font:700 1.15rem var(--f-display)}
.right .alt{font:500 .88rem var(--f-body);color:var(--muted)}
.yours{font-size:.92rem}.yours s{font-family:var(--f-display);color:var(--bad)}
.exp{margin:0;font-size:.95rem;max-width:68ch}
.note{margin:0;font-size:.85rem;color:var(--muted)}
.done{text-align:center;padding:20px 8px;display:flex;flex-direction:column;gap:10px;align-items:center}
.done h2{margin:0;font:700 1.6rem var(--f-display)}
.empty{color:var(--muted);margin:0}
.foot{font-size:.8rem;color:var(--muted)}
kbd.k{font:600 .74rem var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
/* mistakes & overview */
.ph h2{margin:0;font:700 1.45rem var(--f-display)}
.ph p{margin:4px 0 0;color:var(--muted);max-width:66ch}
.howto{margin:0;font-size:.9rem;background:var(--soft);border-radius:10px;padding:10px 14px;max-width:72ch}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sect h3{margin:0;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.mrow svg{flex:none;width:22px;height:15px;margin-top:4px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.mm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mt{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.ms{font-family:var(--f-display);font-size:1.02rem;overflow-wrap:anywhere}
.ms b{color:var(--ok)}
.my{font-size:.86rem;color:var(--muted)}.my s{color:var(--bad);font-family:var(--f-display)}
.mx{flex:none;font-weight:700;color:var(--bad);font-variant-numeric:tabular-nums}
.ov{width:100%;border-collapse:collapse;font-size:.9rem}
.ov th,.ov td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.ov th{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ov td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.mbar{height:8px;border-radius:999px;background:var(--grid);overflow:hidden;display:flex;min-width:70px}
.mbar i{display:block;height:100%}.mbar .g{background:var(--ok)}.mbar .r{background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(-3px)}}}
.sml{display:none}
@media (max-width:640px){
  .card{display:flex;flex-direction:column}
  #fb{order:5}
  #acts{order:10;position:sticky;bottom:0;z-index:5;flex-wrap:nowrap;gap:6px;margin:2px -14px -16px;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 14px 14px;
    box-shadow:0 -10px 14px -12px rgba(0,0,0,.28)}
  #acts .btn{flex:1 1 0;min-width:0;padding:10px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lgl{display:none}.sml{display:inline}
  body{padding-top:12px}
  .wrap{gap:12px}
  header{flex-direction:column;align-items:stretch;gap:10px}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .stats div{align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 2px}
  .stats b{font-size:1.1rem}.stats span{font-size:.6rem;letter-spacing:.04em}
  .langs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:16px 14px}
  .opts{grid-template-columns:minmax(0,1fr)}
  input.ans{flex-basis:100%;min-height:52px}
  .actions .btn{flex:1 1 0;min-width:0;min-height:50px}
  .tab{flex:1 1 0;justify-content:center;padding:10px 6px 9px}
  .ov .hide-s{display:none}
}

/* translation tab (added) */
.grp[hidden]{display:none}
.trsrc{display:flex;align-items:baseline;gap:10px;margin:0;font:500 clamp(1.15rem,3.2vw,1.45rem)/1.45 var(--f-display);overflow-wrap:anywhere;min-width:0}
.trsrc>span:last-child,.trsrc .sent{min-width:0;flex:1}
.trsrc b{color:var(--accent)}
.lb{flex:none;align-self:center;font:700 .68rem/1 var(--f-body);letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--bg)}
.trtgt .lb{color:var(--accent);border-color:var(--accent)}
/* preposition drill additions */
.task{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;margin:2px 0}
.pp{font:700 1.25rem var(--f-display);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:4px 12px}
.plus{color:var(--muted);font-weight:700}
.wd{font:600 1.15rem var(--f-display);background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:4px 11px}
.badge{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;border:1px solid var(--gold);color:var(--gold);background:var(--gold-soft)}
.cue{font:700 1rem var(--f-display);color:var(--bad);background:var(--bad-bg);border-radius:999px;padding:3px 12px}
.ghint{font-size:.85rem;color:var(--muted)}
.casechip{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--soft);border-radius:999px;padding:2px 10px}
.exl{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.exl b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="ttl"></h1><p class="sub" id="subt"></p></div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-mode="practice">Practice</button>
    <button class="tab" role="tab" data-mode="tr" title="Translate RU ⇄ DE">Translate</button>
    <button class="tab" role="tab" data-mode="miss">Mistakes <span class="cnt" id="mcnt"></span></button>
    <button class="tab" role="tab" data-mode="over">Overview</button>
  </div>
  <section id="p-practice" role="tabpanel">
    <details class="settings" id="settings">
      <summary>Settings <span class="st" id="sumtxt"></span></summary>
      <div class="sbody">
        <div class="grp" data-for="tr"><h3>Direction</h3><div class="seg" id="dirseg"><button type="button" data-v="rd">RU → DE</button><button type="button" data-v="dr">DE → RU</button><button type="button" data-v="mix">Both</button></div></div>
        <div class="grp" data-for="tr"><h3>What to translate</h3><div class="chips" id="trk"></div>
          <div class="quick"><button type="button" data-q="trk" data-v="all">All</button><button type="button" data-q="trk" data-v="none">None</button></div></div>
        <div class="grp" data-for="tr"><h3>Word hints</h3><div class="seg" id="hintseg"><button type="button" data-v="on">Show</button><button type="button" data-v="off">Hide</button></div></div>
        <div class="grp" data-for="decl"><h3>What to decline</h3><div class="chips" id="types"></div>
          <div class="quick"><button type="button" data-q="types" data-v="all">All</button><button type="button" data-q="types" data-v="none">None</button></div></div>
        <div class="grp" data-for="decl"><h3>Cases</h3><div class="chips" id="cases"></div>
          <div class="quick"><button type="button" data-q="cases" data-v="all">All</button><button type="button" data-q="cases" data-v="none">None</button></div></div>
        <div class="grp"><h3>Number</h3><div class="seg" id="numseg"><button type="button" data-v="sg">Singular</button><button type="button" data-v="pl">Plural</button><button type="button" data-v="mix">Both</button></div></div>
        <div class="grp"><h3>Adjective in the phrase</h3><div class="seg" id="adjseg"><button type="button" data-v="no">Never</button><button type="button" data-v="yes">Always</button><button type="button" data-v="mix">Sometimes</button></div></div>
        <div class="grp"><h3>Answer by</h3><div class="seg" id="modeseg"><button type="button" data-v="type">Typing</button><button type="button" data-v="choose">Choosing from 4</button></div></div>
        <div class="grp"><h3>Round length</h3><div class="seg" id="lenseg"><button type="button" data-v="10">10</button><button type="button" data-v="20">20</button><button type="button" data-v="50">50</button></div></div>
      </div>
    </details>
    <div id="rvbar"></div>
    <div class="card" id="card" style="margin-top:12px"></div>
    <p class="foot"><kbd class="k">Enter</kbd> checks and moves on · <kbd class="k">1</kbd>–<kbd class="k">4</kbd> pick an option · the case is revealed after you answer.</p>
  </section>
  <section id="p-miss" role="tabpanel" hidden></section>
  <section id="p-over" role="tabpanel" hidden></section>
</div>
<script>
/* German: preposition + (article / demonstrative / possessive / interrogative / relative / adjective) + noun */
const GEN_DE=(()=>{
const CN={N:'Nominativ',A:'Akkusativ',D:'Dativ',G:'Genitiv'},CI={N:0,A:1,D:2,G:3};

function N(n,g,pl,gs,t,o){return Object.assign({n,g,pl,gs,t},o||{})}
const NOUNS=[
 N('Freund','m','Freunde','es','P'),N('Mann','m','Männer','es','P'),N('Arzt','m','Ärzte','es','P'),N('Lehrer','m','Lehrer','s','P'),N('Bruder','m','Brüder','s','P'),
 N('Kollege','m','Kollegen','','P',{nd:'Kollegen'}),N('Student','m','Studenten','','P',{nd:'Studenten'}),N('Junge','m','Jungen','','P',{nd:'Jungen'}),
 N('Nachbar','m','Nachbarn','','P',{nd:'Nachbarn'}),N('Herr','m','Herren','','P',{nd:'Herrn'}),N('Kunde','m','Kunden','','P',{nd:'Kunden'}),N('Kunde','m','Kunden','','P',{nd:'Kunden'}),
 N('Tisch','m','Tische','es','TU'),N('Schrank','m','Schränke','es','TC'),N('Brief','m','Briefe','es','T'),N('Computer','m','Computer','s','T'),N('Wagen','m','Wagen','s','T'),
 N('Garten','m','Gärten','s','L'),N('Bahnhof','m','Bahnhöfe','s','L'),N('Park','m','Parks','s','L'),N('Platz','m','Plätze','es','L'),
 N('Film','m','Filme','s','E'),N('Krieg','m','Kriege','es','E'),N('Unterricht','m',null,'s','E'),N('Sommer','m','Sommer','s','E'),N('Urlaub','m','Urlaube','s','E'),
 N('Frau','f','Frauen','','P'),N('Freundin','f','Freundinnen','','P'),N('Mutter','f','Mütter','','P'),N('Lehrerin','f','Lehrerinnen','','P'),N('Schwester','f','Schwestern','','P'),

  return shuffle([it.answers[0]].concat(uniq))}
function renderCard(){renderRvbar();answered=false;const box=$('#card');S.sess={deck,pos,review,kind:deckKind};save();
  if(!deck.length){box.innerHTML=`<p class="empty">${review?'No mistakes to review.':deckKind==='tr'?'Nothing matches these settings — choose at least one kind to translate.':'Nothing matches these settings — choose at least one kind and one case.'}</p>`;return}
  if(pos>=deck.length){box.innerHTML=`<div class="done"><h2>${review?'Review finished':'Round complete'}</h2><p class="empty">${roundR} correct · ${roundW} wrong</p><div class="actions" style="justify-content:center"><button class="btn" id="again" type="button">${review?'Back to mistakes':'New round'}</button></div></div>`;
    $('#again').onclick=()=>{if(review){review=false;deck=[];showTab('miss')}else newDeck()};$('#again').focus();return}
  const it=ITEM(deck[pos]);if(!it){pos++;return renderCard()}cur=it;const m=S.miss[it.key];const ch=S.mode==='choose';if(ch)opts=optionsFor(it);
  const word=it.mode!=='phrase',TR=!!it.tr,AL=TR?it.tgt:LG,TL=TR?(it.tgt==='de'?'DE':'RU'):'';
  const insT=TR?(it.tgt==='de'?(it.sentence?'Übersetzen Sie ins Deutsche — ergänzen Sie die Lücke.':'Übersetzen Sie ins Deutsche.'):(it.sentence?'Переведите на русский — заполните пропуск.':'Переведите на русский.')):(word?G.insWord:G.ins);
  const gapS=it.sentence?`<p class="sent" id="sent" lang="${AL}">${esc(it.sentence).replace('___','<span class="gap">&nbsp;</span>')}</p>`:'';
  box.innerHTML=`<div class="meta"><span>${esc(TYN[it.type]||'')}${TR?' · '+(it.srcL==='ru'?'RU → DE':'DE → RU'):''}</span><span>${pos+1} / ${deck.length}${m?` · <span style="color:var(--bad)">missed ×${m.n}</span>`:''}</span></div>
   <p class="ins" lang="${AL}">${esc(insT)}</p>
   ${TR?`<div class="trsrc" lang="${it.srcL}"><span class="lb">${it.srcL==='ru'?'RU':'DE'}</span><span>${it.srcHTML}</span></div>${it.sentence?`<div class="trsrc trtgt"><span class="lb">${TL}</span>${gapS}</div>`:''}`:gapS}
   ${TR?'':taskHTML(it)}${it.hint&&(!TR||S.hints==='on')?`<p class="ghint" lang="${AL}">${esc(it.hint)}</p>`:''}
   ${ch?`<div class="opts" id="opts" lang="${AL}">${opts.map((t,i)=>`<button type="button" class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(t)}</span></button>`).join('')}</div>`
     :`<div class="row"><input class="ans" id="ans" lang="${AL}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${TR?(it.sentence?'Type the missing words…':(it.tgt==='de'?'Type it in German…':'Type it in Russian…')):word?'Type the missing form…':'Type the whole phrase…'}" aria-label="Your answer"></div>`}
   <div class="actions" id="acts">${ch?'':'<button class="btn" type="button" id="check">Check</button>'}<button class="btn ghost" type="button" id="show"><span class="lgl">Show answer</span><span class="sml">Answer</span></button><button class="btn ghost" type="button" id="skip">Skip</button></div>
   <div id="fb"></div>`;
  if(ch)$('#opts').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||answered)return;answer(opts[+b.dataset.i],b)});
  else{$('#check').onclick=()=>answer($('#ans').value);$('#ans').focus({preventScroll:true})}
  $('#show').onclick=()=>answer(null);$('#skip').onclick=()=>{pos++;renderCard()}}
function judge(inp,it){const n=norm(inp);if(!n)return null;const hit=it.answers.find(a=>norm(a)===n);if(hit!==undefined)return {ok:true,hit};
  if(it.mode==='phrase'){const firstPrep=it.parts[0].x;const strip=a=>norm(a).split(' ').slice(firstPrep.split(' ').length).join(' ');const h2=it.answers.find(a=>strip(a)===n);if(h2!==undefined)return {ok:true,hit:h2,noPrep:true}}
  const near=it.answers.find(a=>bare(a)===bare(inp));return {ok:false,near}}
function answer(inp,btn){if(answered)return;const it=cur,gave=inp!=null;let r;if(!gave)r={ok:false,shown:true};else{r=judge(inp,it);if(!r){$('#ans')&&$('#ans').focus();return}}
  answered=true;record(it,r.ok,gave?inp:'—');
  const shown=r.ok?r.hit:it.answers[0];const sent=$('#sent');if(sent)sent.innerHTML=esc(it.sentence).replace('___',`<span class="gap ${r.ok?'ok':'bad'}">${esc(shown)}</span>`);
  if(S.mode==='choose')document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(opts[i]===it.answers[0])b.classList.add('ok');else if(b===btn)b.classList.add('bad')});
  else{const a=$('#ans');a.readOnly=true;a.classList.add(r.ok?'ok':'bad')}
  const seen=new Set([norm(shown)]);const alts=it.answers.filter(a=>{const n=norm(a);if(seen.has(n))return false;seen.add(n);return true});
  const m=S.miss[it.key];
  $('#fb').innerHTML=`<div class="fb ${r.ok?'ok':'bad'}"><div class="verdict">${r.ok?'✓ Correct':r.shown?'Answer shown':r.near?'✗ Almost — check the special letters':'✗ Not quite'} <span class="casechip">${esc(it.cname)}</span></div>
    <div class="right" lang="${it.tgt||LG}">${esc(shown)}${alts.length?` <span class="alt">· also accepted: ${alts.map(esc).join(', ')}</span>`:''}</div>
    ${!r.ok&&gave?`<div class="yours">Your answer: <s lang="${LG}">${esc(inp)}</s></div>`:''}
    ${r.noPrep?`<p class="note">Next time include the preposition as well — it can change form (${esc(shown.split(' ')[0])}).</p>`:''}
    <ul class="exl">${it.expl.map(x=>'<li>'+x+'</li>').join('')}</ul>
    ${r.ok&&m?`<p class="note">This was in your mistakes — ${m.ok}/2 correct answers to clear it.</p>`:''}</div>`;
  $('#acts').innerHTML=`<button class="btn" type="button" id="next">${pos+1>=deck.length?'Finish':'Next →'}</button>`;
  $('#next').onclick=()=>{pos++;renderCard()};$('#next').focus({preventScroll:true});const f=$('#fb');if(f&&f.scrollIntoView)f.scrollIntoView({block:'nearest',behavior:'smooth'})}
function bump(o,k,ok){const x=o[k]||(o[k]={r:0,w:0});ok?x.r++:x.w++}
function record(it,ok,ans){const k=it.key;bump(S.byCase,it.c,ok);bump(S.byType,it.type,ok);
  if(ok){S.st.r++;roundR++;streak++;if(streak>S.best)S.best=streak;const m=S.miss[k];if(m){m.ok=(m.ok||0)+1;if(m.ok>=2)delete S.miss[k]}}
  else{S.st.w++;roundW++;streak=0;const m=S.miss[k]||{n:0,ok:0};m.n++;m.ok=0;m.a=String(ans).slice(0,80);m.t=Date.now();S.miss[k]=m}
  save();renderStats();renderTabs()}
document.addEventListener('keydown',e=>{if((S.tab!=='practice'&&S.tab!=='tr')||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='Enter'){if(answered){const n=$('#next');if(n){e.preventDefault();n.click()}}else if(S.mode==='type'&&document.activeElement===$('#ans')){e.preventDefault();answer($('#ans').value)}return}
  if(!answered&&S.mode==='choose'&&/^[1-4]$/.test(e.key)){const b=document.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b){e.preventDefault();b.click()}}});
function renderMiss(){const p=$('#p-miss'),ks=Object.keys(S.miss).sort((a,b)=>(S.miss[b].t||0)-(S.miss[a].t||0));
  p.innerHTML=`<div class="ph"><h2>Mistakes</h2><p>Every phrase you got wrong collects here.</p></div>
  <p class="howto" style="margin-top:12px"><b>How it works:</b> a review round mixes up to 20 of your mistakes. An item leaves the list once you answer it correctly twice.</p>
  <div class="sect" style="margin-top:12px"><h3>Review</h3>${ks.length?`<div class="actions"><button class="btn" type="button" id="startrv">Start review (${Math.min(20,ks.length)})</button><button class="btn warn" type="button" id="clr">Clear the list</button></div>`:'<p class="empty">No mistakes yet.</p>'}</div>
  ${ks.length?`<div class="sect" style="margin-top:12px"><h3>${ks.length} item${ks.length>1?'s':''}</h3><div class="mlist">${ks.map(k=>{const it=ITEM(k),m=S.miss[k];if(!it)return '';return `<div class="mrow"><div class="mm"><span class="mt">${esc(it.cname)} · ${esc(TYN[it.type]||'')}${it.cue?' · '+esc(it.cue):''}</span>${it.tr?`<span class="ms" lang="${it.srcL}">${it.srcHTML}</span>`:''}<span class="ms" lang="${it.tgt||LG}">${it.tr?'→ ':''}${it.sentence?esc(it.sentence).replace('___','<b>'+esc(it.answers[0])+'</b>'):'<b>'+esc(it.answers[0])+'</b>'}</span><span class="my">You wrote: <s lang="${LG}">${esc(m.a||'—')}</s>${m.ok?` · ${m.ok}/2 correct since`:''}</span></div><span class="mx">×${m.n}</span></div>`}).join('')}</div></div>`:''}`;
  const s=p.querySelector('#startrv');if(s)s.onclick=startReview;
  const c=p.querySelector('#clr');if(c)c.onclick=()=>{if(!c.dataset.armed){c.dataset.armed='1';c.textContent='Sure? Press again';setTimeout(()=>{if(c.isConnected){delete c.dataset.armed;renderMiss()}},3000);return}S.miss={};save();renderTabs();renderMiss()}}
function bars(list,src){return list.map(([k,n])=>{const x=src[k]||{r:0,w:0},t=x.r+x.w;return `<tr><td>${esc(n)}</td><td class="n">${t}</td><td style="width:38%"><div class="mbar">${t?`<i class="g" style="width:${x.r/t*100}%"></i><i class="r" style="width:${x.w/t*100}%"></i>`:''}</div></td><td class="n">${t?Math.round(x.r/t*100)+'%':'–'}</td></tr>`}).join('')}
function renderOver(){$('#p-over').innerHTML=`<div class="ph"><h2>Overview</h2><p>Your accuracy by case and by kind of word. Best streak: ${S.best}.</p></div>
  <div class="sect" style="margin-top:12px"><h3>By case</h3><table class="ov"><thead><tr><th>Case</th><th>Tried</th><th>Right / wrong</th><th>Acc.</th></tr></thead><tbody>${bars(G.CASES.concat(G.lang==='de'?[]:[]),S.byCase)}</tbody></table></div>
  <div class="sect" style="margin-top:12px"><h3>By kind</h3><table class="ov"><thead><tr><th>Kind</th><th>Tried</th><th>Right / wrong</th><th>Acc.</th></tr></thead><tbody>${bars(G.TYPES,S.byType)}</tbody></table></div>
  <div class="sect" style="margin-top:12px"><h3>Translate RU ⇄ DE</h3><table class="ov"><thead><tr><th>Kind</th><th>Tried</th><th>Right / wrong</th><th>Acc.</th></tr></thead><tbody>${bars(GEN_TR.TYPES,S.byType)}</tbody></table></div>`}
addEventListener('storage',e=>{if(!e.key||!e.key.endsWith(KEY))return;try{const v=JSON.parse(e.newValue||'null');if(v){S=Object.assign(DEF(),v);renderTabs();renderStats();if(S.tab==='miss')renderMiss()}}catch(x){}});
renderHead();renderSettings();renderStats();
try{const ss=S.sess;if(ss&&Array.isArray(ss.deck)&&ss.deck.length&&ss.deck.every(k=>ITEM(k))&&(ss.review||(ss.kind||'decl')===kind())){deck=ss.deck;pos=Math.max(0,Math.min(ss.pos|0,deck.length));review=!!ss.review;deckKind=ss.kind||'decl'}}catch(e){}
showTab(S.tab==='miss'||S.tab==='over'||S.tab==='tr'?S.tab:'practice',true);
if(!deck.length)newDeck();else renderCard();
</script>
<style id="mgate-css">
.mg-back{position:fixed;inset:0;z-index:2147483000;background:rgba(15,20,18,.5);display:grid;place-items:center;padding:16px}
.mg-card{width:min(400px,100%);background:#fff;color:#1b2421;border-radius:16px;padding:20px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.3);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mg-card h2{margin:0 0 6px;font-size:20px;line-height:1.25;font-weight:700;letter-spacing:0;text-transform:none;color:inherit}
.mg-card p{margin:0 0 6px;color:#4a5752}
.mg-n{display:inline-block;min-width:1.8em;text-align:center;font-weight:700;color:#b5442f;background:#f7e5e0;border-radius:999px;padding:0 8px;margin-right:4px}
.mg-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mg-row button{font:600 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border-radius:12px;min-height:46px;padding:0 16px;cursor:pointer;border:1px solid #cfd8d3;background:#fff;color:#1b2421;flex:1 1 auto}
.mg-row .mg-go{background:#2b7a5e;border-color:#2b7a5e;color:#fff;flex:2 1 auto}
.mg-row button:focus-visible{outline:3px solid #2b7a5e;outline-offset:2px}
.mg-small{font-size:12.5px;color:#6b7873;margin-top:10px}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .mg-card{background:#19211f;color:#e3ebe7}html:not([data-theme=light]) .mg-card p{color:#a9b8b1}html:not([data-theme=light]) .mg-row button{background:#19211f;color:#e3ebe7;border-color:#34413c}html:not([data-theme=light]) .mg-row .mg-go{background:#62c39c;border-color:#62c39c;color:#0f1714}html:not([data-theme=light]) .mg-n{background:#3a221d;color:#e58169}}
</style>
<script>
/* Mistake gate (added): once 20 mistakes are waiting, a pop-up offers to redo them
   before the next new exercise. "Not now" asks again after 5 more mistakes. */
(function(A){
  var LIMIT=20,KEY='mgate-snooze',bypass=false,open=null;
  function n(){try{return A.count()||0}catch(e){return 0}}
  function sz(){try{return +localStorage.getItem(KEY)||0}catch(e){return 0}}
  function setSz(v){try{if(v)localStorage.setItem(KEY,String(v));else localStorage.removeItem(KEY)}catch(e){}}
  function should(){if(bypass||open)return false;try{if(A.inReview())return false}catch(e){return false}
    var c=n();if(c<LIMIT){if(sz())setSz(0);return false}var s=sz();return !s||c>=s+5}
  function close(){if(open){open.remove();open=null}}
  function pop(btn){var c=n();var d=document.createElement('div');d.className='mg-back';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','mg-h');
    d.innerHTML='<div class="mg-card"><h2 id="mg-h">Time to redo your mistakes</h2><p><span class="mg-n">'+c+'</span>mistakes are waiting for you.</p><p>Redo them now, before new exercises. Each one you get right comes off the list.</p><div class="mg-row"><button type="button" class="mg-go">Redo '+Math.min(LIMIT,c)+' mistakes</button><button type="button" class="mg-later">Not now</button></div><p class="mg-small">“Not now” continues with the new exercise. I’ll ask again after 5 more mistakes.</p></div>';
    document.body.appendChild(d);open=d;
    d.querySelector('.mg-go').onclick=function(){close();setSz(0);try{A.start()}catch(e){console.error(e)}};
    d.querySelector('.mg-later').onclick=function(){close();setSz(c);if(btn&&btn.isConnected){bypass=true;try{btn.click()}finally{bypass=false}}};
    d.addEventListener('click',function(e){if(e.target===d){close()}});
    d.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();close()}else if(e.key==='Tab'){var b=d.querySelectorAll('button'),f=b[0],l=b[b.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
    setTimeout(function(){var g=d.querySelector('.mg-go');if(g)g.focus({preventScroll:true})},30)}
  addEventListener('click',function(e){if(bypass||open)return;var b=null;try{b=A.isNext(e.target)}catch(x){}if(!b||!should())return;
    e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  ['pointerdown','touchstart','mousedown'].forEach(function(t){addEventListener(t,function(e){if(open&&!open.contains(e.target)){e.stopImmediatePropagation()}},true)});
  addEventListener('keydown',function(e){if(open){if(!open.contains(e.target)){e.preventDefault();e.stopImmediatePropagation()}return}
    if(e.key!=='Enter'||e.shiftKey||e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;var t=e.target;if(t&&t.tagName==='TEXTAREA')return;
    var b=null;try{b=A.enterNext(e)}catch(x){}if(!b||!should())return;e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  window.__mgate={count:n,should:should,open:function(){pop(null)},start:function(){setSz(0);try{A.start()}catch(e){console.error(e)}}};
})({
  count:function(){return Object.keys(S.miss).length},
  inReview:function(){return review===true||(S.tab!=='practice'&&S.tab!=='tr')},
  isNext:function(t){var b=t.closest&&t.closest('#next,#skip,#again');return b&&!review?b:null},
  enterNext:function(){if(review)return null;var b=document.getElementById('next');return b&&b.offsetParent?b:null},
  start:function(){startReview()}
});
</script>
<script>
/* Russian prepositions + case: every mistake is also sent to the main Russian "Review & mistakes" tab (added). */
(function(){if(G.lang!=='ru')return;
  const strip=s=>String(s||'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
  function pack(k){const it=ITEM(k),m=S.miss[k];if(!it||!m)return null;
    const pw=it.parts[0].x.split(' ').length;
    const ans=[...new Set(it.answers.concat(it.mode==='phrase'?it.answers.map(a=>a.split(' ').slice(pw).join(' ')).filter(Boolean):[]))];
    const w=it.parts.map(p=>p.x).join(' + ')+(it.num==='pl'?' (мн. ч.)':'');
    return {key:k,n:m.n,you:m.a||'',rec:{m:'case',w,gloss:'',tags:[TYN[it.type]||''].concat(it.cue?[it.cue]:[]).filter(Boolean),
      note:(it.expl||[]).map(strip).join(' '),p:{t:it.cname,s:it.tr?(it.src+' → '+(it.sentence||(it.tgt==='de'?'Deutsch':'по-русски'))):it.sentence||(it.mode==='phrase'?'whole phrase, with the preposition':G.insWord),a:ans.join('/')}}}}
  function send(list){list=list.filter(Boolean);if(!list.length)return;const msg={dp:'xmiss',lang:'ru',list};
    try{if(parent&&parent!==window)parent.postMessage(msg,'*')}catch(e){}}
  const rec0=record;record=function(it,ok,ans){rec0(it,ok,ans);if(!ok)send([pack(it.key)])};
  setTimeout(()=>send(Object.keys(S.miss).map(pack)),400);
})();
</script>
