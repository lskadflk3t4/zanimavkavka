<style>
:root{

}

  --bg:#111715;--surface:#19211F;--ink:#E3EBE7;--muted:#93A39C;--line:#2B3632;
  --jade:#62C39C;--jade-soft:#1D3229;--seal:#E58169;--seal-soft:#3A221D;--gold:#E0B357;--gold-soft:#3A2F17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111715;--surface:#19211F;--ink:#E3EBE7;--muted:#93A39C;--line:#2B3632;
  --jade:#62C39C;--jade-soft:#1D3229;--seal:#E58169;--seal-soft:#3A221D;--gold:#E0B357;--gold-soft:#3A2F17;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 90px}
header.top{padding:22px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-read);font-weight:600;font-size:clamp(22px,5vw,30px);line-height:1.2;margin:2px 0 4px}
h1 .zh{font-family:var(--f-han)}
.lede{color:var(--muted);margin:0 0 6px;max-width:60ch}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 14px;overflow-x:auto;scrollbar-width:none}
.seg button{appearance:none;border:0;background:none;font-weight:600;color:var(--muted);padding:10px 12px 9px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;min-height:44px}
.seg button[aria-selected="true"]{color:var(--jade);border-bottom-color:var(--jade)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.opts .lab{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:64px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--jade)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
h2{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade);margin:22px 0 8px;font-weight:700}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;width:100%}
.set:hover{border-color:var(--jade)}
.set .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);line-height:1.2}
.set .no b{display:block;font-family:var(--f-han);font-size:15px;color:var(--jade);font-weight:600}
.set .t{font-weight:600;line-height:1.3}
.set .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.set .sc{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.set .sc b{color:var(--jade)}
.bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade)}
.special{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 22px -18px rgba(0,0,0,.4)}
.prog{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
.prog .pbar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .pbar i{display:block;height:100%;background:var(--jade);transition:width .25s}
.play{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb{width:52px;height:52px;border-radius:50%;border:0;background:var(--jade);color:var(--bg);cursor:pointer;display:grid;place-items:center;flex:none}
.pb svg{width:20px;height:20px;fill:currentColor}
.pb.on{box-shadow:0 0 0 5px var(--jade-soft)}
.small{font-size:13px;color:var(--muted)}
.prompt-en{font-family:var(--f-read);font-size:17px;line-height:1.4}
.prompt-en.off{color:var(--muted);font-style:italic;font-size:14px;font-family:var(--f-ui)}
.pyhint{color:var(--jade);font-size:14px}
.ans{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.ans.empty::before{content:"Tap the blocks in order";color:var(--muted);font-size:13.5px;padding:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tile{font-family:var(--f-han);font-size:19px;line-height:1.2;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 11px;cursor:pointer;min-height:44px;min-width:44px;user-select:none;box-shadow:0 1px 0 var(--line)}
.tile:hover{border-color:var(--jade)}
.tile.used{visibility:hidden}
.tile.ok{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.tile.bad{background:var(--seal-soft);border-color:var(--seal);color:var(--seal)}
.tile.given{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-family:var(--f-han);font-size:20px;line-height:1.5;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.fb.ok{background:var(--jade-soft)}
.fb.bad{background:var(--seal-soft)}
.fb .v{font-weight:700}
.fb.ok .v{color:var(--jade)}.fb.bad .v{color:var(--seal)}
.han{font-family:var(--f-han);font-size:20px;line-height:1.55}
.han .m{color:var(--seal);text-decoration:underline wavy;text-underline-offset:4px}
.han .x{color:var(--seal);text-decoration:line-through}
.han .g{color:var(--jade)}
.han .tw{color:var(--gold);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.fb .py{color:var(--jade);font-size:14px}
.fb .en{color:var(--muted);font-size:14px}
.done{text-align:center;padding:26px 10px;display:grid;gap:10px;justify-items:center}
.done .big{font-family:var(--f-read);font-size:40px;color:var(--jade);line-height:1}
.mini{display:grid;gap:6px;text-align:left;width:100%;margin-top:8px}
.mini div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px}
.mini .han{font-size:16px}
.mk{font-weight:700}.mk.g1{color:var(--jade)}.mk.g0{color:var(--seal)}.mk.gh{color:var(--gold)}
.back{border:0;background:none;color:var(--jade);font-weight:600;cursor:pointer;padding:6px 0;min-height:40px}
.note{font-size:12.5px;color:var(--muted)}
body.inround header.top{display:none}body.inround .wrap{padding-top:8px}
.cfg{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:0 0 12px}
.cfg>summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:600;min-height:44px}
.cfg>summary::-webkit-details-marker{display:none}
.cfg>summary small{font-weight:400;color:var(--muted);margin-left:6px}
.cfg[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.cfg .opts{padding:0 12px}
@media (max-width:480px){.tile{font-size:18px;padding:7px 9px}.han{font-size:18px}textarea{font-size:18px}}

<script>
/* ---- pinyin + tones (shared by 声调, 句子 and 生词卡) ---- */
const PYT=(()=>{
  const I=['','b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w'];
  const F=['a','o','e','ai','ei','ao','ou','an','en','ang','eng','ong','er','i','ia','ie','iao','iu','ian','in','iang','ing','iong','u','ua','uo','uai','ui','uan','un','uang','ueng','v','ve','van','vn','ue','n','ng','m','hm'];
  const SYL=new Set();I.forEach(a=>F.forEach(b=>SYL.add(a+b)));
  const MK={};[['a','āáǎà'],['e','ēéěè'],['i','īíǐì'],['o','ōóǒò'],['u','ūúǔù'],['v','ǖǘǚǜ']].forEach(([b,m])=>[...m].forEach((c,n)=>MK[c]=[b,n+1]));
  /* letters + tone per position; digits 1-5 after a syllable set its tone */
  function letters(py){const L=[],T=[];for(const ch of String(py).normalize('NFC').toLowerCase()){
      if(ch==='ü'){L.push('v');T.push(0)}else if(MK[ch]){L.push(MK[ch][0]);T.push(MK[ch][1])}
      else if(ch>='a'&&ch<='z'){L.push(ch);T.push(0)}
      else if(ch>='0'&&ch<='5'){L.push('#'+ch);T.push(0)}
      else if(ch===':'&&L.length&&L[L.length-1]==='u'){L[L.length-1]='v'}
      else{L.push('|');T.push(0)}}
    return {L,T}}
  /* split into [[syl,tone]]; n = exact syllable count, or null for the fewest syllables */
  function split(py,n){const {L,T}=letters(py),m=L.length,memo=new Map();
    function go(i,k){while(i<m&&(L[i]==='|'))i++;if(i===m)return (n==null||k===0)?[]:null;if(n!=null&&k===0)return null;
      const key=i+','+k;if(memo.has(key))return memo.get(key);let best=null;
      for(let j=Math.min(m,i+6);j>i;j--){let p='';let bad=false;for(let x=i;x<j;x++){if(L[x].length!==1||L[x]==='|'){bad=true;break}p+=L[x]}
        if(bad||!SYL.has(p))continue;const ts=T.slice(i,j).filter(Boolean);if(ts.length>1)continue;let t=ts[0]||0,jj=j;
        if(jj<m&&L[jj][0]==='#'){const d=+L[jj].slice(1);if(t&&d!==t)continue;t=d===0?5:d;jj++}
        const r=go(jj,n==null?0:k-1);if(r){const cand=[[p,t||5]].concat(r);if(n!=null){best=cand;break}if(!best||cand.length<best.length)best=cand}}
      memo.set(key,best);return best}
    return go(0,n==null?0:n)}
  /* the tones you actually hear inside a run of syllables (3+3, 不, 一) */
  function surface(sy,chars){const t=sy.map(s=>s[1]);const out=t.slice();
    for(let j=0;j<t.length-1;j++){
      if(t[j]===3&&t[j+1]===3&&!(j+2<t.length&&t[j+2]===3))out[j]=2;
      const ch=chars?chars[j]:'';
      if((ch==='不'||(!chars&&sy[j][0]==='bu'))&&(t[j]===4||t[j]===2)&&t[j+1]!==5)out[j]=t[j+1]===4?2:4;
      if(ch==='一'&&t[j+1]!==5)out[j]=t[j+1]===4?2:4;}
    return out}
  function mark(syl,t){const s=syl.replace(/v/g,'ü');if(!t||t===5)return s;const lo=s;let i=-1;
    if(lo.includes('a'))i=lo.indexOf('a');else if(lo.includes('e'))i=lo.indexOf('e');else if(lo.includes('ou'))i=lo.indexOf('o');
    else for(let k=lo.length-1;k>=0;k--)if('iouü'.includes(lo[k])){i=k;break}
    if(i<0)return s;const m={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'}[lo[i]];return s.slice(0,i)+m[t-1]+s.slice(i+1)}
  const NAME={1:'1st',2:'2nd',3:'3rd',4:'4th',5:'neutral'};
  /* confusion counts live in the 声调 tab's storage so every tab can add to them */
  const REAL=(()=>{try{for(let w=window;;w=w.parent){if(w.__dpShell)return w.localStorage;if(w===w.parent)break}}catch(e){}try{return window.top.localStorage}catch(e){}return null})();
  const CK='drillpack:zhtone:conf';
  function conf(){const st=REAL||localStorage,k=REAL?CK:'conf';try{return JSON.parse(st.getItem(k)||'{}')||{}}catch(e){return {}}}
  function note(pairs,from){if(!pairs.length)return;const st=REAL||localStorage,k=REAL?CK:'conf';const c=conf();
    pairs.forEach(([t,h])=>{const key=t+'>'+h;c[key]=(c[key]||0)+1});c.n=(c.n||0)+pairs.length;c.src=c.src||{};c.src[from]=(c.src[from]||0)+pairs.length;
    try{st.setItem(k,JSON.stringify(c))}catch(e){}}
  return {split,surface,mark,NAME,conf,note,SYL}})();

 He never goes outside to move about and get some fresh air.","而且|生活|没有|规律|，|从来不|到|外面|活动|活动|，|换换|空气|。"],[72.34,77.57,"速冻食品没有什么营养，还是去市场买新鲜的菜好。","Sùdòng shípǐn méiyǒu shénme yíngyǎng, háishi qù shìchǎng mǎi xīnxiān de cài hǎo.","Frozen food isn't very nutritious. It's better to buy fresh vegetables at the market.","速冻|食品|没有|什么|营养|，|还是|去|市场|买|新鲜|的|菜|好|。"],[78.46,82.98,"那些快餐更要少吃，对身体没有什么好处。","Nàxiē kuàicān gèng yào shǎo chī, duì shēntǐ méiyǒu shénme hǎochù.","And you should eat even less of that fast food. It does your body no good.","那些|快餐|更要|少|吃|，|对|身体|没有|什么|好处|。"],[85.75,93.51,"搬进了新房子后，要和邻居多来往，以后有什么事情，还能互相帮帮忙。","Bān jìn le xīnfáng zi hòu, yào hé línjū duō láiwǎng, yǐhòu yǒu shénme shìqing, hái néng hùxiāng bāngbang máng.","Once you've moved into your new home, you should get to know the neighbours. Then if anything happens, you can help each other out.","搬进|了|新房子|后|，|要|和|邻居|多|来往|，|以后|有|什么|事情|，|还能|互相|帮帮忙|。"],[95.93,101.35,"听说美国有一个小村子十分闭塞，那里没有任何网络，","Tīngshuō Měiguó yǒu yí ge xiǎo cūnzi shífēn bìsè, nàli méiyǒu rènhé wǎngluò,","I hear there's a little village in America that's completely cut off. There's no internet at all,","听说|美国|有|一个|小村子|十分|闭塞|，|那里|没有|任何|网络|，"],[102.14,108.93,"人们不能使用手机，也不能上网，这样专门用来治疗现代生活病。","rénmen bù néng shǐyòng shǒujī, yě bù néng shàngwǎng, zhèyàng zhuānmén yònglái zhìliáo xiàndài shēnghuó bìng.","so people can't use phones or go online. It's specially meant for treating modern lifestyle illnesses.","人们|不能|使用|手机|，|也|不能|上网|，|这样|专门|用来|治疗|现代|生活|病|。"],[112.06,118.08,"过度依赖手机和电脑，让我们与朋友面对面的交流越来越少了。","Guòdù yīlài shǒujī hé diànnǎo, ràng wǒmen yǔ péngyou miànduìmiàn de jiāoliú yuèláiyuè shǎo le.","Depending too much on phones and computers means we talk face to face with friends less and less.","过度|依赖|手机|和|电脑|，|让|我们|与|朋友|面对面|的|交流|越来越|少|了|。"],[121.05,129.73,"处于亚健康状态的人，虽然没有真正的疾病，但是他们的身体适应能力却开始下降了。","Chǔyú yàjiànkāng zhuàngtài de rén, suīrán méiyǒu zhēnzhèng de jíbìng, dànshì tāmen de shēntǐ shìyìng nénglì què kāishǐ xiàjiàng le.","People in a state of sub-health have no real illness, but their bodies' ability to adapt has started to decline.","处于|亚健康|状态|的|人|，|虽然|没有|真正|的|疾病|，|但是|他们|的|身体|适应能力|却|开始|下降|了|。"],[130.84,134.66,"如果这种状态不能得到改善，就会让人得病。","Rúguǒ zhè zhǒng zhuàngtài bù néng dédào gǎishàn, jiù huì ràng rén débìng.","If this state isn't improved, it will make people ill.","如果|这种|状态|不能|得到|改善|，|就|会|让|人|得病|。"]]],["zhl2","087","补充句子","Completing sentences","Ten sentences built on the lesson 6 words",[[10.84,17.89,"我是一个比较不爱讲话的人，同学聚会的时候，我很少主动去和别人聊天。","Wǒ shì yí ge bǐjiào bú ài jiǎnghuà de rén, tóngxué jùhuì de shíhou, wǒ hěn shǎo zhǔdòng qù hé biérén liáotiān.","I'm not much of a talker. At class reunions I rarely start conversations with people.","我|是|一个|比较|不爱|讲话|的|人|，|同学聚会|的|时候|，|我|很少|主动|去|和|别人|聊天|。"],[21.59,29.15,"这个人虽然小时候学习一般，但是很有经济头脑，而且本事很大，很会赚钱。","Zhège rén suīrán xiǎoshíhou xuéxí yìbān, dànshì hěn yǒu jīngjì tóunǎo, érqiě běnshi hěn dà, hěn huì zhuànqián.","Although this person was only average at school, he has a good head for business, he's very capable and he's good at making money.","这个|人|虽然|小时候|学习|一般|，|但是|很|有|经济|头脑|，|而且|本事|很大|，|很会|赚钱|。"],[33.11,41.7,"中国父母都很爱替子女操心，即使子女长大成人了，他们也经常不放心这不放心那。","Zhōngguó fùmǔ dōu hěn ài tì zǐnǚ cāoxīn, jíshǐ zǐnǚ zhǎngdà chéngrén le, tāmen yě jīngcháng bú fàngxīn zhè bú fàngxīn nà.","Chinese parents love to worry on their children's behalf. Even when the children are grown up, they're still forever worrying about this and that.","中国|父母|都|很|爱|替|子女|操心|，|即使|子女|长大成人|了|，|他们|也|经常|不放心这不放心那|。"],[45.88,53.35,"这小子学习上没什么出息，足球踢得倒是很不错，这也算是一个特长嘛。","Zhè xiǎozi xuéxí shàng méi shénme chūxi, zúqiú tī de dàoshì hěn búcuò, zhè yě suànshì yí ge tècháng ma.","This lad won't get far with his studies, but he does play football well. That counts as a special talent, I suppose.","这|小子|学习|上|没什么出息|，|足球|踢|得|倒是|很|不错|，|这|也|算是|一个|特长|嘛|。"],[57.05,66.27,"工资一下来，交完账单和房贷，几天就花光了。现在我连衣服都不敢随便买了，委屈死了。","Gōngzī yí xiàlai, jiāo wán zhàngdān hé fángdài, jǐ tiān jiù huāguāng le. Xiànzài wǒ lián yīfu dōu bù gǎn suíbiàn mǎi le, wě e flatly refused to pay. I was absolutely fuming.","吃完饭|后|说|什么|都|不|付钱|，|鼻子|都|快|被|他|气歪了|。"],[73.18,77.03,"刚想出门，谁知道偏偏被我爸看见了。","Gāng xiǎng chūmén, shéi zhīdao piānpiān bèi wǒ bà kànjiàn le.","I was just about to go out when, wouldn't you know it, my dad saw me.","刚想|出门|，|谁|知道|偏偏|被|我|爸|看见|了|。"],[77.98,84.55,"他一阵风似的走过来，把我拦住，问道：“你想去哪儿？作业写完了吗？”","Tā yí zhèn fēng shìde zǒu guòlái, bǎ wǒ lán zhù, wèndào: \"Nǐ xiǎng qù nǎr? Zuòyè xiě wán le ma?\"","He rushed over like the wind, stopped me and asked: \"Where do you think you're going? Have you finished your homework?\"","他|一阵风似的|走|过来|，|把|我|拦住|，|问道|：|“|你|想|去|哪儿|？|作业|写|完|了|吗|？|”"],[87.48,90.59,"这件事害得我半年没敢再去找他。","Zhè jiàn shì hài de wǒ bànnián méi gǎn zài qù zhǎo tā.","That business put me off going to see him for six months.","这件|事|害得我|半年|没敢|再|去|找|他|。"],[91.45,97.54,"每次他打电话请我吃饭，我都故意说肚子不舒服，或者有事儿。","Měicì tā dǎ diànhuà qǐng wǒ chī fàn, wǒ dōu gùyì shuō dǔzi bù shūfu, huòzhě yǒu shìr.","Every time he called to invite me for a meal, I deliberately said I had an upset stomach or something on.","每次|他|打电话|请|我|吃饭|，|我|都|故意|说|肚子|不|舒服|，|或者|有事儿|。"],[101.91,106.66,"我真的不能再吃了，撑死了，我都吃了两大碗了。","Wǒ zhēn de bù néng zài chī le, chēng sǐ le, wǒ dōu chī le liǎng dà wǎn le.","I really can't eat any more. I'm stuffed. I've had two big bowls already.","我|真的|不能|再|吃|了|，|撑死了|，|我|都|吃|了|两|大碗|了|。"],[109.88,115.97,"后来你猜怎么着？爱上人家了，还假装说不喜欢人家。","Hòulái nǐ cāi zěnmezhe? Àishàng rénjia le, hái jiǎzhuāng shuō bù xǐhuan rénjia.","And then, guess what? He fell for her, but pretended he didn't like her.","后来|你猜怎么着|？|爱上|人家|了|，|还|假装|说|不|喜欢|人家|。"],[119.16,125.41,"我好不容易吃完了面，付了钱，连嘴都不想擦，只想赶快离开。","Wǒ hǎobùróngyì chī wán le miàn, fù le qián, lián zuǐ dōu bù xiǎng cā, zhǐ xiǎng gǎnkuài líkāi.","I finally managed to finish the noodles and paid. I didn't even want to wipe my mouth; I just wanted to get out of there.","我|好不容易|吃|完|了|面|，|付|了|钱|，|连嘴|都|不想|擦|，|只想|赶快|离开|。"]]],["zhl2","113","补充句子","Completing sentences","Ten sentences built on the gift-giving words",[[9.94,15.94,"姐姐去美国的签证到现在还没有办下来，她都快急死了。","Jiějie qù Měiguó de qiānzhèng dào xiànzài hái méi yǒu bàn xialai, tā dōu kuài jí sǐ le.","My sister's visa for America still hasn't come through. She's going frantic.","姐姐|去|美国|的|签证|到|现在|还没|有|办下来|，|她|都|快|急死了|。"],[18.9,23.2,"来，我敬大家一杯酒，为我们的友谊干杯！","Lái, wǒ jìng dàjiā yì bēi jiǔ, wèi wǒmen de yǒuyì gānbēi!","Come on, let me propose a toast to everyone. To our friendship!","来|，|我敬|大家|一|杯酒|，|为|我们|的|友谊|干杯|！"],[27.03,31.17,"一路上，他十分小心，细心地照顾他的小狗。","Yí lù shang, tā shífēn xiǎoxīn, xìxīn de zhàogù tā de xiǎogǒu.","All the way, he was very careful and looked after his puppy attentively.","一路上|，|他|十分|小心|，|细心地|照顾|他|的|小狗|。"],[33.75,39.36,"今天我请客，大家一定要吃个痛快，玩个痛快，千万别客气。","Jīntiān wǒ qǐngkè, dàjiā yídìng yào chī ge tòngkuai, wán ge tòngkuai, qiānwàn bié kèqì.","Today's on me. Everyone eat your fill and have a great time. Don't stand on ceremony.","今天|我|请客|，|大家|一定|要|吃个痛快|，|玩个痛快|，|千万别|客气|。"],[42.42,51.3,"这支钢笔是我从中国带来的，这是我的一点心意，你一定要收下。礼轻情义重嘛。","Zhè zhī gāngbǐ shì wǒ cóng Zhōngguó dàilái de, zhè shì wǒ de yìdiǎn xīnyì, nǐ yídìng yào shōuxia. Lǐ qīng qíngyì zhòng ma.","I brought this pen from China. It's a small token of my regard, and you must accept it. It's the thought that counts.","这支|钢笔|是|我|从|中国|带来|的|，|这|是|我|的|一点心意|，|你|一定|要|收下|。|礼轻情义重|嘛|。"],[54.14,59.78,"礼品是不是很贵重，没有关系，重要的是礼品代表的情谊深厚。","Lǐpǐn shì bu shì hěn guìzhòng, méiyǒu guānxi, zhòngyào de shì lǐpǐn dàibiǎo de qíngyì shēnhòu.","Whether a gift is valuable doesn't matter. What matters is the deep friendship it stands for.","礼品|是不是|很|贵重|，|没有|关系|，|重要|的|是|礼品|代表|的|情谊|深厚|。"],[62.42,71.78,"一看见姐夫，赶紧把事情的经过仔仔细细地讲了一遍，希望姐夫能想出一个解决的办法。","Yí kànjiàn jiěfu, gǎnjǐn bǎ shìqing de jīngguò zǐzǐxìxì de jiǎng le yí biàn, xīwàng jiěfu néng xiǎng chū yí ge jiějué de bànfǎ.","As soon as she saw her brother-in-law, she told him the whole story in detail, hoping he could think of a solution.","一|看见|姐夫|，|赶紧|把|事情|的|经过|仔仔细细|地|讲|了|一遍|，|希望|姐夫|能|想|出|一个|解决|的|办法|。"],[74.81,83.62,"这座小城夏天气温较高。暑假的时候，孩子们喜欢到湖边玩水、喂天鹅，非常开心。","Zhè zuò xiǎo chéng xiàtiān qìwēn n with countries around the world in the economy, education, the environment and security.","中国|在|不断|努力|加强|与|世界|各国|经济|、|教育|、|环境|、|安全|各个方面|的|合作|。"],[42.04,52.48,"有些刚来的留学生觉得在法国早餐太单一，除了牛奶、面包、果酱，没有太多的选择。","Yǒuxiē gāng lái de liúxuéshēng juéde zài Fǎguó zǎocān tài dānyī, chúle niúnǎi, miànbāo, guǒjiàng, méiyǒu tài duō de xuǎnzé.","Some newly arrived students find breakfast in France too monotonous: apart from milk, bread and jam, there isn't much choice.","有些|刚来|的|留学生|觉得|在|法国|早餐|太|单一|，|除了|牛奶|、|面包|、|果酱|，|没有|太多|的|选择|。"],[55.22,63.87,"包子、米粥、面条、油条、豆浆，都是典型的中国早餐食品。","Bāozi, mǐzhōu, miàntiáo, yóutiáo, dòujiāng, dōu shì diǎnxíng de Zhōngguó zǎocān shípǐn.","Steamed buns, rice porridge, noodles, fried dough sticks and soy milk are all typical Chinese breakfast foods.","包子|、|米粥|、|面条|、|油条|、|豆浆|，|都|是|典型|的|中国|早餐|食品|。"],[68.7,81.51,"春节是中国人的传统节日。每到春节的时候，人们都会挂灯笼，穿新衣，准备很多好吃的饭菜，非常热闹。","Chūn Jié shì Zhōngguórén de chuántǒng jiérì. Měi dào Chūn Jié de shíhou, rénmen dōu huì guà dēnglong, chuān xīn yī, zhǔnbèi hěn duō hǎochī de fàncài, fēicháng rènào.","The Spring Festival is a traditional Chinese festival. Every year people hang lanterns, wear new clothes and prepare lots of good food. It's very lively.","春节|是|中国人|的|传统节日|。|每到|春节|的|时候|，|人们|都|会|挂灯笼|，|穿|新衣|，|准备|很多|好吃|的|饭菜|，|非常|热闹|。"],[84.38,92.19,"为了改善这个城市的环境，政府五次派代表去美国考察和学习。","Wèile gǎishàn zhège chéngshì de huánjìng, zhèngfǔ wǔ cì pài dàibiǎo qù Měiguó kǎochá hé xuéxí.","To improve the city's environment, the government has sent delegations to the United States five times to study and learn.","为了|改善|这个|城市|的|环境|，|政府|五次|派|代表|去|美国|考察|和|学习|。"],[95.96,100.67,"今天的聚会非常有气氛，大家玩得都很痛快。","Jīntiān de jùhuì fēicháng yǒu qìfēn, dàjiā wán de dōu hěn tòngkuai.","Today's party had a great atmosphere, and everyone had a wonderful time.","今天|的|聚会|非常|有|气氛|，|大家|玩得|都|很|痛快|。"],[103.22,110.34,"我们在花园里摆好桌子，准备了一篮子水果，邀请朋友一起赏月，","Wǒmen zài huāyuán li bǎihǎo zhuōzi, zhǔnbèi le yì lánzi shuǐguǒ, yāoqǐng péngyou yìqǐ shǎng yuè,","We set up a table in the garden, prepared a basket of fruit and invited friends to admire the moon together,","我们|在|花园里|摆好|桌子|，|准备|了|一篮子|水果|，|邀请|朋友|一起|赏月|，"],[111.03,114.69,"用这种方式来表示我们对家乡的思念。","yòng zhè zhǒng fāngshì lái biǎoshì wǒmen duì jiāxiāng de sīniàn.","as a way of expressing our longing for home.","用|这种|方式|来|表示|我们|对|家乡|的|思念|。"],[119.48,123.62,"中秋节前后，月亮特别圆，特别亮。","Zhōngqiū Jié qiánhòu, yuèliàng tèbié yuán, tèbié liàng.","Around the Mid-Autumn Festival, the moon is especially round and bright.","中秋节|前后|，|月亮|特别|圆|，|特别|亮|。"],[124.44,133.79,"而且如果你仔细看，会发现月亮上好像有个影子在动。人们说，那就是嫦娥。","Érqiě rúguǒ nǐ zǐxì kàn, huì fāxiàn yuèliàng shàng hǎoxiàng yǒu ge yǐngzi zài dòng. Rénmen shuō, nà jiùshì Cháng'é.","And if you look closely, you'll see what seems to be a shadow moving on the moon. People say that's Chang'e.","而且|如果|你|仔细|看|，|会|发现|月亮|上|好像|有个|影子|在|动|。|人们|说|，|那|就是|嫦娥|。"]]],["zhl2","143","补充句子","Completing sentences","Ten sentences on Beijing, hutongs and urbanisation",[[8.76,15.36,"新年到了，全世界各国人民以不同的形式庆祝这个美好的节日。","Xīnnián dào le, quánshìjiè gèguó rénmín yǐ bùtóng de xíngshì qìngzhù zhège měihǎo de jiérì.","The New Year has come, and people all over the world celebrate this happy festival in different ways.","新年|到|了|，|全世界|各国|人民|以|不同|的|形式|庆祝|这个|美好|的|节日|。"],[18.49,26.34,"能考上北京大学，一直是他的梦想。现在这个梦想实现了，他成了全家人的骄傲。","Néng kǎoshang běijīngdàxué, yìzhí shì tā de mèngxiǎng. Xiànzài zhège mèngxiǎng shíxiàn le, tā chéng le quán jiā rén de jiāo'ào.","Getting into Peking University was always his dream. Now it has come true, and he's the pride of the family.","能|考上|北京大学|，|一直|是|他|的|梦想|。|现在|这个|梦想|实现|了|，|他成|了|全家人|的|骄傲|。"],[30.65,38.59,"八十年代末、九十年代初的时候，北京市政府开始对老居民区进行改造。","Bāshí niándài mò, jiǔshí niándài chū de shíhou, běijīngshì zhèngfǔ kāishǐ duì lǎo jūmínqū jìnxíng gǎizào.","In the late 1980s and early 1990s, the Beijing government began renovating old residential areas.","八十年代末|、|九十年代初|的|时候|，|北京市|政府|开始|对|老|居民区|进行|改造|。"],[42.04,50.72,"北京的历史悠久，有很多文化古迹，比如故宫、天坛、颐和园等等。","Běijīng de lìshǐ yōujiǔ, yǒu hěn duō wénhuà gǔjì, bǐrú Gùgōng, Tiāntán, Y function lcs(a,b){const n=a.length,m=b.length,d=Array.from({length:n+1},()=>new Uint16Array(m+1));

  const ia=new Set(),ib=new Set();let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ia.add(i);ib.add(j);i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return {ia,ib}}

  const right=[...target].map((c,k)=>miss.has(k)?`<span class="m">${esc(c)}</span>`:esc(c)).join('');

}

  const blocks=o.size==='chunks'?chunksOf(it.w):it.w.filter(w=>!PUN.test(w));
  let order=shuffle(blocks.map((t,i)=>i));if(blocks.length>1){let g=0;while(order.every((v,i)=>v===i)&&g++<9)order=shuffle(order)}
  R.cur={it,blocks,order,placed:[],tries:0,hint:0,done:false,given:0};
  const pct=Math.round(100*R.k/R.items.length);
  let h=`<button class="back" type="button" id="bk">← All sets</button>
  <div class="card">
   <div class="prog"><span>${esc(R.label)}</span></div>
   <div class="prog"><span>${R.k+1} / ${R.items.length}</span><span class="pbar"><i style="width:${pct}%"></i></span><span>${!R.set?`${set.app==='zhl'?'听1':'听2'}·${set.id}`:''}</span></div>
   <div class="play"><button class="pb" id="pl" type="button" aria-label="Play the sentence"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg></button>
     <div style="flex:1;min-width:0">${o.en?`<div class="prompt-en">${esc(it.en)}</div>`:`<div class="prompt-en off">Listen and rebuild what you hear.</div>`}
     ${o.py?`<div class="pyhint">${esc(it.py)}</div>`:''}</div></div>`;
  if(o.mode==='blocks')h+=`<div class="ans empty" id="ans" aria-label="Your sentence"></div><div class="bank" id="bank">${order.map(i=>`<button class="tile" type="button" data-i="${i}" data-py="${esc(pyOf(blocks[i]))}">${esc(blocks[i])}</button>`).join('')}</div>`;
  else h+=`<textarea id="ta" placeholder="${S.opt.tones?'Type pinyin with tones (wo3 xiang3 … or wǒ xiǎng …) — or 汉字':'Type the whole sentence (汉字 or pinyin)'}" autocomplete="off" autocapitalize="off" spellcheck="false" lang="zh"></textarea>`;
  h+=`<div id="fb"></div>
   <div class="row" id="acts"><button class="btn pri" id="ck" type="button">Check</button>${o.mode==='blocks'?`<button class="btn" id="ht" type="button">Hint</button><button class="btn" id="cl" type="button">Clear</button>`:''}<button class="btn" id="sh" type="button">Show</button><span class="sp"></span><button class="btn" id="sk" type="button">Skip →</button></div>
  </div>`;
  $('app').innerHTML=h;
  $('bk').onclick=home;
  $('pl').onclick=()=>playClip(it,$('pl'));
  $('ck').onclick=check;$('sh').onclick=()=>finish(0,true);$('sk').onclick=()=>{R.log.push([it,null]);next()};
  if(o.mode==='blocks'){
    $('bank').querySelectorAll('.tile').forEach(b=>b.onclick=()=>place(+b.dataset.i));
    $('ht').onclick=hint;$('cl').onclick=()=>{R.cur.placed=R.cur.placed.slice(0,R.cur.given);drawAns()};
  }else{const ta=$('ta');ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();R.cur.done?next():check()}});setTimeout(()=>{try{ta.focus({preventScroll:true})}catch(e){}},50)}
  if(o.auto)setTimeout(()=>playClip(it,$('pl')),250);
}
function place(i){const c=R.cur;if(c.done||c.placed.includes(i))return;c.placed.push(i);clearMarks();drawAns()}
function clearMarks(){$('fb').innerHTML=''}
function drawAns(){const c=R.cur,a=$('ans');
  a.innerHTML=c.placed.map((i,p)=>`<button class="tile${p<c.given?' given':''}" type="button" data-p="${p}">${esc(c.blocks[i])}</button>`).join('');
  a.classList.toggle('empty',!c.placed.length);
  a.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(c.done)return;const p=+b.dataset.p;if(p<c.given)return;c.placed.splice(p,1);clearMarks();drawAns()});
  $('bank').querySelectorAll('.tile').forEach(b=>b.classList.toggle('used',c.placed.includes(+b.dataset.i)));
  if(c.placed.length===c.blocks.length&&!c.done)check();
}
function hint(){const c=R.cur;if(c.done)return;
  /* keep the correct beginning, put the next right block in place */
  let k=0;while(k<c.placed.length&&c.blocks[c.placed[k]]===c.blocks[k])k++;
  const keep=c.placed.slice(0,k),rest=[...Array(c.blocks.length).keys()].filter(i=>!keep.includes(i));
  const nxt=rest.find(i=>c.blocks[i]===c.blocks[k]);if(nxt==null)return;
  c.placed=keep.concat([nxt]);c.given=Math.max(c.given,k+1);c.hint++;clearMarks();drawAns()}
function check(){const c=R.cur;if(c.done)return;const it=c.it;
  if(S.opt.mode==='blocks'){
    if(!c.placed.length)return;
    const ok=c.placed.length===c.blocks.length&&c.placed.every((i,p)=>c.blocks[i]===c.blocks[p]);
    if(ok)return finish(c.tries===0&&c.hint===0?2:1);
    c.tries++;
    $('ans').querySelectorAll('.tile').forEach((b,p)=>{if(p<c.given)return;b.classList.add(c.blocks[c.placed[p]]===c.blocks[p]?'ok':'bad')});
    $('fb').innerHTML=`<div class="fb bad"><span class="v">${c.placed.length<c.blocks.length?'Not finished yet':'Not quite'}</span><span class="small">Green blocks are in the right place. Tap a block in your sentence to send it back, or use Hint.</span></div>`;
  }else{
    const v=$('ta').value.trim();if(!v)return;
    let ok,tc=null;if(hasHan(v))ok=hanOnly(v)===hanOnly(it.zh);else if(S.opt.tones){tc=toneCheck(v,it);ok=tc.ok;if(c.tries===0&&tc.pairs)PYT.note(tc.pairs,'sent')}else ok=pyNorm(v)===pyNorm(it.py);
    if(ok)return finish(c.tries===0?2:1);
    c.tries++;
    let body='';
    if(hasHan(v)){const d=diffHTML(v,it.zh);const miss=(d.right.match(/class="m"/g)||[]).length,xtra=(d.yours.match(/class="x"/g)||[]).length;body=`<div class="small">Your answer — green is right, red doesn't belong:</div><div class="han">${d.yours||'—'}</div><div class="small">${miss?`${miss} character${miss>1?'s are':' is'} still missing. `:''}${xtra&&!miss?'Remove the red characters. ':''}Listen again and fix it, or tap Show.</div>`;}
    else if(tc)body=tc.html;
    else body=`<div class="small">The pinyin doesn't match yet. Listen again and try once more, or tap Show.</div>`;
    $('fb').innerHTML=`<div class="fb bad"><span class="v">Not quite</span>${body}</div>`;
  }
}
/* tones must be right: compare typed pinyin syllable by syllable */
function toneCheck(v,it){const hz=[...it.zh].filter(ch=>/[\u3400-\u9fff]/.test(ch));
  const exp=PYT.split(it.py,hz.length)||PYT.split(it.py,null)||[];const sur=PYT.surface(exp,exp.length===hz.length?hz:null);
  const you=PYT.split(v,null);
  if(!you)return {ok:false,html:`<div class="small">I couldn't read that as pinyin. Separate syllables with spaces and put the tone after each one: <b>wo3 xiang3 qu4</b>.</div>`};
  const A=you.map(x=>x[0]),B=exp.map(x=>x[0]),n=A.length,m=B.length,d=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=A[i]===B[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const map=new Map();let i=0,j=0;while(i<n&&j<m){if(A[i]===B[j]){map.set(i,j);i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}
  let bad=0,wrongT=0;const pairs=[];
  const html=you.map(([sy,t],k)=>{if(!map.has(k)){bad++;return `<span class="x">${esc(PYT.mark(sy,t))}</span>`}const jj=map.get(k),okT=t===exp[jj][1]||t===sur[jj];pairs.push([sur[jj],t]);
    if(okT)return `<span class="g">${esc(PYT.mark(sy,t))}</span>`;wrongT++;return `<span class="tw">${esc(PYT.mark(sy,t))}</span>`}).join(' ');
  const miss=m-map.size;const ok=!bad&&!miss&&!wrongT;
  return {ok,pairs,html:`<div class="small">Your pinyin — green is right, orange has the wrong tone, red isn't in the sentence:</div><div class="han">${html}</div><div class="small">${wrongT?`${wrongT} tone${wrongT>1?'s':''} to fix. `:''}${miss?`${miss} syllable${miss>1?'s':''} missing. `:''}Listen again (🐢 0.65× helps), or tap Show.</div>`}}
function finish(g,shown){const c=R.cur,it=c.it;if(c.done)return;c.done=true;
  const prev=S.res[ik(it)];
  /* a sentence stays ✓ only if you get it first try again; showing it marks it to practise */
  S.res[ik(it)]=g;save();R.log.push([it,g]);
  if(S.opt.mode==='blocks'){c.placed=c.blocks.map((b,i)=>i);c.given=0;drawAns();$('ans').querySelectorAll('.tile').forEach(b=>b.classList.add(g?'ok':'given'))}
  let extra='';
  if(S.opt.mode==='type'&&hasHan($('ta').value)&&!g){const d=diffHTML($('ta').value,it.zh);extra=`<div class="small">Yours:</div><div class="han">${d.yours||'—'}</div><div class="small">Sentence:</div>`;}
  const v=g===2?'✓ Right first time':g===1?'✓ Right':'Here it is';
  $('fb').innerHTML=`<div class="fb ${g?'ok':'bad'}"><span class="v">${v}</span>${extra}<div class="han">${S.opt.mode==='type'&&!g&&hasHan($('ta').value)?diffHTML($('ta').value,it.zh).right:esc(it.zh)}</div><div class="py">${esc(it.py)}</div><div class="en">${esc(it.en)}</div></div>`;
  if(S.opt.mode==='type')$('ta').readOnly=true;
  $('acts').innerHTML=`<button class="btn" id="pl2" type="button">🔊 Hear it again</button><span class="sp"></span><button class="btn pri" id="nx" type="button">${R.k+1<R.items.length?'Next →':'Finish'}</button>`;
  $('pl2').onclick=()=>playClip(it,$('pl'));$('nx').onclick=next;setTimeout(()=>{try{$('nx').focus({preventScroll:true})}catch(e){}},30);
  if(g)playClip(it,$('pl'));
}
function next(){R.k++;if(R.k<R.items.length)item();else summary()}
function summary(){
  const L=R.log,f=L.filter(x=>x[1]===2).length,ok=L.filter(x=>x[1]>=1).length;
  const wrong=L.filter(x=>x[1]!==2).map(x=>x[0]);
  const idx=R.set?SETS.indexOf(R.set):-1,nextSet=idx>=0&&idx+1<SETS.length?SETS[idx+1]:null;
  let h=`<button class="back" type="button" id="bk">← All sets</button><div class="card"><div class="done"><div class="big">${f}/${L.length}</div><div>right first time · ${ok} right in the end</div>
   <div class="row" style="justify-content:center">${wrong.length?`<button class="btn pri" id="again-w" type="button">Practise the ${wrong.length} again</button>`:''}<button class="btn" id="again" type="button">Whole round again</button>${nextSet?`<button class="btn" id="nxs" type="button">Next set →</button>`:''}</div>
   <div class="mini">${L.map(([it,g])=>`<div><span class="mk ${g===2?'g1':g===1?'gh':'g0'}">${g===2?'✓':g===1?'~':g===0?'✗':'–'}</span><span class="han">${esc(it.zh)}</span></div>`).join('')}</div></div></div>`;
  $('app').innerHTML=h;$('bk').onclick=home;
  const items=R.items,set=R.set,label=R.label;
  if(wrong.length)$('again-w').onclick=()=>start(wrong,null,label+' · again');
  $('again').onclick=()=>start(items.slice(),set,label);
  if(nextSet)$('nxs').onclick=()=>start(nextSet.items,nextSet);
  scrollTo(0,0);
}
home();
</script>
</body></html>
