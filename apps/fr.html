<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Grammaire française C1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a galley proof on the editor's desk. Settings rail left, the proof sheet right with a numbered margin; corrections appear in blue pencil. Stacks to one column on phones. */
:root{
  --paper:#eceef2; --sheet:#fafbfc; --ink:#171a21; --muted:#5b6272; --rule:#d3d8e1; --rule-strong:#b6bdca;
  --accent:#2a46c2; --accent-ink:#ffffff; --accent-soft:#e2e7f8; --margin-line:#c3cdf0;
  --ok:#1d7347; --ok-soft:#e1f1e8; --bad:#b0281f; --bad-soft:#f8e4e2;
  --f-display:"Libre Caslon Display","Libre Caslon Text",Georgia,"Times New Roman",serif;
  --f-text:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1117; --sheet:#151922; --ink:#e7e9ef; --muted:#9aa3b5; --rule:#2a313d; --rule-strong:#3c4554;
  --accent:#8ea4ff; --accent-ink:#0e1117; --accent-soft:#1d2540; --margin-line:#2d3860;
  --ok:#63c991; --ok-soft:#13281d; --bad:#ff8f86; --bad-soft:#331a1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1117; --sheet:#151922; --ink:#e7e9ef; --muted:#9aa3b5; --rule:#2a313d; --rule-strong:#3c4554;
  --accent:#8ea4ff; --accent-ink:#0e1117; --accent-soft:#1d2540; --margin-line:#2d3860;
  --ok:#63c991; --ok-soft:#13281d; --bad:#ff8f86; --bad-soft:#331a1a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
.wrap{max-width:1180px;margin-inline:auto}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 32px;padding-bottom:18px;border-bottom:1px solid var(--rule-strong);margin-bottom:24px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,5vw,3.1rem);line-height:1.02;margin:0;letter-spacing:-.005em;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--muted);font-family:var(--f-text);font-style:italic}
.stats{display:flex;gap:6px 26px;flex-wrap:wrap}
.stat{min-width:64px}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.layout{display:grid;grid-template-columns:292px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}

/* rail */
.rail{background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
.rail>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.rail>summary::-webkit-details-marker{display:none}
.rail>summary .sc{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted)}
.rail[open]>summary{border-bottom:1px solid var(--rule)}
.rail-body{padding:12px 14px 14px;display:grid;gap:14px}
.row-tools{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--rule-strong);border-radius:3px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:6px 8px;font-size:13px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent);font-weight:600}
.seg label:has(input:checked){background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.units{display:grid}
.unit{border-top:1px solid var(--rule)}
.unit:first-child{border-top:0}
.unit-head{display:flex;align-items:center;gap:8px;padding:6px 0}
.unit-head label{display:flex;gap:8px;align-items:baseline;flex:1;min-width:0;cursor:pointer}
.sec{font-family:var(--f-mono);font-size:12px;color:var(--accent);min-width:2.4em}
.uname{min-width:0}
.ucount{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0;flex:none}
.exp{border:1px solid var(--rule);background:transparent;border-radius:3px;width:24px;height:24px;line-height:1;cursor:pointer;color:var(--muted);flex:none}
.exlist{display:grid;gap:2px;padding:0 0 8px 23px}
.exrow{display:flex;gap:8px;align-items:baseline;font-size:13px;cursor:pointer;padding:2px 0}
.exid{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:2.6em}
.extitle{flex:1;min-width:0}

/* buttons */
.btn{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:3px;padding:8px 14px;cursor:pointer;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{padding:5px 10px;font-size:13px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}

/* sheet */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:20px 24px 24px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.sheet-head b{color:var(--accent);font-weight:500}
.bar{height:3px;background:var(--rule);margin:10px 0 18px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ex-title{font-family:var(--f-display);font-weight:400;font-size:1.65rem;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.ins{margin:0 0 18px;color:var(--muted);max-width:68ch}
.item{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 18px}
.margin{border-right:1px solid var(--margin-line);padding-right:12px;text-align:right;font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:6px}
.mark{font-size:18px;line-height:1;font-family:var(--f-text)}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
.body{min-width:0}
.prompt{font-family:var(--f-text);font-size:1.22rem;line-height:2.05;margin:0;overflow-wrap:break-word}
.prompt.src{line-height:1.6;margin-bottom:12px}
.ctx{font-family:var(--f-text);font-size:1.05rem;line-height:1.6;margin:0 0 10px;color:var(--muted)}
.keyrow{margin:0 0 10px}
.key{display:inline-block;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;border:1px solid var(--accent);color:var(--accent);padding:2px 9px;border-radius:2px}
.gap{font-family:var(--f-mono);font-size:.82em;border:0;border-bottom:1.5px solid var(--rule-strong);background:var(--accent-soft);border-radius:2px 2px 0 0;padding:1px 5px;margin:0 2px;max-width:100%}
.gap:focus{outline:none;border-bottom-color:var(--accent)}
.g{font-family:var(--f-mono);font-size:.82em;padding:0 3px;margin:0 2px;border-radius:2px}
.g.ok{color:var(--ok);background:var(--ok-soft)}
.g.bad s{color:var(--bad);text-decoration-thickness:1.5px}
.g.bad ins{text-decoration:none;color:var(--accent);font-family:var(--f-text);font-style:italic;font-size:1.15em;margin-left:4px}
.g.bad ins::before{content:"‸";margin-right:1px;font-style:normal}
.blank{display:inline-block;min-width:4.5em;border-bottom:1.5px solid var(--rule-strong);margin:0 3px;line-height:1.2}
.ans{width:100%;font-family:var(--f-text);font-size:1.12rem;line-height:1.5;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:3px;background:var(--paper);resize:vertical;min-height:3.4em}
.ans:focus{outline:none;border-color:var(--accent)}
.ans[readonly]{opacity:.8}
.ans.tall{min-height:13em}
.opts{display:grid;gap:8px;margin-top:6px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;border:1px solid var(--rule-strong);background:var(--sheet);border-radius:3px;padding:10px 14px;cursor:pointer;font-family:var(--f-text);font-size:1.06rem;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .ol{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.out{opacity:.4}
.opt:disabled{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-left:62px}
.hint{margin:12px 0 0 62px;font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.fb{margin:18px 0 0 62px;padding-top:14px;border-top:1px dashed var(--rule-strong);display:grid;gap:8px;max-width:72ch}
.fb p{margin:0}
.verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.answer{font-family:var(--f-text);font-style:italic;font-size:1.12rem;color:var(--accent);line-height:1.5}
.yours s{color:var(--bad);font-family:var(--f-text);text-decoration-thickness:1.5px}
.also{font-size:13px;color:var(--muted)}
.note{color:var(--ink);font-size:14px}
.hunt-list{margin:0;padding-left:1.4em;display:grid;gap:3px;font-size:14px}
.hunt-list li.found::marker{color:var(--ok)}
.hunt-list li.found{color:var(--ok)}
.hunt-list li.missed{color:var(--bad)}
.hunt-list li span{color:var(--ink)}
@media (max-width:560px){
  .sheet{padding:16px 14px 18px}
  .item{grid-template-columns:28px minmax(0,1fr);gap:0 10px}
  .margin{padding-right:8px}
  .actions,.hint,.fb{padding-left:0;margin-left:0}
  .prompt{font-size:1.1rem}
}

/* whole-exercise sheet */
.ws-list{display:grid;gap:24px}
.item.ws{padding-bottom:22px;border-bottom:1px dashed var(--rule)}
.item.ws:last-child{border-bottom:0;padding-bottom:0}
.item.ws .ifb{margin:12px 0 0;padding-top:10px}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft)}
.actions.sticky{position:sticky;bottom:0;z-index:3;background:var(--sheet);margin:24px -24px -24px;padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);border-radius:0 0 4px 4px;align-items:center}
.ws-score{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
@media (max-width:560px){.actions.sticky{margin:20px -14px -18px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}.ws-score{margin-left:0;width:100%}}

.also.near{color:var(--bad)}
.rules li b{font-weight:700}

/* summary + empty */
.summary h2{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:4px 0}
.byunit{border-collapse:collapse;margin:14px 0 4px;font-size:14px;width:100%;max-width:420px}
.byunit td{padding:5px 8px 5px 0;border-bottom:1px solid var(--rule)}
.byunit td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-family:var(--f-text);font-size:1.1rem}

/* rules + log */
.rules,.log{margin-top:18px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
.rules>summary{cursor:pointer;padding:12px 16px;font-weight:600}
.rules>summary .sec{margin-right:6px}
.rules ul{margin:0;padding:4px 16px 14px 34px;display:grid;gap:6px;max-width:80ch}
.rules li{font-size:14px}
.rules i,.note i{font-family:var(--f-text)}
.rules.flash{border-color:var(--accent)}
.log{padding:12px 16px 14px}
.log-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.log h3{margin:0;font-size:15px}
.log .count{font-family:var(--f-mono);color:var(--muted);font-size:12px;margin-left:6px}
.loglist{list-style:none;margin:10px 0 0;padding:0;display:grid}
.loglist li{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:2px 10px;padding:7px 0;border-top:1px solid var(--rule);font-size:13px}
.lid{font-family:var(--f-mono);color:var(--accent);grid-row:span 2}
.lq{color:var(--muted);overflow-wrap:anywhere}
.la{font-family:var(--f-text);font-style:italic;overflow-wrap:anywhere}
.log-empty{margin:8px 0 0;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top wrap">
  <div>
    <p class="eyebrow">Grammaire · niveau DALF C1</p>
    <h1>Grammaire française C1</h1>
    <p class="sub">3 modules, 65 règles et <span id="totalItems">900</span> phrases, corrigées au fil de l’eau.</p>
  </div>
  <div class="stats" aria-label="Cette séance">
    <div class="stat"><b id="stCorrect">0</b><span>Justes</span></div>
    <div class="stat"><b id="stDone">0</b><span>Corrigées</span></div>
    <div class="stat"><b id="stAcc">–</b><span>Réussite</span></div>
    <div class="stat"><b id="stStreak">0</b><span>Série</span></div>
  </div>
</header>

<div class="layout wrap">
  <aside>
    <details class="rail" id="rail">
      <summary><span>Règles et réglages</span><span class="sc" id="selCount"></span></summary>
      <div class="rail-body">
        <div class="row-tools">
          <button class="btn small" id="selAll" type="button">Tout cocher</button>
          <button class="btn small" id="selNone" type="button">Tout décocher</button>
        </div>
        <div class="seg" role="radiogroup" aria-label="Affichage">
          <label><input type="radio" name="view" id="viewOne" value="single"><span>Une à la fois</span></label>
          <label><input type="radio" name="view" id="viewAll" value="sheet"><span>Règle entière</span></label>
        </div>
        <div class="seg" role="radiogroup" aria-label="Ordre">
          <label><input type="radio" name="order" id="ordIn" value="order"><span>Dans l’ordre</span></label>
          <label><input type="radio" name="order" id="ordSh" value="shuffle"><span>Mélangées</span></label>
        </div>
        <div class="units" id="unitList"></div>
        <button class="btn primary block" id="startBtn" type="button">Commencer</button>
      </div>
    </details>
  </aside>
  <main>
    <section class="sheet" id="sheet"></section>
    <details class="rules" id="rules" open><summary></summary><ul></ul></details>
    <section class="log" id="log"></section>
  </main>
</div>
<script>
/* ============ DATA (from the original French drill) ============ */

/* ============ ENGINE ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- normalisation ---- */
const ZERO=new Set(['ø','-','0','zero','none','nothing','x','—','–','/','no article']);
function base(s){return String(s).normalize('NFC').replace(/[’‘`´]/g,"'").replace(/[“”«»„]/g,'"').toLowerCase().replace(/\s+/g,' ').trim();}
function spelling(s){return s;}
function loose(s){let t=spelling(base(s));t=t.replace(/[.,;:!?"()\[\]…—–\-\/]/g,' ');return t.replace(/\s+/g,' ').trim();}
function strict(s){let t=spelling(base(s));t=t.replace(/"/g,'');t=t.replace(/\s*[—–]\s*/g,' — ').replace(/\s+-\s+/g,' — ');t=t.replace(/\s+([,;:.!?])/g,'$1');t=t.replace(/[.!?]+$/,'');return t.replace(/\s+/g,' ').trim();}
function gapNorm(v,zero){const b=base(v);if(ZERO.has(b)||(zero&&b===''))return 'ø';return loose(v);}
function bareN(s){return gapNorm(s,false).normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function nearMsg(it,vals,per,reveal){if(reveal)return '';return it.a.some((alts,i)=>!per[i]&&(vals[i]||'').trim()&&alts.split('|').some(a=>bareN(a)===bareN(vals[i])))?'<p class="also near">Presque : vérifiez les accents.</p>':'';}

/* ---- answer patterns: {a|b} alternatives, (x) optional, nesting allowed ---- */
function splitTop(s){const parts=[];let d=0,cur='';for(const ch of s){if(ch==='{'||ch==='(')d++;else if(ch==='}'||ch===')')d--;if(ch==='|'&&d===0){parts.push(cur);cur='';}else cur+=ch;}parts.push(cur);return parts;}
function closeAt(s,i){let d=0;for(let j=i;j<s.length;j++){const ch=s[j];if(ch==='{'||ch==='(')d++;else if(ch==='}'||ch===')'){d--;if(d===0)return j;}}return s.length-1;}
function expand(s){let out=[''];let i=0;while(i<s.length){const c=s[i];if(c==='{'||c==='('){const j=closeAt(s,i);const opts=splitTop(s.slice(i+1,j)).flatMap(expand);if(c==='(')opts.push('');out=out.flatMap(r=>opts.map(o=>r+o));i=j+1;if(out.length>5000)out.length=5000;}else{out=out.map(r=>r+c);i++;}}return out;}
function canonRaw(s){let out='',i=0;while(i<s.length){const c=s[i];if(c==='{'||c==='('){const j=closeAt(s,i);out+=canonRaw(splitTop(s.slice(i+1,j))[0]);i=j+1;}else{out+=c;i++;}}return out;}
function canon(s){return canonRaw(s).replace(/\s+/g,' ').replace(/\s+([,;.!?])/g,'$1').trim();}
const accCache=new Map();
function accepted(it){if(!accCache.has(it)){const f=it.strict?strict:loose;accCache.set(it,new Set(it.a.flatMap(expand).map(f)));}return accCache.get(it);}

/* ---- storage (per viewer, optional) ---- */
const KEY='frdrill:';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}}};

/* ---- index ---- */
const INDEX={},ORDER=[],EXS={};
UNITS.forEach(u=>u.ex.forEach(ex=>{EXS[ex.id]={ex,u};ex.items.forEach((it,i)=>{const id=ex.id+'.'+(i+1);INDEX[id]={id,it,ex,u,i};ORDER.push(id);});}));
const ALL_EX=Object.keys(EXS);

let sel=new Set(store.get('sel',ALL_EX).filter(x=>EXS[x]));
let order=store.get('order','order')==='shuffle'?'shuffle':'order';
let view=store.get('view','single')==='sheet'?'sheet':'single';
let mistakes=store.get('mistakes',{});if(!mistakes||typeof mistakes!=='object')mistakes={};
const expanded=new Set();
let booted=false;

function newSession(){sess={done:0,correct:0,streak:0,best:0};results=[];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function selItemCount(){return ORDER.filter(id=>sel.has(INDEX[id].ex.id)).length;}

/* ---- rail ---- */
function renderRail(){
  const list=$('#unitList');
  list.innerHTML=UNITS.map(u=>{
    const ids=u.ex.map(e=>e.id);const on=ids.filter(id=>sel.has(id)).length;
    const cnt=u.ex.reduce((s,e)=>s+e.items.length,0);const open=expanded.has(u.n);
    return `<div class="unit"><div class="unit-head"><input type="checkbox" id="u${u.n}" data-unit="${u.n}" ${on===ids.length?'checked':''}><label for="u${u.n}"><span class="sec">§${u.n}</span><span class="uname">${esc(u.title)}</span></label><span class="ucount">${cnt}</span><button type="button" class="exp" data-exp="${u.n}" aria-expanded="${open}" aria-label="${open?'Masquer':'Afficher'} les règles du module ${u.n}">${open?'−':'+'}</button></div>
    <div class="exlist" ${open?'':'hidden'}>${u.ex.map(e=>`<label class="exrow"><input type="checkbox" id="x${e.id.replace('.','-')}" data-ex="${e.id}" ${sel.has(e.id)?'checked':''}><span class="exid">${e.id}</span><span class="extitle">${esc(e.title)}</span><span class="ucount">${e.items.length}</span></label>`).join('')}</div></div>`;
  }).join('');
  UNITS.forEach(u=>{const ids=u.ex.map(e=>e.id);const on=ids.filter(id=>sel.has(id)).length;const cb=$('#u'+u.n);cb.indeterminate=on>0&&on<ids.length;});
  const n=selItemCount();
  $('#selCount').textContent=`${n} phrases`;
  const nEx=ALL_EX.filter(x=>sel.has(x)).length;
  $('#startBtn').textContent=n?(view==='sheet'?`Commencer · ${nEx} règle${nEx===1?'':'s'}`:`Commencer · ${n} phrases`):'Cochez des règles pour commencer';
  $('#startBtn').disabled=!n;
  $('#ordIn').checked=order==='order';$('#ordSh').checked=order==='shuffle';
  $('#viewOne').checked=view==='single';$('#viewAll').checked=view==='sheet';
}
function saveSel(){store.set('sel',[...sel]);}

$('#unitList').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.unit){const u=UNITS.find(x=>x.n==t.dataset.unit);u.ex.forEach(ex=>t.checked?sel.add(ex.id):sel.delete(ex.id));}
  else if(t.dataset.ex){t.checked?sel.add(t.dataset.ex):sel.delete(t.dataset.ex);}
  saveSel();renderRail();
  const again=$('#'+t.id);if(again)again.focus();
});
$('#unitList').addEventListener('click',e=>{const b=e.target.closest('[data-exp]');if(!b)return;const n=+b.dataset.exp;expanded.has(n)?expanded.delete(n):expanded.add(n);renderRail();const nb=$(`[data-exp="${n}"]`);if(nb)nb.focus();});
$('#selAll').onclick=()=>{ALL_EX.forEach(x=>sel.add(x));saveSel();renderRail();};
$('#selNone').onclick=()=>{sel.clear();saveSel();renderRail();};
$$('input[name=order]').forEach(r=>r.addEventListener('change',()=>{order=r.value;store.set('order',order);}));
$$('input[name=view]').forEach(r=>r.addEventListener('change',()=>{view=r.value;store.set('view',view);renderRail();start(mode==='mistakes'?'mistakes':'normal');}));
$('#startBtn').onclick=()=>{start('normal');if(matchMedia('(max-width:880px)').matches){$('#rail').open=false;$('#sheet').scrollIntoView({behavior:'smooth',block:'start'});}};

/* ---- session ---- */
function start(m){
  mode=m||'normal';let ids;
  if(mode==='mistakes')ids=ORDER.filter(id=>mistakes[id]);
  else if(mode==='retry')ids=results.filter(r=>!r.ok).map(r=>r.id);
  else ids=ORDER.filter(id=>sel.has(INDEX[id].ex.id));
  ids=[...new Set(ids)];
  if(order==='shuffle')shuffle(ids);
  if(view==='sheet'){const groups=[],map=new Map();ids.forEach(id=>{const x=INDEX[id].ex.id;if(!map.has(x)){const g={ex:x,ids:[]};map.set(x,g);groups.push(g);}map.get(x).ids.push(id);});ids=groups;}
  queue=ids;pos=0;newSession();renderStats();renderItem();renderLog();
}
function renderStats(){
  $('#stCorrect').textContent=sess.correct;$('#stDone').textContent=sess.done;
  $('#stAcc').textContent=sess.done?Math.round(sess.correct/sess.done*100)+'%':'–';
  $('#stStreak').textContent=sess.streak;
}
function record(ok,ans){cur.prevStreak=sess.streak;recordId(cur.id,ok,ans);}
function recordId(id,ok,ans){
  sess.done++;
  if(ok){sess.correct++;sess.streak++;sess.best=Math.max(sess.best,sess.streak);delete mistakes[id];}
  else{sess.streak=0;mistakes[id]={a:String(ans||'').slice(0,300),t:Date.now()};}
  store.set('mistakes',mistakes);results.push({id,ok});renderStats();renderLog();
}
function stetId(id){
  const r=[...results].reverse().find(x=>x.id===id&&!x.ok);if(!r)return;
  r.ok=true;sess.correct++;
  let s=0;for(let i=results.length-1;i>=0&&results[i].ok;i--)s++;
  sess.streak=s;sess.best=Math.max(sess.best,s);
  delete mistakes[id];store.set('mistakes',mistakes);renderStats();renderLog();
}

/* ---- rules ---- */
function renderRules(u,ex){
  $('#rules summary').innerHTML=`<span class="sec">${ex?ex.id:'§'+u.n}</span>Règle · ${esc(ex?ex.title:u.title)}`;
  $('#rules ul').innerHTML=((ex&&ex.rules)||[]).concat(u.rules).map(r=>`<li>${r}</li>`).join('');
}

/* ---- item rendering ---- */
function renderItem(){
  const sheet=$('#sheet');
  if(!queue.length){
    sheet.innerHTML=`<p class="eyebrow">${mode==='normal'?'Rien de sélectionné':'Rien à reprendre'}</p><p class="empty">${mode==='normal'?'Cochez des modules ou des règles dans « Règles et réglages », puis appuyez sur Commencer.':'Aucune erreur dans cette série.'}</p><div class="actions" style="padding-left:0"><button class="btn primary" id="emptyAll" type="button">Travailler les 3 modules</button></div>`;
    $('#emptyAll').onclick=()=>{ALL_EX.forEach(x=>sel.add(x));saveSel();renderRail();start('normal');};
    return;
  }
  if(pos>=queue.length){renderSummary();return;}
  if(view==='sheet'){renderSheet();return;}
  const e=INDEX[queue[pos]];const it=e.it;
  cur={id:e.id,e,checked:false};
  renderRules(e.u,e.ex);
  sheet.innerHTML=`<div class="sheet-head"><span><b>§${e.u.n}</b> ${esc(e.u.title)} · Règle ${e.ex.id}</span><span>${mode==='mistakes'?'Révision des erreurs · ':mode==='retry'?'Reprise · ':''}${pos+1} / ${queue.length}</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${(pos/queue.length*100).toFixed(1)}%"></i></div>
  <h2 class="ex-title">${esc(e.ex.title)}</h2><p class="ins">${esc(e.ex.ins)}</p>
  <div class="item"><div class="margin"><span>${e.i+1}</span><span class="mark" id="mark" aria-hidden="true"></span></div><div class="body" id="body"></div></div>
  <p class="hint" id="hint" hidden></p>
  <div class="actions" id="actions"></div>
  <div class="fb" id="fb" hidden aria-live="polite"></div>`;
  const body=$('#body'),acts=$('#actions');
  const B=(id,label,cls='')=>`<button type="button" class="btn ${cls}" id="${id}">${label}</button>`;
  if(it.t==='gap'){
    let h='';
    if(it.ctx)h+=`<p class="ctx">${esc(it.ctx)}</p>`;
    if(it.k)h+=`<p class="keyrow"><span class="key">${esc(it.k)}</span></p>`;

/* ---- hints ---- */
function hint(){
  const it=cur.e.it,h=$('#hint');cur.hinted=true;
  if(it.t==='gap'){h.textContent='Commence par : '+it.a.map(a=>{const f=a.split('|')[0];return f==='Ø'?'Ø':f.slice(0,1)+'…';}).join('  ·  ');h.hidden=false;}
  else if(it.t==='tr'||it.t==='err'){const words=canon(it.a[0]).split(' ');h.textContent='Begins: '+words.slice(0,Math.min(3,Math.max(1,words.length-2))).join(' ')+' …';h.hidden=false;}
  else if(it.t==='mc'){
    const wrong=$$('.opt').filter(b=>+b.dataset.o!==it.a&&!b.disabled);
    if(it.o.length>2&&wrong.length>1){const b=wrong[Math.floor(Math.random()*wrong.length)];b.disabled=true;b.classList.add('out');h.textContent='One wrong option removed.';}
    else{const r=$('#rules');r.open=true;r.classList.add('flash');setTimeout(()=>r.classList.remove('flash'),1600);h.textContent='Check the rules below this sheet.';}
    h.hidden=false;
  }else if(it.t==='hunt'){h.textContent='Look for: a preposition, a tense, a dangling participle, the subjunctive, a relative pronoun, a verb pattern, an inversion, two conditional forms, a doubled linker, "albeit" and an article.';h.hidden=false;}
}

/* ---- feedback ---- */
function feedback(ok,inner,opts={}){

  $('#nextBtn').onclick=next;

}
function stet(){
  if(!cur||cur.ok)return;cur.ok=true;
  sess.correct++;sess.streak=(cur.prevStreak||0)+1;sess.best=Math.max(sess.best,sess.streak);
  delete mistakes[cur.id];store.set('mistakes',mistakes);
  const r=results[results.length-1];if(r&&r.id===cur.id)r.ok=true;
  renderStats();renderLog();
  const v=$('#verdict');v.className='verdict ok';v.textContent='Comptée comme juste';
  const mk=$('#mark');mk.textContent='✓';mk.className='mark ok';
  const sb=$('#stetBtn');if(sb)sb.remove();$('#nextBtn').focus();
}
function next(){pos++;renderItem();}

/* ---- checkers ---- */
function checkGap(reveal){
  if(cur.checked)return;
  const it=cur.e.it,zero=!!cur.e.ex.zero,gaps=$$('.gap');
  const vals=gaps.map(g=>g.value);
  if(!reveal&&!zero&&vals.every(v=>!v.trim())){$('#hint').hidden=false;$('#hint').textContent='Écrivez d’abord une réponse, ou appuyez sur « Voir la réponse ».';gaps[0].focus();return;}
  const per=it.a.map((alts,i)=>!reveal&&alts.split('|').map(a=>gapNorm(a,false)).includes(gapNorm(vals[i]||'',zero)));
  const ok=!reveal&&per.every(Boolean);
  gaps.forEach((g,i)=>{
    const span=document.createElement('span');const right=it.a[i].split('|')[0];
    const typed=vals[i].trim();
    if(per[i]){span.className='g ok';span.textContent=typed||'Ø';}
    else{span.className='g bad';span.innerHTML=(reveal?'':`<s>${esc(typed||(zero?'blank':'—'))}</s>`)+`<ins>${esc(right)}</ins>`;}
    g.replaceWith(span);
  });
  cur.checked=true;cur.ok=ok;
  const ans=reveal?'(réponse affichée)':vals.map(v=>v.trim()||(zero?'Ø':'—')).join(' · ');
  record(ok,ans);
  const alts=it.a.map((a,i)=>{const p=a.split('|');return p.length>1?`${it.a.length>1?`réponse ${i+1} : `:''}${p.map(esc).join(' / ')}`:null;}).filter(Boolean);
  feedback(ok,nearMsg(it,vals,per,reveal)+(alts.length?`<p class="also"><span class="lbl">Réponses admises</span>${alts.join('; ')}</p>`:''),{stet:!reveal,label:reveal?'Réponse affichée':null});
}
function checkMc(i){
  if(cur.checked)return;
  const it=cur.e.it,ok=i===it.a;
  $$('.opt').forEach(b=>{b.disabled=true;const o=+b.dataset.o;if(o===it.a)b.classList.add('right');else if(o===i)b.classList.add('wrong');});
  cur.checked=true;cur.ok=ok;record(ok,it.o[i]);
  feedback(ok,ok?'':`<p><span class="lbl">Answer</span><span class="answer">${esc(it.o[it.a])}</span></p>`);
}
function checkText(reveal){
  if(cur.checked)return;
  const it=cur.e.it,ta=$('#ans'),val=ta.value.trim();
  if(!reveal&&!val){$('#hint').hidden=false;$('#hint').textContent='Type an answer first, or press Show answer.';ta.focus();return;}
  const f=it.strict?strict:loose;
  const unchanged=it.t==='err'&&f(val)===f(it.q);
  const ok=!reveal&&accepted(it).has(f(val));
  ta.readOnly=true;cur.checked=true;cur.ok=ok;
  record(ok,reveal?'(réponse affichée)':val);
  const others=it.a.slice(1).map(canon).filter((x,i,arr)=>arr.indexOf(x)===i).slice(0,3);
  let h='';
  if(!ok&&!reveal)h+=`<p class="yours"><span class="lbl">Yours</span><s>${esc(val)}</s>${unchanged?' <span class="also">(unchanged)</span>':''}</p>`;
  h+=`<p><span class="lbl">${ok?'Model answer':'Correct version'}</span><span class="answer">${esc(canon(it.a[0]))}</span></p>`;
  if(others.length)h+=`<p class="also"><span class="lbl">Also accepted</span>${others.map(esc).join(' · ')}</p>`;
  feedback(ok,h,{stet:!reveal&&!unchanged,label:reveal?'Réponse affichée':null});
}
function revealOpen(){

  $('#actions').innerHTML=`<button type="button" class="btn primary" id="gotBtn">I had it</button><button type="button" class="btn" id="notBtn">Not yet</button>`;
  const self=ok=>{cur.ok=ok;record(ok,$('#ans').value.trim()||'(no answer)');const mk=$('#mark');mk.textContent=ok?'✓':'✗';mk.className='mark '+(ok?'ok':'bad');
    $('#actions').innerHTML=`<button type="button" class="btn primary" id="nextBtn">${pos+1<queue.length?'Phrase suivante ↵':'Voir le bilan ↵'}</button>`;$('#nextBtn').onclick=next;$('#nextBtn').focus({preventScroll:true});};
  $('#gotBtn').onclick=()=>self(true);$('#notBtn').onclick=()=>self(false);$('#gotBtn').focus({preventScroll:true});

function checkHunt(reveal){
  if(cur.checked)return;
  const it=cur.e.it,ta=$('#ans'),val=ta.value;
  const lv=loose(val),lq=loose(it.q);
  if(!reveal&&lv.length<lq.length*0.7){$('#hint').hidden=false;$('#hint').textContent='Keep the whole paragraph and edit only the errors.';return;}
  if(!reveal&&lv===lq){$('#hint').hidden=false;$('#hint').textContent='The paragraph is unchanged. Correct the errors first, or press Show answer.';return;}
  const found=it.errs.map(er=>!reveal&&!lv.includes(loose(er.w)));
  const n=found.filter(Boolean).length,ok=n===it.errs.length;
  ta.readOnly=true;cur.checked=true;cur.ok=ok;
  record(ok,reveal?'(réponse affichée)':`${n}/${it.errs.length} fixed`);
  const list=`<ol class="hunt-list">${it.errs.map((er,i)=>`<li class="${found[i]?'found':'missed'}">${found[i]?'Fixed':'Missed'}: <span>${esc(er.f)}</span></li>`).join('')}</ol>`;
  feedback(ok,`${reveal?'':`<p><span class="lbl">Score</span>You fixed ${n} of ${it.errs.length}.</p>`}${list}<p><span class="lbl">Corrected paragraph</span><span class="answer">${esc(it.m)}</span></p>`,{label:reveal?'Answer shown':(ok?'All 12 fixed':`${n} of ${it.errs.length} fixed`)});

/* ---- whole-exercise sheet ---- */

function renderSheet(){

function wsEval(b,reveal){
  const id=b.dataset.id,e=INDEX[id],it=e.it,zero=!!e.ex.zero;
  if(it.t==='gap'){
    const gaps=[...b.querySelectorAll('.gap')],vals=gaps.map(g=>g.value);
    const per=it.a.map((alts,i)=>!reveal&&alts.split('|').map(a=>gapNorm(a,false)).includes(gapNorm(vals[i]||'',zero)));
    const ok=!reveal&&per.every(Boolean);
    gaps.forEach((g,i)=>{const span=document.createElement('span');const right=it.a[i].split('|')[0];const typed=vals[i].trim();
      if(per[i]){span.className='g ok';span.textContent=typed||'Ø';}
      else{span.className='g bad';span.innerHTML=(reveal?'':`<s>${esc(typed||(zero?'blank':'—'))}</s>`)+`<ins>${esc(right)}</ins>`;}
      g.replaceWith(span);});
    const alts=it.a.map((a,i)=>{const p=a.split('|');return p.length>1?`${it.a.length>1?`réponse ${i+1} : `:''}${p.map(esc).join(' / ')}`:null;}).filter(Boolean);
    return {ok,ans:vals.map(v=>v.trim()||(zero?'Ø':'—')).join(' · '),html:nearMsg(it,vals,per,reveal)+(alts.length?`<p class="also"><span class="lbl">Réponses admises</span>${alts.join('; ')}</p>`:''),stet:!reveal&&vals.some(v=>v.trim())};
  }
  if(it.t==='mc'){
    const ch=b.querySelector('.opt.chosen'),i=ch?+ch.dataset.o:-1,ok=!reveal&&i===it.a;
    b.querySelectorAll('.opt').forEach(o=>{o.disabled=true;const k=+o.dataset.o;if(k===it.a)o.classList.add('right');else if(k===i)o.classList.add('wrong');o.classList.remove('chosen');});
    return {ok,ans:i>=0?it.o[i]:'(no answer)',html:ok?'':`${i<0&&!reveal?'<p class="also">No option chosen.</p>':''}<p><span class="lbl">Answer</span><span class="answer">${esc(it.o[it.a])}</span></p>`,stet:false};
  }
  if(it.t==='tr'||it.t==='err'){
    const ta=b.querySelector('textarea'),val=ta.value.trim(),f=it.strict?strict:loose;
    const unchanged=it.t==='err'&&f(val)===f(it.q);
    const ok=!reveal&&!!val&&accepted(it).has(f(val));ta.readOnly=true;
    const others=it.a.slice(1).map(canon).filter((x,k,arr)=>arr.indexOf(x)===k).slice(0,3);
    let h='';
    if(!ok&&!reveal)h+=val?`<p class="yours"><span class="lbl">Yours</span><s>${esc(val)}</s>${unchanged?' <span class="also">(unchanged)</span>':''}</p>`:'<p class="also">No answer given.</p>';
    h+=`<p><span class="lbl">${ok?'Model answer':'Correct version'}</span><span class="answer">${esc(canon(it.a[0]))}</span></p>`;
    if(others.length)h+=`<p class="also"><span class="lbl">Also accepted</span>${others.map(esc).join(' · ')}</p>`;
    return {ok,ans:val||'(no answer)',html:h,stet:!reveal&&!!val&&!unchanged};
  }
  if(it.t==='hunt'){
    const ta=b.querySelector('textarea'),lv=loose(ta.value),lq=loose(it.q),short=lv.length<lq.length*0.7;
    const found=it.errs.map(er=>!reveal&&!short&&!lv.includes(loose(er.w)));

    return {ok,ans:`${n}/${it.errs.length} fixed`,html:`${reveal?'':`<p><span class="lbl">Score</span>You fixed ${n} of ${it.errs.length}.${short?' (Most of the paragraph was deleted.)':''}</p>`}${list}<p><span class="lbl">Corrected paragraph</span><span class="answer">${esc(it.m)}</span></p>`,stet:false};
  }
}
function setWsMark(b,ok){b.dataset.ok=ok?'1':'0';const m=b.querySelector('.mark');m.textContent=ok?'✓':'✗';m.className='mark '+(ok?'ok':'bad');}

function checkAll(reveal){

    if(it.t==='open'){
      const ta=b.querySelector('textarea');ta.readOnly=true;
      ifb.innerHTML=`<p class="verdict" style="color:var(--accent)">Model answer</p><p class="answer">${esc(it.m)}</p>${it.n?`<p class="note">${esc(it.n)}</p>`:''}<div class="row-tools"><button type="button" class="btn small primary" data-self="1">I had it</button><button type="button" class="btn small" data-self="0">Not yet</button></div>`;
      ifb.querySelectorAll('[data-self]').forEach(btn=>btn.onclick=()=>{const ok=btn.dataset.self==='1';recordId(id,ok,ta.value.trim()||'(no answer)');setWsMark(b,ok);btn.parentElement.remove();updateWsScore();});
      return;
    }
    const r=wsEval(b,reveal);
    recordId(id,r.ok,reveal?'(réponse affichée)':r.ans);setWsMark(b,r.ok);
    ifb.innerHTML=`<p class="verdict ${r.ok?'ok':'bad'}">${reveal?'Réponse affichée':r.ok?'Juste':'Pas tout à fait'}</p>${r.html||''}${it.n?`<p class="note">${esc(it.n)}</p>`:''}${r.stet&&!r.ok?`<div class="row-tools"><button type="button" class="btn small" data-stet title="Si votre réponse est correcte mais absente de la liste, comptez-la comme juste.">Ma réponse est juste</button></div>`:''}`;
    const sb=ifb.querySelector('[data-stet]');
    if(sb)sb.onclick=()=>{stetId(id);setWsMark(b,true);const v=ifb.querySelector('.verdict');v.className='verdict ok';v.textContent='Comptée comme juste';sb.parentElement.remove();updateWsScore();};
  });
  $('#actions').innerHTML=`<button type="button" class="btn primary" id="nextBtn">${pos+1<queue.length?'Règle suivante':'Voir le bilan'}</button><span class="ws-score" id="wsScore"></span>`;
  $('#nextBtn').onclick=next;updateWsScore();
  const first=$('#sheet .item.ws');if(first&&first.scrollIntoView)first.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---- summary ---- */
function renderSummary(){
  const total=results.length,correct=results.filter(r=>r.ok).length,wrong=total-correct;
  const by={};results.forEach(r=>{const u=INDEX[r.id].u;(by[u.n]=by[u.n]||{u,c:0,t:0});by[u.n].t++;if(r.ok)by[u.n].c++;});
  const rows=Object.values(by).sort((a,b)=>a.u.n-b.u.n).map(x=>`<tr><td><span class="sec">§${x.u.n}</span>${esc(x.u.title)}</td><td class="n">${x.c} / ${x.t}</td></tr>`).join('');
  $('#sheet').innerHTML=`<div class="summary"><p class="eyebrow">${mode==='mistakes'?'Révision terminée':mode==='retry'?'Reprise terminée':'Série terminée'}</p>
  <h2>${total?`${correct} sur ${total} justes`:'Aucune réponse enregistrée'}</h2>
  <p class="ins">${total?`${Math.round(correct/total*100)} % de réussite · meilleure série ${sess.best}`:'Toutes les phrases ont été passées.'}</p>
  ${rows?`<table class="byunit"><tbody>${rows}</tbody></table>`:''}
  <div class="actions" style="padding-left:0">${wrong?`<button type="button" class="btn primary" id="retryBtn">Reprendre mes ${wrong} erreur${wrong>1?'s':''}</button>`:''}<button type="button" class="btn ${wrong?'':'primary'}" id="againBtn">Recommencer</button></div></div>`;
  const r=$('#retryBtn');if(r)r.onclick=()=>start('retry');
  $('#againBtn').onclick=()=>start(mode==='mistakes'?'mistakes':'normal');
  (r||$('#againBtn')).focus({preventScroll:true});
}

/* ---- mistake log ---- */
function snippet(it){let s=(it.ctx||it.q).replace(/__/g,'……');return s.length>96?s.slice(0,94)+'…':s;}
function answerText(it){
  if(it.t==='gap')return it.a.map(a=>a.split('|')[0]).join(' · ');
  if(it.t==='mc')return it.o[it.a];
  if(it.t==='tr'||it.t==='err')return canon(it.a[0]);
  if(it.t==='open')return it.m.length>110?it.m.slice(0,108)+'…':it.m;
  return '12 corrections';
}
function renderLog(){
  const ids=Object.keys(mistakes).filter(id=>INDEX[id]).sort((a,b)=>mistakes[b].t-mistakes[a].t);
  const log=$('#log');
  log.innerHTML=`<div class="log-head"><h3>Carnet d’erreurs<span class="count">${ids.length}</span></h3>${ids.length?`<div class="row-tools"><button type="button" class="btn small primary" id="drillMis">Revoir mes erreurs</button><button type="button" class="btn small ghost" id="clearMis">Effacer</button></div>`:''}</div>
  ${ids.length?`<ol class="loglist">${ids.slice(0,15).map(id=>{const it=INDEX[id].it;return `<li><span class="lid">${id}</span><span class="lq">${esc(snippet(it))}</span><span class="la">→ ${esc(answerText(it))}</span></li>`;}).join('')}</ol>${ids.length>15?`<p class="log-empty">Les 15 plus récentes sur ${ids.length}.</p>`:''}`:`<p class="log-empty">Les phrases manquées s’affichent ici et restent enregistrées dans ce navigateur. Une phrase réussie plus tard quitte le carnet.</p>`}`;
  const d=$('#drillMis');if(d)d.onclick=()=>{start('mistakes');$('#sheet').scrollIntoView({behavior:'smooth',block:'start'});};
  const c=$('#clearMis');if(c)c.onclick=()=>{if(c.dataset.armed){mistakes={};store.set('mistakes',mistakes);renderLog();}else{c.dataset.armed='1';c.textContent='Cliquez encore pour effacer';setTimeout(()=>{if(c.isConnected){delete c.dataset.armed;c.textContent='Effacer';}},3000);}};
}

/* ---- boot ---- */
document.documentElement.lang='fr';
$('#totalItems').textContent=ORDER.length;
(function migrate(){
  if(store.get('migrated',false))return;
  const map={};ORDER.forEach(id=>{const s=INDEX[id].it.src;if(s)map[s]=id;});
  const nrm=s=>String(s).normalize('NFC').toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ').trim();
  [['subj','subj500'],['pp','pp200'],['conc','conc200']].forEach(([p,k])=>{
    let S=null;try{S=JSON.parse(localStorage.getItem(k)||'null');}catch(err){}
    if(!S||!S.chk)return;
    Object.keys(S.chk).forEach(oid=>{
      const id=map[p+':'+oid];if(!id)return;
      const v=nrm((S.ans&&S.ans[oid])||'');if(!v)return;
      if(!INDEX[id].it.a[0].split('|').some(a=>nrm(a)===v))mistakes[id]={a:S.ans[oid],t:Date.now()-1};
    });
  });
  store.set('mistakes',mistakes);store.set('migrated',true);
})();
try{$('#rail').open=matchMedia('(min-width:881px)').matches;}catch(e){$('#rail').open=true;}
renderRail();
start('normal');
booted=true;

</script>

<style id="mgate-css">
.mg-back{position:fixed;inset:0;z-index:2147483000;background:rgba(15,20,18,.5);display:grid;place-items:center;padding:16px}
.mg-card{width:min(400px,100%);background:#fff;color:#1b2421;border-radius:16px;padding:20px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.3);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mg-card h2{margin:0 0 6px;font-size:20px;line-height:1.25;font-weight:700;letter-spacing:0;text-transform:none;color:inherit}
.mg-card p{margin:0 0 6px;color:#4a5752}
.mg-n{display:inline-block;min-width:1.8em;text-align:center;font-weight:700;color:#b5442f;background:#f7e5e0;border-radius:999px;padding:0 8px;margin-right:4px}
.mg-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mg-row button{font:600 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border-radius:12px;min-height:46px;padding:0 16px;cursor:pointer;border:1px solid #cfd8d3;background:#fff;color:#1b2421;flex:1 1 auto}
.mg-row .mg-go{background:#2b7a5e;border-color:#2b7a5e;color:#fff;flex:2 1 auto}
.mg-row button:focus-visible{outline:3px solid #2b7a5e;outline-offset:2px}
.mg-small{font-size:12.5px;color:#6b7873;margin-top:10px}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .mg-card{background:#19211f;color:#e3ebe7}html:not([data-theme=light]) .mg-card p{color:#a9b8b1}html:not([data-theme=light]) .mg-row button{background:#19211f;color:#e3ebe7;border-color:#34413c}html:not([data-theme=light]) .mg-row .mg-go{background:#62c39c;border-color:#62c39c;color:#0f1714}html:not([data-theme=light]) .mg-n{background:#3a221d;color:#e58169}}
</style>
<script>
/* Mistake gate (added): once 20 mistakes are waiting, a pop-up offers to redo them
   before the next new exercise. "Not now" asks again after 5 more mistakes. */
(function(A){
  var LIMIT=20,KEY='mgate-snooze',bypass=false,open=null;
  function n(){try{return A.count()||0}catch(e){return 0}}
  function sz(){try{return +localStorage.getItem(KEY)||0}catch(e){return 0}}
  function setSz(v){try{if(v)localStorage.setItem(KEY,String(v));else localStorage.removeItem(KEY)}catch(e){}}
  function should(){if(bypass||open)return false;try{if(A.inReview())return false}catch(e){return false}
    var c=n();if(c<LIMIT){if(sz())setSz(0);return false}var s=sz();return !s||c>=s+5}
  function close(){if(open){open.remove();open=null}}
  function pop(btn){var c=n();var d=document.createElement('div');d.className='mg-back';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','mg-h');
    d.innerHTML='<div class="mg-card"><h2 id="mg-h">Time to redo your mistakes</h2><p><span class="mg-n">'+c+'</span>mistakes are waiting for you.</p><p>Redo them now, before new exercises. Each one you get right comes off the list.</p><div class="mg-row"><button type="button" class="mg-go">Redo '+Math.min(LIMIT,c)+' mistakes</button><button type="button" class="mg-later">Not now</button></div><p class="mg-small">“Not now” continues with the new exercise. I’ll ask again after 5 more mistakes.</p></div>';
    document.body.appendChild(d);open=d;
    d.querySelector('.mg-go').onclick=function(){close();setSz(0);try{A.start()}catch(e){console.error(e)}};
    d.querySelector('.mg-later').onclick=function(){close();setSz(c);if(btn&&btn.isConnected){bypass=true;try{btn.click()}finally{bypass=false}}};
    d.addEventListener('click',function(e){if(e.target===d){close()}});
    d.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();close()}else if(e.key==='Tab'){var b=d.querySelectorAll('button'),f=b[0],l=b[b.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
    setTimeout(function(){var g=d.querySelector('.mg-go');if(g)g.focus({preventScroll:true})},30)}
  addEventListener('click',function(e){if(bypass||open)return;var b=null;try{b=A.isNext(e.target)}catch(x){}if(!b||!should())return;
    e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  ['pointerdown','touchstart','mousedown'].forEach(function(t){addEventListener(t,function(e){if(open&&!open.contains(e.target)){e.stopImmediatePropagation()}},true)});
  addEventListener('keydown',function(e){if(open){if(!open.contains(e.target)){e.preventDefault();e.stopImmediatePropagation()}return}
    if(e.key!=='Enter'||e.shiftKey||e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;var t=e.target;if(t&&t.tagName==='TEXTAREA')return;
    var b=null;try{b=A.enterNext(e)}catch(x){}if(!b||!should())return;e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  window.__mgate={count:n,should:should,open:function(){pop(null)},start:function(){setSz(0);try{A.start()}catch(e){console.error(e)}}};
})({
  count:function(){return Object.keys(mistakes).length},
  inReview:function(){return mode!=='normal'},
  isNext:function(t){var b=t.closest&&t.closest('#nextBtn,#skipBtn,#againBtn');return b&&mode==='normal'?b:null},
  enterNext:function(){if(mode!=='normal')return null;var b=document.getElementById('nextBtn');return b&&b.offsetParent&&!b.disabled?b:null},
  start:function(){start('mistakes');try{document.getElementById('sheet').scrollIntoView({block:'start'})}catch(e){}}
});
</script>
