<style>
/* Layout: one centered practice column — prompt card, 田字格 answer line, tile bank, controls; section chips above */
:root{
  --bg:#f2f4f0; --surface:#ffffff; --fg:#1c2421; --muted:#5d6b65; --line:#d5ddd8; --grid:#e3e9e5;
  --accent:#2f7a5f; --accent-ink:#ffffff;
  --ok:#2f7a4a; --ok-bg:#e3f2e7; --bad:#b4442f; --bad-bg:#f8e6e1;
  --r-S:#3567b5; --r-T:#b5762a; --r-P:#8a4fb0; --r-A:#2a8f8f; --r-M:#c0507a;
  --r-V:#c23b2b; --r-C:#7a7f2a; --r-O:#4d6a8a; --r-G:#5d6b65;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
  --f-zh:"Noto Serif SC","Songti SC","SimSun",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a18; --surface:#1c2422; --fg:#e6ece8; --muted:#97a6a0; --line:#2f3b37; --grid:#25302c;
  --accent:#6cc4a0; --accent-ink:#0f1a15;
  --ok:#7fd49a; --ok-bg:#1d3326; --bad:#f08f78; --bad-bg:#3a221d;
  --r-S:#7fa7ec; --r-T:#e3a75b; --r-P:#c393e6; --r-A:#5fc8c8; --r-M:#ec8db0;
  --r-V:#f2786a; --r-C:#c4c85e; --r-O:#94b2d4; --r-G:#97a6a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a18; --surface:#1c2422; --fg:#e6ece8; --muted:#97a6a0; --line:#2f3b37; --grid:#25302c;
  --accent:#6cc4a0; --accent-ink:#0f1a15;
  --ok:#7fd49a; --ok-bg:#1d3326; --bad:#f08f78; --bad-bg:#3a221d;
  --r-S:#7fa7ec; --r-T:#e3a75b; --r-P:#c393e6; --r-A:#5fc8c8; --r-M:#ec8db0;
  --r-V:#f2786a; --r-C:#c4c85e; --r-O:#94b2d4; --r-G:#97a6a0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font:800 clamp(1.6rem,4vw,2.2rem)/1.05 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{font-family:var(--f-zh);font-weight:700;color:var(--accent);margin-right:.25em}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.score{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted)}
.score b{display:block;font:700 1.35rem/1 var(--f-display);color:var(--fg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;
  padding:5px 12px;font:600 .82rem var(--f-body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);flex-wrap:wrap}
.prompt{font:600 1.3rem/1.35 var(--f-display);margin:0;text-wrap:balance}
.wrong{font-family:var(--f-zh);font-size:1.15rem;color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px;margin:0}
.wrong-label{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 2px}
.answer{min-height:76px;border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  border:1.5px dashed var(--line);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-position:-1px -1px}
.answer.ok{border-style:solid;border-color:var(--ok);background-color:var(--ok-bg)}
.answer.bad{border-style:solid;border-color:var(--bad);background-color:var(--bad-bg)}
.placeholder{color:var(--muted);font-size:.9rem}
.endp{font-family:var(--f-zh);font-size:1.4rem;color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.tile{font:500 1.35rem/1 var(--f-zh);padding:10px 13px 9px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg);cursor:pointer;position:relative;
  box-shadow:inset 0 -3px 0 var(--rc, transparent);transition:transform .12s}
.tile:hover{transform:translateY(-1px)}
.tile:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nohint .tile{--rc:transparent!important}
.tile{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.tile .py{font:500 .7rem/1 var(--f-body);color:var(--muted);letter-spacing:.01em;white-space:nowrap}
.fbpy,.wrongpy{font-size:.95rem;color:var(--muted);margin:0}
.nopy .tile .py,.nopy .fbpy,.nopy .wrongpy{display:none}
.prompt-off{display:none;margin:0;color:var(--muted);font-style:italic}
.noen #prompt{display:none}
.noen .prompt-off{display:block}
.noen .card:has(.done) .prompt-off{display:none}
.fben{display:none;font-size:.95rem}
.pathint{display:none;margin:0;align-self:flex-start;font-size:.85rem;letter-spacing:.04em;color:var(--accent);border:1px dashed var(--accent);border-radius:999px;padding:3px 12px}
.showpat .pathint:not([hidden]){display:block}
.typebox{display:none;flex-direction:column;gap:6px}
.typing .typebox{display:flex}
.typing #answer,.typing #bank,.typing .legend{display:none}
.card:has(.done) .typebox{display:none}
.noen.typing #prompt:not([hidden]){display:block}
.noen.typing .prompt-off,.noen.typing .fben{display:none}
#typein{font:500 1.35rem/1.3 var(--f-zh);padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);width:100%;min-width:0}
#typein:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#typein.ok{border-color:var(--ok);background:var(--ok-bg)}
#typein.bad{border-color:var(--bad);background:var(--bad-bg)}
.typehint{font-size:.82rem;color:var(--muted);margin:0}
.yours{font-size:.95rem}
.yours span{font-family:var(--f-zh)}
.noen .fben{display:block}
.tile.used{visibility:hidden}
.tile.mark-bad{border-color:var(--bad)}
.mark-first{outline:3px solid var(--bad);outline-offset:2px}
.feedback .pin{display:block;margin:2px 0 4px;padding:7px 10px;border-radius:6px;background:rgba(190,60,40,.09);line-height:1.5}
.feedback .pin b{font-family:var(--f-zh,inherit);font-weight:700}
.spd-fast,.spd-slow{display:inline-block;font:500 .8rem ui-monospace,Menlo,monospace;margin:0 0 2px}
.spd-fast{color:var(--ok,#2b7a5e)}.spd-slow{opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.nohint .legend{display:none}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 .95rem var(--f-body);border-radius:8px;padding:9px 16px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
.toggle{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);cursor:pointer}
.feedback{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-bg)}
.feedback.bad{background:var(--bad-bg)}
.feedback .verdict{font-weight:700}
.feedback.ok .verdict{color:var(--ok)}
.feedback.bad .verdict{color:var(--bad)}
.feedback .zh{font:700 1.3rem/1.4 var(--f-zh)}
.feedback .pat{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.feedback .alt{font-size:.9rem;color:var(--muted)}
.feedback .alt span{font-family:var(--f-zh)}
.done{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.done h2{font:800 1.6rem var(--f-display);margin:0}
.miss{font-family:var(--f-zh);text-align:left;max-width:520px;color:var(--muted);font-size:.95rem;margin:0;padding-left:18px}
.foot{font-size:.82rem;color:var(--muted)}
kbd{font:600 .78rem var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
@media (max-width:480px){.card{padding:16px}.tile{font-size:1.2rem;padding:9px 11px 8px}}
/* ---- Touch & Android phone layout ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,label,.chip,.tile,.btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tile,.chip,.btn,.toggle{-webkit-user-select:none;user-select:none}
.actions,.toggles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tile:hover{transform:none}
@media (hover:hover){.tile:hover{transform:translateY(-1px)}}
.tile:active{transform:scale(.95)}
.btn:active:not(:disabled){transform:scale(.97)}
.chip:active{transform:scale(.96)}
.btn{transition:transform .1s}
.chip{transition:transform .1s}
@media (prefers-reduced-motion:reduce){.tile:active,.btn:active,.chip:active{transform:none}}
@media (max-width:640px){
  body{padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:contain}
  .wrap{gap:14px}
  header{flex-direction:column;align-items:stretch;gap:10px}
  h1{font-size:1.65rem}
  .sub{font-size:.9rem}
  .score{gap:8px}
  .score>div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;font-size:.78rem}
  .score b{font-size:1.3rem;margin-bottom:2px}
  /* section chips: edge-to-edge swipe row */
  .chips{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 6px;
    scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding-inline:16px;gap:8px}
  .chips::-webkit-scrollbar{display:none}
  .chip{min-height:40px;padding:8px 16px;font-size:.88rem;scroll-snap-align:start}
  .card{padding:16px 14px;border-radius:16px;gap:14px}
  .prompt{font-size:1.2rem}
  .answer{min-height:84px;padding:10px;gap:8px}
  .bank{gap:10px;min-height:56px}
  .tile{min-height:52px;min-width:48px;justify-content:center;font-size:1.3rem;padding:9px 12px 8px;border-radius:10px}
  .tile .py{font-size:.74rem}
  .legend{font-size:.78rem;gap:6px 12px}
  /* action buttons pinned to the bottom of the screen, thumb-reach */
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-wrap:nowrap;gap:8px;
    padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
    background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .controls[hidden] .actions{display:none}
  .actions .btn{flex:1;min-height:50px;padding:10px 8px;font-size:1rem;border-radius:12px;white-space:nowrap}
  .actions .btn.primary{flex:1.6}
  .spacer{display:none}
  /* display toggles as switch cards in a 2-column grid */
  .controls{display:block}
  .toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .toggle{min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);
    color:var(--fg);font-size:.92rem;gap:10px;justify-content:space-between;flex-direction:row-reverse}
  .toggle input{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:24px;margin:0;border-radius:999px;
    background:var(--line);position:relative;cursor:pointer;transition:background .15s}
  .toggle input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .toggle input:checked{background:var(--accent)}
  .toggle input:checked::after{transform:translateX(16px)}
  .toggle input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .toggle:has(input:checked){border-color:var(--accent)}
  .feedback{scroll-margin-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .feedback .zh{font-size:1.25rem}
  #typein{font-size:1.3rem;min-height:52px}
  .done{padding:20px 4px}
  .done .btn{min-height:50px;padding:10px 28px;border-radius:12px;font-size:1rem}
  .miss{padding-left:20px}
  .miss li{padding:4px 0}
}
@media (max-width:360px){.tile{font-size:1.15rem;padding:8px 10px 7px}.toggles{grid-template-columns:1fr}}

/* ---- trainer additions: header, levels, tabs, games ---- */
:root{--accent-soft:#e2efe9;--gold:#9a6a12;--gold-soft:#f6ecd6;--warn:#b4442f;--chart:#2f7a5f;--chart-2:#cfe1d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent-soft:#1d3029;--gold:#e0b45e;--gold-soft:#2f2717;--warn:#f08f78;--chart:#6cc4a0;--chart-2:#2a3c35}}
:root[data-theme="dark"]{--accent-soft:#1d3029;--gold:#e0b45e;--gold-soft:#2f2717;--warn:#f08f78;--chart:#6cc4a0;--chart-2:#2a3c35}
.wrap{max-width:860px}
header .score{flex-wrap:wrap}
.stat{display:flex;flex-direction:column;font-size:.78rem;color:var(--muted);min-width:64px}
.stat b{font:700 1.3rem/1.1 var(--f-display);color:var(--fg);font-variant-numeric:tabular-nums}
.stat.hit b{color:var(--ok)}
#stats{display:flex;gap:16px;flex-wrap:wrap}
/* manual */
.manual{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.manual summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style-position:inside}
.manual summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.mbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.mtips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.93rem;max-width:68ch}
.mrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.mrow .chips{padding:0}
.mtabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.mtab{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);cursor:pointer;font:inherit}
.mtab:hover{border-color:var(--accent)}
.mtab .n{grid-row:span 2;font:700 .8rem var(--f-display);color:var(--accent);padding-top:2px}
.mtab .mt{font-weight:600}
.mtab .md{font-size:.82rem;color:var(--muted)}
.hz{font-family:var(--f-zh)}
/* level bar */
#levels{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fg);font:600 .85rem var(--f-body);padding:7px 12px;cursor:pointer;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:.88rem;color:var(--muted)}
.lvnote{font-size:.8rem;color:var(--muted)}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:none;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:7px;align-items:baseline;text-align:left;
  border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:7px 12px 6px;cursor:pointer;font:inherit;min-height:48px}
.tab .n{font:700 .72rem var(--f-display);color:var(--muted)}
.tab .tz{font:700 1.05rem/1.1 var(--f-zh)}
.tab .te{grid-column:1 / -1;font-size:.74rem;color:var(--muted);white-space:nowrap}
.tab .tn{grid-column:1 / -1;font-size:.7rem;color:var(--muted);white-space:nowrap}
.tab .tn.go{color:var(--gold);font-weight:600}
.tab .tn.ok{color:var(--ok)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] .n,.tab[aria-selected="true"] .te,.tab[aria-selected="true"] .tn{color:var(--accent-ink);opacity:.85}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* panel */
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.phead h2{font:800 clamp(1.35rem,3.2vw,1.75rem)/1.1 var(--f-display);margin:0;text-wrap:balance}
.phead h2 .hz{color:var(--accent);margin-right:.35em;font-weight:700}
.phead .sub,.panel>.sub{margin:4px 0 0;color:var(--muted);max-width:70ch}
.howto{margin:0;font-size:.92rem;max-width:70ch;background:var(--accent-soft);border-radius:10px;padding:10px 14px}
.chips.sec{padding-bottom:6px}
.chips{display:flex;flex-wrap:nowrap}
.panel>.chips,.sect .chips{flex-wrap:wrap;overflow:visible}
.controls .toggles{display:flex;flex-wrap:wrap;gap:6px 16px}
.rscore{display:flex;gap:16px;align-items:baseline;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.rscore b{font:700 1.15rem var(--f-display);color:var(--fg)}
.rscore .pos{margin-left:auto}
.resume{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;background:var(--gold-soft);border-radius:10px;padding:8px 8px 8px 14px;font-size:.92rem}
.resume b{color:var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.opts.between{justify-content:space-between}
.opts.center{justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.sect .row{justify-content:flex-start}
.search,select{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:42px}
.search{flex:1;min-width:0}
.search:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.empty,.muted{color:var(--muted)}
.empty{padding:12px 0}
/* English visibility: .en shows only with English on; .fben reveals English after an answer when English is off */
.noen .en{display:none}
.fben{display:none}
.noen .fben{display:block}
.enall{display:block}
.noen .prompt{display:none}
.noen .prompt-off{display:block}
.lprompt{margin:0;color:var(--muted);font-style:italic}
.nohints .tile{--rc:transparent!important}
.nohints .legend{display:none}
.bw.nohint .tile{--rc:transparent!important}
.showpat .pathint{display:block}
.pathint[hidden]{display:none!important}
/* builder widget */
.bw,.cw{display:flex;flex-direction:column;gap:14px}

 yì.",4],["新闻","最近发生的重要事情的报道。","zuì jìn fā shēng de zhòng yào shì qing de bào dào.",3],["广告","让大家来买东西的介绍。","ràng dà jiā lái mǎi dōng xi de jiè shào.",4],["网站","在网上可以打开的、有很多信息的地方。","zài wǎng shàng kě yǐ dǎ kāi de, yǒu hěn duō xìn xī de dì fāng.",3],["密码","只有你自己知道的、用来打开手机或者账号的字和数字。","zhǐ yǒu nǐ zì jǐ zhī dào de, yòng lái dǎ kāi shǒu jī huò zhě zhàng hào de zì hé shù zì.",4],["垃圾","没有用、要扔掉的东西。","méi yǒu yòng, yào rēng diào de dōng xi.",4],["环境","我们周围的自然和社会情况。","wǒ men zhōu wéi de zì rán hé shè huì qíng kuàng.",3],["空气","我们呼吸的、看不见的东西。","wǒ men hū xī de, kàn bú jiàn de dōng xi.",4],["温度","冷热的程度。","lěng rè de chéng dù.",4],["动物","猫、狗、鸟、鱼都是。","māo, gǒu, niǎo, yú dōu shì.",3]],"GR":[["Word order","时间 + 地点","Time before place","Chinese word order is: who → when → where / with whom / how → verb → what. Time and place come before the verb, never at the end as in English.","我明天下午在图书馆学习。","wǒ míng tiān xià wǔ zài tú shū guǎn xué xí.","I'm studying in the library tomorrow afternoon."],["Word order","话题","Topic first","Spoken Chinese often names the topic first and then comments on it. The object can move to the front.","这本书我已经看完了。","zhè běn shū wǒ yǐ jīng kàn wán le.","This book, I've already finished it."],["Word order","定语 + 的","Describing words go before the noun","Everything that describes a noun goes before it, joined by 的. English often puts it after.","站在门口的那个人是我叔叔。","zhàn zài mén kǒu de nà ge rén shì wǒ shū shu.","The man standing at the door is my uncle."],["Word order","状语","Adverbs before the verb","Adverbs like 都, 也, 还, 常常, 已经 sit right after the subject and before the verb.","我们都已经吃过饭了。","wǒ men dōu yǐ jīng chī guò fàn le.","We've all already eaten."],["Particles","了 (动态)","了 after the verb: completed","了 right after a verb marks that the action is completed. It is about completion, not past tense.","我买了两本书。","wǒ mǎi le liǎng běn shū.","I bought two books."],["Particles","了 (句尾)","了 at the end: change","了 at the end of a sentence shows a new situation or a change.","下雨了。","xià yǔ le.","It's started raining."],["Particles","过","过: experience","Verb + 过 means you have done something at least once in your life. Negative: 没 + verb + 过.","我去过上海，没去过西安。","wǒ qù guò shàng hǎi, méi qù guò xī ān.","I've been to Shanghai, but never to Xi'an."],["Particles","着","着: ongoing state","Verb + 着 describes a state that continues: the door is open, she is wearing a hat.","门开着，你进来吧。","mén kāi zhe, nǐ jìn lái ba.","The door is open, come in."],["Particles","的 · 地 · 得","Three different de","的 links a description to a noun (我的书). 地 turns an adjective into an adverb before a verb (认真地学习). 得 links a verb to a comment on how it is done (说得很好).","他认真地学习，汉语说得很好。","tā rèn zhēn de xué xí, Hàn yǔ shuō de hěn hǎo.","He studies hard and speaks Chinese well."],["Particles","吧","吧: suggestion or guess","吧 at the end softens a sentence: a suggestion (我们走吧) or a guess you want confirmed (你是老师吧).","我们一起去吃饭吧。","wǒ men yì qǐ qù chī fàn ba.","Let's go and eat together."],["Particles","呢","呢: and you? / still going on","呢 after a noun asks 'and what about…?'. At the end of a sentence it can show an action is still going on.","我很好，你呢？","wǒ hěn hǎo, nǐ ne?","I'm fine, and you?"],["Negation","不 vs 没","不 or 没?","不 negates habits, wishes, the future, adjectives and 是. 没 negates past actions and 有. 没 never combines with 了.","我昨天没去，明天也不去。","wǒ zuó tiān méi qù, míng tiān yě bú qù.","I didn't go yesterday and I'm not going tomorrow either."],["Negation","一点儿也不","Not at all","一点儿也不 + adjective = not at all. The order is fixed.","这个菜一点儿也不辣。","zhè ge cài yì diǎn ér yě bú là.","This dish isn't spicy at all."],["Negation","别 / 不要","Don't!","别 or 不要 before a verb tells someone not to do something.","上课的时候别玩手机。","shàng kè de shí hou bié wán shǒu jī.","Don't play on your phone in class."],["Negation","还没…呢","Not yet","还没 + verb (+ 呢) = hasn't happened yet.","我还没吃饭呢。","wǒ hái méi chī fàn ne.","I haven't eaten yet."],["Questions","吗","Yes/no questions with 吗","Add 吗 to the end of a statement to make a yes/no question. The word order stays the same.","你是学生吗？","nǐ shì xué sheng ma?","Are you a student?"],["Questions","正反问句","Verb-not-verb questions","Say the verb twice with 不 in the middle: 去不去, 好不好. Do not add 吗.","你明天去不去？","nǐ míng tiān qù bú qù?","Are you going tomorrow or not?"],["Questions","疑问词","Question words stay in place","什么, 谁, 哪儿, 什么时候 go exactly where the answer would go. Do not move them to the front.","你什么时候去北京？","nǐ shén me shí hou qù běi jīng?","When are you going to Beijing?"],["Questions","还是 vs 或者","'Or' in questions and statements","还是 offers a choice in a question. 或者 is 'or' in a statement.","你喝茶还是喝咖啡？","nǐ hē chá hái shi hē kā fēi?","Do you want tea or coffee?"],["Questions","不是…吗","Didn't you…? / Isn't it…?","不是…吗 checks something you believe is true, often with surprise.","你不是去上海了吗？","nǐ bú shì qù shàng hǎi le ma?","Didn't you go to Shanghai?"],["Measure words","量词","Number + measure word + noun","Between a number (or 这/那) and a noun you need a measure word: 一本书, 两张票, 这件衣服. 个 is the general one.","我买了三个苹果和两瓶水。","wǒ mǎi le sān gè píng guǒ hé liǎng píng shuǐ.","I bought three apples and two bottles of water."],["Measure words","本 · 张 · 件 · 条","Common measure words","本 for books, 张 for flat things (tickets, tables), 件 for clothes and matters, 条 for long things (roads, rivers, trousers), 辆 for vehicles, 位 for people (polite).","我有两条裤子和一件外套。","wǒ yǒu liǎng tiáo kù zi hé yí jiàn wài tào.","I have two pairs of trousers and a coat."],["Measure words","次 · 遍","How many times","次 counts times something happens. 遍 counts times something is done from start to finish.","这本书我看了三遍。","zhè běn shū wǒ kàn le sān biàn.","I've read this book three times."],["Complements","结果补语","Result complements","A second verb or adjective after the verb shows the result: 看完 (finish reading), 听懂 (understand), 找到 (find). Negative: 没 + verb + result.","我没听懂老师的话。","wǒ méi tīng dǒng lǎo shī de huà.","I didn't understand what the teacher said."],["Complements","趋向补语","Direction complements","来 (towards the speaker) and 去 (away) follow the verb, often with 上/下/进/出/回/过/起: 走进来, 拿出去, 站起来.","他从教室里走出来了。","tā cóng jiào shì lǐ zǒu chū lái le.","He walked out of the classroom."],["Complements","可能补语","Can / can't (potential)","Put 得 (can) or 不 (can't) between the verb and its result: 听得懂 / 听不懂, 做得完 / 做不完, 买得起 / 买不起.","这么多菜，我们吃不完。","zhè me duō cài, wǒ men chī bù wán.","We can't finish this many dishes."],["Complements","程度补语 得","How well: verb + 得","Verb + 得 + comment says how well something is done. With an object, repeat the verb: 他说汉语说得很好.","她跑得很快。","tā pǎo de hěn kuài.","She runs fast."],["Complements","时量补语","How long: duration","The duration goes after the verb. With an object, repeat the verb or put the duration before the object.","我学汉语学了两年了。","wǒ xué Hàn yǔ xué le liǎng nián le.","I've been learning Chinese for two years."],["Constructions","把","把: doing something to an object","把 + object + verb + something more (a result, a place, 了). Use it when you do something to a specific thing.","请把门关上。","qǐng bǎ mén guān shàng.","Please close the door."],["Constructions","被","被: passive","Subject + 被 (+ who) + verb + result. Often for something unpleasant.","我的手机被弟弟弄坏了。","wǒ de shǒu jī bèi dì di nòng huài le.","My phone was broken by my younger brother."],["Constructions","是…的","是…的: when, where, how","是…的 stresses the time, place or way of a past action that already happened.","我是坐飞机来的。","wǒ shì zuò fēi jī lái de.","I came by plane."],["Constructions","比","Comparisons with 比","A 比 B + adjective. Add a difference after it: 高一点儿, 大三岁. Never use 很 here. Negative: A 没有 B + adjective.","哥哥比我高十厘米。","gē ge bǐ wǒ gāo shí lí mǐ.","My older brother is ten centimetres taller than me."],["Constructions","跟…一样","As … as / the same as","A 跟 B 一样 (+ adjective). Negative: 不一样.","我的手机跟你的一样。","wǒ de shǒu jī gēn nǐ de yí yàng.","My phone is the same as yours."],["Constructions","越来越","More and more","越来越 + adjective/verb = more and more.","天气越来越冷了。","tiān qì yuè lái yuè lěng le.","The weather is getting colder and colder."],["Constructions","越…越","The more…, the more…","越 A 越 B: the more A, the more B.","他越说越高兴。","tā yuè shuō yuè gāo xìng.","The more he talked, the happier he got."],["Constructions","一…就","As soon as","一 + action 1, 就 + action 2.","我一到家就给你打电话。","wǒ yí dào jiā jiù gěi nǐ dǎ diàn huà.","I'll call you as soon as I get home."],["Constructions","连…都/也","Even","连 + the surprising thing + 都/也.","他连一个字都不认识。","tā lián yí gè zì dōu bú rèn shi.","He doesn't even know a single character."],["Constructions","除了…以外","Apart from","除了…以外，…都 (excluding) or …还/也 (including).","除了小王以外，大家都来了。","chú le xiǎo wáng yǐ wài, dà jiā dōu lái le.","Everyone came except Xiao Wang."],["Constructions","又…又","Both … and","又 + adjective + 又 + adjective describes two qualities at once.","这家饭馆的菜又便宜又好吃。","zhè jiā fàn guǎn de cài yòu pián yi yòu hǎo chī.","The food in this restaurant is cheap and tasty."],["Constructions","一边…一边","Doing two things at once","一边 + verb 1，一边 + verb 2.","他一边吃饭一边看手机。","tā yì biān chī fàn yì biān kàn shǒu jī.","He looks at his phone while eating."],["Connectors","因为…所以","Because … so","Chinese often uses both words: 因为 + reason，所以 + result.","因为下雨，所以我们没去公园。","yīn wèi xià yǔ, suǒ yǐ wǒ men méi qù gōng yuán.","Because it rained, we didn't go to the park."],["Connectors","虽然…但是","Although … but","Chinese uses both halves, unlike English.","虽然很累，但是我很高兴。","suī rán hěn lèi, dàn shì wǒ hěn gāo xìng.","Although I'm tired, I'm happy."],["Connectors","如果…就","If … then","如果 (…的话)，就 + result.","如果明天下雨，我们就不去了。","rú guǒ míng tiān xià yǔ, wǒ men jiù bú qù le.","If it rains tomorrow, we won't go."],["Connectors","只要…就","As long as","只要 + condition, 就 + result. One easy condition is enough.","只要你努力，就一定能学好。","zhǐ yào nǐ nǔ lì, jiù yí dìng néng xué hǎo.","As long as you work hard, you'll learn it well."],["Connectors","只有…才","Only if","只有 + the one necessary condition, 才 + result.","只有多练习，才能说得流利。","zhǐ yǒu duō liàn xí, cái néng shuō de liú lì.","Only by practising a lot can you speak fluently."],["Connectors","不但…而且","Not only … but also","不但 A，而且 B (also: 还, 也).","她不但会唱歌，而且唱得很好。","tā bú dàn huì chàng gē, ér qiě chàng de hěn hǎo.","Not only can she sing, she sings well."],["Connectors","无论…都","No matter","无论 + question word / choice, 都 + result.","无论多忙，他都每天跑步。","wú lùn duō máng, tā dōu měi tiān pǎo bù.","No matter how busy he is, he runs every day."],["Connectors","先…然后","First … then","先 A，然后 B (再 is also common).","我们先吃饭，然后去看电影。","wǒ men xiān chī fàn, rán hòu qù kàn diàn yǐng.","Let's eat first and then see a film."],["Adverbs","才 vs 就","Later than expected vs earlier","就 = early or easy (了 allowed). 才 = late or hard (no 了).","他八点就来了，我十点才来。","tā bā diǎn jiù lái le, wǒ shí diǎn cái lái.","He came as early as eight; I didn't come until ten."],["Adverbs","再 vs 又","Again: future or past","再 is 'again' for the future. 又 is 'again' for something that has already happened.","他昨天又迟到了，明天别再迟到了。","tā zuó tiān yòu chí dào le, míng tiān bié zài chí dào le.","He was late again yesterday; don't be late again tomorrow."],["Adverbs","还","Still / also / even more","还 = still (他还在睡觉), also (我还要一杯), or 'even more' in comparisons (比昨天还冷).","今天比昨天还冷。","jīn tiān bǐ zuó tiān hái lěng.","Today is even colder than yesterday."],["Adverbs","都 · 也","都 = all, 也 = also","Both go after the subject, before the verb. Together: 也都.","我们也都去过北京。","wǒ men yě dōu qù guò běi jīng.","We have all been to Beijing too."],["Adverbs","正在…呢","In the middle of doing","正在 / 在 + verb (+ 呢) = something is happening right now.","我正在做饭呢。","wǒ zhèng zài zuò fàn ne.","I'm cooking right now."],["Adverbs","快要…了","About to happen","快要 / 快 / 要 + verb + 了 = something is about to happen.","火车快要开了。","huǒ chē kuài yào kāi le.","The train is about to leave."],["Adverbs","刚 vs 刚才","Just: adverb vs time word","刚 is an adverb right before the verb (我刚到). 刚才 is a time word, 'a moment ago', and can open the sentence.","我刚才给你打电话了。","wǒ gāng cái gěi nǐ dǎ diàn huà le.","I called you a moment ago."],["Modal verbs","会 · 能 · 可以","Can: three words","会 = a skill you learned (会游泳). 能 = ability or circumstances (今天不能来). 可以 = permission (可以进来吗).","我会游泳，可是今天不能游。","wǒ huì yóu yǒng, kě shì jīn tiān bù néng yóu.","I can swim, but I can't today."],["Modal verbs","想 · 要","Want to","想 is a wish (I'd like to). 要 is stronger: 'want to, will, need to'. The negative of both is 不想.","我要喝水，不想喝咖啡。","wǒ yào hē shuǐ, bù xiǎng hē kā fēi.","I want water, I don't want coffee."],["Modal verbs","应该","Should","应该 + verb = should. Negative: 不应该.","你应该早点儿睡觉。","nǐ yīng gāi zǎo diǎn ér shuì jiào.","You should go to bed earlier."],["Modal verbs","必须 · 得 · 不用","Must / don't have to","必须 and 得 (děi) = must. The negative is 不用 or 不必, not 不必须.","明天是周末，你不用早起。","míng tiān shì zhōu mò, nǐ bú yòng zǎo qǐ.","Tomorrow is the weekend; you don't have to get up early."]]};

{const P=Element.prototype,ok=x=>x!=null&&x!==false;const ap=P.append,rc=P.replaceChildren;

/* saving: this device at once, plus a private copy on the account so another phone or computer picks up where you left off */
let cloudT=null,CLOUD=null,cloudBusy=false,cloudAgain=false;
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(cloudT);cloudT=setTimeout(cloudSave,1500)}
async function cloudSave(){
  if(!CLOUD)return;if(cloudBusy){cloudAgain=true;return}cloudBusy=true;
  try{let js=JSON.stringify(S);if(js.length>400000){S.log=S.log.slice(-40);js=JSON.stringify(S)}await CLOUD.set({json:js,ts:S.ts})}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='quota_exceeded'||e.code==='permission_denied'||e.code==='not_granted'))CLOUD=null}
  cloudBusy=false;if(cloudAgain){cloudAgain=false;cloudSave()}
}

async function cloudInit(){
  try{const c=window.claude;if(!c||!c.use)return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/progress');const snap=await ref.get();
    let r=null;const d=snap.exists&&snap.data();if(d&&typeof d.json==='string'){try{r=JSON.parse(d.json)}catch(e){}}
    CLOUD=ref;
    if(r&&(!bootLocal||(r.ts||0)>(S.ts||0))){S=Object.assign(DEF(),r);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}fixState();renderAll()}
    else if(!r||(S.ts||0)>(r.ts||0))cloudSave();
  }catch(e){CLOUD=null}
}
function fixState(){
  for(const k of ['w','miss','opt','days','sr','run'])if(!S[k]||typeof S[k]!=='object'||Array.isArray(S[k]))S[k]={};
  if(!Array.isArray(S.log))S.log=[];
  if(!['1','2','3','4','all'].includes(S.lvl))S.lvl='all';
  if(!TABS.some(t=>t[0]===S.tab))S.tab='build';
  for(const k of Object.keys(S.miss))if(!specOf(k)){delete S.miss[k];delete S.sr[k]}
}
const LV=['1','2','3','4'];
const okLv=l=>{if(S.lvl==='all')return true;const i=LV.indexOf(String(l)),m=LV.indexOf(S.lvl);return S.cum?i<=m:i===m};

function opt(k,d){return S.opt[k]===undefined?d:S.opt[k]}

/* ---------- mistakes & spaced review ----------
   keys: §b<i> builder sentence · §t<i>|<from>|<to> transformation · §a<i> antonym pair
         §e<i> Chinese description · §m<word> English meaning · §l<i> dictation */
const IV=[1,3,7,14,30];
function srMark(k,ok){
  const tn=tnum();const r=S.sr[k];
  if(!ok){S.miss[k]=(S.miss[k]||0)+1;S.sr[k]={b:0,due:tn+1,ok:0};return}
  if(!r)return;
  if(S.miss[k]&&r.ok&&r.ok!==tn)delete S.miss[k];   // right on two different days → off the list
  const slow=window.__hskSlow===true&&k.indexOf('§b')===0,wasDue=r.due<=tn;
  if(wasDue&&!slow)r.b=Math.min(IV.length-1,(r.b||0)+1);
  r.ok=tn;r.due=tn+(slow&&wasDue?1:IV[r.b]);
  if(!S.miss[k]&&r.b>=IV.length-1)delete S.sr[k];
}
function specOf(k){
  if(typeof k!=='string'||k[0]!=='§')return null;const t=k[1],b=k.slice(2);
  if(t==='b'||t==='l'){const i=+b;return D[i]?{k:t,i}:null}
  if(t==='t'){const [i,f,g]=b.split('|').map(Number);return TR[i]&&f>=0&&f<4&&g>=0&&g<4?{k:'t',i,f,g}:null}
  if(t==='a'){const i=+b;return AN[i]?{k:'a',i}:null}
  if(t==='e'){const i=+b;return DE[i]?{k:'e',i}:null}
  if(t==='m')return byW[b]?{k:'m',w:b}:null;
  if(t==='c'){const i=+b;return CFD[i]?{k:'c',i}:null}
  return null;
}
const keyOf=sp=>sp.k==='t'?`§t${sp.i}|${sp.f}|${sp.g}`:sp.k==='m'?'§m'+sp.w:'§'+sp.k+sp.i;
function dayStreak(){const t=new Date();if(!S.days[dstr(t)])t.setDate(t.getDate()-1);let n=0;while(S.days[dstr(t)]){n++;t.setDate(t.getDate()-1)}return n}
/* one answer: points, today's count, word score, review schedule */
function rec(key,ok,words){
  if(ok){S.xp+=10;S.streak++;S.best=Math.max(S.best,S.streak)}else S.streak=0;
  const t=today();S.days[t]=(S.days[t]||0)+1;
  const ds=Object.keys(S.days).sort();if(ds.length>200)ds.slice(0,ds.length-200).forEach(d=>delete S.days[d]);
  S.bestDays=Math.max(S.bestDays||0,dayStreak());
  (words||[]).forEach(w=>{if(byW[w])S.w[w]=Math.max(-3,Math.min(5,(S.w[w]||0)+(ok?1:-1)))});
  if(key)srMark(key,ok);
  save();renderStats();
}

function logSession(g,c,n,retry){
  const p=n?Math.round(100*c/n):0;
  S.log.push({d:today(),ts:Date.now(),g,c,n,p,l:S.lvl,r:retry?1:0});
  if(S.log.length>150)S.log=S.log.slice(-150);
  save();renderTabs();return p;
}
function lastOf(g){for(let i=S.log.length-1;i>=0;i--){const e=S.log[i];if(e.g===g&&!e.r)return e}return null}
const dueKeys=()=>{const tn=tnum();return Object.keys(S.sr).filter(k=>S.sr[k].due<=tn&&specOf(k)).sort((a,b)=>S.sr[a].due-S.sr[b].due)};

const TTS={ok:'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined',v:null,all:[],ready:false,btn:null,gen:0};
function ttsLoad(){
  if(!TTS.ok)return;let all=[];try{all=speechSynthesis.getVoices()||[]}catch(e){}
  const sc=v=>(/zh[-_]CN|cmn/i.test(v.lang)?6:/zh[-_](TW|HK)/i.test(v.lang)?2:3)+(v.localService?1:0)+(/google|natural|enhanced|premium|neural|xiaoxiao|tingting|yunxi/i.test(v.name)?2:0);
  TTS.all=all.filter(v=>/^(zh|cmn)([-_]|$)/i.test(v.lang)).sort((a,b)=>sc(b)-sc(a));
  TTS.v=TTS.all[0]||null;if(all.length)TTS.ready=true;
  document.dispatchEvent(new Event('ttsvoices'));
}
if(TTS.ok){ttsLoad();try{speechSynthesis.addEventListener('voiceschanged',ttsLoad)}catch(e){speechSynthesis.onvoiceschanged=ttsLoad}setTimeout(()=>{TTS.ready=true;ttsLoad()},1600)}
function ttsStop(){if(!TTS.ok)return;TTS.gen++;try{speechSynthesis.cancel()}catch(e){}if(TTS.btn){TTS.btn.classList.remove('on');TTS.btn=null}}
/* say(text,{btn,rate,onend}) */
function say(text,o){
  o=o||{};if(!TTS.ok)return false;const t=String(text||'').replace(/_{2,}/g,'，').replace(/\s+/g,'').trim();if(!t)return false;
  ttsStop();const g=TTS.gen;const btn=o.btn||null;if(btn){btn.classList.add('on');TTS.btn=btn}
  const done=()=>{if(g!==TTS.gen)return;if(btn){btn.classList.remove('on');if(TTS.btn===btn)TTS.btn=null}o.onend&&o.onend()};
  setTimeout(()=>{if(g!==TTS.gen)return;
    const u=new SpeechSynthesisUtterance(t);if(TTS.v){u.voice=TTS.v;u.lang=TTS.v.lang}else u.lang='zh-CN';
    u.rate=o.rate||opt('rate',0.9);u.onend=done;u.onerror=done;
    try{speechSynthesis.resume()}catch(e){}try{speechSynthesis.speak(u)}catch(e){done()}},60);
  return true;
}

  b.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();if(b.classList.contains('on')){ttsStop();return}say(typeof text==='function'?text():text,Object.assign({btn:b},o||{}))});

}

/* Matching board: tap an item on the left, then its partner on the right (either order works).
   o = {pairs:[{id,L:{txt,py,say},R:{txt,py,say}}], wideRight, saved:{matched:[],errs:{}}, onMatch(id,firstTry), onWrong(id), onDone()} */
function makeBoard(o){
  const wrap=h('div',{class:'board'+(o.wideRight?' wide':'')});
  const colL=h('div',{class:'bcol'}),colR=h('div',{class:'bcol r'});wrap.append(colL,colR);
  const matched=new Set(o.saved&&o.saved.matched||[]);const errs=Object.assign({},o.saved&&o.saved.errs||{});
  let sel=null;
  const item=(side,p,x)=>{const b=h('button',{class:'bit '+side,type:'button'},x.py?h('span',{class:'py'},x.py):null,h('span',{class:'bt'},x.txt));
    if(x.say)b.dataset.say=x.say;b._p=p;b._side=side;if(matched.has(p.id)){b.classList.add('ok');b.disabled=true}
    b.addEventListener('click',()=>tap(b));return b};
  const Ls=shuffle(o.pairs).map(p=>item('L',p,p.L)),Rs=shuffle(o.pairs).map(p=>item('R',p,p.R));
  colL.append(...Ls);colR.append(...Rs);
  function tap(b){
    if(b.disabled)return;
    if(!sel||sel._side===b._side){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
    const a=sel;sel=null;a.classList.remove('sel');
    if(a._p.id===b._p.id){
      [a,b].forEach(x=>{x.classList.add('ok','pop');x.disabled=true});matched.add(a._p.id);
      o.onMatch(a._p.id,!errs[a._p.id]);vib(true);
      if(matched.size===o.pairs.length)setTimeout(()=>o.onDone(),450);
    }else{
      const L=a._side==='L'?a:b;const id=L._p.id;
      [a,b].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),650)});vib(false);
      if(!errs[id]){errs[id]=1;o.onWrong(id)}
    }
  }
  return {el:wrap,matched,errs};
}

/* ================= quiz runner (transform, listening, review) ================= */
function startQuiz(host,tab,items,again,retry){S.run[tab]={kind:'quiz',items,res:[],retry:retry?1:0};save();renderTabs();runQuiz(host,tab,again)}
function runQuiz(host,tab,again){
  const R=S.run[tab];const N=R.items.length;
  const step=()=>{
    if(S.run[tab]!==R)return;ttsStop();
    const i=R.res.length;
    if(i>=N){finishQuiz(host,tab,R,again);return}
    const prog=h('div',{class:'qprog'},h('span',{class:'qn'},`${i+1} / ${N}`),h('div',{class:'dots'},R.items.map((_,j)=>h('i',{class:j<i?(R.res[j]?'ok':'bad'):j===i?'cur':''}))));
    const box=h('div',{class:'card task'});host.replaceChildren(prog,box);
    let rec1=false;
    renderTask(R.items[i],box,ok=>{if(rec1)return;rec1=true;R.res.push(ok?1:0);save();renderTabs()},()=>step(),()=>i+1>=N?'See results':'Next');
  };
  step();
}
function finishQuiz(host,tab,R,again){

    h('div',{class:'row'},h('button',{class:'btn primary',type:'button',onclick:again},'New round'),
      wrong.length?h('button',{class:'btn',type:'button',onclick:()=>startQuiz(host,tab,wrong,again,true)},'Practise these mistakes'):null))));
}

  const py=x=>{const k=t.f[f][0][0].indexOf(x);return k>=0?t.f[f][0][1][k]:x==='没有'?'méi yǒu':x==='不是'?'bú shì':pyOf(x)||({'不':'bù','没':'méi','了':'le','吗':'ma','很':'hěn','呢':'ne'})[x]||''};
  return {tiles:tgt[0].map((x,k)=>({txt:x,py:tgt[1][k]})),decoys:decoys.map(x=>({txt:x,py:py(x),decoy:true}))};

function boardGame(p,tab,cfg){
  const rb=h('div'),info=h('div',{class:'binfo'}),area=h('div',{class:'card'});p.append(rb,info,area);
  const play=()=>{
    rb.replaceChildren();const sets=cfg.makeSets();
    if(!sets){area.replaceChildren(h('p',{class:'empty'},'Not enough words at this level. Choose another level above.'));info.replaceChildren();return}
    S.run[tab]={kind:'board',mode:cfg.mode,sets,b:0,matched:[],errs:{},c:0,n:0};save();renderTabs();draw();
  };
  function draw(){
    const R=S.run[tab];if(!R)return play();
    if(R.b>=R.sets.length){const p2=logSession(tab,R.c,R.n,0);delete S.run[tab];save();renderTabs();
      info.replaceChildren();
      area.replaceChildren(h('div',{class:'done'},h('h2',null,'Round complete'),h('p',null,`${R.c} of ${R.n} pairs matched on the first try (${p2}%).`),
        h('p',{class:'foot'},R.c<R.n?'The pairs you mixed up are waiting in Review & mistakes.':'No mix-ups. Well done.'),h('button',{class:'btn primary',type:'button',onclick:play},'New round')));return}
    const ids=R.sets[R.b];
    info.replaceChildren(h('span',{class:'lbl'},`Board ${R.b+1} of ${R.sets.length}`),h('span',null,cfg.hint),h('div',{class:'dots'},R.sets.map((_,j)=>h('i',{class:j<R.b?'ok':j===R.b?'cur':''}))));
    const bd=makeBoard({pairs:ids.map(cfg.pair),wideRight:cfg.wide,saved:{matched:R.matched,errs:R.errs},
      onMatch:(id,first)=>{R.matched.push(id);R.n++;if(first)R.c++;cfg.rec(id,first);save()},
      onWrong:id=>{R.errs[id]=1;cfg.rec(id,false);save()},
      onDone:()=>{R.b++;R.matched=[];R.errs={};save();renderTabs();draw()}});
    area.replaceChildren(bd.el);
  }
  const R=S.run[tab];
  if(R&&R.kind==='board'&&R.mode===cfg.mode){rb.replaceChildren(resumeBar(tab,R.b,R.sets.length,play));draw()}else{if(R)delete S.run[tab];play()}
}
function gAnt(p){
  p.append(...head('Opposites','反义词','Tap a word on the left, then its opposite on the right. Three boards of six pairs. A pair you mix up goes to Review & mistakes.'));
  boardGame(p,'ant',{mode:'ant',hint:'Find the opposite.',
    makeSets:()=>{
      const pool=shuffle(AN.filter(x=>okLv(x.l)));if(pool.length<6)return null;
      const sets=[];const used=new Set();let cur=[],curW=new Set();
      for(const x of pool){if(sets.length>=3)break;if(used.has(x.i)||curW.has(x.a)||curW.has(x.b))continue;
        if([...curW].some(w=>OPP[w]&&(OPP[w].has(x.a)||OPP[w].has(x.b))))continue;
        cur.push(x.i);used.add(x.i);curW.add(x.a);curW.add(x.b);if(cur.length===6){sets.push(cur);cur=[];curW=new Set()}}
      return sets.length?sets.map(s=>s.map(i=>Math.random()<.5?i:-1-i)):null;
    },
    pair:id=>{const flip=id<0;const x=AN[flip?-1-id:id];const a=flip?x.b:x.a,b=flip?x.a:x.b;
      return {id,L:{txt:a,py:pyOf(a),say:a},R:{txt:b,py:pyOf(b),say:b}}},
    rec:(id,ok)=>{const x=AN[id<0?-1-id:id];rec('§a'+x.i,ok,[x.a,x.b])}});
  p.append(h('div',{class:'controls'},dispToggles()));
}

/* ================= 7. review & mistakes ================= */
const MTYPE=[['all','All'],['b','Sentences'],['c','Confusables'],['t','Transform'],['a','Opposites'],['w','Meanings'],['l','Listening']];

    if(!armed){armed=true;clr.textContent='Sure? Press again to clear';clr.classList.add('warn');tm=setTimeout(()=>{armed=false;clr.textContent=f==='all'?'Clear the list':'Clear these';clr.classList.remove('warn')},6000);return}

<script>
/* ===== phone layer (as in Инглишко на шиш) ===== */
(function(){
  const C={"bp": 700, "items": [["🧩", "Builder"], ["⚖️", "Pairs"], ["🔄", "Transform"], ["↔️", "Opposites"], ["📖", "Meaning"], ["🎧", "Listen"], ["💡", "Guide"], ["🔁", "Review"], ["📈", "Progress"]], "dot": ".tn.go", "dotRe": null, "root": "#panel", "heads": "#panel .phead h2", "helpTexts": "#panel .phead p,#panel>.sub,#panel .howto", "hap": null, "fb": null};
  const MQ=window.matchMedia('(max-width:'+C.bp+'px)');
  const tabsEl=document.getElementById('tabs');if(!tabsEl)return;
  const st={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const el=(t,a,...k)=>{const e=document.createElement(t);if(a)for(const n in a){if(n==='class')e.className=a[n];else if(n.startsWith('on'))e.addEventListener(n.slice(2),a[n]);else if(a[n]!=null)e.setAttribute(n,a[n])}k.forEach(x=>x!=null&&e.append(x));return e};
  /* ---------- bottom tab bar ---------- */
  const nav=el('nav',{class:'bnav','aria-label':'Sections'});document.body.append(nav);
  let busy=false;
  function render(){
    if(busy)return;busy=true;
    const tabs=[...tabsEl.children].filter(t=>t.tagName==='BUTTON'||t.getAttribute('role')==='tab');
    nav.style.setProperty('--bn',tabs.length);nav.classList.toggle('scroll',tabs.length>8);nav.classList.toggle('dense',tabs.length===8);
    nav.replaceChildren(...tabs.map((t,i)=>{
      const it=C.items[i]||['•',(t.textContent||'').trim().slice(0,10)];
      const cur=t.getAttribute('aria-selected')==='true';
      let dot=false;try{const d=C.dot&&t.querySelector(C.dot);dot=!!(d&&d.textContent.trim()&&!/^0\b/.test(d.textContent.trim())&&(!C.dotRe||new RegExp(C.dotRe).test(d.textContent)))}catch(e){}
      return el('button',{type:'button','aria-label':(t.textContent||'').trim().replace(/\s+/g,' '),'aria-current':cur?'page':null,
        onclick:()=>{t.click();try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}}},
        el('span',{class:'bi','aria-hidden':'true'},it[0]),el('span',{class:'bl'},it[1]),dot?el('span',{class:'bd','aria-hidden':'true'}):null)}));
    const a=nav.querySelector('[aria-current="page"]');
    if(a&&nav.classList.contains('scroll')){const x=a.offsetLeft-nav.clientWidth/2+a.offsetWidth/2;nav.scrollLeft=Math.max(0,x)}
    busy=false;
  }
  new MutationObserver(()=>requestAnimationFrame(render)).observe(tabsEl,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-selected','class']});
  render();
  /* hide the bar while the on-screen keyboard is up */
  const typing=e=>e&&(e.tagName==='TEXTAREA'||(e.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|file|range)$/.test(e.type)));
  document.addEventListener('focusin',e=>{if(MQ.matches&&typing(e.target))document.body.classList.add('kbd-up')});
  document.addEventListener('focusout',()=>setTimeout(()=>{if(!typing(document.activeElement))document.body.classList.remove('kbd-up')},120));
  /* ---------- instructions behind a "How it works" button ---------- */
  if(st.get('pl-help',false))document.body.classList.add('help-open');
  const root=document.querySelector(C.root)||document.body;
  function decorate(){
    const open=document.body.classList.contains('help-open');
    document.querySelectorAll(C.heads).forEach(h=>{
      if(h.nextElementSibling&&h.nextElementSibling.classList.contains('helpbtn'))return;
      const scope=h.closest('.phead,.mp,.pstack,#panel,#sheet')||h.parentElement;
      if(!scope.querySelector(C.helpTexts))return;
      h.after(el('button',{type:'button',class:'helpbtn','aria-expanded':open?'true':'false',onclick:()=>{
        const v=!document.body.classList.contains('help-open');document.body.classList.toggle('help-open',v);st.set('pl-help',v);
        document.querySelectorAll('.helpbtn').forEach(b=>b.setAttribute('aria-expanded',v?'true':'false'))}},
        el('span',{class:'hi','aria-hidden':'true'},'ⓘ'),'How it works'));
    });
  }
  new MutationObserver(decorate).observe(root,{childList:true,subtree:true});decorate();
  /* ---------- haptics + keep feedback in view ---------- */
  if(C.hap){
    let last=0;const buzz=p=>{if(!MQ.matches||!navigator.vibrate)return;const t=Date.now();if(t-last<150)return;last=t;try{navigator.vibrate(p)}catch(e){}};
    const fb=C.fb&&document.querySelector(C.fb);
    new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType!==1)continue;
      const bad=n.matches(C.hap.bad)||n.querySelector(C.hap.bad),ok=n.matches(C.hap.ok)||n.querySelector(C.hap.ok);
      if(bad||ok){buzz(bad?[30,60,30]:15);
        const f=(C.fb&&document.querySelector(C.fb))||n;
        if(MQ.matches)requestAnimationFrame(()=>{const r=f.getBoundingClientRect();if(r.bottom>window.innerHeight-140||r.top<0){try{f.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}});return}}})
      .observe(root,{childList:true,subtree:true});
  }
})();
</script>

<script>
/* Mistake gate (added): once 20 mistakes are waiting, a pop-up offers to redo them
   before the next new exercise. "Not now" asks again after 5 more mistakes. */
(function(A){
  var LIMIT=20,KEY='mgate-snooze',bypass=false,open=null;
  function n(){try{return A.count()||0}catch(e){return 0}}
  function sz(){try{return +localStorage.getItem(KEY)||0}catch(e){return 0}}
  function setSz(v){try{if(v)localStorage.setItem(KEY,String(v));else localStorage.removeItem(KEY)}catch(e){}}
  function should(){if(bypass||open)return false;try{if(A.inReview())return false}catch(e){return false}
    var c=n();if(c<LIMIT){if(sz())setSz(0);return false}var s=sz();return !s||c>=s+5}
  function close(){if(open){open.remove();open=null}}
  function pop(btn){var c=n();var d=document.createElement('div');d.className='mg-back';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','mg-h');
    d.innerHTML='<div class="mg-card"><h2 id="mg-h">Time to redo your mistakes</h2><p><span class="mg-n">'+c+'</span>mistakes are waiting for you.</p><p>Redo them now, before new exercises. Each one you get right comes off the list.</p><div class="mg-row"><button type="button" class="mg-go">Redo '+Math.min(LIMIT,c)+' mistakes</button><button type="button" class="mg-later">Not now</button></div><p class="mg-small">“Not now” continues with the new exercise. I’ll ask again after 5 more mistakes.</p></div>';
    document.body.appendChild(d);open=d;
    d.querySelector('.mg-go').onclick=function(){close();setSz(0);try{A.start()}catch(e){console.error(e)}};
    d.querySelector('.mg-later').onclick=function(){close();setSz(c);if(btn&&btn.isConnected){bypass=true;try{btn.click()}finally{bypass=false}}};
    d.addEventListener('click',function(e){if(e.target===d){close()}});
    d.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();close()}else if(e.key==='Tab'){var b=d.querySelectorAll('button'),f=b[0],l=b[b.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
    setTimeout(function(){var g=d.querySelector('.mg-go');if(g)g.focus({preventScroll:true})},30)}
  addEventListener('click',function(e){if(bypass||open)return;var b=null;try{b=A.isNext(e.target)}catch(x){}if(!b||!should())return;
    e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  ['pointerdown','touchstart','mousedown'].forEach(function(t){addEventListener(t,function(e){if(open&&!open.contains(e.target)){e.stopImmediatePropagation()}},true)});
  addEventListener('keydown',function(e){if(open){if(!open.contains(e.target)){e.preventDefault();e.stopImmediatePropagation()}return}
    if(e.key!=='Enter'||e.shiftKey||e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;var t=e.target;if(t&&t.tagName==='TEXTAREA')return;
    var b=null;try{b=A.enterNext(e)}catch(x){}if(!b||!should())return;e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  window.__mgate={count:n,should:should,open:function(){pop(null)},start:function(){setSz(0);try{A.start()}catch(e){console.error(e)}}};
})({
  count:function(){return Object.keys(S.miss).filter(function(k){return specOf(k)}).length},
  inReview:function(){return S.tab==='miss'||S.tab==='prog'||S.tab==='ref'},
  isNext:function(t){var b=t.closest&&t.closest('#panel button');if(!b||S.tab==='miss'||S.tab==='prog'||S.tab==='ref')return null;return /^(Next|New round|New board|Skip|Play again|Another)/i.test(b.textContent.trim())?b:null},
  enterNext:function(){if(S.tab==='miss'||S.tab==='prog'||S.tab==='ref')return null;var bs=[].slice.call(document.querySelectorAll('#panel button.primary,#panel .btn.primary'));for(var i=0;i<bs.length;i++){if(bs[i].offsetParent&&/^Next/i.test(bs[i].textContent.trim()))return bs[i]}return null},
  start:function(){var ks=Object.keys(S.miss).filter(function(k){return specOf(k)}).sort(function(x,y){return S.miss[y]-S.miss[x]}).slice(0,20).sort(function(){return Math.random()-.5});
    var tb=[].slice.call(document.querySelectorAll('#tabs button,.bnav button')).find(function(b){return /错题|Review/.test(b.textContent)&&b.offsetParent});if(tb)tb.click();else{S.tab='miss';renderPanel()}
    if(S.run&&S.run.miss)delete S.run.miss;
    var p=document.getElementById('panel');p.replaceChildren.apply(p,head('Redo your mistakes','错题','Answer each one again. Right answers count towards clearing it.'));var area=h('div');p.append(area);
    startQuiz(area,'miss',ks.map(specOf),renderPanel)}
});
