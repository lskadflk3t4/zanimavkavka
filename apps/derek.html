ruppensprechern mitteilte.", "n": "RU: в связи с + Твор. п. (составной предлог); в + Вин. п. (направление). | DE: aufgrund + Gen.; in + Akk. (Richtung); mitteilen + Dat. der Person.", "dk": "Genitiv", "dp": "aufgrund", "rk": "Instrumental", "rp": "в-связи-с"}, {"ru": "Вслед за директором из зала вышли и остальные, хотя обсуждение ещё не закончилось.", "de": "Im Anschluss an den Direktor verließen auch die Übrigen den Saal, obwohl die Diskussion noch nicht beendet war.", "n": "RU: вслед за + Твор. п.; из + Род. п. | DE: im Anschluss an + Akk.", "dk": "Akkusativ", "dp": "im-Anschluss-an", "rk": "Instrumental", "rp": "вслед-за"}, {"ru": "Между двумя корпусами университета построили переход, благодаря которому студенты не мокнут под дождём.", "de": "Zwischen den beiden Gebäuden der Universität baute man einen Übergang, dank dem die Studenten im Regen nicht nass werden.", "n": "RU: между + Твор. п. (нормативно); под + Твор. п. (место). | DE: zwischen + Dat. (Lage); dank + Dat./Gen.; in + Dat.", "dk": "Wechsel", "dp": "zwischen-Dativ", "rk": "Instrumental", "rp": "между"}, {"ru": "Над городом второй день висит смог, из-за которого власти советуют не выходить на улицу.", "de": "Über der Stadt hängt seit zwei Tagen Smog, wegen dessen die Behörden raten, nicht auf die Straße zu gehen.", "n": "RU: над + Твор. п.; на + Вин. п. (направление). | DE: über + Dat. (Lage, wo?); auf + Akk. (Richtung); raten + Dat.", "dk": "Wechsel", "dp": "über-Dativ", "rk": "Instrumental", "rp": "над"}, {"ru": "Перед началом спектакля зрителей попросили выключить телефоны, чем многие пренебрегли.", "de": "Vor Beginn der Vorstellung bat man die Zuschauer, die Telefone auszuschalten, was viele missachteten.", "n": "RU: перед / передо + Твор. п. (место и время); пренебречь + Твор. п. | DE: vor + Dat. bei Zeitangaben (immer Dativ, nie Akk.).", "dk": "Wechsel", "dp": "vor-Dativ", "rk": "Instrumental", "rp": "перед"}, {"ru": "Рядом с нашим домом открыли пекарню, запах из которой чувствуется уже с утра.", alle wissenschaftlichen Zeitschriften, obwohl der Autor selbst die Öffentlichkeit mied.", "n": "RU: о / об / обо + Предл. п. (об перед гласной, обо мне). | DE: über + Akk. beim Thema.", "dk": "Akkusativ", "dp": "über", "rk": "Praepositiv", "rp": "о"}, {"ru": "По окончании университета он сразу устроился в лабораторию, где работает до сих пор.", "de": "Nach Abschluss des Studiums fand er sofort eine Stelle in einem Labor, wo er bis heute arbeitet.", "n": "RU: по + Предл. п. в книжном значении после (по окончании, по приезде, по прибытии). | DE: nach + Dat.; in + Dat.", "dk": "Dativ", "dp": "nach", "rk": "Praepositiv", "rp": "по"}, {"ru": "При таком освещении читать невозможно, поэтому мы передвинули стол ближе к окну.", "de": "Bei einer solchen Beleuchtung ist Lesen unmöglich, deshalb rückten wir den Tisch näher ans Fenster.", "n": "RU: при + Предл. п.; к + Дат. п. | DE: bei + Dat.; an + Akk. (ans = an das, Richtung).", "dk": "Dativ", "dp": "bei", "rk": "Praepositiv", "rp": "при"}, {"ru": "В этот музей мы ходим каждый месяц, потому что экспозиция постоянно меняется.", "de": "In dieses Museum gehen wir jeden Monat, weil sich die Ausstellung ständig ändert.", "n": "RU: в + Вин. п. – направление (куда?), в отличие от в + Предл. п. – место (где?). | DE: in + Akk. (Richtung) gegenüber in + Dat. (Lage).", "dk": "Wechsel", "dp": "in-Akkusativ", "rk": "Akkusativ", "rp": "в"}, {"ru": "На стол поставили вазу, которую бабушка привезла из Петербурга.", "de": "Auf den Tisch stellte man eine Vase, die die Großmutter aus Petersburg mitgebracht hatte.", "n": "RU: на + Вин. п. – направление (куда?), ср. на столе – Предл. п. (где?). | DE: auf + Akk. bei stellen/legen (wohin?); aus + Dat.", "dk": "Wechsel", "dp": "auf-Akkusativ", "rk": "Akkusativ", "rp": "на"}, {"ru": "Он умудрился сесть между двух стульев, из-за чего потерял доверие обеих сторон.", "de": "Er hat es geschafft, sich zwischen zwei Stühle zu setzen, wodurch er das Vertrauen beider Seiten verlor.", "n": "RU: между + Род. п. в устойчивых оборотах (сесть между двух стульев); нормативно между + Твор. п. | DE: zwischen + Akk. bei Richtung (sich setzen).", "dk": "Wechsel", "dp": "zwischen-Akkusativ", "rk": "Genitiv", "rp": "между"}, {"ru": "Читая между строк, можно понять, что автор не разделяет официальной позиции.", "de": "Wenn man zwischen den Zeilen liest, erkennt man, dass der Autor die offizielle Position nicht teilt.", "n": "RU: между + Род. п. – только в идиомах (между строк, между делом); в остальных случаях Твор. п. | DE: zwischen + Dat. (Lage, wo?).", "dk": "Wechsel", "dp": "zwischen-Dativ", "rk": "Genitiv", "rp": "между"}, {"ru": "Он вошёл в воду по пояс, но плыть не решился, поскольку течение было сильным.", "de": "Er ging bis zur Hüfte ins Wasser, wagte aber nicht zu schwimmen, da die Strömung stark war.", "n": "RU: по + Вин. п. в значении предела (по пояс, по колено, по горло). | DE: bis zu + Dat.; in + Akk. (ins = in das, Richtung).", "dk": "Dativ", "dp": "bis-zur", "rk": "Akkusativ", "rp": "по"}, {"ru": "Мы прождали в приёмной с час, прежде чем нас наконец пригласили в кабинет.", "de": "Wir warteten etwa eine Stunde im Vorzimmer, bevor man uns endlich ins Büro bat.", "n": "RU: с + Вин. п. в значении приблизительности (с час, с километр, размером с дом). | DE: keine Präposition, nur etwa + Akk. der Zeitdauer; in + Dat. (im) vs in + Akk. (ins).", "dk": "Zeit", "dp": "Akkusativ", "rk": "Akkusativ", "rp": "с"}, {"ru": "В стороне от главных туристических маршрутов сохранились деревни, где до сих пор говорят на старом диалекте.", "de": "Abseits der großen Touristenrouten haben sich Dörfer erhalten, in denen man bis heute den alten Dialekt spricht.", "n": "RU: в стороне от + Род. п.; на + Предл. п. (говорить на языке). | DE: abseits + Gen.", "dk": "Genitiv", "dp": "abseits", "rk": "Genitiv", "rp": "в-стороне-от"}, {"ru": "На основании собранных данных исследователи сделали вывод, который противоречил прежним гипотезам.", "de": "Anhand der gesammelten Daten zogen die Forscher ein var DAY=864e5;

function sod(){var d=new Date();d.setHours(4,0,0,0);if(Date.now()<d.getTime())d.setTime(d.getTime()-DAY);return d.getTime()}
function Store(key){var S;try{S=JSON.parse(localStorage.getItem(key)||'null')}catch(e){S=null}S=S||{};S.cards=S.cards||{};S.miss=S.miss||{};S.days=S.days||{};S.set=S.set||{};

  function grade(id,ok,q,mode,why){var c=S.cards[id],now=Date.now();if(!c)c=S.cards[id]={n:0,e:2.5,i:0,d:now,s:0,ok:0,bad:0,t:0};c.s++;c.t=now;

    if(!ok){c.bad++;c.n=0;c.i=0;c.e=Math.max(1.3,c.e-.2);c.d=now+10*60000;var m=S.miss[id]=S.miss[id]||{n:0,w:[]};m.n++;if(why&&m.w.indexOf(why)<0){m.w.unshift(why);m.w=m.w.slice(0,3)}}
    else{c.ok++;d.c++;t[1]++;if(c.d<=now||c.n===0){c.n++;c.i=c.n===1?1:c.n===2?3:Math.round(c.i*c.e*(q>1?1.15:1));if(q>1)c.e=Math.min(3,c.e+.05);c.d=sod()+c.i*DAY}
      if(S.miss[id]){S.miss[id].n--;if(S.miss[id].n<=0)delete S.miss[id]}}
    S.save();if(onChange)onChange()}
  function pri(id){var c=S.cards[id],p=Math.random();if(S.miss[id])p+=4;if(!c)p+=1.5;else if(isDue(id))p+=3;else p-=Math.min(3,c.i/7);return p}
  return {status:status,isDue:isDue,due:due,grade:grade,pri:pri}}
function streak(S){var n=0,d=new Date();if(!(S.days[dkey(d)]||{}).a)d=new Date(d.getTime()-DAY);while((S.days[dkey(d)]||{}).a){n++;d=new Date(d.getTime()-DAY)}return n}
function chart14(S){var days=[],t=new Date();for(var i=13;i>=0;i--){var d=new Date(t.getTime()-i*DAY);days.push({l:['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()],v:S.days[dkey(d)]||{a:0,c:0}})}
  var max=Math.max(10,Math.max.apply(null,days.map(function(d){return d.v.a})));

    return '<rect x="'+x+'" y="'+(160-h)+'" width="26" height="'+h+'" rx="3" class="ba"/><rect x="'+x+'" y="'+(160-hc)+'" width="26" height="'+hc+'" rx="3" class="bc"/><text x="'+(x+13)+'" y="178">'+d.l+'</text>'+(d.v.a?'<text x="'+(x+13)+'" y="'+(154-h)+'" class="tv">'+d.v.a+'</text>':'')}).join('')+'<line x1="8" y1="160" x2="552" y2="160"/></svg>'}
function typeStats(S,names){var ty={};Object.keys(S.days).forEach(function(k){var x=S.days[k].ty||{};Object.keys(x).forEach(function(t){ty[t]=ty[t]||[0,0];ty[t][0]+=x[t][0];ty[t][1]+=x[t][1]})});
  var ks=Object.keys(names).filter(function(t){return ty[t]});
  return ks.length?'<div class="types">'+ks.map(function(t){var x=ty[t];return '<div><span>'+esc(names[t])+'</span><b>'+Math.round(x[1]/x[0]*100)+'%</b><small>'+x[0]+' answers</small></div>'}).join('')+'</div>':'<p class="muted">No answers yet.</p>'}
function accuracy7(S){var a=0,c=0,t=new Date();for(var i=0;i<7;i++){var v=S.days[dkey(new Date(t.getTime()-i*DAY))];if(v){a+=v.a;c+=v.c}}return a?Math.round(c/a*100)+'%':'–'}

  v.innerHTML=ks.length?'<div class="row" style="margin-top:0"><button class="pri" id="rm">Redo '+ks.length+' mistakes →</button></div><div class="list" style="margin-top:12px">'+ks.map(function(i){var x=BY[i],m=S.miss[i];return '<div class="lrow" style="grid-template-columns:1fr auto;cursor:default"><span>'+(i[0]==='v'?deLabel(x)+' — '+esc(x.en)+'<br><small class="muted" lang="ru">'+esc(x.ru)+'</small>':esc(x.de)+'<br><small class="muted" lang="ru">'+esc(x.ru)+'</small>')+(m.w&&m.w.length?'<br><small class="muted">tripped on: '+esc(m.w.join('; '))+'</small>':'')+'</span><span class="pill">'+m.n+'×</span></div>'}).join('')+'</div>':'<p class="muted">No mistakes waiting.</p>';
  var b=$('#rm');if(b)b.addEventListener('click',function(){go('practise');run(ks,'mix')})}
function drawStats(){var v=$('#v-stats'),cnt={learning:0,known:0,mastered:0};Object.keys(S.cards).forEach(function(i){cnt[R.status(i)]++});
  var ps=uniq(VV.map(function(x){return x.p})).sort(function(a,b){return VV.filter(function(x){return x.p===b}).length-VV.filter(function(x){return x.p===a}).length});
  var hard=Object.keys(S.cards).filter(function(i){return S.cards[i].bad&&BY[i]}).sort(function(a,b){return (S.cards[b].bad-S.cards[b].ok/3)-(S.cards[a].bad-S.cards[a].ok/3)}).slice(0,12);
  v.innerHTML='<div class="tot"><div><b>'+VV.filter(function(x){return S.cards[x.id]}).length+' / '+VV.length+'</b><span>verb constructions practised</span></div><div><b>'+SS.filter(function(x){return S.cards[x.id]}).length+' / '+SS.length+'</b><span>sentences practised</span></div><div><b>'+cnt.known+'</b><span>known (≥ 7 days)</span></div><div><b>'+cnt.mastered+'</b><span>mastered (≥ 21 days)</span></div><div><b>'+R.due().length+'</b><span>due now</span></div><div><b>'+streak(S)+'</b><span>day streak</span></div><div><b>'+accuracy7(S)+'</b><span>accuracy, 7 days</span></div></div>'+
   '<h3>Last 14 days</h3>'+chart14(S)+'<h3>By exercise</h3>'+typeStats(S,(function(){var o={};Object.keys(MODES).forEach(function(k){o[k]=MODES[k][0]});return o})())+
   '<h3>By preposition</h3><div class="cats">'+ps.map(function(p){var L=VV.filter(function(x){return x.p===p}),m=0,k=0;L.forEach(function(x){var s=R.status(x.id);if(s!=='new')m++;if(s==='known'||s==='mastered')k++});return '<div class="cat"><span>'+esc(p)+'</span><span class="bar"><i style="width:'+(m/L.length*100)+'%"></i><i class="k" style="width:'+(k/L.length*100)+'%"></i></span><small>'+m+' / '+L.length+'</small></div>'}).join('')+'</div>'+
   '<h3>Hardest</h3>'+(hard.length?'<div class="hard">'+hard.map(function(i){var x=BY[i];return '<div>'+(i[0]==='v'?deLabel(x):esc(x.de.slice(0,70))+'…')+'<br><small>'+S.cards[i].ok+' ✓ · '+S.cards[i].bad+' ✗</small></div>'}).join('')+'</div>':'<p class="muted">Nothing yet.</p>')+
   '<div class="row"><button class="ghost w" id="reset">Reset progress in this drill…</button></div>';
  $('#reset').addEventListener('click',function(){if(this.dataset.arm){S.cards={};S.miss={};S.days={};S.save();upd();drawStats();return}this.dataset.arm=1;this.textContent='Press again to erase all progress here'})}
upd();go('practise');

})();</script></body></html>
