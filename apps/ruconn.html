<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connectors</title>
<style>
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--ink:#1B2421;--muted:#5D6B66;--line:#D8E0DC;
  --jade:#2B7A5E;--jade-soft:#E1EFE9;--seal:#B5442F;--seal-soft:#F7E5E0;--gold:#9A6A12;--gold-soft:#F6ECD6;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-han:"Noto Serif SC","Songti SC","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715;--surface:#19211F;--ink:#E3EBE7;--muted:#93A39C;--line:#2B3632;
  --jade:#62C39C;--jade-soft:#1D3229;--seal:#E58169;--seal-soft:#3A221D;--gold:#E0B357;--gold-soft:#3A2F17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111715;--surface:#19211F;--ink:#E3EBE7;--muted:#93A39C;--line:#2B3632;
  --jade:#62C39C;--jade-soft:#1D3229;--seal:#E58169;--seal-soft:#3A221D;--gold:#E0B357;--gold-soft:#3A2F17;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 90px}
header.top{padding:22px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-read);font-weight:600;font-size:clamp(22px,5vw,30px);line-height:1.2;margin:2px 0 4px}
h1 .zh{font-family:var(--f-han)}
.lede{color:var(--muted);margin:0 0 6px;max-width:60ch}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 14px;overflow-x:auto;scrollbar-width:none}
.seg button{appearance:none;border:0;background:none;font-weight:600;color:var(--muted);padding:10px 12px 9px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;min-height:44px}
.seg button[aria-selected="true"]{color:var(--jade);border-bottom-color:var(--jade)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.opts .lab{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:64px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--jade)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
h2{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade);margin:22px 0 8px;font-weight:700}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;width:100%}
.set:hover{border-color:var(--jade)}
.set .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);line-height:1.2}
.set .no b{display:block;font-family:var(--f-han);font-size:15px;color:var(--jade);font-weight:600}
.set .t{font-weight:600;line-height:1.3}
.set .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.set .sc{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.set .sc b{color:var(--jade)}
.bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade)}
.special{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 22px -18px rgba(0,0,0,.4)}
.prog{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
.prog .pbar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .pbar i{display:block;height:100%;background:var(--jade);transition:width .25s}
.play{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb{width:52px;height:52px;border-radius:50%;border:0;background:var(--jade);color:var(--bg);cursor:pointer;display:grid;place-items:center;flex:none}
.pb svg{width:20px;height:20px;fill:currentColor}
.pb.on{box-shadow:0 0 0 5px var(--jade-soft)}
.small{font-size:13px;color:var(--muted)}
.prompt-en{font-family:var(--f-read);font-size:17px;line-height:1.4}
.prompt-en.off{color:var(--muted);font-style:italic;font-size:14px;font-family:var(--f-ui)}
.pyhint{color:var(--jade);font-size:14px}
.ans{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.ans.empty::before{content:"Tap the blocks in order";color:var(--muted);font-size:13.5px;padding:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tile{font-family:var(--f-han);font-size:19px;line-height:1.2;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 11px;cursor:pointer;min-height:44px;min-width:44px;user-select:none;box-shadow:0 1px 0 var(--line)}
.tile:hover{border-color:var(--jade)}
.tile.used{visibility:hidden}
.tile.ok{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.tile.bad{background:var(--seal-soft);border-color:var(--seal);color:var(--seal)}
.tile.given{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-family:var(--f-han);font-size:20px;line-height:1.5;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.fb.ok{background:var(--jade-soft)}
.fb.bad{background:var(--seal-soft)}
.fb .v{font-weight:700}
.fb.ok .v{color:var(--jade)}.fb.bad .v{color:var(--seal)}
.han{font-family:var(--f-han);font-size:20px;line-height:1.55}
.han .m{color:var(--seal);text-decoration:underline wavy;text-underline-offset:4px}
.han .x{color:var(--seal);text-decoration:line-through}
.han .g{color:var(--jade)}
.han .tw{color:var(--gold);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.fb .py{color:var(--jade);font-size:14px}
.fb .en{color:var(--muted);font-size:14px}
.done{text-align:center;padding:26px 10px;display:grid;gap:10px;justify-items:center}
.done .big{font-family:var(--f-read);font-size:40px;color:var(--jade);line-height:1}
.mini{display:grid;gap:6px;text-align:left;width:100%;margin-top:8px}
.mini div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px}
.mini .han{font-size:16px}
.mk{font-weight:700}.mk.g1{color:var(--jade)}.mk.g0{color:var(--seal)}.mk.gh{color:var(--gold)}
.back{border:0;background:none;color:var(--jade);font-weight:600;cursor:pointer;padding:6px 0;min-height:40px}
.note{font-size:12.5px;color:var(--muted)}
.ab{display:grid;gap:6px}
.ab div{font-family:var(--f-read);font-size:17px;line-height:1.45;background:var(--bg);border-radius:10px;padding:9px 12px}
.ab b{font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-right:6px}
.use{font-size:14px}.use b{color:var(--seal);font-size:16px}
.gapq{font-family:var(--f-read);font-size:19px;line-height:1.5}
.gapq .gp{display:inline-block;min-width:70px;border-bottom:2px solid var(--seal);color:var(--seal);text-align:center;font-weight:700}
.opts.ch{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opts.ch .opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:16px;min-height:48px;text-align:left}
.opts.ch .opt.ok{border-color:var(--jade);background:var(--jade-soft)}.opts.ch .opt.bad{border-color:var(--seal);background:var(--seal-soft)}
.cl{display:grid;gap:8px}
.cn{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:4px}
.cn .f{font-weight:700;font-size:17px;color:var(--jade)}
.cn .m{font-size:14.5px}.cn .nt{font-size:13.5px;color:var(--muted)}
.cn .ex{font-family:var(--f-read);font-size:15px;border-left:3px solid var(--line);padding-left:9px}
.tag{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--muted);vertical-align:2px}
.tag.reg-c{color:#9A6A12;border-color:#9A6A12}.tag.reg-e{color:#2E5FA8;border-color:#2E5FA8}.tag.reg-l{color:#7B3FA0;border-color:#7B3FA0}
.cn .row{gap:6px}
.lvbar{display:flex;gap:6px;flex-wrap:wrap}
.cat h2{margin-top:18px}
.src{font-size:12px;color:var(--muted)}
.ch-hint{font-size:13px;color:var(--muted)}

body.inround header.top{display:none}body.inround .wrap{padding-top:8px}
.cfg{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:0 0 12px}
.cfg>summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:600;min-height:44px}
.cfg>summary::-webkit-details-marker{display:none}
.cfg>summary small{font-weight:400;color:var(--muted);margin-left:6px}
.cfg[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.cfg .opts{padding:0 12px}
@media (max-width:480px){.tile{font-size:18px;padding:7px 9px}.han{font-size:18px}textarea{font-size:18px}}
</style></head><body>
<div class="wrap">
<header class="top" id="hd">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
</header>
<div id="app"></div>
</div>
<audio id="au" preload="none"></audio>
<script>
const CFG={"lang":"ru","han":false,"levels":["B1","B2","C1"],"regs":{"c":"colloquial","n":"neutral","e":"formal","l":"literary"},"cats":{"cause":"Причина · Cause","cons":"Следствие · Consequence","conc":"Уступка · Concession","contr":"Противопоставление · Contrast","cond":"Условие · Condition","purp":"Цель · Purpose","time":"Время · Time","add":"Перечисление и добавление · Adding & pairing","comp":"Сравнение · Comparison","expl":"Пояснение · Explaining & rephrasing"},"conns":[{"id":"potomu","f":"потому что","cat":"cause","reg":"n","lv":"B1","m":"because — the everyday default","nt":"The reason comes second: главное, потому что + причина."},{"id":"tak_kak","f":"так как","cat":"cause","reg":"n","lv":"B1","m":"as, since — a bit more formal than потому что","nt":"The clause can come first: Так как …, …"},{"id":"poskolku","f":"поскольку","cat":"cause","reg":"e","lv":"B2","m":"since, inasmuch as — written, official","nt":"Typical of reports and explanations."},{"id":"ved","f":"ведь","cat":"cause","reg":"c","lv":"B1","m":"after all, you know — gives a reason the listener should already know","nt":"No comma before ведь inside the clause; it usually follows a comma or starts the sentence."},{"id":"raz","f":"раз","cat":"cause","reg":"c","lv":"B2","m":"since, seeing that — the reason is a fact both people accept","nt":"Раз ты пришёл, помоги. Often followed by то."},{"id":"iz_za","f":"из-за того что","cat":"cause","reg":"n","lv":"B1","m":"because (of the fact that) — usually a bad reason","nt":"Positive reasons use благодаря тому что."},{"id":"blagodarya","f":"благодаря тому что","cat":"cause","reg":"n","lv":"B2","m":"thanks to the fact that — a good reason","nt":""},{"id":"tem_bolee","f":"тем более что","cat":"cause","reg":"n","lv":"B2","m":"especially as, all the more so as","nt":"Adds an extra reason that strengthens the point."},{"id":"delo","f":"дело в том, что","cat":"cause","reg":"c","lv":"B2","m":"the thing is (that)","nt":"Opens an explanation; often after a question."},{"id":"a_to","f":"а то","cat":"cause","reg":"c","lv":"B1","m":"otherwise / or else; also \"because otherwise\"","nt":"Very colloquial: Одевайся теплее, а то замёрзнешь."},{"id":"poetomu","f":"поэтому","cat":"cons","reg":"n","lv":"B1","m":"so, that's why","nt":"Starts the second clause after a comma or full stop."},{"id":"tak_chto","f":"так что","cat":"cons","reg":"c","lv":"B1","m":"so (as a result)","nt":"Never at the start of a sentence in this meaning."},{"id":"vot_i","f":"вот и","cat":"cons","reg":"c","lv":"B2","m":"so, and that's why (looking back at a result)","nt":"Вот и + verb: Проспал, вот и опоздал."},{"id":"znachit","f":"значит","cat":"cons","reg":"c","lv":"B1","m":"so, that means","nt":"Drawing a conclusion from what was just said."},{"id":"v_rezultate","f":"в результате (чего)","cat":"cons","reg":"n","lv":"B2","m":"as a result","nt":""},{"id":"sledovatelno","f":"следовательно","cat":"cons","reg":"e","lv":"C1","m":"consequently, therefore","nt":"Written and logical style."},{"id":"tak_chto_daje","f":"настолько …, что","cat":"cons","reg":"n","lv":"B2","m":"so (much) … that","nt":"Настолько устал, что уснул в метро."},{"id":"hotya","f":"хотя","cat":"conc","reg":"n","lv":"B1","m":"although","nt":"Хотя + fact, main clause. The main clause often gets но or всё равно in speech."},{"id":"hot","f":"хоть","cat":"conc","reg":"c","lv":"B1","m":"although (spoken form of хотя); also \"at least\"","nt":"Хоть и + verb is very common: Хоть и дорого, но вкусно."},{"id":"nesmotrya","f":"несмотря на то что","cat":"conc","reg":"n","lv":"B2","m":"despite the fact that","nt":"No comma inside the conjunction when it opens the sentence."},{"id":"vse_ravno","f":"всё равно","cat":"conc","reg":"c","lv":"B1","m":"anyway, still","nt":"In the main clause after хотя / даже если."},{"id":"pust","f":"пусть (даже)","cat":"conc","reg":"c","lv":"B2","m":"even if, let it be that","nt":"Пусть дорого, зато качественно."},{"id":"kak_by_ni","f":"как бы ни","cat":"conc","reg":"e","lv":"C1","m":"however (much)","nt":"Как бы ни + verb in the past, ни is not a negation here."},{"id":"tem_ne_menee","f":"тем не менее","cat":"conc","reg":"e","lv":"B2","m":"nevertheless","nt":"Starts the second sentence or clause."},{"id":"dazhe_esli","f":"даже если","cat":"conc","reg":"n","lv":"B1","m":"even if","nt":""},{"id":"a","f":"а","cat":"contr","reg":"n","lv":"B1","m":"and / whereas / but — contrast between two different things","nt":"Я люблю чай, а он кофе."},{"id":"no","f":"но","cat":"contr","reg":"n","lv":"B1","m":"but — against expectation","nt":""},{"id":"odnako","f":"однако","cat":"contr","reg":"e","lv":"B2","m":"however","nt":"Formal; in speech но is normal."},{"id":"zato","f":"зато","cat":"contr","reg":"c","lv":"B1","m":"but on the other hand, but then","nt":"Introduces a compensation: Дорого, зато удобно."},{"id":"v_to_vremya","f":"в то время как","cat":"contr","reg":"e","lv":"B2","m":"whereas, while (contrast)","nt":"Also used for time in formal style."},{"id":"a_vot","f":"а вот","cat":"contr","reg":"c","lv":"B1","m":"but (as for …) — highlights the contrasting item","nt":"А вот мой брат …"},{"id":"naoborot","f":"наоборот","cat":"contr","reg":"n","lv":"B2","m":"on the contrary, the other way round","nt":"Often а наоборот / наоборот,."},{"id":"esli","f":"если","cat":"cond","reg":"n","lv":"B1","m":"if (real condition)","nt":"Если + future in the condition when it's about the future: Если будет время, зайду."},{"id":"esli_by","f":"если бы … , … бы","cat":"cond","reg":"n","lv":"B2","m":"if … would (unreal)","nt":"бы in both clauses, verb in the past form."},{"id":"v_sluchae","f":"в случае если","cat":"cond","reg":"e","lv":"B2","m":"in case, if","nt":"Official style; in speech just если."},{"id":"pri_uslovii","f":"при условии что","cat":"cond","reg":"e","lv":"C1","m":"provided that","nt":""},{"id":"inache","f":"иначе","cat":"cond","reg":"n","lv":"B1","m":"otherwise","nt":"Neutral; а то is the colloquial twin."},{"id":"lish_by","f":"лишь бы","cat":"cond","reg":"c","lv":"B2","m":"as long as, if only","nt":"Лишь бы + past / noun: Лишь бы не было дождя."},{"id":"kogda_by","f":"стоит (только) …, как","cat":"cond","reg":"c","lv":"C1","m":"as soon as you …, (immediately)","nt":"Стоит мне сесть, как звонит телефон."},{"id":"chtoby","f":"чтобы","cat":"purp","reg":"n","lv":"B1","m":"so that, in order to","nt":"Same subject → чтобы + infinitive; different subject → чтобы + past form."},{"id":"dlya_togo","f":"для того чтобы","cat":"purp","reg":"n","lv":"B2","m":"in order to","nt":"Stresses the purpose; can be split: для того, чтобы."},{"id":"s_tem","f":"с тем чтобы","cat":"purp","reg":"e","lv":"C1","m":"with a view to, in order to","nt":"Bookish."},{"id":"chtoby_ne","f":"чтобы не","cat":"purp","reg":"n","lv":"B2","m":"so as not to, so that … not","nt":"Usually with an imperfective verb."},{"id":"kogda","f":"когда","cat":"time","reg":"n","lv":"B1","m":"when","nt":""},{"id":"poka","f":"пока","cat":"time","reg":"n","lv":"B1","m":"while","nt":"Two actions at the same time."},{"id":"poka_ne","f":"пока не","cat":"time","reg":"n","lv":"B2","m":"until","nt":"The не is not a real negation: Подожди, пока он не придёт."},{"id":"kak_tolko","f":"как только","cat":"time","reg":"n","lv":"B1","m":"as soon as","nt":""},{"id":"posle_togo","f":"после того как","cat":"time","reg":"n","lv":"B2","m":"after","nt":""},{"id":"pered_tem","f":"перед тем как","cat":"time","reg":"n","lv":"B2","m":"before (just before)","nt":"+ infinitive when the subject is the same."},{"id":"do_togo","f":"до того как","cat":"time","reg":"n","lv":"B2","m":"before (some time before)","nt":""},{"id":"s_teh_por","f":"с тех пор как","cat":"time","reg":"n","lv":"B2","m":"since (time)","nt":""},{"id":"edva","f":"едва","cat":"time","reg":"l","lv":"C1","m":"hardly … when, as soon as","nt":"Literary: Едва он вошёл, как зазвонил телефон."},{"id":"kak_c","f":"как (= как только)","cat":"time","reg":"c","lv":"B2","m":"as soon as (spoken)","nt":"Как приеду, сразу позвоню."},{"id":"ne_tolko","f":"не только …, но и","cat":"add","reg":"n","lv":"B1","m":"not only … but also","nt":""},{"id":"i_i","f":"и … и","cat":"add","reg":"n","lv":"B1","m":"both … and","nt":""},{"id":"ni_ni","f":"ни … ни","cat":"add","reg":"n","lv":"B1","m":"neither … nor","nt":"The verb keeps its не: Я не люблю ни чай, ни кофе."},{"id":"to_to","f":"то … то","cat":"add","reg":"c","lv":"B2","m":"now … now; one moment … the next","nt":""},{"id":"libo","f":"либо … либо","cat":"add","reg":"n","lv":"B2","m":"either … or","nt":"Slightly more decisive than или … или."},{"id":"prichem","f":"причём","cat":"add","reg":"n","lv":"B2","m":"and what's more, and at that","nt":""},{"id":"k_tomu","f":"к тому же","cat":"add","reg":"n","lv":"B2","m":"besides, on top of that","nt":""},{"id":"da_i","f":"да и","cat":"add","reg":"c","lv":"B2","m":"and anyway, and besides","nt":"Adds a reason casually: Не хочу идти, да и поздно уже."},{"id":"chem_tem","f":"чем …, тем","cat":"comp","reg":"n","lv":"B2","m":"the … the","nt":"Both halves use comparatives."},{"id":"kak_budto","f":"как будто","cat":"comp","reg":"n","lv":"B1","m":"as if","nt":""},{"id":"slovno","f":"словно","cat":"comp","reg":"l","lv":"C1","m":"as if, like (literary)","nt":""},{"id":"budto","f":"будто","cat":"comp","reg":"c","lv":"B2","m":"as if; supposedly","nt":"Also \"allegedly\": Говорят, будто он уехал."},{"id":"tak_zhe_kak","f":"так же, как (и)","cat":"comp","reg":"n","lv":"B2","m":"just as, the same way as","nt":""},{"id":"to_est","f":"то есть","cat":"expl","reg":"n","lv":"B1","m":"that is, I mean","nt":""},{"id":"a_imenno","f":"а именно","cat":"expl","reg":"e","lv":"B2","m":"namely","nt":""},{"id":"kstati","f":"кстати","cat":"expl","reg":"c","lv":"B1","m":"by the way","nt":""},{"id":"voobshe","f":"вообще-то","cat":"expl","reg":"c","lv":"B2","m":"actually, as a matter of fact (mild correction)","nt":""},{"id":"koroche","f":"короче","cat":"expl","reg":"c","lv":"B1","m":"in short, anyway (very colloquial)","nt":""},{"id":"v_smysle","f":"в смысле","cat":"expl","reg":"c","lv":"B2","m":"I mean, meaning?","nt":""}],"items":[{"c":"potomu","lv":"B1","a":"Я сегодня не пойду в спортзал.","b":"Я очень устал.","s":"Я сегодня не пойду в спортзал, {потому} {что} очень устал.","alts":["Я сегодня не пойду в спортзал, потому что я очень устал."],"tr":"I'm not going to the gym today because I'm really tired."},{"c":"potomu","lv":"B1","a":"Мы взяли такси.","b":"Метро уже закрылось.","s":"Мы взяли такси, {потому} {что} метро уже закрылось.","tr":"We took a taxi because the metro had already closed."},{"c":"potomu","lv":"B1","a":"Она не берёт трубку.","b":"У неё сел телефон.","s":"Она не берёт трубку, {потому} {что} у неё сел телефон.","tr":"She isn't answering because her phone is dead."},{"c":"tak_kak","lv":"B1","a":"Магазин был закрыт.","b":"Мы купили хлеб в киоске.","s":"{Так} {как} магазин был закрыт, мы купили хлеб в киоске.","alts":["Мы купили хлеб в киоске, так как магазин был закрыт."],"tr":"As the shop was closed, we bought bread at the kiosk."},{"c":"tak_kak","lv":"B1","a":"Я плохо знаю город.","b":"Я поеду на такси.","s":"{Так} {как} я плохо знаю город, я поеду на такси.","alts":["Я поеду на такси, так как плохо знаю город.","Так как я плохо знаю город, поеду на такси."],"tr":"Since I don't know the city well, I'll take a taxi."},{"c":"poskolku","lv":"B2","a":"Поезд задерживается.","b":"Встреча переносится на завтра.","s":"{Поскольку} поезд задерживается, встреча переносится на завтра.","alts":["Встреча переносится на завтра, поскольку поезд задерживается."],"tr":"Since the train is delayed, the meeting is moved to tomorrow."},{"c":"poskolku","lv":"B2","a":"У нас мало времени.","b":"Я буду краток.","s":"{Поскольку} у нас мало времени, я буду краток.","alts":["Я буду краток, поскольку у нас мало времени."],"tr":"Since we're short of time, I'll be brief."},{"c":"ved","lv":"B1","a":"Возьми зонтик.","b":"Обещали дождь.","s":"Возьми зонтик, {ведь} обещали дождь.","alts":["Возьми зонтик, обещали ведь дождь."],"tr":"Take an umbrella — they did say it would rain."},{"c":"ved","lv":"B1","a":"Не волнуйся.","b":"Ты же всё знаешь.","s":"Не волнуйся, {ведь} ты всё знаешь.","alts":["Не волнуйся, ты ведь всё знаешь."],"tr":"Don't worry — after all, you know everything."},{"c":"raz","lv":"B2","a":"Ты уже пришёл.","b":"Помоги мне с ужином.","s":"{Раз} ты уже пришёл, помоги мне с ужином.","alts":["Раз уж ты пришёл, помоги мне с ужином."],"tr":"Since you're here anyway, help me with dinner."},{"c":"raz","lv":"B2","a":"Ты не хочешь идти.","b":"Оставайся дома.","s":"{Раз} ты не хочешь идти, оставайся дома.","alts":["Раз не хочешь идти, оставайся дома."],"tr":"If you don't want to go, then stay at home."},{"c":"iz_za","lv":"B1","a":"Мы опоздали.","b":"Была огромная пробка.","s":"Мы опоздали {из-за} {того,} {что} была огромная пробка.","alts":["Мы опоздали из-за того что была огромная пробка."],"tr":"We were late because there was a huge traffic jam."},{"c":"iz_za","lv":"B2","a":"Он поругался с соседом.","b":"Тот слишком громко слушал музыку.","s":"Он поругался с соседом {из-за} {того,} {что} тот слишком громко слушал музыку.","alts":["Он поругался с соседом из-за того что тот слишком громко слушал музыку."],"tr":"He fell out with his neighbour because the man played music too loudly."},{"c":"blagodarya","lv":"B2","a":"Мы успели на самолёт.","b":"Таксист знал короткую дорогу.","s":"Мы успели на самолёт {благодаря} {тому,} {что} таксист знал короткую дорогу.","alts":["Мы успели на самолёт благодаря тому что таксист знал короткую дорогу."],"tr":"We caught the plane thanks to the taxi driver knowing a shortcut."},{"c":"blagodarya","lv":"B2","a":"Она быстро нашла работу.","b":"Она хорошо говорит по-английски.","s":"Она быстро нашла работу {благодаря} {тому,} {что} хорошо говорит по-английски.","alts":["Она быстро нашла работу благодаря тому, что она хорошо говорит по-английски."],"tr":"She found a job quickly thanks to her good English."},{"c":"tem_bolee","lv":"B2","a":"Давай не пойдём.","b":"Уже поздно, и завтра рано вставать.","s":"Давай не пойдём, {тем} {более} {что} уже поздно.","alts":["Давай не пойдём, тем более уже поздно."],"tr":"Let's not go, especially as it's already late."},{"c":"tem_bolee","lv":"B2","a":"Я с удовольствием помогу.","b":"У меня всё равно свободный вечер.","s":"Я с удовольствием помогу, {тем} {более} {что} у меня свободный вечер.","alts":["Я с удовольствием помогу, тем более что у меня всё равно свободный вечер."],"tr":"I'll gladly help, all the more so as my evening's free."},{"c":"delo","lv":"B2","a":"Почему ты не пришёл?","b":"Я заболел.","s":"Почему ты не пришёл? — {Дело} {в} {том,} {что} я заболел.","alts":["Дело в том, что я заболел."],"tr":"Why didn't you come? — The thing is, I got ill."},{"c":"delo","lv":"B2","a":"Извините за опоздание.","b":"У нас сломался лифт.","s":"Извините за опоздание: {дело} {в} {том,} {что} у нас сломался лифт.","alts":["Извините за опоздание, дело в том, что у нас сломался лифт."],"tr":"Sorry I'm late — the thing is, our lift broke down."},{"c":"a_to","lv":"B1","a":"Одевайся теплее.","b":"Ты замёрзнешь.","s":"Одевайся теплее, {а} {то} замёрзнешь.","alts":["Одевайся теплее, а то ты замёрзнешь."],"tr":"Wrap up warm, or you'll freeze."},{"c":"a_to","lv":"B1","a":"Пойдём быстрее.","b":"Мы опоздаем на фильм.","s":"Пойдём быстрее, {а} {то} опоздаем на фильм.","alts":["Пойдём быстрее, а то мы опоздаем на фильм."],"tr":"Let's hurry or we'll be late for the film."},{"c":"a_to","lv":"B2","a":"Я сам позвоню.","b":"Ты вечно всё забываешь.","s":"Я сам позвоню, {а} {то} ты вечно всё забываешь.","tr":"I'll call myself — you always forget everything."},{"c":"poetomu","lv":"B1","a":"Я не выспался.","b":"Я весь день пью кофе.","s":"Я не выспался, {поэтому} весь день пью кофе.","alts":["Я не выспался, поэтому я весь день пью кофе."],"tr":"I didn't get enough sleep, so I've been drinking coffee all day."},{"c":"poetomu","lv":"B1","a":"В субботу будет дождь.","b":"Шашлыки переносим.","s":"В субботу будет дождь, {поэтому} шашлыки переносим.","alts":["В субботу будет дождь, поэтому шашлыки мы переносим."],"tr":"It's going to rain on Saturday, so we're postponing the barbecue."},{"c":"tak_chto","lv":"B1","a":"Я уже поел.","b":"Не готовь на меня.","s":"Я уже поел, {так} {что} не готовь на меня.","tr":"I've already eaten, so don't cook for me."},{"c":"tak_chto","lv":"B1","a":"Завтра выходной.","b":"Можно поспать подольше.","s":"Завтра выходной, {так} {что} можно поспать подольше.","tr":"Tomorrow's a day off, so we can sleep in."},{"c":"vot_i","lv":"B2","a":"Он не поставил будильник.","b":"Он проспал.","s":"Он не поставил будильник, {вот} {и} проспал.","tr":"He didn't set an alarm, and so he overslept."},{"c":"vot_i","lv":"B2","a":"Я весь день был за компьютером.","b":"У меня болит голова.","s":"Я весь день был за компьютером, {вот} {и} болит голова.","alts":["Я весь день сидел за компьютером, вот и болит голова."],"tr":"I've been at the computer all day — no wonder my head hurts."},{"c":"znachit","lv":"B1","a":"Свет не горит.","b":"Дома никого нет.","s":"Свет не горит, {значит,} дома никого нет.","alts":["Свет не горит, значит дома никого нет."],"tr":"The light's off, so nobody's home."},{"c":"znachit","lv":"B1","a":"Ты не голоден?","b":"Ужин отменяется.","s":"Ты не голоден? {Значит,} ужин отменяется.","alts":["Ты не голоден? Значит ужин отменяется."],"tr":"You're not hungry? Then dinner's off."},{"c":"v_rezultate","lv":"B2","a":"Целую неделю шли дожди.","b":"Река вышла из берегов.","s":"Целую неделю шли дожди, {в} {результате} {чего} река вышла из берегов.","alts":["Целую неделю шли дожди. В результате река вышла из берегов."],"tr":"It rained for a whole week; as a result the river burst its banks."},{"c":"sledovatelno","lv":"C1","a":"Все билеты проданы.","b":"Концерт состоится.","s":"Все билеты проданы, {следовательно,} концерт состоится.","alts":["Все билеты проданы, следовательно концерт состоится."],"tr":"All tickets are sold; consequently the concert will go ahead."},{"c":"sledovatelno","lv":"C1","a":"Подпись поставлена не там.","b":"Документ недействителен.","s":"Подпись поставлена не там, {следовательно,} документ недействителен.","tr":"The signature is in the wrong place; therefore the document is invalid."},{"c":"tak_chto_daje","lv":"B2","a":"Я очень устал.","b":"Я уснул в метро.","s":"Я {настолько} устал, {что} уснул в метро.","alts":["Я так устал, что уснул в метро."],"tr":"I was so tired that I fell asleep on the metro."},{"c":"tak_chto_daje","lv":"B2","a":"Фильм был скучный.","b":"Половина зала ушла.","s":"Фильм был {настолько} скучный, {что} половина зала ушла.","alts":["Фильм был такой скучный, что половина зала ушла."],"tr":"The film was so boring that half the audience left."},{"c":"hotya","lv":"B1","a":"Было холодно.","b":"Мы пошли гулять.","s":"{Хотя} было холодно, мы пошли гулять.","alts":["Мы пошли гулять, хотя было холодно."],"tr":"Although it was cold, we went for a walk."},{"c":"hotya","lv":"B1","a":"Он богатый.","b":"Он ездит на старой машине.","s":"{Хотя} он богатый, он ездит на старой машине.","alts":["Он ездит на старой машине, хотя он богатый.","Он ездит на старой машине, хотя богатый."],"tr":"Although he's rich, he drives an old car."},{"c":"hotya","lv":"B2","a":"Я обещал прийти.","b":"Я, наверное, не смогу.","s":"Я обещал прийти, {хотя,} наверное, не смогу.","tr":"I promised to come, though I probably won't be able to."},{"c":"hot","lv":"B1","a":"Это дорого.","b":"Это очень вкусно.","s":"{Хоть} {и} дорого, но очень вкусно.","alts":["Хоть и дорого, зато очень вкусно."],"tr":"It may be pricey, but it's really tasty."},{"c":"hot","lv":"B2","a":"Он мой брат.","b":"Я не буду его защищать.","s":"{Хоть} он и мой брат, я не буду его защищать.","alts":["Хоть он мой брат, я не буду его защищать."],"tr":"Even though he's my brother, I won't defend him."},{"c":"nesmotrya","lv":"B2","a":"Была метель.","b":"Самолёт вылетел вовремя.","s":"{Несмотря} {на} {то} {что} была метель, самолёт вылетел вовремя.","alts":["Самолёт вылетел вовремя, несмотря на то что была метель."],"tr":"Despite the blizzard, the plane left on time."},{"c":"nesmotrya","lv":"B2","a":"Ей восемьдесят лет.","b":"Она каждый день плавает в бассейне.","s":"{Несмотря} {на} {то} {что} ей восемьдесят лет, она каждый день плавает в бассейне.","alts":["Она каждый день плавает в бассейне, несмотря на то что ей восемьдесят лет."],"tr":"Despite being eighty, she swims in the pool every day."},{"c":"vse_ravno","lv":"B1","a":"Я ему всё объяснил.","b":"Он не понял.","s":"Я ему всё объяснил, но он {всё} {равно} не понял.","alts":["Я ему всё объяснил, а он всё равно не понял."],"tr":"I explained everything to him, but he still didn't get it."},{"c":"vse_ravno","lv":"B1","a":"Даже если будет дождь.","b":"Мы поедем на дачу.","s":"Даже если будет дождь, мы {всё} {равно} поедем на дачу.","alts":["Мы всё равно поедем на дачу, даже если будет дождь."],"tr":"Even if it rains, we'll still go to the dacha."},{"c":"pust","lv":"B2","a":"Квартира маленькая.","b":"Зато своя.","s":"{Пусть} квартира маленькая, зато своя.","alts":["Пусть маленькая, зато своя."],"tr":"The flat may be small, but it's our own."},{"c":"pust","lv":"C1","a":"Он ошибся.","b":"Он хотя бы попробовал.","s":"{Пусть} он ошибся, зато хотя бы попробовал.","alts":["Пусть он и ошибся, зато попробовал."],"tr":"He may have got it wrong, but at least he tried."},{"c":"kak_by_ni","lv":"C1","a":"Я очень стараюсь.","b":"У меня не получается.","s":"{Как} {бы} я {ни} старался, у меня не получается.","alts":["Как бы я ни старался, ничего не получается."],"tr":"However hard I try, it doesn't work."},{"c":"kak_by_ni","lv":"C1","a":"Ты будешь его уговаривать.","b":"Он не согласится.","s":"{Как} {бы} ты его {ни} уговаривал, он не согласится.","tr":"However much you try to persuade him, he won't agree."},{"c":"tem_ne_menee","lv":"B2","a":"Проект сложный.","b":"Мы уложились в сроки.","s":"Проект сложный, {тем} {не} {менее} мы уложились в сроки.","alts":["Проект был сложный. Тем не менее мы уложились в сроки.","Проект сложный, но тем не менее мы уложились в сроки."],"tr":"The project is difficult; nevertheless we met the deadline."},{"c":"dazhe_esli","lv":"B1","a":"Ты мне не поверишь.","b":"Это правда.","s":"{Даже} {если} ты мне не поверишь, это правда.","alts":["Это правда, даже если ты мне не поверишь."],"tr":"Even if you don't believe me, it's true."},{"c":"dazhe_esli","lv":"B1","a":"Он опоздает.","b":"Начинайте без него.","s":"{Даже} {если} он опоздает, начинайте без него.","tr":"Even if he's late, start without him."},{"c":"a","lv":"B1","a":"Я люблю чай.","b":"Мой муж любит кофе.","s":"Я люблю чай, {а} мой муж — кофе.","alts":["Я люблю чай, а мой муж любит кофе.","Я люблю чай, а муж кофе."],"tr":"I like tea, and my husband likes coffee."},{"c":"a","lv":"B1","a":"Брат живёт в Москве.","b":"Сестра живёт в Казани.","s":"Брат живёт в Москве, {а} сестра — в Казани.","alts":["Брат живёт в Москве, а сестра живёт в Казани.","Брат живёт в Москве, а сестра в Казани."],"tr":"My brother lives in Moscow and my sister in Kazan."},{"c":"a","lv":"B2","a":"Все думали, что он уехал.","b":"Он сидел дома.","s":"Все думали, что он уехал, {а} он сидел дома.","tr":"Everyone thought he'd left, but he was sitting at home."},{"c":"no","lv":"B1","a":"Я звонил тебе.","b":"Ты не ответил.","s":"Я звонил тебе, {но} ты не ответил.","tr":"I called you, but you didn't answer."},{"c":"no","lv":"B1","a":"Кафе маленькое.","b":"Там очень уютно.","s":"Кафе маленькое, {но} там очень уютно.","tr":"The café is small but very cosy."},{"c":"odnako","lv":"B2","a":"Мы ждали ответа неделю.","b":"Его так и не было.","s":"Мы ждали ответа неделю, {однако} его так и не было.","alts":["Мы ждали ответа неделю. Однако его так и не было."],"tr":"We waited a week for a reply; however, none came."},{"c":"zato","lv":"B1","a":"Квартира далеко от центра.","b":"Она большая и светлая.","s":"Квартира далеко от центра, {зато} большая и светлая.","alts":["Квартира далеко от центра, но зато большая и светлая."],"tr":"The flat is .","b":"Нам не хватает времени, денег и людей.","s":"Нам не хватает трёх вещей, {а} {именно} времени, денег и людей.","alts":["Нам не хватает трёх вещей, а именно: времени, денег и людей."],"tr":"We are short of three things, namely time, money and people."},{"c":"kstati","lv":"B1","a":"Я видел Олю.","b":"Она передавала тебе привет.","s":"Я видел Олю, {кстати,} она передавала тебе привет.","alts":["Я видел Олю. Кстати, она передавала тебе привет."],"tr":"I saw Olya — by the way, she says hi."},{"c":"voobshe","lv":"B2","a":"Ты говоришь, он грубый.","b":"Он нормальный парень.","s":"Ты говоришь, он грубый, а {вообще-то} он нормальный парень.","tr":"You say he's rude, but actually he's a decent guy."},{"c":"koroche","lv":"B1","a":"Мы долго спорили.","b":"Мы решили ехать на море.","s":"Мы долго спорили, {короче,} решили ехать на море.","alts":["Мы долго спорили. Короче, решили ехать на море."],"tr":"We argued for ages — anyway, we decided to go to the seaside."},{"c":"v_smysle","lv":"B2","a":"Он у нас больше не работает.","b":"Его уволили.","s":"Он у нас больше не работает, {в} {смысле,} его уволили.","tr":"He doesn't work here any more — I mean, he got fired."}],"ui":{"practise":"Practise","learn":"Learn","mode":"Mode","comb":"Combine two sentences","build":"Build from blocks","pick":"Pick the connector","filters":"Filters","level":"Level","register":"Register","help":"Help","showTr":"Show translation","hideTr":"No translation","allCats":"All connectors","sentences":"sentences","notYet":"Not yet right","practiseThis":"Practise this one","back":"Back","joinWith":"Join the two sentences with","typeHere":"Type the combined sentence","buildWith":"Build the sentence with","decoyNote":"two blocks are wrong connectors","check":"Check","clear":"Clear","show":"Show","skip":"Skip","notQuite":"Not quite","missing":"{n} word(s) missing or different.","tryAgain":"Green is right, red does not belong. Try again or tap Show.","buildBad":"Green blocks are in the right place. Tap a block to send it back.","firstTry":"Right first time","right":"Right","hereItIs":"Here it is","alsoRight":"Also right","next":"Next","finish":"Finish","firstTryCount":"right first time","againWrong":"Practise the {n} again","more":"Another 10"},"title":"Русский · Связки — connectors","label":"Связки","eyebrow":"Русский · B1–C1 · разговорный","h1":"Связки <span style=\"font-weight:400\">· connectors</span>","lede":"Everyday spoken Russian: join two sentences with the right connector, build the sentence from blocks, or pick the connector that fits."};
const C=CFG,HAN=!!C.han;
const LSK='conn-'+C.lang+'-v1';
const S=(()=>{try{return JSON.parse(localStorage.getItem(LSK))||{}}catch(e){return {}}})();
S.opt=Object.assign({mode:'comb',lv:C.levels.slice(),reg:Object.keys(C.regs),show:true,auto:true},S.opt||{});
S.res=S.res||{};S.tab=S.tab||'prac';
function save(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
$('eyebrow').textContent=C.eyebrow;$('h1').innerHTML=C.h1;$('lede').textContent=C.lede;document.title=C.title;
const CONN={};C.conns.forEach(c=>CONN[c.id]=c);
const PUN=/^[，。、？！：；“”‘’《》（）…—,.?!:;"'()«»„“\-–]+$/;
/* tokens of a model sentence: {t:text, k:is connector} */
function toks(s){const out=[];s.trim().split(/\s+/).forEach(w=>{const m=w.match(/^\{([^}]*['’])\}(.+)$/);
    if(m){out.push({t:m[1],k:true,g:true});out.push({t:m[2],k:false});return}
    const k=/^\{.*\}[^\s]*$|^[^\s]*\{.*\}$/.test(w);out.push({t:w.replace(/[{}]/g,''),k})});return out}
const join=ts=>HAN?ts.map(t=>t.t).join(''):ts.map((t,i)=>t.t+(i<ts.length-1&&!/['’]$/.test(t.t)?' ':'')).join('').replace(C.lang==='fr'?/\s+([,.)])/g:/\s+([,.;:!?»)])/g,'$1').replace(/([«(„])\s+/g,'$1');
const plain=s=>join(toks(s));
function norm(s){s=String(s).normalize('NFC').toLowerCase().replace(/[{}]/g,'').replace(/ё/g,'е').replace(/[’‘`]/g,"'");
  s=s.replace(/[^\p{L}\p{N}']+/gu,' ').replace(/'\s+/g,"'").trim();return HAN?s.replace(/\s+/g,''):s.replace(/\s+/g,' ')}
const ITEMS=C.items.map((x,i)=>{const T=toks(x.s);T.forEach((t,k)=>t.p=(x.tp||[])[k]||'');return Object.assign({i,T},x)}).filter(x=>CONN[x.c]);
const answers=it=>[plain(it.s)].concat((it.alts||[]).map(plain));
const rk=(it,m)=>it.i+':'+m;

/* ---------- audio for sentences from the listening courses ---------- */
const au=$('au');let stopAt=0,curSrc='';
function playClip(it,btn){if(!it.clip)return;const [u,s,e]=it.clip;if(curSrc!==u){au.src=u;curSrc=u}
  const go=()=>{try{au.currentTime=Math.max(0,s-0.1)}catch(x){}stopAt=e+0.3;const p=au.play();if(p&&p.catch)p.catch(()=>{});if(btn)btn.classList.add('on')};
  if(au.readyState>=1)go();else{au.addEventListener('loadedmetadata',go,{once:true});au.load()}}
au.addEventListener('timeupdate',()=>{if(stopAt&&au.currentTime>=stopAt){au.pause();stopAt=0}});
au.addEventListener('pause',()=>document.querySelectorAll('.pb.on').forEach(b=>b.classList.remove('on')));

/* ---------- filters ---------- */
function pool(f){return ITEMS.filter(it=>{const c=CONN[it.c];if(!S.opt.lv.includes(it.lv||c.lv))return false;if(!S.opt.reg.includes(c.reg))return false;
  if(S.opt.mode==='comb'&&!(it.a&&it.b))return false;if(f&&f.cat&&c.cat!==f.cat)return false;if(f&&f.c&&it.c!==f.c)return false;return true})}
function stats(list){let m=0;list.forEach(it=>{if(S.res[rk(it,S.opt.mode)]===2)m++});return m}
const MODES={comb:['🔗',C.ui.comb],build:['🧩',C.ui.build],pick:['❓',C.ui.pick]};
const tags=c=>`<span class="tag">${esc(c.lv)}</span>${c.reg!=='n'?`<span class="tag reg-${c.reg}">${esc(C.regs[c.reg])}</span>`:''}`;

function home(){R=null;au.pause();document.body.classList.remove('inround');
  let h=`<div class="seg" role="tablist"><button role="tab" data-t="prac" aria-selected="${S.tab==='prac'}">${esc(C.ui.practise)}</button><button role="tab" data-t="learn" aria-selected="${S.tab==='learn'}">${esc(C.ui.learn)} · ${C.conns.length}</button></div>`;
  h+=optsHTML();
  if(S.tab==='learn')h+=learnHTML();else h+=pracHTML();
  $('app').innerHTML=h;
  $('app').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();home()});
  bindOpts();
  $('app').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>start(b.dataset.cat==='*'?{}:{cat:b.dataset.cat}));
  $('app').querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>start({c:b.dataset.pc}));
  const mi=$('miss');if(mi)mi.onclick=()=>{const L=pool({}).filter(it=>{const r=S.res[rk(it,S.opt.mode)];return r!=null&&r<2});start({list:L})};
  scrollTo(0,0)}
function optsHTML(){const o=S.opt;const c=(k,v,l,on)=>`<button class="chip" type="button" data-o="${k}" data-v="${v}" aria-pressed="${on}">${l}</button>`;
  return `<div class="opts"><span class="lab">${esc(C.ui.mode)}</span>${Object.entries(MODES).map(([k,[i,l]])=>c('mode',k,i+' '+esc(l),o.mode===k)).join('')}</div>
  <details class="cfg" id="cfg"${S.cfgOpen?' open':''}><summary>⚙︎ ${esc(C.ui.filters)} <small>${o.lv.join(' ')} · ${o.reg.map(r=>C.regs[r]).join(', ')}</small></summary>
  <div class="opts"><span class="lab">${esc(C.ui.level)}</span>${C.levels.map(l=>c('lv',l,l,o.lv.includes(l))).join('')}</div>
  <div class="opts"><span class="lab">${esc(C.ui.register)}</span>${Object.entries(C.regs).map(([k,l])=>c('reg',k,esc(l),o.reg.includes(k))).join('')}</div>
  <div class="opts"><span class="lab">${esc(C.ui.help)}</span>${c('show',true,esc(C.ui.showTr),o.show)}${c('show',false,esc(C.ui.hideTr),!o.show)}</div></details>`}
function bindOpts(){const cf=$('cfg');if(cf)cf.addEventListener('toggle',()=>{S.cfgOpen=cf.open;save()});
  $('app').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const k=b.dataset.o,v=b.dataset.v;
    if(k==='lv'||k==='reg'){const a=S.opt[k];const i=a.indexOf(v);if(i>=0){if(a.length>1)a.splice(i,1)}else a.push(v)}
    else S.opt[k]=v==='true'?true:v==='false'?false:v;save();home()})}
function pracHTML(){const all=pool({});const miss=all.filter(it=>{const r=S.res[rk(it,S.opt.mode)];return r!=null&&r<2}).length;
  let h=`<div class="special"><button class="set" type="button" data-cat="*" style="grid-template-columns:minmax(0,1fr) auto"><span class="t">${esc(C.ui.allCats)}<small>${all.length} ${esc(C.ui.sentences)}</small></span><span class="sc"><b>${stats(all)}</b>/${all.length} ✓</span></button></div>
  <div class="special" style="margin-top:8px"><button class="btn" id="miss" type="button" ${miss?'':'disabled'}>↺ ${esc(C.ui.notYet)} (${miss})</button></div><div class="sets" style="margin-top:12px">`;
  Object.entries(C.cats).forEach(([k,l])=>{const L=pool({cat:k});if(!L.length)return;const m=stats(L);const cs=C.conns.filter(c=>c.cat===k&&pool({c:c.id}).length).map(c=>c.f);
    h+=`<button class="set" type="button" data-cat="${k}" style="grid-template-columns:minmax(0,1fr) auto"><span class="t">${esc(l)}<small>${esc(cs.slice(0,7).join(' · '))}${cs.length>7?' …':''}</small></span><span class="sc">${m?`<b>${m}</b>/`:''}${L.length}</span><span class="bar"><i style="width:${Math.round(100*m/L.length)}%"></i></span></button>`});
  return h+'</div>'}
function learnHTML(){let h='<div class="cat">';
  Object.entries(C.cats).forEach(([k,l])=>{const cs=C.conns.filter(c=>c.cat===k&&S.opt.lv.includes(c.lv)&&S.opt.reg.includes(c.reg));if(!cs.length)return;
    h+=`<h2>${esc(l)}</h2><div class="cl">`+cs.map(c=>{const ex=ITEMS.find(it=>it.c===c.id&&it.src!=='l'),n=pool({c:c.id}).length;
      return `<div class="cn"><div><span class="f">${esc(c.f)}</span>${tags(c)}</div><div class="m">${esc(c.m)}</div>${c.nt?`<div class="nt">${esc(c.nt)}</div>`:''}${ex?`<div class="ex">${esc(plain(ex.s))}</div>`:''}
        ${n?`<div class="row"><button class="btn" type="button" data-pc="${esc(c.id)}">${MODES[S.opt.mode][0]} ${esc(C.ui.practiseThis)} (${n})</button></div>`:''}</div>`}).join('')+'</div>'});
  return h+'</div>'}

/* ---------- rounds ---------- */
let R=null;
function start(f){let L=f.list||pool(f);if(!L.length)return;
  const fresh=L.filter(it=>S.res[rk(it,S.opt.mode)]!==2);L=shuffle(fresh.length>=10?fresh:fresh.concat(shuffle(L.filter(it=>!fresh.includes(it))))).slice(0,10);
  R={items:shuffle(L),k:0,log:[],f};document.body.classList.add('inround');item()}
function head(it){const c=CONN[it.c],pct=Math.round(100*R.k/R.items.length);
  return `<button class="back" type="button" id="bk">← ${esc(C.ui.back)}</button><div class="card">
   <div class="prog"><span>${R.k+1} / ${R.items.length}</span><span class="pbar"><i style="width:${pct}%"></i></span><span>${MODES[S.opt.mode][0]}</span></div>`}
function trLine(it){return S.opt.show&&it.tr?`<div class="prompt-en" style="font-size:15px">${esc(it.tr)}</div>`:''}
function item(){const it=R.items[R.k];R.cur={it,tries:0,done:false};const m=S.opt.mode;
  let h=head(it);const c=CONN[it.c];
  if(m==='comb'){h+=`<div class="ab"><div><b>1</b>${esc(it.a)}</div><div><b>2</b>${esc(it.b)}</div></div>
     <div class="use">${esc(C.ui.joinWith)} <b>${esc(c.f)}</b>${tags(c)}${it.task?` · ${esc(it.task)}`:''}</div>${trLine(it)}
     <textarea id="ta" placeholder="${esc(C.ui.typeHere)}" autocomplete="off" spellcheck="false" lang="${C.lang}"></textarea>`}
  if(m==='build'){const T=it.T.filter(t=>!(HAN&&PUN.test(t.t)));R.cur.T=T;
    const dec=decoys(it,T);const tiles=shuffle(T.map((t,i)=>({t:t.t,i,p:t.p})).concat(dec.map((t,j)=>({t,i:-1-j,p:''}))));R.cur.tiles=tiles;R.cur.placed=[];
    h+=`${it.clip?`<div class="play"><button class="pb" id="pl" type="button" aria-label="Play"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg></button><span class="src">🎧 ${esc(it.srcl||'')}</span></div>`:''}
      <div class="use">${esc(C.ui.buildWith)} <b>${esc(c.f)}</b>${tags(c)} <span class="ch-hint">· ${esc(C.ui.decoyNote)}</span></div>${trLine(it)}${it.py&&S.opt.show?`<div class="pyhint">${esc(it.py)}</div>`:''}
      <div class="ans empty" id="ans"></div><div class="bank" id="bank">${tiles.map((x,j)=>`<button class="tile" type="button" data-j="${j}"${x.p?` data-py="${esc(x.p)}"`:''}>${esc(x.t)}</button>`).join('')}</div>`}
  if(m==='pick'){const g=gapOf(it);R.cur.g=g;
    h+=`${it.clip?`<div class="play"><button class="pb" id="pl" type="button" aria-label="Play"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg></button></div>`:''}
      <div class="gapq">${g.html}</div>${trLine(it)}<div class="opts ch">${g.opts.map((o,j)=>`<button class="opt" type="button" data-j="${j}">${esc(o.label)}</button>`).join('')}</div>`}
  h+=`<div id="fb"></div><div class="row" id="acts">${m!=='pick'?`<button class="btn pri" id="ck" type="button">${esc(C.ui.check)}</button>`:''}${m==='build'?`<button class="btn" id="cl" type="button">${esc(C.ui.clear)}</button>`:''}<button class="btn" id="sh" type="button">${esc(C.ui.show)}</button><span class="sp"></span><button class="btn" id="sk" type="button">${esc(C.ui.skip)} →</button></div></div>`;
  $('app').innerHTML=h;$('bk').onclick=home;$('sh').onclick=()=>finish(0);$('sk').onclick=()=>{R.log.push([it,null]);next()};
  if($('ck'))$('ck').onclick=check;if($('pl')){$('pl').onclick=()=>playClip(it,$('pl'));if(S.opt.auto)setTimeout(()=>playClip(it,$('pl')),250)}
  if(m==='comb'){const ta=$('ta');ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();R.cur.done?next():check()}});setTimeout(()=>{try{ta.focus({preventScroll:true})}catch(e){}},50)}
  if(m==='build'){$('bank').querySelectorAll('.tile').forEach(b=>b.onclick=()=>place(+b.dataset.j));$('cl').onclick=()=>{R.cur.placed=[];draw()}}
  if(m==='pick')document.querySelectorAll('.opts.ch .opt').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
  scrollTo(0,0)}
/* wrong connectors as extra blocks */
function decoys(it,T){const ks=T.filter(t=>t.k);if(!ks.length)return [];const cap=/^\p{Lu}/u.test(ks[0].t);const mine=CONN[it.c];
  const others=shuffle(C.conns.filter(c=>c.cat!==mine.cat&&c.id!==it.c));const out=[];
  /* single words look like any other block, so prefer one-word connectors */
  others.sort((x,y)=>(x.f.trim().split(/\s+/).length>1)-(y.f.trim().split(/\s+/).length>1));
  for(const c of others){const w=c.f.split(/\s*(?:…|\.\.\.|\/)\s*/)[0].trim().replace(/,$/,'');if(!w||(!HAN&&/\s/.test(w))||out.includes(w)||T.some(t=>norm(t.t)===norm(w)))continue;
    out.push(!HAN&&cap?w.charAt(0).toUpperCase()+w.slice(1):w);if(out.length===2)break}
  return out}
function place(j){const c=R.cur;if(c.done||c.placed.includes(j))return;c.placed.push(j);$('fb').innerHTML='';draw()}
function draw(){const c=R.cur,a=$('ans');a.innerHTML=c.placed.map((j,p)=>`<button class="tile" type="button" data-p="${p}">${esc(c.tiles[j].t)}</button>`).join('');a.classList.toggle('empty',!c.placed.length);
  a.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(c.done)return;c.placed.splice(+b.dataset.p,1);$('fb').innerHTML='';draw()});
  $('bank').querySelectorAll('.tile').forEach(b=>b.classList.toggle('used',c.placed.includes(+b.dataset.j)))}
function gapOf(it){const T=it.T;const parts=T.map(t=>t.k);const n=new Set();let html='',inGap=false,gapTxt=[];const segs=[];let cur=[];
  T.forEach((t,i)=>{if(t.k){if(!inGap){inGap=true;cur=[]}cur.push(t.t)}else{if(inGap){segs.push(cur.join(' '));inGap=false}}});if(inGap)segs.push(cur.join(' '));
  let first=true;const outT=[];let inG=false;T.forEach(t=>{if(t.k){if(!inG){outT.push({t:'<span class="gp">___</span>',raw:1});inG=true}}else{inG=false;outT.push({t:esc(t.t)})}});
  html=HAN?outT.map(x=>x.t).join(''):outT.map(x=>x.t).join(' ').replace(/\s+([,.;:!?»)])/g,'$1');
  const right=segs.join(' … ');const mine=CONN[it.c];
  const pool2=shuffle(C.conns.filter(c=>c.cat!==mine.cat&&c.id!==it.c)).map(c=>{const p=c.f.split('/')[0].trim();return p}).filter(p=>(p.split('…').length>1)===(segs.length>1)&&norm(p)!==norm(right));
  const ds=[];for(const p of pool2){if(!ds.includes(p))ds.push(p);if(ds.length===3)break}
  const opts=shuffle([{label:right,ok:true}].concat(ds.map(d=>({label:/^\p{Lu}/u.test(right)&&!HAN?d.charAt(0).toUpperCase()+d.slice(1):d,ok:false}))));
  return {html,opts}}
function pick(j){const c=R.cur;if(c.done)return;const o=c.g.opts[j];const B=document.querySelectorAll('.opts.ch .opt');
  if(o.ok){B[j].classList.add('ok');return finish(c.tries===0?2:1)}c.tries++;B[j].classList.add('bad');B[j].disabled=true}
function lcsDiff(u,t){const n=u.length,m=t.length,d=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=u[i]===t[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ia=new Set(),ib=new Set();let i=0,j=0;while(i<n&&j<m){if(u[i]===t[j]){ia.add(i);ib.add(j);i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return {ia,ib,score:ia.size/Math.max(n,m,1)}}
const units=s=>HAN?[...norm(s)]:norm(s).split(' ').filter(Boolean);
function check(){const c=R.cur,it=c.it;if(c.done)return;
  if(S.opt.mode==='comb'){const v=$('ta').value.trim();if(!v)return;const nv=norm(v);const A=answers(it);
    if(A.some(a=>norm(a)===nv))return finish(c.tries===0?2:1);c.tries++;
    let best=null;A.forEach(a=>{const r=lcsDiff(units(v),units(a));if(!best||r.score>best.r.score)best={a,r}});
    const u=units(v),t=units(best.a);const sep=HAN?'':' ';
    const yours=u.map((w,k)=>best.r.ia.has(k)?`<span class="g">${esc(w)}</span>`:`<span class="x">${esc(w)}</span>`).join(sep);
    const miss=t.length-best.r.ib.size;
    $('fb').innerHTML=`<div class="fb bad"><span class="v">${esc(C.ui.notQuite)}</span><div class="han">${yours}</div><div class="small">${miss?esc(C.ui.missing.replace('{n}',miss))+' ':''}${esc(C.ui.tryAgain)}</div></div>`;return}
  if(S.opt.mode==='build'){if(!c.placed.length)return;const built=c.placed.map(j=>c.tiles[j].t);const txt=HAN?built.join(''):built.join(' ');
    const ok=answers(it).some(a=>norm(a)===norm(txt))&&c.placed.length===c.T.length;
    if(ok)return finish(c.tries===0?2:1);c.tries++;
    const T=c.T;$('ans').querySelectorAll('.tile').forEach((b,p)=>b.classList.add(T[p]&&norm(T[p].t)===norm(built[p])?'ok':'bad'));
    $('fb').innerHTML=`<div class="fb bad"><span class="v">${esc(C.ui.notQuite)}</span><span class="small">${esc(C.ui.buildBad)}</span></div>`}}
function finish(g){const c=R.cur,it=c.it;if(c.done)return;c.done=true;S.res[rk(it,S.opt.mode)]=g;save();R.log.push([it,g]);
  const cn=CONN[it.c];const A=answers(it);
  if(S.opt.mode==='build'){c.placed=c.T.map(t=>c.tiles.findIndex((x,j)=>x.t===t.t&&!0)).filter(j=>j>=0);
    const used=new Set();c.placed=c.T.map(t=>{const j=c.tiles.findIndex((x,jj)=>x.t===t.t&&!used.has(jj));used.add(j);return j});draw();$('ans').querySelectorAll('.tile').forEach(b=>b.classList.add(g?'ok':'given'))}
  if(S.opt.mode==='pick'){document.querySelectorAll('.opts.ch .opt').forEach((b,j)=>{if(c.g.opts[j].ok)b.classList.add('ok');b.disabled=true})}
  if(S.opt.mode==='comb')$('ta').readOnly=true;
  $('fb').innerHTML=`<div class="fb ${g?'ok':'bad'}"><span class="v">${g===2?'✓ '+esc(C.ui.firstTry):g===1?'✓ '+esc(C.ui.right):esc(C.ui.hereItIs)}</span>
    <div class="han">${esc(A[0])}</div>${(()=>{const seen=new Set([norm(A[0])]);const B=A.slice(1).filter(x=>{const k=norm(x);if(seen.has(k))return false;seen.add(k);return true});return B.length?`<div class="small">${esc(C.ui.alsoRight)}: ${B.map(esc).join(' · ')}</div>`:''})()}
    ${it.tr?`<div class="en">${esc(it.tr)}</div>`:''}<div class="small"><b>${esc(cn.f)}</b> — ${esc(cn.m)}${cn.nt?'. '+esc(cn.nt):''}</div></div>`;
  $('acts').innerHTML=`${it.clip?`<button class="btn" id="pl2" type="button">🔊</button>`:''}<span class="sp"></span><button class="btn pri" id="nx" type="button">${R.k+1<R.items.length?esc(C.ui.next)+' →':esc(C.ui.finish)}</button>`;
  if($('pl2'))$('pl2').onclick=()=>playClip(it,$('pl'));$('nx').onclick=next;setTimeout(()=>{try{$('nx').focus({preventScroll:true})}catch(e){}},30)}
function next(){R.k++;if(R.k<R.items.length)item();else summary()}
function summary(){const L=R.log,f=L.filter(x=>x[1]===2).length;const wrong=L.filter(x=>x[1]!==2).map(x=>x[0]);const ff=R.f;
  $('app').innerHTML=`<button class="back" type="button" id="bk">← ${esc(C.ui.back)}</button><div class="card"><div class="done"><div class="big">${f}/${L.length}</div><div>${esc(C.ui.firstTryCount)}</div>
   <div class="row" style="justify-content:center">${wrong.length?`<button class="btn pri" id="aw" type="button">${esc(C.ui.againWrong.replace('{n}',wrong.length))}</button>`:''}<button class="btn" id="more" type="button">${esc(C.ui.more)}</button></div>
   <div class="mini">${L.map(([it,g])=>`<div><span class="mk ${g===2?'g1':g===1?'gh':'g0'}">${g===2?'✓':g===1?'~':g===0?'✗':'–'}</span><span>${esc(plain(it.s))}</span></div>`).join('')}</div></div></div>`;
  $('bk').onclick=home;if(wrong.length)$('aw').onclick=()=>start({list:wrong});$('more').onclick=()=>start(ff)}
home();
</script>
