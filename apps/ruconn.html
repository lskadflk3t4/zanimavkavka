<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connectors</title>
<style>
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--ink:#1B2421;--muted:#5D6B66;--line:#D8E0DC;
  --jade:#2B7A5E;--jade-soft:#E1EFE9;--seal:#B5442F;--seal-soft:#F7E5E0;--gold:#9A6A12;--gold-soft:#F6ECD6;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-han:"Noto Serif SC","Songti SC","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715;--surface:#19211F;--ink:#E3EBE7;--muted:#93A39C;--line:#2B3632;
  --jade:#62C39C;--jade-soft:#1D3229;--seal:#E58169;--seal-soft:#3A221D;--gold:#E0B357;--gold-soft:#3A2F17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111715;--surface:#19211F;--ink:#E3EBE7;--muted:#93A39C;--line:#2B3632;
  --jade:#62C39C;--jade-soft:#1D3229;--seal:#E58169;--seal-soft:#3A221D;--gold:#E0B357;--gold-soft:#3A2F17;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 90px}
header.top{padding:22px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-read);font-weight:600;font-size:clamp(22px,5vw,30px);line-height:1.2;margin:2px 0 4px}
h1 .zh{font-family:var(--f-han)}
.lede{color:var(--muted);margin:0 0 6px;max-width:60ch}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 14px;overflow-x:auto;scrollbar-width:none}
.seg button{appearance:none;border:0;background:none;font-weight:600;color:var(--muted);padding:10px 12px 9px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;min-height:44px}
.seg button[aria-selected="true"]{color:var(--jade);border-bottom-color:var(--jade)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.opts .lab{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:64px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--jade)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
h2{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade);margin:22px 0 8px;font-weight:700}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;width:100%}
.set:hover{border-color:var(--jade)}
.set .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);line-height:1.2}
.set .no b{display:block;font-family:var(--f-han);font-size:15px;color:var(--jade);font-weight:600}
.set .t{font-weight:600;line-height:1.3}
.set .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.set .sc{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.set .sc b{color:var(--jade)}
.bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade)}
.special{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 22px -18px rgba(0,0,0,.4)}
.prog{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
.prog .pbar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .pbar i{display:block;height:100%;background:var(--jade);transition:width .25s}
.play{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb{width:52px;height:52px;border-radius:50%;border:0;background:var(--jade);color:var(--bg);cursor:pointer;display:grid;place-items:center;flex:none}
.pb svg{width:20px;height:20px;fill:currentColor}
.pb.on{box-shadow:0 0 0 5px var(--jade-soft)}
.small{font-size:13px;color:var(--muted)}
.prompt-en{font-family:var(--f-read);font-size:17px;line-height:1.4}
.prompt-en.off{color:var(--muted);font-style:italic;font-size:14px;font-family:var(--f-ui)}
.pyhint{color:var(--jade);font-size:14px}
.ans{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.ans.empty::before{content:"Tap the blocks in order";color:var(--muted);font-size:13.5px;padding:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tile{font-family:var(--f-han);font-size:19px;line-height:1.2;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 11px;cursor:pointer;min-height:44px;min-width:44px;user-select:none;box-shadow:0 1px 0 var(--line)}
.tile:hover{border-color:var(--jade)}
.tile.used{visibility:hidden}
.tile.ok{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.tile.bad{background:var(--seal-soft);border-color:var(--seal);color:var(--seal)}
.tile.given{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-family:var(--f-han);font-size:20px;line-height:1.5;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.fb.ok{background:var(--jade-soft)}
.fb.bad{background:var(--seal-soft)}
.fb .v{font-weight:700}
.fb.ok .v{color:var(--jade)}.fb.bad .v{color:var(--seal)}
.han{font-family:var(--f-han);font-size:20px;line-height:1.55}
.han .m{color:var(--seal);text-decoration:underline wavy;text-underline-offset:4px}
.han .x{color:var(--seal);text-decoration:line-through}
.han .g{color:var(--jade)}
.han .tw{color:var(--gold);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.fb .py{color:var(--jade);font-size:14px}
.fb .en{color:var(--muted);font-size:14px}
.done{text-align:center;padding:26px 10px;display:grid;gap:10px;justify-items:center}
.done .big{font-family:var(--f-read);font-size:40px;color:var(--jade);line-height:1}
.mini{display:grid;gap:6px;text-align:left;width:100%;margin-top:8px}
.mini div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px}
.mini .han{font-size:16px}
.mk{font-weight:700}.mk.g1{color:var(--jade)}.mk.g0{color:var(--seal)}.mk.gh{color:var(--gold)}
.back{border:0;background:none;color:var(--jade);font-weight:600;cursor:pointer;padding:6px 0;min-height:40px}
.note{font-size:12.5px;color:var(--muted)}
.ab{display:grid;gap:6px}
.ab div{font-family:var(--f-read);font-size:17px;line-height:1.45;background:var(--bg);border-radius:10px;padding:9px 12px}
.ab b{font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-right:6px}
.use{font-size:14px}.use b{color:var(--seal);font-size:16px}
.gapq{font-family:var(--f-read);font-size:19px;line-height:1.5}
.gapq .gp{display:inline-block;min-width:70px;border-bottom:2px solid var(--seal);color:var(--seal);text-align:center;font-weight:700}
.opts.ch{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opts.ch .opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:16px;min-height:48px;text-align:left}
.opts.ch .opt.ok{border-color:var(--jade);background:var(--jade-soft)}.opts.ch .opt.bad{border-color:var(--seal);background:var(--seal-soft)}
.cl{display:grid;gap:8px}
.cn{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:4px}
.cn .f{font-weight:700;font-size:17px;color:var(--jade)}
.cn .m{font-size:14.5px}.cn .nt{font-size:13.5px;color:var(--muted)}
.cn .ex{font-family:var(--f-read);font-size:15px;border-left:3px solid var(--line);padding-left:9px}
.tag{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--muted);vertical-align:2px}
.tag.reg-c{color:#9A6A12;border-color:#9A6A12}.tag.reg-e{color:#2E5FA8;border-color:#2E5FA8}.tag.reg-l{color:#7B3FA0;border-color:#7B3FA0}
.cn .row{gap:6px}
.lvbar{display:flex;gap:6px;flex-wrap:wrap}
.cat h2{margin-top:18px}
.src{font-size:12px;color:var(--muted)}
.ch-hint{font-size:13px;color:var(--muted)}

body.inround header.top{display:none}body.inround .wrap{padding-top:8px}
.cfg{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:0 0 12px}
.cfg>summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:600;min-height:44px}
.cfg>summary::-webkit-details-marker{display:none}
.cfg>summary small{font-weight:400;color:var(--muted);margin-left:6px}
.cfg[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.cfg .opts{padding:0 12px}
.ftok{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;margin:3px 1px;cursor:pointer;font-family:var(--f-read);font-size:18px;min-height:42px;color:var(--ink)}
:lang(zh) .ftok{font-family:var(--f-han);font-size:20px}
.ftok.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.ftok.bad{border-color:var(--seal);background:var(--seal-soft);color:var(--seal)}
.ftok.err{border-color:var(--seal);color:var(--seal);text-decoration:underline wavy;text-underline-offset:4px}
.fixs{line-height:1.3}
.chip.cok{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.chip.cbad{background:var(--seal-soft);border-color:var(--seal);color:var(--seal)}
.chip.cno{opacity:.55;text-decoration:line-through}
.tin{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:20px;min-height:48px;font-family:var(--f-read)}
:lang(zh) .tin{font-family:var(--f-han)}
@media (max-width:480px){.tile{font-size:18px;padding:7px 9px}.han{font-size:18px}textarea{font-size:18px}}
</style></head><body>
<div class="wrap">
<header class="top" id="hd">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
</header>
<div id="app"></div>
</div>
<audio id="au" preload="none"></audio>
<script>
const CFG={"lang":"ru","han":false,"levels":["B1","B2","C1"],"regs":{"c":"colloquial","n":"neutral","e":"formal","l":"literary"},"cats":{"cause":"Причина · Cause","cons":"Следствие · Consequence","conc":"Уступка · Concession","contr":"Противопоставление · Contrast","cond":"Условие · Condition","purp":"Цель · Purpose","time":"Время · Time","add":"Перечисление и добавление · Adding & pairing","comp":"Сравнение · Comparison","expl":"Пояснение · Explaining & rephrasing"},"conns":[{"id":"potomu","f":"потому что","cat":"cause","reg":"n","lv":"B1","m":"because — the everyday default","nt":"The reason comes second: главное, потому что + причина."},{"id":"tak_kak","f":"так как","cat":"cause","reg":"n","lv":"B1","m":"as, since — a bit more formal than потому что","nt":"The clause can come first: Так как …, …"},{"id":"poskolku","f":"поскольку","cat":"cause","reg":"e","lv":"B2","m":"since, inasmuch as — written, official","nt":"Typical of reports and explanations."},{"id":"ved","f":"ведь","cat":"cause","reg":"c","lv":"B1","m":"after all, you know — gives a reason the listener should already know","nt":"No comma before ведь inside the clause; it usually follows a comma or starts the sentence."},{"id":"raz","f":"раз","cat":"cause","reg":"c","lv":"B2","m":"since, seeing that — the reason is a fact both people accept","nt":"Раз ты пришёл, помоги. Often followed by то."},{"id":"iz_za","f":"из-за того что","cat":"cause","reg":"n","lv":"B1","m":"because (of the fact that) — usually a bad reason","nt":"Positive reasons use благодаря тому что."},{"id":"blagodarya","f":"благодаря тому что","cat":"cause","reg":"n","lv":"B2","m":"thanks to the fact that — a good reason","nt":""},{"id":"tem_bolee","f":"тем более что","cat":"cause","reg":"n","lv":"B2","m":"especially as, all the more so as","nt":"Adds an extra reason that strengthens the point."},{"id":"delo","f":"дело в том, что","cat":"cause","reg":"c","lv":"B2","m":"the thing is (that)","nt":"Opens an explanation; often after a question."},{"id":"a_to","f":"а то","cat":"cause","reg":"c","lv":"B1","m":"otherwise / or else; also \"because otherwise\"","nt":"Very colloquial: Одевайся теплее, а то замёрзнешь."},{"id":"poetomu","f":"поэтому","cat":"cons","reg":"n","lv":"B1","m":"so, that's why","nt":"Starts the second clause after a comma or full stop."},{"id":"tak_chto","f":"так что","cat":"cons","reg":"c","lv":"B1","m":"so (as a result)","nt":"Never at the start of a sentence in this meaning."},{"id":"vot_i","f":"вот и","cat":"cons","reg":"c","lv":"B2","m":"so, and that's why (looking back at a result)","nt":"Вот и + verb: Проспал, вот и опоздал."},{"id":"znachit","f":"значит","cat":"cons","reg":"c","lv":"B1","m":"so, that means","nt":"Drawing a conclusion from what was just said."},{"id":"v_rezultate","f":"в результате (чего)","cat":"cons","reg":"n","lv":"B2","m":"as a result","nt":""},{"id":"sledovatelno","f":"следовательно","cat":"cons","reg":"e","lv":"C1","m":"consequently, therefore","nt":"Written and logical style."},{"id":"tak_chto_daje","f":"настолько …, что","cat":"cons","reg":"n","lv":"B2","m":"so (much) … that","nt":"Настолько устал, что уснул в метро."},{"id":"hotya","f":"хотя","cat":"conc","reg":"n","lv":"B1","m":"although","nt":"Хотя + fact, main clause. The main clause often gets но or всё равно in speech."},{"id":"hot","f":"хоть","cat":"conc","reg":"c","lv":"B1","m":"although (spoken form of хотя); also \"at least\"","nt":"Хоть и + verb is very common: Хоть и дорого, но вкусно."},{"id":"nesmotrya","f":"несмотря на то что","cat":"conc","reg":"n","lv":"B2","m":"despite the fact that","nt":"No comma inside the conjunction when it opens the sentence."},{"id":"vse_ravno","f":"всё равно","cat":"conc","reg":"c","lv":"B1","m":"anyway, still","nt":"In the main clause after хотя / даже если."},{"id":"pust","f":"пусть (даже)","cat":"conc","reg":"c","lv":"B2","m":"even if, let it be that","nt":"Пусть дорого, зато качественно."},{"id":"kak_by_ni","f":"как бы ни","cat":"conc","reg":"e","lv":"C1","m":"however (much)","nt":"Как бы ни + verb in the past, ни is not a negation here."},{"id":"tem_ne_menee","f":"тем не менее","cat":"conc","reg":"e","lv":"B2","m":"nevertheless","nt":"Starts the second sentence or clause."},{"id":"dazhe_esli","f":"даже если","cat":"conc","reg":"n","lv":"B1","m":"even if","nt":""},{"id":"a","f":"а","cat":"contr","reg":"n","lv":"B1","m":"and / whereas / but — contrast between two different things","nt":"Я люблю чай, а он кофе."},{"id":"no","f":"но","cat":"contr","reg":"n","lv":"B1","m":"but — against expectation","nt":""},{"id":"odnako","f":"однако","cat":"contr","reg":"e","lv":"B2","m":"however","nt":"Formal; in speech но is normal."},{"id":"zato","f":"зато","cat":"contr","reg":"c","lv":"B1","m":"but on the other hand, but then","nt":"Introduces a compensation: Дорого, зато удобно."},{"id":"v_to_vremya","f":"в то время как","cat":"contr","reg":"e","lv":"B2","m":"whereas, while (contrast)","nt":"Also used for time in formal style."},{"id":"a_vot","f":"а вот","cat":"contr","reg":"c","lv":"B1","m":"but (as for …) — highlights the contrasting item","nt":"А вот мой брат …"},{"id":"naoborot","f":"наоборот","cat":"contr","reg":"n","lv":"B2","m":"on the contrary, the other way round","nt":"Often а наоборот / наоборот,."},{"id":"esli","f":"если","cat":"cond","reg":"n","lv":"B1","m":"if (real condition)","nt":"Если + future in the condition when it's about the future: Если будет время, зайду."},{"id":"esli_by","f":"если бы … , … бы","cat":"cond","reg":"n","lv":"B2","m":"if … would (unreal)","nt":"бы in both clauses, verb in the past form."},{"id":"v_sluchae","f":"в случае если","cat":"cond","reg":"e","lv":"B2","m":"in case, if","nt":"Official style; in speech just если."},{"id":"pri_uslovii","f":"при условии что","cat":"cond","reg":"e","lv":"C1","m":"provided that","nt":""},{"id":"inache","f":"иначе","cat":"cond","reg":"n","lv":"B1","m":"otherwise","nt":"Neutral; а то is the colloquial twin."},{"id":"lish_by","f":"лишь бы","cat":"cond","reg":"c","lv":"B2","m":"as long as, if only","nt":"Лишь бы + past / noun: Лишь бы не было дождя."},{"id":"kogda_by","f":"стоит (только) …, как","cat":"cond","reg":"c","lv":"C1","m":"as soon as you …, (immediately)","nt":"Стоит мне сесть, как звонит телефон."},{"id":"chtoby","f":"чтобы","cat":"purp","reg":"n","lv":"B1","m":"so that, in order to","nt":"Same subject → чтобы + infinitive; different subject → чтобы + past form."},{"id":"dlya_togo","f":"для того чтобы","cat":"purp","reg":"n","lv":"B2","m":"in order to","nt":"Stresses the purpose; can be split: для того, чтобы."},{"id":"s_tem","f":"с тем чтобы","cat":"purp","reg":"e","lv":"C1","m":"with a view to, in order to","nt":"Bookish."},{"id":"chtoby_ne","f":"чтобы не","cat":"purp","reg":"n","lv":"B2","m":"so as not to, so that … not","nt":"Usually with an imperfective verb."},{"id":"kogda","f":"когда","cat":"time","reg":"n","lv":"B1","m":"when","nt":""},{"id":"poka","f":"пока","cat":"time","reg":"n","lv":"B1","m":"while","nt":"Two actions at the same time."},{"id":"poka_ne","f":"пока не","cat":"time","reg":"n","lv":"B2","m":"until","nt":"The не is not a real negation: Подожди, пока он не придёт."},{"id":"kak_tolko","f":"как только","cat":"time","reg":"n","lv":"B1","m":"as soon as","nt":""},{"id":"posle_togo","f":"после того как","cat":"time","reg":"n","lv":"B2","m":"after","nt":""},{"id":"pered_tem","f":"перед тем как","cat":"time","reg":"n","lv":"B2","m":"before (just before)","nt":"+ infinitive when the subject is the same."},{"id":"do_togo","f":"до того как","cat":"time","reg":"n","lv":"B2","m":"before (some time before)","nt":""},{"id":"s_teh_por","f":"с тех пор как","cat":"time","reg":"n","lv":"B2","m":"since (time)","nt":""},{"id":"edva","f":"едва","cat":"time","reg":"l","lv":"C1","m":"hardly … when, as soon as","nt":"Literary: Едва он вошёл, как зазвонил телефон."},{"id":"kak_c","f":"как (= как только)","cat":"time","reg":"c","lv":"B2","m":"as soon as (spoken)","nt":"Как приеду, сразу позвоню."},{"id":"ne_tolko","f":"не только …, но и","cat":"add","reg":"n","lv":"B1","m":"not only … but also","nt":""},{"id":"i_i","f":"и … и","cat":"add","reg":"n","lv":"B1","m":"both … and","nt":""},{"id":"ni_ni","f":"ни … ни","cat":"add","reg":"n","lv":"B1","m":"neither … nor","nt":"The verb keeps its не: Я не люблю ни чай, ни кофе."},{"id":"to_to","f":"то … то","cat":"add","reg":"c","lv":"B2","m":"now … now; one moment … the next","nt":""},{"id":"libo","f":"либо … либо","cat":"add","reg":"n","lv":"B2","m":"either … or","nt":"Slightly more decisive than или … или."},{"id":"prichem","f":"причём","cat":"add","reg":"n","lv":"B2","m":"and what's more, and at that","nt":""},{"id":"k_tomu","f":"к тому же","cat":"add","reg":"n","lv":"B2","m":"besides, on top of that","nt":""},{"id":"da_i","f":"да и","cat":"add","reg":"c","lv":"B2","m":"and anyway, and besides","nt":"Adds a reason casually: Не хочу идти, да и поздно уже."},{"id":"chem_tem","f":"чем …, тем","cat":"comp","reg":"n","lv":"B2","m":"the … the","nt":"Both halves use comparatives."},{"id":"kak_budto","f":"как будто","cat":"comp","reg":"n","lv":"B1","m":"as if","nt":""},{"id":"slovno","f":"словно","cat":"comp","reg":"l","lv":"C1","m":"as if, like (literary)","nt":""},{"id":"budto","f":"будто","cat":"comp","reg":"c","lv":"B2","m":"as if; supposedly","nt":"Also \"allegedly\": Говорят, будто он уехал."},{"id":"tak_zhe_kak","f":"так же, как (и)","cat":"comp","reg":"n","lv":"B2","m":"just as, the same way as","nt":""},{"id":"to_est","f":"то есть","cat":"expl","reg":"n","lv":"B1","m":"that is, I mean","nt":""},{"id":"a_imenno","f":"а именно","cat":"expl","reg":"e","lv":"B2","m":"namely","nt":""},{"id":"kstati","f":"кстати","cat":"expl","reg":"c","lv":"B1","m":"by the way","nt":""},{"id":"voobshe","f":"вообще-то","cat":"expl","reg":"c","lv":"B2","m":"actually, as a matter of fact (mild correction)","nt":""},{"id":"koroche","f":"короче","cat":"expl","reg":"c","lv":"B1","m":"in short, anyway (very colloquial)","nt":""},{"id":"v_smysle","f":"в смысле","cat":"expl","reg":"c","lv":"B2","m":"I mean, meaning?","nt":""}],"items":[{"c":"potomu","lv":"B1","a":"Я сегодня не пойду в спортзал.","b":"Я очень устал.","s":"Я сегодня не пойду в спортзал, {потому} {что} очень устал.","alts":["Я сегодня не пойду в спортзал, потому что я очень устал."],"tr":"I'm not going to the gym today because I'm really tired."},{"c":"potomu","lv":"B1","a":"Мы взяли такси.","b":"Метро уже закрылось.","s":"Мы взяли такси, {потому} {что} метро уже закрылось.","tr":"We took a taxi because the metro had already closed."},{"c":"potomu","lv":"B1","a":"Она не берёт трубку.","b":"У неё сел телефон.","s":"Она не берёт трубку, {потому} {что} у неё сел телефон.","tr":"She isn't answering because her phone is dead."},{"c":"tak_kak","lv":"B1","a":"Магазин был закрыт.","b":"Мы купили хлеб в киоске.","s":"{Так} {как} магазин был закрыт, мы купили хлеб в киоске.","alts":["Мы купили хлеб в киоске, так как магазин был закрыт."],"tr":"As the shop was closed, we bought bread at the kiosk."},{"c":"tak_kak","lv":"B1","a":"Я плохо знаю город.","b":"Я поеду на такси.","s":"{Так} {как} я плохо знаю город, я поеду на такси.","alts":["Я поеду на такси, так как плохо знаю город.","Так как я плохо знаю город, поеду на такси."],"tr":"Since I don't know the city well, I'll take a taxi."},{"c":"poskolku","lv":"B2","a":"Поезд задерживается.","b":"Встреча переносится на завтра.","s":"{Поскольку} поезд задерживается, встреча переносится на завтра.","alts":["Встреча переносится на завтра, поскольку поезд задерживается."],"tr":"Since the train is delayed, the meeting is moved to tomorrow."},{"c":"poskolku","lv":"B2","a":"У нас мало времени.","b":"Я буду краток.","s":"{Поскольку} у нас мало времени, я буду краток.","alts":["Я буду краток, поскольку у нас мало времени."],"tr":"Since we're short of time, I'll be brief."},{"c":"ved","lv":"B1","a":"Возьми зонтик.","b":"Обещали дождь.","s":"Возьми зонтик, {ведь} обещали дождь.","alts":["Возьми зонтик, обещали ведь дождь."],"tr":"Take an umbrella — they did say it would rain."},{"c":"ved","lv":"B1","a":"Не волнуйся.","b":"Ты же всё знаешь.","s":"Не волнуйся, {ведь} ты всё знаешь.","alts":["Не волнуйся, ты ведь всё знаешь."],"tr":"Don't worry — after all, you know everything."},{"c":"raz","lv":"B2","a":"Ты уже пришёл.","b":"Помоги мне с ужином.","s":"{Раз} ты уже пришёл, помоги мне с ужином.","alts":["Раз уж ты пришёл, помоги мне с ужином."],"tr":"Since you're here anyway, help me with dinner."},{"c":"raz","lv":"B2","a":"Ты не хочешь идти.","b":"Оставайся дома.","s":"{Раз} ты не хочешь идти, оставайся дома.","alts":["Раз не хочешь идти, оставайся дома."],"tr":"If you don't want to go, then stay at home."},{"c":"iz_za","lv":"B1","a":"Мы опоздали.","b":"Была огромная пробка.","s":"Мы опоздали {из-за} {того,} {что} была огромная пробка.","alts":["Мы опоздали из-за того что была огромная пробка."],"tr":"We were late because there was a huge traffic jam."},{"c":"iz_za","lv":"B2","a":"Он поругался с соседом.","b":"Тот слишком громко слушал музыку.","s":"Он поругался с соседом {из-за} {того,} {что} тот слишком громко слушал музыку.","alts":["Он поругался с соседом из-за того что тот слишком громко слушал музыку."],"tr":"He fell out with his neighbour because the man played music too loudly."},{"c":"blagodarya","lv":"B2","a":"Мы успели на самолёт.","b":"Таксист знал короткую дорогу.","s":"Мы успели на самолёт {благодаря} {тому,} {что} таксист знал короткую дорогу.","alts":["Мы успели на самолёт благодаря тому что таксист знал короткую дорогу."],"tr":"We caught the plane thanks to the taxi driver knowing a shortcut."},{"c":"blagodarya","lv":"B2","a":"Она быстро нашла работу.","b":"Она хорошо говорит по-английски.","s":"Она быстро нашла работу {благодаря} {тому,} {что} хорошо говорит по-английски.","alts":["Она быстро нашла работу благодаря тому, что она хорошо говорит по-английски."],"tr":"She found a job quickly thanks to her good English."},{"c":"tem_bolee","lv":"B2","a":"Давай не пойдём.","b":"Уже поздно, и завтра рано вставать.","s":"Давай не пойдём, {тем} {более} {что} уже поздно.","alts":["Давай не пойдём, тем более уже поздно."],"tr":"Let's not go, especially as it's already late."},{"c":"tem_bolee","lv":"B2","a":"Я с удовольствием помогу.","b":"У меня всё равно свободный вечер.","s":"Я с удовольствием помогу, {тем} {более} {что} у меня свободный вечер.","alts":["Я с удовольствием помогу, тем более что у меня всё равно свободный вечер."],"tr":"I'll gladly help, all the more so as my evening's free."},{"c":"delo","lv":"B2","a":"Почему ты не пришёл?","b":"Я заболел.","s":"Почему ты не пришёл? — {Дело} {в} {том,} {что} я заболел.","alts":["Дело в том, что я заболел."],"tr":"Why didn't you come? — The thing is, I got ill."},{"c":"delo","lv":"B2","a":"Извините за опоздание.","b":"У нас сломался лифт.","s":"Извините за опоздание: {дело} {в} {том,} {что} у нас сломался лифт.","alts":["Извините за опоздание, дело в том, что у нас сломался лифт."],"tr":"Sorry I'm late — the thing is, our lift broke down."},{"c":"a_to","lv":"B1","a":"Одевайся теплее.","b":"Ты замёрзнешь.","s":"Одевайся теплее, {а} {то} замёрзнешь.","alts":["Одевайся теплее, а то ты замёрзнешь."],"tr":"Wrap up warm, or you'll freeze."},{"c":"a_to","lv":"B1","a":"Пойдём быстрее.","b":"Мы опоздаем на фильм.","s":"Пойдём быстрее, {а} {то} опоздаем на фильм.","alts":["Пойдём быстрее, а то мы опоздаем на фильм."],"tr":"Let's hurry or we'll be late for the film."},{"c":"a_to","lv":"B2","a":"Я сам позвоню.","b":"Ты вечно всё забываешь.","s":"Я сам позвоню, {а} {то} ты вечно всё забываешь.","tr":"I'll call myself — you always forget everything."},{"c":"poetomu","lv":"B1","a":"Я не выспался.","b":"Я весь день пью кофе.","s":"Я не выспался, {поэтому} весь день пью кофе.","alts":["Я не выспался, поэтому я весь день пью кофе."],"tr":"I didn't get enough sleep, so I've been drinking coffee all day."},{"c":"poetomu","lv":"B1","a":"В субботу будет дождь.","b":"Шашлыки переносим.","s":"В субботу будет дождь, {поэтому} шашлыки переносим.","alts":["В субботу будет дождь, поэтому шашлыки мы переносим."],"tr":"It's going to rain on Saturday, so we're postponing the barbecue."},{"c":"tak_chto","lv":"B1","a":"Я уже поел.","b":"Не готовь на меня.","s":"Я уже поел, {так} {что} не готовь на меня.","tr":"I've already eaten, so don't cook for me."},{"c":"tak_chto","lv":"B1","a":"Завтра выходной.","b":"Можно поспать подольше.","s":"Завтра выходной, {так} {что} можно поспать подольше.","tr":"Tomorrow's a day off, so we can sleep in."},{"c":"vot_i","lv":"B2","a":"Он не поставил будильник.","b":"Он проспал.","s":"Он не поставил будильник, {вот} {и} проспал.","tr":"He didn't set an alarm, and so he overslept."},{"c":"vot_i","lv":"B2","a":"Я весь день был за компьютером.","b":"У меня болит голова.","s":"Я весь день был за компьютером, {вот} {и} болит голова.","alts":["Я весь день сидел за компьютером, вот и болит голова."],"tr":"I've been at the computer all day — no wonder my head hurts."},{"c":"znachit","lv":"B1","a":"Свет не горит.","b":"Дома никого нет.","s":"Свет не горит, {значит,} дома никого нет.","alts":["Свет не горит, значит дома никого нет."],"tr":"The light's off, so nobody's home."},{"c":"znachit","lv":"B1","a":"Ты не голоден?","b":"Ужин отменяется.","s":"Ты не голоден? {Значит,} ужин отменяется.","alts":["Ты не голоден? Значит ужин отменяется."],"tr":"You're not hungry? Then dinner's off."},{"c":"v_rezultate","lv":"B2","a":"Целую неделю шли дожди.","b":"Река вышла из берегов.","s":"Целую неделю шли дожди, {в} {результате} {чего} река вышла из берегов.","alts":["Целую неделю шли дожди. В результате река вышла из берегов."],"tr":"It rained for a whole week; as a result the river burst its banks."},{"c":"sledovatelno","lv":"C1","a":"Все билеты проданы.","b":"Концерт состоится.","s":"Все билеты проданы, {следовательно,} концерт состоится.","alts":["Все билеты проданы, следовательно концерт состоится."],"tr":"All tickets are sold; consequently the concert will go ahead."},{"c":"sledovatelno","lv":"C1","a":"Подпись поставлена не там.","b":"Документ недействителен.","s":"Подпись поставлена не там, {следовательно,} документ недействителен.","tr":"The signature is in the wrong place; therefore the document is invalid."},{"c":"tak_chto_daje","lv":"B2","a":"Я очень устал.","b":"Я уснул в метро.","s":"Я {настолько} устал, {что} уснул в метро.","alts":["Я так устал, что уснул в метро."],"tr":"I was so tired that I fell asleep on the metro."},{"c":"tak_chto_daje","lv":"B2","a":"Фильм был скучный.","b":"Половина зала ушла.","s":"Фильм был {настолько} скучный, {что} половина зала ушла.","alts":["Фильм был такой скучный, что половина зала ушла."],"tr":"The film was so boring that half the audience left."},{"c":"hotya","lv":"B1","a":"Было холодно.","b":"Мы пошли гулять.","s":"{Хотя} было холодно, мы пошли гулять.","alts":["Мы пошли гулять, хотя было холодно."],"tr":"Although it was cold, we went for a walk."},{"c":"hotya","lv":"B1","a":"Он богатый.","b":"Он ездит на старой машине.","s":"{Хотя} он богатый, он ездит на старой машине.","alts":["Он ездит на старой машине, хотя он богатый.","Он ездит на старой машине, хотя богатый."],"tr":"Although he's rich, he drives an old car."},{"c":"hotya","lv":"B2","a":"Я обещал прийти.","b":"Я, наверное, не смогу.","s":"Я обещал прийти, {хотя,} наверное, не смогу.","tr":"I promised to come, though I probably won't be able to."},{"c":"hot","lv":"B1","a":"Это дорого.","b":"Это очень вкусно.","s":"{Хоть} {и} дорого, но очень вкусно.","alts":["Хоть и дорого, зато очень вкусно."],"tr":"It may be pricey, but it's really tasty."},{"c":"hot","lv":"B2","a":"Он мой брат.","b":"Я не буду его защищать.","s":"{Хоть} он и мой брат, я не буду его защищать.","alts":["Хоть он мой брат, я не буду его защищать."],"tr":"Even though he's my brother, I won't defend him."},{"c":"nesmotrya","lv":"B2","a":"Была метель.","b":"Самолёт вылетел вовремя.","s":"{Несмотря} {на} {то} {что} была метель, самолёт вылетел вовремя.","alts":["Самолёт вылетел вовремя, несмотря на то что была метель."],"tr":"Despite the blizzard, the plane left on time."},{"c":"nesmotrya","lv":"B2","a":"Ей восемьдесят лет.","b":"Она каждый день плавает в бассейне.","s":"{Несмотря} {на} {то} {что} ей восемьдесят лет, она каждый день плавает в бассейне.","alts":["Она каждый день плавает в бассейне, несмотря на то что ей восемьдесят лет."],"tr":"Despite being eighty, she swims in the pool every day."},{"c":"vse_ravno","lv":"B1","a":"Я ему всё объяснил.","b":"Он не понял.","s":"Я ему всё объяснил, но он {всё} {равно} не понял.","alts":["Я ему всё объяснил, а он всё равно не понял."],"tr":"I explained everything to him, but he still didn't get it."},{"c":"vse_ravno","lv":"B1","a":"Даже если будет дождь.","b":"Мы поедем на дачу.","s":"Даже если будет дождь, мы {всё} {равно} поедем на дачу.","alts":["Мы всё равно поедем на дачу, даже если будет дождь."],"tr":"Even if it rains, we'll still go to the dacha."},{"c":"pust","lv":"B2","a":"Квартира маленькая.","b":"Зато своя.","s":"{Пусть} квартира маленькая, зато своя.","alts":["Пусть маленькая, зато своя."],"tr":"The flat may be small, but it's our own."},{"c":"pust","lv":"C1","a":"Он ошибся.","b":"Он хотя бы попробовал.","s":"{Пусть} он ошибся, зато хотя бы попробовал.","alts":["Пусть он и ошибся, зато попробовал."],"tr":"He may have got it wrong, but at least he tried."},{"c":"kak_by_ni","lv":"C1","a":"Я очень стараюсь.","b":"У меня не получается.","s":"{Как} {бы} я {ни} старался, у меня не получается.","alts":["Как бы я ни старался, ничего не получается."],"tr":"However hard I try, it doesn't work."},{"c":"kak_by_ni","lv":"C1","a":"Ты будешь его уговаривать.","b":"Он не согласится.","s":"{Как} {бы} ты его {ни} уговаривал, он не согласится.","tr":"However much you try to persuade him, he won't agree."},{"c":"tem_ne_menee","lv":"B2","a":"Проект сложный.","b":"Мы уложились в сроки.","s":"Проект сложный, {тем} {не} {менее} мы уложились в сроки.","alts":["Проект был сложный. Тем не менее мы уложились в сроки.","Проект сложный, но тем не менее мы уложились в сроки."],"tr":"The project is difficult; nevertheless we met the deadline."},{"c":"dazhe_esli","lv":"B1","a":"Ты мне не поверишь.","b":"Это правда.","s":"{Даже} {если} ты мне не поверишь, это правда.","alts":["Это правда, даже если ты мне не поверишь."],"tr":"Even if you don't believe me, it's true."},{"c":"dazhe_esli","lv":"B1","a":"Он опоздает.","b":"Начинайте без него.","s":"{Даже} {если} он опоздает, начинайте без него.","tr":"Even if he's late, start without him."},{"c":"a","lv":"B1","a":"Я люблю чай.","b":"Мой муж любит кофе.","s":"Я люблю чай, {а} мой муж — кофе.","alts":["Я люблю чай, а мой муж любит кофе.","Я люблю чай, а муж кофе."],"tr":"I like tea, and my husband likes coffee."},{"c":"a","lv":"B1","a":"Брат живёт в Москве.","b":"Сестра живёт в Казани.","s":"Брат живёт в Москве, {а} сестра — в Казани.","alts":["Брат живёт в Москве, а сестра живёт в Казани.","Брат живёт в Москве, а сестра в Казани."],"tr":"My brother lives in Moscow and my sister in Kazan."},{"c":"a","lv":"B2","a":"Все думали, что он уехал.","b":"Он сидел дома.","s":"Все думали, что он уехал, {а} он сидел дома.","tr":"Everyone thought he'd left, but he was sitting at home."},{"c":"no","lv":"B1","a":"Я звонил тебе.","b":"Ты не ответил.","s":"Я звонил тебе, {но} ты не ответил.","tr":"I called you, but you didn't answer."},{"c":"no","lv":"B1","a":"Кафе маленькое.","b":"Там очень уютно.","s":"Кафе маленькое, {но} там очень уютно.","tr":"The café is small but very cosy."},{"c":"odnako","lv":"B2","a":"Мы ждали ответа неделю.","b":"Его так и не было.","s":"Мы ждали ответа неделю, {однако} его так и не было.","alts":["Мы ждали ответа неделю. Однако его так и не было."],"tr":"We waited a week for a reply; however, none came."},{"c":"zato","lv":"B1","a":"Квартира далеко от центра.","b":"Она большая и светлая.","s":"Квартира далеко от центра, {зато} большая и светлая.","alts":["Квартира далеко от центра, но зато большая и светлая."],"tr":"The flat is far from the centre, but it's big and bright."},{"c":"zato","lv":"B1","a":"Я не умею готовить.","b":"Я хорошо мою посуду.","s":"Я не умею готовить, {зато} хорошо мою посуду.","alts":["Я не умею готовить, но зато хорошо мою посуду.","Я не умею готовить, зато я хорошо мою посуду."],"tr":"I can't cook, but I'm good at washing up."},{"c":"v_to_vremya","lv":"B2","a":"Одни работают по двенадцать часов.","b":"Другие сидят без дела.","s":"Одни работают по двенадцать часов, {в} {то} {время} {как} другие сидят без дела.","tr":"Some work twelve-hour days, while others sit around doing nothing."},{"c":"a_vot","lv":"B1","a":"Суп получился вкусный.","b":"Котлеты подгорели.","s":"Суп получился вкусный, {а} {вот} котлеты подгорели.","tr":"The soup turned out tasty, but the cutlets got burnt."},{"c":"a_vot","lv":"B1","a":"Сестра обожает собак.","b":"Я их боюсь.","s":"Сестра обожает собак, {а} {вот} я их боюсь.","tr":"My sister adores dogs, but me — I'm scared of them."},{"c":"naoborot","lv":"B2","a":"Я думал, он обидится.","b":"Он обрадовался.","s":"Я думал, он обидится, а он, {наоборот,} обрадовался.","alts":["Я думал, что он обидится, а он, наоборот, обрадовался."],"tr":"I thought he'd be offended, but on the contrary, he was pleased."},{"c":"esli","lv":"B1","a":"Будет время.","b":"Я к тебе зайду.","s":"{Если} будет время, я к тебе зайду.","alts":["Если будет время, зайду к тебе.","Я к тебе зайду, если будет время."],"tr":"If I have time, I'll drop by."},{"c":"esli","lv":"B1","a":"Ты устал.","b":"Давай отдохнём.","s":"{Если} ты устал, давай отдохнём.","alts":["Давай отдохнём, если ты устал."],"tr":"If you're tired, let's take a break."},{"c":"esli","lv":"B1","a":"Тебе станет хуже.","b":"Сразу вызывай врача.","s":"{Если} тебе станет хуже, сразу вызывай врача.","alts":["Сразу вызывай врача, если тебе станет хуже."],"tr":"If you feel worse, call the doctor straight away."},{"c":"esli_by","lv":"B2","a":"У меня нет машины.","b":"Я бы тебя подвёз.","s":"{Если} {бы} у меня была машина, },{"c":"kogda_by","lv":"C1","a":"Я сажусь ужинать.","b":"Сразу звонит начальник.","s":"{Стоит} мне сесть ужинать, {как} звонит начальник.","alts":["Стоит мне только сесть ужинать, как звонит начальник."],"tr":"The moment I sit down to dinner, my boss calls."},{"c":"chtoby","lv":"B1","a":"Я встал пораньше.","b":"Я хотел успеть на электричку.","s":"Я встал пораньше, {чтобы} успеть на электричку.","tr":"I got up early to catch the commuter train."},{"c":"chtoby","lv":"B1","a":"Мама позвонила.","b":"Она хотела, чтобы я купил молоко.","s":"Мама позвонила, {чтобы} я купил молоко.","alts":["Мама позвонила, чтобы я купил молока."],"tr":"Mum rang so that I'd buy milk."},{"c":"chtoby","lv":"B2","a":"Говори громче.","b":"Я хочу, чтобы все тебя слышали.","s":"Говори громче, {чтобы} все тебя слышали.","tr":"Speak up so everyone can hear you."},{"c":"dlya_togo","lv":"B2","a":"Нужно много тренироваться.","b":"Это нужно, чтобы выучить язык.","s":"{Для} {того} {чтобы} выучить язык, нужно много тренироваться.","alts":["Для того, чтобы выучить язык, нужно много тренироваться.","Нужно много тренироваться, для того чтобы выучить язык."],"tr":"To learn a language, you need a lot of practice."},{"c":"s_tem","lv":"C1","a":"Мы обратились к вам.","b":"Мы хотим обсудить условия договора.","s":"Мы обратились к вам {с} {тем,} {чтобы} обсудить условия договора.","alts":["Мы обратились к вам с тем чтобы обсудить условия договора."],"tr":"We have approached you with a view to discussing the terms of the contract."},{"c":"chtoby_ne","lv":"B2","a":"Я говорил шёпотом.","b":"Я не хотел разбудить ребёнка.","s":"Я говорил шёпотом, {чтобы} {не} разбудить ребёнка.","tr":"I spoke in a whisper so as not to wake the baby."},{"c":"chtoby_ne","lv":"B2","a":"Возьми карту.","b":"Ты можешь заблудиться.","s":"Возьми карту, {чтобы} {не} заблудиться.","tr":"Take a map so you don't get lost."},{"c":"kogda","lv":"B1","a":"Я был маленьким.","b":"Мы жили в деревне.","s":"{Когда} я был маленьким, мы жили в деревне.","alt ,"lv":"B2","a":"Он не позвонил.","b":"Он не написал.","s":"Он {ни} позвонил, {ни} написал.","alts":["Он не позвонил и не написал."],"tr":"He neither called nor wrote."},{"c":"to_to","lv":"B2","a":"Сегодня светит солнце.","b":"Сегодня идёт дождь.","s":"Сегодня {то} солнце, {то} дождь.","alts":["Сегодня то светит солнце, то идёт дождь."],"tr":"Today it's sunshine one minute, rain the next."},{"c":"to_to","lv":"B2","a":"Он звонит каждую минуту.","b":"Он пишет сообщения.","s":"Он {то} звонит, {то} пишет сообщения.","tr":"He keeps calling one minute and texting the next."},{"c":"libo","lv":"B2","a":"Мы поедем в пятницу.","b":"Мы поедем в субботу.","s":"Мы поедем {либо} в пятницу, {либо} в субботу.","alts":["Мы поедем или в пятницу, или в субботу."],"tr":"We'll go either on Friday or Saturday."},{"c":"prichem","lv":"B2","a":"Он опять опоздал.","b":"Он опоздал на целый час.","s":"Он опять опоздал, {причём} на целый час.","tr":"He was late again — and by a whole hour, at that."},{"c":"prichem","lv":"B2","a":"Она выучила три языка.","b":"Она выучила их сама.","s":"Она выучила три языка, {причём} сама.","alts":["Она выучила три языка, причём сама, без учителя."],"tr":"She learned three languages, and on her own at that."},{"c":"k_tomu","lv":"B2","a":"Квартира слишком дорогая.","b":"Она далеко от работы.","s":"Квартира слишком дорогая, {к} {тому} {же} далеко от работы.","alts":["Квартира слишком дорогая, к тому же она далеко от работы."],"tr":"The flat is too expensive, and on top of that it's far from work."},{"c":"da_i","lv":"B2","a":"Я не хочу никуда идти.","b":"Уже поздно.","s":"Я не хочу никуда идти, {да} {и} поздно уже.","alts":["Я не хочу никуда идти, да и уже поздно."],"tr":"I don't feel like going anywhere, and besides it's late."},{"c":"da_i","lv":"B2","a":"Не покупай ему игрушку.","b":"У него их и так полно.","s":"Не покупай ему игрушку, {да} {и} так у него их полно.","alts":["Не покупай ему игрушку, да и у него их и так полно."],"tr":"Don't buy him a toy — he's got .","b":"Нам не хватает времени, денег и людей.","s":"Нам не хватает трёх вещей, {а} {именно} времени, денег и людей.","alts":["Нам не хватает трёх вещей, а именно: времени, денег и людей."],"tr":"We are short of three things, namely time, money and people."},{"c":"kstati","lv":"B1","a":"Я видел Олю.","b":"Она передавала тебе привет.","s":"Я видел Олю, {кстати,} она передавала тебе привет.","alts":["Я видел Олю. Кстати, она передавала тебе привет."],"tr":"I saw Olya — by the way, she says hi."},{"c":"voobshe","lv":"B2","a":"Ты говоришь, он грубый.","b":"Он нормальный парень.","s":"Ты говоришь, он грубый, а {вообще-то} он нормальный парень.","tr":"You say he's rude, but actually he's a decent guy."},{"c":"koroche","lv":"B1","a":"Мы долго спорили.","b":"Мы решили ехать на море.","s":"Мы долго спорили, {короче,} решили ехать на море.","alts":["Мы долго спорили. Короче, решили ехать на море."],"tr":"We argued for ages — anyway, we decided to go to the seaside."},{"c":"v_smysle","lv":"B2","a":"Он у нас больше не работает.","b":"Его уволили.","s":"Он у нас больше не работает, {в} {смысле,} его уволили.","tr":"He doesn't work here any more — I mean, he got fired."}],"ui":{"practise":"Practise","learn":"Learn","mode":"Mode","comb":"Combine two sentences","build":"Build from blocks","pick":"Pick the connector","filters":"Filters","level":"Level","register":"Register","help":"Help","showTr":"Show translation","hideTr":"No translation","allCats":"All connectors","sentences":"sentences","notYet":"Not yet right","practiseThis":"Practise this one","back":"Back","joinWith":"Join the two sentences with","typeHere":"Type the combined sentence","buildWith":"Build the sentence with","decoyNote":"two blocks are wrong connectors","check":"Check","clear":"Clear","show":"Show","skip":"Skip","notQuite":"Not quite","missing":"{n} word(s) missing or different.","tryAgain":"Green is right, red does not belong. Try again or tap Show.","buildBad":"Green blocks are in the right place. Tap a block const XD={"rel": [{"a": "Мы опоздали на поезд.", "b": "Пришлось ехать на такси.", "r": "cons", "ok": ["поэтому", "так что", "вот и"], "no": ["потому что", "хотя", "чтобы"], "s": "Мы опоздали на поезд, поэтому пришлось ехать на такси.", "tr": "We missed the train, so we had to take a taxi.", "why": "Part 2 is the result of part 1. потому что would turn it round: it would make the taxi the reason for missing the train.", "c": "poetomu"}, {"a": "Он много занимался.", "b": "Экзамен он не сдал.", "r": "conc", "ok": ["но", "однако", "тем не менее"], "no": ["поэтому", "так как", "значит"], "s": "Он много занимался, но экзамен не сдал.", "tr": "He studied a lot, but he failed the exam.", "why": "You'd expect success, and the result goes against that expectation. хотя also fits if it opens part 1: Хотя он много занимался, …", "c": "no"}, {"a": "Я не пошёл на работу.", "b": "У меня поднялась температура.", "r": "cause", "ok": ["потому что", "так как", "ведь"], "no": ["поэтому", "так что", "хотя"], "s": "Я не пошёл на работу, потому что у меня поднялась температура.", "tr": "I didn't go to work because I had a temperature.", "why": "Part 2 explains why. поэтому / так что point the other way (cause → result).", "c": "potomu"}, {"a": "Возьми зонт.", "b": "Промокнешь.", "r": "cond", "ok": ["иначе", "а то"], "no": ["потому что", "чтобы", "поэтому"], "s": "Возьми зонт, иначе промокнешь.", "tr": "Take an umbrella, otherwise you'll get wet.", "why": "Part 2 is what happens if you don't do part 1: a warning. а то is the spoken version of иначе.", "c": "inache"}, {"a": "Я говорю медленно.", "b": "Все меня понимают.", "r": "purp", "ok": ["чтобы", "для того чтобы"], "no": ["поэтому", "потому что", "если"], "s": "Я говорю медленно, чтобы все меня понимали.", "tr": "I speak slowly so that everyone understands me.", "why": "Part 2 is the goal. With a new subject, чтобы takes the past form: чтобы все понимали.", "c": "chtoby"}, {"a": "Мой брат любит шумные компании.", "b": "Я предпочитаю тишину.", "r": "contr", "ok": ["а", "в то время как"], "no": ["зато", "поэтому", "хотя"], "s": "Мой брат любит шумные компании, а я предпочитаю тишину.", "tr": "My brother loves noisy groups, whereas I prefer quiet.", "why": "Two different people compared side by side: а. зато needs a minus followed by a plus for the same thing.", "c": "a"}, {"a": "Я пришёл домой.", "b": "Я сразу лёг спать.", "r": "time", "ok": ["как только", "едва"], "no": ["хотя", "если бы … , … бы", "пока не"], "s": "Как только я пришёл домой, я сразу лёг спать.", "tr": "As soon as I got home, I went straight to bed.", "why": "One thing, then immediately the other: как только (едва is more bookish).", "c": "kak_tolko"}, {"a": "Квартира маленькая.", "b": "Она в самом центре.", "r": "contr", "ok": ["зато", "но"], "no": ["а", "потому что", "так что"], "s": "Квартира маленькая, зато в самом центре.", "tr": "The flat is small, but on the plus side it's right in the centre.", "why": "A minus, then a plus that makes up for it: exactly what зато means. а would just contrast two things.", "c": "zato"}, {"a": "Ты так устал.", "b": "Иди спать.", "r": "cause", "ok": ["раз", "если"], "no": ["хотя", "чтобы", "а то"], "s": "Раз ты так устал, иди спать.", "tr": "Since you're so tired, go to bed.", "why": "Part 1 is a known fact that justifies the advice: раз (= since, given that).", "c": "raz"}, {"a": "Погода была ужасная.", "b": "Мы всё равно пошли гулять.", "r": "conc", "ok": ["хотя", "несмотря на то что", "но"], "no": ["потому что", "поэтому", "раз"], "s": "Хотя погода была ужасная, мы всё равно пошли гулять.", "tr": "Although the weather was awful, we still went for a walk.", "why": "всё равно already signals that the result goes against the circumstances.", "c": "hotya"}, {"a": "Ты будешь больше читать.", "b": "Твой словарный запас станет богаче.", "r": "comp", "ok": ["чем …, тем"], "no": ["хотя", "потому что", "либо … либо"], "s": "Чем больше ты будешь читать, тем богаче станет твой словарный запас.", "tr": "The more you read, the richer your vocabulary will get.", "why": "Two things grow together: чем …, тем … with comparatives in both halves.", "c": "chem_tem"}, {"a": "Я не против.", "b": "Я даже за!", "r": "contr", "ok": ["наоборот"], "no": ["потому что", "поэтому", "пусть"], "s": "Я не против, наоборот, я даже за!", "tr": "I'm not against it; on the contrary, I'm all for it!", "why": "Part 2 corrects part 1 and goes the opposite way: наоборот.", "c": "naoborot"}, {"a": "Она смотрела на меня.", "b": "Она видела меня впервые.", "r": "comp", "ok": ["как будто", "словно"], "no": ["потому что", "поэтому", "чтобы"], "s": "Она смотрела на меня так, как будто видела впервые.", "tr": "She looked at me as if she were seeing me for the first time.", "why": "Part 2 isn't a fact but an imagined comparison: как будто / словно.", "c": "kak_budto"}, {"a": "Он хорошо говорит по-немецки.", "b": "Он ещё и пишет без ошибок.", "r": "add", "ok": ["не только …, но и", "к тому же", "причём"], "no": ["хотя", "иначе", "зато"], "s": "Он не только хорошо говорит по-немецки, но и пишет без ошибок.", "tr": "He not only speaks German well, he also writes it without mistakes.", "why": "Adding a second plus to the first: не только …, но и or к тому же.", "c": "ne_tolko"}, {"a": "Я подожду здесь.", "b": "Ты вернёшься.", "r": "time", "ok": ["пока не"], "no": ["пока", "если", "стоит …, как"], "s": "Я подожду здесь, пока ты не вернёшься.", "tr": "I'll wait here until you come back.", "why": "'until' = пока не. Plain пока means 'while': Я подожду, пока ты ешь.", "c": "poka_ne"}, {"a": "Встреча отменяется.", "b": "Директор заболел.", "r": "cause", "ok": ["потому что", "так как", "поскольку"], "no": ["поэтому", "в результате", "хотя"], "s": "Встреча отменяется, так как директор заболел.", "tr": "The meeting is cancelled as the director is ill.", "why": "Part 2 is the reason. в результате (чего) would make the illness the result of the cancellation.", "c": "potomu"}, {"a": "Цены выросли.", "b": "Продажи упали.", "r": "cons", "ok": ["в результате", "поэтому", "следовательно"], "no": ["так как", "хотя", "пусть"], "s": "Цены выросли, в результате чего продажи упали.", "tr": "Prices went up, and as a result sales fell.", "why": "Cause first, then the result. так как would make the fall in sales the reason.", "c": "v_rezultate"}, {"a": "Он всё время шутит.", "b": "Он совсем не весёлый человек.", "r": "conc", "ok": ["хотя", "но", "однако"], "no": ["поэтому", "значит", "потому что"], "s": "Хотя он всё время шутит, он совсем не весёлый человек.", "tr": "Although he jokes all the time, he isn't a cheerful person at all.", "why": "The two facts clash: concession. значит would draw a conclusion that doesn't follow.", "c": "hotya"}], "cont": [{"a": "Я весь день работал, поэтому …", "o": ["вечером сразу уснул.", "вечером пошёл на дискотеку и танцевал до утра.", "мне было совсем не трудно.", "у меня было много свободного времени."], "c": "poetomu", "tr": "I worked all day, so in the evening I fell asleep straight away.", "why": "поэтому introduces the logical result of working all day."}, {"a": "Я весь день работал, зато …", "o": ["закончил весь проект.", "очень устал.", "ничего не успел.", "у меня болит голова."], "c": "zato", "tr": "I worked all day, but at least I finished the whole project.", "why": "зато needs a plus that makes up for the effort."}, {"a": "Хотя на улице было холодно, …", "o": ["дети гуляли без шапок.", "мы остались дома.", "все надели тёплые куртки.", "я включил отопление."], "c": "hotya", "tr": "Although it was cold outside, the children were out without hats.", "why": "After хотя comes something you wouldn't expect."}, {"a": "Раз ты уже здесь, …", "o": ["помоги мне с ужином.", "ты опоздал на час.", "почему ты не пришёл?", "мы тебя очень ждали."], "c": "raz", "tr": "Since you're here already, help me with dinner.", "why": "раз + a known fact usually leads to a suggestion or conclusion."}, {"a": "Мы вышли пораньше, чтобы …", "o": ["не попасть в пробку.", "попали в пробку.", "дорога была свободна.", "мы опоздали."], "c": "chtoby", "tr": "We left early so as not to get stuck in traffic.", "why": "чтобы gives the aim, with an infinitive for the same subject."}, {"a": "Он говорил так уверенно, как будто …", "o": ["знал ответ заранее.", "ничего не знал.", "поэтому все ему поверили.", "был очень уверен."], "c": "kak_budto", "tr": "He spoke so confidently, as if he knew the answer in advance.", "why": "как будто introduces an imagined comparison that fits the confidence."}, {"a": "Позвони мне, как только …", "o": ["приедешь в гостиницу.", "приехал в гостиницу вчера.", "ты не приедешь.", "потому что я жду."], "c": "kak_tolko", "tr": "Call me as soon as you get to the hotel.", "why": "как только + future (perfective) for a single future moment."}, {"a": "Он не только опоздал, но и …", "o": ["забыл дома все документы.", "извинился и всё объяснил.", "пришёл раньше всех.", "поэтому начальник разозлился."], "c": "ne_tolko", "tr": "He not only was late, he also forgot all his documents at home.", "why": "не только …, но и adds a second thing of the same kind, here a second problem."}, {"a": "Иди быстрее, а то …", "o": ["опоздаем на автобус.", "у нас много времени.", "автобус уже ушёл.", "мы успеем."], "c": "a_to", "tr": "Walk faster, or we'll miss the bus.", "why": "а то = otherwise: what happens if you don't."}, {"a": "Чем дольше я живу в Москве, тем …", "o": ["больше её люблю.", "я живу здесь пять лет.", "потому что тут интересно.", "но иногда скучаю."], "c": "chem_tem", "tr": "The longer I live in Moscow, the more I love it.", "why": "тем must be followed by a comparative."}, {"a": "Несмотря на то что фильм длинный, …", "o": ["смотреть его совсем не скучно.", "я заснул в середине.", "он идёт три часа.", "я ушёл из кинотеатра."], "c": "nesmotrya", "tr": "Although the film is long, it isn't boring at all.", "why": "The result goes against what 'long' would lead you to expect."}, {"a": "Он остался дома, так как …", "o": ["плохо себя чувствовал.", "поэтому не пришёл.", "вечером пошёл в кино.", "все его ждали."], "c": "tak_kak", "tr": "He stayed at home as he wasn't feeling well.", "why": "так как gives the reason."}, {"a": "Я его не люблю, а вот …", "o": ["его сестра мне очень нравится.", "он мне тоже не нравится.", "поэтому я с ним не говорю.", "потому что он грубый."], "c": "a_vot", "tr": "I don't like him, but his sister I like a lot.", "why": "а вот switches to a different thing and contrasts it."}, {"a": "Он ответил на все вопросы, причём …", "o": ["без единой ошибки.", "но экзамен не сдал.", "потому что готовился.", "вопросов было десять."], "c": "prichem", "tr": "He answered all the questions, and without a single mistake, too.", "why": "причём adds a striking detail about the same thing."}, {"a": "Всё было готово, значит, …", "o": ["можно начинать.", "нужно ещё всё подготовить.", "мы ничего не сделали.", "потому что мы работали."], "c": "znachit", "tr": "Everything was ready, so we could start.", "why": "значит draws a conclusion."}, {"a": "Я дам тебе ключи при условии, что …", "o": ["ты вернёшь их завтра.", "ты их потерял.", "ты их не вернёшь.", "у меня нет ключей."], "c": "pri_uslovii", "tr": "I'll give you the keys on condition that you return them tomorrow.", "why": "при условии, что states the condition for the deal."}], "pairs": [{"t": "потому что · поэтому", "f": ["потому что", "поэтому"], "ids": ["potomu", "poetomu"], "note": "потому что introduces the reason; поэтому introduces the result.", "q": [{"s": "Я не пришёл, ___ заболел.", "a": 0, "tr": "I didn't come because I was ill.", "why": "The illness is the reason.", "fill": "потому что"}, {"s": "Я заболел, ___ не пришёл.", "a": 1, "tr": "I was ill, so I didn't come.", "why": "Not coming is the result.", "fill": "поэтому"}, {"s": "Шёл дождь, ___ мы остались дома.", "a": 1, "tr": "It was raining, so we stayed home.", "why": "Staying home is the result.", "fill": "поэтому"}]}, {"t": "хотя · даже если", "f": ["хотя", "даже если"], "ids": ["hotya", "dazhe_esli"], "note": "хотя: a real fact that doesn't stop you. даже если: a possible situation (it may or may not happen).", "q": [{"s": "___ завтра будет дождь, мы поедем на дачу.", "a": 1, "tr": "Even if it rains tomorrow, we'll go to the dacha.", "why": "Tomorrow's rain is only a possibility.", "fill": "даже если"}, {"s": "___ вчера шёл дождь, мы поехали на дачу.", "a": 0, "tr": "Although it rained yesterday, we went to the dacha.", "why": "Yesterday's rain is a fact.", "fill": "хотя"}, {"s": "___ ты меня попросишь, я не соглашусь.", "a": 1, "tr": "Even if you ask me, I won't agree.", "why": "He hasn't asked yet: hypothetical.", "fill": "даже если"}]}, {"t": "а · но · зато", "f": ["а", "но", "зато"], "ids": ["a", "no", "zato"], "note": "а compares two different things; но goes against an expectation; зато adds a plus that makes up for a minus.", "q": [{"s": "Я люблю чай, ___ муж любит кофе.", "a": 0, "tr": "I like tea, and my husband likes coffee.", "why": "Two people compared: а.", "fill": "а"}, {"s": "Я очень устал, ___ всё-таки пошёл на тренировку.", "a": 1, "tr": "I was very tired, but I still went to training.", "why": "Going is unexpected after being tired: но.", "fill": "но"}, {"s": "Работа тяжёлая, ___ платят хорошо.", "a": 2, "tr": "The work is hard, but at least it pays well.", "why": "Minus → compensating plus: зато.", "fill": "зато"}]}, {"t": "пока · пока не", "f": ["пока", "пока не"], "ids": ["poka", "poka_ne"], "note": "пока = while (two things at the same time). пока не = until (one thing ends when the other starts).", "q": [{"s": "Подожди, ___ я закончу.", "a": 1, "tr": "Wait until I finish.", "why": "Waiting stops when I finish: пока не.", "fill": "пока не"}, {"s": "___ я готовила, дети смотрели мультики.", "a": 0, "tr": "While I was cooking, the kids watched cartoons.", "why": "Two things at the same time: пока.", "fill": "пока"}, {"s": "Мы не уйдём, ___ он не придёт.", "a": 1, "tr": "We won't leave until he comes.", "why": "Notice the second не.", "fill": "пока не"}]}, {"t": "если · если бы", "f": ["если", "если бы"], "ids": ["esli", "esli_by"], "note": "если: a real condition. если бы … бы: unreal, imagined or too late.", "q": [{"s": "___ у меня будет время, я позвоню.", "a": 0, "tr": "If I have time, I'll call.", "why": "Real, possible future.", "fill": "если"}, {"s": "___ у меня было время, я бы позвонил.", "a": 1, "tr": "If I had time, I would call.", "why": "Unreal: notice бы in the main clause.", "fill": "если бы"}, {"s": "___ ты знал, как я волновалась!", "a": 1, "tr": "If only you knew how worried I was!", "why": "Wish / unreal.", "fill": "если бы"}]}, {"t": "чтобы · потому что", "f": ["чтобы", "потому что"], "ids": ["chtoby", "potomu"], "note": "чтобы: the aim (what you want to achieve). потому что: the reason (what already exists).", "q": [{"s": "Я учу русский, ___ читать Толстого в оригинале.", "a": 0, "tr": "I'm learning Russian to read Tolstoy in the original.", "why": "A goal: чтобы + infinitive.", "fill": "чтобы"}, {"s": "Я учу русский, ___ моя жена из Москвы.", "a": 1, "tr": "I'm learning Russian because my wife is from Moscow.", "why": "An existing fact = reason.", "fill": "потому что"}, {"s": "Он встал рано, ___ успеть на поезд.", "a": 0, "tr": "He got up early to catch the train.", "why": "A goal.", "fill": "чтобы"}]}, {"t": "как будто · будто", "f": ["как будто", "будто"], "ids": ["kak_budto", "budto"], "note": "как будто: 'as if' (comparison). будто can also report a doubtful claim: 'supposedly'.", "q": [{"s": "Он ведёт себя так, ___ ничего не случилось.", "a": 0, "tr": "He's behaving as if nothing had happened.", "why": "Comparison after так: как будто.", "fill": "как будто"}, {"s": "Говорят, ___ он уехал за границу.", "a": 1, "tr": "They say he has supposedly gone abroad.", "why": "Reporting a rumour you doubt: будто.", "fill": "будто"}]}, {"t": "ведь · так что", "f": ["ведь", "так что"], "ids": ["ved", "tak_chto"], "note": "ведь gives a reason the listener should already know; так что draws a result.", "q": [{"s": "Не звони ему сейчас, ___ уже поздно.", "a": 0, "tr": "Don't call him now; it's late, after all.", "why": "A reason everyone knows.", "fill": "ведь"}, {"s": "Уже поздно, ___ не звони ему сейчас.", "a": 1, "tr": "It's late, so don't call him now.", "why": "A result/conclusion.", "fill": "так что"}]}], "rw": [{"src": "Я опоздал, потому что проспал.", "use": "поэтому", "c": "poetomu", "ans": ["Я проспал, поэтому опоздал.", "Я проспал и поэтому опоздал."], "tr": "I overslept, so I was late.", "note": "поэтому introduces the result, so the two halves swap."}, {"src": "Он устал, но продолжал работать.", "use": "хотя", "c": "hotya", "ans": ["Хотя он устал, он продолжал работать.", "Хотя он устал, продолжал работать.", "Он продолжал работать, хотя устал.", "Он продолжал работать, хотя и устал."], "tr": "Although he was tired, he kept working.", "note": "хотя goes on the clause with the 'obstacle'."}, {"src": "Если ты не поторопишься, мы опоздаем.", "use": "иначе", "c": "inache", "ans": ["Поторопись, иначе мы опоздаем.", "Поторопись, иначе опоздаем."], "tr": "Hurry up, otherwise we'll be late.", "note": "With иначе the first half becomes a positive command."}, {"src": "Он заболел, поэтому не пришёл.", "use": "из-за того что", "c": "iz_za", "ans": ["Он не пришёл из-за того, что заболел.", "Из-за того что он заболел, он не пришёл.", "Он не пришёл из-за того что заболел."], "tr": "He didn't come because he was ill.", "note": "из-за того что stresses a negative cause."}, {"src": "Я читаю много, и мой русский становится лучше.", "use": "чем … тем", "c": "chem_tem", "ans": ["Чем больше я читаю, тем лучше становится мой русский.", "Чем больше я читаю, тем лучше мой русский."], "tr": "The more I read, the better my Russian gets.", "note": "Both halves need comparatives: больше … лучше."}, {"src": "Я пришёл домой и сразу позвонил маме.", "use": "как только", "c": "kak_tolko", "ans": ["Как только я пришёл домой, я сразу позвонил мам function xFinish(g){const c=R.cur,it=c.it,m=S.opt.mode;if(c.done)return;c.done=true;S.res[rk(it,m)]=g;save();R.log.push([it,g]);
  document.querySelectorAll('#oc .opt').forEach((b,j)=>{b.disabled=true;if(c.o&&c.o[j]&&c.o[j].ok)b.classList.add('ok')});
  if(m==='rel'&&c.ch)$('st').querySelectorAll('.chip').forEach((b,j)=>{b.classList.add(c.ch[j].ok?'cok':'cno');b.disabled=true});
  if(m==='fix')document.querySelectorAll('#fx .ftok').forEach((b,j)=>{b.disabled=true;if(c.T[j].e)b.classList.add('err')});
  if($('ta'))$('ta').readOnly=true;if($('ti'))$('ti').readOnly=true;
  const v=g===2?'✓ '+esc(C.ui.firstTry):g===1?'✓ '+esc(C.ui.right):esc(C.ui.hereItIs);let body='';
  const cn=CONN[it.c];const cline=cn?`<div class="small"><b>${esc(cn.f)}</b> — ${esc(cn.m)}</div>`:'';
  if(m==='rel')body=`<div class="han">${esc(it.s)}</div>${xpy(it.ps)}<div class="small">${esc(XU.fits)}: <b>${it.ok.map(esc).join(' · ')}</b></div>${it.tr?`<div class="en">${esc(it.tr)}</div>`:''}<div class="small">${esc(it.why)}</div>`;
  if(m==='cont')body=`<div class="han">${esc(it.s)}</div>${xpy(it.ps)}${it.tr?`<div class="en">${esc(it.tr)}</div>`:''}<div class="small">${esc(it.why)}</div>${cline}`;
  if(m==='pairs')body=`<div class="han">${esc(it.s)}</div>${xpy(it.q.ps)}${it.q.tr?`<div class="en">${esc(it.q.tr)}</div>`:''}<div class="small">${esc(it.q.why)}</div><div class="small" style="margin-top:4px">⚖️ ${esc(it.set.note)}</div>`;
  if(m==='rw'){const B=it.ans.slice(1);body=`<div class="han">${esc(it.ans[0])}</div>${xpy(it.ps)}${B.length?`<div class="small">${esc(C.ui.alsoRight)}: ${B.map(esc).join(' · ')}</div>`:''}${it.tr?`<div class="en">${esc(it.tr)}</div>`:''}<div class="small">${esc(it.note)}</div>${cline}`}
  if(m==='fix')body=`${it.r?`<div class="han">${esc(it.r)}</div>${xpy(it.ps)}`:`<div class="small">${esc(XU.fixWasOk)}</div>`}${it.tr?`<div class="en">${esc(it.tr)}</div>`:''}<div class="small">${esc(it.why)}</div>`;
  if(m==='real'){const b=it.base;body=`<div class="han">${esc(plain(b.s))}</div>${b.py?`<div class="py">${esc(b.py)}</div>`:''}${b.tr?`<div class="en">${esc(b.tr)}</div>`:''}<div class="small">${esc(XU.relWas)}: ${esc(C.cats[cn.cat])}</div>${cline}`}
  $('fb').innerHTML=`<div class="fb ${g?'ok':'bad'}"><span class="v">${v}</span>${body}</div>`;
  $('acts').innerHTML=`${m==='real'?`<button class="btn" id="pl2" type="button">🔊</button>`:''}<span class="sp"></span><button class="btn pri" id="nx" type="button">${R.k+1<R.items.length?esc(C.ui.next)+' →':esc(C.ui.finish)}</button>`;
  if($('pl2'))$('pl2').onclick=()=>playClip(it.base,$('pl'));$('nx').onclick=next;setTimeout(()=>{try{$('nx').focus({preventScroll:true})}catch(e){}},30)}

home();
