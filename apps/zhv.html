  function h(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

  function mark(sent,word){sent=h(sent);if(!word)return sent;var w=h(word),i=sent.indexOf(w);return i<0?sent:sent.slice(0,i)+'<b>'+w+'</b>'+sent.slice(i+w.length)}

chen."]]},{"h":"向","p":"xiàng","m":"nach; in Richtung; zu","c":"hsk3","l":"de","i":38,"L":3,"Le":0,"x":[["你向哪里看啊？","Nǐ xiàng nǎlǐ kàn a?","Wohin schaust du?"],["他向我提出了一个奇怪的问题。","Tā xiàng wǒ tíchūle yīgè qíguài de wèntí.","Er hat mir eine seltsame Frage gestellt."]]},{"h":"老","p":"lǎo","m":"alt","c":"hsk3","l":"de","i":39,"L":3,"Le":0,"x":[["我爸爸不老。","Wǒ bàba bùlǎo.","Mein Vater ist nicht alt."],["他比我老了三岁。","Tā bǐ wǒ lǎole sān suì.","Er ist drei Jahre älter als ich."]]},{"h":"位","p":"wèi","m":"ZEW (höflich) für Personen","c":"hsk3","l":"de","i":40,"L":2,"Le":0,"x":[["这位是你的老师吗？","Zhè wèi shì nǐ de lǎoshī ma?","Ist das dein Lehrer?"],["他是一位很努力学习的学生。","Tā shì yī wèi hěn nǔlì xuéxí de xuéshēng.","Er ist ein sehr fleißiger Schüler."]]},{"h":"先","p":"xiān","m":"zuerst; vorher","c":"hsk3","l":"de","i":41,"L":3,"Le":0,"x":[["你先走吧。","Nǐ xiān zǒu ba.","Geh du schon mal vor."],["今天他比老师还先到学校。","Jīntiān tā bǐ lǎoshī hái xiān dào xuéxiào.","Heute war er sogar vor dem Lehrer in der Schule."]]},{"h":"种","p":"zhǒng, zhòng","m":"die Sorte; die Art | (zhòng) pflanzen","c":"hsk3","l":"de","i":42,"L":3,"Le":0,"x":[["你姐姐在种什么啊？","Nǐ jiějiě zài zhǒng shénme a?","Was pflanzt deine Schwester da?"],["他希望他可以种出西瓜给女儿吃。","Tā xīwàng tā kěyǐ zhǒng chū xīguā gěi nǚ'ér chī.","Er hofft, Wassermelonen für seine Tochter anbauen zu können."]]},{"h":"最后","p":"zuìhòu","m":"zuletzt; schließlich","c":"hsk3","l":"de","i":43,"L":3,"Le":0,"x":[["最后我们做什么？","Zuìhòu wǒmen zuò shénme?","Was machen wir zum Schluss?"],["在离开学校的最后一天，他哭了。","Zài líkāi xuéxiào de zuìhòu yītiān, tā kūle.","Am letzten Tag vor dem Schulabschied hat er geweint."]]},{"h":"其他","p":"qítā","m":"andere; sonstige","c":"hsk3","l":"de","i":44,"L":3,"Le":0,"x":[["昨天其他人都做了什么？","Zuótiān qítā rén dōu zuòle shénme?","Was haben die anderen gestern gemacht?"],["你对这个问题还有没有其他回答。","Nǐ duì zhège wèntí hái yǒu méiyǒu qítā huídá.","Hast du noch eine andere Antwort auf diese Frage?"]]},{"h":"记得","p":"jìde","m":"sich erinnern","c":"hsk3","l":"de","i":45,"L":2,"Le":0,"x":[["你还记得吗？","Nǐ hái jìdé ma?","Erinnerst du dich noch?"],["你记得我们来过这个城市吗？","Nǐ jìdé wǒmen láiguò zhège chéngshì ma?","Erinnerst du dich, dass wir schon einmal in dieser Stadt waren?"]]},{"h":"或者","p":"huòzhě","m":"oder","c":"hsk3","l":"de","i":46,"L":3,"Le":0,"x":[["谁去？你或者他？","Shuí qù? nǐ huòzhě tā?","Wer geht? Du oder er?"],["我想去北京或者去上海","Wǒ xiǎng qù běijīng huòzhě qù shànghǎi","Ich möchte nach Peking oder nach Shanghai."]]},{"h":"过去","p":"guòqù","m":"früher; die Vergangenheit; vorbeigehen","c":"hsk3","l":"de","i":47,"L":2,"Le":0,"x":[["过去的事情就不要说了。","Guòqù de shì qíng jiù bùyào shuōle.","Lass uns nicht über Vergangenes reden."],["我过去很喜欢在这个教室看书。","Wǒ guòqù hěn xǐhuān zài zhège jiàoshì kànshū.","Früher habe ich in diesem Klassenzimmer gern gelesen."]]},{"h":"担心","p":"dānxīn","m":"sich Sorgen machen","c":"hsk3","l":"de","i":48,"L":3,"Le":0,"x":[["你一点儿都不担心啊？","Nǐ yīdiǎn er dōu bù dānxīn a?","Machst du dir gar keine Sorgen?"],["我有点担心他明天上课会迟到。","Wǒ yǒudiǎn dānxīn tā míngtiān shàngkè huì chídào.","Ich mache mir etwas Sorgen, dass er morgen zu spät zum Unterricht kommt."]]},{"h":"条","p":"tiáo","m":"ZEW für lange, schmale Dinge","c":"hsk3","l":"de","i":49,"L":2,"Le":0,"x":[["好大的一条鱼啊","Hào dà de yītiáo yú a","Was für ein großer Fisch!"],["你知道这条街道有多长吗？","Nǐ zhīdào zhè tiáo jiēdào yǒu duō zhǎng ma?","Weißt du, wie lang diese Straße ist?"]]},{"h":"以前","p":"yǐqián","m":"früher; vorher","c":"hsk3","l":"de","i":50,"L":3,"Le":0,"x":[["以前你是做什么的啊？","Yǐqián nǐ shì zuò shénme de a?","Was hast du früher gemacht?"],["我妈妈以前是个漂亮的女孩。","Wǒ māmā yǐqián shìgè piàoliang de nǚhái.","Meine Mutter war früher ein hübsches Mädchen."]]},{"h":"长","p":"cháng, zhǎng","m":"lang | (zhǎng) wachsen","c":"hsk3","l":"de","i":51,"L":2,"Le":0,"x":[["你的头发一点儿都不长","Nǐ de tóufǎ yīdiǎn er dōu bù cháng","Deine Haare sind überhaupt nicht lang."],["我长大以后想要成为一位卖衣服的人。","Wǒ zhǎng dà yǐhòu xiǎng yào chéngwéi yī wèi mài yīfú de rén.","Wenn ich groß bin, möchte ich Kleidung verkaufen."]]},{"h":"世界","p":"shìjiè","m":"die Welt","c":"hsk3","l":"de","i":52,"L":3,"Le":0,"x":[["世界很大。","Shìjiè hěn dà.","Die Welt ist groß."],["我希望可以去世界的每个地方旅游。","Wǒ xīwàng kěyǐ qù shìjiè de měi gè dìfāng lǚyóu.","Ich möchte überall auf der Welt hinreisen."]]},{"h":"重要","p":"zhòngyào","m":"wichtig","c":"hsk3","l":"de","i":53,"L":3,"Le":0,"x":[["爸爸妈妈对我很重要","Bàba māmā duì wǒ hěn zhòngyào","Meine Eltern sind mir sehr wichtig."],["她对我来说是个重要的人。","Tā duì wǒ lái shuō shìgè zhòngyào de rén.","Sie ist ein wichtiger Mensch für mich."]]},{"h":"别人","p":"biéren","m":"andere (Leute)","c":"hsk3","l":"de","i":54,"L":3,"Le":0,"x":[["别人的东西就是好。","Biérén de dōngxī jiùshì hǎo.","Die Sachen der anderen sind immer besser."],["他希望别人同意他去中国旅游。","Tā xīwàng biérén tóngyì tā qù zhōngguó lǚyóu.","Er hofft, dass die anderen seiner China-Reise zustimmen."]]},{"h":"机会","p":"jīhuì","m":"die Gelegenheit; die Chance","c":"hsk3","l":"de","i":55,"L":3,"Le":0,"x":[["这是很好的机会","Zhè shì hěn hǎo de jīhuì","Das ist eine sehr gute Gelegenheit."],["这家公司给了我工作的机会。","Zhè jiā gōngsī gěile wǒ gōngzuò de jīhuì.","Diese Firma hat mir die Chance auf eine Arbeit gegeben."]]},{"h":"张","p":"zhāng","m":"ZEW für flache Dinge (Papier, Tisch, Bett)","c":"hsk3","l":"de","i":56,"L":3,"Le":0,"x":[["这不就是一张纸！","Zhè bù jiùshì yī zhāng zhǐ!","Das ist doch nur ein Blatt Papier!"],["你能数一数家里有多少张椅子吗？","Nǐ néng shǔ yī shǔ jiā li yǒu duōshǎo zhāng yǐzi ma?","Kannst du zählen, wie viele Stühle wir zu Hause haben?"]]},{"h":"接","p":"jiē","m":"abholen; empfangen; annehmen","c":"hsk3","l":"de","i":57,"L":3,"Le":0,"x":[["你接到人了吗？","Nǐ jiēdào rénle ma?","Hast du die Person abgeholt?"],["我到机场接下飞机的儿子了。","Wǒ dào jīchǎng jiē xià fēijī de érzi le.","Ich habe meinen Sohn am Flughafen abgeholt."]]},{"h":"比赛","p":"bǐsài","m":"der Wettkampf; das Spiel","c":"hsk3","l":"de","i":58,"L":3,"Le":0,"x":[["比赛怎么样？","Bǐsài zěnme yàng?","Wie war das Spiel?"],["这场比赛对我来说很重要。","Zhè chǎng bǐsài duì wǒ lái shuō hěn zhòngyào.","Dieses Spiel ist mir sehr wichtig."]]},{"h":"关","p":"guān","m":"schließen; zumachen; auss ,"m":"vorbeigehen an; durch","c":"hsk3","l":"de","i":185,"L":3,"Le":0,"x":[["昨天你经过学校了吗？","Zuótiān nǐ jīngguò xuéxiàole ma?","Bist du gestern an der Schule vorbeigekommen?"],["经过这件事，我学会了很多东西。","Jīngguò zhè jiàn shì, wǒ xuéhuìle hěnduō dōngxī.","Durch diese Sache habe ich viel gelernt."]]},{"h":"周末","p":"zhōumò","m":"das Wochenende","c":"hsk3","l":"de","i":186,"L":3,"Le":0,"x":[["周末你去游泳吗？","Zhōumò nǐ qù yóuyǒng ma?","Gehst du am Wochenende schwimmen?"],["今天是周末，所以我没去上班。","Jīntiān shì zhōumò, suǒyǐ wǒ méi qù shàngbān.","Heute ist Wochenende, deshalb bin ich nicht zur Arbeit gegangen."]]},{"h":"班","p":"bān","m":"die Klasse; die Schicht","c":"hsk3","l":"de","i":187,"L":2,"Le":0,"x":[["我们是一个班的。","Wǒmen shì yīgè bān de.","Wir sind in derselben Klasse."],["你的年级有多少个班？","Nǐ de niánjí yǒu duōshǎo gè bān?","Wie viele Klassen gibt es in deiner Stufe?"]]},{"h":"习惯","p":"xíguàn","m":"die Gewohnheit; gewohnt sein","c":"hsk3","l":"de","i":188,"L":3,"Le":0,"x":[["你有什么习惯？","Nǐ yǒu shé me xíguàn?","Was für Gewohnheiten hast du?"],["每天都运动是一个好习惯。","Měitiān dū yùndòng shì yīgè hǎo xíguàn.","Jeden Tag Sport zu machen ist eine gute Gewohnheit."]]},{"h":"公园","p":"gōngyuán","m":"der Park","c":"hsk3","l":"de","i":189,"L":3,"Le":0,"x":[["我特别喜欢去公园","Wǒ tèbié xǐhuān qù gōngyuán","Ich gehe besonders gern in den Park."],["我奶奶每天都去公园运动。","Wǒ nǎinai měitiān dū qù gōngyuán yùndòng.","Meine Oma macht jeden Tag Sport im Park."]]},{"h":"干净","p":"gānjìng","m":"sauber","c":"hsk3","l":"de","i":190,"L":3,"Le":0,"x":[["你的房间真干净","Nǐ de fángjiān zhēn gānjìng","Dein Zimmer ist wirklich sauber."],["他的房间总是很干净。","Tā de fángjiān zǒng shì hěn gānjìng.","Sein Zimmer ist immer sauber."]]},{"h":"鸟","p":"niǎo","m":"der Vogel","c":"hsk3","l":"de","i":191,"L":2,"Le":0,"x":[["树上有一只鸟。","Shùshàng yǒu yīzhī niǎo.","Auf dem Baum sitzt ein Vogel."]]},{"h":"我很喜欢鸟","p":"wǒ hěn xǐhuān niǎo","m":"Ich mag Vögel sehr.","c":"hsk3","l":"de","i":192,"L":2,"Le":1,"x":[["早上的鸟儿都很喜欢唱歌。","Zǎoshang de niǎo er dōu hěn xǐhuān chànggē.","Morgens singen die Vögel gern."]]},{"h":"健康","p":"jiànkāng","m":"gesund; die Gesundheit","c":"hsk3","l":"de","i":193,"L":3,"Le":0,"x":[["多吃水果对健康好。","Duō chīshuǐguǒ duì jiànkāng hǎo.","Viel Obst essen ist gut für die Gesundheit."]]},{"h":"健康最重要","p":"jiànkāng zuì zhòngyào","m":"Gesundheit ist das Wichtigste.","c":"hsk3","l":"de","i":194,"L":3,"Le":1,"x":[["他是一个很健康的人，因为他每天都去打篮球。","Tā shì yīgè hěn jiànkāng de rén, yīnwèi tā měitiān dū qù dǎ lánqiú.","Er ist sehr gesund, weil er jeden Tag Basketball spielt."]]},{"h":"树","p":"shù","m":"der Baum","c":"hsk3","l":"de","i":195,"L":3,"Le":0,"x":[["我们要多种树。","Wǒmen yào duō zhǒng shù.","Wir sollten mehr Bäume pflanzen."],["我家门口有一棵树。","Wǒjiā ménkǒu yǒu yī kē shù.","Vor meiner Haustür steht ein Baum."]]},{"h":"蛋糕","p":"dàngāo","m":"der Kuchen","c":"hsk3","l":"de","i":196,"L":3,"Le":0,"x":[["我的妹妹不喜欢吃蛋糕","Wǒ de mèimei bù xǐhuān chī dàngāo","Meine kleine Schwester isst nicht gern Kuchen."],["我在他生日的时候为他做了一个蛋糕。","Wǒ zài tā shēngrì de shíhòu wèi tā zuòle yīgè dàngāo.","Zu seinem Geburtstag habe ich ihm einen Kuchen gebacken."]]},{"h":"元","p":"yuán","m":"der Yuan (Währung)","c":"hsk3","l":"de","i":197,"L":1,"Le":0,"x":[["这本书二十元。","Zhè běnshū èrshíyuán.","Dieses Buch kostet zwanzig Yuan."]]},{"h":"给你一元钱","p":"gěi nǐ yīyuán qián","m":"Hier hast du einen Yuan.","c":"hsk3","l":"de","i":198,"L":2,"Le":1,"x":[["这件衣服是139元。","Zhè jiàn yīfú shì 139 yuán.","Dieses Kleidungsstück kostet 139 Yuan."]]},{"h":"客人","p":"kèrén","m":"der Gast","c":"hsk3","l":"de","i":199,"L":3,"Le":0,"x":[["我回来了！啊？我们有客人啊？","Wǒ huíláile! A? Wǒmen yǒu kèrén a?","Ich bin zurück! Oh? Haben wir Gäste?"],["每次家里来客人的时候我儿子都很安静。","Měi cì jiālǐ lái kèrén de shíhòu wǒ érzi dōu hěn ānjìng.","Immer wenn Gäste kommen, ist mein Sohn sehr still."]]},{"h":"会议","p":"huìyì","m":"die Besprechung; die Konferenz","c":"hsk3","l":"de","i":200,"L":3,"Le":0,"x":[["昨天的会议怎么样啊？","Zuótiān de huìyì zěnme yàng a?","Wie war die Besprechung gestern?"],["今天他参加了公司的会议。","Jīntiān tā cānjiāle gōngsī de huìyì.","Heute hat pa ist sehr gesund."],["我爷爷和奶奶结婚很多年了。","Wǒ yéyé hé nǎinǎi jiéhūn hěnduōnián le.","Mein Opa und meine Oma sind schon viele Jahre verheiratet."]]},{"h":"蓝","p":"lán","m":"blau","c":"hsk3","l":"de","i":209,"L":3,"Le":0,"x":[["她有双蓝眼睛","Tā yǒu shuāng lán yǎnjīng","Sie hat blaue Augen."],["今天是晴天，而且天空很蓝。","Jīntiān shì qíngtiān, érqiě tiānkōng hěn lán.","Heute ist es sonnig und der Himmel ist sehr blau."]]},{"h":"难过","p":"nánguò","m":"traurig","c":"hsk3","l":"de","i":210,"L":3,"Le":0,"x":[["听到这个消息，她很难过。","Tīngdào zhège xiāoxī, tā hěn nánguò.","Als sie die Nachricht hörte, war sie sehr traurig."]]},{"h":"你不要难过","p":"nǐ bùyào nánguò","m":"Sei nicht traurig.","c":"hsk3","l":"de","i":211,"L":3,"Le":1,"x":[["他很难过，因为他没通过考试。","Tā hěn nánguò, yīnwèi tā méi tōngguò kǎoshì.","Er ist traurig, weil er die Prüfung nicht bestanden hat."]]},{"h":"中间","p":"zhōngjiān","m":"die Mitte; zwischen","c":"hsk3","l":"de","i":212,"L":3,"Le":0,"x":[["中间那个是什么？","Zhōngjiān nàgè shì shénme?","Was ist das in der Mitte?"],["他们的孩子晚上睡在他们中间。","Tāmen de háizi wǎnshàng shuì zài tāmen zhōngjiān.","Ihr Kind schläft nachts zwischen ihnen."]]},{"h":"帽子","p":"màozi","m":"der Hut; die Mütze","c":"hsk3","l":"de","i":213,"L":4,"Le":0,"x":[["你的帽子坏了","Nǐ de màozi huàile","Dein Hut ist kaputt."],["他的帽子上面有一只猫。","Tā de màozi shàngmiàn yǒu yī zhǐ māo.","Auf seinem Hut ist eine Katze."]]},{"h":"司机","p":"sījī","m":"der Fahrer","c":"hsk3","l":"de","i":214,"L":3,"Le":0,"x":[["出租车司机也不容易。","Chūzū chē sījī yě bù róngyì.","Taxifahrer haben es auch nicht leicht."],["这个司机把他带到他想去的城市。","Zhège sījī bǎ tā dài dào tā xiǎng qù de chéngshì.","Der Fahrer brachte ihn in die Stadt, in die er wollte."]]},{"h":"旧","p":"jiù","m":"alt (nicht neu); gebraucht","c":"hsk3","l":"de","i":215,"L":3,"Le":0,"x":[["这个手表旧了。","Zhège shǒubiǎo jiùle.","Diese Uhr ist alt."],["他喜欢用新的东西和别人换旧手表。","Tā xǐhuān yòng xīn de dōngxī hé biérén huàn jiù shǒubiǎo.","Er tauscht gern neue Sachen gegen alte Uhren."]]},{"h":"满意","p":"mǎnyì","m":"zufrieden","c":"hsk3","l":"de","i":216,"L":3,"Le":0,"x":[["我很不满意。","Wǒ hěn bù mǎnyì.","Ich bin sehr unzufrieden."],["他对她的工作很满意。","Tā duì tā de gōngzuò hěn mǎnyì.","Er ist mit ihrer Arbeit sehr zufrieden."]]},{"h":"骑","p":"qí","m":"reiten; (Rad) fahren","c":"hsk3","l":"de","i":217,"L":3,"Le":0,"x":[["我不会骑马。","Wǒ bù huì qímǎ.","Ich kann nicht reiten."],["有机会我想试一下骑马。","Yǒu jīhuì wǒ xiǎng shì yīxià qímǎ.","Wenn ich die Gelegenheit habe, möchte ich reiten ausprobieren."]]},{"h":"太阳","p":"tàiyáng","m":"die Sonne","c":"hsk3","l":"de","i":218,"L":3,"Le":0,"x":[["下雨的时候会有太阳吗？","Xià yǔ de shíhòu huì yǒu tàiyáng ma?","Kann die Sonne scheinen, wenn es regnet?"],["太阳升起来的时候我就要去上班了。","Tàiyáng shēng qǐlái de shíhòu wǒ jiù yào qù shàngbānle.","Wenn die Sonne aufgeht, muss ich zur Arbeit."]]},{"h":"极","p":"jí","m":"äußerst; extrem","c":"hsk3","l":"de","i":219,"L":3,"Le":0,"x":[["明天极有可能下雨。","Míngtiānjí yǒu kěnéng xià yǔ.","Morgen regnet es sehr wahrscheinlich."],["我极喜欢在这样的公司上班。","Wǒ jí xǐhuān zài zhèyàng de gōngsī shàngbān.","Ich arbeite sehr gern in so einer Firma."]]},{"h":"主要","p":"zhǔyào","m":"hauptsächlich; Haupt-","c":"hsk3","l":"de","i":220,"L":3,"Le":0,"x":[["你的工作主要是做什么的？","Nǐ de gōngzuò zhǔyào shi zuò shénme de?","Was machst du hauptsächlich bei deiner Arbeit?"],["他今天最主要的事情就是去机场接他儿子。","Tā jīntiān zuì zhǔyào de shìqíng jiùshì qù jīchǎng jiē tā érzi.","Das Wichtigste für ihn heute ist, seinen Sohn vom Flughafen abzuholen."]]},{"h":"同事","p":"tóngshì","m":"der Kollege","c":"hsk3","l":"de","i":221,"L":3,"Le":0,"x":[["你跟他是同事吗？","Nǐ gēn tā shì tóngshì ma?","Bist du sein Kollege?"],["我的同事都很喜欢在公司吃西瓜。","Wǒ de tóngshì dōu hěn xǐhuān zài gōngsī chī xīguā.","Meine Kollegen essen in der Firma alle gern Wassermelone."]]},{"h":"鼻子","p":"bízi","m":"die Nase","c":"hsk3","l":"de","i":222,"L":4,"Le":0,"x":[["你的鼻子好高。","Nǐ de bízi hào gāo.","Du hast eine hohe Nase."],["他觉得自己的鼻子很好看。","Tā juédé zìjǐ de bízi hěn hǎokàn.","Er findet seine Nase schön."]]},{"h":"角","p":"jiǎo, jué","m":"die Ecke; der Winkel | der Jiao (0,10 Yuan)","c":"hsk3","l":"de","i":223,"L":3,"Le":0,"x":[["找你三角钱。","Zhǎo nǐ sānjiǎo qián.","Hier sind dreißig Fen Wechselgeld."],["他给了他5岁的儿子5角钱，他儿子很开心。","Tā gěile tā 5 suì de érzi 5 jiǎo qián, tā érzi hěn kāixīn.","Er gab seinem fünfjährigen Sohn fünf Jiao, und der Sohn war sehr froh."]]},{"h":"变化","p":"biànhuà","m":"die Veränderung; sich verändern","c":"hsk3","l":"de","i":224,"L":3,"Le":0,"x":[["你的妹妹变化真大。","Nǐ de mèimei biànhuà zhēn dà.","Deine Schwester hat sich sehr verändert."],["过去的五年这个国家发生了很大的变化。","Guòqù de wǔ nián zhège guójiā fāshēngle hěn dà de biànhuà.","In den letzten fünf Jahren hat sich dieses Land stark verändert."]]},{"h":"东","p":"dōng","m":"der Osten","c":"hsk3","l":"de","i":225,"L":3,"Le":0,"x":[["我们不往东走吗？","Wǒmen bù wǎng dōng zǒu ma?","Gehen wir nicht nach Osten?"],["我今天看到了从东边升起的太阳。","Wǒ jīntiān kàn dàole cóng dōngbian shēng qǐ de tàiyáng.","Heute habe ich die Sonne im Osten aufgehen sehen."]]},{"h":"年级","p":"niánjí","m":"die Klassenstufe; das Schuljahr","c":"hsk3","l":"de","i":226,"L":3,"Le":0,"x":[["你上几年级啊？","Nǐ shàng jǐ niánjí a?","In welche Klasse gehst du?"],["你儿子今年读几年级了？","Nǐ érzi jīnnián dú jǐ niánjíle?","In welche Klasse geht dein Sohn dieses Jahr?"]]},{"h":"环境","p":"huánjìng","m":"die Umwelt; die Umgebung","c":"hsk3","l":"de","i":227,"L":3,"Le":0,"x":[["学校的环境怎么样？","Xuéxiào de huánjìng zěnme yàng?","Wie ist die Umgebung an der Schule?"],["我喜欢我现在的工作环境。","Wǒ xǐhuān wǒ xiànzài de gōngzuò huánjìng.","Ich mag mein jetziges Arbeitsumfeld."]]},{"h":"胖","p":"pàng","m":"dick","c":"hsk3","l":"de","i":228,"L":3,"Le":0,"x":[["你长胖了。","Nǐ zhǎng pàngle.","Du hast zugenommen."],["自从他回家之后就变胖了。","Zìcóng tā huí jiā zhīhòu jiù biàn pàngle.","Seit er wieder zu Hause ist, ist er dicker geworden."]]},{"h":"地图","p":"dìtú","m":"die Landkarte","c":"hsk3","l":"de","i":229,"L":3,"Le":0,"x":[["你看到地图了吗？","Nǐ kàn dào dìtúle ma?","Hast du die Karte gesehen?"],["在中国旅游我需要带着一张地图。","Zài zhōngguó lǚyóu wǒ xūyào dàizhe yī zhāng dìtú.","Auf Reisen in China brauche ich eine Landkarte."]]},{"h":"面包","p":"miànbāo","m":"das Brot","c":"hsk3","l":"de","i":230,"L":1,"Le":0,"x":[["昨天的面包真好吃","Zuótiān de miànbāo zhēn hào chī","Das Brot gestern war wirklich lecker."],["我今天的早餐是面包加牛奶。","Wǒ jīntiān de zǎocān shì miànbāo jiā niúnǎi.","Mein Frühstück heute war Brot mit Milch."]]},{"h":"电子邮件","p":"diànzǐ yóujiàn","m":"die E-Mail","c":"hsk3","l":"de","i":231,"L":4,"Le":1,"x":[["我发电子邮件给你。","Wǒ fā diànzǐ yóujiàn gěi nǐ.","Ich schicke dir eine E-Mail."],["如果有什么事你可以给我发电子邮件。","Rúguǒ yǒu shé me shì nǐ kěyǐ gěi wǒ fā diànzǐ yóujiàn.","Wenn etwas ist, kannst du mir eine E-Mail schreiben."]]},{"h":"耳朵","p":"ěrduo","m":"das Ohr","c":"hsk3","l":"de","i":232,"L":3,"Le":0,"x":[["我们有两只耳朵。","Wǒmen yǒu liǎng zhī ěrduǒ.","Wir haben zwei Ohren."],["小猫的耳朵是三角形的。","Xiǎomāo de ěrduǒ shì sānjiǎoxíng de.","Die Ohren des Kätzchens sind dreieckig."]]},{"h":"裙子","p":"qúnzi","m":"der Rock","c":"hsk3","l":"de","i":233,"L":3,"Le":0,"x":[["你不喜欢这条裙子？","Nǐ bù xǐhuān zhè tiáo qúnzi?","Magst du diesen Rock nicht?"],["你今天穿的裙子很漂亮。","Nǐ jīntiān chuān de qúnzi hěn piàoliang.","Der Rock, den du heute trägst, ist sehr schön."]]},{"h":"新鲜","p":"xīnxiān","m":"frisch","c":"hsk3","l":"de","i":234,"L":3,"Le":0,"x":[["这个西瓜新鲜吗？","Zhège xīguā xīnxiān ma?","Ist diese Wassermelone frisch?"],["她做蛋糕的时候喜欢在上面放新鲜水果。","Tā zuò dàngāo de shíhòu xǐhuān zài shàngmiàn fàng xīnxiān shuǐguǒ.","Wenn sie Kuchen backt, legt sie gern frisches Obst darauf."]]},{"h":"放心","p":"fàng xīn","m":"beruhigt sein; sich keine Sorgen machen","c":"hsk3","l":"de","i":235,"L":3,"Le":0,"x":[["你就放心吧。","Nǐ jiù fàngxīn ba.","Mach dir keine Sorgen."],["这家店的菜很新鲜，所以你可以放心吃。","Zhèjiā diàn de cài hěn xīnxiān, suǒyǐ nǐ kěyǐ fàngxīn chī.","Das Essen hier ist frisch, du kannst es beruhigt essen."]]},{"h":"聊天","p":"liáotiān","m":"plaudern; chatten","c":"hsk3","l":"de","i":236,"L":4,"Le":1,"x":[["我很喜欢跟你聊天。","Wǒ hěn xǐhuān gēn nǐ liáotiān.","Ich plaudere sehr gern mit dir."],["我很喜欢和快乐的人聊天。","Wǒ hěn xǐhuān hé kuàilè de rén liáotiān.","Ich unterhalte mich gern mit fröhliche /* ===== drawing helpers (all sprites: origin = bottom-centre, y up is negative) ===== */
var K='#3b3530',SW=2.4;
function st(f,w){return 'fill="'+f+'" stroke="'+K+'" stroke-width="'+(w||SW)+'" stroke-linejoin="round" stroke-linecap="round"'}
function R(x,y,w,h,f,r,sw){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r||0)+'" '+st(f,sw)+'/>'}
function C(x,y,r,f,sw){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" '+st(f,sw)+'/>'}
function E(x,y,rx,ry,f,sw){return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" '+st(f,sw)+'/>'}
function P(d,f,sw){return '<path d="'+d+'" '+st(f,sw)+'/>'}
function L(x1,y1,x2,y2,w,c){return '<path d="M'+x1+' '+y1+'L'+x2+' '+y2+'" stroke="'+(c||K)+'" stroke-width="'+(w||SW)+'" stroke-linecap="round" fill="none"/>'}
function PL(d,w,c){return '<path d="'+d+'" stroke="'+(c||K)+'" stroke-width="'+(w||SW)+'" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'}
function NF(d,f,o){return '<path d="'+d+'" fill="'+f+'"'+(o!=null?' opacity="'+o+'"':'')+'/>'}
function NR(x,y,w,h,f,r,o){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r||0)+'" fill="'+f+'"'+(o!=null?' opacity="'+o+'"':'')+'/>'}
function NE(x,y,rx,ry,f,o){return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="'+f+'"'+(o!=null?' opacity="'+o+'"':'')+'/>'}
function T(x,y,s,txt,fs,col,anchor){return '<text x="'+x+'" y="'+y+'" font-size="'+fs+'" fill="'+(col||K)+'" text-anchor="'+(anchor||'middle')+'" font-weight="700" font-family="system-ui,\'PingFang SC\',\'Noto Sans SC\',sans-serif">'+txt+'</text>'}
function G(tr,inner){return '<g transform="'+tr+'">'+inner+'</g>'}
function shade(hex,a){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  function f(c){return Math.max(0,Math.min(255,Math.round(a<0?c*(1+a):c+(255-c)*a)))}
  return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1)}
function shadow(w){return NE(0,0,w/2,Math.max(3,w*0.07),'#000',0.13)}
