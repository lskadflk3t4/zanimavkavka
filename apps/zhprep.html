<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>中文 · 介词 Prepositions</title><style>:root{--bg:#f2f4f0;--sheet:#fff;--ink:#1c2421;--muted:#5d6b65;--line:#d5ddd8;--accent:#2f7a5f;--accent-soft:#e2efe9;--on:#fff;--red:#b4442f;--red-soft:#f8e6e1;--green:#2f7a4a;--green-soft:#e3f2e7;--gold:#9a6a12;--gold-soft:#f6ecd6;--blue:#2c5d9b;--blue-soft:#e3ecf7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141a18;--sheet:#1c2422;--ink:#e6ece8;--muted:#97a6a0;--line:#2f3b37;--accent:#6cc4a0;--accent-soft:#1d3029;--on:#0f1a15;--red:#f08f78;--red-soft:#3a221d;--green:#7fd49a;--green-soft:#1d3326;--gold:#e0b45e;--gold-soft:#2f2717;--blue:#8fb8ef;--blue-soft:#1c2738;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.zh{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:12px 14px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}header.top h1{margin:0;font-size:1.25rem;flex:1;min-width:200px}header.top h1 small{color:var(--muted);font-weight:500;font-size:.85rem}
.stats{display:flex;gap:14px}.stat{text-align:center}.stat b{display:block;font-size:1.1rem;line-height:1.1}.stat span{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 .95rem system-ui,sans-serif;padding:10px 14px 9px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;min-height:44px;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}.tabs .n{background:var(--red);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 6px}
.muted{color:var(--muted)}button{font-family:inherit}
.pri{appearance:none;border:1.5px solid var(--accent);background:var(--accent);color:var(--on);border-radius:12px;min-height:44px;padding:8px 16px;font-weight:700;font-size:.95rem;cursor:pointer}.pri:disabled{opacity:.45;cursor:default}
.ghost{appearance:none;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:12px;min-height:40px;padding:6px 12px;font-weight:600;font-size:.9rem;cursor:pointer}
.ghost[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mode{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mode b{font-size:1rem}.mode small{color:var(--muted);line-height:1.3}.mode i{font-style:normal;font-size:.75rem;color:var(--accent);font-weight:700}.mode[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:14px 0 6px}
.qh{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;gap:10px}
.bar{height:5px;background:var(--line);border-radius:9px;margin:6px 0 10px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qp{font-size:1.35rem;font-weight:700;margin:6px 0 2px;line-height:1.3}.qsrc{color:var(--muted);margin:2px 0 8px;font-size:.95rem}
.slot{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}.slot:first-of-type{border-top:0;margin-top:4px;padding-top:2px}
.slh{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:.85rem;margin-bottom:2px}.slh .tag{margin-left:auto}
.flag{display:inline-block;width:22px;height:15px;border-radius:2px;vertical-align:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.f-ru{background:linear-gradient(#fff 0 33.3%,#0039A6 33.3% 66.6%,#D52B1E 66.6%)}.f-de{background:linear-gradient(#000 0 33.3%,#DD0000 33.3% 66.6%,#FFCE00 66.6%)}
.f-en{background:#012169;position:relative;overflow:hidden}.f-en::after{content:"";position:absolute;inset:0;background:linear-gradient(#C8102E,#C8102E) center/100% 26% no-repeat,linear-gradient(#C8102E,#C8102E) center/22% 100% no-repeat}
.f-zh{background:#EE1C25;position:relative}.f-zh::after{content:"★";position:absolute;left:2px;top:-2px;color:#FFDE00;font-size:9px}
.qsent{font-size:1.3rem;line-height:1.55;margin:6px 0}.gap{display:inline-block;min-width:2.6em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:800;padding:0 4px}
.gap.ok{border-color:var(--green);color:var(--green)}.gap.bad{border-color:var(--red);color:var(--red)}
.py{color:var(--muted);font-size:.95rem;margin:-2px 0 8px;letter-spacing:.01em}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.opts.wide{grid-template-columns:1fr}
.opt{appearance:none;position:relative;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;min-height:50px;padding:8px 10px 8px 30px;font-size:1.08rem;cursor:pointer;text-align:left;line-height:1.3}
.opt kbd{position:absolute;left:9px;top:8px;font:600 11px ui-monospace,monospace;color:var(--muted)}
.opt.right{border-color:var(--green);background:var(--green-soft)}.opt.alt{border-color:var(--gold);background:var(--gold-soft)}.opt.wrong{border-color:var(--red);background:var(--red-soft)}.opt:disabled{cursor:default}.opt.dim{opacity:.55}
.tag{display:inline-block;font:700 .75rem ui-monospace,monospace;background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:2px 7px}
.fb{margin-top:12px;font-size:1.02rem}.fb:empty{display:none}.fb.ok,.fb.bad{padding:10px 12px;border-radius:12px}.fb.ok{background:var(--green-soft)}.fb.bad{background:var(--red-soft)}
.fb .full{font-size:1.15rem;font-weight:600;margin:4px 0}.fb .py{margin:0 0 4px}
.note{background:var(--gold-soft);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.95rem}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:8px;border-radius:12px}
.tiles.ans{border:2px dashed var(--line);background:var(--sheet)}.tiles.ans.ok{border-color:var(--green);background:var(--green-soft)}.tiles.ans.bad{border-color:var(--red);background:var(--red-soft)}
.tile{appearance:none;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:1.25rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-height:46px;justify-content:center}
.tile small{font-size:.72rem;color:var(--muted)}.tile.used{visibility:hidden}
.done h3{margin:0 0 4px;font-size:1.5rem}.rev{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}.rev li{padding:8px 12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--green)}.rev li.x{border-left-color:var(--red)}.rev small{color:var(--muted)}
table.st{border-collapse:collapse;width:100%;font-size:.92rem}table.st th,table.st td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}table.st td.n{text-align:right;font-variant-numeric:tabular-nums}
.ref h3{margin:18px 0 6px;font-size:1.08rem}.ref h3:first-child{margin-top:0}.ref p{margin:6px 0}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}.ref table{border-collapse:collapse;font-size:.9rem;min-width:100%}.ref th,.ref td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.ref thead th{background:var(--accent-soft)}
.ref .ok{color:var(--green);font-weight:700}.ref .no{color:var(--red);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ml li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
@media (max-width:560px){.qp{font-size:1.18rem}.qsent{font-size:1.15rem}.opts{grid-template-columns:1fr 1fr}.opts.wide{grid-template-columns:1fr}}

var CFG={"title": "介词 Prepositions <small>Chinese coverbs · 关于 / 对于 / 对 · word order<\/small>", "docTitle": "中文 · 介词 Prepositions", "secs": [{"id": "order", "t": "词序 Word order", "d": "Build the sentence: prepositional phrase before the verb, 不/没 and 想/要/能 before the preposition."}, {"id": "pick", "t": "选介词 Choose the preposition", "d": "在 从 离 跟 给 对 往 向 朝 为了 替 把 被 连 趁 自从"}, {"id": "gd", "t": "关于 · 对于 · 对", "d": "Topic or content vs. the matter an attitude or judgement applies to. Overlaps allowed."}, {"id": "loc", "t": "方位词 Localizers", "d": "在桌子上, 在中国 (no 里), 从朋友那儿 — when to add 里/上/下/那儿."}, {"id": "en", "t": "“for” & “about” in Chinese", "d": "One English word, many Chinese constructions — or no preposition at all."}, {"id": "err", "t": "找错 Correct or not?", "d": "Spot the learner mistakes — and the sentences that only look wrong."}], "items": [{"id": "order:21ec6e1b", "sec": "order", "k": "build", "lang": "zh", "en": "I eat at home.", "t": ["我", "在家", "吃饭"], "ans": ["我在家吃饭。"], "tp": ["wǒ", "zài jiā", "chī fàn"], "pyf": "wǒ zài jiā chī fàn.", "pya": ["wǒ zài jiā chī fàn."], "note": "在 + place comes <b>before<\/b> the verb: subject + 在家 + 吃饭. English puts “at home” at the end; Chinese never does here."}, {"id": "order:a8b1ea1c", "sec": "order", "k": "build", "lang": "zh", "en": "I work in Beijing.", "t": ["我", "在北京", "工作"], "ans": ["我在北京工作。"], "tp": ["wǒ", "zài běi jīng", "gōng zuò"], "pyf": "wǒ zài běi jīng gōng zuò.", "pya": ["wǒ zài běi jīng gōng zuò."], "note": "*我工作在北京 is the classic learner error. The place where an action happens goes before the verb."}, {"id": "order:4bef9f9b", "sec": "order", "k": "build", "lang": "zh", "en": "I’m going with him.", "t": ["我", "跟他", "去"], "ans": ["我跟他去。"], "tp": ["wǒ", "gēn tā", "qù"], "pyf": "wǒ gēn tā qù.", "pya": ["wǒ gēn tā qù."], "note": "跟 + person (“with”) is a coverb phrase, so it also sits before the verb."}, {"id": "order:90f84eb6", "sec": "order", "k": "build", "lang": "zh", "en": "I want to go with you.", "t": ["我", "想", "跟你", "去"], "ans": ["我想跟你去。"], "tp": ["wǒ", "xiǎng", "gēn nǐ", "qù"], "pyf": "wǒ xiǎng gēn nǐ qù.", "pya": ["wǒ xiǎng gēn nǐ qù."], "note": "Modal verbs (想, 要, 能, 可以) go <b>before<\/b> the whole 跟你 + verb block. *我跟你想去 is wrong."}, {"id": "order:3dde7602", "sec": "order", "k": "build", "lang": "zh", "en": "I didn’t eat at home (I ate somewhere else).", "t": ["我", "没", "在家", "吃饭"], "ans": ["我没在家吃饭。"], "tp": ["wǒ", "méi", "zài jiā", "chī fàn"], "pyf": "wǒ méi zài jiā chī fàn.", "pya": ["wǒ méi zài jiā chī fàn."], "note": "没/不 normally stands before the preposition: 没在家吃饭. (我在家没吃饭 is also a sentence, but it means “I was at home and didn’t eat”.)"}, {"id": "order:3cb8a0dd", "sec": "order", "k": "build", "lang": "zh", "en": "He doesn’t study with me.", "t": ["他", "不", "跟我", "学习"], "ans": ["他不跟我学习。"], "tp": ["tā", "bù", "gēn wǒ", "xué xí"], "pyf": "tā bù gēn wǒ xué xí.", "pya": ["tā bù gēn wǒ xué xí."], "note": "Negation wraps the whole block: 不 + 跟我 + 学习."}, {"id": "order:baa4c6be", "sec": "order", "k": "build", "lang": "zh", "en": "Tomorrow I’ll study Chinese with a friend at school.", "t": ["我", "明天", "在学校", "跟朋友", "学习", "中文"], "ans": ["我明天在学校跟朋友学习中文。", "明天我在学校跟朋友学习中文。", "我明天跟朋友在学校学习中文。", "明天我跟朋友在学校学习中文。"], "tp": ["wǒ", "míng tiān", "zài xué xiào", "gēn péng you", "xué xí", "zhōng wén"], "pyf": "wǒ míng tiān zài xué xiào gēn péng you xué xí zhōng wén.", "pya": ["wǒ míng tiān zài xué xiào gēn péng you xué xí zhōng wén.", "míng tiān wǒ zài xué xiào gēn péng you xué xí zhōng wén.", "wǒ míng tiān gēn péng you zài xué xiào xué xí zhōng wén.", "míng tiān wǒ gēn péng you zài xué xiào xué xí zhōng wén."], "note": "Time first (before or after the subject), then the coverb phrases, then the verb. 在学校 and 跟朋友 can come in either order — the rule that place must come before company is too strict."}, {"id": "order:7cbffe9e", "sec": "order", "k": "build", "lang": "zh", "en": "Put the book on the table.", "t": ["你", "把书", "放", "在桌子上"], "ans": ["你把书放在桌子上。"], "tp": ["nǐ", "bǎ shū", "fàng", "zài zhuō zi shàng"], "pyf": "nǐ bǎ shū fàng zài zhuō zi shàng.", "pya": ["nǐ bǎ shū fàng zài zhuō zi shàng."], "note": "Here 在桌子上 comes <b>after<\/b> the verb: it is where the book ends up (a result), not where the action happens."}, {"id": "order:1d952388", "sec": "order", "k": "build", "lang": "zh", "en": "Who are you talking with?", "t": ["你", "跟谁", "说话"], "ans": ["你跟谁说话？"], "tp": ["nǐ", "gēn shéi", "shuō huà"], "pyf": "nǐ gēn shéi shuō huà?", "pya": ["nǐ gēn shéi shuō huà?"], "note": "Chinese never leaves a preposition at the end. The question word simply takes the place of the object: 跟谁."}, {"id": "order:73176762", "sec": "order", "k": "build", "lang": "zh", "en": "He phoned me.", "t": ["他", "给我", "打电话"], "ans": ["他给我打电话。"], "tp": ["tā", "gěi wǒ", "dǎ diàn huà"], "pyf": "tā gěi wǒ dǎ diàn huà.", "pya": ["tā gěi wǒ dǎ diàn huà."], "note": "给 + person + 打电话. English has no preposition (“phoned me”), Chinese needs 给."}, {"id": "order:5bb81f3b", "sec": "order", "k": "build", "lang": "zh", "en": "I come from China.", "t": ["我", "从中国", "来"], "ans": ["我从中国来。"], "tp": ["wǒ", "cóng zhōng guó", "lái"], "pyf": "wǒ cóng zhōng guó lái.", "pya": ["wǒ cóng zhōng guó lái."], "note": "从 + place + 来/去: the starting point comes before the verb."}, {"id": "order:6b9b0397", "sec": "order", "k": "build", "lang": "zh", "en": "My home is far from school.", "t": ["我家", "离学校", "很远"], "ans": ["我家离学校很远。"], "tp": ["wǒ jiā", "lí xué xiào", "hěn yuǎn"], "pyf": "wǒ jiā lí xué xiào hěn yuǎn.", "pya": ["wǒ jiā lí xué xiào hěn yuǎn."], "note": "Distance with no movement: A 离 B 很远/很近. Not 从."}, {"id": "order:36b3a0ea", "sec": "order", "k": "build", "lang": "zh", "en": "Phone me tomorrow.", "t": ["你", "明天", "给我", "打电话"], "ans": ["你明天给我打电话。", "明天你给我打电话。"], "tp": ["nǐ", "míng tiān", "gěi wǒ", "dǎ diàn huà"], "pyf": "nǐ míng tiān gěi wǒ dǎ diàn huà.", "pya": ["nǐ míng tiān gěi wǒ dǎ diàn huà.", "míng tiān nǐ gěi wǒ dǎ diàn huà."], "note": "Time word, then 给我, then the verb."}, {"id": "order:f74cae2e", "sec": "order", "k": "build", "lang": "zh", "en": "I can’t go with you today.", "t": ["我", "今天", "不能", "跟你", "去"], "ans": ["我今天不能跟你去。", "今天我不能跟你去。"], "tp": ["wǒ", "jīn tiān", "bù néng", "gēn nǐ", "qù"], "pyf": "wǒ jīn tiān bù néng gēn nǐ qù.", "pya": ["wǒ jīn tiān bù néng gēn nǐ qù.", "jīn tiān wǒ bù néng gēn nǐ qù."], "note": "不能 goes before 跟你, not before 去."}, {"id": "order:4d736b66", "sec": "order", "k": "build", "lang": "zh", "en": "I’m very interested in Chinese.", "t": ["我", "对中文", "很", "感兴趣"], "ans": ["我对中文很感兴趣。"], "tp": ["wǒ", "duì zhōng wén", "hěn", "gǎn xìng qù"], "pyf": "wǒ duì zhōng wén hěn gǎn xìng qù.", "pya": ["wǒ duì zhōng wén hěn gǎn xìng qù."], "note": "对 + thing + 感兴趣: the thing you are interested in goes before the verb, with 对."}, {"id": "order:13806425", "sec": "order", "k": "build", "lang": "zh", "en": "About this question, I have some thoughts.", "t": ["关于这个问题", "我", "有", "一些想法"], "ans": ["关于这个问题，我有一些想法。", "我关于这个问题有一些想法。"], "tp": ["guān yú zhè ge wèn tí", "wǒ", "yǒu", "yì xiē xiǎng fǎ"], "pyf": "guān yú zhè ge wèn tí, wǒ yǒu yì xiē xiǎng fǎ.", "pya": ["guān yú zhè ge wèn tí, wǒ yǒu yì xiē xiǎng fǎ.", "wǒ guān yú zhè ge wèn tí yǒu yì xiē xiǎng fǎ."], "note": "Both orders are grammatical. Putting the 关于 phrase first is the more usual way to set the topic, but 关于 after the subject is not wrong."}, {"id": "order:eb3e99be", "sec": "order", "k": "build", "lang": "zh", "en": "He is walking towards me.", "t": ["他", "向我", "走", "来"], "ans": ["他向我走来。"], "tp": ["tā", "xiàng wǒ", "zǒu", "lái"], "pyf": "tā xiàng wǒ zǒu lái.", "pya": ["tā xiàng wǒ zǒu lái."], "note": "向 + person/direction before the verb."}, {"id": "order:4396139c", "sec": "order", "k": "build", "lang": "zh", "en": "Turn left up ahead.", "t": ["在前面", "往左", "拐"], "ans": ["在前面往左拐。"], "tp": ["zài qián miàn", "wǎng zuǒ", "guǎi"], "pyf": "zài qián miàn wǎng zuǒ guǎi.", "pya": ["zài qián miàn wǎng zuǒ guǎi."], "note": "往 + direction + verb of movement: 往左拐."}, {"id": "order:0a70cde7", "sec": "order", "k": "build", "lang": "zh", "en": "I bought a cup of coffee for you.", "t": ["我", "给你", "买了", "一杯咖啡"], "ans": ["我给你买了一杯咖啡。"], "tp": ["wǒ", "gěi nǐ", "mǎi le", "yì bēi kā fēi"], "pyf": "wǒ gěi nǐ mǎi le yì bēi kā fēi.", "pya": ["wǒ gěi nǐ mǎi le yì bēi kā fēi."], "note": "The person who gets something: 给 + person before the verb."}, {"id": "order:cc3ee217", "sec": "order", "k": "build", "lang": "zh", "en": "I studied Chinese for three years.", "t": ["我", "学了", "三年", "中文"], "ans": ["我学了三年中文。"], "tp": ["wǒ", "xué le", "sān nián", "zhōng wén"], "pyf": "wǒ xué le sān nián zhōng wén.", "pya": ["wǒ xué le sān nián zhōng wén."], "note": "How long: the time span goes <b>after<\/b> the verb, with no preposition (English “for” disappears)."}, {"id": "order:27049b84", "sec": "order", "k": "build", "lang": "zh", "en": "He can’t even speak Chinese.", "t": ["他", "连", "中文", "都", "不会说"], "ans": ["他连中文都不会说。"], "tp": ["tā", "lián", "zhōng wén", "dōu", "bú huì shuō"], "pyf": "tā lián zhōng wén dōu bú huì shuō.", "pya": ["tā lián zhōng wén dōu bú huì shuō."], "note": "连 + the surprising thing + 都/也 + verb. Without 都/也 the sentence is incomplete."}, {"id": "order:77694abb", "sec": "order", "k": "build", "lang": "zh", "en": "My phone got stolen.", "t": ["我的手机", "被", "偷了"], "ans": ["我的手机被偷了。"], "tp": ["wǒ de shǒu jī", "bèi", "tōu le"], "pyf": "wǒ de shǒu jī bèi tōu le.", "pya": ["wǒ de shǒu jī bèi tōu le."], "note": "被 can stand straight before the verb when no one is named."}, {"id": "order:1fd64a22", "sec": "order", "k": "build", "lang": "zh", "en": "Eat it while it’s hot!", "t": ["趁热", "吃", "吧"], "ans": ["趁热吃吧！"], "tp": ["chèn rè", "chī", "ba"], "pyf": "chèn rè chī ba!", "pya": ["chèn rè chī ba!"], "note": "趁 = while a good moment lasts. A whole English clause becomes two characters."}, {"id": "order:ccc6ed6e", "sec": "order", "k": "build", "lang": "zh", "en": "I’ll run every day starting tomorrow.", "t": ["我", "从明天开始", "每天", "跑步"], "ans": ["我从明天开始每天跑步。", "从明天开始我每天跑步。"], "tp": ["wǒ", "cóng míng tiān kāi shǐ", "měi tiān", "pǎo bù"], "pyf": "wǒ cóng míng tiān kāi shǐ měi tiān pǎo bù.", "pya": ["wǒ cóng míng tiān kāi shǐ měi tiān pǎo bù.", "cóng míng tiān kāi shǐ wǒ měi tiān pǎo bù."], "note": "从…开始 marks the starting point in time."}, {"id": "order:467252ac", "sec": "order", "k": "build", "lang": "zh", "en": "I put the bag on the chair.", "t": ["我", "把包", "放", "在椅子上", "了"], "ans": ["我把包放在椅子上了。"], "tp": ["wǒ", "bǎ bāo", "fàng", "zài yǐ zi shàng", "le"], "pyf": "wǒ bǎ bāo fàng zài yǐ zi shàng le.", "pya": ["wǒ bǎ bāo fàng zài yǐ zi shàng le."], "note": "Where something ends up after 放 comes after the verb: 放在椅子上."}, {"id": "order:ea515e70", "sec": "order", "k": "build", "lang": "zh", "en": "She lives in Shanghai.", "t": ["她", "住", "在上海"], "ans": ["她住在上海。", "她在上海住。"], "tp": ["tā", "zhù", "zài shàng hǎi"], "pyf": "tā zhù zài shàng hǎi.", "pya": ["tā zhù zài shàng hǎi.", "tā zài shàng hǎi zhù."], "note": "With 住 both orders are correct — 住在上海 is the most common."}, {"id": "pick:984193ea", "sec": "pick", "k": "mc", "lang": "zh", "en": "I eat at home.", "s": "我＿家吃饭。", "o": [["在", 2], ["从", 0], ["跟", 0], ["给", 0]], "py": "wǒ ___ jiā chī fàn.", "full": "我在家吃饭。", "pyf": "wǒ zài jiā chī fàn.", "note": "Location of the action: 在.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:3832e25c", "sec": "pick", "k": "mc", "lang": "zh", "en": "I go with my friend.", "s": "我＿朋友一起去。", "o": [["跟", 2], ["给", 0], ["对", 0], ["从", 0]], "py": "wǒ ___ péng you yì qǐ qù.", "full": "我跟朋友一起去。", "pyf": "wǒ gēn péng you yì qǐ qù.", "note": "跟 (or 和) + person + 一起: “together with”.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:73307ea0", "sec": "pick", "k": "mc", "lang": "zh", "en": "He comes from China.", "s": "他＿中国来。", "o": [["从", 2], ["离", 0], ["在", 0], ["往", 0]], "py": "tā ___ zhōng guó lái.", "full": "他从中国来。", "pyf": "tā cóng zhōng guó lái.", "note": "Starting point of a movement: 从.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:06ea15a5", "sec": "pick", "k": "mc", "lang": "zh", "en": "My home is close to school.", "s": "我家＿学校很近。", "o": [["离", 2], ["从", 0], ["在", 0], ["跟", 0]], "py": "wǒ jiā ___ xué xiào hěn jìn.", "full": "我家离学校很近。", "pyf": "wǒ jiā lí xué xiào hěn jìn.", "note": "Distance between two points, nothing moves: 离.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:09b463a4", "sec": "pick", "k": "mc", "lang": "zh", "en": "There are still three days until the Spring Festival.", "s": "＿春节还有三天。", "o": [["离", 2], ["从", 0], ["到", 0], ["在", 0]], "py": "___ chūn jié hái yǒu sān tiān.", "full": "离春节还有三天。", "pyf": "lí chūn jié hái yǒu sān tiān.", "note": "离 also measures time still left before something.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:a6bea231", "sec": "pick", "k": "mc", "lang": "zh", "en": "I bought a cup of coffee for you.", "s": "我＿你买了一杯咖啡。", "o": [["给", 2], ["为", 1], ["替", 0], ["对", 0]], "py": "wǒ ___ nǐ mǎi le yì bēi kā fēi.", "full": "我给你买了一杯咖啡。", "pyf": "wǒ gěi nǐ mǎi le yì bēi kā fēi.", "note": "给 marks the person who receives. 为 is also possible (a bit more formal). 替 would mean “instead of you”.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:f0c737ee", "sec": "pick", "k": "mc", "lang": "zh", "en": "He’s ill, so I’ll go to the meeting for him (in his place).", "s": "他病了，我＿他去开会。", "o": [["替", 2], ["给", 0], ["对", 0], ["跟", 0]], "py": "tā bìng le, wǒ ___ tā qù kāi huì.", "full": "他病了，我替他去开会。", "pyf": "tā bìng le, wǒ tì tā qù kāi huì.", "note": "替 = doing something in someone’s place.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:d8c2d1d9", "sec": "pick", "k": "mc", "lang": "zh", "en": "He runs every day for his health.", "s": "＿健康，他每天跑步。", "o": [["为了", 2], ["给", 0], ["对", 0], ["替", 0]], "py": "___ jiàn kāng, tā měi tiān pǎo bù.", "full": "为了健康，他每天跑步。", "pyf": "wèi le jiàn kāng, tā měi tiān pǎo bù.", "note": "Purpose or goal: 为了.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:5b325ce8", "sec": "pick", "k": "mc", "lang": "zh", "en": "Drinking tea is good for your body.", "s": "喝茶＿身体很好。", "o": [["对", 2], ["给", 0], ["跟", 0], ["从", 0]], "py": "hē chá ___ shēn tǐ hěn hǎo.", "full": "喝茶对身体很好。", "pyf": "hē chá duì shēn tǐ hěn hǎo.", "note": "Effect on something: 对…很好/不好.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:98b1ce11", "sec": "pick", "k": "mc", "lang": "zh", "en": "Turn left, please.", "s": "请＿左拐。", "o": [["往", 2], ["在", 0], ["从", 0], ["离", 0]], "py": "qǐng ___ zuǒ guǎi.", "full": "请往左拐。", "pyf": "qǐng wǎng zuǒ guǎi.", "note": "往 + direction for real movement.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:f9208cbb", "sec": "pick", "k": "mc", "lang": "zh", "en": "We should learn from the teacher.", "s": "我们要＿老师学习。", "o": [["向", 2], ["往", 0], ["在", 0], ["离", 0]], "py": "wǒ men yào ___ lǎo shī xué xí.", "full": "我们要向老师学习。", "pyf": "wǒ men yào xiàng lǎo shī xué xí.", "note": "向 + person: directed at someone (learn from, apologise to, ask).", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:bf455d25", "sec": "pick", "k": "mc", "lang": "zh", "en": "The window faces south.", "s": "窗户＿南。", "o": [["朝", 2], ["往", 0], ["在", 0], ["离", 0]], "py": "chuāng hu ___ nán.", "full": "窗户朝南。", "pyf": "chuāng hu cháo nán.", "note": "朝 for facing a direction; nothing moves. English needs a verb (“faces”).", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:11613fa3", "sec": "pick", "k": "mc", "lang": "zh", "en": "He can’t even speak Chinese.", "s": "他＿中文都不会说。", "o": [["连", 2], ["把", 0], ["被", 0], ["对", 0]], "py": "tā ___ zhōng wén dōu bú huì shuō.", "full": "他连中文都不会说。", "pyf": "tā lián zhōng wén dōu bú huì shuō.", "note": "连 … 都/也: “even”.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:4fe7551b", "sec": "pick", "k": "mc", "lang": "zh", "en": "I closed the door.", "s": "我＿门关上了。", "o": [["把", 2], ["被", 0], ["连", 0], ["给", 0]], "py": "wǒ ___ mén guān shàng le.", "full": "我把门关上了。", "pyf": "wǒ bǎ mén guān shàng le.", "note": "把 pulls the object (门) before the verb to show what happened to it.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:874fabeb", "sec": "pick", "k": "mc", "lang": "zh", "en": "My phone got stolen.", "s": "我的手机＿偷了。", "o": [["被", 2], ["把", 0], ["连", 0], ["对", 0]], "py": "wǒ de shǒu jī ___ tōu le.", "full": "我的手机被偷了。", "pyf": "wǒ de shǒu jī bèi tōu le.", "note": "被 marks the passive; the agent can be left out.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:45e26047", "sec": "pick", "k": "mc", "lang": "zh", "en": "Eat it while it’s hot!", "s": "＿热吃吧！", "o": [["趁", 2], ["在", 0], ["从", 0], ["为了", 0]], "py": "___ rè chī ba!", "full": "趁热吃吧！", "pyf": "chèn rè chī ba!", "note": "趁 = take advantage of a passing condition.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:e6f41077", "sec": "pick", "k": "mc", "lang": "zh", "en": "Who are you talking to?", "s": "你＿谁说话？", "o": [["跟", 2], ["对", 1], ["给", 0], ["从", 0]], "py": "nǐ ___ shéi shuō huà?", "full": "你跟谁说话？", "pyf": "nǐ gēn shéi shuō huà?", "note": "跟谁说话 = talk with whom. 对谁说话 (say to whom) is also fine.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:f360bdd7", "sec": "pick", "k": "mc", "lang": "zh", "en": "He is reading on the bed.", "s": "他＿床上看书。", "o": [["在", 2], ["从", 0], ["往", 0], ["离", 0]], "py": "tā ___ chuáng shàng kàn shū.", "full": "他在床上看书。", "pyf": "tā zài chuáng shàng kàn shū.", "note": "在 + place + localizer (上) before the verb.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:07126c8b", "sec": "pick", "k": "mc", "lang": "zh", "en": "I take the train from Beijing to Shanghai.", "s": "我＿北京到上海坐火车。", "o": [["从", 2], ["离", 0], ["在", 0], ["往", 0]], "py": "wǒ ___ běi jīng dào shàng hǎi zuò huǒ chē.", "full": "我从北京到上海坐火车。", "pyf": "wǒ cóng běi jīng dào shàng hǎi zuò huǒ chē.", "note": "从 A 到 B: from A to B.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:4d3b1e79", "sec": "pick", "k": "mc", "lang": "zh", "en": "Ever since he came, we have eaten together every day.", "s": "＿他来了以后，我们每天一起吃饭。", "o": [["自从", 2], ["从", 1], ["离", 0], ["在", 0]], "py": "___ tā lái le yǐ hòu, wǒ men měi tiān yì qǐ chī fàn.", "full": "自从他来了以后，我们每天一起吃饭。", "pyf": "zì cóng tā lái le yǐ hòu, wǒ men měi tiān yì qǐ chī fàn.", "note": "自从 = ever since (a past point up to now). 从…以后 is also used.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:92c8de04", "sec": "pick", "k": "mc", "lang": "zh", "en": "I’ll phone you.", "s": "我＿你打电话。", "o": [["给", 2], ["跟", 1], ["对", 0], ["往", 0]], "py": "wǒ ___ nǐ dǎ diàn huà.", "full": "我给你打电话。", "pyf": "wǒ gěi nǐ dǎ diàn huà.", "note": "给 + person + 打电话 is standard. 跟你打电话 is common in speech too.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:be5e98d0", "sec": "pick", "k": "mc", "lang": "zh", "en": "I’m very interested in history.", "s": "我＿历史很感兴趣。", "o": [["对", 2], ["关于", 0], ["给", 0], ["跟", 0]], "py": "wǒ ___ lì shǐ hěn gǎn xìng qù.", "full": "我对历史很感兴趣。", "pyf": "wǒ duì lì shǐ hěn gǎn xìng qù.", "note": "对 + thing + 感兴趣.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:26661ea4", "sec": "pick", "k": "mc", "lang": "zh", "en": "Go straight on (towards the front).", "s": "你一直＿前走。", "o": [["往", 2], ["向", 1], ["在", 0], ["离", 0]], "py": "nǐ yì zhí ___ qián zǒu.", "full": "你一直往前走。", "pyf": "nǐ yì zhí wǎng qián zǒu.", "note": "往前走 = walk straight on. 向前走 is also fine.", "altn": "Also possible — see the note for the more usual choice."}, {"id": "pick:2f4c1e8a", "sec": "pick", "k": "mc" h", "en": "This is a book about history.", "q": "这是一本对于历史的书。", "o": [["✓ 对 — correct", 0], ["✗ 错 — wrong", 2]], "py": "zhè shì yì běn duì yú lì shǐ de shū.", "full": "这是一本对于历史的书。", "fix": "→ 这是一本关于历史的书。", "pyf": "zhè shì yì běn guān yú lì shǐ de shū.", "note": "The content of a book → 关于."}, {"id": "gd:d9bea428", "sec": "gd", "k": "mc", "lang": "zh", "en": "People have different views on this issue.", "q": "大家对于这个问题的看法不同。", "o": [["✓ 对 — correct", 2], ["✗ 错 — wrong", 0]], "py": "dà jiā duì yú zhè ge wèn tí de kàn fǎ bù tóng.", "full": "大家对于这个问题的看法不同。", "fix": "✓ 大家对于这个问题的看法不同。", "pyf": "dà jiā duì yú zhè ge wèn tí de kàn fǎ bù tóng.", "note": "Correct: 对于 + matter + 的 + 看法. The rule “对于 can’t take 的” is wrong."}, {"id": "gd:3a3b0c27", "sec": "gd", "k": "mc", "lang": "zh", "en": "As for this question, I have several views.", "q": "对于这个问题，我有几个看法。", "o": [["✓ 对 — correct", 2], ["✗ 错 — wrong", 0]], "py": "duì yú zhè ge wèn tí, wǒ yǒu jǐ gè kàn fǎ.", "full": "对于这个问题，我有几个看法。", "fix": "✓ 对于这个问题，我有几个看法。", "pyf": "duì yú zhè ge wèn tí, wǒ yǒu jǐ gè kàn fǎ.", "note": "Correct. 对于 can open a sentence just like 关于."}, {"id": "gd:9d299524", "sec": "gd", "k": "mc", "lang": "zh", "en": "I am very satisfied with this result.", "q": "我对于这个结果非常满意。", "o": [["✓ 对 — correct", 2], ["✗ 错 — wrong", 0]], "py": "wǒ duì yú zhè ge jié guǒ fēi cháng mǎn yì.", "full": "我对于这个结果非常满意。", "fix": "✓ 我对于这个结果非常满意。", "pyf": "wǒ duì yú zhè ge jié guǒ fēi cháng mǎn yì.", "note": "Correct — 对于 is a slightly more formal 对."}, {"id": "err:97874e07", "sec": "err", "k": "mc", "lang": "zh", "en": "I work in Beijing.", "q": "我工作在北京。", "o": [["✓ 对 — correct", 0], ["✗ 错 — wrong", 2]], "py": "wǒ gōng zuò zài běi jīng.", "full": "我工作在北京。", "fix": "→ 我在北京工作。", "pyf": "wǒ zài běi jīng gōng zuò.", "note": "Place of the action before the verb."}, {"id": "err:ba387391", "sec": "err", "k": "mc", "lang": "zh", "en": "I work in Beijing.", "q": "我在北京工作。", "o": [["✓ 对 — correct", 2], ["✗ 错 — wrong", 0]], "py": "wǒ zài běi jīng gōng zuò.", "full": "我在北京工作。", "fix": "✓ 我在北京工作。", "pyf": "wǒ zài běi jīng gōng zuò.", "note": "Correct."}, {"id": "err:996e3f7c", "sec": "err", "k": "mc", "lang": "zh", "en": "My home is far from school.", "q": "我家从学校很远。", "o": [["✓ 对 — correct", 0], ["✗ 错 — wrong", 2]], "py": "wǒ jiā cóng xué xiào hěn yuǎn.", "full": "我家从学校很远。", "fix": "→ 我家离学校很远。", "pyf": "wǒ jiā lí xué xiào hěn yuǎn.", "note": "Distance → 离, not 从."}, {"id": "err:1e2f9167", "sec": "err", "k": "mc", "lang": "zh", "en": "I’m coming from my friend’s place.", "q": "我从我的朋友来。", "o": [["✓ 对 — correct", 0], ["✗ 错 — wrong", 2]], "py": "wǒ cóng wǒ de péng you lái.", "full": "我从我的朋友来。", "fix": "→ 我从我的朋友那儿来。", "pyf": "wǒ cóng wǒ de péng you nàr lái.", "note": "A person needs 那儿 to become a place."}, {"id": "err:cb434991", "sec": "err", "k": "mc", "lang": "zh", "en": "I study in China.", "q": "我在中国里学习。", "o": [["✓ 对 — correct", 0], ["✗ 错 — wrong", 2]], "py": "wǒ zài zhōng guó lǐ xué xí.", "full": "我在中国里学习。", "fix": "→ 我在中国学习。", "pyf": "wǒ zài zhōng guó xué xí.", "note": "No 里 after a country name."}, {"id": "err:67455db7", "sec": "err", "k": "mc", "lang": "zh", "en": "I want to go with you.", "q": "我跟你想去。", "o": [["✓ 对 — correct", 0], ["✗ 错 — wrong", 2]], "py": "wǒ gēn nǐ xiǎng qù.", "full": "我跟你想去。", "fix": "→ 我想跟你去。", "pyf": "wǒ xiǎng gēn nǐ qù.", "note": "The modal 想 comes before 跟你."}, {"id": "err:20b08ae3", "sec": "err", "k": "mc", "lang": "zh", "en": "We discussed this problem.", "q": "我们讨论关于这个问题。", "o": [["✓ 对 — correct", 0], ["✗ 错 — wrong", 2]], "py": "wǒ men tǎo lùn guān yú zhè ge wèn tí.", "full": "我们讨论关于这个问题。", "fix": "→ 我们讨论这个问题。", "pyf": "wǒ men tǎo lùn zhè ge wèn tí.", "note": "讨论 takes a direct object. (关于…的问题 can be an object: 讨论关于这个问题的报告 — but not 讨论关于 + noun.)"}, {"id": "err:fad314f9", "sec": "err", "k": "mc", "lang": "zh", "en": "a book about China", "q": "一本关于中国的书", "o": [["✓ 对 — correct", 2], ["✗ 错 — wrong", 0]], "py": "yì běn guān yú zhōng guó de shū", "full": "一本关于中国的书", "fix": "✓ 一本关于中国的书", "pyf": "yì běn guān yú zhōng guó de shū", "note": "Correct."}, {"id": "err:32b387d9", "sec": "err", "k": "mc", "lang": "zh", "en": "I studied Chinese for three years.", "q": "我学了中文三年。", "o": [["✓ 对 — correct", 0], ["✗ 错 — wrong", 2]], "py": "wǒ xué le zhōng wén sān nián.", "full": "我学了中文三年。", "fix": "→ 我学了三年中文。", "pyf": "wǒ xué le sān nián zhōng wén.", "note": "Duration goes between verb and object (or repeat the verb: 我学中文学了三年)."}, {"id": "err:87a91c89", "sec": "err", "k": "mc", "lang": "zh", "en": "He lives in Shanghai.", "q": "他在上海住。", "o": [["✓ 对 — correct", 2], ["✗ 错 — wrong", 0]], "py": "tā zài shàng hǎi zhù.", "full": "他在上海住。", "fix": "✓ 他在上海住。", "pyf": "tā zài shàng hǎi zhù.", "note": "Correct — with 住, both 在上海住 and 住在上海 work."}, {"id": "err:2d343ebc", "sec": "err", "k": "mc", "lang": "zh", "en": "Who are you talking to?", "q": "你跟谁说话？", "o": [["✓ 对 — correct", 2], ["✗ 错 — wrong", 0]], "py": "nǐ gēn shéi shuō huà?", "full": "你跟谁说话？", "fix": "✓ 你跟谁说话？", "pyf": "nǐ gēn shéi shuō huà?", "note": "Correct — no stranded preposition."}, {"id": "err:eca99688", "sec": "err", "k": "mc", "lang": "zh", "en": "I’m waiting for you.", "q": "我等给你。", "o": [["✓ 对 — correct", 0], ["✗ 错 — wrong", 2]], "py": "wǒ děng gěi nǐ.", "full": "我等给你。", "fix": "→ 我等你。", "pyf": "wǒ děng nǐ.", "note": "等 takes the person directly."}, {"id": "err:715e3d9f", "sec": "err", "k": "mc", "lang": "zh", "en": "He can’t even speak Chinese.", "q": "他连中文不会说。", "o": [["✓ 对 — correct", 0], ["✗ 错 — wrong", 2]], "py": "tā lián zhōng wén bú huì shuō.", "full": "他连中文不会说。", "fix": "→ 他连中文都不会说。", "pyf": "tā lián zhōng wén dōu bú huì shuō.", "note": "连 needs 都 or 也."}, {"id": "err:1b9dce02", "sec": "err", "k": "mc", "lang": "zh", "en": "My phone got stolen.", "q": "我的手机被偷了。", "o": [["✓ 对 — correct", 2], ["✗ 错 — wrong", 0]], "py": "wǒ de shǒu jī bèi tōu le.", "full": "我的手机被偷了。", "fix": "✓ 我的手机被偷了。", "pyf": "wǒ de shǒu jī bèi tōu le.", "note": "Correct — 被 without an agent."}, {"id": "err:c543b17c", "sec": "err", "k": "mc", "lang": "zh", "en": "I said to him.", "q": "我对他说。", "o": [["✓ 对 — correct", 2], ["✗ 错 — wrong", 0]], "py": "wǒ duì tā shuō.", "full": "我对他说。", "fix": "✓ 我对他说。", "pyf": "wǒ duì tā shuō.", "note": "Correct: 对 + person + 说."}, {"id": "err:e91c3842", "sec": "err", "k": "mc", "lang": "zh", "en": "It’s close to school from here.", "q": "我从这儿离学校很近。", "o": [["✓ 对 — correct", 0], ["✗ 错 — wrong", 2]], "py": "wǒ cóng zhèr lí xué xiào hěn jìn.", "full": "我从这儿离学校很近。", "fix": "→ 这儿离学校很近。", "pyf": "zhèr lí xué xiào hěn jìn.", "note": "Don’t mix 从 and 离: “A 离 B 很近”."}, {"id": "err:ad8e5b3e", "sec": "err", "k": "mc", "lang": "zh", "en": "Please turn left.", "q": "请往左拐。", "o": [["✓ 对 — correct", 2], ["✗ 错 — wrong", 0]], "py": "qǐng wǎng zuǒ guǎi.", "full": "请往左拐。", "fix": "✓ 请往左拐。", "pyf": "qǐng wǎng zuǒ guǎi.", "note": "Correct."}, {"id": "err:db70b1e2", "sec": "err", "k": "mc", "lang": "zh", "en": "Tea is good for your body.", "q": "喝茶对身体很好。", "o": [["✓ 对 — correct", 2], ["✗ 错 — wrong", 0]], "py": "hē chá duì shēn tǐ hěn hǎo.", "full": "喝茶对身体很好。", "fix": "✓ 喝茶对身体很好。", "pyf": "hē chá duì shēn tǐ hěn hǎo.", "note": "Correct."}], "ref": "\n<h3>1 · Chinese prepositions are coverbs<\/h3>\n<p>Most of them are also verbs: 在 (be at), 给 (give), 跟 (follow), 到 (arrive), 用 (use). So they behave like verbs:<\/p>\n<ul><li>The prepositional phrase goes <b>before the main verb<\/b>: 我<b>在北京<\/b>工作 (not *我工作在北京).<\/li>\n<li>不/没 and modal verbs go <b>before the preposition<\/b>: 我<b>没<\/b>在家吃饭 · 我<b>想<\/b>跟你去.<\/li>\n<li>No stranding: 你<b>跟谁<\/b>说话？ — the question word sits inside the phrase.<\/li>\n<li>Exception: where something <b>ends up<\/b> comes after the verb: 把书放<b>在桌子上<\/b> · 住在上海 (住 allows both).<\/li><\/ul>\n<h3>2 · Order before the verb<\/h3>\n<p>Subject · <b>time<\/b> · coverb phrases (在 + place, 跟 + person, 用 + tool…) · verb. Time can also stand before the subject. 在学校跟朋友 and 跟朋友在学校 are both possible.<\/p>\n<h3>3 · 在 + noun + localizer<\/h3>\n<div class=\"sc\"><table><thead><tr><th>Noun<\/th><th>Rule<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>Common noun<\/td><td>add 里/上/下/后面…<\/td><td>在桌子上 · 在包里<\/td><\/tr>\n<tr><td>Country, city<\/td><td>nothing<\/td><td>在中国 · <span class=\"no\">*在中国里<\/span><\/td><\/tr>\n<tr><td>Place word (学校, 医院, 家)<\/td><td>usually nothing; 里 for “inside”<\/td><td>在学校 · 在学校里<\/td><\/tr>\n<tr><td>Person / pronoun<\/td><td>add 这儿/那儿<\/td><td>从朋友那儿 · 在我这儿<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>4 · “From” and distance<\/h3>\n<p><b>从<\/b> start of a movement or time (从北京到上海 · 从明天开始) · <b>离<\/b> static distance or time left (我家离学校很远 · 离春节还有三天) · <b>自从<\/b> ever since a past point.<\/p>\n<h3>5 · 关于 · 对于 · 对<\/h3>\n<div class=\"sc\"><table><thead><tr><th><\/th><th>关于<\/th><th>对于<\/th><th>对<\/th><\/tr><\/thead><tbody>\n<tr><td>Core<\/td><td>topic, content, scope<\/td><td>the matter a statement, attitude or judgement applies to<\/td><td>same as 对于, everyday form; also “to (a person)”<\/td><\/tr>\n<tr><td>Sentence start<\/td><td class=\"ok\">关于这个问题，我…<\/td><td class=\"ok\">对于这个问题，我…<\/td><td>possible<\/td><\/tr>\n<tr><td>After the subject<\/td><td>possible: 我关于这个问题有一些想法 (fronting is smoother)<\/td><td class=\"ok\">我对于这个结果很满意<\/td><td class=\"ok\">我对历史感兴趣<\/td><\/tr>\n<tr><td>… 的 + noun<\/td><td class=\"ok\">关于中国的书 / 文章 / 讨论<\/td><td class=\"ok\">对于这个问题的看法 / 态度 / 意见 / 反应<\/td><td class=\"ok\">对工作的态度<\/td><\/tr><\/tbody><\/table><\/div>\n<p>These are tendencies, not hard walls: in some sentences both 关于 and 对于 work and the difference is subtle. Learn them in collocations: 对…感兴趣 / 满意 / 失望 · 关于…的书.<\/p>\n<h3>6 · English “for” and “about”<\/h3>\n<div class=\"sc\"><table><thead><tr><th>English<\/th><th>Chinese<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>for (recipient)<\/td><td>给 / 为<\/td><td>我给你买了咖啡<\/td><\/tr>\n<tr><td>for (purpose)<\/td><td>为了<\/td><td>为了健康，他每天跑步<\/td><\/tr>\n<tr><td>for (instead of)<\/td><td>替<\/td><td>我替他去开会<\/td><\/tr>\n<tr><td>good for<\/td><td>对<\/td><td>喝茶对身体好<\/td><\/tr>\n<tr><td>for + time span<\/td><td>no preposition<\/td><td>我学了三年中文<\/td><\/tr>\n<tr><td>for + price<\/td><td>花 / 用 (verb)<\/td><td>我花十块钱买的<\/td><\/tr>\n<tr><td>about (content)<\/td><td>关于<\/td><td>一本关于中国的书<\/td><\/tr>\n<tr><td>about (feeling)<\/td><td>对<\/td><td>我对中国很好奇<\/td><\/tr>\n<tr><td>talk / think about<\/td><td>no preposition<\/td><td>我们在聊工作 · 我在想这件事<\/td><\/tr>\n<tr><td>about (approx.)<\/td><td>大约 … / … 左右<\/td><td>大约十点 · 十点左右<\/td><\/tr>\n<tr><td>about to<\/td><td>快要…了<\/td><td>火车快要开了<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>7 · Words with no English preposition<\/h3>\n<p><b>把<\/b> object brought before the verb (我把门关上了) · <b>被<\/b> passive, agent optional (手机被偷了) · <b>连…都/也<\/b> even · <b>趁<\/b> while the chance lasts (趁热吃) · <b>替<\/b> in place of · <b>朝<\/b> facing (窗户朝南) · <b>往<\/b> towards (movement) · <b>向<\/b> towards a person/target (向老师学习).<\/p>\n", "pinyin": true, "langName": {"zh": "中文"}, "intro": "Rules follow the corrected notes: 关于 and 对于 overlap in places, so some gaps accept both. A <b style=\"color:var(--gold)\">gold<\/b> answer is accepted but less usual."};

/* ---------- tabs ---------- */
var TAB='pr';
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)tab(b.dataset.tab)});
function tab(t){TAB=t;document.querySelectorAll('.tabs [data-tab]').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===t))});
  ['pr','mi','rf','st'].forEach(function(v){document.getElementById('v-'+v).hidden=v!==t});
  if(t==='pr'&&!RUN)home();if(t==='mi')mist();if(t==='rf')ref();if(t==='st')stats();scrollTo(0,0)}
/* ---------- practise: setup ---------- */
var RUN=null,VP=document.getElementById('v-pr');
function slotsOf(x){if(x.k!=='dual')return null;var a=[x.a,x.b];if(INST==='b')a=[x.b,x.a];if(O.langs!=='both')a=a.filter(function(s){return s.lang===O.langs});return a}
function home(){RUN=null;
  var h='<div class="panel"><div class="lbl">Sections</div><div class="modes">'+SECS.map(function(s){var all=IT.filter(function(x){return x.sec===s.id}),seen=all.filter(function(x){return S.it[x.id]&&S.it[x.id].n}).length,due=all.filter(function(x){return isDue(x.id)}).length;
    return '<button class="mode" data-sec="'+s.id+'" aria-pressed="'+(O.secs.indexOf(s.id)>=0)+'"><b>'+esc(s.t)+'</b><small>'+esc(s.d)+'</small><i>'+seen+'/'+all.length+' practised'+(due?' · '+due+' due':'')+'</i></button>'}).join('')+'</div>';
  h+='<div class="row"><button class="ghost" id="all">All sections</button><button class="ghost" id="none">None</button></div>';
  h+='<div class="lbl">Round length</div><div class="sw" id="len">'+[8,12,20,30].map(function(n){return '<button class="ghost" data-n="'+n+'" aria-pressed="'+(O.n===n)+'">'+n+'</button>'}).join('')+'</div>';
  if(CFG.dualLangs){var L=CFG.dualLangs;if(INST==='b')L=[L[1],L[0]];h+='<div class="lbl">Languages in each card</div><div class="sw" id="langs"><button class="ghost" data-l="both" aria-pressed="'+(O.langs==='both')+'">'+flag(L[0])+' + '+flag(L[1])+' both</button>'+L.map(function(l){return '<button class="ghost" data-l="'+l+'" aria-pressed="'+(O.langs===l)+'">'+flag(l)+' '+CFG.langName[l]+' only</button>'}).join('')+'</div>'}
  if(CFG.pinyin)h+='<div class="lbl">Pinyin</div><div class="sw"><button class="ghost" id="pyt" aria-pressed="'+O.py+'">'+(O.py?'Pinyin shown':'Pinyin hidden')+'</button></div>';
  var d=dueCount();h+='<div class="row" style="margin-top:18px"><button class="pri" id="go">Start round ▶</button>'+(d?'<button class="ghost" id="godue">Review '+d+' due</button>':'')+'</div></div>';
  if(CFG.intro)h+='<div class="panel note" style="margin-top:12px">'+CFG.intro+'</div>';
  VP.innerHTML=h;
  VP.querySelectorAll('[data-sec]').forEach(function(b){b.onclick=function(){var i=O.secs.indexOf(b.dataset.sec);if(i>=0)O.secs.splice(i,1);else O.secs.push(b.dataset.sec);save();home()}});
  VP.querySelector('#all').onclick=function(){O.secs=SECS.map(function(s){return s.id});save();home()};
  VP.querySelector('#none').onclick=function(){O.secs=[];save();home()};
  VP.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){O.n=+b.dataset.n;save();home()}});
  VP.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){O.langs=b.dataset.l;save();home()}});
  var p=VP.querySelector('#pyt');if(p)p.onclick=function(){O.py=!O.py;save();home()};
  VP.querySelector('#go').onclick=function(){start(pick(O.secs,O.n))};
  var g=VP.querySelector('#godue');if(g)g.onclick=function(){start(shuf(IT.filter(function(x){return isDue(x.id)})).slice(0,30))};
  VP.querySelector('#go').disabled=!O.secs.length}
function pick(secs,n){var pool=IT.filter(function(x){return secs.indexOf(x.sec)>=0});
  var due=shuf(pool.filter(function(x){return isDue(x.id)})),neu=shuf(pool.filter(function(x){return !(S.it[x.id]&&S.it[x.id].n)})),rest=shuf(pool.filter(function(x){return S.it[x.id]&&S.it[x.id].n&&!isDue(x.id)})).sort(function(a,b){return S.it[a.id].d-S.it[b.id].d});
  var out=due.slice(0,Math.ceil(n*.6));out=out.concat(neu.slice(0,n-out.length));if(out.length<n)out=out.concat(due.slice(out.length,n));if(out.length<n)out=out.concat(rest.slice(0,n-out.length));return shuf(out.slice(0,n))}
function start(list){if(!list.length)return;RUN={q:list,i:0,res:[]};tab('pr');q()}
/* ---------- practise: question ---------- */
var CUR=null;
function gapHTML(s,fill,cls,l){var p=s.split('＿');return esc(p[0])+'<span class="gap '+(cls||'')+'">'+(fill==null?'?':esc(fill)||'∅')+'</span>'+esc(p.slice(1).join('＿'))}
function q(){if(RUN.i>=RUN.q.length)return done();
  var x=RUN.q[RUN.i];CUR={x:x,ans:{},okAll:true,fin:false};var sec=SEC[x.sec];
  var h='<div class="panel"><div class="qh"><span>'+esc(sec.t)+'</span><span>'+(RUN.i+1)+' / '+RUN.q.length+'</span></div><div class="bar"><i style="width:'+(RUN.i/RUN.q.length*100)+'%"></i></div>';
  h+='<div class="qp">'+esc(x.en)+'</div>';if(x.src)h+='<div class="qsrc">'+x.src+'</div>';
  if(x.k==='build'){h+=buildHTML(x)}
  else{var sl=x.k==='dual'?slotsOf(x):[x];CUR.slots=sl;sl.forEach(function(s,i){h+=slotHTML(s,i,x.k==='dual')})}
  h+='<div class="fb" id="fb"></div><div class="row"><button class="ghost" id="quit">✕ End round</button></div></div>';
  VP.innerHTML=h;VP.querySelector('#quit').onclick=function(){done()};
  if(x.k==='build')buildWire(x);else VP.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(+b.dataset.s,+b.dataset.o)}})}
function slotHTML(s,i,dual){var h='<div class="slot" data-slot="'+i+'">';
  if(dual)h+='<div class="slh">'+flag(s.lang)+' '+esc(CFG.langName[s.lang])+'</div>';
  var cls=isZh(s.lang)?' zh':'';
  if(s.s)h+='<div class="qsent'+cls+'" id="sent'+i+'">'+gapHTML(s.s,null,'',s.lang)+'</div>';
  if(s.q)h+='<div class="qsent'+cls+'">'+esc(s.q)+'</div>';
  if(CFG.pinyin&&O.py&&s.py)h+='<div class="py">'+esc(s.py)+'</div>';
  var ord=shuf(s.o.map(function(o,j){return j}));s._ord=ord;var wide=s.o.some(function(o){return o[0].length>26});
  h+='<div class="opts'+(wide?' wide':'')+'">'+ord.map(function(j,n){var o=s.o[j];return '<button class="opt'+cls+'" data-s="'+i+'" data-o="'+j+'"><kbd>'+(n+1)+'</kbd>'+(o[0]==='∅'?'— (nothing)':esc(o[0]))+'</button>'}).join('')+'</div>';
  return h+'</div>'}
function answer(si,oi){if(CUR.fin||CUR.ans[si]!=null)return;var s=CUR.slots[si],o=s.o[oi];CUR.ans[si]=oi;
  var good=o[1]>0;if(!good)CUR.okAll=false;
  VP.querySelectorAll('.opt[data-s="'+si+'"]').forEach(function(b){var j=+b.dataset.o,f=s.o[j][1];b.disabled=true;
    if(j===oi)b.classList.add(f===2?'right':f===1?'alt':'wrong');else if(f===2)b.classList.add('right');else if(f===1)b.classList.add('alt');else b.classList.add('dim')});
  if(s.s){var best=s.o.filter(function(z){return z[1]===2})[0][0],e=VP.querySelector('#sent'+si);if(e)e.innerHTML=gapHTML(s.s,good?o[0]==='∅'?'':o[0]:best==='∅'?'':best,good?'ok':'bad')}
  if(Object.keys(CUR.ans).length===CUR.slots.length)finish()}
function finish(){CUR.fin=true;var x=CUR.x,ok=CUR.okAll;grade(x.id,ok);RUN.res.push([x,ok]);
  var h='<b>'+(ok?'✓ Right':'✗ Not quite')+'</b>';
  CUR.slots.forEach(function(s,i){var pickd=s.o[CUR.ans[i]];
    if(pickd&&pickd[1]===1&&s.altn)h+='<div class="note">'+s.altn+'</div>';
    if(s.full||s.fix||s.c){h+='<div class="full'+(isZh(s.lang)?' zh':'')+'">'+(x.k==='dual'?flag(s.lang)+' ':'')+esc(s.fix||s.full||'')+(s.c?' <span class="tag">'+esc(s.c)+'</span>':'')+'</div>';
      if(CFG.pinyin&&O.py&&(s.pyf))h+='<div class="py">'+esc(s.pyf)+'</div>'}
    if(s.n)h+='<div class="note">'+s.n+'</div>'});
  if(x.note)h+='<div class="note">'+x.note+'</div>';
  h+='<div class="row"><button class="pri" id="nx">Next ▶</button></div>';
  var fb=VP.querySelector('#fb');fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=h;
  VP.querySelector('#nx').onclick=next;try{VP.querySelector('#nx').focus({preventScroll:true})}catch(e){}
  fb.scrollIntoView({block:'nearest',behavior:'smooth'})}
function next(){RUN.i++;q();scrollTo(0,0)}
/* ---------- tile builder ---------- */
function tileHTML(x,j,cls){return '<button class="tile'+(cls||'')+' zh" data-j="'+j+'">'+esc(x.t[j])+(CFG.pinyin&&O.py&&x.tp?'<small>'+esc(x.tp[j])+'</small>':'')+'</button>'}
function buildHTML(x){var ord=shuf(x.t.map(function(t,j){return j}));CUR.ord=ord;CUR.seq=[];
  return '<div class="lbl">Your sentence</div><div class="tiles ans" id="ta"></div><div class="lbl">Tap the pieces in order</div><div class="tiles" id="tp">'+ord.map(function(j){return tileHTML(x,j)}).join('')+'</div><div class="row"><button class="pri" id="chk" disabled>Check</button><button class="ghost" id="clr">Clear</button><button class="ghost" id="shw">Show answer</button></div>'}
function norm(t){return t.replace(/[\s，。？！、,.?!]/g,'')}
function buildWire(x){var ta=VP.querySelector('#ta'),tp=VP.querySelector('#tp');
  function draw(){ta.innerHTML=CUR.seq.map(function(j){return tileHTML(x,j)}).join('');tp.querySelectorAll('.tile').forEach(function(b){b.classList.toggle('used',CUR.seq.indexOf(+b.dataset.j)>=0)});VP.querySelector('#chk').disabled=CUR.seq.length!==x.t.length}
  tp.onclick=function(e){if(CUR.fin)return;var b=e.target.closest('.tile');if(!b||b.classList.contains('used'))return;CUR.seq.push(+b.dataset.j);draw()};
  ta.onclick=function(e){if(CUR.fin)return;var b=e.target.closest('.tile');if(!b)return;CUR.seq.splice(CUR.seq.indexOf(+b.dataset.j),1);draw()};
  VP.querySelector('#clr').onclick=function(){if(CUR.fin)return;CUR.seq=[];draw()};
  VP.querySelector('#chk').onclick=function(){bCheck(x,false)};VP.querySelector('#shw').onclick=function(){bCheck(x,true)}}
function bCheck(x,gave){if(CUR.fin)return;var mine=CUR.seq.map(function(j){return x.t[j]}).join('');
  var hit=!gave&&x.ans.some(function(a){return norm(a)===norm(mine)});CUR.okAll=hit;CUR.fin=true;
  VP.querySelector('#ta').classList.add(hit?'ok':'bad');VP.querySelectorAll('#chk,#clr,#shw').forEach(function(b){b.disabled=true});
  grade(x.id,hit);RUN.res.push([x,hit]);
  var h='<b>'+(hit?'✓ Right':'✗ Not quite')+'</b>';
  var others=x.ans.filter(function(a){return norm(a)!==norm(mine)});
  h+='<div class="full zh">'+esc(hit?x.ans.filter(function(a){return norm(a)===norm(mine)})[0]:x.ans[0])+'</div>';
  if(CFG.pinyin&&O.py&&x.pyf)h+='<div class="py">'+esc(hit?(x.pya[x.ans.map(norm).indexOf(norm(mine))]||x.pyf):x.pyf)+'</div>';
  if(others.length&&(hit?others.length:others.length>1))h+='<div class="muted">Also correct: <span class="zh">'+(hit?others:others.slice(1)).map(esc).join(' · ')+'</span></div>';
  if(x.note)h+='<div class="note">'+x.note+'</div>';
  h+='<div class="row"><button class="pri" id="nx">Next ▶</button></div>';
  var fb=VP.querySelector('#fb');fb.className='fb '+(hit?'ok':'bad');fb.innerHTML=h;VP.querySelector('#nx').onclick=next;try{VP.querySelector('#nx').focus({preventScroll:true})}catch(e){}}
/* ---------- end of round ---------- */
function label(x){if(x.k==='dual'){var sl=[x.a,x.b];return sl.map(function(s){return flag(s.lang)+' '+esc(s.full)}).join('<br>')}
  if(x.k==='build')return '<span class="zh">'+esc(x.ans[0])+'</span>';return '<span class="'+(isZh(x.lang)?'zh':'')+'">'+esc(x.fix||x.full||x.q||'')+'</span>'}
function done(){var r=RUN?RUN.res:[];RUN=null;var ok=r.filter(function(z){return z[1]}).length;
  var h='<div class="panel done"><h3>'+(r.length?ok+' / '+r.length+' right':'Round ended')+'</h3><p class="muted">'+(r.length&&ok===r.length?'Clean round. Items you got right come back later and later.':'Missed items are in ✗ Mistakes and come back tomorrow.')+'</p>';
  h+='<ul class="rev">'+r.map(function(z){return '<li class="'+(z[1]?'':'x')+'"><small>'+esc(z[0].en)+'</small><br>'+label(z[0])+'</li>'}).join('')+'</ul>';
  h+='<div class="row"><button class="pri" id="again">Another round ▶</button><button class="ghost" id="back">Sections</button></div></div>';
  VP.innerHTML=h;VP.querySelector('#again').onclick=function(){start(pick(O.secs,O.n))};VP.querySelector('#back').onclick=home;scrollTo(0,0)}
/* ---------- mistakes ---------- */
function mist(){var V=document.getElementById('v-mi'),m=missList();
  if(!m.length){V.innerHTML='<div class="panel"><p>No open mistakes. Anything you miss shows up here until you get it right.</p></div>';return}
  V.innerHTML='<div class="panel"><div class="row" style="margin-top:0"><button class="pri" id="pm">Practise these '+m.length+' ▶</button></div><ul class="rev ml">'+m.map(function(x){return '<li class="x"><div><small>'+esc(SEC[x.sec].t)+' · '+esc(x.en)+'</small><br>'+label(x)+'</div></li>'}).join('')+'</ul></div>';
  V.querySelector('#pm').onclick=function(){start(shuf(m).slice(0,30))}}
/* ---------- rules ---------- */
function ref(){var V=document.getElementById('v-rf');if(!V.dataset.on){V.innerHTML='<div class="panel ref">'+CFG.ref+'</div>';V.dataset.on=1}}
/* ---------- stats ---------- */
function stats(){var V=document.getElementById('v-st');
  var h='<div class="panel"><table class="st"><thead><tr><th>Section</th><th class="n">practised</th><th class="n">accuracy</th><th class="n">due</th><th class="n">open ✗</th></tr></thead><tbody>'+SECS.map(function(s){var all=IT.filter(function(x){return x.sec===s.id}),seen=all.filter(function(x){return S.it[x.id]&&S.it[x.id].n}),n=0,w=0;
    seen.forEach(function(x){n+=S.it[x.id].n;w+=S.it[x.id].w});return '<tr><td>'+esc(s.t)+'</td><td class="n">'+seen.length+'/'+all.length+'</td><td class="n">'+(n?Math.round((n-w)/n*100)+'%':'–')+'</td><td class="n">'+all.filter(function(x){return isDue(x.id)}).length+'</td><td class="n">'+all.filter(function(x){return S.it[x.id]&&S.it[x.id].m}).length+'</td></tr>'}).join('')+'</tbody></table>';
  var days=Object.keys(S.log).sort().slice(-14);if(days.length){h+='<div class="lbl">Last days</div><table class="st"><tbody>'+days.reverse().map(function(d){var v=S.log[d];d=String(d);return '<tr><td>'+d.slice(6)+'.'+d.slice(4,6)+'.</td><td class="n">'+(v[0]+v[1])+' answers</td><td class="n">'+Math.round(v[0]/(v[0]+v[1])*100)+'% right</td></tr>'}).join('')+'</tbody></table>'}
  h+='<div class="row"><button class="ghost" id="rs">Reset progress…</button></div></div>';V.innerHTML=h;
  V.querySelector('#rs').onclick=function(){var b=V.querySelector('#rs');if(b.dataset.c){S.it={};S.log={};save();head();stats()}else{b.dataset.c=1;b.textContent='Tap again to erase all progress'}}}
/* ---------- keys ---------- */
document.addEventListener('keydown',function(e){if(TAB!=='pr'||!CUR)return;if(e.target.tagName==='INPUT')return;
  if(e.key==='Enter'){var nx=VP.querySelector('#nx');if(nx){e.preventDefault();nx.click();return}var c=VP.querySelector('#chk');if(c&&!c.disabled){e.preventDefault();c.click()}return}
  var d=+e.key;if(!d||CUR.fin||!CUR.slots)return;var si=0;while(si<CUR.slots.length&&CUR.ans[si]!=null)si++;if(si>=CUR.slots.length)return;
  var b=VP.querySelectorAll('.opt[data-s="'+si+'"]')[d-1];if(b){e.preventDefault();b.click()}});
/* ---------- boot ---------- */
function boot(){var fid=window.__dpFID||'';if(CFG.instB&&fid===CFG.instB)INST='b';
  var T=INST==='b'?CFG.titleB:CFG.title;document.getElementById('h1').innerHTML=T;document.title=(INST==='b'?CFG.docTitleB:CFG.docTitle)||document.title;
  head();tab('pr')}
addEventListener('storage',function(e){if(e.key&&e.key.indexOf(KEY)<0)return;var o=O;load();S.o=o;O=o;head()});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else setTimeout(boot,0);
})();
</script></body></html>
