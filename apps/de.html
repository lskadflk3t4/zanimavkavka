<title>DRILL German Grammar Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: German school Karoheft (squared exercise book). Settings rail left, grid-paper drill sheet right with a red margin line; stacks on phones. */
:root{
  --bg:#EEF1F6; --sheet:#FFFFFF; --grid:rgba(43,79,203,.09); --ink:#1B2340; --muted:#5D6683;
  --line:#D5DBE8; --accent:#2B4FCB; --accent-soft:#E3E9FB; --on-accent:#FFFFFF;
  --red:#C7341F; --red-soft:#FBE7E3; --green:#1E7A4C; --green-soft:#E1F3E9; --margin:#E58A7C;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F121B; --sheet:#171B28; --grid:rgba(143,168,255,.07); --ink:#E5E9F4; --muted:#9AA2BC;
  --line:#2C3346; --accent:#8FA8FF; --accent-soft:#232C4A; --on-accent:#0F121B;
  --red:#FF8069; --red-soft:#3A2020; --green:#5FCB92; --green-soft:#183326; --margin:#8A4A42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F121B; --sheet:#171B28; --grid:rgba(143,168,255,.07); --ink:#E5E9F4; --muted:#9AA2BC;
  --line:#2C3346; --accent:#8FA8FF; --accent-soft:#232C4A; --on-accent:#0F121B;
  --red:#FF8069; --red-soft:#3A2020; --green:#5FCB92; --green-soft:#183326; --margin:#8A4A42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,3.6vw,2.2rem);margin:0;line-height:1.1;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.score{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;align-items:flex-end}
.score b{font-size:1.25rem;font-weight:700}
.score span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:10px 14px 9px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.tab small{font-weight:500;font-size:.72rem;opacity:.85}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
/* settings */
.settings{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:4px 16px 16px}
.settings summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none;display:flex;justify-content:space-between}
.settings summary::-webkit-details-marker{display:none}
.settings summary::after{content:"▾";color:var(--muted)}
.settings[open] summary::after{content:"▴"}
.grp{display:flex;flex-direction:column;gap:7px;padding-block:10px;border-top:1px solid var(--line)}
.grp h3{margin:0;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;font:inherit;font-size:.82rem;border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.quick{display:flex;gap:10px;font-size:.75rem}
.quick button{appearance:none;border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
/* sheet */
.sheet{position:relative;background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:10px;padding:22px 22px 22px 44px;min-width:0}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:28px;width:2px;background:var(--margin);opacity:.8}
@media (max-width:520px){.sheet{padding:18px 14px 18px 30px}.sheet::before{left:16px}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.tag.plain{background:transparent;color:var(--muted);padding-left:0;font-weight:500;letter-spacing:0;font-size:.85rem}
.word{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.1;margin:4px 0 14px;overflow-wrap:anywhere}
.target{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:14px}
.target b{font-size:1.2rem}
.target span{color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap}
input.ans{font-family:var(--f-display);font-size:1.35rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);flex:1 1 220px;min-width:0}
input.ans:focus{border-color:var(--accent);outline:none}
input.ans.ok{border-color:var(--green);background:var(--green-soft)}
input.ans.bad{border-color:var(--red);background:var(--red-soft)}
.btn{appearance:none;font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 11px;font-size:.82rem;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fb{margin-top:14px;min-height:2.4em;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.mark{font-family:var(--f-hand);font-size:1.9rem;font-weight:700;line-height:1}
.mark.ok{color:var(--green)}.mark.bad{color:var(--red)}
.fb .right{font-family:var(--f-display);font-size:1.2rem}
.fb .right s{color:var(--red);text-decoration-thickness:2px}
.cch{min-width:0}
.cch .chip{font-size:.85rem;padding:6px 11px}
.cch .chip.ok{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.cch .chip.bad{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.cch .chip.miss{border:2px dashed var(--green);color:var(--green);font-weight:700}
.cch .chip:disabled{cursor:default;opacity:1}
.rule{flex-basis:100%;margin:6px 0 0;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:.9rem}
.rule b{color:var(--accent)}
.trow{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:6px 12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.trow label{font-weight:600;font-size:.9rem;line-height:1.25}
.trow label small{display:block;font-weight:400;color:var(--muted);font-style:italic}
.trow .fix{grid-column:2;font-family:var(--f-display);color:var(--red);font-size:1rem;margin-top:-2px}
@media (max-width:520px){.trow{grid-template-columns:minmax(0,1fr)}.trow .fix{grid-column:1}}
.empty{color:var(--muted);padding:30px 0}
/* reference */
.ref{margin-top:18px}
.ref summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;font-size:.92rem;background:var(--sheet);min-width:100%}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.hl{background:var(--accent-soft);font-weight:700}
td{font-family:var(--f-display)}
/* keyboard */
.kb{margin-top:16px;display:flex;flex-direction:column;gap:5px;align-items:center}
.kb .kr{display:flex;gap:4px;flex-wrap:nowrap;justify-content:center;width:100%}
.kb button{appearance:none;font-family:var(--f-display);font-size:1rem;flex:1 1 0;min-width:0;max-width:42px;height:38px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:6px;cursor:pointer;padding:0}
.kb button.wide{max-width:96px;flex:2 1 0;font-family:var(--f-body);font-size:.78rem;font-weight:600}
.kb button:active{background:var(--accent-soft)}
/* log */
.log{margin-top:22px}
.log h2{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.log ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.log li{font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 10px}
.log li .w{font-family:var(--f-display);font-weight:700}
.log li .c{color:var(--green);font-family:var(--f-display)}
.log li .y{color:var(--red);text-decoration:line-through;font-family:var(--f-display)}
.note{font-size:.78rem;color:var(--muted);margin-top:12px}
@media (prefers-reduced-motion:no-preference){.mark{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}}
.lead{margin:0 0 8px;color:var(--muted)}
.word.sent{font-size:clamp(1.3rem,3.6vw,1.75rem);line-height:1.35;font-weight:500}
.word .gap{color:var(--accent);font-weight:700}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.ctl input.ans{flex:1 1 160px}
.row .cch{flex:1 1 100%}
.fix .info{display:block;font-family:var(--f-body);color:var(--muted);font-size:.85rem;margin-top:2px}
td{white-space:normal;min-width:80px}
.trow label span[lang]{font-family:var(--f-display);font-size:1.05rem}
/* ===== Android / touch friendliness ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,summary,input,.chip,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tbl-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.btn:active{transform:scale(.98)}
.chip:active{filter:brightness(.94)}
@media (max-width:820px){

    margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-inline:10px;scroll-snap-type:x proximity;margin-bottom:12px;gap:2px}

}

function sgForms(w,g,gen){
  if(g==='f') return [w,w,w,w];
  const alts=s=>s.split('/').map(x=>w+x).join('/');
  if(gen==='n'||gen==='en'){const x=w+gen;return [w,x,x,x];}
  if(gen==='ns') return [w,w+'n',w+'n',w+'ns'];
  if(gen==='ens') return [w,w,w+'en',w+'ens'];
  if(gen==='0') return [w,w,w,w];
  return [w,w,w,alts(gen)];
}

  [/(ment|um|nis)$/,'n','Nouns in -ment, -um and most nouns in -nis are neuter.'],
  [/(ling|ismus|ich|ig|ant|ist|or|ent)$/,'m','Nouns in -ling, -ismus, -ich, -ig, -ant, -ist, -or and -ent are usually masculine.'],
  [/^Ge.*e$/,'n','Collective nouns Ge-…-e are mostly neuter (das Gebäude, das Gemüse).'],

const MASC_SEM=['Montag','Januar','Sommer','Winter','Frühling','Herbst','Regen','Schnee','Wind','Wein','Kaffee','Tee'];
function genderNote(n){
  const out=[];
  if(MASC_SEM.includes(n.w))out.push('Days, months, seasons, weather words and most drinks (except das Bier) are masculine.');
  else{const r=GRULES.find(([re])=>re.test(n.w));
    if(r){if(r[1]===n.g)out.push('Rule: '+r[2]);else out.push(`Exception: ${r[2]} But it is ${GART[n.g]} ${n.w}.`);}}
  if(n.w==='Bier')out.push('das Bier is the exception among drinks, which are otherwise masculine.');
  if(n.note)out.push(n.note);
  return out.join(' ');
}

const sp4=s=>s.split(',');
function einW(st,stand){const r={};Object.entries(EIN_END).forEach(([k,v])=>{r[k]=v.map((e,i)=>{
    let end=e;if(stand&&k==='m'&&i===0)end='er';if(stand&&k==='n'&&i<2)end='es';
    if(!end)return st;
    if(st==='euer')return 'eur'+end+'/euer'+end;
    if(st==='unser')return 'unser'+end+'/unsr'+end;
    if(stand&&k==='n'&&i<2)return st+'s/'+st+'es';
    return st+end;});});return r;}

const first=a=>String(a).split('/')[0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/[.,!?;:"„“”«»()…]/g,' ').replace(/\s+/g,' ').trim();
const stripPron=s=>s.replace(/^(ich|du|er\/sie\/es|er|sie|es|wir|ihr|man)\s+/,'');
const cross=(a,b,sep=' ')=>String(a).split('/').flatMap(x=>String(b).split('/').map(y=>x&&y?x+sep+y:(x||y))).join('/');
const uniq=s=>[...new Set(String(s).split('/'))].join('/');
function isRight(input,ans,mode){
  let u=norm(input);
  const f=x=>{x=norm(x);if(mode==='verb')x=stripPron(x);if(mode==='sich')x=x.replace(/^sich /,'');return x;};
  u=f(u);if(!u)return false;
  return String(ans).split('/').some(a=>f(a)===u);
}

const WEAK={m:['e','en','en','en'],n:['e','e','en','en'],f:['e','e','en','en'],pl:['en','en','en','en']};
const MIXED={m:['er','en','en','en'],n:['es','es','en','en'],f:['e','e','en','en'],pl:['en','en','en','en']};
const STRONG={m:['er','en','em','en'],n:['es','es','em','en'],f:['e','e','er','er'],pl:['e','e','en','er']};
const DETS={der:'def',dieser:'def',jener:'def',welcher:'def',ein:'indef',kein:'indef',mein:'indef',dein:'indef',sein:'indef',ihr:'indef',unser:'indef',euer:'indef',none:'none'};
function detForm(d,gn,c){
  if(d==='none')return '';if(d==='der')return ART.def[gn][c];
  if(d==='ein')return gn==='pl'?'':ART.indef[gn][c];
  if(DETS[d]==='def')return d.slice(0,-2)+DER_END[gn][c];
  const e=EIN_END[gn][c];if(!e)return d;
  if(d==='euer')return 'eur'+e;if(d==='unser')return 'unser'+e+'/unsr'+e;return d+e;
}
function adjEnd(d,gn,c){const g=DETS[d];
  if(g==='def')return WEAK[gn][c];if(g==='none'||(d==='ein'&&gn==='pl'))return STRONG[gn][c];return MIXED[gn][c];}
function adjForm(a,end){
  const j=(st,en)=>/e$/.test(st)&&en[0]==='e'?st+en.slice(1):st+en;
  if(a.indecl)return a.alt?a.w+'/'+j(a.alt,end):a.w;

  const gn=num==='pl'?'pl':n.g;const det=detForm(d,gn,c);
  const adj=adjForm(a,adjEnd(d,gn,c));const nf=n[num][c];
  return det?cross(det,cross(adj,nf)):cross(adj,nf);
}

  return {w:e.v,t:'Separable or inseparable?',s:e.g,a:SEPL[e.s],parts:[{k:'chips',opts:['separable','inseparable'],main:[e.s==='s'?0:1],single:true}],key:'r|'+i,tags:['separable?'],gloss:e.g,info};
}
function genPref(){
  const P=S.pref;if(!P.tasks.length||!P.bases.length)return null;
  const pool=PREF.filter(e=>P.bases.includes(e.b));if(!pool.length)return null;
  let picks;
  if(S.style==='single')picks=[rnd(pool)];
  else{const b=rnd([...new Set(pool.map(e=>e.b))]);picks=shuffle(pool.filter(e=>e.b===b)).slice(0,8);}
  const prompts=picks.map((e,i)=>prefPrompt(e,rnd(P.tasks),i));
  const fam=PREF.filter(e=>e.b===picks[0].b);
  return {multi:true,word:picks[0].b,tags:['verb family'],lead:`Verb family: ${picks[0].b}`,prompts,note:PREFNOTE,
    ref:[{cols:['verb','type','meaning','case','example'],rows:fam.map(e=>{const i=picks.indexOf(e);return {h:e.v,cells:[{v:SEPL[e.s],key:i>=0?'r|'+i:''},{v:e.g},{v:[...e.c.map(c=>CN[c]),...e.x.map(c=>'('+CN[c]+')')].join(' + ')},{v:e.ex}]};})}]};
}
function genGov(){
  const G=S.gov;if(!G.tasks.length)return null;
  const preps=PREPS.filter(p=>G.pcats.includes(p.cat));
  const tasks=G.tasks.filter(t=>t==='colloc'||preps.length);if(!tasks.length)return null;
  const k=S.style==='single'?1:8,prompts=[],seen=new Set();let guard=0;
  while(prompts.length<k&&guard++<300){
    const task=rnd(tasks);const i=prompts.length;
    if(task==='colloc'){const e=rnd(COLL);const id=e.v+e.p;if(seen.has(id))continue;seen.add(id);
      const cc={k:'chips',opts:['+ Akkusativ','+ Dativ'],main:[e.c==='A'?0:1],single:true};
      const pp=G.input==='pick'?{k:'chips',opts:PICKP,main:[PICKP.indexOf(e.p)],single:true}:{k:'text',a:e.p,mode:'prep',ph:'preposition'};
      prompts.push({w:e.v+' ___',t:'Preposition + case',s:e.ex,a:`${e.p} + ${CN[e.c]}`,parts:[pp,cc],key:'r|'+i,tags:['verb + preposition'],gloss:'',
        info:`${e.v} ${e.p} + ${CN[e.c]}: ${e.ex.replace('___',e.p)}`,refH:e.v,refC:`${e.p} + ${CN[e.c]}`,refE:e.ex.replace('___',e.p)});}
    else{const e=rnd(preps);if(seen.has(e.p))continue;seen.add(e.p);
      const a=e.main.map(c=>CN[c]).join(' + ')+(e.x.length?` (also ${e.x.map(c=>CN[c]).join(' + ')})`:'');
      prompts.push({w:e.p,t:'Which case(s)?',s:e.m,a,parts:[{k:'chips',opts:CASE3,main:e.main.map(c=>CI[c]),extra:e.x.map(c=>CI[c])}],key:'r|'+i,
        tags:['preposition',e.cat==='W'?'two-way':CN[e.cat]],gloss:'',info:`${e.p} + ${a}: ${e.ex}`,refH:e.p,refC:a,refE:e.ex});}}
  if(!prompts.length)return null;
  return {multi:true,word:'Präpositionen',tags:['prepositions'],lead:'Give the preposition and the case it governs',prompts,
    note:'Two-way prepositions (an, auf, hinter, in, neben, über, unter, vor, zwischen) take the accusative for direction (wohin?) and the dative for location (wo?). After a verb, the case is fixed: denken an + Akk., teilnehmen an + Dat. Genitive prepositions take the dative in casual speech (wegen dem Regen) and when the genitive would not be visible.',
    ref:[{cols:['','preposition + case','example'],rows:prompts.map((p,i)=>({h:p.refH,cells:[{v:p.refC,key:'r|'+i},{v:p.refE}]}))}]};
}
function genPron(){
  const P=S.pron;if(!P.types.length)return null;
  const okTypes=P.types.filter(t=>t==='sent'||(P.cases.length&&P.gn.length));if(!okTypes.length)return null;
  const type=rnd(okTypes);
  if(type==='sent'){
    const k=S.style==='single'?1:8;const pick=shuffle(RELSENT).slice(0,k);
    const prompts=pick.map((x,i)=>({w:x.s,t:'Relative pronoun',s:x.s,a:x.a,parts:[{k:'text',a:x.a,ph:'Fill the gap…'}],key:'r|'+i,tags:['relative clause'],gloss:'',info:x.why}));
    return {multi:true,word:'Relativsätze',tags:['relative clauses'],lead:'Fill each gap with the relative pronoun',prompts,
      note:'Gender and number come from the noun; the case comes from the job of the pronoun in its own clause (or from the preposition in front of it).',
      ref:[{cols:['sentence','pronoun','why'],rows:pick.map((x,i)=>({h:x.s.replace('___','…'),cells:[{v:x.a.split('/').join(' / '),key:'r|'+i},{v:x.why}]}))}]};
  }
  const pr=rnd(PRONS.filter(p=>p.ty===type));
  const keys=pr.cols?Object.keys(pr.cols):P.gn.filter(g=>pr.f[g]);
  const cl=k=>pr.cols?pr.cols[k]:GN[k].replace(' only','');
  const prompts=[];
  keys.forEach(g=>P.cases.forEach(c=>{const f=pr.f[g][c];if(f==='—')return;prompts.push({t:CASES[c].en,s:cl(g),a:f,key:g+'|'+c});}));
  if(!prompts.length)return null;
  const allKeys=pr.cols?Object.keys(pr.cols):['m','n','f','pl'];
  return {word:pr.w,tags:[{dem:'demonstrative',rel:'relative',pos:'possessive',posp:'possessive pronoun'}[type]],gloss:pr.lab,note:pr.note,lead:'Give the form for each gender and case',prompts,
    ref:[{cols:['',...allKeys.map(cl)],rows:CASES.map((cc,c)=>({h:cc.ab,cells:allKeys.map(g=>({v:pr.f[g][c].split('/').join(' / '),key:g+'|'+c}))}))}]};
}

/* ============ RENDER: sheet ============ */
function newItem(){
  const item=GEN[S.mode]();
  if(!item){cur=null;renderSheet();return;}
  item.prompts.forEach(p=>{if(!p.parts)p.parts=[{k:'text',a:p.a,mode:p.mode}];});
  let prompts=item.prompts;
  if(S.style==='single'&&!item.multi)prompts=[rnd(prompts)];
  cur={item,prompts,checked:false,hint:0,res:[]};
  renderSheet();
}
function tagsHtml(tags,gloss){return `<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${gloss?`<span class="tag plain">${esc(gloss)}</span>`:''}</div>`;}
function partsHtml(p,i){
  return p.parts.map((pt,j)=>pt.k==='tiles'?tilesHtml(pt,i,j):pt.k==='text'
    ?`<input class="ans${pt.mode==='sent'?' sentin':''}" id="ans-${i}-${j}" data-i="${i}" lang="de" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${S.style==='table'?'next':'go'}" placeholder="${esc(pt.ph||'Type the form…')}" aria-label="${esc(p.t+' '+(p.s||''))}">`
    :`<div class="chips cch" id="ch-${i}-${j}" data-single="${pt.single?1:0}" role="group" aria-label="${esc(p.t)}">${pt.opts.map((o,oi)=>`<button class="chip" data-ci="${oi}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>`).join('');
}
function renderSheet(){
  const el=document.getElementById('sheet');

  const it=cur.item;let h='';

      h+=(S.mode==='pron'||S.mode==='lass'||p.sent)?`<div class="word sent" lang="de">${esc(p.w).replace(/___/g,'<span class="gap">___</span>')}</div>`:`<div class="word" lang="de">${esc(p.w)}</div>`;
      h+=`<div class="target"><b>${esc(p.t)}</b>${S.mode==='pron'?'':`<span lang="${S.mode==='gov'&&p.parts.length>1?'de':'en'}">${esc(p.s)}</span>`}</div>`;}
    else{h+=tagsHtml(it.tags,it.gloss)+`<div class="word" lang="de">${esc(it.word)}</div>`;
      if(it.detLabel)h+=`<p class="lead">${esc(it.lead)}</p>`;

    h+=cur.prompts.map((p,i)=>`<div class="trow"><label for="ans-${i}-0">${p.w?`<span lang="de">${esc(p.w)}</span><small>${esc(p.t)}${p.parts.length>1||S.mode==='pron'?'':' · '+esc(p.s)}</small>`:`${esc(p.t)}<small lang="${it.isVerb?'de':'en'}">${esc(p.s)}</small>`}</label>

function updScore(){
  document.getElementById('sc-ok').textContent=score.ok;document.getElementById('sc-all').textContent=score.all;

/* ============ CHECK ============ */
function prepOk(v,ans){const t=norm(v);return String(ans).split('/').some(a=>norm(a)===t);}
function checkPart(pt,i,j){
  if(pt.k==='tiles'){const box=document.getElementById(`tl-${i}-${j}`);const v=tilesVal(box);const ok=pcOk(v,pt);
    box.classList.add(ok?'ok':'bad');box.querySelectorAll('button').forEach(t=>t.disabled=true);return [ok,v];}
  if(pt.k==='text'){const inp=document.getElementById(`ans-${i}-${j}`);const v=inp.value;
    const ok=pt.mode==='prep'?prepOk(v,pt.a):pt.mode==='sent'?pcOk(v,pt):isRight(v,pt.a,pt.mode);
    inp.classList.add(ok?'ok':'bad');inp.readOnly=true;return [ok,v.trim()];}
  const box=document.getElementById(`ch-${i}-${j}`);
  const sel=[...box.querySelectorAll('[aria-pressed="true"]')].map(b=>+b.dataset.ci);
  const okSet=[...pt.main,...(pt.extra||[])];
  const ok=sel.length>0&&sel.every(c=>okSet.includes(c))&&(pt.any||pt.main.every(c=>sel.includes(c)));
  box.querySelectorAll('[data-ci]').forEach(b=>{const c=+b.dataset.ci,on=b.getAttribute('aria-pressed')==='true';b.disabled=true;
    if(on&&okSet.includes(c))b.classList.add('ok');else if(on)b.classList.add('bad');else if(pt.main.includes(c)&&!(pt.any&&ok))b.classList.add('miss');});
  return [ok,sel.map(c=>pt.opts[c]).join(' + ')];
}
function chipRight(pt,box){const sel=[...box.querySelectorAll('[aria-pressed="true"]')].map(b=>+b.dataset.ci);const okSet=[...pt.main,...(pt.extra||[])];
  return sel.length>0&&sel.every(c=>okSet.includes(c))&&(pt.any||pt.main.every(c=>sel.includes(c)));}
function autoChk(){if(!cur||cur.checked)return;
  for(let i=0;i<cur.prompts.length;i++){const p=cur.prompts[i];for(let j=0;j<p.parts.length;j++){const pt=p.parts[j];if(pt.k==='text')return;
    const box=document.getElementById(`ch-${i}-${j}`);if(!box||!chipRight(pt,box))return}}
  setTimeout(()=>{if(cur&&!cur.checked)check()},150);}
function check(){
  if(!cur||cur.checked)return;
  const it=cur.item;let allOk=true;cur.res=[];
  cur.prompts.forEach((p,i)=>{
    const r=p.parts.map((pt,j)=>checkPart(pt,i,j));const ok=r.every(x=>x[0]);const val=r.map(x=>x[1]).filter(Boolean).join(' · ');
    cur.res[i]=ok;score.all++;
    if(ok)score.ok++;else{allOk=false;log.unshift({w:p.w||it.word,label:p.t+(p.s&&!p.w?' · '+p.s:''),you:val,right:String(p.a).split('/').join(' / ')});}
    const fx=document.getElementById('fix-'+i);if(fx&&!ok){fx.hidden=false;fx.textContent='→ '+String(p.a).split('/').join(' / ');}
  });
  log=log.slice(0,8);
  if(allOk&&!cur.hint)score.streak++;else if(!allOk)score.streak=0;
  cur.checked=true;
  const fb=document.getElementById('fb');
  if(S.style==='single'){const p=cur.prompts[0];const ok=cur.res[0];
    fb.innerHTML=ok?`<span class="mark ok">Richtig!</span><span class="right" lang="de">${esc(String(p.a).split('/').join(' / '))}</span>`
      :`<span class="mark bad">Falsch</span><span class="right" lang="de">Correct: ${esc(String(p.a).split('/').join(' / '))}</span>`;
    const why=it.multi?(p.info||p.note||it.note):it.note;
    if(why)fb.insertAdjacentHTML('beforeend',`<p class="rule"><b>Why:</b> ${esc(why)}</p>`);
  } else {const n=cur.prompts.length,k=cur.res.filter(Boolean).length;
    fb.innerHTML=`<span class="mark ${k===n?'ok':'bad'}">${k===n?'Ausgezeichnet!':k+' / '+n}</span><span style="color:var(--muted)">${k===n?'Everything correct.':'Corrections are shown under each wrong answer.'}</span>`;
    if(it.note)fb.insertAdjacentHTML('beforeend',`<p class="rule"><b>Why:</b> ${esc(it.note)}</p>`);
    if(it.multi)cur.prompts.forEach((p,i)=>{const fx=document.getElementById('fix-'+i);if(fx&&(p.info||p.note)){fx.hidden=false;fx.insertAdjacentHTML('beforeend',`<span class="info">${fx.textContent?' ':''}${esc(p.info||p.note)}</span>`);}});
  }
  const go=document.getElementById('go');go.textContent='Next →';
  ['hint','skip'].forEach(id=>{const b=document.getElementById(id);if(b)b.hidden=true;});
  document.getElementById('ref').open=!allOk;renderRef();
  const lg=document.querySelector('.log');const nl=logHtml();
  if(lg)lg.outerHTML=nl;else document.getElementById('sheet').insertAdjacentHTML('beforeend',nl);
  updScore();go.focus({preventScroll:true});

function lassForms(gov,inf,tense,i){
  const V=LV(gov).F;const perc=['sehen','hören','helfen'].includes(gov);const modal=LMODALS.some(m=>m[0]===gov);
  const H=AUXT.h;const pii=V.p2;const opts=[];
  const add=(fin,rest,sub)=>opts.push({fin,rest,sub});
  const comp=aux=>{add(aux,inf+' '+gov,aux+' '+inf+' '+gov);if(perc)add(aux,inf+' '+pii,inf+' '+pii+' '+aux);};
  if(tense==='pres')String(V.pres[i]).split('/').forEach(f=>add(f,inf,inf+' '+f));
  if(tense==='prat')String(V.prat[i]).split('/').forEach(f=>add(f,inf,inf+' '+f));
  if(tense==='perf')comp(H.pres[i]);
  if(tense==='plq')comp(H.prat[i]);
  if(tense==='fut1'){const w=WERD.pres[i];add(w,inf+' '+gov,inf+' '+gov+' '+w);add(w,inf+' '+gov,w+' '+inf+' '+gov);}

function lassBuild(i){
  const L=S.lass;
  const pool=LASS.filter(e=>L.govs.includes(e.k==='lassen'?'lassen':e.k==='modal'?'modal':'perc'));if(!pool.length)return null;
  const e=rnd(pool);
  const gov=e.k==='modal'?rnd(LMODALS)[0]:e.k;
  const [S1,s1,pi]=rnd(LSUBJ);
  const mid=e.mid.replace(/\{([DA])\}/,(_,c)=>LREFL[c][pi]);
  const tense=rnd(L.tenses),clause=rnd(L.clauses);
  const opts=lassForms(gov,e.inf,tense,pi);
  const kind=e.k==='modal'?'modal':gov;
  const govGloss=e.k==='modal'?LMODALS.find(m=>m[0]===gov)[1]+' · '+e.tr.replace(/^to /,''):e.tr;
  const why=[LNOTE[kind]];if(clause==='sub'&&['perf','plq','fut1','k2','k2v'].includes(tense))why.push(LSUBNOTE);
  if(tense==='k2'&&gov==='lassen')why.push('Konjunktiv II of lassen: ließe … or, more often, würde … lassen.');
  if(tense==='k2'&&e.k==='modal')why.push('Modals have their own Konjunktiv II: könnte, müsste, dürfte, wollte, sollte.');
  const tableRows=LTENSE.map(([t,lab])=>{const o=lassForms(gov,e.inf,t,pi);
    return {h:lab,cells:[{v:`${S1} ${o[0].fin} ${mid} ${o[0].rest}.`,key:t+'|main'},{v:`…, dass ${s1} ${mid} ${o[0].sub}.`,key:t+'|sub'}]};});
  let p;
  if(clause==='main'){
    const mo=new Set(opts.map(o=>o.rest)).size>1&&new Set(opts.map(o=>o.fin)).size>1?[opts[0]]:opts;
    const fins=uniq(mo.map(o=>o.fin).join('/')),rests=uniq(mo.map(o=>o.rest).join('/'));
    p={w:`${S1} ___ ${mid} ___.`,t:`${LTL[tense]} · main clause`,s:`${gov} + ${e.inf}`,a:`${first(fins)} … ${rests.split('/').join(' / ')}`,
      parts:[{k:'text',a:fins,ph:'finite verb'},{k:'text',a:rests,ph:'end of the clause'}],key:tense+'|main'};
    p.full=`${S1} ${opts[0].fin} ${mid} ${opts[0].rest}.`;

    p={w:`${intro} ${s1} ${mid} ___.`,t:`${LTL[tense]} · subordinate clause`,s:`${gov} + ${e.inf}`,a:subs,
      parts:[{k:'text',a:subs,ph:'verb cluster at the end'}],key:tense+'|sub'};
    p.full=`${intro} ${s1} ${mid} ${opts[0].sub}.`;

}
function genLass(){

    if(!p||seen.has(p.w))continue;seen.add(p.w);p.key=p.key||'r|'+i;if(!p.key.includes('|main')&&!p.key.includes('|sub'))p.key='r|'+i;prompts.push(p);}

    :[{cols:['sentence','why'],rows:prompts.map((p,i)=>({h:p.full,cells:[{v:p.info,key:p.key}]}))}];

    note:'Ersatzinfinitiv: with a dependent infinitive, modals and lassen (often also sehen, hören, helfen) use the infinitive instead of the Partizip II — hat kommen müssen, hat reparieren lassen. In a subordinate clause the finite auxiliary stands before the two infinitives: weil er hat kommen müssen.',ref};

function ruCollVerdict(e,r){
  if(!r)return null;
  const de=CN[e.c];
  if(r.np)return {k:'np',t:`≠ Russian uses a bare case (no preposition); German needs ${e.p} + ${de}.`};
  if(r.c===e.c)return {k:'same',t:`✓ Same case: German ${e.p} + ${de} = Russian ${RUC[r.c]}.`};
  return {k:'diff',t:`≠ Different case: German ${e.p} + ${de}, Russian ${RUC[r.c]}.`};
}
function ruPrepVerdict(e,r){
  if(!r)return null;
  if(e.cat==='W')return {k:'two',t:`≈ Same two-way logic: direction (wohin? / куда?) takes the accusative in both languages; location (wo? / где?) is Dativ in German but ${RUC[r.c[1]]} in Russian.`};
  const same=e.main.some(c=>r.c.includes(c));
  return same?{k:'same',t:`✓ Same case: ${e.main.map(c=>CN[c]).join(' / ')} in both languages.`}
    :{k:'diff',t:`≠ Different case: German ${e.main.map(c=>CN[c]).join(' / ')}, Russian ${r.c.map(c=>RUC[c]).join(' / ')}.`};
}

const PAN_DEM=['dieser','jener','jeder','welcher','derselbe','derjenige'];
const PAN_POS=['mein','dein','sein','ihr','unser','euer','Ihr'];
const PAN_POSS=[['der Freund','m','dessen'],['der Lehrer','m','dessen'],['das Kind','n','dessen'],['das Mädchen','n','dessen'],['die Nachbarin','f','deren'],['die Firma','f','deren'],['die Eltern','pl','deren'],['die Studenten','pl','deren']];
const PAN_NOTE={
  dieser:'dieser, jener and welcher are der-words: they carry the full article ending, so the adjective takes WEAK endings (-e / -en): dieser alte Mann, diesem alten Mann.',
  jener:'jener is a der-word, so the adjective takes WEAK endings: jene schöne Stadt, jenes neuen Hauses.',
  welcher:'welcher (which) is a der-word, so the adjective takes WEAK endings: welches rote Kleid?, mit welchem neuen Auto?',
  jeder:'jeder is a der-word with WEAK adjective endings (jeder neue Tag, jedem guten Schüler). It has no plural: use alle, which also takes weak endings (alle neuen Bücher).',
  derselbe:'derselbe is article + selb- written as one word. Both parts decline, and the adjective after it takes WEAK endings: derselbe alte Mann, demselben alten Mann.',
  derjenige:'derjenige is article + jenig- written as one word. The adjective after it takes WEAK endings: diejenige junge Frau, desjenigen kleinen Kindes.',
  pos:'Possessives are ein-words. Where the possessive has no ending (masc. nominative, neut. nominative and accusative), the adjective shows the gender with -er / -es: mein alter Freund, unser neues Auto. Everywhere else, including all plural forms, the ending is -en (or -e in fem. nom./acc.): meine alte Tasche, meinen alten Freund, meine alten Freunde.',
  euer:'euer drops its e before an ending: eure, eurem, euren. The adjective still follows the ein-word rules: euer neues Haus, in eurem neuen Haus.',
  unser:'unser keeps its e (unsere, unserem), colloquially unsre, unsrem. Adjective endings follow the ein-word rules.',
  rel:'After the genitive relative dessen / deren, the adjective takes STRONG endings, because dessen / deren never change and so do not show the case: der Freund, dessen alter Wagen …; mit dessen altem Wagen; die Firma, deren neue Mitarbeiter …. dessen refers back to a masculine or neuter noun, deren to a feminine or plural one.'};
function panDet(d,gn,c){
  if(d==='jeder')return gn==='pl'?'all'+DER_END.pl[c]:'jed'+DER_END[gn][c];
  if(d==='derselbe'||d==='derjenige'){const p=PRONS.find(x=>x.w===d);return p.f[gn][c];}
  if(d==='Ihr'){const e=EIN_END[gn][c];return 'Ihr'+e;}
  if(d==='dessen'||d==='deren')return d;
  return detForm(d,gn,c);
}
function panEnd(d,gn,c){
  if(d==='dessen'||d==='deren')return STRONG[gn][c];
  if(PAN_DEM.includes(d))return WEAK[gn][c];
  return MIXED[gn][c];
}
function panPhrase(d,a,n,num,c){
  const gn=num==='pl'?'pl':n.g;

}

const pgDnum=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);};
const pgToday=()=>pgDstr();const pgTn=()=>pgDnum(pgToday());
const PDEF=()=>({items:{},days:{},modes:{},rounds:[],goal:20,bestDays:0,best:0,run:0,ts:0});
let PG=PDEF(),pgBootLocal=false;
try{const s=JSON.parse(localStorage.getItem(PKEY)||'null');if(s&&typeof s==='object'){PG=Object.assign(PDEF(),s);pgBootLocal=true;}}catch(e){}
function pgFix(){for(const k of ['items','days','modes'])if(!PG[k]||typeof PG[k]!=='object'||Array.isArray(PG[k]))PG[k]={};
  if(!Array.isArray(PG.rounds))PG.rounds=[];if(![10,20,40,60].includes(PG.goal))PG.goal=20;
  for(const k of Object.keys(PG.items)){const r=PG.items[k];if(!r||!r.d||!Array.isArray(r.d.parts))delete PG.items[k];}}
pgFix();
let PGC=null,pgT=null,pgBusy=false,pgAgain=false;
function pgSave(){PG.ts=Date.now();try{localStorage.setItem(PKEY,JSON.stringify(PG));}catch(e){}clearTimeout(pgT);pgT=setTimeout(pgCloudSave,1500);}
async function pgCloudSave(){
  if(!PGC)return;if(pgBusy){pgAgain=true;return;}pgBusy=true;
  try{let js=JSON.stringify(PG);
    if(js.length>400000){PG.rounds=PG.rounds.slice(-20);const old=Object.entries(PG.items).filter(([k,r])=>!r.n).sort((a,b)=>(a[1].last||0)-(b[1].last||0));
      old.slice(0,Math.ceil(old.length/2)).forEach(([k])=>delete PG.items[k]);js=JSON.stringify(PG);}
    await PGC.set({json:js,ts:PG.ts});}
  catch(e){if(e&&['invalid_argument','quota_exceeded','permission_denied','not_granted'].includes(e.code))PGC=null;}
  pgBusy=false;if(pgAgain){pgAgain=false;pgCloudSave();}
}
function pgFlush(){clearTimeout(pgT);try{localStorage.setItem(PKEY,JSON.stringify(PG));}catch(e){}pgCloudSave();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')pgFlush();});
window.addEventListener('pagehide',pgFlush);
async function pgCloudInit(){
  try{const c=window.claude;if(!c||!c.use)return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/dgd-progress');const snap=await ref.get();
    let r=null;const d=snap.exists&&snap.data();if(d&&typeof d.json==='string'){try{r=JSON.parse(d.json);}catch(e){}}
    PGC=ref;
    if(r&&(!pgBootLocal||(r.ts||0)>(PG.ts||0))){PG=Object.assign(PDEF(),r);pgFix();try{localStorage.setItem(PKEY,JSON.stringify(PG));}catch(e){}
      renderTabs();if((S.mode==='miss'&&!RV)||S.mode==='prog')newItem();}
    else if(!r||(PG.ts||0)>(r.ts||0))pgCloudSave();
  }catch(e){PGC=null;}
}
const pgName=m=>m==='miss'?'Mistakes review':((MODES.find(x=>x[0]===m)||[])[1]||m);
const pgAns=a=>String(a).split('/').join(' / ');
function pgStreak(){const t=new Date();if(!(PG.days[pgDstr(t)]||{}).a)t.setDate(t.getDate()-1);let n=0;while((PG.days[pgDstr(t)]||{}).a){n++;t.setDate(t.getDate()-1);}return n;}
function pgSnap(it,p,m){
  const why=it.multi?(p.info||p.note||it.note):it.note;
  let s=p.s||'';if(it.multi&&s===p.w)s='';
  if(!it.multi&&it.detLabel)s+=` · with “${it.detLabel}”`;
  return {m,w:p.w||it.word,sent:!!(p.sent||(it.multi&&(m==='pron'||m==='lass'))),t:p.t,s,a:p.a,parts:JSON.parse(JSON.stringify(p.parts)),
    tags:(p.tags||it.tags||[]).slice(0,3),gloss:it.multi?(p.gloss||''):(it.gloss||''),why:why||'',de:!!(it.isVerb||(m==='gov'&&p.parts.length>1))};
}
function pgMark(k,ok,snap){
  const tn=pgTn();let r=PG.items[k];
  if(!ok){if(!r)r=PG.items[k]={d:snap,n:0,b:0,due:0,ok:0};r.d=snap;r.n=(r.n||0)+1;r.b=0;r.due=tn+1;r.ok=0;r.last=tn;return;}
  if(!r)return;
  if(r.n&&r.ok&&r.ok!==tn)r.n=0;                        // right on two different days → off the mistakes list
  if(r.due<=tn)r.b=Math.min(PIV.length-1,(r.b||0)+1);
  r.ok=tn;r.due=tn+PIV[r.b];r.last=tn;
  if(!r.n&&r.b>=PIV.length-1)delete PG.items[k];
}
function pgTrim(){
  const ks=Object.keys(PG.items);if(ks.length<=600)return;
  ks.sort((a,b)=>((PG.items[a].n?1:0)-(PG.items[b].n?1:0))||((PG.items[a].last||0)-(PG.items[b].last||0)));
  ks.slice(0,ks.length-600).forEach(k=>delete PG.items[k]);
}
let RV=null,RVLAST=null,RVF='all';
/* record every check, in every tab */
const pgCheckBase=check;
check=function(){
  const c=cur,live=!!(c&&!c.checked);
  pgCheckBase();
  if(!live||!c.checked)return;
  const it=c.item,t=pgToday(),inRv=S.mode==='miss';
  c.prompts.forEach((p,i)=>{
    const ok=!!c.res[i];
    const m=inRv?p._m:S.mode;
    const snap=inRv?p._d:pgSnap(it,p,m);
    const k=inRv?p._k:`${m}|${snap.w}|${p.t}|${p.s||''}|${String(p.a)}`;
    pgMark(k,ok,snap);
    const d=PG.days[t]=PG.days[t]||{a:0,c:0};d.a++;if(ok)d.c++;
    const ms=PG.modes[inRv?'miss':m]=PG.modes[inRv?'miss':m]||{a:0,c:0};ms.a++;if(ok)ms.c++;
    PG.run=ok?(PG.run||0)+1:0;PG.best=Math.max(PG.best||0,PG.run);
    if(inRv&&RV)RV.res.push({k,ok});
  });
  const ds=Object.keys(PG.days).sort();if(ds.length>200)ds.slice(0,ds.length-200).forEach(x=>delete PG.days[x]);
  PG.bestDays=Math.max(PG.bestDays||0,pgStreak());
  pgTrim();pgSave();pgTabs();
};
/* tab badge: items due for review today */
const pgDue=()=>{const tn=pgTn();return Object.keys(PG.items).filter(k=>PG.items[k].due<=tn).sort((a,b)=>PG.items[a].due-PG.items[b].due);};
function pgTabs(){const b=document.querySelector('.tab[data-mode="miss"]');if(!b)return;
  const old=b.querySelector('.cnt');if(old)old.remove();const n=pgDue().length;
  if(n){const s=document.createElement('span');s.className='cnt';s.textContent=n;s.title=n+' due for review today';b.firstChild.after(s);}}
const pgRenderTabsBase=renderTabs;
renderTabs=function(){pgRenderTabsBase();pgTabs();};
MODES.push(['miss','Mistakes','Fehler · Wiederholung'],['prog','Progress','Fortschritt']);
try{const s=JSON.parse(localStorage.getItem('dgd-settings')||'null');if(s&&(s.mode==='miss'||s.mode==='prog'))S.mode=s.mode;}catch(e){}
document.getElementById('tabs').addEventListener('click',e=>{if(e.target.closest('[data-mode]'))RV=null;},true);

/* review round: the saved questions go through the normal sheet, checking and feedback */
function rvItem(keys){
  const prompts=keys.map((k,i)=>{const d=PG.items[k].d;
    return {w:d.w,t:d.t,s:d.s,a:d.a,parts:JSON.parse(JSON.stringify(d.parts)),tags:[pgName(d.m),...(d.tags||[]).slice(0,2)],gloss:d.gloss,info:d.why,
      key:'r|'+i,_k:k,_m:d.m,_d:d,_sent:d.sent};});
  return {multi:true,word:'Fehler',tags:['mistakes'],lead:'Answer each of your mistakes again',prompts,note:'',
    ref:[{cols:['','answer','why'],rows:prompts.map((p,i)=>({h:`${p.w} · ${p.t}`,cells:[{v:pgAns(p.a),key:'r|'+i},{v:p.info||'—'}]}))}]};
}
function rvStart(keys,label){if(!keys.length)return;RV={keys,pos:0,res:[],label};newItem();}
const pgRenderSheetBase=renderSheet;
renderSheet=function(){
  pgRenderSheetBase();
  if(S.mode!=='miss'||!RV||!cur)return;
  const el=document.getElementById('sheet');
  const bar=document.createElement('div');bar.className='rvbar';
  bar.innerHTML=`<b>${esc(RV.label)}</b><span>${Math.min(RV.pos,RV.keys.length)} / ${RV.keys.length}</span><span class="sp"></span><button class="btn ghost small" data-rv="end">End round</button>`;
  el.prepend(bar);
  const p=cur.prompts[0];
  if(S.style==='single'&&p&&p._sent){const w=el.querySelector('.word');if(w){w.classList.add('sent');w.innerHTML=esc(p.w).replace(/___/g,'<span class="gap">___</span>');}}
  if(S.style==='single'&&p&&!p.s){const sp=el.querySelector('.target span');if(sp)sp.remove();}
};
const pgNewItemBase=newItem;
newItem=function(){
  document.querySelector('.main').classList.toggle('wide',S.mode==='prog');
  if(S.mode==='prog'){RV=null;cur=null;renderProg();return;}
  if(S.mode!=='miss'){RV=null;pgNewItemBase();return;}
  if(!RV){cur=null;renderMiss();return;}
  if(RV.pos>=RV.keys.length){rvFinish();return;}
  const k=S.style==='single'?1:8;
  const keys=RV.keys.slice(RV.pos,RV.pos+k).filter(x=>PG.items[x]);RV.pos+=k;
  if(!keys.length){newItem();return;}
  const item=rvItem(keys);
  cur={item,prompts:item.prompts,checked:false,hint:0,res:[]};
  renderSheet();
};
function rvFinish(){
  const r=RV.res,n=r.length,c=r.filter(x=>x.ok).length;
  if(n){PG.rounds.push({d:pgToday(),c,n,p:Math.round(100*c/n)});if(PG.rounds.length>60)PG.rounds=PG.rounds.slice(-60);pgSave();}
  RVLAST=[...new Set(r.filter(x=>!x.ok).map(x=>x.k))].filter(k=>PG.items[k]);
  RV=null;cur=null;
  const el=document.getElementById('sheet');
  el.innerHTML=`<div class="mp"><div class="rvdone">
    <span class="mark ${n&&c===n?'ok':'bad'}">${n?(c===n?'Ausgezeichnet!':`${c} / ${n}`):'Round ended'}</span>
    <p class="muted">${n?(c===n?'Everything right this time.':`${c} of ${n} right. The ones you missed stay on the list and come back tomorrow.`):'No answers in this round.'}</p>
    ${RVLAST.length?`<ul>${RVLAST.slice(0,12).map(k=>{const d=PG.items[k].d;return `<li lang="de">${esc(d.w)} · ${esc(d.t)} → <b>${esc(pgAns(d.a))}</b></li>`;}).join('')}</ul>`:''}
    <div class="btnrow" style="justify-content:center">${RVLAST.length?`<button class="btn" data-rv="again">Practise these ${RVLAST.length} again</button>`:''}<button class="btn ghost" data-rv="list">Back to mistakes</button></div>
  </div></div>`;
  pgTabs();
}
function whenTxt(due){const d=due-pgTn();return d<=0?'review today':d===1?'review tomorrow':`review in ${d} days`;}
function renderMiss(){
  const el=document.getElementById('sheet');const tn=pgTn();

    <section class="sect"><h3>Today’s review</h3>`;
  if(due.length){const n=Math.min(15,due.length);
    h+=`<p>${due.length===1?'1 item is due today.':`${due.length} items are due today.`}${due.length>15?' One round takes up to 15.':''}</p>
      <div class="btnrow"><button class="btn" data-rv="due">Start review (${n})</button></div>`;}
  else{const fut=Object.values(PG.items).map(r=>r.due).filter(d=>d>tn);

    else h+=`<p class="muted">No reviews yet. They appear after you get something wrong in another tab.</p>`;}
  h+=`</section><section class="sect"><h3>All mistakes</h3>`;
  const all=Object.entries(PG.items).filter(([k,r])=>r.n>0).sort((a,b)=>b[1].n-a[1].n||(b[1].last||0)-(a[1].last||0));
  if(!all.length){h+=`<p class="muted">No mistakes yet. Start with any tab.</p></section></div>`;el.innerHTML=h;return;}
  const cnt=m=>all.filter(([k,r])=>m==='all'||r.d.m===m).length;
  if(RVF!=='all'&&!cnt(RVF))RVF='all';
  const mods=['all',...MODES.map(x=>x[0]).filter(m=>cnt(m)&&m!=='miss'&&m!=='prog')];
  h+=`<div class="chips">${mods.map(m=>`<button class="chip" data-rvf="${m}" aria-pressed="${RVF===m}">${esc(m==='all'?'All':pgName(m))} · ${cnt(m)}</button>`).join('')}</div>`;
  const list=all.filter(([k,r])=>RVF==='all'||r.d.m===RVF);const n=Math.min(10,list.length);
  h+=`<div class="btnrow"><button class="btn" data-rv="prac">Practise ${n} ${n===1?'item':'items'}</button><button class="btn ghost" data-rv="clear">${RVF==='all'?'Clear the list':'Clear these'}</button></div>`;
  h+=`<div class="mlist">${list.map(([k,r])=>{const d=r.d;
    return `<div class="mrow"><div class="mm"><span class="mt">${esc(pgName(d.m))} · ${esc(d.t)}</span><span class="ma" lang="de">${esc(d.w)}</span>${d.s?`<span class="mq">${esc(d.s)}</span>`:''}
      <span class="mc" lang="de">→ ${esc(pgAns(d.a))}</span><span class="when${r.due<=tn?' now':''}">${whenTxt(r.due)}</span></div><span class="mx">×${r.n}</span></div>`;}).join('')}</div></section></div>`;
  el.innerHTML=h;

/* press-twice buttons */
function pgArm(b,armedLabel){if(b.dataset.armed){return true;}
  const label=b.textContent;b.dataset.armed='1';b.textContent=armedLabel;b.classList.remove('ghost');b.classList.add('danger');
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=label;b.classList.add('ghost');b.classList.remove('danger');}},6000);return false;}
sheet.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.rvf){RVF=b.dataset.rvf;renderMiss();return;}
  const a=b.dataset.rv;
  if(a==='due'){rvStart(pgDue().slice(0,15),'Today’s review');}
  else if(a==='prac'){const list=Object.entries(PG.items).filter(([k,r])=>r.n>0&&(RVF==='all'||r.d.m===RVF)).sort((x,y)=>y[1].n-x[1].n||(y[1].last||0)-(x[1].last||0)).map(([k])=>k);
    const n=Math.min(10,list.length);rvStart(shuffle(list.slice(0,Math.max(n,Math.min(list.length,20)))).slice(0,n),'Practice');}
  else if(a==='again'){rvStart(shuffle(RVLAST||[]),'Practice');}
  else if(a==='list'||a==='end'){if(a==='end'&&RV){rvFinish();return;}RV=null;cur=null;renderMiss();pgTabs();}
  else if(a==='clear'){if(!pgArm(b,'Sure? Press again to clear'))return;
    Object.keys(PG.items).forEach(k=>{if(PG.items[k].n>0&&(RVF==='all'||PG.items[k].d.m===RVF))delete PG.items[k];});RVF='all';pgSave();renderMiss();pgTabs();}
  else if(b.dataset.pgGoal){PG.goal=+b.dataset.pgGoal;pgSave();renderProg();}
  else if(b.hasAttribute('data-pg-clear')){if(!pgArm(b,'Sure? Press again'))return;PG.items={};pgSave();pgTabs();renderProg('All mistakes cleared.');}
  else if(b.hasAttribute('data-pg-reset')){if(!pgArm(b,'Everything will be deleted. Press again'))return;
    PG=Object.assign(PDEF(),{goal:PG.goal});RVLAST=null;score.ok=0;score.all=0;score.streak=0;log=[];updScore();pgSave();pgTabs();renderProg('Progress deleted. You are starting fresh.');}
});

  if(C.hap){
    let last=0;const buzz=p=>{if(!MQ.matches||!navigator.vibrate)return;const t=Date.now();if(t-last<150)return;last=t;try{navigator.vibrate(p)}catch(e){}};
    const fb=C.fb&&document.querySelector(C.fb);
    new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType!==1)continue;
      const bad=n.matches(C.hap.bad)||n.querySelector(C.hap.bad),ok=n.matches(C.hap.ok)||n.querySelector(C.hap.ok);
      if(bad||ok){buzz(bad?[30,60,30]:15);
        const f=(C.fb&&document.querySelector(C.fb))||n;
        if(MQ.matches)requestAnimationFrame(()=>{const r=f.getBoundingClientRect();if(r.bottom>window.innerHeight-140||r.top<0){try{f.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}});return}}})
      .observe(root,{childList:true,subtree:true});
  }
})();
</script>

</style>
<script>
/* Mistake gate (added): once 20 mistakes are waiting, a pop-up offers to redo them
   before the next new exercise. "Not now" asks again after 5 more mistakes. */
(function(A){
  var LIMIT=20,KEY='mgate-snooze',bypass=false,open=null;
  function n(){try{return A.count()||0}catch(e){return 0}}
  function sz(){try{return +localStorage.getItem(KEY)||0}catch(e){return 0}}
  function setSz(v){try{if(v)localStorage.setItem(KEY,String(v));else localStorage.removeItem(KEY)}catch(e){}}
  function should(){if(bypass||open)return false;try{if(A.inReview())return false}catch(e){return false}
    var c=n();if(c<LIMIT){if(sz())setSz(0);return false}var s=sz();return !s||c>=s+5}
  function close(){if(open){open.remove();open=null}}
  function pop(btn){var c=n();var d=document.createElement('div');d.className='mg-back';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','mg-h');
    d.innerHTML='<div class="mg-card"><h2 id="mg-h">Time to redo your mistakes</h2><p><span class="mg-n">'+c+'</span>mistakes are waiting for you.</p><p>Redo them now, before new exercises. Each one you get right comes off the list.</p><div class="mg-row"><button type="button" class="mg-go">Redo '+Math.min(LIMIT,c)+' mistakes</button><button type="button" class="mg-later">Not now</button></div><p class="mg-small">“Not now” continues with the new exercise. I’ll ask again after 5 more mistakes.</p></div>';
    document.body.appendChild(d);open=d;
    d.querySelector('.mg-go').onclick=function(){close();setSz(0);try{A.start()}catch(e){console.error(e)}};
    d.querySelector('.mg-later').onclick=function(){close();setSz(c);if(btn&&btn.isConnected){bypass=true;try{btn.click()}finally{bypass=false}}};
    d.addEventListener('click',function(e){if(e.target===d){close()}});
    d.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();close()}else if(e.key==='Tab'){var b=d.querySelectorAll('button'),f=b[0],l=b[b.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
    setTimeout(function(){var g=d.querySelector('.mg-go');if(g)g.focus({preventScroll:true})},30)}
  addEventListener('click',function(e){if(bypass||open)return;var b=null;try{b=A.isNext(e.target)}catch(x){}if(!b||!should())return;
    e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  ['pointerdown','touchstart','mousedown'].forEach(function(t){addEventListener(t,function(e){if(open&&!open.contains(e.target)){e.stopImmediatePropagation()}},true)});
  addEventListener('keydown',function(e){if(open){if(!open.contains(e.target)){e.preventDefault();e.stopImmediatePropagation()}return}
    if(e.key!=='Enter'||e.shiftKey||e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;var t=e.target;if(t&&t.tagName==='TEXTAREA')return;
    var b=null;try{b=A.enterNext(e)}catch(x){}if(!b||!should())return;e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  window.__mgate={count:n,should:should,open:function(){pop(null)},start:function(){setSz(0);try{A.start()}catch(e){console.error(e)}}};
})({
  count:function(){return Object.keys(PG.items).filter(function(k){return PG.items[k]&&PG.items[k].n>0}).length},
  inReview:function(){return S.mode==='miss'||S.mode==='prog'},
  isNext:function(t){var b=t.closest&&t.closest('#go,#skip');if(!b||!document.getElementById('sheet').contains(b))return null;if(S.mode==='miss'||S.mode==='prog')return null;if(b.id==='go'&&!(cur&&cur.checked))return null;return b},
  enterNext:function(){if(S.mode==='miss'||S.mode==='prog'||!(cur&&cur.checked))return null;var b=document.getElementById('go');return b&&b.offsetParent?b:null},
  start:function(){var ks=Object.keys(PG.items).filter(function(k){return PG.items[k].n>0}).sort(function(x,y){return PG.items[y].n-PG.items[x].n||(PG.items[y].last||0)-(PG.items[x].last||0)}).slice(0,20).sort(function(){return Math.random()-.5});
    S.mode='miss';save();renderTabs();renderSettings();rvStart(ks,'Redo your mistakes')}
});
</script>
