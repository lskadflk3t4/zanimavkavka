<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connectors</title>
<style>
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--ink:#1B2421;--muted:#5D6B66;--line:#D8E0DC;
  --jade:#2B7A5E;--jade-soft:#E1EFE9;--seal:#B5442F;--seal-soft:#F7E5E0;--gold:#9A6A12;--gold-soft:#F6ECD6;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-han:"Noto Serif SC","Songti SC","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715;--surface:#19211F;--ink:#E3EBE7;--muted:#93A39C;--line:#2B3632;
  --jade:#62C39C;--jade-soft:#1D3229;--seal:#E58169;--seal-soft:#3A221D;--gold:#E0B357;--gold-soft:#3A2F17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111715;--surface:#19211F;--ink:#E3EBE7;--muted:#93A39C;--line:#2B3632;
  --jade:#62C39C;--jade-soft:#1D3229;--seal:#E58169;--seal-soft:#3A221D;--gold:#E0B357;--gold-soft:#3A2F17;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 90px}
header.top{padding:22px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-read);font-weight:600;font-size:clamp(22px,5vw,30px);line-height:1.2;margin:2px 0 4px}
h1 .zh{font-family:var(--f-han)}
.lede{color:var(--muted);margin:0 0 6px;max-width:60ch}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 14px;overflow-x:auto;scrollbar-width:none}
.seg button{appearance:none;border:0;background:none;font-weight:600;color:var(--muted);padding:10px 12px 9px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;min-height:44px}
.seg button[aria-selected="true"]{color:var(--jade);border-bottom-color:var(--jade)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.opts .lab{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:64px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--jade)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
h2{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade);margin:22px 0 8px;font-weight:700}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;width:100%}
.set:hover{border-color:var(--jade)}
.set .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);line-height:1.2}
.set .no b{display:block;font-family:var(--f-han);font-size:15px;color:var(--jade);font-weight:600}
.set .t{font-weight:600;line-height:1.3}
.set .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.set .sc{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.set .sc b{color:var(--jade)}
.bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade)}
.special{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 22px -18px rgba(0,0,0,.4)}
.prog{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
.prog .pbar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .pbar i{display:block;height:100%;background:var(--jade);transition:width .25s}
.play{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb{width:52px;height:52px;border-radius:50%;border:0;background:var(--jade);color:var(--bg);cursor:pointer;display:grid;place-items:center;flex:none}
.pb svg{width:20px;height:20px;fill:currentColor}
.pb.on{box-shadow:0 0 0 5px var(--jade-soft)}
.small{font-size:13px;color:var(--muted)}
.prompt-en{font-family:var(--f-read);font-size:17px;line-height:1.4}
.prompt-en.off{color:var(--muted);font-style:italic;font-size:14px;font-family:var(--f-ui)}
.pyhint{color:var(--jade);font-size:14px}
.ans{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.ans.empty::before{content:"Tap the blocks in order";color:var(--muted);font-size:13.5px;padding:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tile{font-family:var(--f-han);font-size:19px;line-height:1.2;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 11px;cursor:pointer;min-height:44px;min-width:44px;user-select:none;box-shadow:0 1px 0 var(--line)}
.tile:hover{border-color:var(--jade)}
.tile.used{visibility:hidden}
.tile.ok{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.tile.bad{background:var(--seal-soft);border-color:var(--seal);color:var(--seal)}
.tile.given{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-family:var(--f-han);font-size:20px;line-height:1.5;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.fb.ok{background:var(--jade-soft)}
.fb.bad{background:var(--seal-soft)}
.fb .v{font-weight:700}
.fb.ok .v{color:var(--jade)}.fb.bad .v{color:var(--seal)}
.han{font-family:var(--f-han);font-size:20px;line-height:1.55}
.han .m{color:var(--seal);text-decoration:underline wavy;text-underline-offset:4px}
.han .x{color:var(--seal);text-decoration:line-through}
.han .g{color:var(--jade)}
.han .tw{color:var(--gold);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.fb .py{color:var(--jade);font-size:14px}
.fb .en{color:var(--muted);font-size:14px}
.done{text-align:center;padding:26px 10px;display:grid;gap:10px;justify-items:center}
.done .big{font-family:var(--f-read);font-size:40px;color:var(--jade);line-height:1}
.mini{display:grid;gap:6px;text-align:left;width:100%;margin-top:8px}
.mini div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px}
.mini .han{font-size:16px}
.mk{font-weight:700}.mk.g1{color:var(--jade)}.mk.g0{color:var(--seal)}.mk.gh{color:var(--gold)}
.back{border:0;background:none;color:var(--jade);font-weight:600;cursor:pointer;padding:6px 0;min-height:40px}
.note{font-size:12.5px;color:var(--muted)}
.ab{display:grid;gap:6px}
.ab div{font-family:var(--f-read);font-size:17px;line-height:1.45;background:var(--bg);border-radius:10px;padding:9px 12px}
.ab b{font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-right:6px}
.use{font-size:14px}.use b{color:var(--seal);font-size:16px}
.gapq{font-family:var(--f-read);font-size:19px;line-height:1.5}
.gapq .gp{display:inline-block;min-width:70px;border-bottom:2px solid var(--seal);color:var(--seal);text-align:center;font-weight:700}
.opts.ch{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opts.ch .opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:16px;min-height:48px;text-align:left}
.opts.ch .opt.ok{border-color:var(--jade);background:var(--jade-soft)}.opts.ch .opt.bad{border-color:var(--seal);background:var(--seal-soft)}
.cl{display:grid;gap:8px}
.cn{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:4px}
.cn .f{font-weight:700;font-size:17px;color:var(--jade)}
.cn .m{font-size:14.5px}.cn .nt{font-size:13.5px;color:var(--muted)}
.cn .ex{font-family:var(--f-read);font-size:15px;border-left:3px solid var(--line);padding-left:9px}
.tag{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--muted);vertical-align:2px}
.tag.reg-c{color:#9A6A12;border-color:#9A6A12}.tag.reg-e{color:#2E5FA8;border-color:#2E5FA8}.tag.reg-l{color:#7B3FA0;border-color:#7B3FA0}
.cn .row{gap:6px}
.lvbar{display:flex;gap:6px;flex-wrap:wrap}
.cat h2{margin-top:18px}
.src{font-size:12px;color:var(--muted)}
.ch-hint{font-size:13px;color:var(--muted)}

body.inround header.top{display:none}body.inround .wrap{padding-top:8px}
.cfg{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:0 0 12px}
.cfg>summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:600;min-height:44px}
.cfg>summary::-webkit-details-marker{display:none}
.cfg>summary small{font-weight:400;color:var(--muted);margin-left:6px}
.cfg[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.cfg .opts{padding:0 12px}
@media (max-width:480px){.tile{font-size:18px;padding:7px 9px}.han{font-size:18px}textarea{font-size:18px}}
</style></head><body>
<div class="wrap">
<header class="top" id="hd">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
</header>
<div id="app"></div>
</div>

<script>
const CFG={"lang":"de","han":false,"levels":["B1","B2","C1","C2"],"regs":{"c":"umgangssprachlich","n":"neutral","e":"gehoben","l":"literarisch"},"cats":{"cause":"Grund · Cause","cons":"Folge · Consequence","conc":"Einräumung · Concession","contr":"Gegensatz · Contrast","cond":"Bedingung · Condition","purp":"Zweck · Purpose","time":"Zeit · Time","mod":"Art und Weise · Means & manner","add":"Reihung & zweiteilige Konnektoren · Pairs","comp":"Vergleich & Proportion · Comparison","expl":"Erläuterung · Explaining"},"conns":[{"id":"weil","f":"weil","cat":"cause","reg":"n","lv":"B1","m":"because (verb at the end)","nt":"In speech you'll also hear weil + main-clause order: „…, weil ich hab keine Zeit.“ Write it with the verb at the end."},{"id":"da","f":"da","cat":"cause","reg":"n","lv":"B1","m":"as, since — the reason is known","nt":"Usually first: Da es regnete, …"},{"id":"denn","f":"denn","cat":"cause","reg":"n","lv":"B1","m":"because, for (main-clause order)","nt":"Never at the start of the sentence; the verb stays in second position."},{"id":"naemlich","f":"nämlich","cat":"cause","reg":"n","lv":"B2","m":"you see, namely (gives the reason afterwards)","nt":"Goes after the verb, never first: Er kommt nicht, er ist nämlich krank."},{"id":"zumal","f":"zumal","cat":"cause","reg":"e","lv":"C1","m":"especially as, all the more so since","nt":"Adds a second, stronger reason."},{"id":"schliesslich","f":"schließlich","cat":"cause","reg":"c","lv":"B2","m":"after all","nt":"Gives a reason the listener should accept: Er muss es wissen, schließlich ist er Arzt."},{"id":"insofern_als","f":"insofern … als","cat":"cause","reg":"e","lv":"C2","m":"insofar as, in that","nt":"Limits a statement to one respect."},{"id":"umso_mehr_als","f":"umso mehr, als","cat":"cause","reg":"e","lv":"C1","m":"all the more so as","nt":""},{"id":"ja","f":"ja doch / ja (Partikel)","cat":"cause","reg":"c","lv":"B2","m":"after all (as everyone knows)","nt":"Particle in the middle field: Du kennst ihn ja."},{"id":"deshalb","f":"deshalb / deswegen / darum","cat":"cons","reg":"n","lv":"B1","m":"that's why, so","nt":"Position 1 or the middle field; the verb follows directly."},{"id":"daher","f":"daher","cat":"cons","reg":"n","lv":"B2","m":"hence, therefore","nt":"Slightly more formal than deshalb."},{"id":"also","f":"also","cat":"cons","reg":"c","lv":"B1","m":"so, therefore","nt":"Not \"also\"! The verb follows: Also gehen wir."},{"id":"sodass","f":"sodass","cat":"cons","reg":"n","lv":"B2","m":"so that (result)","nt":"Verb at the end. Not purpose (that is damit)."},{"id":"so_dass","f":"so … dass","cat":"cons","reg":"n","lv":"B2","m":"so … that","nt":"so stands before the adjective: Er war so müde, dass …"},{"id":"folglich","f":"folglich","cat":"cons","reg":"e","lv":"C1","m":"consequently","nt":""},{"id":"infolgedessen","f":"infolgedessen","cat":"cons","reg":"e","lv":"C1","m":"as a result (of that)","nt":"Official and written style."},{"id":"somit","f":"somit / demnach","cat":"cons","reg":"e","lv":"C1","m":"thus, accordingly","nt":""},{"id":"dann_halt","f":"dann (eben / halt)","cat":"cons","reg":"c","lv":"B2","m":"then just …, well then","nt":"Shrugging acceptance: Dann nehmen wir halt den Bus."},{"id":"obwohl","f":"obwohl","cat":"conc","reg":"n","lv":"B1","m":"although","nt":"Verb at the end. In speech, obwohl + main clause corrects what was just said."},{"id":"obgleich","f":"obgleich / obschon","cat":"conc","reg":"l","lv":"C1","m":"although (elevated)","nt":"Same word order as obwohl."},{"id":"wenngleich","f":"wenngleich","cat":"conc","reg":"l","lv":"C2","m":"although, albeit","nt":"Can also shorten: ein kleiner, wenngleich wichtiger Schritt."},{"id":"trotzdem","f":"trotzdem","cat":"conc","reg":"n","lv":"B1","m":"nevertheless, still","nt":"Main-clause adverb: verb right after it in position 1."},{"id":"dennoch","f":"dennoch","cat":"conc","reg":"e","lv":"B2","m":"nevertheless, yet","nt":""},{"id":"zwar_aber","f":"zwar … aber","cat":"conc","reg":"n","lv":"B2","m":"admittedly … but","nt":"zwar sits in the first clause's middle field."},{"id":"auch_wenn","f":"auch wenn / selbst wenn","cat":"conc","reg":"n","lv":"B2","m":"even if","nt":"After the auch-wenn clause the main clause starts with its verb: Auch wenn …, findet …"},{"id":"wie_auch","f":"wie … auch / so … auch","cat":"conc","reg":"l","lv":"C2","m":"however …, no matter how","nt":"Wie sehr er sich auch bemühte, …: the main clause keeps verb-second WITHOUT inversion."},{"id":"ungeachtet","f":"ungeachtet dessen, dass","cat":"conc","reg":"e","lv":"C2","m":"notwithstanding the fact that","nt":""},{"id":"allerdings","f":"allerdings","cat":"conc","reg":"n","lv":"B2","m":"however, though (restricting)","nt":""},{"id":"immerhin","f":"immerhin","cat":"conc","reg":"c","lv":"B2","m":"at least, still","nt":""},{"id":"aber","f":"aber","cat":"contr","reg":"n","lv":"B1","m":"but","nt":"Position 0: no effect on word order."},{"id":"sondern","f":"nicht …, sondern","cat":"contr","reg":"n","lv":"B1","m":"not …, but (rather)","nt":"Only after a negation, replacing the wrong item."},{"id":"waehrend_c","f":"während (Gegensatz)","cat":"contr","reg":"n","lv":"B2","m":"whereas, while","nt":"Verb at the end."},{"id":"wohingegen","f":"wohingegen","cat":"contr","reg":"e","lv":"C1","m":"whereas","nt":"Verb at the end; written style."},{"id":"jedoch","f":"jedoch","cat":"contr","reg":"e","lv":"B2","m":"however","nt":"Position 0 or 1, or in the middle field."},{"id":"dagegen","f":"dagegen / hingegen","cat":"contr","reg":"e","lv":"C1","m":"on the other hand, by contrast","nt":"Often after the subject: Sein Bruder hingegen …"},{"id":"stattdessen","f":"stattdessen","cat":"contr","reg":"n","lv":"B2","m":"instead (of that)","nt":"Main-clause adverb."},{"id":"anstatt","f":"(an)statt zu / (an)statt dass","cat":"contr","reg":"n","lv":"B2","m":"instead of (doing)","nt":"statt zu with the same subject, statt dass with a different subject."},{"id":"doch","f":"doch","cat":"contr","reg":"l","lv":"C1","m":"but, yet (elevated)","nt":"As a conjunction like aber; in literary style also with the verb first: Er rief, doch niemand kam."},{"id":"wenn","f":"wenn","cat":"cond","reg":"n","lv":"B1","m":"if","nt":"Verb at the end; the main clause starts with the verb (or with dann)."},{"id":"falls","f":"falls","cat":"cond","reg":"n","lv":"B2","m":"in case, if","nt":"Sounds more hypothetical than wenn."},{"id":"sofern","f":"sofern","cat":"cond","reg":"e","lv":"C1","m":"provided that, as long as","nt":""},{"id":"es_sei_denn","f":"es sei denn","cat":"cond","reg":"e","lv":"C1","m":"unless","nt":"The clause after it has main-clause order."},{"id":"sonst","f":"sonst / andernfalls","cat":"cond","reg":"n","lv":"B1","m":"otherwise","nt":"andernfalls is formal."},{"id":"vorausgesetzt","f":"vorausgesetzt, (dass)","cat":"cond","reg":"e","lv":"C1","m":"provided (that)","nt":""},{"id":"sollte","f":"Sollte … (Inversion)","cat":"cond","reg":"e","lv":"C1","m":"should …, if …","nt":"Conditional without wenn: the verb comes first."},{"id":"haette","f":"Hätte / Wäre … (Inversion)","cat":"cond","reg":"l","lv":"C1","m":"had …, were … (unreal, no wenn)","nt":""},{"id":"wenn_irreal","f":"wenn … würde / hätte","cat":"cond","reg":"n","lv":"B2","m":"if … would (unreal)","nt":"Konjunktiv II in both clauses."},{"id":"damit","f":"damit","cat":"purp","reg":"n","lv":"B1","m":"so that","nt":"Use damit when the subjects differ; with the same subject um … zu is preferred."},{"id":"um_zu","f":"um … zu","cat":"purp","reg":"n","lv":"B1","m":"(in order) to","nt":"Same subject in both parts."},{"id":"auf_dass","f":"auf dass","cat":"purp","reg":"l","lv":"C2","m":"that, so that (archaic, solemn)","nt":""},{"id":"als","f":"als","cat":"time","reg":"n","lv":"B1","m":"when (one time in the past)","nt":""},{"id":"wenn_t","f":"wenn (immer wenn)","cat":"time","reg":"n","lv":"B1","m":"when, whenever (repeated or future)","nt":""},{"id":"waehrend","f":"während","cat":"time","reg":"n","lv":"B1","m":"while","nt":""},{"id":"nachdem","f":"nachdem","cat":"time","reg":"n","lv":"B2","m":"after","nt":"Usually one tense back: Plusquamperfekt + Präteritum / Perfekt + Präsens."},{"id":"bevor","f":"bevor","cat":"time","reg":"n","lv":"B1","m":"before","nt":""},{"id":"ehe","f":"ehe","cat":"time","reg":"l","lv":"C1","m":"before, ere (elevated)","nt":""},{"id":"seitdem","f":"seit / seitdem","cat":"time","reg":"n","lv":"B2","m":"since","nt":""},{"id":"sobald","f":"sobald","cat":"time","reg":"n","lv":"B2","m":"as soon as","nt":""},{"id":"solange","f":"solange","cat":"time","reg":"n","lv":"B2","m":"as long as","nt":""},{"id":"bis","f":"bis","cat":"time","reg":"n","lv":"B1","m":"until","nt":""},{"id":"kaum","f":"kaum …, als / kaum dass","cat":"time","reg":"l","lv":"C1","m":"hardly … when, no sooner … than","nt":""},{"id":"sowie","f":"sowie","cat":"time","reg":"e","lv":"C1","m":"as soon as (written)","nt":""},{"id":"indessen","f":"indessen / indes","cat":"time","reg":"l","lv":"C2","m":"meanwhile, while (literary)","nt":""},{"id":"indem","f":"indem","cat":"mod","reg":"n","lv":"B2","m":"by (doing)","nt":"Verb at the end: Man lernt, indem man übt."},{"id":"dadurch_dass","f":"dadurch, dass","cat":"mod","reg":"n","lv":"C1","m":"by (the fact that), because","nt":"dadurch in the main clause points to the dass-clause."},{"id":"ohne_dass","f":"ohne zu / ohne dass","cat":"mod","reg":"n","lv":"B2","m":"without (doing)","nt":"ohne zu with the same subject, ohne dass with a different subject."},{"id":"als_ob","f":"als ob / als wenn","cat":"mod","reg":"n","lv":"B2","m":"as if","nt":"Konjunktiv II or I, verb at the end."},{"id":"als_inv","f":"als + Verb (als ob ohne ob)","cat":"mod","reg":"l","lv":"C1","m":"as if (elevated)","nt":"The verb follows als directly: als wäre nichts geschehen."},{"id":"wie_wenn","f":"wie wenn","cat":"mod","reg":"c","lv":"B2","m":"as if (spoken)","nt":""},{"id":"soweit","f":"soweit / soviel","cat":"mod","reg":"n","lv":"C1","m":"as far as","nt":"Soweit ich weiß, …"},{"id":"sowohl","f":"sowohl … als auch","cat":"add","reg":"n","lv":"B2","m":"both … and","nt":""},{"id":"weder","f":"weder … noch","cat":"add","reg":"n","lv":"B2","m":"neither … nor","nt":"No extra nicht."},{"id":"entweder","f":"entweder … oder","cat":"add","reg":"n","lv":"B1","m":"either … or","nt":""},{"id":"nicht_nur","f":"nicht nur …, sondern auch","cat":"add","reg":"n","lv":"B2","m":"not only … but also","nt":""},{"id":"einerseits","f":"einerseits …, andererseits","cat":"add","reg":"n","lv":"B2","m":"on the one hand …, on the other","nt":""},{"id":"zum_einen","f":"zum einen …, zum anderen","cat":"add","reg":"e","lv":"C1","m":"for one thing …, for another","nt":""},{"id":"ausserdem","f":"außerdem / zudem / überdies","cat":"add","reg":"n","lv":"B1","m":"besides, moreover","nt":"zudem and überdies are written style."},{"id":"ferner","f":"ferner / des Weiteren","cat":"add","reg":"e","lv":"C1","m":"furthermore","nt":""},{"id":"bald_bald","f":"bald …, bald","cat":"add","reg":"l","lv":"C2","m":"now …, now; sometimes …, sometimes","nt":""},{"id":"je_desto","f":"je …, desto / umso","cat":"comp","reg":"n","lv":"B2","m":"the … the","nt":"je + comparative, verb at the end; desto + comparative, then the verb."},{"id":"wie_comp","f":"so … wie / anders als","cat":"comp","reg":"n","lv":"B1","m":"as … as / different from","nt":""},{"id":"als_dass","f":"zu …, als dass","cat":"comp","reg":"e","lv":"C1","m":"too … for / to","nt":"Konjunktiv II in the als-dass clause."},{"id":"das_heisst","f":"das heißt (d. h.)","cat":"expl","reg":"n","lv":"B1","m":"that is, i.e.","nt":""},{"id":"und_zwar","f":"und zwar","cat":"expl","reg":"n","lv":"B2","m":"namely, and that is","nt":"Adds a precise detail."},{"id":"beziehungsweise","f":"beziehungsweise (bzw.)","cat":"expl","reg":"e","lv":"C1","m":"or rather / respectively","nt":""},{"id":"sprich","f":"sprich","cat":"expl","reg":"c","lv":"B2","m":"in other words, i.e. (spoken)","nt":""},{"id":"uebrigens","f":"übrigens","cat":"expl","reg":"c","lv":"B1","m":"by the way","nt":""},{"id":"jedenfalls","f":"jedenfalls / jedenfalls …","cat":"expl","reg":"c","lv":"B2","m":"anyway, in any case","nt":""}],"items":[{"c":"weil","lv":"B1","a":"Ich bleibe heute zu Hause.","b":"Ich bin erkältet.","s":"Ich bleibe heute zu Hause, {weil} ich erkältet bin.","alts":["Weil ich erkältet bin, bleibe ich heute zu Hause."],"tr":"I'm staying at home today because I've got a cold."},{"c":"weil","lv":"B1","a":"Wir haben den Zug verpasst.","b":"Der Bus hatte Verspätung.","s":"Wir haben den Zug verpasst, {weil} der Bus Verspätung hatte.","alts":["Weil der Bus Verspätung hatte, haben wir den Zug verpasst."],"tr":"We missed the train because the bus was late."},{"c":"weil","lv":"B2","a":"Sie hat gekündigt.","b":"Sie konnte mit dem neuen Chef nicht arbeiten.","s":"Sie hat gekündigt, {weil} sie mit dem neuen Chef nicht arbeiten konnte.","alts":["Weil sie mit dem neuen Chef nicht arbeiten konnte, hat sie gekündigt."],"tr":"She quit because she couldn't work with the new boss."},{"c":"da","lv":"B1","a":"Es regnete den ganzen Tag.","b":"Wir sind im Hotel geblieben.","s":"{Da} es den ganzen Tag regnete, sind wir im Hotel geblieben.","alts":["Wir sind im Hotel geblieben, da es den ganzen Tag regnete."],"tr":"As it rained all day, we stayed in the hotel."},{"c":"da","lv":"B2","a":"Der Termin ist Ihnen ja bekannt.","b":"Ich fasse mich kurz.","s":"{Da} Ihnen der Termin bekannt ist, fasse ich mich kurz.","alts":["Da Ihnen der Termin ja bekannt ist, fasse ich mich kurz."],"tr":"Since you know the date, I'll keep it short."},{"c":"denn","lv":"B1","a":"Nimm einen Schirm mit.","b":"Es soll regnen.","s":"Nimm einen Schirm mit, {denn} es soll regnen.","tr":"Take an umbrella, it's supposed to rain."},{"c":"denn","lv":"B1","a":"Er war sehr glücklich.","b":"Er hatte die Prüfung bestanden.","s":"Er war sehr glücklich, {denn} er hatte die Prüfung bestanden.","tr":"He was very happy, for he had passed the exam."},{"c":"naemlich","lv":"B2","a":"Ich kann heute nicht kommen.","b":"Ich muss arbeiten.","s":"Ich kann heute nicht kommen, ich muss {nämlich} arbeiten.","alts":["Ich kann heute nicht kommen. Ich muss nämlich arbeiten."],"tr":"I can't come today — I have to work, you see."},{"c":"naemlich","lv":"B2","a":"Sie spricht perfekt Spanisch.","b":"Ihre Mutter kommt aus Madrid.","s":"Sie spricht perfekt Spanisch, ihre Mutter kommt {nämlich} aus Madrid.","alts":["Sie spricht perfekt Spanisch. Ihre Mutter kommt nämlich aus Madrid."],"tr":"She speaks perfect Spanish — her mother's from Madrid, you see."},{"c":"zumal","lv":"C1","a":"Wir sollten das Angebot annehmen.","b":"Es ist zeitlich begrenzt.","s":"Wir sollten das Angebot annehmen, {zumal} es zeitlich begrenzt ist.","tr":"We should accept the offer, especially as it's only for a limited time."},{"c":"zumal","lv":"C1","a":"Ich verstehe seine Verärgerung.","b":"Man hatte ihm Unterstützung zugesagt.","s":"Ich verstehe seine Verärgerung, {zumal} man ihm Unterstützung zugesagt hatte.","tr":"I understand his annoyance, all the more so since he'd been promised support."},{"c":"schliesslich","lv":"B2","a":"Frag doch Anna.","b":"Sie ist Ärztin.","s":"Frag doch Anna, sie ist {schließlich} Ärztin.","alts":["Frag doch Anna, schließlich ist sie Ärztin."],"tr":"Just ask Anna — she's a doctor, after all."},{"c":"schliesslich","lv":"B2","a":"Du musst dich nicht entschuldigen.","b":"Es war nicht deine Schuld.","s":"Du musst dich nicht entschuldigen, es war {schließlich} nicht deine Schuld.","alts":["Du musst dich nicht entschuldigen, schließlich war es nicht deine Schuld."],"tr":"You needn't apologise — it wasn't your fault, after all."},{"c":"insofern_als","lv":"C2","a":"Die Reform war ein Erfolg.","b":"Sie hat die Verwaltungskosten gesenkt.","s":"Die Reform war {insofern} ein Erfolg, {als} sie die Verwaltungskosten gesenkt hat.","tr":"The reform was a success insofar as it reduced administrative costs."},{"c":"umso_mehr_als","lv":"C1","a":"Die Absage ist bedauerlich.","b":"Die Vorbereitungen waren schon abgeschlossen.","s":"Die Absage ist {umso} {mehr} bedauerlich, {als} die Vorbereitungen schon abgeschlossen waren.","alts":["Die Absage ist umso bedauerlicher, als die Vorbereitungen schon abgeschlossen waren."],"tr":"The cancellation is all the more regrettable as preparations were already complete."},{"c":"ja","lv":"B2","a":"Du kennst ihn.","b":"Er kommt immer zu spät.","s":"Er kommt {ja} immer zu spät, du kennst ihn.","alts":["Du kennst ihn ja, er kommt immer zu spät."],"tr":"He's always late, you know what he's like."},{"c":"deshalb","lv":"B1","a":"Ich habe kein Auto.","b":"Ich fahre mit dem Fahrrad zur Arbeit.","s":"Ich habe kein Auto, {deshalb} fahre ich mit dem Fahrrad zur Arbeit.","alts":["Ich habe kein Auto, deswegen fahre ich mit dem Fahrrad zur Arbeit.","Ich habe kein Auto, darum fahre ich mit dem Fahrrad zur Arbeit."],"tr":"I don't have a car, so I cycle to work."},{"c":"deshalb","lv":"B1","a":"Der Laden war geschlossen.","b":"Wir haben beim Bäcker gegessen.","s":"Der Laden war geschlossen, {deswegen} haben wir beim Bäcker gegessen.","alts":["Der Laden war geschlossen, deshalb haben wir beim Bäcker gegessen.","Der Laden war geschlossen, darum haben wir beim Bäcker gegessen."],"tr":"The shop was closed, so we ate at the bakery."},{"c":"deshalb","lv":"B2","a":"Sie hat lange in Japan gelebt.","b":"Sie kann ein bisschen Japanisch.","s":"Sie hat lange in Japan gelebt und kann {deshalb} ein bisschen Japanisch.","alts":["Sie hat lange in Japan gelebt, deshalb kann sie ein bisschen Japanisch."],"tr":"She lived in Japan for a long time and so knows a bit of Japanese."},{"c":"daher","lv":"B2","a":"Die Nachfrage ist stark gestiegen.","b":"Die Preise wurden erhöht.","s":"Die Nachfrage ist stark gestiegen, {daher} wurden die Preise erhöht.","alts":["Die Nachfrage ist stark gestiegen. Daher wurden die Preise erhöht."],"tr":"Demand has risen sharply; hence prices have been raised."},{"c":"also","lv":"B1","a":"Es ist schon zehn.","b":"Wir müssen los.","s":"Es ist schon zehn, {also} müssen wir los.","alts":["Es ist schon zehn, wir müssen also los."],"tr":"It's already ten, so we have to go."},{"c":"also","lv":"B1","a":"Du hast keinen Hunger?","b":"Ich esse allein.","s":"Du hast keinen Hunger? {Also} esse ich allein.","alts":["Du hast keinen Hunger? Dann esse ich also allein."],"tr":"You're not hungry? So I'll eat alone."},{"c":"sodass","lv":"B2","a":"Es hat stark geschneit.","b":"Die Schulen blieben geschlossen.","s":"Es hat stark geschneit, {sodass} die Schulen geschlossen blieben.","alts":["Es hat stark geschneit, so dass die Schulen geschlossen blieben."],"tr":"It snowed heavily, so the schools stayed closed."},{"c":"sodass","lv":"B2","a":"Er sprach sehr leise.","b":"Niemand konnte ihn verstehen.","s":"Er sprach sehr leise, {sodass} ihn niemand verstehen konnte.","alts":["Er sprach sehr leise, sodass niemand ihn verstehen konnte.","Er sprach sehr leise, so dass ihn niemand verstehen konnte."],"tr":"He spoke so quietly that nobody could understand him."},{"c":"so_dass","lv":"B2","a":"Ich war müde.","b":"Ich bin auf dem Sofa eingeschlafen.","s":"Ich war {so} müde, {dass} ich auf dem Sofa eingeschlafen bin.","tr":"I was so tired that I fell asleep on the sofa."},{"c":"so_dass","lv":"B2","a":"Das Wasser war kalt.","b":"Niemand wollte schwimmen.","s":"Das Wasser war {so} kalt, {dass} niemand schwimmen wollte.","tr":"The water was so cold that nobody wanted to swim."},{"c":"folglich","lv":"C1","a":"Alle Kandidaten erfüllen die Kriterien.","b":"Die Entscheidung wird schwierig.","s":"Alle Kandidaten erfüllen die Kriterien, {folglich} wird die Entscheidung schwierig.","alts":["Alle Kandidaten erfüllen die Kriterien. Folglich wird die Entscheidung schwierig."],"tr":"All the candidates meet the criteria; consequently the decision will be difficult."},{"c":"infolgedessen","lv":"C1","a":"Die Brücke musste gesperrt werden.","b":"Es kam zu kilometerlangen Staus.","s":"Die Brücke musste gesperrt werden, {infolgedessen} kam es zu kilometerlangen Staus.","alts":["Die Brücke musste gesperrt werden. Infolgedessen kam es zu kilometerlangen Staus."],"tr":"The bridge had to be closed; as a result there were tailbacks for miles."},{"c":"somit","lv":"C1","a":"Der Antrag wurde fristgerecht eingereicht.","b":"Er ist gültig.","s":"Der Antrag wurde fristgerecht eingereicht und ist {somit} gültig.","alts":["Der Antrag wurde fristgerecht eingereicht, somit ist er gültig."],"tr":"The application was submitted on time and is therefore valid."},{"c":"somit","lv":"C1","a":"Die Mehrheit hat zugestimmt.","b":"Der Vorschlag gilt als angenommen.","s":"Die Mehrheit hat zugestimmt, {demnach} gilt der Vorschlag als angenommen.","alts":["Die Mehrheit hat zugestimmt, somit gilt der Vorschlag als angenommen."],"tr":"The majority agreed; accordingly the proposal is considered accepted."},{"c":"dann_halt","lv":"B2","a":"Der letzte Bus ist weg.","b":"Wir laufen eben nach Hause.","s":"Der letzte Bus ist weg, {dann} laufen wir {halt} nach Hause.","alts":["Der letzte Bus ist weg, dann laufen wir eben nach Hause."],"tr":"The last bus has gone — well, we'll just walk home then."},{"c":"dann_halt","lv":"B2","a":"Du willst nicht mitkommen?","b":"Ich gehe allein.","s":"Du willst nicht mitkommen? {Dann} gehe ich {eben} allein.","alts":["Du willst nicht mitkommen? Dann gehe ich halt allein."],"tr":"You don't want to come? Then I'll just go on my own."},{"c":"obwohl","lv":"B1","a":"Es war sehr kalt.","b":"Wir sind schwimmen gegangen.","s":"{Obwohl} es sehr kalt war, sind wir schwimmen gegangen.","alts":["Wir sind schwimmen gegangen, obwohl es sehr kalt war."],"tr":"Although it was very cold, we went swimming."},{"c":"obwohl","lv":"B1","a":"Er hat wenig gelernt.","b":"Er hat die Prüfung bestanden.","s":"{Obwohl} er wenig gelernt hat, hat er die Prüfung bestanden.","alts":["Er hat die Prüfung bestanden, obwohl er wenig gelernt hat."],"tr":"Although he studied little, he passed the exam."},{"c":"obwohl","lv":"B2","a":"Sie ist müde.","b":"Sie arbeitet noch bis Mitternacht.","s":"Sie arbeitet noch bis Mitternacht, {obwohl} sie müde ist.","alts":["Obwohl sie müde ist, arbeitet sie noch bis Mitternacht."],"tr":"She's working until midnight even though she's tired."},{"c":"obgleich","lv":"C1","a":"Die Fakten waren bekannt.","b":"Niemand zog Konsequenzen.","s":"{Obgleich} die Fakten bekannt waren, zog niemand Konsequenzen.","alts":["Niemand zog Konsequenzen, obgleich die Fakten bekannt waren.","Obschon die Fakten bekannt waren, zog niemand Konsequenzen."],"tr":"Although the facts were known, nobody drew any conclusions."},{"c":"obgleich","lv":"C1","a":"Er war ein armer Mann.","b":"Er gab stets mit vollen Händen.","s":"{Obschon} er ein armer Mann war, gab er stets mit vollen Händen.","alts":["Obgleich er ein armer Mann war, gab er stets mit vollen Händen."],"tr":"Though he was a poor man, he always gave generously."},{"c":"wenngleich","lv":"C2","a":"Die Ergebnisse sind ermutigend.","b":"Sie sind noch nicht repräsentativ.","s":"Die Ergebnisse sind ermutigend, {wenngleich} sie noch nicht repräsentativ sind.","tr":"The results are encouraging, albeit not yet representative."},{"c":"wenngleich","lv":"C2","a":"Der Roman ist ein Meisterwerk.","b":"Er ist streckenweise langatmig.","s":"Der Roman ist ein Meisterwerk, {wenngleich} er streckenweise langatmig ist.","alts":["Wenngleich er streckenweise langatmig ist, ist der Roman ein Meisterwerk."],"tr":"The novel is a masterpiece, although in places it drags."},{"c":"trotzdem","lv":"B1","a":"Das Hotel war teuer.","b":"Wir haben dort übernachtet.","s":"Das Hotel war teuer, {trotzdem} haben wir dort übernachtet.","alts":["Das Hotel war teuer, wir haben trotzdem dort übernachtet.","Das Hotel war teuer, wir haben dort trotzdem übernachtet."],"tr":"The hotel was expensive, but we stayed there anyway."},{"c":"trotzdem","lv":"B1","a":"Ich habe ihn gewarnt.","b":"Er hat es gemacht.","s":"Ich habe ihn gewarnt, {trotzdem} hat er es gemacht.","alts":["Ich habe ihn gewarnt, er hat es trotzdem gemacht."],"tr":"I warned him, but he did it anyway."},{"c":"dennoch","lv":"B2","a":"Die Lage ist ernst.","b":"Es gibt keinen Grund zur Panik.","s":"Die Lage ist ernst, {dennoch} gibt es keinen Grund zur Panik.","alts":["Die Lage ist ernst. Dennoch gibt es keinen Grund zur Panik.","Die Lage ist ernst, es gibt dennoch keinen Grund zur Panik."],"tr":"The situation is serious; nevertheless there's no reason to panic."},{"c":"zwar_aber","lv":"B2","a":"Die Wohnung ist klein.","b":"Sie liegt sehr zentral.","s":"Die Wohnung ist {zwar} klein, {aber} sie liegt sehr zentral.","alts":["Die Wohnung ist zwar klein, liegt aber sehr zentral.","Zwar ist die Wohnung klein, aber sie liegt sehr zentral."],"tr":"The flat is small, admittedly, but it's very central."},{"c":"zwar_aber","lv":"B2","a":"Ich habe ihn gesehen.","b":"Ich habe nicht mit ihm gesprochen.","s":"Ich habe ihn {zwar} gesehen, {aber} nicht mit ihm gesprochen.","alts":["Ich habe ihn zwar gesehen, aber ich habe nicht mit ihm gesprochen."],"tr":"I did see him, but I didn't talk to him."},{"c":"auch_wenn","lv":"B2","a":"Es regnet morgen vielleicht.","b":"Das Fest findet statt.","s":"{Auch} {wenn} es morgen regnet, findet das Fest statt.","alts":["Das Fest findet statt, auch wenn es morgen regnet.","Selbst wenn es morgen regnet, findet das Fest statt."],"tr":"Even if it rains tomorrow, the party will go ahead."},{"c":"auch_wenn","lv":"B2","a":"Du bist anderer Meinung.","b":"Du solltest ihn ausreden lassen.","s":"{Auch} {wenn} du anderer Meinung bist, solltest du ihn ausreden lassen.","alts":["Du solltest ihn ausreden lassen, auch wenn du anderer Meinung bist."],"tr":"Even if you disagree, you should let him finish."},{"c":"auch_wenn","lv":"C1","a":"Man bietet mir das Doppelte.","b":"Ich würde nicht wechseln.","s":"{Selbst} {wenn} man mir das Doppelte böte, würde ich nicht wechseln.","alts":["Selbst wenn man mir das Doppelte bieten würde, würde ich nicht wechseln.","Auch wenn man mir das Doppelte böte, würde ich nicht wechseln."],"tr":"Even if they offered me twice as much, I wouldn't change jobs."},{"c":"wie_auch","lv":"C2","a":"Er bemühte sich sehr.","b":"Er fand keinen Zugang zu ihr.","s":"{Wie} sehr er sich {auch} bemühte, er fand keinen Zugang zu ihr.","alts":["So sehr er sich auch bemühte, er fand keinen Zugang zu ihr."],"tr":"However hard he tried, he could not reach her."},{"c":"wie_auch","lv":"C2","a":"Die Lage mag verfahren sein.","b":"Wir werden eine Lösung finden.","s":"{So} verfahren die Lage {auch} sein mag, wir werden eine Lösung finden.","alts":["Wie verfahren die Lage auch sein mag, wir werden eine Lösung finden."],"tr":"However deadlocked the situation may be, we will find a solution."},{"c":"ungeachtet","lv":"C2","a":"Die Proteste dauerten an.","b":"Die Regierung hielt an dem Gesetz fest.","s":"{Ungeachtet} {dessen,} {dass} die Proteste andauerten, hielt die Regierung an dem Gesetz fest.","tr":"Notwithstanding the continuing protests, the government stuck to the law."},{"c":"allerdings","lv":"B2","a":"Das Essen war ausgezeichnet.","b":"Der Service war etwas langsam.","s":"Das Essen war ausgezeichnet, der Service war {allerdings} etwas langsam.","alts":["Das Essen war ausgezeichnet, allerdings war der Service etwas langsam."],"tr":"The food was excellent, though the service was a bit slow."},{"c":"immerhin","lv":"B2","a":"Wir haben verloren.","b":"Wir haben ein Tor geschossen.","s":"Wir haben verloren, aber {immerhin} haben wir ein Tor geschossen.","alts":["Wir haben verloren, haben aber immerhin ein Tor geschossen.","Wir haben zwar verloren, aber immerhin ein Tor geschossen."],"tr":"We lost, but at least we scored a goal."},{"c":"aber","lv":"B1","a":"Ich wollte dich anrufen.","b":"Ich hatte keinen Empfang.","s":"Ich wollte dich anrufen, {aber} ich hatte keinen Empfang.","alts":["Ich wollte dich anrufen, hatte aber keinen Empfang."],"tr":"I wanted to call you, but I had no signal."},{"c":"aber","lv":"B1","a":"Das Restaurant ist klein.","b":"Das Essen ist fantastisch.","s":"Das Restaurant ist klein, {aber} d ld town is overcrowded; the suburbs, by contrast, are quiet."},{"c":"dagegen","lv":"C1","a":"Sie ist sehr extrovertiert.","b":"Ihr Mann ist eher zurückhaltend.","s":"Sie ist sehr extrovertiert, ihr Mann {hingegen} ist eher zurückhaltend.","alts":["Sie ist sehr extrovertiert, ihr Mann dagegen ist eher zurückhaltend."],"tr":"She's very outgoing; her husband, on the other hand, is rather reserved."},{"c":"stattdessen","lv":"B2","a":"Er hat nicht gelernt.","b":"Er hat den ganzen Abend gezockt.","s":"Er hat nicht gelernt, {stattdessen} hat er den ganzen Abend gezockt.","alts":["Er hat nicht gelernt, sondern stattdessen den ganzen Abend gezockt."],"tr":"He didn't study; instead he gamed all evening."},{"c":"anstatt","lv":"B2","a":"Er sieht fern.","b":"Er sollte seine Hausaufgaben machen.","s":"Er sieht fern, {anstatt} seine Hausaufgaben {zu} machen.","alts":["Anstatt seine Hausaufgaben zu machen, sieht er fern.","Er sieht fern, statt seine Hausaufgaben zu machen."],"tr":"He's watching TV instead of doing his homework."},{"c":"anstatt","lv":"C1","a":"Der Chef entscheidet alles allein.","b":"Das Team wird nicht gefragt.","s":"Der Chef entscheidet alles allein, {statt} {dass} das Team gefragt wird.","alts":["Der Chef entscheidet alles allein, anstatt dass das Team gefragt wird."],"tr":"The boss decides everything alone instead of the team being consulted."},{"c":"doch","lv":"C1","a":"Er rief um Hilfe.","b":"Niemand hörte ihn.","s":"Er rief um Hilfe, {doch} niemand hörte ihn.","tr":"He called for help, but no one heard him."},{"c":"doch","lv":"C2","a":"Sie wollte etwas erwidern.","b":"Die Worte versagten ihr.","s":"Sie wollte etwas erwidern, {doch} die Worte versagten ihr.","alts":["Sie wollte etwas erwidern, doch versagten ihr die Worte."],"tr":"She wanted to reply, yet words failed her."},{"c":"wenn","lv":"B1","a":"Du hast morgen Zeit.","b":"Wir können ins Kino gehen.","s":"{Wenn} du morgen Zeit hast, können wir ins Kino gehen.","alts":["Wir können ins Kino gehen, wenn du m n, sonst wird der Antrag abgelehnt."],"tr":"The deadline must be met, otherwise the application will be rejected."},{"c":"vorausgesetzt","lv":"C1","a":"Ich übernehme die Aufgabe.","b":"Ich bekomme mehr Zeit.","s":"Ich übernehme die Aufgabe, {vorausgesetzt,} {dass} ich mehr Zeit bekomme.","alts":["Ich übernehme die Aufgabe, vorausgesetzt, ich bekomme mehr Zeit."],"tr":"I'll take on the task, provided I get more time."},{"c":"sollte","lv":"C1","a":"Sie haben Rückfragen.","b":"Wenden Sie sich an unser Büro.","s":"{Sollten} Sie Rückfragen haben, wenden Sie sich an unser Büro.","alts":["Falls Sie Rückfragen haben, wenden Sie sich an unser Büro."],"tr":"Should you have any queries, please contact our office."},{"c":"sollte","lv":"C1","a":"Der Zug fällt aus.","b":"Wir nehmen einen Fernbus.","s":"{Sollte} der Zug ausfallen, nehmen wir einen Fernbus.","alts":["Falls der Zug ausfällt, nehmen wir einen Fernbus."],"tr":"Should the train be cancelled, we'll take a coach."},{"c":"haette","lv":"C1","a":"Ich habe es nicht gewusst.","b":"Ich hätte dir geholfen.","s":"{Hätte} ich es gewusst, hätte ich dir geholfen.","alts":["Wenn ich es gewusst hätte, hätte ich dir geholfen."],"tr":"Had I known, I would have helped you."},{"c":"haette","lv":"C2","a":"Er war nicht so stur.","b":"Man hätte sich längst geeinigt.","s":"{Wäre} er nicht so stur, hätte man sich längst geeinigt.","alts":["Wenn er nicht so stur wäre, hätte man sich längst geeinigt."],"tr":"Were he not so stubborn, an agreement would have been reached long ago."},{"c":"wenn_irreal","lv":"B2","a":"Ich habe kein Geld.","b":"Ich reise nicht um die Welt.","s":"{Wenn} ich Geld hätte, {würde} ich um die Welt reisen.","alts":["Wenn ich Geld hätte, reiste ich um die Welt.","Ich würde um die Welt reisen, wenn ich Geld hätte."],"tr":"If I had money, I'd travel around the world."},{"c":"wenn_irreal","lv":"B2","a":"Du bist nicht früher gekommen.","b":"Du hast ihn verpasst.","s":"{Wenn} du früher gekommen wärst, {hättest} du ihn nicht verp e ich joggen.","alts":["Ich gehe joggen, wenn ich Stress habe.","Immer wenn ich Stress habe, gehe ich joggen."],"tr":"Whenever I'm stressed, I go jogging."},{"c":"wenn_t","lv":"B1","a":"Du kommst an.","b":"Schick mir eine Nachricht.","s":"{Wenn} du ankommst, schick mir eine Nachricht.","alts":["Schick mir eine Nachricht, wenn du ankommst."],"tr":"When you arrive, send me a message."},{"c":"waehrend","lv":"B1","a":"Ich koche.","b":"Ich höre gern Radio.","s":"{Während} ich koche, höre ich gern Radio.","alts":["Ich höre gern Radio, während ich koche."],"tr":"I like listening to the radio while I cook."},{"c":"nachdem","lv":"B2","a":"Wir hatten gegessen.","b":"Wir gingen spazieren.","s":"{Nachdem} wir gegessen hatten, gingen wir spazieren.","alts":["Wir gingen spazieren, nachdem wir gegessen hatten."],"tr":"After we'd eaten, we went for a walk."},{"c":"nachdem","lv":"B2","a":"Er hat das Studium beendet.","b":"Er geht ins Ausland.","s":"{Nachdem} er das Studium beendet hat, geht er ins Ausland.","alts":["Er geht ins Ausland, nachdem er das Studium beendet hat."],"tr":"After finishing his degree he's going abroad."},{"c":"bevor","lv":"B1","a":"Du gehst.","b":"Mach bitte das Licht aus.","s":"{Bevor} du gehst, mach bitte das Licht aus.","alts":["Mach bitte das Licht aus, bevor du gehst."],"tr":"Before you go, please turn off the light."},{"c":"ehe","lv":"C1","a":"Er konnte etwas sagen.","b":"Sie hatte schon aufgelegt.","s":"{Ehe} er etwas sagen konnte, hatte sie schon aufgelegt.","alts":["Bevor er etwas sagen konnte, hatte sie schon aufgelegt."],"tr":"Before he could say anything, she had already hung up."},{"c":"seitdem","lv":"B2","a":"Sie wohnt auf dem Land.","b":"Sie ist viel entspannter.","s":"{Seitdem} sie auf dem Land wohnt, ist sie viel entspannter.","alts":["Seit sie auf dem Land wohnt, ist sie viel entspannter.","Sie ist viel entspannter, seit sie auf dem Land wohnt."],"tr":"Since she's been living in the country, she's much more relaxed."},{"c":"sobald","lv":"B2", /* wrong connectors as extra blocks */
function decoys(it,T){const ks=T.filter(t=>t.k);if(!ks.length)return [];const cap=/^\p{Lu}/u.test(ks[0].t);const mine=CONN[it.c];
  const others=shuffle(C.conns.filter(c=>c.cat!==mine.cat&&c.id!==it.c));const out=[];

  others.sort((x,y)=>(x.f.trim().split(/\s+/).length>1)-(y.f.trim().split(/\s+/).length>1));
  for(const c of others){const w=c.f.split(/\s*(?:…|\.\.\.|\/)\s*/)[0].trim().replace(/,$/,'');if(!w||(!HAN&&/\s/.test(w))||out.includes(w)||T.some(t=>norm(t.t)===norm(w)))continue;

function gapOf(it){const T=it.T;const parts=T.map(t=>t.k);const n=new Set();let html='',inGap=false,gapTxt=[];const segs=[];let cur=[];
  T.forEach((t,i)=>{if(t.k){if(!inGap){inGap=true;cur=[]}cur.push(t.t)}else{if(inGap){segs.push(cur.join(' '));inGap=false}}});if(inGap)segs.push(cur.join(' '));
  let first=true;const outT=[];let inG=false;T.forEach(t=>{if(t.k){if(!inG){outT.push({t:'<span class="gp">___</span>',raw:1});inG=true}}else{inG=false;outT.push({t:esc(t.t)})}});
  html=HAN?outT.map(x=>x.t).join(''):outT.map(x=>x.t).join(' ').replace(/\s+([,.;:!?»)])/g,'$1');

  if(o.ok){B[j].classList.add('ok');return finish(c.tries===0?2:1)}c.tries++;B[j].classList.add('bad');B[j].disabled=true}
function lcsDiff(u,t){const n=u.length,m=t.length,d=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=u[i]===t[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ia=new Set(),ib=new Set();let i=0,j=0;while(i<n&&j<m){if(u[i]===t[j]){ia.add(i);ib.add(j);i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return {ia,ib,score:ia.size/Math.max(n,m,1)}}
const units=s=>HAN?[...norm(s)]:norm(s).split(' ').filter(Boolean);
function check(){const c=R.cur,it=c.it;if(c.done)return;
  if(S.opt.mode==='comb'){const v=$('ta').value.trim();if(!v)return;const nv=norm(v);const A=answers(it);
    if(A.some(a=>norm(a)===nv))return finish(c.tries===0?2:1);c.tries++;
    let best=null;A.forEach(a=>{const r=lcsDiff(units(v),units(a));if(!best||r.score>best.r.score)best={a,r}});
    const u=units(v),t=units(best.a);const sep=HAN?'':' ';
    const yours=u.map((w,k)=>best.r.ia.has(k)?`<span class="g">${esc(w)}</span>`:`<span class="x">${esc(w)}</span>`).join(sep);
    const miss=t.length-best.r.ib.size;
    $('fb').innerHTML=`<div class="fb bad"><span class="v">${esc(C.ui.notQuite)}</span><div class="han">${yours}</div><div class="small">${miss?esc(C.ui.missing.replace('{n}',miss))+' ':''}${esc(C.ui.tryAgain)}</div></div>`;return}
  if(S.opt.mode==='build'){if(!c.placed.length)return;const built=c.placed.map(j=>c.tiles[j].t);const txt=HAN?built.join(''):built.join(' ');
    const ok=answers(it).some(a=>norm(a)===norm(txt))&&c.placed.length===c.T.length;
    if(ok)return finish(c.tries===0?2:1);c.tries++;
    const T=c.T;$('ans').querySelectorAll('.tile').forEach((b,p)=>b.classList.add(T[p]&&norm(T[p].t)===norm(built[p])?'ok':'bad'));
    $('fb').innerHTML=`<div class="fb bad"><span class="v">${esc(C.ui.notQuite)}</span><span class="small">${esc(C.ui.buildBad)}</span></div>`}}
function finish(g){const c=R.cur,it=c.it;if(c.done)return;c.done=true;S.res[rk(it,S.opt.mode)]=g;save();R.log.push([it,g]);
  const cn=CONN[it.c];const A=answers(it);
  if(S.opt.mode==='build'){c.placed=c.T.map(t=>c.tiles.findIndex((x,j)=>x.t===t.t&&!0)).filter(j=>j>=0);
    const used=new Set();c.placed=c.T.map(t=>{const j=c.tiles.findIndex((x,jj)=>x.t===t.t&&!used.has(jj));used.add(j);return j});draw();$('ans').querySelectorAll('.tile').forEach(b=>b.classList.add(g?'ok':'given'))}
  if(S.opt.mode==='pick'){document.querySelectorAll('.opts.ch .opt').forEach((b,j)=>{if(c.g.opts[j].ok)b.classList.add('ok');b.disabled=true})}
  if(S.opt.mode==='comb')$('ta').readOnly=true;
  $('fb').innerHTML=`<div class="fb ${g?'ok':'bad'}"><span class="v">${g===2?'✓ '+esc(C.ui.firstTry):g===1?'✓ '+esc(C.ui.right):esc(C.ui.hereItIs)}</span>
    <div class="han">${esc(A[0])}</div>${(()=>{const seen=new Set([norm(A[0])]);const B=A.slice(1).filter(x=>{const k=norm(x);if(seen.has(k))return false;seen.add(k);return true});return B.length?`<div class="small">${esc(C.ui.alsoRight)}: ${B.map(esc).join(' · ')}</div>`:''})()}
    ${it.tr?`<div class="en">${esc(it.tr)}</div>`:''}<div class="small"><b>${esc(cn.f)}</b> — ${esc(cn.m)}${cn.nt?'. '+esc(cn.nt):''}</div></div>`;
  $('acts').innerHTML=`${it.clip?`<button class="btn" id="pl2" type="button">🔊</button>`:''}<span class="sp"></span><button class="btn pri" id="nx" type="button">${R.k+1<R.items.length?esc(C.ui.next)+' →':esc(C.ui.finish)}</button>`;
  if($('pl2'))$('pl2').onclick=()=>playClip(it,$('pl'));$('nx').onclick=next;setTimeout(()=>{try{$('nx').focus({preventScroll:true})}catch(e){}},30)}
function next(){R.k++;if(R.k<R.items.length)item();else summary()}
function summary(){const L=R.log,f=L.filter(x=>x[1]===2).length;const wrong=L.filter(x=>x[1]!==2).map(x=>x[0]);const ff=R.f;
  $('app').innerHTML=`<button class="back" type="button" id="bk">← ${esc(C.ui.back)}</button><div class="card"><div class="done"><div class="big">${f}/${L.length}</div><div>${esc(C.ui.firstTryCount)}</div>
   <div class="row" style="justify-content:center">${wrong.length?`<button class="btn pri" id="aw" type="button">${esc(C.ui.againWrong.replace('{n}',wrong.length))}</button>`:''}<button class="btn" id="more" type="button">${esc(C.ui.more)}</button></div>
   <div class="mini">${L.map(([it,g])=>`<div><span class="mk ${g===2?'g1':g===1?'gh':'g0'}">${g===2?'✓':g===1?'~':g===0?'✗':'–'}</span><span>${esc(plain(it.s))}</span></div>`).join('')}</div></div></div>`;
  $('bk').onclick=home;if(wrong.length)$('aw').onclick=()=>start({list:wrong});$('more').onclick=()=>start(ff)}
home();
</script>
