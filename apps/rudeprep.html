<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Предлоги ↔ Präpositionen</title><style>:root{--bg:#f2f4f0;--sheet:#fff;--ink:#1c2421;--muted:#5d6b65;--line:#d5ddd8;--accent:#2f7a5f;--accent-soft:#e2efe9;--on:#fff;--red:#b4442f;--red-soft:#f8e6e1;--green:#2f7a4a;--green-soft:#e3f2e7;--gold:#9a6a12;--gold-soft:#f6ecd6;--blue:#2c5d9b;--blue-soft:#e3ecf7;color-scheme:light}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.zh{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:12px 14px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}header.top h1{margin:0;font-size:1.25rem;flex:1;min-width:200px}header.top h1 small{color:var(--muted);font-weight:500;font-size:.85rem}
.stats{display:flex;gap:14px}.stat{text-align:center}.stat b{display:block;font-size:1.1rem;line-height:1.1}.stat span{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 .95rem system-ui,sans-serif;padding:10px 14px 9px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;min-height:44px;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}.tabs .n{background:var(--red);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 6px}
.muted{color:var(--muted)}button{font-family:inherit}
.pri{appearance:none;border:1.5px solid var(--accent);background:var(--accent);color:var(--on);border-radius:12px;min-height:44px;padding:8px 16px;font-weight:700;font-size:.95rem;cursor:pointer}.pri:disabled{opacity:.45;cursor:default}
.ghost{appearance:none;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:12px;min-height:40px;padding:6px 12px;font-weight:600;font-size:.9rem;cursor:pointer}
.ghost[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mode{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mode b{font-size:1rem}.mode small{color:var(--muted);line-height:1.3}.mode i{font-style:normal;font-size:.75rem;color:var(--accent);font-weight:700}.mode[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:14px 0 6px}
.qh{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;gap:10px}
.bar{height:5px;background:var(--line);border-radius:9px;margin:6px 0 10px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qp{font-size:1.35rem;font-weight:700;margin:6px 0 2px;line-height:1.3}.qsrc{color:var(--muted);margin:2px 0 8px;font-size:.95rem}
.slot{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}.slot:first-of-type{border-top:0;margin-top:4px;padding-top:2px}
.slh{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:.85rem;margin-bottom:2px}.slh .tag{margin-left:auto}
.flag{display:inline-block;width:22px;height:15px;border-radius:2px;vertical-align:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.f-ru{background:linear-gradient(#fff 0 33.3%,#0039A6 33.3% 66.6%,#D52B1E 66.6%)}.f-de{background:linear-gradient(#000 0 33.3%,#DD0000 33.3% 66.6%,#FFCE00 66.6%)}
.f-en{background:#012169;position:relative;overflow:hidden}.f-en::after{content:"";position:absolute;inset:0;background:linear-gradient(#C8102E,#C8102E) center/100% 26% no-repeat,linear-gradient(#C8102E,#C8102E) center/22% 100% no-repeat}
.f-zh{background:#EE1C25;position:relative}.f-zh::after{content:"★";position:absolute;left:2px;top:-2px;color:#FFDE00;font-size:9px}
.qsent{font-size:1.3rem;line-height:1.55;margin:6px 0}.gap{display:inline-block;min-width:2.6em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:800;padding:0 4px}
.gap.ok{border-color:var(--green);color:var(--green)}.gap.bad{border-color:var(--red);color:var(--red)}
.py{color:var(--muted);font-size:.95rem;margin:-2px 0 8px;letter-spacing:.01em}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.opts.wide{grid-template-columns:1fr}
.opt{appearance:none;position:relative;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;min-height:50px;padding:8px 10px 8px 30px;font-size:1.08rem;cursor:pointer;text-align:left;line-height:1.3}
.opt kbd{position:absolute;left:9px;top:8px;font:600 11px ui-monospace,monospace;color:var(--muted)}
.opt.right{border-color:var(--green);background:var(--green-soft)}.opt.alt{border-color:var(--gold);background:var(--gold-soft)}.opt.wrong{border-color:var(--red);background:var(--red-soft)}.opt:disabled{cursor:default}.opt.dim{opacity:.55}
.tag{display:inline-block;font:700 .75rem ui-monospace,monospace;background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:2px 7px}
.fb{margin-top:12px;font-size:1.02rem}.fb:empty{display:none}.fb.ok,.fb.bad{padding:10px 12px;border-radius:12px}.fb.ok{background:var(--green-soft)}.fb.bad{background:var(--red-soft)}
.fb .full{font-size:1.15rem;font-weight:600;margin:4px 0}.fb .py{margin:0 0 4px}
.note{background:var(--gold-soft);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.95rem}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:8px;border-radius:12px}
.tiles.ans{border:2px dashed var(--line);background:var(--sheet)}.tiles.ans.ok{border-color:var(--green);background:var(--green-soft)}.tiles.ans.bad{border-color:var(--red);background:var(--red-soft)}
.tile{appearance:none;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:1.25rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-height:46px;justify-content:center}
.tile small{font-size:.72rem;color:var(--muted)}.tile.used{visibility:hidden}
.done h3{margin:0 0 4px;font-size:1.5rem}.rev{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}.rev li{padding:8px 12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--green)}.rev li.x{border-left-color:var(--red)}.rev small{color:var(--muted)}
table.st{border-collapse:collapse;width:100%;font-size:.92rem}table.st th,table.st td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}table.st td.n{text-align:right;font-variant-numeric:tabular-nums}
.ref h3{margin:18px 0 6px;font-size:1.08rem}.ref h3:first-child{margin-top:0}.ref p{margin:6px 0}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}.ref table{border-collapse:collapse;font-size:.9rem;min-width:100%}.ref th,.ref td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.ref thead th{background:var(--accent-soft)}
.ref .ok{color:var(--green);font-weight:700}.ref .no{color:var(--red);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ml li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
@media (max-width:560px){.qp{font-size:1.18rem}.qsent{font-size:1.15rem}.opts{grid-template-columns:1fr 1fr}.opts.wide{grid-template-columns:1fr}}
.tin{width:100%;font:500 1.12rem system-ui,sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:6px;min-height:46px}
.tin:focus{outline:none;border-color:var(--accent)}.tin.ok{border-color:var(--green);background:var(--green-soft)}.tin.alt{border-color:var(--gold);background:var(--gold-soft)}.tin.bad{border-color:var(--red);background:var(--red-soft)}
.inf{color:var(--blue);font-style:italic;font-weight:600}.yours{text-decoration:line-through;color:var(--red)}

dich denken", "o": [["I often think of you.", 2], ["I often think about you.", 2], ["I often think on you.", 0]], "full": "I often think of you.", "note": "think of / about — both fine here."}, {"id": "trap:39ba726b", "sec": "trap", "k": "mc", "lang": "en", "en": "You’re sitting there right now", "src": "<span class=\"flag f-de\"><\/span> auf der Toilette", "o": [["I’m on the toilet.", 2], ["I’m at the toilet.", 0], ["I’m by the toilet.", 0]], "full": "I’m on the toilet.", "note": "“I’m on the toilet” is correct English (= sitting on it). For the room: I’m in the bathroom / restroom."}], "ref": "\n<h3>1 · Three kinds of “from”<\/h3>\n<div class=\"sc\"><table><thead><tr><th>Relation<\/th><th>Russian (all + Gen)<\/th><th>German (all + Dat)<\/th><th>Pair with<\/th><\/tr><\/thead><tbody>\n<tr><td>out of an inside, origin, material<\/td><td><b>из<\/b> машины, из России, из дерева<\/td><td><b>aus<\/b> dem Auto, aus Russland, aus Holz<\/td><td>в ↔ in<\/td><\/tr>\n<tr><td>off a surface, from an event / НА-place<\/td><td><b>с<\/b> машины, с работы, с концерта<\/td><td><b>von<\/b> dem (vom) Auto, von der Arbeit, vom Konzert<\/td><td>на ↔ auf / zu / bei …<\/td><\/tr>\n<tr><td>away from a person or point; source<\/td><td><b>от<\/b> машины, от друга, письмо от мамы<\/td><td><b>von … (weg)<\/b>: vom Auto weg, von einem Freund<\/td><td>к / у ↔ zu / bei<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The pairs в–из, на–с, к/у–от are strong defaults, not laws: на работе / с работы and в школе / из школы are conventional. от also means cause (дрожать от холода ↔ vor Kälte), protection (от солнца ↔ vor der Sonne), remedy (от головной боли ↔ gegen Kopfschmerzen) and “belonging to” (ключ от двери ↔ Schlüssel für die Tür).<\/p>\n<h3>2 · Where? Where to? Where from? — one noun at a time<\/h3>\n<div class=\"sc\"><table><thead><tr><th><\/th><th>Где? / Wo? (static)<\/th><th>Куда? / Wohin? (direction)<\/th><th>Откуда? / Woher?<\/th><\/tr><\/thead><tbody>\n<tr><td>school<\/td><td>в школе · in der Schule<\/td><td>в школу · in die / zur Schule<\/td><td>из школы · aus der Schule<\/td><\/tr>\n<tr><td>work<\/td><td>на работе · bei der Arbeit<\/td><td>на работу · zur Arbeit<\/td><td>с работы · von der Arbeit<\/td><\/tr>\n<tr><td>station<\/td><td>на вокзале · am Bahnhof<\/td><td>на вокзал · zum Bahnhof<\/td><td>с вокзала · vom Bahnhof<\/td><\/tr>\n<tr><td>concert<\/td><td>на концерте · auf dem Konzert<\/td><td>на концерт · auf ein / ins Konzert<\/td><td>с концерта · vom Konzert<\/td><\/tr>\n<tr><td>friend<\/td><td>у друга · bei einem Freund<\/td><td>к другу · zu einem Freund<\/td><td>от друга · von einem Freund<\/td><\/tr>\n<tr><td>Berlin<\/td><td>в Берлине · in Berlin<\/td><td>в Берлин · nach Berlin<\/td><td>из Берлина · aus Berlin<\/td><\/tr>\n<tr><td>Switzerland<\/td><td>в Швейцарии · in der Schweiz<\/td><td>в Швейцарию · in die Schweiz<\/td><td>из Швейцарии · aus der Schweiz<\/td><\/tr>\n<tr><td>Cuba<\/td><td>на Кубе · in Kuba<\/td><td>на Кубу · nach Kuba<\/td><td>с Кубы · aus Kuba<\/td><\/tr>\n<tr><td>island<\/td><td>на острове · auf der Insel<\/td><td>на остров · auf die Insel<\/td><td>с острова · von der Insel<\/td><\/tr>\n<tr><td>sea<\/td><td>на море · am Meer<\/td><td>на море · ans Meer<\/td><td>с моря · vom Meer<\/td><\/tr>\n<tr><td>home<\/td><td>дома · zu Hause<\/td><td>домой · nach Hause<\/td><td>из дома · von zu Hause<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3 · Case government<\/h3>\n<div class=\"sc\"><table><thead><tr><th>German<\/th><th>Case<\/th><th>Russian<\/th><th>Case<\/th><\/tr><\/thead><tbody>\n<tr><td>aus, von, zu, bei, mit, seit<\/td><td>always Dat<\/td><td>из, с (from), от, у, до, для, около, из-за<\/td><td>Gen<\/td><\/tr>\n<tr><td>in, auf, an (+ über, unter, vor, hinter, neben, zwischen)<\/td><td>Wohin? → Akk · Wo? → Dat<\/td><td>в, на<\/td><td>Куда? → Akk · Где? → Präp<\/td><\/tr>\n<tr><td>durch, für, gegen, ohne, um<\/td><td>always Akk<\/td><td>к<\/td><td>Dat<\/td><\/tr>\n<tr><td>nach (cities, countries without article)<\/td><td>no article<\/td><td>с (with), за (location), над, под<\/td><td>Instr<\/td><\/tr>\n<tr><td>wegen<\/td><td>Gen (speech: Dat)<\/td><td>о / об, при<\/td><td>Präp<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Russian can express a tool or an agent with the instrumental case alone: писать <b>ручкой<\/b>, написано <b>им<\/b>. German needs a preposition: mit einem Stift, von ihm.<\/p>\n<h3>4 · НА is not AUF<\/h3>\n<p>на работу → zur Arbeit · на работе → bei der Arbeit · на вокзал → zum Bahnhof · на вокзале → am Bahnhof · на концерт → auf ein Konzert · на остановке → an der Haltestelle · на кухне → in der Küche · на стене → an der Wand. Learn the location/destination pairs as whole expressions.<\/p>\n<h3>5 · English “for”<\/h3>\n<div class=\"sc\"><table><thead><tr><th>Meaning<\/th><th>Russian<\/th><th>German<\/th><\/tr><\/thead><tbody>\n<tr><td>recipient: for you<\/td><td>для тебя / тебе<\/td><td>für dich<\/td><\/tr>\n<tr><td>duration: slept for two hours<\/td><td>спал два часа<\/td><td>zwei Stunden geschlafen<\/td><\/tr>\n<tr><td>still going: lived here for two years<\/td><td>живу здесь уже два года<\/td><td>wohne seit zwei Jahren hier<\/td><\/tr>\n<tr><td>price: for ten euros<\/td><td>за десять евро<\/td><td>für zehn Euro<\/td><\/tr>\n<tr><td>thanks for<\/td><td>спасибо за<\/td><td>danke für<\/td><\/tr>\n<tr><td>remedy: for a headache<\/td><td>от головной боли<\/td><td>gegen Kopfschmerzen<\/td><\/tr>\n<tr><td>known for<\/td><td>известен + Instr<\/td><td>bekannt für<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>6 · with · by · about<\/h3>\n<p><b>with<\/b>: с другом ↔ mit einem Freund (company) · ручкой ↔ mit einem Stift (tool) · кофе с молоком ↔ Kaffee mit Milch (ingredient).<br>\n<b>by<\/b>: на поезде / поездом ↔ mit dem Zug · им ↔ von ihm (agent) · к пятнице ↔ bis Freitag (deadline) · через парк ↔ durch den Park.<br>\n<b>about<\/b>: о работе ↔ über die Arbeit · рассказать о ↔ erzählen von · думать о ком-то ↔ an jemanden denken · около десяти минут ↔ ungefähr / etwa zehn Minuten (über zehn Minuten = more than ten!).<\/p>\n<h3>7 · English for Russian and German speakers<\/h3>\n<p>These are possible transfer errors, not mistakes every speaker makes: *on work → at work · *in Monday → on Monday · *since three years → for three years · *on the photo → in the photo · *by my parents → at my parents’ · *discuss about → discuss · *enter in → enter · *call to me → call me · *go to home → go home. And “I’m on the toilet” is fine English.<\/p>\n<p class=\"muted\">Sources: the supplied corrected reference (Wade, A Comprehensive Russian Grammar; Duden Grammatik; Cambridge & Oxford learner grammars). Regional usage and register can change the most natural choice.<\/p>\n", "dualLangs": ["ru", "de"], "shared": "drillpack:prep-rude:v1", "langName": {"ru": "Русский", "de": "Deutsch", "en": "English"}, "intro": "Each card gives the meaning in English and asks for the Russian <b>and<\/b> the German phrase — preposition and case together. Progress is shared between the Русский and Deutsch tabs. A <b style=\"color:var(--gold)\">gold<\/b> answer is accepted but less usual."};

  if(O.ans!=='tap')h+='<p class="muted" style="margin:6px 0 0;font-size:.88rem">'+(O.ans==='conj'?'The verb is given in <span class="inf">(infinitive)</span>. Type the whole gap: conjugated verb + preposition + noun in the right case.':'Type the whole gap: preposition + noun in the right case.')+' Capital letters, ё/е and ß/ss don’t count.</p>';
  if(CFG.pinyin)h+='<div class="lbl">Pinyin</div><div class="sw"><button class="ghost" id="pyt" aria-pressed="'+O.py+'">'+(O.py?'Pinyin shown':'Pinyin hidden')+'</button></div>';
  var d=dueCount();h+='<div class="row" style="margin-top:18px"><button class="pri" id="go">Start round ▶</button>'+(d?'<button class="ghost" id="godue">Review '+d+' due</button>':'')+'</div></div>';
  if(CFG.intro)h+='<div class="panel note" style="margin-top:12px">'+CFG.intro+'</div>';
  VP.innerHTML=h;
  VP.querySelectorAll('[data-sec]').forEach(function(b){b.onclick=function(){var i=O.secs.indexOf(b.dataset.sec);if(i>=0)O.secs.splice(i,1);else O.secs.push(b.dataset.sec);save();home()}});
  VP.querySelector('#all').onclick=function(){O.secs=SECS.map(function(s){return s.id});save();home()};
  VP.querySelector('#none').onclick=function(){O.secs=[];save();home()};
  VP.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){O.n=+b.dataset.n;save();home()}});
  VP.querySelectorAll('[data-am]').forEach(function(b){b.onclick=function(){O.ans=b.dataset.am;save();home()}});
  VP.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){O.langs=b.dataset.l;save();home()}});
  var p=VP.querySelector('#pyt');if(p)p.onclick=function(){O.py=!O.py;save();home()};
  VP.querySelector('#go').onclick=function(){start(pick(O.secs,O.n))};
  var g=VP.querySelector('#godue');if(g)g.onclick=function(){start(shuf(IT.filter(function(x){return isDue(x.id)})).slice(0,30))};
  VP.querySelector('#go').disabled=!O.secs.length}
function pick(secs,n){var pool=IT.filter(function(x){return secs.indexOf(x.sec)>=0});
  var due=shuf(pool.filter(function(x){return isDue(x.id)})),neu=shuf(pool.filter(function(x){return !(S.it[x.id]&&S.it[x.id].n)})),rest=shuf(pool.filter(function(x){return S.it[x.id]&&S.it[x.id].n&&!isDue(x.id)})).sort(function(a,b){return S.it[a.id].d-S.it[b.id].d});
  var out=due.slice(0,Math.ceil(n*.6));out=out.concat(neu.slice(0,n-out.length));if(out.length<n)out=out.concat(due.slice(out.length,n));if(out.length<n)out=out.concat(rest.slice(0,n-out.length));return shuf(out.slice(0,n))}
function start(list){if(!list.length)return;RUN={q:list,i:0,res:[]};tab('pr');q()}
/* ---------- practise: question ---------- */
var CUR=null;
function gapHTML(s,fill,cls,l){var p=s.split('＿');return esc(p[0])+'<span class="gap '+(cls||'')+'">'+(fill==null?'?':esc(fill)||'∅')+'</span>'+esc(p.slice(1).join('＿'))}
function q(){if(RUN.i>=RUN.q.length)return done();
  var x=RUN.q[RUN.i];CUR={x:x,ans:{},okAll:true,fin:false,typ:O.ans!=='tap'&&x.k!=='build',conj:O.ans==='conj',got:{}};var sec=SEC[x.sec];
  var h='<div class="panel"><div class="qh"><span>'+esc(sec.t)+'</span><span>'+(RUN.i+1)+' / '+RUN.q.length+'</span></div><div class="bar"><i style="width:'+(RUN.i/RUN.q.length*100)+'%"></i></div>';
  h+='<div class="qp">'+esc(x.en)+'</div>';if(x.src)h+='<div class="qsrc">'+x.src+'</div>';
  if(x.k==='build'){h+=buildHTML(x)}
  else{var sl=x.k==='dual'?slotsOf(x):[x];CUR.slots=sl;sl.forEach(function(s,i){h+=slotHTML(s,i,x.k==='dual')})}
  if(CUR.typ)h+='<div class="row" id="trow"><button class="pri" id="tchk">Check</button><button class="ghost" id="tshw">Show answer</button></div>';
  h+='<div class="fb" id="fb"></div><div class="row"><button class="ghost" id="quit">✕ End round</button></div></div>';
  VP.innerHTML=h;VP.querySelector('#quit').onclick=function(){done()};
  if(CUR.typ)return typeWire();
  if(x.k==='build')buildWire(x);else VP.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(+b.dataset.s,+b.dataset.o)}})}
function slotHTML(s,i,dual){if(CUR&&CUR.typ)return typeSlotHTML(s,i,dual);var h='<div class="slot" data-slot="'+i+'">';
  if(dual)h+='<div class="slh">'+flag(s.lang)+' '+esc(CFG.langName[s.lang])+'</div>';
  var cls=isZh(s.lang)?' zh':'';
  if(s.s)h+='<div class="qsent'+cls+'" id="sent'+i+'">'+gapHTML(s.s,null,'',s.lang)+'</div>';
  if(s.q)h+='<div class="qsent'+cls+'">'+esc(s.q)+'</div>';
  if(CFG.pinyin&&O.py&&s.py)h+='<div class="py">'+esc(s.py)+'</div>';
  var ord=shuf(s.o.map(function(o,j){return j}));s._ord=ord;var wide=s.o.some(function(o){return o[0].length>26});
  h+='<div class="opts'+(wide?' wide':'')+'">'+ord.map(function(j,n){var o=s.o[j];return '<button class="opt'+cls+'" data-s="'+i+'" data-o="'+j+'"><kbd>'+(n+1)+'</kbd>'+(o[0]==='∅'?'— (nothing)':esc(o[0]))+'</button>'}).join('')+'</div>';
  return h+'</div>'}
function answer(si,oi){if(CUR.fin||CUR.ans[si]!=null)return;var s=CUR.slots[si],o=s.o[oi];CUR.ans[si]=oi;
  var good=o[1]>0;if(!good)CUR.okAll=false;
  VP.querySelectorAll('.opt[data-s="'+si+'"]').forEach(function(b){var j=+b.dataset.o,f=s.o[j][1];b.disabled=true;
    if(j===oi)b.classList.add(f===2?'right':f===1?'alt':'wrong');else if(f===2)b.classList.add('right');else if(f===1)b.classList.add('alt');else b.classList.add('dim')});
  if(s.s){var best=s.o.filter(function(z){return z[1]===2})[0][0],e=VP.querySelector('#sent'+si);if(e)e.innerHTML=gapHTML(s.s,good?o[0]==='∅'?'':o[0]:best==='∅'?'':best,good?'ok':'bad')}
  if(Object.keys(CUR.ans).length===CUR.slots.length)finish()}
function finish(){CUR.fin=true;var x=CUR.x,ok=CUR.okAll;grade(x.id,ok);RUN.res.push([x,ok]);
  var h='<b>'+(ok?'✓ Right':'✗ Not quite')+'</b>';
  CUR.slots.forEach(function(s,i){var pickd=CUR.typ?(CUR.got[i]&&CUR.got[i].hit):s.o[CUR.ans[i]];
    if(CUR.typ&&CUR.got[i]&&!CUR.got[i].hit&&CUR.got[i].v!=null&&CUR.got[i].v.trim())h+='<div class="muted">'+(x.k==='dual'?flag(s.lang)+' ':'')+'You typed: <span class="yours">'+esc(CUR.got[i].v.trim())+'</span></div>';
    if(pickd&&pickd[1]===1&&s.altn)h+='<div class="note">'+s.altn+'</div>';
    if(s.full||s.fix||s.c){h+='<div class="full'+(isZh(s.lang)?' zh':'')+'">'+(x.k==='dual'?flag(s.lang)+' ':'')+esc(CUR.typ?tFull(s):(s.fix||s.full||''))+(s.c?' <span class="tag">'+esc(s.c)+'</span>':'')+'</div>';
      if(CFG.pinyin&&O.py&&(s.pyf))h+='<div class="py">'+esc(s.pyf)+'</div>'}
    if(CUR.typ){var g=CUR.got[i],oth=tAns(s).filter(function(a){return !(g&&g.hit&&tNorm(a[0])===tNorm(g.hit[0]))&&!(g&&!g.hit&&g.best&&a[0]===g.best[0])}).map(function(a){return a[0]||'—'});if(oth.length)h+='<div class="muted" style="font-size:.88rem">Also accepted: '+oth.map(esc).join(' · ')+'</div>'}
    if(s.n)h+='<div class="note">'+s.n+'</div>'});
  if(x.note)h+='<div class="note">'+x.note+'</div>';
  h+='<div class="row"><button class="pri" id="nx">Next ▶</button></div>';
  var fb=VP.querySelector('#fb');fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=h;
  VP.querySelector('#nx').onclick=next;try{VP.querySelector('#nx').focus({preventScroll:true})}catch(e){}
  fb.scrollIntoView({block:'nearest',behavior:'smooth'})}
function next(){RUN.i++;q();scrollTo(0,0)}

/* ---------- typing mode ---------- */
function tNorm(t){return String(t).toLowerCase().replace(/ё/g,'е').replace(/ß/g,'ss').replace(/[’‘`´ʼ]/g,"'").replace(/[“”„«»]/g,'"').replace(/[.,!?;:"…]/g,' ').replace(/\s+/g,' ').trim()}
function tSent(s){return CUR.conj&&s.h?s.h.s:s.s}
function tAns(s){if(CUR.conj&&s.h)return s.h.ans;return s.o.filter(function(o){return o[1]>0}).map(function(o){return [o[0]==='∅'?'':o[0],o[1]]})}
function gapInf(s,fill,cls){return gapHTML(s,fill,cls).replace(/\(([^()]*)\)/g,'<span class="inf">($1)</span>')}
function typeSlotHTML(s,i,dual){var h='<div class="slot" data-slot="'+i+'">';
  if(dual)h+='<div class="slh">'+flag(s.lang)+' '+esc(CFG.langName[s.lang])+'</div>';
  var sent=tSent(s);
  if(sent)h+='<div class="qsent" id="sent'+i+'">'+gapInf(sent,null,'')+'</div>';
  if(s.q)h+='<div class="qsent">'+esc(s.q)+'</div>';
  h+='<input class="tin" data-s="'+i+'" lang="'+esc(s.lang)+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="'+(sent?'type the missing part':'type the answer')+'">';
  return h+'</div>'}
function typeWire(){var ins=VP.querySelectorAll('.tin');
  ins.forEach(function(inp,n){inp.addEventListener('keydown',function(e){if(e.key!=='Enter')return;e.preventDefault();
    if(CUR.fin){var nx=VP.querySelector('#nx');if(nx)nx.click();return}
    for(var k=n+1;k<ins.length;k++){if(!ins[k].value.trim()){ins[k].focus();return}}
    tCheck(false)})});
  VP.querySelector('#tchk').onclick=function(){tCheck(false)};VP.querySelector('#tshw').onclick=function(){tCheck(true)};
  try{ins[0].focus({preventScroll:true})}catch(e){}}
function tCheck(gave){if(CUR.fin)return;var ins=VP.querySelectorAll('.tin');
  if(!gave){var empty=[].filter.call(ins,function(inp){return !inp.value.trim()});if(empty.length&&empty.length<ins.length){empty[0].focus();return}}
  CUR.slots.forEach(function(s,i){var inp=ins[i],v=gave?null:inp.value,A=tAns(s),hit=null;
    if(v!=null)A.forEach(function(a){if(!hit&&tNorm(a[0])===tNorm(v))hit=a});
    var good=!!hit;if(!good)CUR.okAll=false;CUR.got[i]={v:v,hit:hit,best:A.filter(function(a){return a[1]===2})[0]||A[0]};
    inp.disabled=true;inp.classList.add(good?(hit[1]===1?'alt':'ok'):'bad');
    var e=VP.querySelector('#sent'+i),sent=tSent(s);if(e&&sent)e.innerHTML=gapInf(sent,good?hit[0]:CUR.got[i].best[0],good?'ok':'bad')});
  var r=VP.querySelector('#trow');if(r)r.style.display='none';finish()}
function tFull(s){var g=CUR.got[CUR.slots.indexOf(s)],sent=tSent(s),w=g&&(g.hit||g.best);if(!sent||!w)return s.fix||s.full||'';
  return sent.replace(/\s*\([^()]*\)/g,'').replace('＿',w[0])}
/* ---------- tile builder ---------- */
function tileHTML(x,j,cls){return '<button class="tile'+(cls||'')+' zh" data-j="'+j+'">'+esc(x.t[j])+(CFG.pinyin&&O.py&&x.tp?'<small>'+esc(x.tp[j])+'</small>':'')+'</button>'}
function buildHTML(x){var ord=shuf(x.t.map(function(t,j){return j}));CUR.ord=ord;CUR.seq=[];
  return '<div class="lbl">Your sentence</div><div class="tiles ans" id="ta"></div><div class="lbl">Tap the pieces in order</div><div class="tiles" id="tp">'+ord.map(function(j){return tileHTML(x,j)}).join('')+'</div><div class="row"><button class="pri" id="chk" disabled>Check</button><button class="ghost" id="clr">Clear</button><button class="ghost" id="shw">Show answer</button></div>'}
function norm(t){return t.replace(/[\s，。？！、,.?!]/g,'')}
function buildWire(x){var ta=VP.querySelector('#ta'),tp=VP.querySelector('#tp');
  function draw(){ta.innerHTML=CUR.seq.map(function(j){return tileHTML(x,j)}).join('');tp.querySelectorAll('.tile').forEach(function(b){b.classList.toggle('used',CUR.seq.indexOf(+b.dataset.j)>=0)});VP.querySelector('#chk').disabled=CUR.seq.length!==x.t.length}
  tp.onclick=function(e){if(CUR.fin)return;var b=e.target.closest('.tile');if(!b||b.classList.contains('used'))return;CUR.seq.push(+b.dataset.j);draw()};
  ta.onclick=function(e){if(CUR.fin)return;var b=e.target.closest('.tile');if(!b)return;CUR.seq.splice(CUR.seq.indexOf(+b.dataset.j),1);draw()};
  VP.querySelector('#clr').onclick=function(){if(CUR.fin)return;CUR.seq=[];draw()};
  VP.querySelector('#chk').onclick=function(){bCheck(x,false)};VP.querySelector('#shw').onclick=function(){bCheck(x,true)}}
function bCheck(x,gave){if(CUR.fin)return;var mine=CUR.seq.map(function(j){return x.t[j]}).join('');
  var hit=!gave&&x.ans.some(function(a){return norm(a)===norm(mine)});CUR.okAll=hit;CUR.fin=true;
  VP.querySelector('#ta').classList.add(hit?'ok':'bad');VP.querySelectorAll('#chk,#clr,#shw').forEach(function(b){b.disabled=true});
  grade(x.id,hit);RUN.res.push([x,hit]);
  var h='<b>'+(hit?'✓ Right':'✗ Not quite')+'</b>';
  var others=x.ans.filter(function(a){return norm(a)!==norm(mine)});
  h+='<div class="full zh">'+esc(hit?x.ans.filter(function(a){return norm(a)===norm(mine)})[0]:x.ans[0])+'</div>';
  if(CFG.pinyin&&O.py&&x.pyf)h+='<div class="py">'+esc(hit?(x.pya[x.ans.map(norm).indexOf(norm(mine))]||x.pyf):x.pyf)+'</div>';
  if(others.length&&(hit?others.length:others.length>1))h+='<div class="muted">Also correct: <span class="zh">'+(hit?others:others.slice(1)).map(esc).join(' · ')+'</span></div>';
  if(x.note)h+='<div class="note">'+x.note+'</div>';
  h+='<div class="row"><button class="pri" id="nx">Next ▶</button></div>';
  var fb=VP.querySelector('#fb');fb.className='fb '+(hit?'ok':'bad');fb.innerHTML=h;VP.querySelector('#nx').onclick=next;try{VP.querySelector('#nx').focus({preventScroll:true})}catch(e){}}
/* ---------- end of round ---------- */
function label(x){if(x.k==='dual'){var sl=[x.a,x.b];return sl.map(function(s){return flag(s.lang)+' '+esc(s.full)}).join('<br>')}
  if(x.k==='build')return '<span class="zh">'+esc(x.ans[0])+'</span>';return '<span class="'+(isZh(x.lang)?'zh':'')+'">'+esc(x.fix||x.full||x.q||'')+'</span>'}
function done(){var r=RUN?RUN.res:[];RUN=null;var ok=r.filter(function(z){return z[1]}).length;
  var h='<div class="panel done"><h3>'+(r.length?ok+' / '+r.length+' right':'Round ended')+'</h3><p class="muted">'+(r.length&&ok===r.length?'Clean round. Items you got right come back later and later.':'Missed items are in ✗ Mistakes and come back tomorrow.')+'</p>';
  h+='<ul class="rev">'+r.map(function(z){return '<li class="'+(z[1]?'':'x')+'"><small>'+esc(z[0].en)+'</small><br>'+label(z[0])+'</li>'}).join('')+'</ul>';
  h+='<div class="row"><button class="pri" id="again">Another round ▶</button><button class="ghost" id="back">Sections</button></div></div>';
  VP.innerHTML=h;VP.querySelector('#again').onclick=function(){start(pick(O.secs,O.n))};VP.querySelector('#back').onclick=home;scrollTo(0,0)}
/* ---------- mistakes ---------- */
function mist(){var V=document.getElementById('v-mi'),m=missList();
  if(!m.length){V.innerHTML='<div class="panel"><p>No open mistakes. Anything you miss shows up here until you get it right.</p></div>';return}
  V.innerHTML='<div class="panel"><div class="row" style="margin-top:0"><button class="pri" id="pm">Practise these '+m.length+' ▶</button></div><ul class="rev ml">'+m.map(function(x){return '<li class="x"><div><small>'+esc(SEC[x.sec].t)+' · '+esc(x.en)+'</small><br>'+label(x)+'</div></li>'}).join('')+'</ul></div>';
  V.querySelector('#pm').onclick=function(){start(shuf(m).slice(0,30))}}
/* ---------- rules ---------- */
function ref(){var V=document.getElementById('v-rf');if(!V.dataset.on){V.innerHTML='<div class="panel ref">'+CFG.ref+'</div>';V.dataset.on=1}}
/* ---------- stats ---------- */
function stats(){var V=document.getElementById('v-st');
  var h='<div class="panel"><table class="st"><thead><tr><th>Section</th><th class="n">practised</th><th class="n">accuracy</th><th class="n">due</th><th class="n">open ✗</th></tr></thead><tbody>'+SECS.map(function(s){var all=IT.filter(function(x){return x.sec===s.id}),seen=all.filter(function(x){return S.it[x.id]&&S.it[x.id].n}),n=0,w=0;
    seen.forEach(function(x){n+=S.it[x.id].n;w+=S.it[x.id].w});return '<tr><td>'+esc(s.t)+'</td><td class="n">'+seen.length+'/'+all.length+'</td><td class="n">'+(n?Math.round((n-w)/n*100)+'%':'–')+'</td><td class="n">'+all.filter(function(x){return isDue(x.id)}).length+'</td><td class="n">'+all.filter(function(x){return S.it[x.id]&&S.it[x.id].m}).length+'</td></tr>'}).join('')+'</tbody></table>';
  var days=Object.keys(S.log).sort().slice(-14);if(days.length){h+='<div class="lbl">Last days</div><table class="st"><tbody>'+days.reverse().map(function(d){var v=S.log[d];d=String(d);return '<tr><td>'+d.slice(6)+'.'+d.slice(4,6)+'.</td><td class="n">'+(v[0]+v[1])+' answers</td><td class="n">'+Math.round(v[0]/(v[0]+v[1])*100)+'% right</td></tr>'}).join('')+'</tbody></table>'}
  h+='<div class="row"><button class="ghost" id="rs">Reset progress…</button></div></div>';V.innerHTML=h;
  V.querySelector('#rs').onclick=function(){var b=V.querySelector('#rs');if(b.dataset.c){S.it={};S.log={};save();head();stats()}else{b.dataset.c=1;b.textContent='Tap again to erase all progress'}}}
/* ---------- keys ---------- */
document.addEventListener('keydown',function(e){if(TAB!=='pr'||!CUR)return;if(e.target.tagName==='INPUT')return;
  if(e.key==='Enter'){var nx=VP.querySelector('#nx');if(nx){e.preventDefault();nx.click();return}var c=VP.querySelector('#chk');if(c&&!c.disabled){e.preventDefault();c.click()}return}
  var d=+e.key;if(!d||CUR.fin||!CUR.slots)return;var si=0;while(si<CUR.slots.length&&CUR.ans[si]!=null)si++;if(si>=CUR.slots.length)return;
  var b=VP.querySelectorAll('.opt[data-s="'+si+'"]')[d-1];if(b){e.preventDefault();b.click()}});
/* ---------- boot ---------- */
function boot(){var fid=window.__dpFID||'';if(CFG.instB&&fid===CFG.instB)INST='b';
  var T=INST==='b'?CFG.titleB:CFG.title;document.getElementById('h1').innerHTML=T;document.title=(INST==='b'?CFG.docTitleB:CFG.docTitle)||document.title;
  head();tab('pr')}
addEventListener('storage',function(e){if(e.key&&e.key.indexOf(KEY)<0)return;var o=O;load();S.o=o;O=o;head()});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else setTimeout(boot,0);
})();
</script></body></html>
