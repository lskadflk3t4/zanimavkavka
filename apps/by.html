<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}/* ===== full declension table + Mistakes tab (added) ===== */
.ftbl{margin-top:16px;padding-top:12px;border-top:1.5px dashed var(--line)}
.ftbl h3{margin:0 0 4px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.ftbl h4{margin:12px 0 0;font-family:var(--f-display);font-size:1.05rem}
.ftbl h4 small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted)}
.ft-sub,.ft-note{margin:4px 0 6px;font-size:.88rem;color:var(--muted);max-width:68ch}
.ftab{font-size:.92rem}
.ftab th small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
.ftab td[lang="be"]{font-family:var(--f-display)}
.ftab td b{color:var(--accent)}
.ftab td.fe{font-size:.8rem;color:var(--muted)}
.ftab td.hl{background:var(--accent-soft)}
.ft-more{margin-top:12px}
.ft-more summary{cursor:pointer;font-weight:600;font-size:.88rem;color:var(--accent)}
.tab .cnt{position:absolute;top:4px;right:2px;min-width:18px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:.7rem;font-weight:700;line-height:18px;text-align:center}
.xh{margin:0 0 4px;font-family:var(--f-display);font-size:1.5rem;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.xh span{font-family:var(--f-body);font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.xsub,.howto{margin:4px 0;color:var(--muted);font-size:.9rem;max-width:68ch}
.mk-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
.mk-f{margin:0 0 6px}
.mk-empty{margin-top:16px;padding:16px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted)}
.mk-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.mk-list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mk-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mk-w{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.mk-m,.mk-t{font-size:.8rem;color:var(--muted)}
.mk-m b{color:var(--red)}
.mk-a{font-size:.95rem}
.mk-a s{color:var(--red)}
.mk-a b{color:var(--green)}
.mk-r{display:flex;gap:6px;align-items:center;flex:none}
.mk-x{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;width:32px;height:32px;cursor:pointer;font:inherit}
.mk-x:hover{color:var(--red);border-color:var(--red)}
.tab[data-mode="miss"]{position:relative;padding-right:26px}
</style></head><body>
<title>DRILL Belarusian Grammar Drill</title>
<style>
/* Layout: school exercise-book (тетрадь в клетку). Settings rail left, grid-paper drill sheet right with a red margin line; stacks on phones. */
:root{
  --bg:#EEF1F6; --sheet:#FFFFFF; --grid:rgba(43,79,203,.09); --ink:#1B2340; --muted:#5D6683;
  --line:#D5DBE8; --accent:#2B4FCB; --accent-soft:#E3E9FB; --on-accent:#FFFFFF;
  --red:#C7341F; --red-soft:#FBE7E3; --green:#1E7A4C; --green-soft:#E1F3E9; --margin:#E58A7C;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F121B; --sheet:#171B28; --grid:rgba(143,168,255,.07); --ink:#E5E9F4; --muted:#9AA2BC;
  --line:#2C3346; --accent:#8FA8FF; --accent-soft:#232C4A; --on-accent:#0F121B;
  --red:#FF8069; --red-soft:#3A2020; --green:#5FCB92; --green-soft:#183326; --margin:#8A4A42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F121B; --sheet:#171B28; --grid:rgba(143,168,255,.07); --ink:#E5E9F4; --muted:#9AA2BC;
  --line:#2C3346; --accent:#8FA8FF; --accent-soft:#232C4A; --on-accent:#0F121B;
  --red:#FF8069; --red-soft:#3A2020; --green:#5FCB92; --green-soft:#183326; --margin:#8A4A42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,3.6vw,2.2rem);margin:0;line-height:1.1;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.score{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;align-items:flex-end}
.score b{font-size:1.25rem;font-weight:700}
.score span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:10px 14px 9px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.tab small{font-weight:500;font-size:.72rem;opacity:.85}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
/* settings */
.settings{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:4px 16px 16px}
.settings summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none;display:flex;justify-content:space-between}
.settings summary::-webkit-details-marker{display:none}
.settings summary::after{content:"▾";color:var(--muted)}
.settings[open] summary::after{content:"▴"}
.grp{display:flex;flex-direction:column;gap:7px;padding-block:10px;border-top:1px solid var(--line)}
.grp h3{margin:0;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;font:inherit;font-size:.82rem;border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.quick{display:flex;gap:10px;font-size:.75rem}
.quick button{appearance:none;border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
/* sheet */
.sheet{position:relative;background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:10px;padding:22px 22px 22px 44px;min-width:0}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:28px;width:2px;background:var(--margin);opacity:.8}
@media (max-width:520px){.sheet{padding:18px 14px 18px 30px}.sheet::before{left:16px}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.tag.plain{background:transparent;color:var(--muted);padding-left:0;font-weight:500;letter-spacing:0;font-size:.85rem}
.word{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.1;margin:4px 0 14px;overflow-wrap:anywhere}
.target{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:14px}
.target b{font-size:1.2rem}
.target span{color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap}
input.ans{font-family:var(--f-display);font-size:1.35rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);flex:1 1 220px;min-width:0}
input.ans:focus{border-color:var(--accent);outline:none}
input.ans.ok{border-color:var(--green);background:var(--green-soft)}
input.ans.bad{border-color:var(--red);background:var(--red-soft)}
.btn{appearance:none;font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 11px;font-size:.82rem;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fb{margin-top:14px;min-height:2.4em;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.mark{font-family:var(--f-hand);font-size:1.9rem;font-weight:700;line-height:1}
.mark.ok{color:var(--green)}.mark.bad{color:var(--red)}
.fb .right{font-family:var(--f-display);font-size:1.2rem}
.fb .right s{color:var(--red);text-decoration-thickness:2px}
.cch{min-width:0}
.cch .chip{font-size:.85rem;padding:6px 11px}
.cch .chip.ok{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.cch .chip.bad{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.cch .chip.miss{border:2px dashed var(--green);color:var(--green);font-weight:700}
.cch .chip:disabled{cursor:default;opacity:1}
.rule{flex-basis:100%;margin:6px 0 0;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:.9rem}
.rule b{color:var(--accent)}
.trow{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:6px 12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.trow label{font-weight:600;font-size:.9rem;line-height:1.25}
.trow label small{display:block;font-weight:400;color:var(--muted);font-style:italic}
.trow .fix{grid-column:2;font-family:var(--f-display);color:var(--red);font-size:1rem;margin-top:-2px}
@media (max-width:520px){.trow{grid-template-columns:minmax(0,1fr)}.trow .fix{grid-column:1}}
.empty{color:var(--muted);padding:30px 0}
/* reference */
.ref{margin-top:18px}
.ref summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;font-size:.92rem;background:var(--sheet);min-width:100%}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.hl{background:var(--accent-soft);font-weight:700}
td{font-family:var(--f-display)}
/* keyboard */
.kb{margin-top:16px;display:flex;flex-direction:column;gap:5px;align-items:center}
.kb .kr{display:flex;gap:4px;flex-wrap:nowrap;justify-content:center;width:100%}
.kb button{appearance:none;font-family:var(--f-display);font-size:1rem;flex:1 1 0;min-width:0;max-width:42px;height:38px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:6px;cursor:pointer;padding:0}
.kb button.wide{max-width:96px;flex:2 1 0;font-family:var(--f-body);font-size:.78rem;font-weight:600}
.kb button:active{background:var(--accent-soft)}
/* log */
.log{margin-top:22px}
.log h2{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.log ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.log li{font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 10px}
.log li .w{font-family:var(--f-display);font-weight:700}
.log li .c{color:var(--green);font-family:var(--f-display)}
.log li .y{color:var(--red);text-decoration:line-through;font-family:var(--f-display)}
.note{font-size:.78rem;color:var(--muted);margin-top:12px}
@media (prefers-reduced-motion:no-preference){.mark{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}}
.ru-eq ul,.ru-tend ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.ru-eq li,.ru-tend li{font-size:.88rem;line-height:1.45}
.ru-eq .nb{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;padding:0 6px;border-radius:4px;background:var(--red-soft);color:var(--red)}
.ru-eq .same{font-size:.75rem;color:var(--green);font-weight:600}
.ru-tend ul{margin-top:10px}
.rux{grid-column:2;font-family:var(--f-display);font-size:.95rem;color:var(--muted)}
.rux-l{font-family:var(--f-body);font-size:.66rem;font-weight:700;letter-spacing:.08em;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);vertical-align:1px}
@media (max-width:520px){.rux{grid-column:1}}
.rux-box .rux-f{font-family:var(--f-display);font-weight:700}
.rux-box .rux-cmp{color:var(--muted);font-size:.85rem}
.endn{display:flex;flex-direction:column;gap:6px}
.endn .tbl-wrap{margin-top:2px}
.endn table.endt{font-size:.85rem;min-width:0}
.endn table.endt td{white-space:normal;font-family:var(--f-body)}
.endn .endsub{font-size:.8rem;color:var(--muted);margin-top:4px}
.decl-ref{margin-top:22px;border-top:1px dashed var(--line);padding-top:12px}
.dref-body{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:.88rem;max-width:72ch}
.dref-body p{margin:0}
.dref-body h4{margin:10px 0 0;font-family:var(--f-display);font-size:1rem}
.dref-body .tbl-wrap{max-width:none;margin-top:0}
table.dref{font-size:.85rem}
table.dref td{white-space:normal;min-width:90px;font-family:var(--f-body)}
table.dref tbody th{white-space:nowrap}
.dnote{font-size:.8rem;color:var(--muted)}
/* ---- mobile / Android usability (added) ---- */
button,.chip,.tab,.btn,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:820px){
  .wrap{padding-block:10px 32px}
  header{margin-bottom:10px;align-items:center}
  .brand h1{font-size:1.45rem}
  .brand p{display:none}
  .score{gap:12px;width:100%;justify-content:space-between;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
  .score div{align-items:center}
  .score b{font-size:1.05rem}
  .score span{font-size:.62rem}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -16px 12px;padding:0 16px;scroll-snap-type:x proximity}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:12px 14px 10px;min-height:48px;scroll-snap-align:start}
  .main{gap:12px}
  .settings{padding:0 14px 10px}
  .settings summary{padding:14px 0;min-height:48px;align-items:center}
  .chip{min-height:40px;padding:8px 14px;font-size:.88rem}
  .quick{gap:18px;font-size:.85rem}
  .quick button{padding:6px 0;min-height:32px}
  .word{font-size:clamp(2rem,10vw,2.8rem);margin:2px 0 10px}
  input.ans{font-size:1.3rem;min-height:52px;padding:10px 14px}
  .btn{min-height:48px;padding:12px 18px;font-size:1rem}
  .actions{position:sticky;bottom:0;z-index:4;background:var(--sheet);margin:12px -14px 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:nowrap}
  .actions .btn{flex:1 1 0;min-width:0}
  .actions #go{flex:2 1 0}
  .cch{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .cch .chip{min-height:48px;font-size:.92rem;justify-content:center;text-align:center}
  .trow{padding:10px 0}
  .ref summary{padding:12px 0;min-height:44px;display:flex;align-items:center}
  .kb{position:sticky;bottom:0;z-index:4;background:var(--bg);margin:0 -14px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
  .kb .kr{gap:3px}
  .kb button{height:46px;max-width:none;font-size:1.1rem}
  .kb button.wide{max-width:none;height:44px}
  .sheet:has(.kb) .actions{position:static;margin:12px 0 0;padding:0;border-top:0;background:transparent}
  .log li{font-size:.9rem}
}
@media (max-width:520px){.sheet{padding:16px 14px 0 26px}.sheet::before{left:14px}.actions{margin-left:-26px;padding-left:26px}.kb{margin-left:-26px}.sheet:has(.kb) .actions{margin-left:0;padding-left:0}}
/* ---- Russian colour coding (added) ---- */
:root{--ru:#8A3A8C;--ru-soft:#F6EAF5;--ru-line:#DDB6DB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ru:#E3A6E2;--ru-soft:#2C1D2D;--ru-line:#5A3A5B}}
:root[data-theme="dark"]{--ru:#E3A6E2;--ru-soft:#2C1D2D;--ru-line:#5A3A5B}
.ru-block{background:var(--ru-soft);border:1px solid var(--ru-line);border-left:4px solid var(--ru);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.ru-para{margin-top:12px}
.ru-head{font-weight:700;color:var(--ru)}
.ru-badge{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:4px;background:var(--ru);color:var(--sheet);vertical-align:1px}
.ru-sub{font-size:.8rem;color:var(--muted);margin:0}
.ru-sub b{color:var(--ru)}
table.rut{font-size:.85rem;min-width:0;background:var(--sheet)}
table.rut th{color:var(--ru)}
table.rut td{white-space:normal;font-family:var(--f-body);border-color:var(--ru-line)}
table.rut th,table.rut td{border-color:var(--ru-line)}
table.rut td.hl{background:var(--ru-line);color:var(--ink)}
.ru-decl-ref{margin-top:14px}
.ru-decl-ref summary{color:var(--ru)}
.ru-decl-ref h4{color:var(--ru)}
.rux-box{background:var(--ru-soft);border-left:4px solid var(--ru)}
.rux-box b{color:var(--ru)}
.rux{color:var(--ru)}
.rux-l{border-color:var(--ru);color:var(--ru)}
.ru-eq{background:var(--ru-soft);border-left:4px solid var(--ru)}
.ru-eq>b{color:var(--ru)}
.ru-tend summary{color:var(--ru)}
.ru-tend b{color:var(--ru)}
.endg-wrap{margin:-4px 0 14px}
table.endg-info{font-size:.9rem;min-width:0}
.endg-info td b{color:var(--accent);font-family:var(--f-body);font-weight:700}
.ref td b{color:var(--accent)}
table.rut td b{color:var(--ru)}
.rux .rux-cmp{font-family:var(--f-body);font-size:.8rem}
.rux b,.rux-box .rux-f b{color:var(--ru)}
.fb>*{min-width:0;max-width:100%}
.fb .tbl-wrap{max-width:100%}
table.endg-info td,table.endg-info th{white-space:normal}
/* ---- reset + revise bar (added) ---- */
.mk-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:-6px 0 14px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.mk-st{font-size:.85rem;color:var(--muted);flex:1 1 auto;min-width:0}
.mk-st b{color:var(--red)}
.mk-btn{appearance:none;font:inherit;font-size:.82rem;font-weight:700;border-radius:999px;padding:6px 14px;cursor:pointer;border:1.5px solid var(--accent);background:transparent;color:var(--accent);touch-action:manipulation}
.mk-btn.rev{background:var(--red);border-color:var(--red);color:#fff;flex:0 0 auto;margin-right:auto}
.mk-btn.ghost{border-color:var(--line);color:var(--muted)}
.mk-btn.warn{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.mk-msg{flex-basis:100%;font-size:.82rem;color:var(--green);font-weight:600}
.main.rv{grid-template-columns:minmax(0,1fr)}
.tag.mk-tag{background:var(--red-soft);color:var(--red)}

function expand(stem,e){return e.split('/').map(x=>stem+x).join('/');}
function adjForms(stem,type){const E=ENDS[type],o={};

const ADJS=ADJ_RAW.replace(/\n/g,'').split(';').map(x=>{let [st,ty,tr]=x.split('|');
  const forms=adjForms(st,ty);return {w:forms.m[0],ty,tr,forms,note:ADJ_NOTE[ty]};});

  VERBS.push({w:i,asp:'i',tr,partner:p,np:ipr.split(','),past:ipa.split(','),note:VNOTE[i]||''});

  VERBS.push({w:p,asp:'p',tr,partner:i,np:pr.split(','),past:pa.split(','),note:VNOTE[p]||(pre?`Prefixed perfective: ${pre}- + ${i}, conjugated exactly like ${i}.`:'')});});

/* Russian equivalent of one prompt's answer, or null */
function ruFor(it,p){
  if(S.mode==='noun'){const r=RU_N[it.word];if(!r)return null;const a=r[p.num];return a?{w:r.w,f:a[p.c]}:{w:r.w,f:'—'};}
  if(S.mode==='adj'){const r=RU_A[it.word];if(!r)return null;let f=r[p.gn][p.c];if(typeof f==='object')f=/^animate/.test(p.s)?f.an:f.in;return {w:r.m[0],f};}
  if(S.mode==='verb'){const r=RU_V[it.word];if(!r)return null;
    if(p.k==='pres')return {w:r.w,f:r.np[p.i]};
    if(p.k==='fut')return {w:r.w,f:it.tags[0]==='imperfective'?RU_BUDU[p.i]+' '+r.w:r.np[p.i]};
    if(p.k==='past')return {w:r.w,f:r.past[p.i]};return null;}
  if(S.mode==='pair'){const a=RU_VW[p.w],b=RU_VW[first(p.a)];return a&&b?{w:a,f:a+' → '+b}:null;}
  return null;}
function ruCompare(it){
  if(!['noun','adj','verb','pair'].includes(S.mode))return;
  const rs=cur.prompts.map(p=>ruFor(it,p));if(!rs.some(Boolean))return;
  const fb=document.getElementById('fb');
  if(S.style==='single'){const r=rs[0],p=cur.prompts[0];if(!r)return;
    fb.insertAdjacentHTML('beforeend',S.mode==='pair'
      ?`<p class="rule rux-box"><b>Russian:</b> <span lang="ru">${esc(show(r.f))}</span></p>`
      :`<p class="rule rux-box"><b>Russian:</b> <span lang="ru">${esc(r.w)}</span> → <span lang="ru" class="rux-f">${esc(show(r.f))}</span> <span class="rux-cmp">(Belarusian: <span lang="be">${esc(show(p.a))}</span>)</span></p>`);
  } else {
    cur.prompts.forEach((p,i)=>{const r=rs[i];if(!r)return;const row=document.getElementById('ans-'+i);if(!row)return;
      row.closest('.trow').insertAdjacentHTML('beforeend',`<div class="rux"><span class="rux-l">RU</span> <span lang="ru">${esc(show(r.f))}</span></div>`);});

  }}

  else if(S.mode==='adj'){const a=ADJS.find(x=>x.w===it.word);if(!a)return;const E=ENDS[a.ty];
    const cell=e=>typeof e==='object'?`-${e.in.replace('/',' / -')} (inanim.) · -${e.an} (anim.)`:'-'+e.split('/').join(' / -');
    const G=['m','n','f','pl'];const hl=new Set(cur.prompts.map(p=>p.c+'|'+G.indexOf(p.gn)));
    h=`<b>Endings · ${esc(ATYPE_T[a.ty])}</b>`+endTable(['masc.','neut.','fem.','plural'],CASES.map((c,i)=>({h:c.ab+' '+c.be,cells:G.map(g=>cell(E[g][i]))})),hl);}
  else if(S.mode==='verb'){const v=VERBS.find(x=>x.w===it.word);if(!v)return;const k=verbConj(v),E=VEND[k],impf=v.asp==='i';
    const hlP=new Set(cur.prompts.filter(p=>p.k==='pres'||(p.k==='fut'&&!impf)).map(p=>p.i+'|0'));
    const hlF=new Set(cur.prompts.filter(p=>p.k==='fut'&&impf).map(p=>p.i+'|0'));
    const hlPa=new Set(cur.prompts.filter(p=>p.k==='past').map(p=>p.i+'|0'));
    h=`<b>Endings · ${esc(E.t)}</b><span class="endsub">${impf?'Present tense':'Perfective future (same endings as a present tense)'}</span>`
      +endTable(['ending'],PERS.map((p,i)=>({h:p,cells:[E.r[i]]})),hlP);
    if(impf)h+=`<span class="endsub">Imperfective future: буду + infinitive (synthetic -му, -меш, -ме, -мем, -меце, -муць)</span>`
      +endTable(['auxiliary'],PERS.map((p,i)=>({h:p,cells:[BUDU[i]+' + inf.']})),hlF);
    h+=`<span class="endsub">Past tense (agrees in gender and number)</span>`
      +endTable(['ending'],['ён (m)','яна (f)','яно (n)','яны (pl)'].map((p,i)=>({h:p,cells:[VPAST[i]]})),hlPa);
    if(/(ся|цца)$/.test(v.w))h+=`<span class="endsub">Reflexive: -цца in the infinitive and 3rd person (ён, яны), -ся after -ш (ты), -ся elsewhere.</span>`;}
  else return;
  fb.insertAdjacentHTML('beforeend',`<div class="rule endn">${h}</div>`);}

/* ---- reference tables from "Belarusian declination endings table" (added) ---- */
function mdT(head,rows){return `<div class="tbl-wrap"><table class="dref"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><th>${r[0]}</th>${r.slice(1).map(c=>`<td lang="be">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
const DREF_INTRO=`<p><b>Case abbreviations:</b> N = nominative, G = genitive, D = dative, A = accusative, I = instrumental, L = locative (always used with a preposition).</p>
<p><b>Vowel alternation (akanne):</b> many endings change with stress. A stressed <b>о/ё</b> becomes unstressed <b>а/я</b> (or <b>е</b>). The tables show stressed / unstressed forms where they differ.</p>`;
const DREF_NOUNS=DREF_INTRO+`<h4>1st declension: feminine (and some masculine) in ‑а / ‑я</h4>`+mdT(['Case','Hard stem (вада)','Hardened stem* (мяжа)','Soft stem (зямля)'],[
 ['N sg','‑а','‑а','‑я'],['G sg','‑ы (‑і after г, к, х)','‑ы','‑і'],['D sg','‑е / ‑э + alternation**','‑ы','‑і'],['A sg','‑у','‑у','‑ю'],
 ['I sg','‑ой(‑ою) / ‑ай(‑аю)','‑ой(‑ою) / ‑ай(‑аю)','‑ёй(‑ёю) / ‑яй(‑яю), ‑ей'],['L sg','‑е / ‑э + alternation**','‑ы','‑і'],
 ['N pl','‑ы / ‑і','‑ы','‑і'],['G pl','∅ (вод), sometimes ‑аў','∅ / ‑аў','∅ (зямель) / ‑яў'],['D pl','‑ам','‑ам','‑ям'],
 ['A pl','= N (inanimate) / = G (animate)','same','same'],['I pl','‑амі','‑амі','‑ямі'],['L pl','‑ах','‑ах','‑ях']])
+`<p class="dnote">*Hardened consonants are ж, ш, ч, дж, р, ц.<br>**The stem consonant alternates before ‑е: г→з, к→ц, х→с, д→дз, т→ц. Examples: нага → назе, рука → руцэ, вада → вадзе.</p>
<h4>2nd declension: masculine with no ending, neuter in ‑о / ‑е / ‑ё</h4>`+mdT(['Case','Masc. hard (стол)','Masc. hardened (нож)','Masc. soft (конь)','Neut. hard (акно)','Neut. soft (поле)'],[
 ['N sg','∅','∅','∅ (‑ь)','‑о / ‑а','‑ё / ‑е'],['G sg','‑а / ‑у*','‑а / ‑у*','‑я / ‑ю*','‑а','‑я'],['D sg','‑у','‑у','‑ю','‑у','‑ю'],
 ['A sg','= N / = G (animate)','= N / = G','= N / = G','= N','= N'],['I sg','‑ом / ‑ам','‑ом / ‑ам','‑ём / ‑ем','‑ом / ‑ам','‑ём / ‑ем'],
 ['L sg','‑е / ‑э + alternation, or ‑у**','‑ы','‑і','‑е / ‑э + alternation','‑і'],['N pl','‑ы / ‑і','‑ы','‑і','‑ы / ‑і (вокны)','‑і'],
 ['G pl','‑оў / ‑аў','‑оў / ‑аў','‑ёў / ‑яў, ‑ей','‑аў, ∅','‑яў, ∅'],['D pl','‑ам','‑ам','‑ям','‑ам','‑ям'],
 ['A pl','= N / = G','= N / = G','= N / = G','= N','= N'],['I pl','‑амі','‑амі','‑ямі (sometimes ‑мі: коньмі)','‑амі','‑ямі'],['L pl','‑ах','‑ах','‑ях','‑ах','‑ях']])
+`<p class="dnote">*In the genitive singular, concrete countable nouns take ‑а/‑я (стала). Abstract, mass, collective and place nouns take ‑у/‑ю (снегу, цукру, лесу).<br>**The locative ending ‑у is common after velars (у парку) and with personal nouns (аб бацьку).</p>
<h4>3rd declension: feminine ending in a consonant (соль, ноч)</h4>`+mdT(['Case','Singular','Plural'],[
 ['N','∅','‑і / ‑ы'],['G','‑і / ‑ы','‑ей / ‑эй'],['D','‑і / ‑ы','‑ям / ‑ам'],['A','∅ (= N)','= N / = G (animate)'],
 ['I',"‑у / ‑ю, with the consonant doubled after a vowel (соллю, ноччу) or an apostrophe after labials (верф'ю)",'‑ямі / ‑амі'],['L','‑і / ‑ы','‑ях / ‑ах']])
+`<p class="dnote"><b>Irregular nouns:</b><br>Neuters in ‑мя: імя → імя, імені, імю / імені, імем, (аб) імені.<br>Baby-animal nouns in ‑я: цяля → цяляці, цяляці, цяля, цялём, (аб) цяляці.</p>`;
const DREF_ADJ=DREF_INTRO+`<h4>Hard stem: новы / stressed малады</h4>`+mdT(['Case','Masculine','Neuter','Feminine','Plural (all genders)'],[
 ['N','‑ы (новы, малады)','‑ае / ‑ое (новае, маладое)','‑ая (новая)','‑ыя (новыя)'],['G','‑ага / ‑ога','‑ага / ‑ога','‑ай / ‑ой','‑ых'],
 ['D','‑аму / ‑ому','‑аму / ‑ому','‑ай / ‑ой','‑ым'],['A','= N / = G (animate)','= N','‑ую','= N / = G (animate)'],
 ['I','‑ым','‑ым','‑ай(‑аю) / ‑ой(‑ою)','‑ымі'],['L','‑ым','‑ым','‑ай / ‑ой','‑ых']])
+`<h4>Soft stem: сіні</h4>`+mdT(['Case','Masculine','Neuter','Feminine','Plural'],[
 ['N','‑і (сіні)','‑яе (сіняе)','‑яя (сіняя)','‑ія (сінія)'],['G','‑яга','‑яга','‑яй','‑іх'],['D','‑яму','‑яму','‑яй','‑ім'],
 ['A','= N / = G','= N','‑юю','= N / = G'],['I','‑ім','‑ім','‑яй(‑яю)','‑імі'],['L','‑ім','‑ім','‑яй','‑іх']])
+`<p class="dnote"><b>Velar stems</b> (г, к, х), such as ціхі and мяккі, follow the hard pattern. The only difference is that ‑ы is written as ‑і: ціхі, ціхім, ціхія, ціхіх.</p>
<p class="dnote"><b>Full example:</b> <i>новая вада</i> (new water) declines as новая вада → новай вады → новай вадзе → новую ваду → новай вадой → (у) новай вадзе.</p>`;
function declRefHtml(){
  if(S.mode==='noun')return `<details class="ref decl-ref"><summary>Reference: noun declension endings (all declensions)</summary><div class="dref-body">${DREF_NOUNS}</div></details>`;
  if(S.mode==='adj')return `<details class="ref decl-ref"><summary>Reference: adjective declension endings</summary><div class="dref-body">${DREF_ADJ}</div></details>`;
  return '';}

/* ============ STATE ============ */
const DEF={mode:'noun',style:'single',kb:false,
 noun:{cases:[0,1,2,3,4,5],num:['sg','pl'],gen:['m','f','n','pt'],set:'all'},
 adj:{cases:[0,1,2,3,4,5],gn:['m','f','n','pl'],types:ADJ_TYPES.map(t=>t[0])},
 combo:{cases:[0,1,2,3,4,5],num:['sg','pl'],gen:['m','f','n','pt'],set:'all'},
 verb:{forms:['pres','fut','past'],asp:['i','p']},
 pair:{dir:['ip','pi']},
 prep:{types:['one','multi']}};
let S=JSON.parse(JSON.stringify(DEF));
try{const s=JSON.parse(localStorage.getItem('bgd-settings')||'null');if(s&&s.noun&&s.verb&&s.adj&&s.adj.types)S=Object.assign(S,s);}catch(e){}
const save=()=>{try{localStorage.setItem('bgd-settings',JSON.stringify(S));}catch(e){}};
const score={ok:0,all:0,streak:0};
let log=[],cur=null,lastInput=null;

/* ============ HELPERS ============ */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>s.toLowerCase().replace(/́/g,'').replace(/ё/g,'е').replace(/[’ʼ`ˈ‘]/g,"'").replace(/i/g,'і').replace(/[.,!?;:"«»]/g,'').replace(/\s+/g,' ').trim();
const stripPron=s=>s.replace(/^(я|ты|ён|яна|яно|мы|вы|яны)\s+/,'');
function isRight(input,ans,isVerb){let u=norm(input);if(isVerb)u=stripPron(u);return ans.split('/').some(a=>norm(a)===u);}
const first=a=>a.split('/')[0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function casePrompts(forms,cases,suffix){const out=[];
  cases.forEach(c=>{const f=forms[c];
    if(f&&typeof f==='object'){out.push({t:CASES[c].en,s:'inanimate · што?'+(suffix?' · '+suffix:''),a:f.in,c});out.push({t:CASES[c].en,s:'animate · каго?'+(suffix?' · '+suffix:''),a:f.an,c});}
    else out.push({t:CASES[c].en,s:CASES[c].q+(suffix?' · '+suffix:''),a:f,c});});return out;}
const show=a=>a.split('/').join(' / ');
const accCell=f=>typeof f==='object'?`${esc(show(f.in))} / ${esc(show(f.an))}`:esc(show(f));
function caseRef(cols,arrs){return {cols:['',...cols],rows:CASES.map((c,i)=>({h:c.ab+' '+c.be,cells:arrs.map(a=>a?accCell(a[i]):'—')}))};}

/* ============ GENERATORS ============ */
function genNoun(){
  if(!S.noun.cases.length||!S.noun.num.length)return null;
  const pool=NOUNS.filter(n=>S.noun.gen.includes(n.g)&&(S.noun.set!=='tricky'||n.t)&&(S.noun.set!=='regular'||!n.t)&&S.noun.num.some(x=>n[x]));
  if(!pool.length)return null;
  const n=rnd(pool),prompts=[];
  S.noun.num.forEach(num=>{const arr=n[num];if(!arr)return;
    S.noun.cases.forEach(c=>prompts.push({t:CASES[c].en,s:(num==='sg'?'singular':'plural')+' · '+CASES[c].q,a:arr[c],c,num}));});
  const tags=[GN[n.g],n.anim?'animate':'inanimate'];if(n.t)tags.push('watch out');
  return {word:n.w,tags,gloss:n.tr,note:n.note,prompts,ref:caseRef(['singular','plural'],[n.sg,n.pl]),hl:p=>({col:p.num==='sg'?0:1,row:p.c})};
}
function genAdj(){const A=S.adj;if(!A.gn.length||!A.cases.length)return null;
  const pool=ADJS.filter(a=>A.types.includes(a.ty));if(!pool.length)return null;
  const a=rnd(pool),gn=rnd(A.gn);
  return {word:a.w,tags:['adjective',GN[gn],ADJ_TYPES.find(t=>t[0]===a.ty)[1].replace(/ \(.*/,'').toLowerCase()],gloss:a.tr,note:a.note,lead:`Put it in the ${GN[gn]} form`,
    prompts:casePrompts(a.forms[gn],A.cases,GN[gn]).map(p=>({...p,gn})),
    ref:caseRef(['masc.','neut.','fem.','plural'],[a.forms.m,a.forms.n,a.forms.f,a.forms.pl]),hl:p=>({col:['m','n','f','pl'].indexOf(p.gn),row:p.c})};
}
function cross(a,b){return a.split('/').flatMap(x=>b.split('/').map(y=>x+' '+y)).join('/');}
function comboForms(adj,n,num){const af=adj.forms[num==='pl'?'pl':n.g],nf=n[num];
  return [0,1,2,3,4,5].map(c=>{let a=af[c];if(typeof a==='object')a=n.anim?a.an:a.in;return cross(a,nf[c]);});}
function genCombo(){
  const C=S.combo;if(!C.cases.length||!C.num.length)return null;
  let pool=NOUNS.filter(n=>C.gen.includes(n.g)&&C.num.some(x=>n[x]));if(C.set==='tricky')pool=pool.filter(n=>n.t);if(C.set==='regular')pool=pool.filter(n=>!n.t);if(!pool.length)return null;
  const n=rnd(pool),adj=rnd(ADJS);
  const F={sg:n.sg?comboForms(adj,n,'sg'):null,pl:comboForms(adj,n,'pl')};
  const prompts=[];
  C.num.forEach(num=>{if(!F[num])return;C.cases.forEach(c=>prompts.push({t:CASES[c].en,s:(num==='sg'?'singular':'plural')+' · '+CASES[c].q,a:F[num][c],c,num}));});
  if(!prompts.length)return null;
  const tags=[GN[n.g],n.anim?'animate':'inanimate'];if(n.t)tags.push('watch out');
  const notes=[];
  if(n.g==='m'&&/[ая]$/.test(n.w))notes.push('бацька is masculine: the adjective stays masculine (добры бацька, доброга бацькі) even though the noun ends in -а.');
  if(n.note)notes.push('Noun: '+n.note);notes.push('Adjective: '+adj.note);
  if(n.anim&&(n.g==='m'||C.num.includes('pl')))notes.push('Animate noun: masculine singular and all plural accusatives equal the genitive, for the adjective too.');
  if(n.g==='f')notes.push('Feminine instrumental: both short and long forms are accepted (новай кнігай / новаю кнігаю).');
  return {word:first((F.sg||F.pl)[0]),tags,gloss:`${adj.tr} + ${n.tr}`,note:notes.join(' '),lead:'Decline the whole phrase — adjective and noun agree',prompts,
    ref:caseRef(['singular','plural'],[F.sg,F.pl]),hl:p=>({col:p.num==='sg'?0:1,row:p.c})};
}
function synth(v){return /(ся|цца)$/.test(v.w)?null:SYN.map(e=>v.w+e);}
function genVerb(){
  const F=S.verb.forms,A=S.verb.asp;if(!F.length||!A.length)return null;
  const build=v=>{const P=[],impf=v.asp==='i',sy=impf?synth(v):null;
    if(F.includes('pres')&&impf)v.np.forEach((f,i)=>P.push({t:'Present',s:PERS[i],a:f,k:'pres',i}));
    if(F.includes('fut'))v.np.forEach((f,i)=>P.push({t:'Future',s:PERS[i]+(impf?' · compound':''),a:impf?BUDU[i]+' '+v.w+(sy?'/'+sy[i]:''):f,k:'fut',i}));
    if(F.includes('past'))['ён (m)','яна (f)','яно (n)','яны (pl)'].forEach((s,i)=>P.push({t:'Past',s,a:v.past[i],k:'past',i}));
    return P;};
  const pool=VERBS.filter(v=>A.includes(v.asp)).map(v=>({v,P:build(v)})).filter(o=>o.P.length);
  if(!pool.length)return null;
  const {v,P}=rnd(pool),impf=v.asp==='i';
  const rows=PERS.map((p,i)=>({h:p,cells:[impf?esc(show(v.np[i])):'—',esc(impf?BUDU[i]+' '+v.w:show(v.np[i]))],key:['pres|'+i,'fut|'+i]}));
  const ref={cols:['','present','future'],rows};
  const ref2=[['Past m / f / n / pl',v.past.map(show).join(', '),'past']];
  const sy=impf?synth(v):null;if(sy)ref2.push(['Synthetic future (also accepted)',sy.join(', '),'syn']);
  let note=v.note;
  if(impf&&F.includes('fut'))note=(note?note+' ':'')+'Imperfective future: буду, будзеш… + infinitive'+(sy?` (the synthetic ${sy[0]}, ${sy[1]}… is accepted too)`:'')+'.';
  if(!impf&&F.includes('pres'))note=(note?note+' ':'')+'Perfective verbs have no present tense: their conjugated form is the future.';
  return {word:v.w,tags:[impf?'imperfective':'perfective',/(ся|цца)$/.test(v.w)?'reflexive':''].filter(Boolean),note,
    gloss:`${v.tr} · pair: ${v.partner}`,prompts:P,isVerb:true,verbRef:{ref,ref2},hl:p=>p};
}
function genPair(){
  const D=S.pair.dir;if(!D.length)return null;
  const n=S.style==='single'?1:8,prompts=[],seen=new Set();let guard=0;
  while(prompts.length<n&&guard++<200){const [i,pf]=rnd(PAIRS),d=rnd(D);
    const p=d==='ip'?{w:i,t:'Perfective partner',s:'незакончанае → закончанае',a:pf,tags:['aspect','imperfective']}
                    :{w:pf,t:'Imperfective partner',s:'закончанае → незакончанае',a:i,tags:['aspect','perfective']};
    if(seen.has(p.w))continue;seen.add(p.w);prompts.push(p);}
  return {word:n===1?prompts[0].w:'Знайдзі пару',tags:n===1?prompts[0].tags:['aspect pairs'],gloss:'',isPair:true,
    note:'Pairs are formed by a prefix (чытаць → прачытаць), a suffix change (адказваць ↔ адказаць), or a different root (гаварыць ↔ сказаць, браць ↔ узяць).',
    lead:'Write the aspect partner of each verb',prompts,
    ref:{cols:['verb','partner'],rows:prompts.map(p=>({h:p.w,cells:[esc(show(p.a))]}))},hl:p=>({row:prompts.indexOf(p),col:0})};
}
function genPrep(){
  const T=S.prep.types;if(!T.length)return null;
  const pool=PREPS.filter(p=>T.includes(p[1].length+p[2].length>1?'multi':'one'));if(!pool.length)return null;
  const n=S.style==='single'?1:Math.min(8,pool.length);
  const pick=[...pool].sort(()=>Math.random()-.5).slice(0,n);
  const caseList=a=>a.map(c=>CASES[c].en).join(' + ');
  const prompts=pick.map(([w,main,extra,mean,ex])=>({w,t:'Which case(s)?',s:mean,choice:{main,extra},
    a:caseList(main)+(extra.length?` (also ${caseList(extra)})`:''),tags:['preposition',main.length+extra.length>1?'several cases':'one case'],ex}));
  return {word:n===1?prompts[0].w:'Прыназоўнікі',tags:['prepositions'],gloss:'',isPair:true,lead:'Mark every case each preposition can govern',
    note:n===1?`Example: ${prompts[0].ex}.${prompts[0].choice.extra.length?' Required: '+caseList(prompts[0].choice.main)+'; the less common case is optional.':''}`:'Rarer second cases (з + acc. "about", аб + acc. "against") are optional; the main cases are required.',
    ruNotes:prompts.map(p=>({w:p.w,ru:(RU_EQ[p.w]||['—',''])[0],nb:(RU_EQ[p.w]||['',''])[1]})),
    prompts,ref:{cols:['preposition','cases','example','Russian'],rows:prompts.map(p=>({h:p.w,cells:[esc(p.a),esc(p.ex),esc((RU_EQ[p.w]||['—'])[0])+((RU_EQ[p.w]||[])[1]?' <b style="color:var(--red)">NB</b>':'')]}))},hl:p=>({row:prompts.indexOf(p),col:0})};
}
const GEN={noun:genNoun,adj:genAdj,combo:genCombo,verb:genVerb,pair:genPair,prep:genPrep};

/* ============ RENDER: tabs & settings ============ */
const MODES=[['noun','Nouns','назоўнікі'],['adj','Adjectives','прыметнікі'],['combo','Adj. + Noun','словазлучэнні'],['verb','Verbs','дзеясловы'],['pair','Aspect pairs','трывалыя пары'],['prep','Prepositions','прыназоўнікі і склоны']];
function renderTabs(){document.getElementById('tabs').innerHTML=MODES.map(([k,en,be])=>`<button class="tab" role="tab" aria-selected="${S.mode===k}" data-mode="${k}">${en}<small lang="be">${be}</small></button>`).join('');}
function chipGroup(title,path,opts){const arr=path.split('.').reduce((o,k)=>o[k],S);
  return `<div class="grp"><h3>${title}</h3><div class="chips">${opts.map(([v,l])=>`<button class="chip" data-path="${path}" data-val="${v}" aria-pressed="${arr.includes(v)}">${l}</button>`).join('')}</div>
  <div class="quick"><button data-all="${path}">All</button><button data-none="${path}">None</button></div></div>`;}
const caseOpts=CASES.map((c,i)=>[i,c.en]);
const genOpts=[['m','Masculine'],['f','Feminine'],['n','Neuter'],['pt','Plural only']];
function renderSettings(){
  let h=`<div class="grp"><h3>Drill style</h3><div class="chips">
    <button class="chip" data-style="single" aria-pressed="${S.style==='single'}">One form at a time</button>
    <button class="chip" data-style="table" aria-pressed="${S.style==='table'}">Whole table</button></div></div>`;
  const setGrp=(m,all)=>`<div class="grp"><h3>Words</h3><div class="chips">
    <button class="chip" data-set="${m}|all" aria-pressed="${S[m].set==='all'}">${all}</button>
    <button class="chip" data-set="${m}|regular" aria-pressed="${S[m].set==='regular'}">Regular only (${NOUNS.filter(x=>!x.t).length})</button>

  if(S.mode==='noun')h+=setGrp('noun',`All (${NOUNS.length})`)+chipGroup('Cases','noun.cases',caseOpts)+chipGroup('Number','noun.num',[['sg','Singular'],['pl','Plural']])+chipGroup('Gender','noun.gen',genOpts);

  if(S.mode==='combo')h+=setGrp('combo',`All (${NOUNS.length} nouns × ${ADJS.length} adj.)`)+chipGroup('Cases','combo.cases',caseOpts)+chipGroup('Number','combo.num',[['sg','Singular'],['pl','Plural']])+chipGroup('Noun gender','combo.gen',genOpts);
  if(S.mode==='verb')h+=chipGroup(`Tenses (${VERBS.length} verbs = ${PAIRS.length} pairs)`,'verb.forms',[['pres','Present'],['fut','Future'],['past','Past']])+chipGroup('Aspect','verb.asp',[['i','Imperfective'],['p','Perfective']]);
  if(S.mode==='pair')h+=chipGroup(`Direction (${PAIRS.length} pairs)`,'pair.dir',[['ip','Imperfective → perfective'],['pi','Perfective → imperfective']]);
  if(S.mode==='prep')h+=chipGroup(`Prepositions (${PREPS.length})`,'prep.types',[['one',`One case (${PREPS.filter(p=>p[1].length+p[2].length===1).length})`],['multi',`Several cases (${PREPS.filter(p=>p[1].length+p[2].length>1).length})`]]);
  if(S.mode==='endg')h+=chipGroup('Write the ending of','endg.what',[['noun','Noun'],['adj','Adjective'],['both','Adjective + noun']])
    +`<div class="grp"><h3>Words</h3><div class="chips"><button class="chip" data-set="endg|all" aria-pressed="${S.endg.set==='all'}">All words</button><button class="chip" data-set="endg|regular" aria-pressed="${S.endg.set==='regular'}">Regular only</button><button class="chip" data-set="endg|tricky" aria-pressed="${S.endg.set==='tricky'}">Irregular / tricky only</button></div></div>`
    +chipGroup('Cases','endg.cases',caseOpts.filter(([i])=>i>0))+chipGroup('Number','endg.num',[['sg','Singular'],['pl','Plural']])
    +chipGroup('Noun gender','endg.gen',genOpts)+chipGroup('Adjective gender (adjective only)','endg.agn',[['m','Masculine'],['f','Feminine'],['n','Neuter']]);
  h+=`<div class="grp"><h3>Typing</h3><div class="chips"><button class="chip" data-kb="1" aria-pressed="${S.kb}">On-screen Belarusian keyboard</button></div></div>`;
  h+=`<p class="note">ё/е are both accepted, stress marks are ignored, and any apostrophe (' ’ ʼ) works. A Latin i is read as і.${S.mode==='verb'?' A leading pronoun (я, ты…) is ignored.':''}</p>`;
  document.getElementById('settings-body').innerHTML=h;
}

/* ============ RENDER: sheet ============ */
function newItem(){const item=GEN[S.mode]();if(!item){cur=null;renderSheet();return;}
  let prompts=item.prompts;if(S.style==='single')prompts=[rnd(prompts)];
  cur={item,prompts,checked:false,hint:0,res:[]};renderSheet();}
function tagsHtml(it){return `<div class="tags">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${it.gloss?`<span class="tag plain">${esc(it.gloss)}</span>`:''}</div>`;}
function renderSheet(){
  const el=document.getElementById('sheet');
  if(!cur){el.innerHTML=`<p class="empty">No exercises match these settings. Pick at least one option in each group${S.mode==='verb'?' (perfective verbs have no present tense, so add Future or Past)':''}.</p>`;return;}
  const it=cur.item;

  let h=tagsHtml(it)+`<div class="word" lang="be">${esc(it.word)}</div>`+(it.pre?`<div class="tbl-wrap endg-wrap">${it.pre}</div>`:'');
  if(S.style==='single'){const p=cur.prompts[0];
    h+=`<div class="target"><b>${esc(p.t)}</b><span${p.choice?'':' lang="be"'}>${esc(p.s)}</span></div>
      <div class="row">${p.choice?choiceHtml(0):`<input class="ans" id="ans-0" lang="be" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${p.endParts?(p.endParts.length>1?'Adjective ending, then noun ending (∅ or 0 = zero)':'Type the ending (∅ or 0 = zero)'):'Type the form…'}" aria-label="${esc(p.t+' '+p.s)}">`}</div>
      <div class="actions"><button class="btn" id="go">Check</button>${p.choice?'':'<button class="btn ghost" id="hint">Hint</button>'}<button class="btn ghost" id="skip">Skip</button></div>
      <div class="fb" id="fb"></div>`;
  } else {
    h+=`<p style="margin:0 0 6px;color:var(--muted)">${esc(it.lead||(it.isVerb?'Give every form below':'Decline it in every case below'))}</p>`;
    h+=cur.prompts.map((p,i)=>`<div class="trow"><label for="ans-${i}">${p.w?`<span lang="be">${esc(p.w)}</span>`:esc(p.t)}<small${p.w?'':' lang="be"'}>${esc(p.choice?p.s:p.w?p.t:p.s)}</small></label>
      ${p.choice?choiceHtml(i):`<input class="ans" id="ans-${i}" data-i="${i}" lang="be" autocomplete="off" autocapitalize="off" spellcheck="false">`}<div class="fix" id="fix-${i}" hidden></div></div>`).join('');
    h+=`<div class="actions"><button class="btn" id="go">Check all</button><button class="btn ghost" id="skip">New word</button></div><div class="fb" id="fb"></div>`;
  }
  h+=`<details class="ref" id="ref"><summary>Full paradigm</summary><div id="ref-body"></div></details>`;
  if(S.mode==='prep')h+=`<details class="ref ru-tend"><summary>Belarusian vs Russian: case government tendencies</summary><ul>${RU_TENDENCIES.map(([t,d])=>`<li><b>${esc(t)}.</b> <span lang="be">${esc(d)}</span></li>`).join('')}</ul><p class="note">Prepositions not mentioned here take the same case as their Russian equivalent. After each answer, the Russian equivalent is shown, with NB where the case differs.</p></details>`;
  if(S.kb)h+=kbHtml();
  h+=logHtml()+declRefHtml();el.innerHTML=h;renderRef();
  const f=document.getElementById('ans-0');if(f){f.focus({preventScroll:true});lastInput=f;}
}
function choiceHtml(i){return `<div class="chips cch" id="ch-${i}" role="group" aria-label="Cases">${CASES.map((c,ci)=>`<button class="chip" data-ci="${ci}" aria-pressed="false">${c.ab} ${c.en}</button>`).join('')}</div>`;}
function renderRef(){
  const b=document.getElementById('ref-body');if(!b||!cur)return;const it=cur.item,hlSet=new Set();
  if(cur.checked)cur.prompts.forEach(p=>{if(it.isVerb)hlSet.add(p.k+'|'+(p.i??''));else{const x=it.hl(p);hlSet.add(x.row+'|'+x.col);}});
  if(it.isVerb){const {ref,ref2}=it.verbRef;
    let t=`<table><thead><tr>${ref.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
    ref.rows.forEach(r=>{t+=`<tr><th lang="be">${r.h}</th>${r.cells.map((c,ci)=>`<td lang="be" class="${hlSet.has(r.key[ci])?'hl':''}">${c}</td>`).join('')}</tr>`;});
    t+='</tbody></table>';
    const t2='<table style="margin-top:8px"><tbody>'+ref2.map(([l,v,k])=>{const on=[...hlSet].some(s=>s.startsWith(k+'|'));return `<tr><th>${l}</th><td lang="be" class="${on?'hl':''}">${esc(v)}</td></tr>`;}).join('')+'</tbody></table>';
    b.innerHTML=`<div class="tbl-wrap">${t}</div><div class="tbl-wrap">${t2}</div>`;return;}
  const r=it.ref;let t=`<table><thead><tr>${r.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  r.rows.forEach((row,ri)=>{t+=`<tr><th lang="be">${row.h}</th>${row.cells.map((c,ci)=>`<td lang="be" class="${hlSet.has(ri+'|'+ci)?'hl':''}">${c}</td>`).join('')}</tr>`;});
  b.innerHTML=`<div class="tbl-wrap">${t}</tbody></table></div>`;

function logHtml(){if(!log.length)return '';
  return `<div class="log"><h2>Recent mistakes</h2><ul>${log.map(l=>`<li><span class="w" lang="be">${esc(l.w)}</span><span>${esc(l.label)}</span><span class="y" lang="be">${esc(l.you||'—')}</span><span class="c" lang="be">${esc(l.right)}</span></li>`).join('')}</ul></div>`;}
function kbHtml(){const rows=["йцукенгшўзх'",'фывапролджэ','ячсмітьбюё'];
  return `<div class="kb" aria-label="Belarusian keyboard">${rows.map(r=>`<div class="kr">${[...r].map(c=>`<button data-k="${c}" tabindex="-1">${c}</button>`).join('')}</div>`).join('')}

function updScore(){document.getElementById('sc-ok').textContent=score.ok;document.getElementById('sc-all').textContent=score.all;
  document.getElementById('sc-pct').textContent=score.all?Math.round(score.ok/score.all*100)+'%':'–';document.getElementById('sc-streak').textContent=score.streak;}

/* ============ CHECK ============ */
function check(){
  if(!cur||cur.checked)return;const it=cur.item;let allOk=true;cur.res=[];
  cur.prompts.forEach((p,i)=>{let val,ok;
    if(p.choice){const box=document.getElementById('ch-'+i);
      const sel=[...box.querySelectorAll('[aria-pressed="true"]')].map(b=>+b.dataset.ci),okSet=[...p.choice.main,...p.choice.extra];
      ok=sel.length>0&&p.choice.main.every(c=>sel.includes(c))&&sel.every(c=>okSet.includes(c));val=sel.map(c=>CASES[c].en).join(' + ');
      box.querySelectorAll('[data-ci]').forEach(b=>{const c=+b.dataset.ci,on=b.getAttribute('aria-pressed')==='true';b.disabled=true;
        if(on&&okSet.includes(c))b.classList.add('ok');else if(on)b.classList.add('bad');else if(p.choice.main.includes(c))b.classList.add('miss');});
    } else {const inp=document.getElementById('ans-'+i);val=inp.value;ok=p.endParts?endMatch(val,p.endParts):isRight(val,p.a,it.isVerb);inp.classList.add(ok?'ok':'bad');inp.readOnly=true;}
    cur.res[i]=ok;score.all++;if(ok)score.ok++;else{allOk=false;log.unshift({w:p.w||it.word,label:p.t+' · '+p.s,you:val.trim(),right:show(p.a)});}
    const fx=document.getElementById('fix-'+i);if(fx&&!ok){fx.hidden=false;fx.textContent='→ '+show(p.a);}
  });
  log=log.slice(0,8);
  if(allOk&&!cur.hint)score.streak++;else if(!allOk)score.streak=0;
  cur.checked=true;const fb=document.getElementById('fb');
  if(S.style==='single'){const p=cur.prompts[0],ok=cur.res[0];
    fb.innerHTML=ok?`<span class="mark ok">Правільна!</span><span class="right" lang="be">${esc(show(p.a))}</span>`:`<span class="mark bad">Памылка</span><span class="right" lang="be">Correct: ${esc(show(p.a))}</span>`;
  } else {const n=cur.prompts.length,k=cur.res.filter(Boolean).length;
    fb.innerHTML=`<span class="mark ${k===n?'ok':'bad'}">${k===n?'Выдатна!':k+' / '+n}</span><span style="color:var(--muted)">${k===n?'Every form correct.':'Corrections are shown under each wrong answer.'}</span>`;}
  if(it.note)fb.insertAdjacentHTML('beforeend',`<p class="rule"><b>Why:</b> ${esc(it.note)}</p>`);
  if(it.ruNotes)fb.insertAdjacentHTML('beforeend',`<div class="rule ru-eq"><b>Russian:</b><ul>${it.ruNotes.map(r=>`<li><span lang="be">${esc(r.w)}</span> → <span lang="ru">${esc(r.ru)}</span>${r.nb?`<br><span class="nb">NB</span> ${esc(r.nb)}`:' <span class="same">same case</span>'}</li>`).join('')}</ul></div>`);
  ruCompare(it);
  endingsNote(it);
  const go=document.getElementById('go');go.textContent='Next →';
  const h=document.getElementById('hint');if(h)h.hidden=true;const sk=document.getElementById('skip');if(sk)sk.hidden=true;
  document.getElementById('ref').open=!allOk;renderRef();
  const lg=document.querySelector('.log'),nl=logHtml();const dr=document.querySelector('.decl-ref');if(lg)lg.outerHTML=nl;else if(dr)dr.insertAdjacentHTML('beforebegin',nl);else document.getElementById('sheet').insertAdjacentHTML('beforeend',nl);
  updScore();go.focus({preventScroll:true});
}
function hint(){if(!cur||cur.checked)return;const a=first(cur.prompts[0].a);cur.hint=Math.min(cur.hint+1,a.length);
  const inp=document.getElementById('ans-0');inp.value=a.slice(0,cur.hint);inp.focus();}

  const b=e.target.closest('button');if(!b)return;const get=p=>p.split('.').reduce((o,k)=>o[k],S);

  else if(b.dataset.path){const arr=get(b.dataset.path);let v=b.dataset.val;if(/^\d$/.test(v))v=+v;const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);}
  else if(b.dataset.all){const p=b.dataset.all,arr=get(p);arr.length=0;arr.push(...p.split('.').reduce((o,k)=>o[k],DEF));}

  else if(b.dataset.k){const inp=lastInput&&document.body.contains(lastInput)?lastInput:document.getElementById('ans-0');if(!inp||inp.readOnly)return;
    const k=b.dataset.k,s=inp.selectionStart??inp.value.length,en=inp.selectionEnd??s;
    if(k==='⌫'){if(s===en&&s>0){inp.value=inp.value.slice(0,s-1)+inp.value.slice(en);inp.setSelectionRange(s-1,s-1);}else{inp.value=inp.value.slice(0,s)+inp.value.slice(en);inp.setSelectionRange(s,s);}}
    else{inp.value=inp.value.slice(0,s)+k+inp.value.slice(en);inp.setSelectionRange(s+1,s+1);}
    inp.focus({preventScroll:true});}
});

<style>
/* ===== phone layer (as in Инглишко на шиш): exercise first, bottom tab bar, help behind a button ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.bnav,.helpbtn{display:none}
@media (max-width:820px){
  :root{--bnav-h:62px}
  body.kbd-up{--bnav-h:0px}
  html{scroll-padding-bottom:calc(var(--bnav-h) + 80px)}
  body{overscroll-behavior-y:contain}
  #tabs{display:none!important}
  .bnav{display:grid;grid-template-columns:repeat(var(--bn,6),minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.12);
    padding:0 max(2px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(2px,env(safe-area-inset-left,0px))}
  .bnav.scroll{display:flex;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
  .bnav.scroll::-webkit-scrollbar{display:none}
  .bnav.scroll button{flex:0 0 68px;scroll-snap-align:start}
  .bnav button{position:relative;border:0;background:transparent;min-width:0;height:62px;padding:6px 0 4px;margin:0;font:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .bnav .bi{font-size:21px;line-height:1;display:grid;place-items:center;width:44px;height:28px;border-radius:999px;transition:background .15s}
  .bnav .bl{font-size:10px;font-weight:600;line-height:1.1;max-width:100%;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
  .bnav button[aria-current="page"]{color:var(--accent)}
  .bnav button[aria-current="page"] .bi{background:var(--accent-soft)}
  .bnav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .bnav .bd{position:absolute;top:7px;left:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:var(--bad,var(--red,#c0392b));box-shadow:0 0 0 2px var(--sheet)}
  .bnav button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:10px}
  .bnav.dense .bl{font-size:9.5px;letter-spacing:-.04em}
  body.kbd-up .bnav{display:none!important}
  /* instructions behind a "How it works" button */
  .helpbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--accent-soft);color:var(--muted);border-radius:999px;
    padding:6px 12px;min-height:36px;font-weight:600;font-size:13px;line-height:1.2;font-family:inherit;white-space:nowrap;cursor:pointer;margin:6px 0 0;align-self:flex-start;-webkit-tap-highlight-color:transparent}
  .helpbtn .hi{font-size:15px;line-height:1}
  .helpbtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
  body:not(.help-open) :is(#sheet .xsub,#sheet .howto,#sheet .mp>p.muted:first-of-type){display:none!important}

  .wrap{display:flex;flex-direction:column}
  .wrap>.main{order:-1}
  .wrap>header{order:2;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
  .main>.sheet{order:-1}
  /* Check / Hint / Skip stay in thumb reach, just above the bottom tab bar */
  .sheet>.actions{position:sticky;bottom:var(--bnav-h);z-index:4;background:transparent;flex-wrap:nowrap;margin:12px 0 0;padding:10px 0;border:0}
  .sheet>.actions .btn.ghost{background:var(--sheet)}
  .sheet>.actions .btn{box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .sheet:has(.kb)>.actions{position:static;margin:12px 0 0;padding:0;border-top:0;background:transparent}
  .kb{bottom:var(--bnav-h)!important}
  .wrap{padding-bottom:calc(var(--bnav-h) + 24px + env(safe-area-inset-bottom,0px))!important}
  .fb{scroll-margin-bottom:calc(var(--bnav-h) + 84px)}

}

</style>
<script>
/* ===== phone layer (as in Инглишко на шиш) ===== */
(function(){
  const C={"bp": 820, "items": [["📦", "Nouns"], ["🎨", "Adjectives"], ["🧷", "Adj+Noun"], ["🏃", "Verbs"], ["👫", "Aspect"], ["📍", "Preps"], ["🔚", "Endings"], ["🔗", "Prep+Phr"], ["❌", "Mistakes"]], "dot": ".cnt,.tcount:not(.list)", "dotRe": null, "root": "#sheet", "heads": "#sheet h2.xh,#sheet h2.ph", "helpTexts": "#sheet .xsub,#sheet .howto,#sheet .mp>p.muted:first-of-type", "hap": {"ok": ".mark.ok", "bad": ".mark.bad"}, "fb": "#fb"};
  const MQ=window.matchMedia('(max-width:'+C.bp+'px)');
  const tabsEl=document.getElementById('tabs');if(!tabsEl)return;
  const st={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const el=(t,a,...k)=>{const e=document.createElement(t);if(a)for(const n in a){if(n==='class')e.className=a[n];else if(n.startsWith('on'))e.addEventListener(n.slice(2),a[n]);else if(a[n]!=null)e.setAttribute(n,a[n])}k.forEach(x=>x!=null&&e.append(x));return e};
  /* ---------- bottom tab bar ---------- */
  const nav=el('nav',{class:'bnav','aria-label':'Sections'});document.body.append(nav);
  let busy=false;
  function render(){
    if(busy)return;busy=true;
    const tabs=[...tabsEl.children].filter(t=>t.tagName==='BUTTON'||t.getAttribute('role')==='tab');
    nav.style.setProperty('--bn',tabs.length);nav.classList.toggle('scroll',tabs.length>8);nav.classList.toggle('dense',tabs.length===8);
    nav.replaceChildren(...tabs.map((t,i)=>{
      const it=C.items[i]||['•',(t.textContent||'').trim().slice(0,10)];
      const cur=t.getAttribute('aria-selected')==='true';
      let dot=false;try{const d=C.dot&&t.querySelector(C.dot);dot=!!(d&&d.textContent.trim()&&!/^0\b/.test(d.textContent.trim())&&(!C.dotRe||new RegExp(C.dotRe).test(d.textContent)))}catch(e){}
      return el('button',{type:'button','aria-label':(t.textContent||'').trim().replace(/\s+/g,' '),'aria-current':cur?'page':null,
        onclick:()=>{t.click();try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}}},
        el('span',{class:'bi','aria-hidden':'true'},it[0]),el('span',{class:'bl'},it[1]),dot?el('span',{class:'bd','aria-hidden':'true'}):null)}));
    const a=nav.querySelector('[aria-current="page"]');
    if(a&&nav.classList.contains('scroll')){const x=a.offsetLeft-nav.clientWidth/2+a.offsetWidth/2;nav.scrollLeft=Math.max(0,x)}
    busy=false;
  }
  new MutationObserver(()=>requestAnimationFrame(render)).observe(tabsEl,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-selected','class']});
  render();
  /* hide the bar while the on-screen keyboard is up */
  const typing=e=>e&&(e.tagName==='TEXTAREA'||(e.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|file|range)$/.test(e.type)));
  document.addEventListener('focusin',e=>{if(MQ.matches&&typing(e.target))document.body.classList.add('kbd-up')});
  document.addEventListener('focusout',()=>setTimeout(()=>{if(!typing(document.activeElement))document.body.classList.remove('kbd-up')},120));
  /* ---------- instructions behind a "How it works" button ---------- */
  if(st.get('pl-help',false))document.body.classList.add('help-open');
  const root=document.querySelector(C.root)||document.body;
  function decorate(){
    const open=document.body.classList.contains('help-open');
    document.querySelectorAll(C.heads).forEach(h=>{
      if(h.nextElementSibling&&h.nextElementSibling.classList.contains('helpbtn'))return;
      const scope=h.closest('.phead,.mp,.pstack,#panel,#sheet')||h.parentElement;
      if(!scope.querySelector(C.helpTexts))return;
      h.after(el('button',{type:'button',class:'helpbtn','aria-expanded':open?'true':'false',onclick:()=>{
        const v=!document.body.classList.contains('help-open');document.body.classList.toggle('help-open',v);st.set('pl-help',v);
        document.querySelectorAll('.helpbtn').forEach(b=>b.setAttribute('aria-expanded',v?'true':'false'))}},
        el('span',{class:'hi','aria-hidden':'true'},'ⓘ'),'How it works'));
    });
  }
  new MutationObserver(decorate).observe(root,{childList:true,subtree:true});decorate();
  /* ---------- haptics + keep feedback in view ---------- */
  if(C.hap){
    let last=0;const buzz=p=>{if(!MQ.matches||!navigator.vibrate)return;const t=Date.now();if(t-last<150)return;last=t;try{navigator.vibrate(p)}catch(e){}};
    const fb=C.fb&&document.querySelector(C.fb);
    new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType!==1)continue;
      const bad=n.matches(C.hap.bad)||n.querySelector(C.hap.bad),ok=n.matches(C.hap.ok)||n.querySelector(C.hap.ok);
      if(bad||ok){buzz(bad?[30,60,30]:15);
        const f=(C.fb&&document.querySelector(C.fb))||n;
        if(MQ.matches)requestAnimationFrame(()=>{const r=f.getBoundingClientRect();if(r.bottom>window.innerHeight-140||r.top<0){try{f.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}});return}}})
      .observe(root,{childList:true,subtree:true});
  }
})();
</script>



</body></html>
