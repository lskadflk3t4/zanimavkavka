<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DRILL Russian Grammar Drill</title>
<style>
/* Layout: school exercise-book (тетрадь в клетку). Settings rail left, grid-paper drill sheet right with a red margin line; stacks on phones. */
:root{
  --bg:#EEF1F6; --sheet:#FFFFFF; --grid:rgba(43,79,203,.09); --ink:#1B2340; --muted:#5D6683;
  --line:#D5DBE8; --accent:#2B4FCB; --accent-soft:#E3E9FB; --on-accent:#FFFFFF;
  --red:#C7341F; --red-soft:#FBE7E3; --green:#1E7A4C; --green-soft:#E1F3E9; --margin:#E58A7C;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F121B; --sheet:#171B28; --grid:rgba(143,168,255,.07); --ink:#E5E9F4; --muted:#9AA2BC;
  --line:#2C3346; --accent:#8FA8FF; --accent-soft:#232C4A; --on-accent:#0F121B;
  --red:#FF8069; --red-soft:#3A2020; --green:#5FCB92; --green-soft:#183326; --margin:#8A4A42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F121B; --sheet:#171B28; --grid:rgba(143,168,255,.07); --ink:#E5E9F4; --muted:#9AA2BC;
  --line:#2C3346; --accent:#8FA8FF; --accent-soft:#232C4A; --on-accent:#0F121B;
  --red:#FF8069; --red-soft:#3A2020; --green:#5FCB92; --green-soft:#183326; --margin:#8A4A42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,3.6vw,2.2rem);margin:0;line-height:1.1;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.score{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;align-items:flex-end}
.score b{font-size:1.25rem;font-weight:700}
.score span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:10px 14px 9px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.tab small{font-weight:500;font-size:.72rem;opacity:.85}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
/* settings */
.settings{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:4px 16px 16px}
.settings summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none;display:flex;justify-content:space-between}
.settings summary::-webkit-details-marker{display:none}
.settings summary::after{content:"▾";color:var(--muted)}
.settings[open] summary::after{content:"▴"}
.grp{display:flex;flex-direction:column;gap:7px;padding-block:10px;border-top:1px solid var(--line)}
.grp h3{margin:0;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;font:inherit;font-size:.82rem;border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.quick{display:flex;gap:10px;font-size:.75rem}
.quick button{appearance:none;border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
/* sheet */
.sheet{position:relative;background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:10px;padding:22px 22px 22px 44px;min-width:0}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:28px;width:2px;background:var(--margin);opacity:.8}
@media (max-width:520px){.sheet{padding:18px 14px 18px 30px}.sheet::before{left:16px}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.tag.plain{background:transparent;color:var(--muted);padding-left:0;font-weight:500;letter-spacing:0;font-size:.85rem}
.word{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.1;margin:4px 0 14px;overflow-wrap:anywhere}
.target{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:14px}
.target b{font-size:1.2rem}
.target span{color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap}
input.ans{font-family:var(--f-display);font-size:1.35rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);flex:1 1 220px;min-width:0}
input.ans:focus{border-color:var(--accent);outline:none}
input.ans.ok{border-color:var(--green);background:var(--green-soft)}
input.ans.bad{border-color:var(--red);background:var(--red-soft)}
.btn{appearance:none;font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 11px;font-size:.82rem;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fb{margin-top:14px;min-height:2.4em;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.mark{font-family:var(--f-hand);font-size:1.9rem;font-weight:700;line-height:1}
.mark.ok{color:var(--green)}.mark.bad{color:var(--red)}
.fb .right{font-family:var(--f-display);font-size:1.2rem}
.fb .right s{color:var(--red);text-decoration-thickness:2px}
.sh p{margin:4px 0 8px;max-width:72ch;font-size:.92rem}
.sh-pairs td,.sh-pairs th{text-align:center}
.sh-pairs td{font-family:var(--f-display)}
.sh-rules{margin:10px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:.88rem;max-width:72ch;color:var(--muted)}
.sh-rules li{padding:4px 8px;border-radius:6px}
.sh-rules li.on{background:var(--accent-soft);color:var(--ink)}
.sh-rules b{color:var(--ink)}
.endg-wrap{margin:-4px 0 14px}
.endg-info{font-size:.9rem}
.endg-info td b{color:var(--accent);font-family:var(--f-body);font-weight:700}
.ends{margin-top:16px;padding-top:12px;border-top:1.5px dashed var(--line)}
.ends h3{margin:0 0 4px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.ends-sub{margin:4px 0 6px;font-size:.88rem;color:var(--muted);max-width:68ch}
.ends-sub b{color:var(--ink);font-family:var(--f-display)}
.ends table td{font-family:var(--f-body)}
.ends table td[lang="ru"]{font-family:var(--f-display)}
.cch{min-width:0}
.cch .chip{font-size:.85rem;padding:6px 11px}
.cch .chip.ok{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.cch .chip.bad{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.cch .chip.miss{border:2px dashed var(--green);color:var(--green);font-weight:700}
.cch .chip:disabled{cursor:default;opacity:1}
.rule{flex-basis:100%;margin:6px 0 0;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:.9rem}
.rule b{color:var(--accent)}
.trow{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:6px 12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.trow label{font-weight:600;font-size:.9rem;line-height:1.25}
.trow label small{display:block;font-weight:400;color:var(--muted);font-style:italic}
.trow .fix{grid-column:2;font-family:var(--f-display);color:var(--red);font-size:1rem;margin-top:-2px}
@media (max-width:520px){.trow{grid-template-columns:minmax(0,1fr)}.trow .fix{grid-column:1}}
.empty{color:var(--muted);padding:30px 0}
/* reference */
.ref{margin-top:18px}
.ref summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;font-size:.92rem;background:var(--sheet);min-width:100%}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.hl{background:var(--accent-soft);font-weight:700}
td{font-family:var(--f-display)}
/* keyboard */
.kb{margin-top:16px;display:flex;flex-direction:column;gap:5px;align-items:center}
.kb .kr{display:flex;gap:4px;flex-wrap:nowrap;justify-content:center;width:100%}
.kb button{appearance:none;font-family:var(--f-display);font-size:1rem;flex:1 1 0;min-width:0;max-width:42px;height:38px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:6px;cursor:pointer;padding:0}
.kb button.wide{max-width:96px;flex:2 1 0;font-family:var(--f-body);font-size:.78rem;font-weight:600}
.kb button:active{background:var(--accent-soft)}
/* log */
.log{margin-top:22px}
.log h2{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.log ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.log li{font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 10px}
.log li .w{font-family:var(--f-display);font-weight:700}
.log li .c{color:var(--green);font-family:var(--f-display)}
.log li .y{color:var(--red);text-decoration:line-through;font-family:var(--f-display)}
.note{font-size:.78rem;color:var(--muted);margin-top:12px}
@media (prefers-reduced-motion:no-preference){.mark{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}}
/* ===== touch / Android friendliness ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,summary,input,.chip,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.chip:active,.btn:active,.tab:active{transform:scale(.97)}
.tbl-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tbl-wrap table tr>th:first-child{position:sticky;left:0;z-index:1;background:var(--sheet)}
@media (pointer:coarse){
  .chip{min-height:40px;padding:8px 14px;font-size:.9rem}
  .cch .chip{min-height:44px;padding:9px 14px;font-size:.92rem}
  .quick{gap:4px}
  .quick button{min-height:36px;padding:6px 10px;font-size:.85rem}
  .btn{min-height:48px;padding:12px 20px;font-size:1rem}
  .settings summary{padding:16px 0;font-size:1.02rem}
  .ref summary{padding:12px 0;font-size:.95rem}
  .kb .kr{gap:5px}
  .kb button{height:46px;font-size:1.12rem;max-width:48px}
  .kb button.wide{max-width:150px;font-size:.85rem}
}
@media (max-width:820px){
  .wrap{padding:max(12px,env(safe-area-inset-top)) 12px calc(32px + env(safe-area-inset-bottom))}
  header{gap:10px;margin-bottom:12px}
  .brand h1{font-size:1.55rem}
  .brand p{font-size:.85rem}
  .score{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .score div{align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:6px 4px}
  .score b{font-size:1.15rem;line-height:1.2}
  .score span{font-size:.62rem;letter-spacing:.05em}
  /* tabs: one swipeable row instead of many wrapped rows */
  .tabs{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -12px 14px;padding:0 12px;gap:2px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 24px),transparent)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;scroll-snap-align:start;padding:12px 14px 10px;white-space:nowrap;min-height:52px}
  .main{gap:12px}
  .settings{padding:0 14px 12px}
  .sheet{padding-bottom:16px}
  .word{font-size:clamp(2rem,10vw,2.8rem)}
  input.ans{font-size:1.25rem;padding:12px 12px;min-height:52px;flex-basis:100%}
  .row{flex-direction:column}
  /* keep Check / Next reachable with the thumb */
  .actions{flex-wrap:nowrap}
  .trow ~ .actions{position:sticky;bottom:0;z-index:3;margin:12px -14px 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--sheet) 70%,transparent)}
  .actions .btn{flex:1 1 0;min-width:0}
  .actions .btn[hidden]{display:none}
  .fb{gap:6px 10px}
  .mark{font-size:2.1rem}
  .trow{padding:10px 0}
  .trow input.ans{font-size:1.15rem;min-height:48px}
  .log li{padding:6px 0;border-bottom:1px dashed var(--line)}
  th,td{padding:7px 10px}
}
@media (max-width:520px){
  .sheet{border-radius:12px}
}
/* ===== review & mistakes / progress tabs (added) ===== */
:root{--gold:#9A6A12;--gold-soft:#F6ECD6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#E0B45E;--gold-soft:#2F2717}}
:root[data-theme="dark"]{--gold:#E0B45E;--gold-soft:#2F2717}
.main.solo{grid-template-columns:minmax(0,1fr)}
.tab .tcount{font-size:.68rem;font-weight:700;color:var(--gold);margin-top:2px;opacity:1}
.tab .tcount.list{color:var(--muted);font-weight:600}
.xh{font-family:var(--f-display);font-weight:700;font-size:clamp(1.45rem,4vw,1.9rem);margin:0;line-height:1.15}
.xh span{display:block;font-family:var(--f-body);font-size:.85rem;font-weight:600;color:var(--muted);margin-top:3px}
.xsub{margin:6px 0 12px;color:var(--muted);max-width:68ch}
.howto{margin:0 0 4px;font-size:.92rem;background:var(--accent-soft);border-radius:8px;padding:10px 14px;max-width:72ch}
.sect{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sect h3{margin:0;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sect p{margin:0}
.sect .tbl-wrap{margin-top:0}
.muted{color:var(--muted)}
.xrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.mm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mt{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.ma{font-family:var(--f-display);font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.mb{font-size:.88rem;color:var(--muted);font-style:italic}
.mans{font-family:var(--f-display);font-size:1rem;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;overflow-wrap:anywhere}
.mans .y{color:var(--red);text-decoration:line-through}
.mans .c{color:var(--green)}
.when{font-size:.78rem;color:var(--muted)}
.when.now{color:var(--gold);font-weight:700}
.mx{font-weight:700;color:var(--red);flex:none;font-size:.95rem}
.mq-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qn{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.dots{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--green)}.dots i.bad{background:var(--red)}
.dots i.cur{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.done{text-align:center;padding:16px 0;display:flex;flex-direction:column;gap:10px;align-items:center}
.done h2{font-family:var(--f-hand);font-size:2.8rem;margin:0;line-height:1}
.done ul{text-align:left;margin:0;padding-left:18px;color:var(--muted);font-size:.92rem;max-width:520px}
.done ul span{font-family:var(--f-display);color:var(--ink)}
.btn.warn{border-color:var(--red);color:var(--red);background:transparent}
.btn.danger.warn{background:var(--red);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:default}
.psum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:4px}
.pcell{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.pcell strong{font-family:var(--f-display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.pcell .muted{font-size:.8rem}
.bar{height:8px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.days{--lab:34px;--plot:120px;position:relative;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;height:calc(var(--lab) + var(--plot) + 18px);align-items:end}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end;font-variant-numeric:tabular-nums}
.day .col{height:var(--plot);width:100%;max-width:26px;display:flex;align-items:flex-end;background:var(--bg);border-radius:6px 6px 0 0}
.day .col i{display:block;width:100%;background:var(--accent);opacity:.35;border-radius:6px 6px 0 0}
.day.hit .col i{opacity:1}
.day .v,.day .dl{font-size:.66rem;color:var(--muted);min-height:1em}
.day .dn{font-size:.72rem;font-weight:700}
.day.today .dn{color:var(--accent)}
.goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--gold);pointer-events:none}
.goal span{position:absolute;right:0;top:-1.35em;font-size:.66rem;color:var(--gold);background:var(--sheet);padding:0 4px}
.ptable td{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.rlist{display:flex;flex-direction:column}
.rrow2{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.rd{font-weight:700;font-size:.82rem;color:var(--muted);width:3.2em;flex:none;font-variant-numeric:tabular-nums}
.rm{flex:1;min-width:0;font-size:.9rem}
.rm b{display:block}
.pp{font-weight:700;font-variant-numeric:tabular-nums}
.pp.hi{color:var(--green)}.pp.lo{color:var(--red)}
.rrow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px dashed var(--line)}
.rtxt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:200px;font-size:.9rem}
.rtxt span{color:var(--muted)}
.rmsg{color:var(--green);font-weight:700;margin:0}
@media (max-width:820px){
  .psum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .days{--plot:96px;gap:2px}
  .sect{padding:12px}
  .mq-top{flex-wrap:wrap}
  .rrow .btn,.sect>.xrow .btn{flex:1 1 auto}
}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Падежи и спряжения</h1>
      <p>Declension and conjugation drill — nouns, adjectives, numerals, verbs</p>
    </div>

function mkNoun(w,g,a,tr,sg,pl,note){
  const s=sg==='-'?null:sg.split(','),p=pl.split(',');
  // 1st-declension instrumental variant -ою/-ею
  if(s&&/[ая]$/.test(w)&&/[оеё]й$/.test(s[4])) s[4]=s[4]+'/'+s[4].slice(0,-1)+'ю';
  return {w,g,anim:a==='1'||a===1,tr,sg:s,pl:p,note:note||'',t:!!note};}
const NOUNS=[

 ...NOUNS_TRICKY.split('\n').map(l=>{const [w,g,a,tr,sg,pl,note]=l.split('|');return mkNoun(w,g,a,tr,sg,pl,note);}),
 ...INDECL.map(([w,g,a,tr])=>{const f=Array(6).fill(w).join(',');return mkNoun(w,g,a,tr,f,f,'Indeclinable loanword: the same form in every case and number.');})];

const ENDS={
 hard:  ['ый','ого','ому','ым','ом','ое','ая','ой','ую','ые','ых','ым','ыми'],
 hardS: ['ой','ого','ому','ым','ом','ое','ая','ой','ую','ые','ых','ым','ыми'],
 soft:  ['ий','его','ему','им','ем','ее','яя','ей','юю','ие','их','им','ими'],
 velar: ['ий','ого','ому','им','ом','ое','ая','ой','ую','ие','их','им','ими'],
 velarS:['ой','ого','ому','им','ом','ое','ая','ой','ую','ие','их','им','ими'],
 sib:   ['ий','его','ему','им','ем','ее','ая','ей','ую','ие','их','им','ими'],
 sibS:  ['ой','ого','ому','им','ом','ое','ая','ой','ую','ие','их','им','ими']};
function adjForms(stem,type){
  if(type==='fox'){ // possessive -ий: лисий, лисьего
    const s=stem+'ь',fo=s+'ей';
    return {m:[stem+'ий',s+'его',s+'ему',{in:stem+'ий',an:s+'его'},s+'им',s+'ем'],
      n:[s+'е',s+'его',s+'ему',s+'е',s+'им',s+'ем'],
      f:[s+'я',fo,fo,s+'ю',fo+'/'+s+'ею',fo],
      pl:[s+'и',s+'их',s+'им',{in:s+'и',an:s+'их'},s+'ими',s+'их']};}
  if(type==='in'){ // possessive -ин: мамин, маминого
    const s=stem;
    return {m:[s,s+'ого',s+'ому',{in:s,an:s+'ого'},s+'ым',s+'ом'],
      n:[s+'о',s+'ого',s+'ому',s+'о',s+'ым',s+'ом'],
      f:[s+'а',s+'ой',s+'ой',s+'у',s+'ой/'+s+'ою',s+'ой'],
      pl:[s+'ы',s+'ых',s+'ым',{in:s+'ы',an:s+'ых'},s+'ыми',s+'ых']};}
  const e=ENDS[type],S=x=>stem+x;
  const fo=S(e[7]);
  return {
    m:[S(e[0]),S(e[1]),S(e[2]),{in:S(e[0]),an:S(e[1])},S(e[3]),S(e[4])],
    n:[S(e[5]),S(e[1]),S(e[2]),S(e[5]),S(e[3]),S(e[4])],
    f:[S(e[6]),fo,fo,S(e[8]),fo+'/'+fo.slice(0,-1)+'ю',fo],
    pl:[S(e[9]),S(e[10]),S(e[11]),{in:S(e[9]),an:S(e[10])},S(e[12]),S(e[10])]};
}

const NE=s=>s.replace(/ё/g,'е');
function endingOf(alt,stem){
  if(alt.startsWith(stem))return {end:alt.slice(stem.length)};
  if(NE(alt).startsWith(NE(stem)))return {end:alt.slice(stem.length)};
  if(stem.endsWith('ь')&&alt.startsWith(stem.slice(0,-1))&&alt.length>stem.length-1)return {end:alt.slice(stem.length-1)};
  const cores=alt.endsWith('ь')?[alt,alt.slice(0,-1)]:[alt];
  for(const c of cores)for(let i=1;i<c.length;i++){
    if('еёо'.includes(c[i])){
      if(NE(c.slice(0,i)+c.slice(i+1))===NE(stem))return {end:c===alt?'':'ь',ins:true};
      if(c[i]!=='о')for(const r of ['й','ь'])if(NE(c.slice(0,i)+r+c.slice(i+1))===NE(stem))return {end:c===alt?'':'ь',ins:true};
    }}
  return null;
}
function splitEnd(form,stem){
  const alts=form.split('/'),acc=new Set(),disp=[],html=[];
  alts.forEach(alt=>{const e=endingOf(alt,stem);acc.add(NE(alt));
    if(e){acc.add(NE(e.end));if(e.ins)acc.add('');
      disp.push(e.ins?`-∅ (${alt})`:(e.end?'-'+e.end:'-∅'));
      html.push(alt.startsWith(stem)?esc(stem)+'<b>'+esc(alt.slice(stem.length))+'</b>':esc(alt)+' <small>(∅)</small>');}
    else{disp.push(`${alt} (stem change)`);html.push('<b>'+esc(alt)+'</b>');}});
  return {acc:[...acc],disp:disp.join(' / '),html:html.join(' / ')};
}
function nounStems(n){
  const pick=(arr,idx)=>idx.map(i=>arr[i]).flatMap(f=>f.split('/'));
  const sg=n.sg?lcp(pick(n.sg,[1,2,4,5]).concat(n.sg[3]!==n.sg[0]?n.sg[3].split('/'):[])):null;
  const pl=n.pl[2].split('/')[0].slice(0,-2);

}
function endMatch(input,parts){

}
function genEndg(){

          if(E.cases.includes(ci)){prompts.push({t:c.en,s:`${numLab(num)} · inanimate noun`,a:i1.disp,endParts:[i1.acc],c:ci,num});

  const nomE=(num)=>{if(!n[num])return '—';const f=n[num][0].split('/')[0];const e=endingOf(f,S2[num]);
    const nf=a?(()=>{const af=a.forms[num==='pl'?'pl':n.g][0];const x=typeof af==='object'?af.in:af;return `${esc(x)} <b>(-${esc(x.slice(ast.length)||'∅')})</b> `;})():'';
    return `${nf}${esc(f)} <b>(${e?(e.ins?'-∅, fleeting vowel':'-'+esc(e.end||'∅')):'stem change'})</b>`;};

  const notes=[];if(n.note)notes.push((a?'Noun: ':'')+n.note);if(a&&a.note)notes.push('Adjective: '+a.note);

    tags,gloss:a?`${a.tr} + ${n.tr}`:n.tr,note:notes.join(' '),pre,isEndg:true,

function check(){

  cur.res=[];

    let val,ok;
    if(p.choice){
      const box=document.getElementById('ch-'+i);

      const okSet=[...p.choice.main,...p.choice.extra];
      ok=sel.length>0&&p.choice.main.every(c=>sel.includes(c))&&sel.every(c=>okSet.includes(c));
      val=sel.map(c=>CASES[c].en).join(' + ');
      box.querySelectorAll('[data-ci]').forEach(b=>{const c=+b.dataset.ci,on=b.getAttribute('aria-pressed')==='true';b.disabled=true;

    } else {

      inp.classList.add(ok?'ok':'bad');inp.readOnly=true;
    }
    cur.res[i]=ok;
    try{pAnswer(S.mode,pKeyOf(S.mode,it,p),pRecOf(S.mode,it,p),ok,val);}catch(e){}
    score.all++;if(ok)score.ok++;else{allOk=false;
      log.unshift({w:p.w||it.word,label:p.t+' · '+p.s,you:val.trim(),right:p.a.split('/').join(' / ')});}
    const fx=document.getElementById('fix-'+i);if(fx&&!ok){fx.hidden=false;fx.textContent='→ '+p.a.split('/').join(' / ');}
  });
  log=log.slice(0,8);
  try{pLog(S.mode,cur.res.filter(Boolean).length,cur.prompts.length);}catch(e){}
  if(allOk&&!cur.hint)score.streak++;else if(!allOk)score.streak=0;
  cur.checked=true;
  const fb=document.getElementById('fb');
  if(S.style==='single'){const p=cur.prompts[0];const ok=cur.res[0];
    fb.innerHTML=ok?`<span class="mark ok">Верно!</span><span class="right" lang="ru">${esc(p.a.split('/').join(' / '))}</span>`
      :`<span class="mark bad">Ошибка</span><span class="right" lang="ru">Correct: ${esc(p.a.split('/').join(' / '))}</span>`;
  } else {const n=cur.prompts.length,k=cur.res.filter(Boolean).length;
    fb.innerHTML=`<span class="mark ${k===n?'ok':'bad'}">${k===n?'Отлично!':k+' / '+n}</span><span style="color:var(--muted)">${k===n?'Every form correct.':'Corrections are shown under each wrong answer.'}</span>`;}
  if(it.note)fb.insertAdjacentHTML('beforeend',`<p class="rule"><b>Why:</b> ${esc(it.note)}</p>`);
  try{const eh=endingsHtml(it);if(eh)fb.insertAdjacentHTML('afterend',eh);}catch(e){}
  try{const sh=softHardHtml(it);if(sh)document.getElementById('ref').insertAdjacentHTML('beforebegin',sh);}catch(e){}
  const go=document.getElementById('go');go.textContent='Next →';
  const h=document.getElementById('hint');if(h)h.hidden=true;
  const sk=document.getElementById('skip');if(sk)sk.hidden=true;
  document.getElementById('ref').open=!allOk;renderRef();
  const lg=document.querySelector('.log');const nl=logHtml();
  if(lg)lg.outerHTML=nl;else document.getElementById('sheet').insertAdjacentHTML('beforeend',nl);
  updScore();go.focus({preventScroll:true});
}

function nounType(n){
  const w=n.w;
  if(/^Indeclinable/.test(n.note))return 'indecl';
  if(/Adjectival noun/i.test(n.note))return 'adjnoun';
  if(!n.sg)return 'pt';
  if(/мя$/.test(w)&&n.g==='n')return 'mya';
  if(n.g==='f'&&/ь$/.test(w))return '3';
  if(/ия$/.test(w))return '2ija';
  if(/а$/.test(w))return '2a';

  if(n.g==='m'){if(/ий$/.test(w))return '1ij';if(/й$/.test(w))return '1j';if(/ь$/.test(w))return '1soft';return '1hard';}

function pronSH(p,on){

/* ============ PROGRESS & MISTAKES (added) ============

const PKEY='rgd-progress-v1';

function pFix(){
  for(const k of ['days','stats','items','miss','sr'])if(!PG[k]||typeof PG[k]!=='object'||Array.isArray(PG[k]))PG[k]={};
  if(!Array.isArray(PG.log))PG.log=[];
  for(const k of Object.keys(PG.miss))if(!PG.items[k])delete PG.miss[k];
  for(const k of Object.keys(PG.sr))if(!PG.items[k])delete PG.sr[k];

const pz=n=>String(n).padStart(2,'0');

const pNum=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);};
const pToday=()=>pNum(pDay());
let pCloud=null,pT=null,pBusy=false,pAgain=false;
function pSave(){PG.ts=Date.now();try{localStorage.setItem(PKEY,JSON.stringify(PG));}catch(e){}clearTimeout(pT);pT=setTimeout(pCloudSave,1500);}
async function pCloudSave(){

  try{let js=JSON.stringify(PG);if(js.length>400000){PG.log=PG.log.slice(-40);js=JSON.stringify(PG);}await pCloud.set({json:js,ts:PG.ts});}
  catch(e){if(e&&['invalid_argument','quota_exceeded','permission_denied','not_granted'].includes(e.code))pCloud=null;}
  pBusy=false;if(pAgain){pAgain=false;pCloudSave();}
}
function pFlush(){clearTimeout(pT);try{localStorage.setItem(PKEY,JSON.stringify(PG));}catch(e){}pCloudSave();}

    let r=null;const d=snap.exists&&snap.data();if(d&&typeof d.json==='string'){try{r=JSON.parse(d.json);}catch(e){}}
    pCloud=ref;
    if(r&&(!pgLocal||(r.ts||0)>(PG.ts||0))){PG=Object.assign(PDEF(),r);pFix();try{localStorage.setItem(PKEY,JSON.stringify(PG));}catch(e){}
      renderTabs();if(S.mode==='miss'||S.mode==='prog')renderExtra();}

const ML=Object.fromEntries(MODES.map(([k,en])=>[k,en]));
/* spaced review: a mistake comes back after 1, 3, 7, 14, 30 days; it leaves the list after right answers on two different days */
const IVL=[1,3,7,14,30];
function pDayStreak(){const t=new Date();if(!PG.days[pDay(t)])t.setDate(t.getDate()-1);let n=0;while(PG.days[pDay(t)]){n++;t.setDate(t.getDate()-1);}return n;}
function pMark(k,ok){
  const tn=pToday(),r=PG.sr[k];
  if(!ok){PG.miss[k]=(PG.miss[k]||0)+1;PG.sr[k]={b:0,due:tn+1,ok:0};return;}
  if(!r)return;
  if(PG.miss[k]&&r.ok&&r.ok!==tn)delete PG.miss[k];
  if(r.due<=tn)r.b=Math.min(IVL.length-1,(r.b||0)+1);
  r.ok=tn;r.due=tn+IVL[r.b];
  if(!PG.miss[k]&&r.b>=IVL.length-1)delete PG.sr[k];
  if(!PG.miss[k]&&!PG.sr[k])delete PG.items[k];
}
const pKeyOf=(mode,it,p)=>[mode,p.w||it.word,p.t,p.s].join('|');
function pRecOf(mode,it,p){
  let note=it.note||'';
  if(mode==='prep')note=`Example: ${p.ex}.`+(p.choice&&p.choice.extra.length?' Required: '+p.choice.main.map(c=>CASES[c].en).join(' + ')+'; the less common case is optional.':'');
  else if(mode==='gov')note=(p.info||'')+'.';
  else if(mode==='num'&&p.info)note=p.info;
  else if(mode==='pair')note=p.tags&&p.tags[0]==='motion'?VCAT_NOTE.motion:'';
  return {m:mode,w:p.w||it.word,tags:(p.tags||it.tags||[]).slice(0,4),gloss:it.isPair?'':(it.gloss||''),note,pre:it.pre||'',isVerb:!!it.isVerb,
    p:{t:p.t,s:p.s,a:p.a,choice:p.choice||null,endParts:p.endParts||null,preps:p.preps||null}};
}
function pAnswer(mode,key,rec,ok,val){
  const d=pDay();const D=PG.days[d]||(PG.days[d]={n:0,c:0});D.n++;if(ok)D.c++;
  const st=PG.stats[mode]||(PG.stats[mode]={n:0,c:0});st.n++;if(ok)st.c++;
  if(ok){PG.run++;PG.best=Math.max(PG.best,PG.run);}else PG.run=0;
  const ds=Object.keys(PG.days).sort();if(ds.length>400)ds.slice(0,ds.length-400).forEach(x=>delete PG.days[x]);
  PG.bestDays=Math.max(PG.bestDays||0,pDayStreak());
  if(!ok){const old=PG.items[key];PG.items[key]=Object.assign({},rec,{you:String(val||'').trim(),last:Date.now(),first:(old&&old.first)||Date.now()});}
  pMark(key,ok);
  const ks=Object.keys(PG.items);
  if(ks.length>600)ks.sort((a,b)=>(PG.items[a].last||0)-(PG.items[b].last||0)).slice(0,ks.length-600).forEach(k=>{delete PG.items[k];delete PG.miss[k];delete PG.sr[k];});
}
function pLog(mode,c,n){PG.log.push({d:pDay(),ts:Date.now(),m:mode,c,n});if(PG.log.length>200)PG.log=PG.log.slice(-200);pSave();updBadge();}
const dueKeys=()=>{const tn=pToday();return Object.keys(PG.sr).filter(k=>PG.sr[k].due<=tn&&PG.items[k]).sort((a,b)=>PG.sr[a].due-PG.sr[b].due);};
const missKeys=()=>Object.keys(PG.miss).filter(k=>PG.items[k]);

function sample(arr,n){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}

}

function renderExtra(){
  const el=document.getElementById('sheet');
  if(S.mode==='prog'){el.innerHTML=progHtml();return;}
  if(MQ&&MQ.done){el.innerHTML=mqDoneHtml();return;}
  if(MQ){el.innerHTML=mqHtml();const f=document.getElementById('ans-0');if(f){f.focus({preventScroll:true});lastInput=f;}return;}
  el.innerHTML=missHtml();
}
function armed(b,go){
  if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Sure? Press again';b.classList.add('warn');
    clearTimeout(b._t);b._t=setTimeout(()=>{if(b.isConnected){b.dataset.armed='';b.textContent=b.dataset.label;b.classList.remove('warn');}},6000);return;}
  clearTimeout(b._t);go();
}
function pMsg(t){const m=document.getElementById('rmsg');if(m){m.textContent=t;m.hidden=false;}}
sheet.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='check'){MQ&&MQ.checked?mqNext():mqCheck();}
  else if(a==='hint'){if(!MQ||MQ.checked)return;const ans=first(MQ.recs[MQ.i].p.a);MQ.hint=Math.min(MQ.hint+1,ans.length);const inp=document.getElementById('ans-0');if(inp){inp.value=ans.slice(0,MQ.hint);inp.focus();}}
  else if(a==='skip'){if(!MQ)return;MQ.res.push(null);mqNext();}
  else if(a==='quit'){if(MQ){const c=MQ.res.filter(x=>x===1).length,n=MQ.res.filter(x=>x===0||x===1).length;if(n)pLog('miss',c,n);}MQ=null;renderExtra();}
  else if(a==='back'){MQ=null;renderExtra();}
  else if(a==='again'){mqStart(MQ.keys.filter((k,j)=>MQ.res[j]!==1));}
  else if(a==='review'){mqStart(dueKeys().slice(0,15));}
  else if(a==='practise'){const f=S.missF||'all';const list=missKeys().filter(k=>f==='all'||PG.items[k].m===f).sort((x,y)=>PG.miss[y]-PG.miss[x]);
    const n=+b.dataset.n||10;mqStart(sample(list.slice(0,Math.max(n,Math.min(list.length,20))),n));}
  else if(a==='mf'){S.missF=b.dataset.v;save();renderExtra();}
  else if(a==='clear'){armed(b,()=>{const f=S.missF||'all';missKeys().filter(k=>f==='all'||PG.items[k].m===f).forEach(k=>{delete PG.miss[k];delete PG.sr[k];delete PG.items[k];});pSave();updBadge();renderExtra();});}
  else if(a==='goal'){PG.goal=+b.dataset.v;pSave();renderExtra();}
  else if(a==='gomiss'){S.mode='miss';save();renderTabs();renderSettings();newItem();}
  else if(a==='clearmiss'){armed(b,()=>{PG.items={};PG.miss={};PG.sr={};MQ=null;pSave();updBadge();renderExtra();pMsg('Mistakes and reviews cleared.');});}
  else if(a==='resetall'){armed(b,()=>{const g=PG.goal;PG=PDEF();PG.goal=g;MQ=null;pSave();updBadge();renderExtra();pMsg('Progress deleted. You are starting fresh.');});}
});
sheet.addEventListener('keydown',e=>{
  if(S.mode!=='miss'||!MQ||MQ.done||e.key!=='Enter'||e.target.tagName==='BUTTON')return;
  e.preventDefault();MQ.checked?mqNext():mqCheck();
});

/* ============ INIT ============ */
if(window.matchMedia('(min-width:821px)').matches)document.getElementById('settings').open=true;
renderTabs();renderSettings();newItem();updScore();pCloudInit();

<script>
/* Mistake gate (added): once 20 mistakes are waiting, a pop-up offers to redo them
   before the next new exercise. "Not now" asks again after 5 more mistakes. */
(function(A){
  var LIMIT=20,KEY='mgate-snooze',bypass=false,open=null;
  function n(){try{return A.count()||0}catch(e){return 0}}
  function sz(){try{return +localStorage.getItem(KEY)||0}catch(e){return 0}}
  function setSz(v){try{if(v)localStorage.setItem(KEY,String(v));else localStorage.removeItem(KEY)}catch(e){}}
  function should(){if(bypass||open)return false;try{if(A.inReview())return false}catch(e){return false}
    var c=n();if(c<LIMIT){if(sz())setSz(0);return false}var s=sz();return !s||c>=s+5}
  function close(){if(open){open.remove();open=null}}
  function pop(btn){var c=n();var d=document.createElement('div');d.className='mg-back';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','mg-h');
    d.innerHTML='<div class="mg-card"><h2 id="mg-h">Time to redo your mistakes</h2><p><span class="mg-n">'+c+'</span>mistakes are waiting for you.</p><p>Redo them now, before new exercises. Each one you get right comes off the list.</p><div class="mg-row"><button type="button" class="mg-go">Redo '+Math.min(LIMIT,c)+' mistakes</button><button type="button" class="mg-later">Not now</button></div><p class="mg-small">“Not now” continues with the new exercise. I’ll ask again after 5 more mistakes.</p></div>';
    document.body.appendChild(d);open=d;

    d.querySelector('.mg-later').onclick=function(){close();setSz(c);if(btn&&btn.isConnected){bypass=true;try{btn.click()}finally{bypass=false}}};
    d.addEventListener('click',function(e){if(e.target===d){close()}});
    d.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();close()}else if(e.key==='Tab'){var b=d.querySelectorAll('button'),f=b[0],l=b[b.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
    setTimeout(function(){var g=d.querySelector('.mg-go');if(g)g.focus({preventScroll:true})},30)}
  addEventListener('click',function(e){if(bypass||open)return;var b=null;try{b=A.isNext(e.target)}catch(x){}if(!b||!should())return;
    e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  ['pointerdown','touchstart','mousedown'].forEach(function(t){addEventListener(t,function(e){if(open&&!open.contains(e.target)){e.stopImmediatePropagation()}},true)});

    S.mode='miss';save();renderTabs();renderSettings();newItem();mqStart(ks)}
});
