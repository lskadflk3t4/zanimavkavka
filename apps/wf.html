{c:"n2v",b:"ГОЛОС",s:"За кого вы ___ на выборах?",a:["голосовали"],d:["голосили","голосовались","озвучивали"],t:1,e:"голос → голосовать (to vote). Trap: голосить = to wail."},
{c:"n2v",b:"МУСОР",s:"Не ___ на улице!",a:["мусори"],d:["мусорь","мусоруй","мусорничай"],e:"мусор → мусорить; imperative мусори."},
{c:"n2v",b:"СУД",s:"Не ___ о человеке по одежде.",a:["суди"],d:["судачь","судь","судействуй"],t:1,e:"суд → судить. Trap: судачить = to gossip."},
{c:"n2v",b:"ГОРЕ",s:"После смерти мужа она долго ___.",a:["горевала"],d:["горела","горевела","горьчила"],t:1,e:"горе → горевать (to grieve). Trap: гореть = to burn."},
{c:"n2v",b:"ЦЕНА",s:"Я очень ___ вашу помощь.",a:["ценю"],d:["расцениваю","ценую","ценоваю"],t:1,e:"цена → ценить. Trap: расценивать = to interpret, regard as."},
{c:"n2v",b:"ВЕС",s:"Сколько ___ этот чемодан?",a:["весит"],d:["взвешивает","весует","весиет"],t:1,e:"вес → весить (intransitive). Trap: взвешивать = to weigh something."},
{c:"n2v",b:"ЗВУК",s:"Как красиво ___ эта мелодия!",a:["звучит"],d:["звукает","звучает","озвучивает"],t:1,e:"звук → звучать (к → ч)."},
{c:"n2v",b:"МЫЛО",s:"Он тщательно ___ руки.",a:["намылил"],d:["вымыл","мыловал","мылел"],t:1,e:"мыло → намылить (to soap). Trap: вымыть = to wash."},
{c:"n2v",b:"СЛЕЗА",s:"Растроганный старик ___.",a:["прослезился"],d:["заслезил","слезнулся","слёзился"],e:"слеза → прослезиться (to be moved to tears)."},
{c:"neg",b:"ДЕНЬГИ",s:"В студенческие годы мы страдали от ___.",a:["безденежья"],d:["бесденежья","безденежности","неденежья"],t:1,e:"без- + деньги + -ье: безденежье; от + genitive. Before д the prefix stays без-."},
{c:"neg",b:"ЗАБОТА",s:"У него было ___ детство.",a:["беззаботное"],d:["бесзаботное","незаботное","беззаботливое"],t:1,e:"без- + забота → беззаботный (double з)."},
{c:"neg",b:"ДОМ",s:"Во дворе бегала ___ собака.",a:["бездомная"],d:["бесдомная","недомашняя","бездомовая"],t:1,e:"без- + дом → бездомный."},
{c:"neg",b:"РАБОТА",s:"Он уже целый год ___.",a:["безработный"],d:["бесработный","неработный","безрабочий"],t:1,e:"без- + работа → безработный (unemployed)."},
{c:"neg",b:"ВОЛЯ",s:"Он оказался слабым и ___.",a:["безвольным"],d:["невольным","бесвольным","неволевым"],t:1,e:"без- + воля → безвольный (weak-willed). Trap: невольный = involuntary."},
{c:"neg",b:"СИЛА",s:"Врачи оказались ___.",a:["бессильны"],d:["безсильны","несильны","бессилие"],t:1,e:"бес- before с (voiceless): бессильный."},
{c:"neg",b:"ЖАЛОСТЬ",s:"Полиция искала ___ убийцу.",a:["безжалостного"],d:["бежалостного","нежалостного","безжалостливого"],t:1,e:"без- + жалость → безжалостный (ж is voiced: без-); accusative of an animate noun."},
{c:"neg",b:"ВКУСНЫЙ",s:"Суп оказался совсем ___.",a:["невкусным","безвкусным"],d:["бесвкусным","антивкусным","развкусным"],e:"не- + вкусный → невкусный."},
{c:"neg",b:"ПРАВДА",s:"Это ___! Я ничего такого не говорил.",a:["неправда"],d:["неправота","кривда","бесправда"],t:1,e:"не- + правда → неправда. Trap: неправота = being in the wrong."},
{c:"neg",b:"ВНИМАТЕЛЬНЫЙ",s:"Он очень ___ водитель.",a:["невнимательный"],d:["безвнимательный","бесвнимательный","невнимающий"],e:"не- + внимательный."},
{c:"neg",b:"ЗАВИСИМЫЙ",s:"Это ___ государство.",a:["независимое"],d:["беззависимое","раззависимое","независящее"],e:"не- + зависимый → независимый; neuter."},
{c:"neg",b:"ДОВОЛЬНЫЙ",s:"Он посмотрел на меня с ___ видом.",a:["недовольным"],d:["бездовольным","раздовольным","неудовольным"],e:"не- + довольный; instrumental."},
{c:"neg",b:"ВЕЖЛИВЫЙ",s:"Как ___ с твоей стороны!",a:["невежливо"],d:["невежественно","безвежливо","невежно"],t:1,e:"не- + вежливо. Trap: невежественный = ignorant."},
{c:"neg",b:"ГРУЗИТЬ",s:"Рабочие ___ вагоны.",a:["разгружают"],d:["загружают","безгружают","огружают"],t:1,e:"раз- = removal: разгружать (unload). Загружать is the opposite."},
{c:"neg",b:"ОРУЖИЕ",s:"Стороны подписали договор о ___.",a:["разоружении"],d:["обезоруживании","безоружии","неоружии"],t:1,e:"раз- + оружие → разоружение (disarmament); о + prepositional."},
{c:"neg",b:"СОВЕТОВАТЬ",s:"Друзья ___ ему покупать эту машину.",a:["отсоветовали"],d:["несоветовали","разсоветовали","засоветовали"],t:1,e:"от- = dissuasion: отсоветовать (to talk someone out of)."},
{c:"neg",b:"ЛЮБИТЬ",s:"Со временем она его ___.",a:["разлюбила"],d:["нелюбила","отлюбила","безлюбила"],e:"раз- = reversal: разлюбить (to fall out of love)."},
{c:"neg",b:"ДУМАТЬ",s:"Я ___ ехать: погода слишком плохая.",a:["передумал","раздумал"],d:["задумал","отдумал","недумал"],t:1,e:"пере- = change of mind: передумать. Trap: задумать = to plan."},
{c:"neg",b:"СОЗНАНИЕ",s:"Его доставили в больницу в ___ состоянии.",a:["бессознательном"],d:["безсознательном","несознательном","бессознанном"],t:1,e:"бес- before с. Trap: несознательный = irresponsible (lacking civic awareness)."},
{c:"neg",b:"ВРЕД",s:"Это лекарство абсолютно ___.",a:["безвредно","безвредное"],d:["бесвредно","вредоносно","безвредливо"],e:"без- + вред → безвредный."},
{c:"neg",b:"НАДЕЖДА",s:"Положение казалось ___.",a:["безнадёжным","безнадежным"],d:["ненадёжным","бесснадёжным","безнадежливым"],t:1,e:"без- + надежда → безнадёжный (hopeless). Trap: ненадёжный = unreliable."},
{c:"neg",b:"ЗВУК",s:"Её плечи тряслись от ___ смеха.",a:["беззвучного"],d:["бесзвучного","незвучного","безвучного"],t:1,e:"без- + звук → беззвучный (double з)."},
{c:"neg",b:"УСПЕХ",s:"Все попытки оказались ___.",a:["безуспешными","неуспешными"],d:["бесуспешными","безуспеховыми","беспешными"],e:"без- + успех → безуспешный (х → ш)."},
{c:"neg",b:"ОТВЕТСТВЕННЫЙ",s:"Это совершенно ___ поступок.",a:["безответственный"],d:["безответный","неответственный","бесответственный"],t:1,e:"без- + ответственный. Trap: безответный = unanswered, meek (безответная любовь)."},
{c:"abs",b:"СТАРЫЙ",s:"Он встретил ___ в родном селе.",a:["старость"],d:["старину","старьё","старшинство"],t:1,e:"старый → старость (old age). Traps: старина = olden times; старьё = junk."},
{c:"abs",b:"МОЛОДОЙ",s:"В ___ он много путешествовал.",a:["молодости"],d:["молодёжи","молодстве","молодине"],t:1,e:"молодой → молодость; в + prepositional. Trap: молодёжь = young people."},
{c:"abs",b:"ОТЕЦ",s:"Суд назначил тест на ___.",a:["отцовство"],d:["отечество","отчество","отцовщину"],t:1,e:"отец → отцовство (paternity). Traps: отечество = fatherland; отчество = patronymic."},
{c:"abs",b:"ОТЕЦ",s:"23 февраля — День защитника ___.",a:["Отечества","отечества"],d:["Отцовства","Отчества","Отечественности"],t:1,e:"отечество = fatherland (from the old root отьч-); genitive."},
{c:"abs",b:"БРАТ",s:"Они поклялись в вечном ___.",a:["братстве"],d:["братии","братовстве","братовщине"],t:1,e:"брат → братство (brotherhood); в + prepositional."},
{c:"abs",b:"СОСЕД",s:"Мы живём по ___.",a:["соседству"],d:["соседности","соседению","соседовству"],e:"сосед → соседство; по + dative: по соседству (nearby)."},
{c:"abs",b:"ВРАГ",s:"Между семьями возникла ___.",a:["вражда","враждебность"],d:["вражество","врагость","враги"],e:"враг → вражда (г → жд)."},
{c:"abs",b:"РАБ",s:"Отмена ___ в США произошла в 1865 году.",a:["рабства"],d:["работы","рабизма","рабочества"],t:1,e:"раб → рабство; genitive. (Работа shares the old root but means work.)"},
{c:"abs",b:"ЕДИНЫЙ",s:"Президент призвал к ___ нации.",a:["единству","единению"],d:["единственности","единичности","единости"],t:1,e:"единый → единство; к + dative. Trap: единственность = uniqueness."},
{c:"abs",b:"ВЕЛИКИЙ",s:"Нас поразило ___ замысла.",a:["величие"],d:["величина","величество","великость"],t:1,e:"великий → величие (grandeur). Traps: величина = size, magnitude; величество = Majesty (title)."},
{c:"abs",b:"МУДРЫЙ",s:"С годами пришла ___.",a:["мудрость"],d:["мудрёность","мудрота","мудрство"],t:1,e:"мудрый → мудрость. Trap: мудрёный = intricate (from a different shade of the root)."},
{c:"abs",b:"ЛЕНИВЫЙ",s:"Его главный недостаток — ___.",a:["лень","леность"],d:["ленивость","ленивство","ленота"],e:"ленивый → лень (or archaic леность)."},
{c:"abs",b:"ОДИНОКИЙ",s:"Больше всего он боялся ___.",a:["одиночества"],d:["одиночки","одинаковости","одинокости"],t:1,e:"одинокий → одиночество; бояться + genitive. Trap: одинаковость = sameness."},
{c:"abs",b:"ПАТРИОТ",s:"Война вызвала волну ___.",a:["патриотизма"],d:["патриархата","патриотства","патриотичности"],t:1,e:"патриот → патриотизм; genitive."},
{c:"abs",b:"МАСТЕР",s:"Его ___ восхищало зрителей.",a:["мастерство"],d:["мастерская","мастерность","мастерщина"],t:1,e:"мастер → мастерство (skill). Trap: мастерская = workshop."},
{c:"abs",b:"ВДОВА",s:"Годы ___ сильно изменили её.",a:["вдовства"],d:["вдовости","вдовенства","вдовьества"],e:"вдова → вдовство; genitive."},
{c:"abs",b:"ХОЗЯИН",s:"Она умело ведёт ___.",a:["хозяйство"],d:["хозяйственность","хозяйку","хозяинство"],t:1,e:"хозяин → хозяйство (household, economy). Trap: хозяйственность = thriftiness."},
{c:"abs",b:"ДВОРЯНИН",s:"Его предки принадлежали к ___.",a:["дворянству"],d:["дворне","дворству","дворянщине"],t:1,e:"дворянин → дворянство (nobility); к + dative. Trap: дворня = household serfs."},
{c:"abs",b:"ГОСПОДИН",s:"Армия установила ___ в воздухе.",a:["господство"],d:["господина","господность","господщину"],e:"господин → господство (supremacy)."},
{c:"abs",b:"КРЕСТЬЯНИН",s:"Русское ___ веками жило в нищете.",a:["крестьянство"],d:["христианство","крестьянщина","крестьянность"],t:1,e:"крестьянин → крестьянство (peasantry). Note: крестьянин and христианин share the same origin!"},
{c:"abs",b:"СКУЧНЫЙ",s:"Я чуть не умер от ___.",a:["скуки"],d:["скучности","скучания","скучки"],t:1,e:"скучный → скука (backward derivation); от + genitive."},
{c:"abs",b:"ГРУСТНЫЙ",s:"Её охватила лёгкая ___.",a:["грусть"],d:["грустность","грустота","грустство"],e:"грустный → грусть."},
{c:"abs",b:"ВОЛНОВАТЬСЯ",s:"От ___ он не мог произнести ни слова.",a:["волнения"],d:["волны","волнительности","волнованья"],t:1,e:"волноваться → волнение (excitement, anxiety); от + genitive."},
{c:"abs",b:"СЧАСТЛИВЫЙ",s:"Желаю тебе ___!",a:["счастья"],d:["счастье","счастливости","сочастья"],t:1,e:"счастливый → счастье; желать + genitive: счастья."},
{c:"abs",b:"ЖЕНЩИНА",s:"Её ___ покоряла всех.",a:["женственность"],d:["женатость","женскость","женщинность"],t:1,e:"женщина → женственный → женственность (femininity). Trap: женатый = married (of a man)."},
{c:"agent",b:"ПЕТЬ",s:"Она известная оперная ___.",a:["певица"],d:["певец","певичка","пелица"],t:1,e:"петь → певец / певица (feminine agrees with она). Trap: певичка = cabaret singer (pejorative)."},
{c:"agent",b:"ТАНЦЕВАТЬ",s:"Он лучший ___ в труппе.",a:["танцор","танцовщик"],d:["танцевальщик","танцевед","танцующий"],e:"танцевать → танцор / танцовщик."},
{c:"agent",b:"КУРИТЬ",s:"Он заядлый ___.",a:["курильщик"],d:["курилка","курильник","куритель"],t:1,e:"курить → курильщик (-льщик). Trap: курилка = smoking room."},
{c:"agent",b:"ПРОХОДИТЬ",s:"Один ___ вызвал полицию.",a:["прохожий"],d:["проходимец","проходчик","проходной"],t:1,e:"проходить → прохожий (passer-by, д → ж). Traps: проходимец = rogue; проходчик = tunneller."},
{c:"agent",b:"ЗАЩИЩАТЬ",s:"Он лучший ___ команды.",a:["защитник"],d:["защитчик","защищатель","защита"],e:"защищать → защитник (-ник)."},
{c:"agent",b:"ОХРАНЯТЬ",s:"У входа ___ проверил наши документы.",a:["охранник"],d:["охрана","охранитель","охранщик"],t:1,e:"охранять → охранник. Trap: охрана = the security service (collective)."},
{c:"agent",b:"ВОДИТЬ",s:"Он работает ___ автобуса.",a:["водителем"],d:["водилой","водчиком","водящим"],t:1,e:"водить → водитель; работать + instrumental."},
{c:"agent",b:"СЛУЖИТЬ",s:"Он работает ___ в банке.",a:["служащим"],d:["слугой","служителем","служакой"],t:1,e:"служить → служащий (white-collar employee). Traps: слуга = servant; служитель = clergyman, attendant."},
{c:"agent",b:"ПРОДАВАТЬ",s:"Она работает ___ в книжном магазине.",a:["продавщицей","продавцом"],d:["продавчицей","продажницей","продающей"],t:1,e:"продавать → продавец / продавщица; instrumental."},
{c:"agent",b:"ПОКУПАТЬ",s:"Этот магазин заботится о своих ___.",a:["покупателях"],d:["купцах","покупщиках","покупающих"],t:1,e:"покупать → покупатель; о + prepositional plural. Trap: купец = merchant."},
{c:"agent",b:"РУКОВОДИТЬ",s:"Наш ___ уехал в командировку.",a:["руководитель"],d:["руководство","руководящий","руководчик"],t:1,e:"руководить → руководитель. Trap: руководство = management, or a manual."},
{c:"agent",b:"ИЗОБРЕТАТЬ",s:"Талантливый ___ получил премию.",a:["изобретатель"],d:["изобретение","изобретальщик","изобретец"],t:1,e:"изобретать → изобретатель (-тель)."},
{c:"agent",b:"ИССЛЕДОВАТЬ",s:"Полярный ___ провёл зиму на льдине.",a:["исследователь"],d:["следователь","исследовщик","исследование"],t:1,e:"исследовать → исследователь. Trap: следователь = criminal investigator."},
{c:"agent",b:"СЛУШАТЬ",s:"Лекция собрала много ___.",a:["слушателей"],d:["послушников","слушальщиков","слушков"],t:1,e:"слушать → слушатель; много + genitive plural. Trap: послушник = novice monk."},
{c:"agent",b:"БОЛЕТЬ",s:"Тысячи ___ пришли на стадион.",a:["болельщиков"],d:["больных","болельников","болезных"],t:1,e:"болеть (за команду) → болельщик (fan). Trap: больной = patient."},
{c:"agent",b:"БОЛЕТЬ",s:"Врач внимательно осмотрел ___.",a:["больного"],d:["болельщика","болящего","болезного"],t:1,e:"болеть (be ill) → больной (substantivised adjective); accusative animate: больного."},
{c:"agent",b:"НАБЛЮДАТЬ",s:"На выборах работали международные ___.",a:["наблюдатели"],d:["надзиратели","наблюдальщики","наблюдчики"],t:1,e:"наблюдать → наблюдатель. Trap: надзиратель = warden, overseer."},
{c:"agent",b:"ХВАСТАТЬСЯ",s:"Не слушай его, он известный ___.",a:["хвастун"],d:["хвостун","хвастатель","хвастуша"],t:1,e:"хвастаться → хвастун (-ун). Not хвост (tail)!"},
{c:"agent",b:"ОБМАНЫВАТЬ",s:"Этот ___ всех обвёл вокруг пальца.",a:["обманщик"],d:["обманка","обманник","обманыватель"],e:"обманывать → обманщик (-щик)."},
{c:"agent",b:"ВОРОВАТЬ",s:"В метро ___ украл у меня кошелёк.",a:["вор","воришка"],d:["воровка","воровщик","ворователь"],t:1,e:"воровать → вор. Trap: воровка is feminine but the verb украл is masculine."},
{c:"agent",b:"МЕЧТАТЬ",s:"Он неисправимый ___.",a:["мечтатель"],d:["мечта","мечтун","мечтальщик"],e:"мечтать → мечтатель (-тель)."},
{c:"agent",b:"ПОБЕДИТЬ",s:"Каждый ___ конкурса получит приз.",a:["победитель"],d:["побеждённый","победник","побединщик"],t:1,e:"победить → победитель. Trap: побеждённый = the defeated."},
{c:"agent",b:"ГРАБИТЬ",s:"Банк ограбили двое ___.",a:["грабителей"],d:["грабителя","грабежей","грабильщиков"],t:1,e:"грабить → грабитель; двое + genitive plural."},

const KEY="wf-drill-v1";

const ITEM=k=>{const p=String(k).split(":");const x=D[p[0]]&&D[p[0]][+p[1]];return x?{k,l:p[0],x}:null};
for(const k of Object.keys(S.miss))if(!ITEM(k))delete S.miss[k];
if(!LANGS[S.lang])S.lang="en";
if(LOCK){S.lang=LOCK;S.mf="all";}
S.cats=S.cats.filter(c=>CATN[c]);

const norm=s=>String(s||"").normalize("NFC").replace(/[’ʼ`´]/g,"'").replace(/[‐‑–—]/g,"-").replace(/ё/g,"е").replace(/Ё/g,"Е").replace(/\s+/g," ").trim().toLowerCase();

let deck=[],pos=0,review=false,cur=null,answered=false,hinted=false,streak=0,roundR=0,roundW=0,opts=[];

function pool(){const L=S.lang;return D[L].map((x,i)=>({x,k:L+":"+i})).filter(o=>S.cats.includes(o.x.c)&&(!S.traps||o.x.t)).map(o=>o.k)}
function newDeck(){deck=shuffle(pool());pos=0;review=false;roundR=0;roundW=0;renderCard()}
function missKeys(){return Object.keys(S.miss).filter(k=>S.mf==="all"||k.startsWith(S.mf+":"))}
function startReview(){const ks=shuffle(missKeys()).slice(0,20);if(!ks.length)return;deck=ks;pos=0;review=true;roundR=0;roundW=0;showTab("practice",true);renderCard()}

/* ---------- header, languages, tabs ---------- */

function renderLangs(){

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.mode)));
$("#langs").addEventListener("click",e=>{const b=e.target.closest(".lang");if(!b)return;S.lang=b.dataset.l;save();renderLangs();renderStats();renderSettings();

/* ---------- settings ---------- */

$("#cats").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const c=b.dataset.c;

/* ---------- the card ---------- */
function sentenceHTML(x,fill,cls){const p=x.s.split("___");const g=fill==null?'<span class="gap">&nbsp;</span>':`<span class="gap ${cls||""}">${esc(fill)}</span>`;return esc(p[0])+g+esc(p.slice(1).join("___"))}
function renderRvbar(){
  $("#rvbar").innerHTML=review?`<div class="bar" style="margin-top:12px"><span><b>Mistake review</b> · ${Math.min(pos+1,deck.length)} / ${deck.length} · two correct answers clear a mistake</span><span class="sp"></span><button class="btn ghost" type="button" id="exitrv" style="min-height:36px;padding:6px 12px">Exit review</button></div>`:"";
  const x=$("#exitrv");if(x)x.onclick=()=>{review=false;newDeck()};
}
function renderCard(){

function showHint(){

  h.hidden=false;

function judge(inp,x){

  const near=x.a.find(a=>bare(a)===bare(inp));
  return{ok:false,near}
}
function answer(inp,btn){

  record(cur.k,r.ok,gave?inp:"—");
  const sent=$("#sent");sent.innerHTML=sentenceHTML(x,r.ok?r.hit:x.a[0],r.ok?"ok":"bad");
  if(S.mode==="choose"){document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(opts[i]===x.a[0])b.classList.add("ok");else if(b===btn)b.classList.add("bad")})}
  else{const a=$("#ans");a.readOnly=true;a.classList.add(r.ok?"ok":"bad")}
  const shown=r.ok?r.hit:x.a[0],seenA=new Set([norm(shown)]);const alts=x.a.filter(a=>{const n=norm(a);if(seenA.has(n))return false;seenA.add(n);return true});
  let verdict=r.ok?(hinted?"✓ Correct (with hint)":"✓ Correct"):r.shown?"Answer shown":r.near?"✗ Almost — check the accents, umlauts or special letters":"✗ Not quite";
  const m=S.miss[cur.k];
  $("#fb").innerHTML=`<div class="fb ${r.ok?"ok":"bad"}">
    <div class="verdict">${verdict}${x.t?'<span class="trap">⚠ trap</span>':""}</div>
    <div class="right" lang="${cur.l}">${esc(r.ok?r.hit:x.a[0])}${alts.length?` <span class="alt">· also accepted: ${alts.map(esc).join(", ")}</span>`:""}</div>
    ${!r.ok&&gave?`<div class="yours">Your answer: <s lang="${cur.l}">${esc(inp)}</s></div>`:""}
    ${r.capNote?`<p class="note">Mind the capital letter: German nouns are capitalised, adjectives and verbs are not.</p>`:""}
    <p class="exp" lang="${cur.l==="fr"?"fr":"en"}">${esc(x.e)}</p>
    ${r.ok&&m?`<p class="note">This was in your mistakes — ${m.ok}/2 correct answers to clear it.</p>`:""}
    ${r.ok&&review&&!m?`<p class="note">Cleared from your mistakes list.</p>`:""}
  </div>`;
  $("#acts").innerHTML=`<button class="btn" type="button" id="next">${pos+1>=deck.length?"Finish":"Next →"}</button>`;
  $("#next").onclick=()=>{pos++;renderCard()};
  $("#next").focus({preventScroll:true});
  const f=$("#fb");if(f&&f.scrollIntoView)f.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function record(k,ok,ans){
  const l=k.split(":")[0];const it=S.it[k]||(S.it[k]={r:0,w:0});const st=S.st[l]||(S.st[l]={r:0,w:0});
  if(ok){it.r++;st.r++;roundR++;streak++;if(streak>S.best)S.best=streak;
    const m=S.miss[k];if(m){m.ok=(m.ok||0)+1;if(m.ok>=2)delete S.miss[k]}}
  else{it.w++;st.w++;roundW++;streak=0;const m=S.miss[k]||{n:0,ok:0};m.n++;m.ok=0;m.a=String(ans).slice(0,80);m.t=Date.now();S.miss[k]=m}
  save();renderStats();renderTabs();
}
document.addEventListener("keydown",e=>{
  if(S.tab!=="practice"||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==="Enter"){
    if(answered){const n=$("#next");if(n){e.preventDefault();n.click()}}
    else if(S.mode==="type"&&document.activeElement===$("#ans")){e.preventDefault();answer($("#ans").value)}
    return}
  if(!answered&&S.mode==="choose"&&/^[1-4]$/.test(e.key)){const b=document.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b){e.preventDefault();b.click()}}
});

/* ---------- mistakes ---------- */
function renderMiss(){
  const p=$("#p-miss"),all=Object.keys(S.miss),ks=missKeys().sort((a,b)=>(S.miss[b].t||0)-(S.miss[a].t||0));
  const cnt=l=>all.filter(k=>k.startsWith(l+":")).length;
  const n=Math.min(20,ks.length);
  p.innerHTML=`<div class="ph"><h2>Mistakes</h2><p>${LOCK?"Every word you got wrong collects here.":"Every word you got wrong, in all four languages, collects here."}</p></div>
  <p class="howto" style="margin-top:12px"><b>How it works:</b> a review round mixes up to 20 of your mistakes. An item leaves the list once you answer it correctly twice.</p>
  <div class="sect" style="margin-top:12px"><h3>${LOCK?"Review":"Filter"}</h3>
    <div class="chips" id="mf" ${LOCK?'style="display:none"':""}><button type="button" class="chip" data-f="all" aria-pressed="${S.mf==="all"}">All languages<small>${all.length}</small></button>${LORDER.map(l=>`<button type="button" class="chip" data-f="${l}" aria-pressed="${S.mf===l}">${LANGS[l].name}<small>${cnt(l)}</small></button>`).join("")}</div>
    ${ks.length?`<div class="actions"><button class="btn" type="button" id="startrv">Start review (${n})</button><button class="btn warn" type="button" id="clr">Clear ${S.mf==="all"?"the list":LANGS[S.mf].name+" mistakes"}</button></div>`:`<p class="empty">No mistakes here yet.</p>`}
  </div>
  ${ks.length?`<div class="sect" style="margin-top:12px"><h3>${ks.length} item${ks.length>1?"s":""}</h3><div class="mlist">${ks.map(k=>{const o=ITEM(k),m=S.miss[k];return `<div class="mrow">${flag(o.l)}<div class="mm"><span class="mt">${esc(o.x.b)} · ${esc(CATN[o.x.c])}${o.x.t?" · trap":""}</span><span class="ms" lang="${o.l}">${sentenceHTML(o.x).replace('<span class="gap">&nbsp;</span>',"<b>"+esc(o.x.a[0])+"</b>")}</span><span class="my">You wrote: <s lang="${o.l}">${esc(m.a||"—")}</s>${m.ok?` · ${m.ok}/2 correct since`:""}</span></div><span class="mx">×${m.n}</span></div>`}).join("")}</div></div>`:""}`;
  p.querySelector("#mf").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;S.mf=b.dataset.f;save();renderMiss()});
  const s=p.querySelector("#startrv");if(s)s.onclick=startReview;
  const c=p.querySelector("#clr");if(c)c.onclick=()=>{if(!c.dataset.armed){c.dataset.armed="1";c.textContent="Sure? Press again";setTimeout(()=>{if(c.isConnected){delete c.dataset.armed;renderMiss()}},3000);return}
    missKeys().forEach(k=>delete S.miss[k]);save();renderTabs();renderMiss()};
}
/* ---------- overview ---------- */
function renderOver(){
  const L=S.lang,p=$("#p-over");let tr=0,tw=0,seen=0;
  const rows=CATS.map(([c,n])=>{const ks=D[L].map((x,i)=>({x,k:L+":"+i})).filter(o=>o.x.c===c);
    let r=0,w=0,s=0,t=0;ks.forEach(o=>{const it=S.it[o.k];if(o.x.t)t++;if(it){r+=it.r;w+=it.w;if(it.r||it.w)s++}});tr+=r;tw+=w;seen+=s;
    const tot=r+w;return `<tr><td>${n}</td><td class="n">${ks.length}<span class="hide-s" style="color:var(--muted)"> · ${t} traps</span></td><td class="n">${s}/${ks.length}</td><td style="width:34%"><div class="mbar" title="${r} right, ${w} wrong">${tot?`<i class="g" style="width:${r/tot*100}%"></i><i class="r" style="width:${w/tot*100}%"></i>`:""}</div></td><td class="n">${tot?Math.round(r/tot*100)+"%":"–"}</td></tr>`}).join("");
  p.innerHTML=`<div class="ph"><h2>${flag(L).replace('<svg','<svg style="width:28px;height:19px;vertical-align:-2px;margin-right:8px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.14)"')}${LANGS[L].name} · overview</h2><p>${D[L].length} items at ${LANGS[L].level} level, ${D[L].filter(x=>x.t).length} of them deliberate traps. You have tried ${seen}; best streak so far: ${S.best}.</p></div>
  <div class="sect" style="margin-top:12px"><table class="ov"><thead><tr><th>Type</th><th>Items</th><th>Tried</th><th>Right / wrong</th><th>Acc.</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

window.addEventListener("storage",e=>{if(!e.key||!e.key.endsWith(KEY))return;try{const v=JSON.parse(e.newValue||"null");if(v&&typeof v==="object"){S=Object.assign(DEF(),v);for(const k of Object.keys(S.miss))if(!ITEM(k))delete S.miss[k];renderTabs();renderStats();if(S.tab==="miss")renderMiss();if(S.tab==="over")renderOver()}}catch(err){}});
function renderHead(){
  if(!LOCK)return;const L=LANGS[LOCK];
  const sub={en:"Word formation · derivation & part-of-speech transformation",fr:"Formation des mots · dérivation et changement de catégorie",ru:"Словообразование · производные слова и переход в другую часть речи",de:"Wortbildung · Ableitung und Wortartwechsel"}[LOCK];
  $("h1").innerHTML='Word <span>formation</span>';
  $(".sub").textContent=sub+" · "+L.level+" · "+D[LOCK].length+" items";
  document.title="Word formation · "+L.name;
}
/* ---------- boot ---------- */
renderHead();renderLangs();renderSettings();renderStats();
try{const ss=S.sess;if(ss&&ss.lang===S.lang&&Array.isArray(ss.deck)&&ss.deck.length&&ss.deck.every(k=>ITEM(k))){deck=ss.deck;pos=Math.max(0,Math.min(ss.pos|0,deck.length));review=!!ss.review}}catch(e){}
showTab(S.tab==="miss"||S.tab==="over"?S.tab:"practice");
if(!deck.length)newDeck();else renderCard();
</script>
<style id="mgate-css">
.mg-back{position:fixed;inset:0;z-index:2147483000;background:rgba(15,20,18,.5);display:grid;place-items:center;padding:16px}
.mg-card{width:min(400px,100%);background:#fff;color:#1b2421;border-radius:16px;padding:20px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.3);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mg-card h2{margin:0 0 6px;font-size:20px;line-height:1.25;font-weight:700;letter-spacing:0;text-transform:none;color:inherit}
.mg-card p{margin:0 0 6px;color:#4a5752}
.mg-n{display:inline-block;min-width:1.8em;text-align:center;font-weight:700;color:#b5442f;background:#f7e5e0;border-radius:999px;padding:0 8px;margin-right:4px}
.mg-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mg-row button{font:600 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border-radius:12px;min-height:46px;padding:0 16px;cursor:pointer;border:1px solid #cfd8d3;background:#fff;color:#1b2421;flex:1 1 auto}
.mg-row .mg-go{background:#2b7a5e;border-color:#2b7a5e;color:#fff;flex:2 1 auto}
.mg-row button:focus-visible{outline:3px solid #2b7a5e;outline-offset:2px}
.mg-small{font-size:12.5px;color:#6b7873;margin-top:10px}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .mg-card{background:#19211f;color:#e3ebe7}html:not([data-theme=light]) .mg-card p{color:#a9b8b1}html:not([data-theme=light]) .mg-row button{background:#19211f;color:#e3ebe7;border-color:#34413c}html:not([data-theme=light]) .mg-row .mg-go{background:#62c39c;border-color:#62c39c;color:#0f1714}html:not([data-theme=light]) .mg-n{background:#3a221d;color:#e58169}}
</style>
<script>
/* Mistake gate (added): once 20 mistakes are waiting, a pop-up offers to redo them
   before the next new exercise. "Not now" asks again after 5 more mistakes. */
(function(A){
  var LIMIT=20,KEY='mgate-snooze',bypass=false,open=null;
  function n(){try{return A.count()||0}catch(e){return 0}}
  function sz(){try{return +localStorage.getItem(KEY)||0}catch(e){return 0}}
  function setSz(v){try{if(v)localStorage.setItem(KEY,String(v));else localStorage.removeItem(KEY)}catch(e){}}
  function should(){if(bypass||open)return false;try{if(A.inReview())return false}catch(e){return false}
    var c=n();if(c<LIMIT){if(sz())setSz(0);return false}var s=sz();return !s||c>=s+5}
  function close(){if(open){open.remove();open=null}}
  function pop(btn){var c=n();var d=document.createElement('div');d.className='mg-back';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','mg-h');
    d.innerHTML='<div class="mg-card"><h2 id="mg-h">Time to redo your mistakes</h2><p><span class="mg-n">'+c+'</span>mistakes are waiting for you.</p><p>Redo them now, before new exercises. Each one you get right comes off the list.</p><div class="mg-row"><button type="button" class="mg-go">Redo '+Math.min(LIMIT,c)+' mistakes</button><button type="button" class="mg-later">Not now</button></div><p class="mg-small">“Not now” continues with the new exercise. I’ll ask again after 5 more mistakes.</p></div>';
    document.body.appendChild(d);open=d;
    d.querySelector('.mg-go').onclick=function(){close();setSz(0);try{A.start()}catch(e){console.error(e)}};
    d.querySelector('.mg-later').onclick=function(){close();setSz(c);if(btn&&btn.isConnected){bypass=true;try{btn.click()}finally{bypass=false}}};
    d.addEventListener('click',function(e){if(e.target===d){close()}});
    d.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();close()}else if(e.key==='Tab'){var b=d.querySelectorAll('button'),f=b[0],l=b[b.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
    setTimeout(function(){var g=d.querySelector('.mg-go');if(g)g.focus({preventScroll:true})},30)}
  addEventListener('click',function(e){if(bypass||open)return;var b=null;try{b=A.isNext(e.target)}catch(x){}if(!b||!should())return;
    e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  ['pointerdown','touchstart','mousedown'].forEach(function(t){addEventListener(t,function(e){if(open&&!open.contains(e.target)){e.stopImmediatePropagation()}},true)});
  addEventListener('keydown',function(e){if(open){if(!open.contains(e.target)){e.preventDefault();e.stopImmediatePropagation()}return}
    if(e.key!=='Enter'||e.shiftKey||e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;var t=e.target;if(t&&t.tagName==='TEXTAREA')return;
    var b=null;try{b=A.enterNext(e)}catch(x){}if(!b||!should())return;e.preventDefault();e.stopImmediatePropagation();pop(b)},true);
  window.__mgate={count:n,should:should,open:function(){pop(null)},start:function(){setSz(0);try{A.start()}catch(e){console.error(e)}}};
})({
  count:function(){return Object.keys(S.miss).filter(function(k){return typeof LOCK==='undefined'||!LOCK||k.indexOf(S.lang+':')===0}).length},
  inReview:function(){return review===true||S.tab!=='practice'},
  isNext:function(t){var b=t.closest&&t.closest('#next,#skip,#again');return b&&!review?b:null},
  enterNext:function(){if(review)return null;var b=document.getElementById('next');return b&&b.offsetParent?b:null},
  start:function(){if(typeof LOCK!=='undefined'&&LOCK)S.mf=S.lang;else S.mf='all';startReview()}
});
</script>
</body>
