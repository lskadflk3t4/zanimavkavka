{c:"neg",b:"LICITE",s:"Le commerce ___ des armes prospère dans la région.",a:["illicite"],d:["inlicite","délicite","illégal"],t:1,e:"licite → illicite (in- → il- devant l). Illégal a le bon sens mais n'est pas formé sur licite."},
{c:"abs",b:"ÉRUDIT",s:"Son ___ impressionnait même ses collègues les plus savants.",a:["érudition"],d:["éruditisme","éruditude","érudité"],e:"érudit → érudition (féminin ; « son » s'emploie devant voyelle)."},
{c:"abs",b:"ESCLAVE",s:"L'abolition de l'___ fut votée en 1848.",a:["esclavage"],d:["esclaverie","esclavitude","esclavisme"],e:"esclave → esclavage (-age : état, institution). L'esclavagisme est la doctrine qui le défend."},
{c:"abs",b:"VEUF",s:"Après dix ans de ___, il se remaria.",a:["veuvage"],d:["veuvitude","veuferie","veuvité"],e:"veuf → veuvage (f → v + -age)."},
{c:"abs",b:"SEUL",s:"Il aspirait à la ___ des grands espaces.",a:["solitude"],d:["seulitude","seulesse","seulement"],t:1,e:"seul → solitude (radical savant, latin solus)."},
{c:"abs",b:"AVEUGLE",s:"Frappé de ___ à quarante ans, il continua pourtant d'écrire.",a:["cécité"],d:["aveuglement","aveuglité","aveuglesse"],t:1,e:"Piège : l'infirmité se dit cécité (latin caecus). L'aveuglement est l'incapacité figurée à voir la vérité."},
{c:"abs",b:"SOURD",s:"Sa ___ progressive l'isolait du monde.",a:["surdité"],d:["sourdité","sourdeur","sourdise"],t:1,e:"sourd → surdité (radical savant surd-)."},
{c:"abs",b:"MAÎTRE",s:"Elle a une ___ parfaite du sujet.",a:["maîtrise","maitrise"],d:["maîtresse","maîtreté","maîtrance"],t:1,e:"maître → maîtrise (-ise). Piège : maîtresse = féminin de maître."},
{c:"agent",b:"CROIRE",s:"Des milliers de ___ affluaient vers la basilique.",a:["croyants"],d:["croyeurs","crédules","croiseurs"],t:1,e:"croire → croyant (participe présent substantivé). Crédule = qui croit trop facilement."},
{c:"agent",b:"TRAHIR",s:"Il fut condamné comme ___ à la patrie.",a:["traître","traitre"],d:["trahisseur","trahiteur","trahison"],e:"trahir → traître (forme irrégulière ; graphie rectifiée : traitre)."},
{c:"agent",b:"USURPER",s:"L'___ fut renversé au bout de trois mois.",a:["usurpateur"],d:["usurpeur","usurpant","usurpation"],e:"usurper → usurpateur (-ateur)."},
{c:"agent",b:"PRÊCHER",s:"Bossuet fut le plus illustre ___ du Grand Siècle.",a:["prédicateur"],d:["prêchateur","prêchant","prédiseur"],t:1,e:"prêcher → prédicateur (radical savant, latin praedicare). Prêcheur existe, mais il est péjoratif ou désigne les dominicains (frères prêcheurs)."},
{c:"agent",b:"GOUVERNER",s:"Les ___ ont perdu la confiance du peuple.",a:["gouvernants"],d:["gouverneurs","gouvernés","gouvernementaux"],t:1,e:"Piège : les gouvernants = ceux qui exercent le pouvoir ; gouverneur = gouverneur d'une province ou d'une banque ; les gouvernés = ceux qui sont gouvernés."},
{c:"agent",b:"VAINCRE",s:"Le ___ du tournoi a reçu une coupe en or.",a:["vainqueur"],d:["vainceur","vaincu","vainquant"],t:1,e:"vaincre → vainqueur (qu devant -eur). Piège : le vaincu est celui qui perd."},
{c:"agent",b:"SAUVER",s:"Les ___ ont dégagé trois survivants des décombres.",a:["sauveteurs"],d:["sauveurs","sauvageurs","sauvants"],t:1,e:"Piège : sauveteur = secouriste ; sauveur = celui qui sauve (sens religieux ou figuré)."},
{c:"agent",b:"CROIRE",s:"« Les ___ seront châtiés ! » tonnait le prédicateur.",a:["mécréants"],d:["mécroyants","décroyants","malcroyants"],t:1,e:"mé- (négatif) + créant, ancienne forme de croyant : mécréant = infidèle, impie. Le radical ancien cré- n'apparaît plus que dans ce mot."},
{c:"agent",b:"BIENFAIT",s:"Un généreux ___ a financé la restauration de l'orgue.",a:["bienfaiteur"],d:["bienfaisant","bénéficiaire","bienfaitier"],t:1,e:"bienfait → bienfaiteur. Piège : le bénéficiaire est celui qui reçoit."},
{c:"qual",b:"AMER",s:"Il évoqua son passé avec ___.",a:["amertume"],d:["amerté","amèreté","amertise"],e:"amer → amertume (suffixe rare -ume)."},
{c:"qual",b:"HUMBLE",s:"Je le dis en toute ___.",a:["humilité"],d:["humblesse","humbleté","humiliation"],t:1,e:"humble → humilité (radical savant humil-). Piège : l'humiliation est le fait d'être humilié."},
{c:"qual",b:"ÉCHOUER",s:"Après trois ___ consécutifs, il abandonna.",a:["échecs"],d:["échouements","échouages","échoues"],t:1,e:"échouer → échec (formation irrégulière). Échouage = action d'échouer un navire."},
{c:"qual",b:"DÉCOUVRIR",s:"La ___ du vaccin a sauvé des millions de vies.",a:["découverte"],d:["découvrement","découvraison","découvertise"],e:"découvrir → découverte (participe passé féminin substantivé)."}
];

D.ru=[
{c:"n2adj",b:"ЗОЛОТО",s:"У неё ___ сердце.",a:["золотое"],d:["золотистое","золотное","золотовое"],t:1,e:"золото → золотой (neuter to agree with сердце: золотое). Trap: золотистый = golden in colour (золотистые волосы)."},
{c:"n2adj",b:"ДЕРЕВО",s:"В углу стоял старый ___ стол.",a:["деревянный"],d:["древесный","деревенский","деревный"],t:1,e:"дерево → деревянный (suffix -янн-, double н). Traps: древесный = of wood as a material (древесный уголь); деревенский = of a village."},
{c:"n2adj",b:"ДЕРЕВНЯ",s:"Он вырос в простом ___ доме.",a:["деревенском"],d:["деревянном","деревенном","деревнином"],t:1,e:"деревня → деревенский (suffix -ск-), prepositional case after в: в деревенском доме. Trap: деревянный comes from дерево."},
{c:"n2adj",b:"ЛЕС",s:"Узкая ___ дорога вела к озеру.",a:["лесная"],d:["лесистая","лесовая","лесничья"],t:1,e:"лес → лесной = of the forest, located in it. Trap: лесистый = covered with forests."},
{c:"n2adj",b:"ЛЕС",s:"Это очень ___ местность, здесь легко заблудиться.",a:["лесистая"],d:["лесная","лесовая","лесовитая"],t:1,e:"-ист- means ‘rich in’: лесистая местность. Relational adjectives such as лесной cannot be graded with очень."},
{c:"n2adj",b:"ГОРОД",s:"Мы обычно пользуемся ___ транспортом.",a:["городским"],d:["городовым","городным","городочным"],e:"город → городской; instrumental after пользоваться: городским транспортом."},
{c:"n2adj",b:"ДРУГ",s:"За чашкой чая шёл ___ разговор.",a:["дружеский"],d:["дружественный","дружный","друговой"],t:1,e:"друг → дружеский (between people). Traps: дружественный is used of states (дружественная страна); дружный = united, harmonious (дружная семья)."},
{c:"n2adj",b:"ЭКОНОМИЯ",s:"Моя бабушка — очень ___ хозяйка.",a:["экономная"],d:["экономическая","экономичная","экономиная"],t:1,e:"Trap: экономный = thrifty (a person); экономичный = economical (a thing: экономичный двигатель); экономический = relating to the economy."},
{c:"adj2n",b:"ЧИСТЫЙ",s:"В комнате царила идеальная ___.",a:["чистота"],d:["чистость","чистина","чистизна"],e:"чистый → чистота (suffix -от-а)."},
{c:"adj2n",b:"БЕЛЫЙ",s:"Глаза слепила ___ снега.",a:["белизна"],d:["белота","белость","белина"],e:"белый → белизна (suffix -изн-а, as in новизна)."},
{c:"adj2n",b:"ГЛУБОКИЙ",s:"Озеро имеет ___ около сорока метров.",a:["глубину"],d:["глубокость","глубота","глубина"],t:1,e:"глубокий → глубина (suffix -ин-а). After имеет the noun is accusative: глубину."},
{c:"adj2n",b:"ГОРДЫЙ",s:"Мать говорила о сыне с ___.",a:["гордостью"],d:["гордость","гордыней","гордостей"],t:1,e:"гордый → гордость; instrumental after с: с гордостью. Trap: гордыня = arrogance, pride as a sin."},
{c:"adj2n",b:"ЩЕДРЫЙ",s:"Все удивлялись его ___.",a:["щедрости"],d:["щедрость","щедроте","щедрине"],e:"щедрый → щедрость; удивляться takes the dative: щедрости."},
{c:"adj2n",b:"ТИХИЙ",s:"В доме стояла мёртвая ___.",a:["тишина"],d:["тихость","тихота","тихизна"],t:1,e:"тихий → тишина: х alternates with ш before -ин-а."},
{c:"adj2n",b:"ДОБРЫЙ",s:"Её ___ трогала всех вокруг.",a:["доброта"],d:["добрость","добротность","добрина"],t:1,e:"добрый → доброта = kindness. Trap: добротность = good quality of workmanship."},
{c:"v2n",b:"ВЫБИРАТЬ",s:"В воскресенье в городе прошли ___ мэра.",a:["выборы"],d:["выбор","выборка","выбирание"],t:1,e:"выбирать → выборы (plural only) = elections. Traps: выбор = choice; выборка = sample."},
{c:"v2n",b:"ПРЕПОДАВАТЬ",s:"Она посвятила ___ тридцать лет жизни.",a:["преподаванию"],d:["преподавание","преподавательству","преподаву"],e:"преподавать → преподавание; посвятить takes the dative: преподаванию."},
{c:"v2n",b:"ОТКРЫТЬ",s:"Учёный сделал важное ___.",a:["открытие"],d:["открывание","открытость","открытка"],t:1,e:"открыть → открытие = discovery. Traps: открывание = opening (of a door); открытость = openness; открытка = postcard."},
{c:"v2n",b:"ОБЪЯСНИТЬ",s:"У меня нет ___ этому странному факту.",a:["объяснения"],d:["объяснение","объяснений","объяснительной"],t:1,e:"объяснить → объяснение; нет takes the genitive: объяснения."},
{c:"v2n",b:"ПОДПИСАТЬ",s:"Документ без ___ недействителен.",a:["подписи"],d:["подписки","подписания","подпись"],t:1,e:"подписать → подпись = signature; genitive after без. Traps: подписка = subscription; подписание = the act of signing (подписание договора)."},
{c:"v2n",b:"ЛЕЧИТЬ",s:"Врач назначил ему длительное ___.",a:["лечение"],d:["лечебное","лечивание","лекарство"],e:"лечить → лечение (suffix -ени-е)."},
{c:"v2n",b:"СПОРИТЬ",s:"Между ними разгорелся жаркий ___.",a:["спор"],d:["спорение","спорщик","спорность"],e:"спорить → спор: zero suffix, the verb ending simply drops."},
{c:"v2n",b:"ВХОДИТЬ",s:"Где здесь ___ в метро?",a:["вход"],d:["входение","хождение","выход"],e:"входить → вход (zero suffix, like выходить → выход)."},
{c:"v2adj",b:"ЧИТАТЬ",s:"Это одна из самых ___ книг года.",a:["читаемых"],d:["читательских","читальных","чтимых"],t:1,e:"читать → читаемый (widely read); genitive plural after одна из. Traps: читательский = of readers; чтимый = revered (from чтить)."},
{c:"v2adj",b:"ЛОМАТЬ",s:"У неё очень ___ волосы.",a:["ломкие"],d:["ломаные","ломовые","ломательные"],t:1,e:"ломать → ломкий (-к-: prone to). Trap: ломаный = broken (ломаный английский)."},
{c:"v2adj",b:"ПИТЬ",s:"В деревне не было ___ воды.",a:["питьевой"],d:["питейной","питательной","питьей"],t:1,e:"пить → питьевой = drinkable. Traps: питейный = to do with alcohol (питейное заведение); питательный = nutritious."},
{c:"v2adj",b:"СТИРАТЬ",s:"Нам наконец привезли новую ___ машину.",a:["стиральную"],d:["стирательную","стираемую","стирочную"],e:"стирать → стиральный (-льн-: intended for an action); accusative: стиральную машину."},
{c:"v2adj",b:"ДОВЕРЯТЬ",s:"Она слишком ___ и всем верит на слово.",a:["доверчива","доверчивая"],d:["доверительна","доверенная","доверяема"],t:1,e:"доверять → доверчивый = trusting (character). Traps: доверительный = confidential (доверительный разговор); доверенный = authorised (доверенное лицо)."},
{c:"v2adj",b:"УДИВИТЬ",s:"Он посмотрел на меня ___ взглядом.",a:["удивлённым"],d:["удивительным","удивляемым","удивлённостью"],t:1,e:"удивить → удивлённый = surprised (a state). Trap: удивительный = surprising, amazing."},
{c:"v2adj",b:"РАЗДРАЖАТЬ",s:"После болезни он стал очень ___: выходил из себя по любому пустяку.",a:["раздражительным","раздражённым"],d:["раздражающим","раздражимым","раздражным"],t:1,e:"раздражать → раздражительный = irritable. Trap: раздражающий = irritating (to others). Стать takes the instrumental."},
{c:"adv",b:"ИСКРЕННИЙ",s:"Я ___ благодарен вам за помощь.",a:["искренне","искренно"],d:["искреннее","искренее","искренни"],t:1,e:"Soft-stem adjectives form adverbs in -е: искренне. Traps: искреннее is the comparative; искренее is misspelt (the double н is kept)."},
{c:"adv",b:"ДРУЖЕСКИЙ",s:"Он ___ похлопал меня по плечу.",a:["по-дружески","дружески"],d:["дружно","по-дружному","дружеско"],t:1,e:"Adjectives in -ский form adverbs with по- … -и: по-дружески. Trap: дружно = together, in unison."},
{c:"adv",b:"РУССКИЙ",s:"Вы хорошо говорите ___?",a:["по-русски"],d:["русски","по-русскому","русско"],t:1,e:"по- + stem + -и, written with a hyphen: по-русски. По-русскому is colloquial and non-standard."},
{c:"adv",b:"ТЩАТЕЛЬНЫЙ",s:"Все документы были ___ проверены.",a:["тщательно"],d:["тщательне","тщательнее","тщательным"],e:"тщательный → тщательно (-о)."},
{c:"adv",b:"ДОМАШНИЙ",s:"В этой гостинице уютно, совсем ___.",a:["по-домашнему"],d:["домашне","по-домашни","домашно"],t:1,e:"Adjectives in -ний / -ный give по- … -ему / -ому: по-домашнему (soft stem → -ему)."},
{c:"adv",b:"ДЕТСКИЙ",s:"Он ___ обрадовался подарку.",a:["по-детски"],d:["по-детскому","детско","детским"],e:"по-детски, built like по-русски."},
{c:"n2v",b:"ЗОЛОТО",s:"Мастер решил ___ старую раму.",a:["позолотить","золотить"],d:["озолотить","золотеть","золотовать"],t:1,e:"золото → (по)золотить = to gild. Traps: озолотить = to make someone rich; золотеть = to turn golden."},
{c:"n2v",b:"СОЛЬ",s:"Не забудь ___ суп!",a:["посолить","солить"],d:["засолить","солеть","осолить"],t:1,e:"соль → (по)солить. Trap: засолить = to pickle, preserve in salt."},
{c:"n2v",b:"ДРУГ",s:"Мы с Петей ___ с детства.",a:["дружим"],d:["дружимся","дружествуем","другуем"],e:"друг → дружить (г alternates with ж): мы дружим."},
{c:"n2v",b:"ГОСТЬ",s:"Каждое лето мы ___ у бабушки в деревне.",a:["гостили"],d:["угощали","гостевали","гостились"],t:1,e:"гость → гостить = to stay as a guest. Trap: угощать = to treat someone (to food)."},
{c:"n2v",b:"ТРУД",s:"Он всю жизнь ___ на заводе.",a:["трудился"],d:["трудил","трудоустроился","трудствовал"],t:1,e:"труд → трудиться (reflexive). Trap: трудоустроиться = to find a job."},
{c:"n2v",b:"ВРЕД",s:"Курение ___ здоровью.",a:["вредит"],d:["вредничает","вредствует","вредеет"],t:1,e:"вред → вредить + dative. Trap: вредничать = to be spiteful (colloquial)."},
{c:"neg",b:"ВКУС",s:"На ней было ужасно ___ платье.",a:["безвкусное"],d:["невкусное","бесвкусное","антивкусное"],t:1,e:"без- + вкус + -н-: безвкусный = in poor taste. Trap: невкусный = not tasty (food). Before the voiced в the prefix stays без-."},
{c:"neg",b:"СМЫСЛ",s:"Спорить с ним совершенно ___.",a:["бессмысленно"],d:["безсмысленно","несмысленно","немысленно"],t:1,e:"без- becomes бес- before a voiceless consonant (с): бессмысленно."},
{c:"neg",b:"ОПАСНЫЙ",s:"Этот район вполне ___.",a:["безопасен","безопасный"],d:["бесопасен","безопастен","разопасен"],e:"без- + опасный → безопасный; short form: безопасен."},
{c:"neg",b:"ДОВЕРИЕ",s:"Он посмотрел на меня с ___.",a:["недоверием"],d:["бездоверием","неверием","раздоверием"],t:1,e:"не- + доверие → недоверие; instrumental after с. Trap: неверие = disbelief, lack of faith."},
{c:"neg",b:"ЧИСЛО",s:"На небе сияли ___ звёзды.",a:["бесчисленные"],d:["безчисленные","немногочисленные","нечисленные"],t:1,e:"бес- before the voiceless ч: бесчисленный = countless. Trap: немногочисленный = few in number."},
{c:"neg",b:"ЧЕСТНЫЙ",s:"Это была ___ игра: судья подсуживал хозяевам.",a:["нечестная"],d:["бесчестная","безчестная","нечестна"],t:1,e:"не- + честный → нечестный = unfair. Trap: бесчестный = dishonourable, disgraceful (a much stronger moral word)."},
{c:"neg",b:"ГРАМОТНЫЙ",s:"Письмо было написано ___: ошибка на ошибке.",a:["безграмотно","неграмотно"],d:["бесграмотно","разграмотно","грамотно"],e:"без- + грамотный → безграмотный, adverb безграмотно (неграмотно is also possible)."},
{c:"abs",b:"ГЕРОЙ",s:"Солдаты проявили настоящий ___.",a:["героизм"],d:["геройство","героичность","героиню"],t:1,e:"герой → героизм (-изм, masculine). Trap: геройство means the same but is neuter, so it would need настоящее."},
{c:"abs",b:"МАТЬ",s:"Она с радостью готовилась к ___.",a:["материнству"],d:["матерству","материнности","материи"],e:"мать → материнство (stem матер-); готовиться к + dative: к материнству."},
{c:"n2adj",b:"ГРАЖДАНИН",s:"В 2010 году он получил гражданство, а с ним и все ___ права.",a:["гражданские"],d:["гражданственные","гражданиновы","граждановые"],t:1,e:"гражданин → гражданский = civil (гражданские права). Trap: гражданственный = civic-minded, imbued with civic spirit."},
{c:"abs",b:"ЧЕЛОВЕК",s:"Это открытие изменило историю всего ___.",a:["человечества"],d:["человечности","человеков","человечины"],t:1,e:"человек → человечество = mankind; genitive: всего человечества. Trap: человечность = humaneness."},
{c:"abs",b:"ЧЕЛОВЕК",s:"Врач проявил удивительную ___ к пациентам.",a:["человечность"],d:["человечество","человечину","человечести"],t:1,e:"человечность = humaneness, compassion (-ость: quality). Человечество would mean mankind."},
{c:"abs",b:"ДЕТИ",s:"Я провёл ___ в маленьком городке.",a:["детство"],d:["детскость","деточство","детствие"],t:1,e:"дети → детство (-ств-о: a period or state). Trap: детскость = childishness."},
{c:"agent",b:"ЧИТАТЬ",s:"Журнал дорожит мнением своих ___.",a:["читателей"],d:["чтецов","читальщиков","читателям"],t:1,e:"читать → читатель (-тель); genitive plural: своих читателей. Trap: чтец = reciter, someone who reads aloud."},
{c:"agent",b:"ЛГАТЬ",s:"Не верь ему — он известный ___.",a:["лгун","лжец"],d:["лгатель","лгальщик","лжица"],e:"лгать → лгун (-ун) or лжец (г alternates with ж)."},
{c:"agent",b:"УЧИТЬ",s:"В конце года каждый ___ получил табель с оценками.",a:["ученик"],d:["учитель","учёный","учебник"],t:1,e:"Trap: ученик = pupil (the one who gets the marks); учитель = teacher; учёный = scientist; учебник = textbook."},
{c:"agent",b:"ЛЕТАТЬ",s:"Его отец был военным ___.",a:["лётчиком"],d:["летателем","летуном","лётчик"],t:1,e:"летать → лётчик (-чик); instrumental after был: лётчиком."},
{c:"agent",b:"СТРОИТЬ",s:"На стройке работают сорок ___.",a:["строителей"],d:["строителя","строителям","строевиков"],t:1,e:"строить → строитель; сорок takes the genitive plural: строителей."},
{c:"agent",b:"ПЕРЕВОДИТЬ",s:"Моя сестра работает ___ в посольстве.",a:["переводчицей","переводчиком"],d:["перевозчицей","переводительницей","переводящей"],t:1,e:"переводить → переводчик / переводчица; работать takes the instrumental. Trap: перевозчик = carrier (from перевозить)."},
{c:"agent",b:"СМОТРЕТЬ",s:"В зале было больше тысячи ___.",a:["зрителей"],d:["смотрителей","смотрельщиков","смотрящих"],t:1,e:"Trap: the spectator noun comes from the old root зр- (зреть): зритель. Смотритель = caretaker, warden."},
{c:"qual",b:"ВЗРЫВАТЬ",s:"Ночью раздался сильный ___.",a:["взрыв"],d:["взрывание","взрывник","взрывчатка"],e:"взрывать → взрыв (zero suffix: the result of the action)."},
{c:"qual",b:"УСПЕВАТЬ",s:"У сына хорошая ___ в школе.",a:["успеваемость"],d:["успешность","успех","успеваемостью"],t:1,e:"успевать → успеваемость = school performance. Trap: успех = success."},
{c:"qual",b:"РАСТИ",s:"В стране наблюдается ___ цен.",a:["рост"],d:["растение","вырост","растость"],t:1,e:"расти → рост = growth, rise. Trap: растение = plant."},
{c:"qual",b:"ПЕЧЬ",s:"К чаю подали домашнюю ___.",a:["выпечку"],d:["печку","печёнку","печенье"],t:1,e:"печь → выпечка = baked goods (result); accusative: выпечку. Traps: печка = stove; печёнка = liver; печенье is neuter and would need домашнее."}
];
D.de=[
{c:"n2adj",b:"KIND",s:"Sein ___ Verhalten in der Sitzung war peinlich.",a:["kindisches"],d:["kindliches","kindhaftes","kinderisches"],t:1,e:"Kind → kindisch (pejorative: immature). Trap: kindlich = childlike, innocent. Neuter after sein: kindisches."},
{c:"n2adj",b:"FREUND",s:"Die beiden Familien pflegen seit Jahren ___ Beziehungen.",a:["freundschaftliche"],d:["freundliche","freundige","befreundete"],t:1,e:"Freund → freundschaftlich (via Freundschaft) = amicable. Trap: freundlich = kind, polite (ein freundlicher Kellner)."},
{c:"n2adj",b:"GESCHÄFT",s:"Mein Mann ist diese Woche ___ in Berlin.",a:["geschäftlich"],d:["geschäftig","geschäftsmäßig","geschäftlicher"],t:1,e:"Geschäft → geschäftlich = on business. Trap: geschäftig = busy, bustling."},
{c:"n2adj",b:"WOLKE",s:"Morgen wird es ___ mit gelegentlichem Regen.",a:["bewölkt","wolkig"],d:["wolklich","gewölkt","wolkenhaft"],e:"Wolke → wolkig, or bewölkt (be- + umlaut + -t)."},
{c:"n2adj",b:"HOLZ",s:"Der Schauspieler wirkte steif und ___.",a:["hölzern"],d:["holzig","holzern","hölzig"],t:1,e:"Holz → hölzern (umlaut + -ern: wooden, figuratively stiff). Trap: holzig = woody, fibrous (holziger Spargel)."},
{c:"n2adj",b:"GOLD",s:"Sie trug einen ___ Ring.",a:["goldenen"],d:["goldigen","goldlichen","goldnenen"],t:1,e:"Gold → golden (-en: made of). Trap: goldig = cute. Masculine accusative: einen goldenen Ring."},
{c:"n2adj",b:"ZEIT",s:"Wir sind ___ leider sehr eingeschränkt.",a:["zeitlich"],d:["zeitig","zeitgemäß","zeitlos"],t:1,e:"Zeit → zeitlich = in terms of time. Traps: zeitig = early; zeitgemäß = up to date."},
{c:"n2adj",b:"SINN",s:"Es ist nicht ___, jetzt noch länger zu warten.",a:["sinnvoll"],d:["sinnlich","sinnig","sinnbar"],t:1,e:"Sinn → sinnvoll = sensible, meaningful. Trap: sinnlich = sensual, relating to the senses."},
{c:"n2adj",b:"WIRTSCHAFT",s:"Das neue Modell ist im Verbrauch sehr ___.",a:["wirtschaftlich"],d:["wirtschaftig","bewirtschaftet","wirtschaftsmäßig"],e:"Wirtschaft → wirtschaftlich = economical (also: economic)."},
{c:"adj2n",b:"EHRLICH",s:"Ich schätze an ihm vor allem seine ___.",a:["Ehrlichkeit"],d:["Ehrlichheit","Ehre","Ehrlichtum"],t:1,e:"Adjectives in -lich take -keit: Ehrlichkeit (never -heit)."},
{c:"adj2n",b:"WARM",s:"Die ___ des Ofens erfüllte das ganze Zimmer.",a:["Wärme"],d:["Warmheit","Wärmung","Warme"],t:1,e:"warm → Wärme (umlaut + -e). There is no *Warmheit."},
{c:"adj2n",b:"STARK",s:"Geduld ist seine größte ___.",a:["Stärke"],d:["Starkheit","Stärkung","Starke"],t:1,e:"stark → Stärke (umlaut + -e). Trap: Stärkung = strengthening (an action)."},
{c:"adj2n",b:"GENAU",s:"Diese Arbeit verlangt höchste ___.",a:["Genauigkeit"],d:["Genauheit","Genauung","Genausein"],e:"genau → Genauigkeit (-igkeit)."},
{c:"adj2n",b:"GROSS",s:"In welcher ___ brauchen Sie die Schuhe?",a:["Größe","Groesse"],d:["Großheit","Größung","Großigkeit"],e:"groß → Größe (umlaut + -e)."},
{c:"adj2n",b:"TIEF",s:"Der See hat eine ___ von vierzig Metern.",a:["Tiefe"],d:["Tiefheit","Vertiefung","Tiefung"],t:1,e:"tief → Tiefe (-e). Trap: Vertiefung = deepening, or a hollow."},
{c:"adj2n",b:"FAUL",s:"Seine ___ ist wirklich unerträglich.",a:["Faulheit"],d:["Fäulnis","Fäule","Faulkeit"],t:1,e:"faul → Faulheit = laziness. Trap: faul also means ‘rotten’, and Fäulnis = rot, decay."},
{c:"v2n",b:"ENTSCHEIDEN",s:"Wir müssen bald eine ___ treffen.",a:["Entscheidung"],d:["Entscheid","Entschiedenheit","Entscheidnis"],e:"entscheiden → Entscheidung (-ung). Set phrase: eine Entscheidung treffen. (Der Entscheid is masculine.)"},
{c:"v2n",b:"ANKOMMEN",s:"Die ___ des Zuges verzögert sich um zehn Minuten.",a:["Ankunft"],d:["Ankommung","Ankömmling","Ankommen"],t:1,e:"ankommen → Ankunft (irregular -kunft). Trap: das Ankommen is neuter, but die needs a feminine noun; Ankömmling = newcomer."},
{c:"v2n",b:"FAHREN",s:"Die ___ nach Hamburg dauert drei Stunden.",a:["Fahrt"],d:["Fahrung","Gefahr","Fähre"],t:1,e:"fahren → Fahrt (-t). Traps: Gefahr = danger; Fähre = ferry."},
{c:"v2n",b:"SEHEN",s:"Bei schlechter ___ bitte langsam fahren!",a:["Sicht"],d:["Sehung","Gesicht","Sehe"],t:1,e:"sehen → Sicht (vowel change + -t) = visibility. Trap: Gesicht = face."},
{c:"v2n",b:"GEBEN",s:"Sie hat eine besondere ___ für Sprachen.",a:["Gabe","Begabung"],d:["Gebung","Geber","Gift"],t:1,e:"geben → Gabe (vowel change) = gift, talent. Gift (poison) historically comes from geben too, but means something else today."},
{c:"v2n",b:"VERLIEREN",s:"Die Firma machte im letzten Jahr einen großen ___.",a:["Verlust"],d:["Verlierer","Verlierung","Verlies"],t:1,e:"verlieren → Verlust (irregular). Traps: Verlierer = loser; Verlies = dungeon."},
{c:"v2n",b:"STEIGEN",s:"Experten rechnen mit einem deutlichen ___ der Preise.",a:["Anstieg","Ansteigen"],d:["Steigung","Aufstieg","Steig"],t:1,e:"steigen → Anstieg (a rise in prices or figures). Traps: Steigung = gradient of a road; Aufstieg = ascent, promotion."},
{c:"v2n",b:"GEWINNEN",s:"Der ___ wird unter allen Mitarbeitern aufgeteilt.",a:["Gewinn"],d:["Gewinnung","Gewinner","Gewinnen"],t:1,e:"gewinnen → Gewinn (bare stem). Trap: Gewinnung = extraction (of raw materials)."},
{c:"v2n",b:"VERSTEHEN",s:"Ich habe vollstes ___ für Ihre Situation.",a:["Verständnis"],d:["Verstand","Verständigung","Verstehung"],t:1,e:"verstehen → Verständnis (-nis) = understanding, sympathy. Traps: Verstand = intellect; Verständigung = communication, agreement."},
{c:"v2n",b:"HELFEN",s:"Vielen Dank für Ihre ___!",a:["Hilfe"],d:["Helfung","Helfe","Helfer"],e:"helfen → Hilfe (e changes to i)."},
{c:"v2adj",b:"ESSEN",s:"Sind diese Pilze überhaupt ___?",a:["essbar"],d:["essig","esslich","gegessen"],e:"-bar = can be done: essbar = edible. (Essig = vinegar.)"},
{c:"v2adj",b:"LESEN",s:"Seine Handschrift ist kaum ___.",a:["leserlich","lesbar"],d:["lesig","lesend","gelesen"],e:"lesen → leserlich / lesbar = legible."},
{c:"v2adj",b:"VERSTEHEN",s:"Der Lehrer war sehr ___ und hörte mir geduldig zu.",a:["verständnisvoll"],d:["verständlich","verstehbar","verstanden"],t:1,e:"verständnisvoll = understanding (a person). Trap: verständlich = comprehensible (a text, a reaction)."},
{c:"v2adj",b:"VERGESSEN",s:"Mein Großvater wird immer ___.",a:["vergesslicher"],d:["vergesslich","vergessener","vergessbarer"],t:1,e:"vergessen → vergesslich; immer + comparative = more and more: immer vergesslicher."},
{c:"v2adj",b:"SPAREN",s:"Sie ist eine sehr ___ Person.",a:["sparsame"],d:["spärliche","sparbare","sparliche"],t:1,e:"sparen → sparsam (-sam). Trap: spärlich = scanty, sparse. Feminine after eine: sparsame."},
{c:"v2adj",b:"FÜRCHTEN",s:"Ein ___ Gewitter zog über das Dorf.",a:["furchtbares","fürchterliches"],d:["furchtsames","furchtliches","fürchtiges"],t:1,e:"fürchten → furchtbar / fürchterlich = terrible. Trap: furchtsam = timid, fearful (of a person)."},
{c:"v2adj",b:"ACHTEN",s:"Sei ___, wenn du die Straße überquerst!",a:["achtsam"],d:["achtbar","achtlos","geachtet"],t:1,e:"achten → achtsam = careful, attentive. Traps: achtbar = respectable; achtlos = careless."},
{c:"v2adj",b:"BRAUCHEN",s:"Ihr Vorschlag ist durchaus ___.",a:["brauchbar"],d:["bräuchlich","gebräuchlich","brauchsam"],t:1,e:"brauchen → brauchbar = usable, useful. Trap: gebräuchlich = common, customary (from Brauch)."},
{c:"adv",b:"GLÜCKLICH",s:"Bei dem Unfall wurde ___ niemand verletzt.",a:["glücklicherweise"],d:["glücklich","glücklicherweis","glückweise"],t:1,e:"glücklich → glücklicherweise (-erweise comments on the whole sentence). Trap: glücklich = happily, in a happy way."},
{c:"adv",b:"BEKANNT",s:"Rom wurde ___ nicht an einem Tag erbaut.",a:["bekanntlich","bekannterweise"],d:["bekanntweise","bekannt","bekanntes"],e:"bekannt → bekanntlich = as is well known."},
{c:"adv",b:"TEIL",s:"Das Projekt war nur ___ erfolgreich.",a:["teilweise"],d:["teilig","teilsweise","geteilt"],e:"der Teil → teilweise (-weise: partly, in parts)."},
{c:"adv",b:"ERSTAUNLICH",s:"Er hat ___ alle Prüfungen bestanden.",a:["erstaunlicherweise"],d:["erstaunlich","erstauntweise","erstaunterweise"],t:1,e:"erstaunlich → erstaunlicherweise = surprisingly (comments on the whole fact). Erstaunlich alone modifies an adjective (erstaunlich gut)."},
{c:"adv",b:"MORGEN",s:"Ich trinke ___ immer zwei Tassen Kaffee.",a:["morgens"],d:["morgen","morgendlich","morgenweise"],t:1,e:"der Morgen → morgens (-s: regularly, every morning). Traps: morgen = tomorrow; morgendlich is an adjective."},
{c:"adv",b:"BLIND",s:"Er vertraute ihr ___.",a:["blindlings","blind"],d:["blindweise","blindlich","geblendet"],e:"blind → blindlings (-lings: without looking, unquestioningly)."},
{c:"adv",b:"VERSEHEN",s:"Ich habe die Datei ___ gelöscht.",a:["versehentlich"],d:["versehens","versehenweise","versehbar"],e:"das Versehen → versehentlich = by mistake (= aus Versehen)."},
{c:"n2v",b:"ZWEIFEL",s:"Ich ___, dass er die Wahrheit sagt.",a:["bezweifle","bezweifele"],d:["zweifle","verzweifle","zweifele"],t:1,e:"Zweifel → bezweifeln (transitive, takes a dass-clause directly). Zweifeln would need daran: Ich zweifle daran, dass … Trap: verzweifeln = to despair."},
{c:"n2v",b:"GRUND",s:"Wie ___ Sie Ihre Entscheidung?",a:["begründen"],d:["gründen","ergründen","grundieren"],t:1,e:"Grund → begründen = to justify. Traps: gründen = to found (a company); ergründen = to get to the bottom of; grundieren = to prime (a wall)."},
{c:"n2v",b:"STAUB",s:"Ich muss heute noch die Regale ___.",a:["abstauben","entstauben"],d:["stauben","verstauben","bestäuben"],t:1,e:"Staub → abstauben / entstauben = to dust. Traps: verstauben = to gather dust; bestäuben = to pollinate."},
{c:"n2v",b:"FARBE",s:"Sie hat sich die Haare rot ___.",a:["gefärbt"],d:["gefarbt","verfärbt","gefarbet"],t:1,e:"Farbe → färben (umlaut); participle gefärbt. Trap: verfärben = to discolour."},
{c:"n2v",b:"TELEFON",s:"Ich habe gestern lange mit ihr ___.",a:["telefoniert"],d:["getelefoniert","telefont","telefonisiert"],t:1,e:"Telefon → telefonieren; -ieren verbs take no ge- in the participle."},
{c:"n2v",b:"WASSER",s:"Im Sommer muss man den Garten täglich ___.",a:["bewässern","wässern"],d:["verwässern","entwässern","wassern"],t:1,e:"Wasser → (be)wässern = to water. Traps: verwässern = to dilute; entwässern = to drain; wassern = to land on water."},
{c:"n2v",b:"FRÜHSTÜCK",s:"Am Wochenende ___ wir immer auf dem Balkon.",a:["frühstücken"],d:["frühstückieren","frühstücksen","befrühstücken"],e:"das Frühstück → frühstücken (noun stem + -en)."},
{c:"neg",b:"VERSTEHEN",s:"Sie haben mich leider völlig ___.",a:["missverstanden"],d:["gemissverstanden","misverstanden","unverstanden"],t:1,e:"miss- + verstehen → missverstehen; participle missverstanden (no ge-). Spelling: double s."},
{c:"neg",b:"ERFOLG",s:"Alle Rettungsversuche blieben ___.",a:["erfolglos"],d:["unerfolgreich","misserfolgt","erfolgsfrei"],e:"Erfolg → erfolglos (-los = without)."},
{c:"neg",b:"ORGANISIERT",s:"Das Team wirkt völlig ___.",a:["desorganisiert","unorganisiert"],d:["missorganisiert","inorganisiert","entorganisiert"],e:"des- (from French / Latin) + organisiert; unorganisiert is also used."},
{c:"neg",b:"TOLERANT",s:"Er reagiert sehr ___ auf andere Meinungen.",a:["intolerant"],d:["untolerant","misstolerant","imtolerant"],t:1,e:"Latin loanword adjectives take the Latin prefix in-: intolerant, not un-."},
{c:"neg",b:"TRAUEN",s:"Seit dem Vorfall ___ ich ihm.",a:["misstraue"],d:["vertraue","mistraue","entraue"],t:1,e:"miss- + trauen → misstrauen (+ dative). Trap: vertrauen is the opposite."},
{c:"neg",b:"GLÜCK",s:"Das Erdbeben war ein großes ___ für die Region.",a:["Unglück"],d:["Missglück","Glücklosigkeit","Unglücklichkeit"],e:"un- + Glück → Unglück = disaster, misfortune."},
{c:"neg",b:"BRAUCHEN",s:"Er hat ihr Vertrauen schamlos ___.",a:["missbraucht"],d:["gemissbraucht","verbraucht","unbraucht"],t:1,e:"missbrauchen; participle missbraucht (no ge-). Trap: verbrauchen = to use up."},
{c:"neg",b:"SINN",s:"Rede doch keinen ___!",a:["Unsinn"],d:["Missinn","Sinnlos","Unsinne"],e:"un- + Sinn → Unsinn = nonsense."},
{c:"abs",b:"MENSCH",s:"Völkermord ist ein Verbrechen gegen die ___.",a:["Menschlichkeit"],d:["Menschheit","Menschentum","Menschlichtum"],t:1,e:"Fixed legal term: Verbrechen gegen die Menschlichkeit (humanity as humane conduct). Trap: Menschheit = mankind."},
{c:"abs",b:"MENSCH",s:"Der Buchdruck veränderte die Geschichte der ___.",a:["Menschheit"],d:["Menschlichkeit","Menschenschaft","Menschtum"],t:1,e:"Menschheit = mankind (-heit as a collective)."},
{c:"abs",b:"EIGEN",s:"Geduld ist eine wichtige ___.",a:["Eigenschaft"],d:["Eigentum","Eigenung","Eigung"],t:1,e:"eigen → Eigenschaft = quality, characteristic. Trap: Eigentum = property."},
{c:"abs",b:"HELD",s:"Ihr ___ wurde mit einem Orden belohnt.",a:["Heldentum","Heldenmut"],d:["Heldheit","Heldschaft","Heldin"],e:"Held → Heldentum (-tum) or Heldenmut."},
{c:"abs",b:"WISSEN",s:"Die ___ hat darauf noch keine Antwort.",a:["Wissenschaft"],d:["Gewissen","Wissenheit","Wissentum"],t:1,e:"wissen → Wissenschaft (-schaft) = science. Trap: Gewissen = conscience."},
{c:"abs",b:"ARM",s:"In vielen Regionen herrscht noch große ___.",a:["Armut"],d:["Armheit","Ärmlichkeit","Armung"],e:"arm → Armut (the rare suffix -ut)."},
{c:"abs",b:"KIND",s:"Sie hatte eine glückliche ___.",a:["Kindheit"],d:["Kindschaft","Kindlichkeit","Kindtum"],e:"Kind → Kindheit (-heit: a period of life)."},
{c:"agent",b:"BACKEN",s:"Ich kaufe meine Brötchen immer beim ___ um die Ecke.",a:["Bäcker"],d:["Backer","Bäckerei","Backmann"],t:1,e:"backen → Bäcker (umlaut + -er). Trap: Bäckerei = the shop."},
{c:"agent",b:"FAHREN",s:"Die ___ wurden gebeten, den Zug zu verlassen.",a:["Fahrgäste"],d:["Fahrer","Fahrende","Fahrleute"],t:1,e:"der Fahrgast (plural Fahrgäste) = passenger. Trap: Fahrer = driver."},
{c:"agent",b:"FORSCHEN",s:"Die junge ___ erhielt einen internationalen Preis.",a:["Forscherin","Forschende"],d:["Forscher","Forschung","Forschin"],t:1,e:"forschen → Forscher → Forscherin: die junge needs the feminine form."},
{c:"agent",b:"LEITEN",s:"Der ___ der Abteilung ist im Urlaub.",a:["Leiter"],d:["Leitung","Leiterin","Geleit"],t:1,e:"leiten → Leiter (-er). Der needs the masculine; Leitung (management) is feminine."},
{c:"agent",b:"VERKAUFEN",s:"Die ___ im Laden war sehr freundlich.",a:["Verkäuferin"],d:["Verkäufer","Käuferin","Verkaufin"],t:1,e:"verkaufen → Verkäufer (umlaut!) → Verkäuferin. Trap: Käuferin = buyer."},
{c:"agent",b:"ARBEIT",s:"Der ___ muss den Lohn pünktlich überweisen.",a:["Arbeitgeber"],d:["Arbeitnehmer","Arbeitsgeber","Arbeiter"],t:1,e:"Arbeitgeber = employer (gives the work); Arbeitnehmer = employee (takes it). No linking -s."},
{c:"qual",b:"TRINKEN",s:"Welches ___ darf ich Ihnen bringen?",a:["Getränk"],d:["Trinkung","Getrinke","Trinkerei"],e:"trinken → Getränk (Ge- + vowel change): the product of the action."},
{c:"qual",b:"SCHLIESSEN",s:"Am ___ des Films weinten alle.",a:["Schluss","Schluß"],d:["Schließung","Schloss","Abschluss"],t:1,e:"schließen → Schluss = end. Traps: Schließung = closing down (of a shop); Schloss = lock, castle; Abschluss = degree, conclusion of a deal."},
{c:"qual",b:"ERGEBEN",s:"Das ___ der Wahl wurde um 22 Uhr bekannt gegeben.",a:["Ergebnis"],d:["Ergebung","Ergebenheit","Ergabe"],t:1,e:"ergeben → Ergebnis (-nis: result). Traps: Ergebung = submission; Ergebenheit = devotion."},
{c:"qual",b:"ERLAUBEN",s:"Hast du die ___ deiner Eltern?",a:["Erlaubnis"],d:["Erlaubung","Erlaubtheit","Urlaub"],t:1,e:"erlauben → Erlaubnis (-nis). Urlaub (holiday) is historically related."}
];

D.en=D.en.concat([
{c:"n2adj",b:"MONASTERY",s:"She led an almost ___ existence, rising at four and speaking to no one.",a:["monastic"],d:["monasterial","monasteric","monasteried"],t:1,e:"monastery → monastic: the adjective comes from the Greek stem monast-, not from the noun monastery."},
{c:"n2adj",b:"PARADOX",s:"It is ___ that the richest nations often save the least.",a:["paradoxical"],d:["paradoxal","paradoxic","paradoxous"],e:"paradox → paradoxical (-ical)."},
{c:"n2adj",b:"CATASTROPHE",s:"The decision had ___ consequences for the region.",a:["catastrophic"],d:["catastrophal","catastrophous","catastrophive"],e:"catastrophe → catastrophic (-ic); the final e drops."},
{c:"n2adj",b:"BUREAUCRACY",s:"Applicants complained of endless ___ obstacles.",a:["bureaucratic"],d:["bureaucracial","bureaucratical","bureaucrat"],e:"bureaucracy → bureaucratic: -cracy nouns form adjectives in -cratic (democracy → democratic)."},
{c:"n2adj",b:"AUTHORITY",s:"The regime was brutally ___, tolerating no dissent.",a:["authoritarian"],d:["authoritative","authorial","authoritive"],t:1,e:"Trap: authoritarian = demanding blind obedience; authoritative = reliable, commanding respect."},
{c:"n2adj",b:"AUTHORITY",s:"It remains the most ___ study of the subject ever published.",a:["authoritative"],d:["authoritarian","authorative","authoritive"],t:1,e:"authoritative = reliable and respected. Trap: ‘authorative’ is a frequent misspelling; authoritarian means tyrannical."},
{c:"n2adj",b:"SENSE",s:"Saving part of your salary each month is a ___ decision.",a:["sensible"],d:["sensitive","sensual","sensuous"],t:1,e:"Trap: sensible = reasonable; sensitive = easily affected; sensual / sensuous relate to the senses."},
{c:"n2adj",b:"SENSE",s:"The poem is rich in ___ imagery of colour, scent and texture.",a:["sensuous"],d:["sensible","sensitive","sensorious"],t:1,e:"sensuous = appealing to the senses aesthetically (sensual tends to imply physical or sexual pleasure)."},
{c:"n2adj",b:"CONTEMPT",s:"He dismissed the question with a ___ shrug.",a:["contemptuous"],d:["contemptible","contemptful","contempted"],t:1,e:"Trap: contemptuous = showing contempt; contemptible = deserving contempt."},
{c:"n2adj",b:"CONTEMPT",s:"Bullying those weaker than yourself is ___ behaviour.",a:["contemptible"],d:["contemptuous","contemptive","contemptful"],t:1,e:"contemptible = deserving contempt. Contemptuous describes the person who feels it."},
{c:"n2adj",b:"MOMENT",s:"The fall of the Berlin Wall was a ___ event.",a:["momentous"],d:["momentary","momental","momentive"],t:1,e:"Trap: momentous = of great importance; momentary = lasting a moment."},
{c:"n2adj",b:"MOMENT",s:"There was a ___ silence before the applause broke out.",a:["momentary"],d:["momentous","momental","momentic"],t:1,e:"momentary = very brief. Momentous would mean historically significant."},
{c:"n2adj",b:"INDUSTRY",s:"She was an ___ student who never missed a deadline.",a:["industrious"],d:["industrial","industried","industrous"],t:1,e:"Trap: industrious = hard-working; industrial = relating to industry."},
{c:"n2adj",b:"CLIMAX",s:"The ___ battle scene was filmed in the Moroccan desert.",a:["climactic"],d:["climatic","climaxic","climaxical"],t:1,e:"Trap: climactic (from climax) ≠ climatic (from climate)."},
{c:"n2adj",b:"CLIMATE",s:"Scientists study ___ fluctuations over millennia.",a:["climatic"],d:["climactic","climatal","climatous"],t:1,e:"climate → climatic. Climactic belongs to climax."},
{c:"n2adj",b:"NIGHT",s:"Owls are ___ birds, hunting mostly in darkness.",a:["nocturnal"],d:["nightly","noctural","nightish"],t:1,e:"night → nocturnal (Latin nox). Nightly = happening every night. Note the spelling: noct-urn-al."},
{c:"n2adj",b:"SUN",s:"The village is powered entirely by ___ energy.",a:["solar"],d:["sunny","sunly","sunnal"],t:1,e:"Learned Latin adjective: sun → solar (sol)."},
{c:"n2adj",b:"MOON",s:"Astronomers predicted a total ___ eclipse for March.",a:["lunar"],d:["moony","moonal","lunary"],t:1,e:"Learned Latin adjective: moon → lunar (luna)."},
{c:"n2adj",b:"CHURCH",s:"___ courts governed marriage and wills until the nineteenth century.",a:["ecclesiastical"],d:["churchish","churchal","churchical"],t:1,e:"church → ecclesiastical (Greek ekklēsia): the native noun borrows a classical adjective."},
{c:"n2adj",b:"BROTHER",s:"They are ___ twins, not identical ones.",a:["fraternal"],d:["brotherly","brothery","fraternial"],t:1,e:"Learned adjective: fraternal (Latin frater). Brotherly = kind, as a brother would be."},
{c:"n2adj",b:"FATHER",s:"Her ___ grandmother came from Galway.",a:["paternal"],d:["fatherly","fatherial","paternical"],t:1,e:"paternal = on the father's side. Fatherly = protective, kind."},
{c:"n2adj",b:"CITY",s:"___ sprawl is swallowing the surrounding farmland.",a:["urban"],d:["citied","cityish","civic"],t:1,e:"Learned adjective: city → urban (Latin urbs). Civic relates to citizens and municipal duty."},
{c:"n2adj",b:"NOSTALGIA",s:"The film is a ___ look back at the 1960s.",a:["nostalgic"],d:["nostalgical","nostalgous","nostalgiac"],e:"nostalgia → nostalgic (-ic)."},
{c:"n2adj",b:"IRONY",s:"It is ___ that the fire station burned down.",a:["ironic","ironical"],d:["ironious","ironish","ironly"],e:"irony → ironic (also ironical)."},
{c:"n2adj",b:"APOCALYPSE",s:"The novel offers bleak, ___ visions of the future.",a:["apocalyptic"],d:["apocalypsal","apocalypsic","apocalypsy"],e:"apocalypse → apocalyptic: s alternates with t before -ic (synopsis → synoptic)."},
{c:"n2adj",b:"HYPOCRISY",s:"It is ___ to preach thrift while living in luxury.",a:["hypocritical"],d:["hypocritic","hypocrisical","hypocritous"],e:"hypocrisy → hypocritical (via hypocrite)."},
{c:"n2adj",b:"MALICE",s:"The rumours were spread out of ___ intent.",a:["malicious"],d:["malicial","malicive","maliceful"],e:"malice → malicious (-ious)."},
{c:"n2adj",b:"GRACE",s:"Our ___ hostess made every guest feel welcome.",a:["gracious"],d:["graceful","graced","gracile"],t:1,e:"Trap: gracious = courteous, kind; graceful = elegant in movement."},
{c:"adj2n",b:"ANXIOUS",s:"His ___ grew as the deadline approached.",a:["anxiety","anxiousness"],d:["anxietude","anxiosity","anxiance"],t:1,e:"anxious → anxiety: -ous drops and the stem changes (anxi- + -ety)."},
{c:"adj2n",b:"GENEROUS",s:"We were touched by the ___ of strangers.",a:["generosity"],d:["generousity","generosness","generance"],t:1,e:"generous → generosity: the u of -ous disappears before -ity."},
{c:"adj2n",b:"CURIOUS",s:"Out of idle ___, she opened the drawer.",a:["curiosity"],d:["curiousity","curiosness","curiance"],t:1,e:"curious → curiosity: no u before -ity (a classic misspelling)."},
{c:"adj2n",b:"WARM",s:"We were moved by the ___ of their welcome.",a:["warmth"],d:["warmity","warmery","warmhood"],e:"warm → warmth (-th, as in grow → growth)."},
{c:"adj2n",b:"STRONG",s:"She lacked the ___ to lift the suitcase.",a:["strength"],d:["strongth","strongness","strengh"],t:1,e:"strong → strength: the vowel changes (o → e) before -th."},
{c:"adj2n",b:"WIDE",s:"Measure the ___ of the river at its narrowest point.",a:["width"],d:["wideth","widity","widance"],t:1,e:"wide → width: long i shortens before -th."},
{c:"adj2n",b:"HUMBLE",s:"He accepted the award with genuine ___.",a:["humility","humbleness"],d:["humiliation","humblety","humblity"],t:1,e:"humble → humility. Trap: humiliation = being humiliated."},
{c:"adj2n",b:"PRUDENT",s:"Financial ___ demands a reserve for emergencies.",a:["prudence"],d:["prudentness","prudition","prudentity"],e:"-ent adjectives give -ence nouns: prudent → prudence."},
{c:"adj2n",b:"DIFFIDENT",s:"Her ___ was often mistaken for arrogance.",a:["diffidence"],d:["diffidency","diffidentness","diffidation"],e:"diffident → diffidence (shyness, lack of self-confidence)."},
{c:"adj2n",b:"PERVERSE",s:"By sheer ___, he did the exact opposite of what was asked.",a:["perversity","perverseness"],d:["perversion","perversance","perversitude"],t:1,e:"perverse → perversity (wilful contrariness). Trap: perversion = distortion, deviant behaviour."},
{c:"adj2n",b:"CANDID",s:"I appreciate your ___, even if it stings.",a:["candour","candor","candidness"],d:["candidity","candidacy","candidance"],t:1,e:"candid → candour (AmE candor). Trap: candidacy = standing for election."},
{c:"adj2n",b:"CREDULOUS",s:"The swindler exploited the ___ of his victims.",a:["credulity","credulousness"],d:["credibility","credulance","credence"],t:1,e:"credulous → credulity (readiness to believe). Trap: credibility = being believable."},
{c:"adj2n",b:"ARDENT",s:"Nothing could dampen the ___ of his youthful convictions.",a:["ardour","ardor"],d:["ardition","ardentity","arduousness"],t:1,e:"ardent → ardour (AmE ardor). Trap: arduousness comes from arduous (difficult)."},
{c:"adj2n",b:"COMPLACENT",s:"After two easy victories, there is no room for ___.",a:["complacency","complacence"],d:["complaisance","complacentness","complacation"],t:1,e:"complacent → complacency. Trap: complaisance = willingness to please."},
{c:"adj2n",b:"PRECARIOUS",s:"The ___ of their position became clear after the election.",a:["precariousness","precarity"],d:["precariety","precarion","precariosity"],e:"precarious → precariousness (or the sociological term precarity)."},
{c:"adj2n",b:"PERTINENT",s:"The judge questioned the ___ of the evidence.",a:["pertinence","pertinency"],d:["pertinacity","pertinentness","pertinance"],t:1,e:"pertinent → pertinence (relevance). Trap: pertinacity = stubborn persistence."},
{c:"adj2n",b:"SOLEMN",s:"The ___ of the occasion silenced even the children.",a:["solemnity"],d:["solemness","solemnation","solemnhood"],t:1,e:"solemn → solemnity: the silent n is kept and pronounced before -ity."},
{c:"adj2n",b:"DESTITUTE",s:"The war left thousands of families in ___.",a:["destitution"],d:["destituteness","destitutity","destitence"],e:"destitute → destitution (-ion)."},
{c:"adj2n",b:"AMBIGUOUS",s:"The ___ of the wording allowed both sides to claim victory.",a:["ambiguity","ambiguousness"],d:["ambiguance","ambiguation","ambiguitude"],e:"ambiguous → ambiguity (-ous → -ity)."},
{c:"adj2n",b:"FRIVOLOUS",s:"The ___ of the debate irritated the serious members.",a:["frivolity","frivolousness"],d:["frivolation","frivolance","frivolism"],e:"frivolous → frivolity."},
{c:"adj2n",b:"INEPT",s:"The ___ of the management was staggering.",a:["ineptitude","ineptness"],d:["ineptity","ineptance","inepticity"],e:"inept → ineptitude (-itude, like apt → aptitude)."},
{c:"adj2n",b:"APATHETIC",s:"Voter ___ is a growing concern in many democracies.",a:["apathy"],d:["apatheticness","apathism","apathetism"],t:1,e:"Back-formation: apathetic → apathy (the noun is the shorter form)."},
{c:"adj2n",b:"JUST",s:"The verdict offended every sense of ___.",a:["justice"],d:["justness","justification","justity"],t:1,e:"just → justice. Trap: justification = a reason given for something."},
{c:"adj2n",b:"ABUNDANT",s:"Fruit grew there in ___.",a:["abundance"],d:["abundantness","abundation","abundity"],e:"-ant adjectives give -ance nouns: abundant → abundance."},
{c:"v2n",b:"ABOLISH",s:"She campaigned for the ___ of the death penalty.",a:["abolition","abolishment"],d:["abolision","abolation","abolishance"],e:"abolish → abolition (abolishment also exists)."},
{c:"v2n",b:"ADMIT",s:"___ to the university is highly competitive.",a:["admission"],d:["admittance","admitting","admittal"],t:1,e:"Trap: admission = being accepted (to a school, a club); admittance = physical permission to enter (No admittance)."},
{c:"v2n",b:"EXPLAIN",s:"No ___ was given for the delay.",a:["explanation"],d:["explaination","explainment","explainage"],t:1,e:"explain → explanation: the i of the verb disappears (a frequent misspelling)."},
{c:"v2n",b:"PRONOUNCE",s:"Her French ___ is impeccable.",a:["pronunciation"],d:["pronounciation","pronouncement","pronouncing"],t:1,e:"pronounce → pronunciation: ou becomes u. Trap: a pronouncement is an official statement."},
{c:"v2n",b:"MAINTAIN",s:"The old building requires constant ___.",a:["maintenance"],d:["maintainance","maintainment","maintenence"],t:1,e:"maintain → maintenance: -ai- becomes -e-, ending -ance."},
{c:"v2n",b:"RENOUNCE",s:"His ___ of worldly goods astonished his family.",a:["renunciation","renouncement"],d:["renounciation","renouncal","renunciance"],t:1,e:"renounce → renunciation (ou → u, like pronounce → pronunciation)."},
{c:"v2n",b:"REVOKE",s:"The court ordered the ___ of his licence.",a:["revocation"],d:["revokement","revokation","revocance"],t:1,e:"revoke → revocation: k becomes c before -ation (invoke → invocation)."},
{c:"v2n",b:"PROVOKE",s:"He would react violently at the slightest ___.",a:["provocation"],d:["provokation","provokement","provocance"],t:1,e:"provoke → provocation (k → c)."},
{c:"v2n",b:"RECEIVE",s:"Please keep your ___ as proof of purchase.",a:["receipt"],d:["reception","receival","receiption"],t:1,e:"Trap: receipt = proof of payment; reception = welcome, or the front desk. Note the silent p."},
{c:"v2n",b:"PROCEED",s:"All ___ from the concert will go to charity.",a:["proceeds"],d:["procedures","proceedings","processes"],t:1,e:"proceeds (plural) = money raised. Traps: procedures = methods; proceedings = legal action or minutes."},
{c:"v2n",b:"DEFER",s:"Out of ___ to her age, they let her speak first.",a:["deference"],d:["deferral","deferment","deferrance"],t:1,e:"Trap: deference = respect; deferral / deferment = postponement."},
{c:"v2n",b:"SUBSIST",s:"Most farmers there live at ___ level.",a:["subsistence"],d:["subsistance","subsistment","subsistency"],t:1,e:"subsist → subsistence: -ence, not -ance."},
{c:"v2n",b:"ALLEVIATE",s:"The charity works towards the ___ of rural poverty.",a:["alleviation"],d:["alleviance","alleviment","alleviating"],e:"alleviate → alleviation (-ate → -ation)."},
{c:"v2n",b:"DISPENSE",s:"He needed a special ___ from the Pope to marry his cousin.",a:["dispensation"],d:["dispensary","dispensal","dispensement"],t:1,e:"dispense → dispensation (exemption). Trap: a dispensary is a place where medicine is given out."},
{c:"v2n",b:"AMEND",s:"He invoked the Fifth ___ and refused to answer.",a:["Amendment","amendment"],d:["amends","amendation","amendance"],t:1,e:"amend → amendment. Trap: to make amends = to compensate for a wrong."},
{c:"v2n",b:"CONCEDE",s:"The government refused to make any ___.",a:["concessions","concession"],d:["concedences","concedements","concedations"],e:"concede → concession: -cede verbs form nouns in -cession."},
{c:"v2n",b:"ACCEDE",s:"The Queen's ___ to the throne took place in 1952.",a:["accession"],d:["access","accedence","accedement"],t:1,e:"accede → accession (coming to the throne). Trap: access = the right or means of entry."},
{c:"v2n",b:"INSINUATE",s:"I deeply resent your ___!",a:["insinuations","insinuation"],d:["insinuances","insinuments","insinuities"],e:"insinuate → insinuation (-ate → -ation)."},
{c:"v2n",b:"PERSUADE",s:"No amount of ___ would change her mind.",a:["persuasion"],d:["persuadement","persuasal","persuadence"],t:1,e:"persuade → persuasion: d becomes s before -ion."},
{c:"v2n",b:"DESCEND",s:"He is a man of Irish ___.",a:["descent"],d:["descendant","descension","descendance"],t:1,e:"descend → descent (ancestry). Trap: a descendant is a person."},
{c:"v2n",b:"ASCEND",s:"It was the first ___ of Everest without oxygen.",a:["ascent"],d:["ascension","ascendance","ascendment"],t:1,e:"ascend → ascent (a climb). Trap: ascension = rising to heaven or to power."},
{c:"v2n",b:"CONSPIRE",s:"He was convicted of ___ to defraud the bank.",a:["conspiracy"],d:["conspiration","conspirement","conspirator"],e:"conspire → conspiracy (-acy)."},
{c:"v2n",b:"DELIBERATE",s:"After lengthy ___, the jury reached a verdict.",a:["deliberation","deliberations"],d:["deliberateness","deliberance","delibering"],t:1,e:"deliberate (verb) → deliberation. Trap: deliberateness comes from the adjective (intentional)."},
{c:"v2n",b:"INTERFERE",s:"The broadcast suffered from electrical ___.",a:["interference"],d:["interferance","interferment","interfering"],t:1,e:"interfere → interference: -ence, not -ance."},
{c:"v2n",b:"REFUTE",s:"Her article was a devastating ___ of his theory.",a:["refutation"],d:["refusal","refutal","refutement"],t:1,e:"refute → refutation (proof that something is false). Trap: refusal comes from refuse."},
{c:"v2n",b:"ABSTAIN",s:"There were twelve votes in favour and three ___.",a:["abstentions"],d:["abstinences","abstainments","abstainings"],t:1,e:"Trap: abstention = not voting; abstinence = refraining from pleasures (alcohol, sex)."},
{c:"v2n",b:"WITHDRAW",s:"The treaty required the ___ of all foreign troops.",a:["withdrawal"],d:["withdrawment","withdrawance","withdrawing"],e:"withdraw → withdrawal (-al)."},
{c:"v2n",b:"SUCCEED",s:"She is third in the line of ___ to the throne.",a:["succession"],d:["success","successiveness","succeedence"],t:1,e:"Trap: succeed has two nouns — success (achievement) and succession (following someone)."},
{c:"v2adj",b:"AVOID",s:"The accident was entirely ___.",a:["avoidable"],d:["avoidant","avoiding","avoidful"],t:1,e:"avoid → avoidable (-able). Avoidant is a psychological term."},
{c:"v2adj",b:"PREFER",s:"Silence is ___ to a lie.",a:["preferable"],d:["preferential","preferrable","preferred"],t:1,e:"prefer → preferable: one r (stress moves to the first syllable). Preferential = giving advantage."},
{c:"v2adj",b:"DEPEND",s:"He is a ___ friend who never lets you down.",a:["dependable"],d:["dependent","dependant","depending"],t:1,e:"dependable = reliable. Trap: dependent = relying on something."},
{c:"v2adj",b:"DEPEND",s:"The island is heavily ___ on tourism.",a:["dependent"],d:["dependable","dependant","depending"],t:1,e:"Adjective: dependent (-ent). In British English dependant is the noun (a person who depends on you)."},
{c:"v2adj",b:"REGRET",s:"It is ___ that no agreement was reached.",a:["regrettable"],d:["regretful","regretable","regretting"],t:1,e:"Trap: regrettable = to be regretted (a situation); regretful = feeling regret (a person). Double t."},
{c:"v2adj",b:"REGRET",s:"He gave her a ___ smile as the train pulled away.",a:["regretful"],d:["regrettable","regretive","regretted"],t:1,e:"regretful = showing regret (a person, a look)."},
{c:"v2adj",b:"ENVY",s:"She holds an ___ position in the firm.",a:["enviable"],d:["envious","envyable","envying"],t:1,e:"Trap: enviable = worth envying; envious = feeling envy. y → i before -able."},
{c:"v2adj",b:"ENVY",s:"He was openly ___ of his brother's success.",a:["envious"],d:["enviable","envied","envyful"],t:1,e:"envious = feeling envy (of a person)."},
{c:"v2adj",b:"DECEIVE",s:"Appearances can be ___.",a:["deceptive","deceiving"],d:["deceivable","deceptious","deceitive"],e:"deceive → deceptive (-ceive → -ceptive, like receive → receptive)."},
{c:"v2adj",b:"DEFEND",s:"Morally, his position was simply not ___.",a:["defensible","defendable"],d:["defensive","defending","defensory"],t:1,e:"Trap: defensible = able to be justified; defensive = protecting oneself, touchy."},
{c:"v2adj",b:"DEFEND",s:"She became ___ whenever anyone asked about the money.",a:["defensive"],d:["defensible","defending","defensory"],t:1,e:"defensive = reacting as if attacked."},
{c:"v2adj",b:"IMPRESS",s:"Teenagers are highly ___ and easily led.",a:["impressionable"],d:["impressive","impressed","impressional"],t:1,e:"Trap: impressionable = easily influenced; impressive = admirable."},
{c:"v2adj",b:"FORGET",s:"My grandfather has become rather ___.",a:["forgetful"],d:["forgettable","forgotten","forgetting"],t:1,e:"Trap: forgetful = often forgetting; forgettable = easily forgotten (a film)."},
{c:"v2adj",b:"ADMIRE",s:"Her composure under pressure was ___.",a:["admirable"],d:["admiring","admirative","admired"],t:1,e:"admirable = deserving admiration. Admiring describes the person who admires."},
{c:"v2adj",b:"COMPARE",s:"Salaries here are ___ to those in London.",a:["comparable"],d:["comparative","comparing","compared"],t:1,e:"Trap: comparable = similar; comparative = involving comparison (comparative literature). Stress: COMparable."},
{c:"v2adj",b:"CREDIT",s:"Despite her injury, she gave a ___ performance.",a:["creditable"],d:["credible","credulous","credited"],t:1,e:"Trap: creditable = deserving praise; credible = believable; credulous = gullible."},
{c:"v2adj",b:"DESPISE",s:"Abandoning the wounded was a ___ act of cowardice.",a:["despicable"],d:["despisive","despising","despicious"],t:1,e:"despise → despicable: the adjective uses the Latin stem despic-."},
{c:"v2adj",b:"TOLERATE",s:"By the third day the pain was barely ___.",a:["tolerable"],d:["tolerant","tolerating","tolerative"],t:1,e:"Trap: tolerable = bearable; tolerant = accepting of others."},
{c:"v2adj",b:"OBSERVE",s:"An ___ guard noticed the open window.",a:["observant"],d:["observable","observational","observative"],t:1,e:"Trap: observant = quick to notice (a person); observable = able to be seen."},
{c:"v2adj",b:"CONTEMPLATE",s:"She sat in ___ silence by the sea.",a:["contemplative"],d:["contemplatory","contemplable","contemplating"],e:"contemplate → contemplative (-ate → -ative)."},
{c:"v2adj",b:"PROVOKE",s:"It was a deliberately ___ remark.",a:["provocative"],d:["provokative","provocable","provocant"],t:1,e:"provoke → provocative: k becomes c."},
{c:"v2adj",b:"HABIT",s:"He is a ___ liar; nobody believes him any more.",a:["habitual"],d:["habitable","habited","habitous"],t:1,e:"habit → habitual. Trap: habitable = fit to live in."},
{c:"v2adj",b:"INVENT",s:"She is an ___ chef who loves surprising her guests.",a:["inventive"],d:["inventory","inventable","invented"],t:1,e:"invent → inventive (creative). Trap: inventory is a noun (a list of stock)."},
{c:"v2adj",b:"PRESUME",s:"It would be ___ of me to give you advice.",a:["presumptuous"],d:["presumptive","presumable","presumptious"],t:1,e:"Trap: presumptuous = overstepping limits; presumptive = based on presumption (heir presumptive). Spelling: -ptuous."},
{c:"v2adj",b:"RESENT",s:"A ___ silence settled over the table.",a:["resentful"],d:["resentive","resentable","resenting"],e:"resent → resentful (-ful)."},
{c:"adv",b:"ECONOMIC",s:"The scheme targets ___ deprived areas.",a:["economically"],d:["economicly","economicaly","economical"],e:"-ic adjectives take -ally: economically."},
{c:"adv",b:"FRANTIC",s:"She searched ___ for her passport.",a:["frantically","franticly"],d:["franticaly","frantical","frantic"],e:"frantic → frantically (-ally)."},
{c:"adv",b:"SUBTLE",s:"She ___ changed the subject.",a:["subtly"],d:["subtlely","subtley","subtilly"],t:1,e:"Adjectives in -le replace e with y: subtle → subtly."},
{c:"adv",b:"GENTLE",s:"He ___ lifted the injured bird.",a:["gently"],d:["gentlely","gentily","gentle"],t:1,e:"-le → -ly: gentle → gently."},
{c:"adv",b:"ABLE",s:"The minister was ___ assisted by her deputy.",a:["ably"],d:["ablely","abley","abily"],t:1,e:"-le → -ly: able → ably."},
{c:"adv",b:"FULL",s:"I am ___ aware of the risks.",a:["fully"],d:["fullly","fuly","fulsomely"],t:1,e:"full → fully (no triple l). Trap: fulsomely = excessively, insincerely."},
{c:"adv",b:"SHY",s:"He smiled ___ and looked away.",a:["shyly","shily"],d:["shyely","shyily","shilly"],t:1,e:"One-syllable adjectives in -y usually keep the y: shyly."},
{c:"adv",b:"DRY",s:"‘How original,’ she remarked ___.",a:["drily","dryly"],d:["dryily","driely","dryely"],e:"dry → drily (BrE) or dryly (AmE)."},
{c:"adv",b:"DAY",s:"The newspaper is published ___.",a:["daily"],d:["dayly","dailly","dayily"],t:1,e:"day → daily: the y becomes i."},
{c:"adv",b:"NEAR",s:"I ___ missed the last train.",a:["nearly"],d:["near","nearby","nearlily"],t:1,e:"Trap: nearly = almost. Near is about distance."},
{c:"adv",b:"HIGH",s:"She is a ___ respected scholar.",a:["highly"],d:["high","highely","hightly"],t:1,e:"Trap: highly = very, to a great degree. High is about physical height (fly high)."},
{c:"adv",b:"DEEP",s:"I was ___ moved by his speech.",a:["deeply"],d:["deep","deeperly","deepily"],t:1,e:"deeply = intensely (figurative). Deep is used for physical depth (dig deep)."},
{c:"adv",b:"FREE",s:"You may speak ___ — nothing will leave this room.",a:["freely"],d:["free","freedly","freelly"],t:1,e:"Trap: freely = without restraint; free = without charge (children travel free)."},
{c:"adv",b:"SHORT",s:"The director will be with you ___.",a:["shortly"],d:["short","shortily","shortlily"],t:1,e:"Trap: shortly = soon. Short as an adverb means abruptly (stop short)."},
{c:"adv",b:"MOST",s:"The audience consisted ___ of students.",a:["mostly"],d:["most","mostily","mostlily"],t:1,e:"mostly = mainly. Most is a superlative."},
{c:"adv",b:"WRONG",s:"He was ___ accused of theft.",a:["wrongly","wrongfully"],d:["wrong","wrongedly","wronglily"],t:1,e:"wrongly / wrongfully before a participle; wrong is used after the verb (you've spelt it wrong)."},
{c:"adv",b:"GRATUITOUS",s:"Critics called it a ___ violent film.",a:["gratuitously"],d:["gratuitly","gratuitiously","gratitudinously"],e:"gratuitous → gratuitously."},
{c:"adv",b:"PERFUNCTORY",s:"She ___ glanced at the report and signed it.",a:["perfunctorily"],d:["perfunctorly","perfunctoryly","perfunctorally"],t:1,e:"-ory → -orily: the y becomes i before -ly."},
{c:"adv",b:"CURSORY",s:"He ___ examined the documents.",a:["cursorily"],d:["cursoryly","cursorly","cursively"],t:1,e:"cursory → cursorily. Trap: cursively = in joined-up handwriting."},

D.en=D.en.concat([

D.fr=D.fr.concat([

{c:"n2adj",b:"PAPE",s:"La bulle ___ condamnait ces thèses.",a:["papale"],d:["papiste","papesque","papelle"],t:1,e:"pape → papal(e). Piège : papiste est un terme polémique désignant les catholiques."},
{c:"n2adj",b:"ÉVÊQUE",s:"Le palais ___ abrite aujourd'hui un musée.",a:["épiscopal"],d:["évêcal","évêquien","épiscopien"],t:1,e:"évêque → épiscopal (radical savant, grec episkopos)."},
{c:"n2adj",b:"MER",s:"Le commerce ___ a fait la fortune de Saint-Malo.",a:["maritime"],d:["marin","mérin","marinier"],t:1,e:"Piège : maritime = relatif à la navigation, au commerce par mer ; marin = qui vient de la mer (sel marin, courants marins)."},
{c:"n2adj",b:"MER",s:"Préférez le sel ___ au sel gemme.",a:["marin"],d:["maritime","marial","mérique"],t:1,e:"marin = qui provient de la mer. Piège : marial = relatif à la Vierge Marie."},
{c:"n2adj",b:"CIEL",s:"Il contemplait la voûte ___.",a:["céleste"],d:["célestin","cieleux","ciélique"],t:1,e:"ciel → céleste (latin caelum). Piège : un célestin est un moine."},
{c:"n2adj",b:"TERRE",s:"Le globe ___ se réchauffe à un rythme inédit.",a:["terrestre"],d:["terrien","terreux","terral"],t:1,e:"terre → terrestre. Pièges : terrien = qui possède des terres (propriétaire terrien) ; terreux = sali de terre."},
{c:"n2adj",b:"EAU",s:"Le nénuphar est une plante ___.",a:["aquatique"],d:["aqueuse","aquifère","eauvière"],t:1,e:"eau → aquatique (latin aqua). Pièges : aqueux = qui contient de l'eau ; aquifère = qui contient une nappe d'eau."},
{c:"n2adj",b:"FEU",s:"Le basalte est une roche ___.",a:["ignée"],d:["ignifugée","enflammée","feuée"],t:1,e:"feu → igné(e) (latin ignis) : formé par le feu. Piège : ignifugé = rendu ininflammable."},
{c:"n2adj",b:"LAIT",s:"Par une nuit claire, on distingue la Voie ___.",a:["lactée"],d:["laitière","laiteuse","lactique"],t:1,e:"lait → lacté (latin lac, lactis). Pièges : laitier = du lait (produits laitiers) ; laiteux = blanc comme le lait."},
{c:"n2adj",b:"SANG",s:"Quel est votre groupe ___ ?",a:["sanguin"],d:["sanglant","sanguinaire","sangin"],t:1,e:"sang → sanguin. Pièges : sanglant = couvert de sang ; sanguinaire = qui aime verser le sang."},
{c:"n2adj",b:"CŒUR",s:"Il a été victime d'un arrêt ___.",a:["cardiaque"],d:["cordial","cœurique","cardial"],t:1,e:"cœur → cardiaque (grec kardia). Piège : cordial (latin cor) = chaleureux."},
{c:"n2adj",b:"FOIE",s:"Il souffre d'une insuffisance ___.",a:["hépatique"],d:["foiesque","foiale","hépatal"],t:1,e:"foie → hépatique (grec hêpar)."},
{c:"n2adj",b:"POUMON",s:"Elle est morte d'une embolie ___.",a:["pulmonaire"],d:["poumonaire","pulmonique","poumonienne"],t:1,e:"poumon → pulmonaire (latin pulmo)."},
{c:"n2adj",b:"DOS",s:"La nageoire ___ du requin fendait l'eau.",a:["dorsale"],d:["dossale","dossière","dorsienne"],t:1,e:"dos → dorsal(e) (latin dorsum)."},
{c:"n2adj",b:"MAIN",s:"Il préfère le travail ___ au travail de bureau.",a:["manuel"],d:["mainuel","maniable","manier"],t:1,e:"main → manuel (latin manus). Piège : maniable = facile à manier."},
{c:"n2adj",b:"PÈRE",s:"Il ne supportait plus l'autorité ___.",a:["paternelle"],d:["pèrale","paterne","pératique"],t:1,e:"père → paternel(le) (latin pater). Paterne (littéraire) = bienveillant et condescendant."},
{c:"n2adj",b:"MÈRE",s:"Le russe est sa langue ___.",a:["maternelle"],d:["mérale","matricielle","maternante"],t:1,e:"mère → maternel(le). La langue maternelle."},
{c:"n2adj",b:"ENFANT",s:"Ce jeu est d'une simplicité ___.",a:["enfantine"],d:["infantile","enfanteuse","enfantée"],t:1,e:"Piège : enfantin = propre à l'enfance, très simple ; infantile = péjoratif (comportement infantile) ou médical (mortalité infantile)."},
{c:"n2adj",b:"ÉCOLE",s:"L'année ___ commence en septembre.",a:["scolaire"],d:["écolière","scolastique","écolale"],t:1,e:"école → scolaire (latin schola). Piège : la scolastique est la philosophie médiévale."},
{c:"n2adj",b:"LIVRE",s:"On lui reprochait un savoir purement ___.",a:["livresque"],d:["livreux","livrable","librairique"],t:1,e:"livre → livresque (péjoratif : acquis dans les livres seulement). Piège : livrable = qui peut être livré."},
{c:"n2adj",b:"MONDE",s:"Elle ne manquait aucune soirée ___.",a:["mondaine"],d:["mondiale","mondaire","mondialisée"],t:1,e:"Piège : mondain = de la haute société ; mondial = qui concerne le monde entier."},
{c:"n2adj",b:"MONDE",s:"La Seconde Guerre ___ a fait plus de soixante millions de morts.",a:["mondiale"],d:["mondaine","mondière","mondialiste"],t:1,e:"mondial = à l'échelle du monde entier."},
{c:"n2adj",b:"FÊTE",s:"Il régnait une ambiance ___.",a:["festive"],d:["fêtarde","fêteuse","festivalière"],t:1,e:"fête → festif, festive (latin festum). Fêtard est familier et désigne une personne."},
{c:"n2adj",b:"DIMANCHE",s:"La loi garantit le repos ___.",a:["dominical"],d:["dimanchier","dominicain","dimanchal"],t:1,e:"dimanche → dominical (latin dies dominicus). Piège : dominicain = de l'ordre de saint Dominique."},
{c:"n2adj",b:"SEMAINE",s:"La réunion ___ a lieu le lundi.",a:["hebdomadaire"],d:["semainière","semainale","hebdomaire"],t:1,e:"semaine → hebdomadaire (grec hebdomas)."},
{c:"n2adj",b:"MOIS",s:"Son salaire ___ ne suffit pas à payer le loyer.",a:["mensuel"],d:["menstruel","moisuel","mensual"],t:1,e:"mois → mensuel (latin mensis). Piège : menstruel = relatif aux règles."},
{c:"n2adj",b:"AN",s:"Le rapport ___ sera publié en juin.",a:["annuel"],d:["annal","anniversaire","annéal"],t:1,e:"an → annuel (latin annus). Les annales (n. f. pl.) sont des chroniques."},
{c:"n2adj",b:"GUERRE",s:"Ses discours ___ inquiétaient les pays voisins.",a:["belliqueux","guerriers"],d:["belligérants","guerreux","guerroyants"],t:1,e:"guerre → belliqueux (latin bellum) ou guerrier. Piège : belligérant = qui est officiellement en guerre."},
{c:"n2adj",b:"CERVEAU",s:"Les échecs exigent une intense activité ___.",a:["cérébrale"],d:["cerébrale","cervelleuse","cerveauale"],t:1,e:"cerveau → cérébral(e) (latin cerebrum). Attention aux deux accents aigus."},
{c:"n2adj",b:"HÉROS",s:"Ce fut un acte ___.",a:["héroïque"],d:["héroïsé","héroal","héroïsant"],e:"héros → héroïque (tréma sur le ï)."},
{c:"adj2n",b:"FRANC",s:"Je vous remercie de votre ___.",a:["franchise"],d:["francité","franquise","francheté"],e:"franc → franchise (sur le féminin franche + -ise)."},
{c:"adj2n",b:"PROPRE",s:"La ___ des rues laisse à désirer.",a:["propreté"],d:["propriété","propresse","propriesse"],t:1,e:"Piège : propre (net) → propreté ; propre (à soi) → propriété."},
{c:"adj2n",b:"AVARE",s:"Son ___ était légendaire.",a:["avarice"],d:["avareté","avaresse","avarie"],t:1,e:"avare → avarice (féminin : « son » s'emploie devant voyelle). Piège : avarie = dommage subi par un navire."},
{c:"adj2n",b:"GRAVE",s:"Il n'a pas mesuré la ___ de la situation.",a:["gravité"],d:["graveté","gravure","gravesse"],t:1,e:"grave → gravité (-ité). Piège : gravure = image gravée."},
{c:"adj2n",b:"VIEUX",s:"Il souffrait des maux de la ___.",a:["vieillesse"],d:["vieillerie","vieillissement","vieuxté"],t:1,e:"vieux → vieillesse (radical vieill-). Pièges : vieillerie = objet usé ; vieillissement = processus."},
{c:"adj2n",b:"LENT",s:"La ___ de l'administration exaspère les usagers.",a:["lenteur"],d:["lenteté","lentesse","lentitude"],e:"lent → lenteur (-eur)."},
{c:"adj2n",b:"PÂLE",s:"Sa ___ inquiéta le médecin.",a:["pâleur"],d:["pâlesse","pâleté","pâlitude"],e:"pâle → pâleur (féminin)."},
{c:"adj2n",b:"MÉCHANT",s:"Il a agi par pure ___.",a:["méchanceté"],d:["méchantise","méchantesse","méchanceur"],e:"méchant → méchanceté (-ceté)."},
{c:"adj2n",b:"SOT",s:"Arrête de dire des ___ !",a:["sottises"],d:["sotises","sotteries","sottesses"],t:1,e:"sot → sottise (double t, sur le féminin sotte)."},
{c:"adj2n",b:"BÊTE",s:"J'ai fait une ___ en signant ce contrat.",a:["bêtise"],d:["bestialité","bêteté","bêterie"],t:1,e:"bête → bêtise. Piège : bestialité = caractère animal, brutal."},
{c:"adj2n",b:"SAGE",s:"Elle a agi avec ___.",a:["sagesse"],d:["sagacité","sageté","sagerie"],t:1,e:"sage → sagesse. Piège : sagacité = perspicacité (de sagace)."},
{c:"adj2n",b:"HARDI",s:"Il eut la ___ de contredire le roi.",a:["hardiesse"],d:["hardiment","hardité","harditude"],t:1,e:"hardi → hardiesse (-esse). Piège : hardiment est l'adverbe."},
{c:"adj2n",b:"PARESSEUX",s:"La ___ est un des sept péchés capitaux.",a:["paresse"],d:["paresseté","paressité","paresseuserie"],t:1,e:"Dérivation inverse : le nom paresse est plus court que l'adjectif paresseux."},
{c:"adj2n",b:"CLAIR",s:"La ___ de son exposé a convaincu le jury.",a:["clarté"],d:["clairté","clairière","clairesse"],t:1,e:"clair → clarté (radical savant clar-). Piège : clairière = espace dégagé dans un bois."},
{c:"adj2n",b:"CHER",s:"La ___ de la vie pèse sur les ménages.",a:["cherté"],d:["chèreté","chéreté","cherrité"],t:1,e:"cher → cherté (sans accent)."},
{c:"adj2n",b:"CHAUD",s:"La ___ était accablante.",a:["chaleur"],d:["chaudeur","chaudière","chaudesse"],t:1,e:"chaud → chaleur (radical latin cal-). Piège : chaudière = appareil de chauffage."},
{c:"adj2n",b:"FROID",s:"Il m'accueillit avec une ___ glaciale.",a:["froideur"],d:["froidure","froideté","froidesse"],t:1,e:"Piège : froideur = manque de chaleur humaine ; froidure (littéraire) = froid de la saison."},
{c:"adj2n",b:"VIF",s:"Tout le monde admirait la ___ de son esprit.",a:["vivacité"],d:["viveté","vifté","vivacie"],t:1,e:"vif → vivacité (radical savant vivac-)."},
{c:"adj2n",b:"BREF",s:"La ___ de la vie inspire les poètes.",a:["brièveté"],d:["brefté","brèveté","briéveté"],t:1,e:"bref → brièveté (comme brièvement)."},
{c:"adj2n",b:"SEC",s:"Une ___ exceptionnelle a ruiné les récoltes.",a:["sécheresse"],d:["séchage","sèchesse","secté"],t:1,e:"sec → sécheresse (sur le féminin sèche). Piège : séchage = action de sécher."},
{c:"adj2n",b:"GROS",s:"Le médecin a découvert une ___ suspecte au sein.",a:["grosseur"],d:["grossesse","grossièreté","grosseté"],t:1,e:"Piège : grosseur = masse, tumeur ; grossesse = état de femme enceinte."},
{c:"adj2n",b:"GRAND",s:"Il rêvait de la ___ passée de la France.",a:["grandeur"],d:["grandesse","grandissement","grandité"],t:1,e:"grand → grandeur. Piège : grandesse = dignité de grand d'Espagne."},
{c:"adj2n",b:"EXACT",s:"Il a vérifié l'___ des chiffres.",a:["exactitude"],d:["exaction","exacteté","exactité"],t:1,e:"exact → exactitude. Piège : exaction = extorsion, violence."},
{c:"adj2n",b:"AMBIGU",s:"L'___ de sa réponse laissa tout le monde perplexe.",a:["ambiguïté","ambigüité"],d:["ambiguité","ambigüeté","ambiguance"],t:1,e:"ambigu → ambiguïté (tréma, comme exiguïté)."},
{c:"adj2n",b:"NAÏF",s:"Sa ___ le rendait vulnérable.",a:["naïveté","naiveté"],d:["naïvité","naïfté","naïvesse"],t:1,e:"naïf → naïveté (f → v, -eté)."},
{c:"adj2n",b:"ROBUSTE",s:"La ___ de ce moteur est réputée.",a:["robustesse"],d:["robusteté","robustité","robustation"],e:"robuste → robustesse (-esse)."},
{c:"adj2n",b:"ÉTRANGE",s:"L'___ de la situation ne lui échappait pas.",a:["étrangeté"],d:["étrangeur","étrangerie","étrangéité"],e:"étrange → étrangeté (-eté)."},
{c:"v2n",b:"AGIR",s:"Il est temps de passer à l'___.",a:["action"],d:["agissement","agition","agissance"],t:1,e:"agir → action (radical latin act-). Piège : des agissements = manœuvres suspectes."},
{c:"v2n",b:"PRENDRE",s:"La ___ de la Bastille eut lieu le 14 juillet 1789.",a:["prise"],d:["prenade","prenure","prenement"],e:"prendre → prise (participe passé féminin substantivé)."},
{c:"v2n",b:"MOURIR",s:"La ___ du roi plongea le pays dans le deuil.",a:["mort"],d:["mouroir","mourance","mourement"],t:1,e:"mourir → mort (participe substantivé). Piège : mouroir = lieu où l'on attend la mort (péjoratif)."},
{c:"v2n",b:"PERDRE",s:"La ___ de son emploi l'a anéanti.",a:["perte"],d:["perdition","perdement","perdance"],t:1,e:"perdre → perte. Piège : perdition = ruine morale (courir à sa perdition)."},
{c:"v2n",b:"VENDRE",s:"La ___ de la maison a pris six mois.",a:["vente"],d:["vendange","vendition","vendage"],t:1,e:"vendre → vente. Piège : vendange = récolte du raisin."},
{c:"v2n",b:"ENTRER",s:"L'___ du musée est gratuite le dimanche.",a:["entrée"],d:["entrance","entrement","entrage"],t:1,e:"entrer → entrée (participe féminin substantivé). Entrance est de l'anglais."},
{c:"v2n",b:"CONQUÉRIR",s:"La ___ de l'Ouest américain s'acheva vers 1890.",a:["conquête"],d:["conquis","conquérance","conquéreté"],t:1,e:"conquérir → conquête (accent circonflexe)."},
{c:"v2n",b:"FUIR",s:"Les pompiers ont détecté une ___ de gaz.",a:["fuite"],d:["fuyard","fuyance","fuitage"],t:1,e:"fuir → fuite. Piège : fuyard = personne qui fuit."},
{c:"v2n",b:"ÉLIRE",s:"L'___ présidentielle aura lieu au printemps.",a:["élection"],d:["élu","élisement","élisance"],t:1,e:"élire → élection (radical latin lect-)."},
{c:"v2n",b:"DÉCEVOIR",s:"Sa ___ fut immense.",a:["déception"],d:["décevance","décevement","déceptivité"],t:1,e:"décevoir → déception (-cevoir → -ception, comme recevoir → réception)."},
{c:"v2n",b:"RECEVOIR",s:"La ___ du spectacle s'est élevée à mille euros.",a:["recette"],d:["réception","reçu","recevance"],t:1,e:"Piège : la recette = l'argent encaissé ; la réception = l'accueil ; un reçu = une quittance."},
{c:"v2n",b:"CONCEVOIR",s:"La ___ de ce bâtiment a demandé trois ans.",a:["conception"],d:["concevance","concevement","conceptualisme"],e:"concevoir → conception."},
{c:"v2n",b:"TENIR",s:"Une ___ correcte est exigée.",a:["tenue"],d:["teneur","tenure","tenance"],t:1,e:"tenir → tenue (vêtements, comportement). Pièges : teneur = contenu ; tenure = terme féodal."},
{c:"v2n",b:"VOIR",s:"De la terrasse, on a une ___ imprenable sur la baie.",a:["vue"],d:["voyance","visée","voiement"],t:1,e:"voir → vue. Piège : voyance = divination."},
{c:"v2n",b:"BATTRE",s:"Il sentait chaque ___ de son cœur.",a:["battement"],d:["battage","battue","batterie"],t:1,e:"battre → battement. Pièges : battage = publicité tapageuse ; battue = chasse."},
{c:"v2n",b:"COURIR",s:"La ___ a été annulée à cause de la pluie.",a:["course"],d:["courrier","courance","coureuse"],t:1,e:"courir → course. Piège : courrier = lettres."},
{c:"v2n",b:"CROIRE",s:"Ces ___ populaires remontent au Moyen Âge.",a:["croyances"],d:["crédulités","croyements","croitures"],t:1,e:"croire → croyance (radical croy-)."},
